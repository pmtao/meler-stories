<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 24px; }
.versions a, .versions span { font-size: 13px; padding: 5px 14px; border-radius: 999px; color: #fff; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, .5); background: rgba(8, 25, 40, .3); }
.versions a:hover { background: rgba(8, 25, 40, .55); }
.versions[hidden] { display: none; }
.versions .on { background: #fff; color: #123f55; border-color: #fff; font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }
/* 书末的「欣赏插曲」：全书插曲的播放列表 */
.songlist { margin: 40px 0 0; padding: 24px 18px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.songlist h3 { margin: 0 0 4px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 24px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; }
.songlist .sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
.btn-song { background: var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.songlist ol { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px; text-align: left; counter-reset: song; }
.songlist li button { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  text-align: left; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.songlist li button::before { counter-increment: song; content: counter(song); grid-row: span 2; color: var(--sea); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.songlist li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.songlist li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.songlist .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 进度条：深色是已播放，浅色是已经下载好的部分（--seek-bg 由 paintSeek() 按 audio.buffered 算），网络慢时一眼看出还要等多久 */
.seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 8px 0 6px; height: 18px;
  background: transparent; cursor: pointer; --seek-bg: var(--line); }
.seek::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border: 0;
  border-radius: 50%; background: var(--sea); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--sea);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
/* 缓冲中：播放键外圈转圈 */
.play { position: relative; }
.play::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent;
  border-top-color: var(--sea); border-right-color: var(--sea); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.buffering .play::after { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="versions" id="versions" hidden></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>

<script>

"c01-054": [362.146, 368.026], "c01-055": [368.376, 373.271], "c01-056": [374.121, 377.03], "c01-057": [377.38, 378.269], "c01-058": [379.119, 381.949], "c01-059": [382.299, 386.413], "c01-060": [386.763, 393.111], "c01-061": [393.461, 404.278], "c01-062": [405.128, 410.372], "c01-063": [411.222, 416.835], "c01-064": [417.685, 422.748], "c01-065": [423.098, 431.367], "c01-066": [431.717, 436.48], "c01-067": [437.33, 440.478], "c01-068": [441.328, 444.835], "c01-069": [445.185, 452.066], "c01-070": [452.916, 458.469], "song-horse": [459.669, 465.669], "song-horse-01": [465.669, 470.109], "song-horse-02": [470.109, 475.069], "song-horse-03": [475.069, 479.909], "song-horse-04": [479.909, 484.669], "song-horse-05": [494.029, 499.229], "song-horse-06": [499.229, 503.989], "song-horse-07": [503.989, 508.489], "song-horse-08": [508.489, 513.309]}, "blocks": [{"t": "img", "src": "images/01.webp?v=16c991aa64", "vid": "images/01.mp4?v=9177193a2e", "cap": "小岛伊萨卡", "n": 1}, {"t": "p", "s": [["c01-001", "很久很久以前，在希腊西边的大海上，有一座小小的岛，叫伊萨卡。"]]}, {"t": "p", "s": [["c01-002", "伊萨卡不大，岛上到处是石头和山坡，种不了多少麦子，可是山坡上长满了橄榄树。"], ["c01-003", "风一吹，银绿色的叶子翻来翻去，远远看去，就像山坡上涌着一层闪闪的波浪。"], ["c01-004", "草地上跑着山羊，脖子上的铃铛叮叮当当地响。"], ["c01-005", "海湾里停着一排渔船，清早出海，傍晚回来，船舱里装满了亮晶晶的小鱼。"]]}, {"t": "p", "s": [["c01-006", "岛上的人都说，这是世界上最可爱的地方。"]]}, {"t": "p", "s": [["c01-007", "伊萨卡的国王名叫奥德修斯。"]]}, {"t": "p", "s": [["c01-008", "奥德修斯不是最高大的英雄，也不是力气最大的英雄，可他是最聪明的那一个。"], ["c01-009", "他个子不高，肩膀宽宽的，胡子卷卷的。"], ["c01-010", "他说话慢条斯理，眼睛却总是亮晶晶的，好像随时都在想着什么好主意。"], ["c01-011", "遇到再难的事情，他都能想出办法来。"]]}, {"t": "img", "src": "images/02.webp?v=e612092eca", "vid": "images/02.mp4?v=1a80c9e729", "cap": "聪明的奥德修斯", "n": 2}, {"t": "p", "s": [["c01-012", "奥德修斯有一个美丽的妻子，名叫佩涅洛佩。"], ["c01-013", "她的眼睛像清晨的海水一样温柔，织的布是全岛最细、最软的。"], ["c01-014", "他们还有一个刚出生不久的儿子，名叫忒勒马科斯。"], ["c01-015", "每天傍晚，奥德修斯都会把小宝宝举得高高的，在王宫的院子里转圈，逗得他咯咯直笑。"]]}, {"t": "p", "s": [["c01-016", "那是奥德修斯一生中最快乐的日子。"]]}, {"t": "p", "s": [["c01-017", "可是有一天，从海对面传来一个消息：特洛伊的王子，把希腊斯巴达国王的妻子海伦抢走了。"], ["c01-018", "希腊所有的国王都发过誓，谁要是抢走了海伦，大家就一起去把她夺回来。"]]}, {"t": "p", "s": [["c01-019", "奥德修斯舍不得离开家。"]]}, {"t": "p", "s": [["c01-020", "出发的那天早晨，海上起了薄薄的雾。"], ["c01-021", "奥德修斯站在王宫的台阶上，抱着小小的忒勒马科斯，看了很久很久。"], ["c01-022", "他对佩涅洛佩说：“我答应过的事情，就一定要做到。"], ["c01-023", "等我打完仗，就马上回来。"], ["c01-024", "你要替我照顾好儿子，照顾好爸爸妈妈。”"]]}, {"t": "p", "s": [["c01-025", "佩涅洛佩含着眼泪，一直把他送到海边，看着他上了船。"], ["c01-026", "白色的船帆慢慢地升了起来，越来越小，最后变成了海天相接的地方一个小小的白点。"]]}, {"t": "p", "s": [["c01-027", "希腊的国王们带着一千多条大船，渡过大海，在特洛伊城外的沙滩上扎下了营帐，把特洛伊城团团围住。"]]}, {"t": "p", "s": [["c01-028", "特洛伊城真是一座坚固的城。"], ["c01-029", "城墙又高又厚，是用巨大的石头一块一块垒起来的，比最高的橄榄树还要高上好几倍。"], ["c01-030", "城门又大又结实，包着厚厚的铜皮，在太阳底下闪着冷冷的光。"], ["c01-031", "城墙上，特洛伊的士兵们日日夜夜地守着，希腊人一靠近，箭就像雨点一样落下来。"]]}, {"t": "p", "s": [["c01-032", "这一仗，打了整整十年，怎么也打不下来。"]]}, {"t": "p", "s": [["c01-033", "十年里，沙滩上的营帐换了一顶又一顶，勇士们的头发白了，铠甲也磨旧了。"], ["c01-034", "希腊的勇士们都累了，想家了。"], ["c01-035", "晚上，他们躺在营帐里，听着海浪一下一下地拍着沙滩，谁都在想自己家里的炉火和饭菜。"]]}, {"t": "p", "s": [["c01-036", "有一天，大家坐在海边的大营帐里，愁眉苦脸，谁也想不出办法。"]]}, {"t": "p", "s": [["c01-037", "这时，奥德修斯站了起来，他说：“既然我们打不进去，那就让特洛伊人自己把我们请进去吧。”"]]}, {"t": "p", "s": [["c01-038", "大家都愣住了。"]]}, {"t": "p", "s": [["c01-039", "奥德修斯说：“我们做一匹又高又大的木马，把最勇敢的勇士藏在木马的肚子里。"], ["c01-040", "然后，其他人都坐船离开，假装我们打不赢，回家去了。"], ["c01-041", "特洛伊人看见这匹大木马，一定会把它当成战利品，拉进城里去。”"]]}, {"t": "p", "s": [["c01-042", "希腊的国王们你看看我，我看看你，慢慢地，都拍起手来。"]]}, {"t": "img", "src": "images/03.webp?v=32b0bd7a76", "vid": "images/03.mp4?v=74633f03b0", "cap": "大木马", "n": 3}, {"t": "p", "s": [["c01-043", "工匠们砍来了山上最高的大树，锯呀，刨呀，钉呀，做了一匹比城墙还高的木马。"], ["c01-044", "木马有粗粗的腿、长长的脖子，还有一蓬用木条做的鬃毛，看上去威风极了。"], ["c01-045", "木马的肚子是空的，侧面有一扇小小的暗门。"]]}, {"t": "p", "s": [["c01-046", "夜深了，奥德修斯带着几十个勇士，悄悄地爬了进去，关上了门。"], ["c01-047", "木马的肚子里黑漆漆的，只能听见勇士们小小的呼吸声。"]]}, {"t": "p", "s": [["c01-048", "大军烧掉了营帐，坐上大船，划到了海边一座小岛的后面，躲了起来。"], ["c01-049", "船上的人谁也不说话，只是睁大眼睛，望着远处黑黑的城墙，一遍又一遍地想：特洛伊人会上当吗？"]]}, {"t": "p", "s": [["c01-050", "第二天早上，特洛伊人爬上城墙一看：海边的营帐都烧光了，希腊人的船一条也不见了，只剩下一匹孤零零的大木马站在沙滩上，影子长长地拖在地上。"]]}, {"t": "p", "s": [["c01-051", "城墙上的哨兵揉了揉眼睛，不敢相信。"], ["c01-052", "他们跑下城墙，大声地互相告诉：“快去看哪，十年了，海边第一次这么安静！"], ["c01-053", "没有号角，没有战鼓，连一根长矛也看不见！”"], ["c01-054", "老人们拄着拐杖，孩子们骑在大人的肩膀上，都挤到城门口来张望。"], ["c01-055", "海风吹过空空的沙滩，吹起一缕缕还没散尽的烟。"]]}, {"t": "p", "s": [["c01-056", "特洛伊人欢呼起来：“希腊人走啦！"], ["c01-057", "我们赢啦！”"]]}, {"t": "p", "s": [["c01-058", "他们打开城门，涌到了沙滩上。"], ["c01-059", "大家围着木马，又摸又看，七嘴八舌。"], ["c01-060", "最后，他们用粗粗的绳子拉着大木马，一路唱着歌，把它拉进了城。"], ["c01-061", "那天晚上，城里到处点着火把，全城的人都在大吃大喝，庆祝胜利，一直闹到半夜，才东倒西歪地睡着了。"]]}, {"t": "p", "s": [["c01-062", "整座城终于静了下来，只有风从街上吹过。"]]}, {"t": "p", "s": [["c01-063", "木马的肚子里，勇士们一动也不敢动，连大气也不敢出。"]]}, {"t": "p", "s": [["c01-064", "半夜里，奥德修斯轻轻推开暗门，放下绳梯。"], ["c01-065", "勇士们一个接一个地爬下来，脚尖点着地，悄悄地跑到城门口，拔掉门闩，打开了城门。"], ["c01-066", "早就躲在附近小岛后面的希腊大军，趁着夜色冲了进来。"]]}, {"t": "p", "s": [["c01-067", "十年的战争，就这样结束了。"]]}, {"t": "img", "src": "images/04.webp?v=1da354652f", "vid": "images/04.mp4?v=a2bc16c1d2", "cap": "扬帆回家", "n": 4}, {"t": "p", "s": [["c01-068", "天亮的时候，海面上升起了红红的太阳。"], ["c01-069", "奥德修斯站在沙滩上，望着东边的大海，心里想的只有一件事：回家。"]]}, {"t": "p", "s": [["c01-070", "可是他不知道，这条回家的路，他还要走整整十年。"]]}, {"t": "song", "title": "大木马", "head": "song-horse", "lines": [["song-horse-01", "十年的城墙攻不破"], ["song-horse-02", "奥德修斯想了一个好主意"], ["song-horse-03", "做一匹又高又大的木马"], ["song-horse-04", "勇士们悄悄藏在肚子里"], ["song-horse-05", "大木马，大木马"], ["song-horse-06", "特洛伊的城门为你开"], ["song-horse-07", "夜深人静的时候"], ["song-horse-08", "我们一起冲出来"]]}]}, {"title": "第二章　回家的船队", "head": "c02-h", "audio": "audio/ch02.m4a?v=1f71925ac9", "duration": 359.196, "times": {"c02-h": [0.0, 2.741], "c02-001": [3.741, 8.067], "c02-002": [8.917, 16.027], "c02-003": [16.377, 19.178], "c02-004": [19.528, 22.191], "c02-005": [23.041, 28.405], "c02-006": [29.255, 34.866], "c02-007": [35.216, 40.345], "c02-008": [40.695, 50.856], "c02-009": [51.706, 58.202], "c02-010": [59.052, 69.139], "c02-011": [69.989, 75.969], "c02-012": [76.319, 86.839], "c02-013": [87.189, 98.869], "c02-014": [99.719, 102.367], "c02-015": [103.217, 109.805], "c02-016": [110.155, 114.048], "c02-017": [114.898, 119.846], "c02-018": [120.196, 125.491], "c02-019": [126.341, 127.62], "c02-020": [127.97, 132.454], "c02-021": [133.304, 139.086], "c02-022": [139.436, 146.745], "c02-023": [147.095, 151.409], "c02-024": [151.759, 157.03], "c02-025": [157.88, 166.88], "c02-026": [167.23, 173.11], "c02-027": [173.96, 176.346], "c02-028": [176.696, 179.56], "c02-029": [180.41, 183.826], "c02-030": [184.176, 187.986], "c02-031": [188.336, 195.259], "c02-032": [195.609, 203.061], "c02-033": [203.911, 208.625], "c02-034": [208.975, 211.09], "c02-035": [211.44, 217.413], "c02-036": [218.263, 222.012], "c02-037": [222.362, 228.295], "c02-038": [228.645, 239.444], "c02-039": [240.294, 246.148], "c02-040": [246.498, 255.167], "c02-041": [255.517, 263.762], "c02-042": [264.612, 266.997], "c02-043": [267.347, 269.983], "c02-044": [270.833, 274.786], "c02-045": [275.136, 281.721], "c02-046": [282.071, 293.699], "c02-047": [294.049, 300.978], "c02-048": [301.828, 316.719], "c02-049": [317.57, 320.251], "c02-050": [320.601, 326.292], "c02-051": [326.642, 331.685], "c02-052": [332.035, 339.59], "c02-053": [339.94, 345.378], "c02-054": [346.228, 354.04], "c02-055": [354.89, 357.696]}, "blocks": [{"t": "p", "s": [["c02-001", "天亮了，海风吹得船帆呼呼作响。"]]}, {"t": "p", "s": [["c02-002", "奥德修斯带着十二条黑色的大船，船上坐满了伊萨卡的伙伴们。"], ["c02-003", "大家一边划桨，一边唱歌。"], ["c02-004", "十年了，终于可以回家了。"]]}, {"t": "p", "s": [["c02-005", "伙伴们说：“回到家，我要先抱抱我的孩子，他一定长得比我还高了！”"]]}, {"t": "p", "s": [["c02-006", "说这话的是一个叫波吕特斯的老水手，他的胡子都白了一半。"], ["c02-007", "他一边说，一边比画着，笑得眼角挤出一堆皱纹。"], ["c02-008", "旁边的小伙子们哄地笑了起来，有人伸手去摸他的白胡子，说：“你的孩子要是长得比你还高，那他得顶到天上去啦！”"]]}, {"t": "p", "s": [["c02-009", "还有人说：“我要喝一大碗妈妈煮的羊肉汤，再在自家的床上睡上三天三夜！”"]]}, {"t": "p", "s": [["c02-010", "奥德修斯站在船头，望着西边的大海，心里想着伊萨卡的山坡和橄榄树，想着佩涅洛佩和忒勒马科斯。"]]}, {"t": "p", "s": [["c02-011", "海水蓝得发亮，海鸥跟在船后面飞，翅膀擦着浪尖。"], ["c02-012", "夜里，星星多得数不清，伙伴们躺在船板上，听着船桨“哗啦、哗啦”的声音，一个个都笑着睡着了。"], ["c02-013", "奥德修斯却睡不着，他一遍又一遍地数着：离家这么多年，儿子应该长成大小伙子了，不知道他的卷发是不是像自己一样。"]]}, {"t": "p", "s": [["c02-014", "可是，大海并不平静。"]]}, {"t": "p", "s": [["c02-015", "船队先来到了一个叫伊斯马罗斯的地方，那里住着喀孔涅斯人。"], ["c02-016", "伙伴们说：“我们上岸去，弄点粮食和酒再走吧！”"]]}, {"t": "p", "s": [["c02-017", "他们冲进了喀孔涅斯人的城，抢了很多牛羊和美酒。"], ["c02-018", "奥德修斯对伙伴们说：“东西已经够了，我们快走吧，这里不能久留！”"]]}, {"t": "p", "s": [["c02-019", "可是伙伴们不听。"], ["c02-020", "他们在海边宰了牛羊，喝着美酒，一直吃喝到天黑。"]]}, {"t": "p", "s": [["c02-021", "他们在沙滩上点起了篝火，烤肉的香味飘得老远。"], ["c02-022", "有人唱歌，有人跳舞，有人干脆抱着酒坛子躺在沙子上，笑得直打滚。"], ["c02-023", "奥德修斯一个人站在船边，不停地望着远处的山。"], ["c02-024", "他有一种不好的感觉：山里，好像有什么东西在动。"]]}, {"t": "p", "s": [["c02-025", "第二天一早，喀孔涅斯人从山里叫来了一大群帮手，像春天的树叶一样多，向海边冲过来。"], ["c02-026", "伙伴们来不及逃跑，每条船上都有好几个人，再也没能回到船上。"]]}, {"t": "p", "s": [["c02-027", "剩下的人拼命地划船逃走了。"], ["c02-028", "大家心里又难过，又后悔。"]]}, {"t": "p", "s": [["c02-029", "船上安安静静的，没有人唱歌了。"], ["c02-030", "十二条船，每一条都少了六个伙伴。"], ["c02-031", "奥德修斯一条船一条船地点着人数，每点一次，心就沉一次。"], ["c02-032", "他站在海边，大声地呼喊着失去的伙伴们的名字，一共喊了三遍，才让船队离开。"]]}, {"t": "p", "s": [["c02-033", "奥德修斯对留下来的人说：“都怪我，没有早点把你们拉走。"], ["c02-034", "以后，我们不能再贪心了。”"], ["c02-035", "可是他不知道，这样的教训，大海还要让他们学很多很多遍。"]]}, {"t": "p", "s": [["c02-036", "没过多久，宙斯又刮起了一场大风暴。"], ["c02-037", "黑压压的乌云把大海和天空都遮住了，白天就像黑夜一样。"], ["c02-038", "船帆被大风撕成了三四片，大家只好收起船帆，拼命地划着桨，躲到一个海湾里，在那里躺了两天两夜。"]]}, {"t": "p", "s": [["c02-039", "浪头一个比一个高，像一座座移动的山，从船头压下来。"], ["c02-040", "水手们互相用绳子绑在一起，死死抓着船舷，冰冷的海水灌进嘴里，又咸又苦。"], ["c02-041", "他们躺在海湾的沙滩上，谁也没有力气说话，只是看着天，一直到风声慢慢小下去。"]]}, {"t": "p", "s": [["c02-042", "第三天，太阳出来了。"], ["c02-043", "他们修好了船帆，又出发了。"]]}, {"t": "p", "s": [["c02-044", "海面又变得像一块蓝绸子，亮晶晶的。"], ["c02-045", "大家一边补着帆，一边互相安慰，说最坏的事情已经过去了。"], ["c02-046", "奥德修斯把手搭在额头上，向远方望去，他想：只要绕过最南边的海角，再往北走几天，就能看见伊萨卡的山了。"], ["c02-047", "有一个年轻的水手高兴得吹起了口哨，口哨声在海面上飘得很远。"]]}, {"t": "p", "s": [["c02-048", "眼看就要绕过最南边的海角，就能一路向北回到伊萨卡了，可是，一阵猛烈的北风又刮了起来，把他们的船吹离了航线，吹向了谁也没有去过的、陌生的大海。"]]}, {"t": "p", "s": [["c02-049", "风一连刮了九天九夜。"], ["c02-050", "船像一片小小的树叶，被大浪抛上去，又摔下来。"], ["c02-051", "伙伴们躺在甲板上，舱里的粮食和水一天比一天少。"], ["c02-052", "到了第十天，风终于停了，可是眼前的大海，却是他们谁也不认识的大海。"], ["c02-053", "海水是奇怪的墨绿色，天上的星星，也都换了位置。"]]}, {"t": "p", "s": [["c02-054", "从这一天起，奥德修斯和他的伙伴们，就开始了漫长的、谁也想象不到的漂流。"]]}, {"t": "p", "s": [["c02-055", "这一漂，就是整整十年。"]]}]}, {"title": "第三章　众神的商量", "head": "c03-h", "audio": "audio/ch03.m4a?v=aceced0c42", "duration": 357.878, "times": {"c03-h": [0.0, 3.22], "c03-001": [4.22, 7.994], "c03-002": [8.844, 18.813], "c03-003": [19.163, 25.176], "c03-004": [26.026, 29.772], "c03-005": [30.122, 34.563], "c03-006": [35.413, 44.208], "c03-007": [44.558, 49.448], "c03-008": [49.798, 60.071], "c03-009": [60.921, 66.403], "c03-010": [66.753, 73.675], "c03-011": [74.525, 77.683], "c03-012": [78.033, 85.446], "c03-013": [86.296, 89.277], "c03-014": [89.627, 95.335], "c03-015": [95.685, 100.936], "c03-016": [101.286, 104.339], "c03-017": [104.689, 112.278], "c03-018": [113.128, 119.524], "c03-019": [119.874, 122.486], "c03-020": [122.836, 130.222], "c03-021": [130.572, 136.575], "c03-022": [136.925, 139.639], "c03-023": [139.989, 150.812], "c03-024": [151.162, 152.744], "c03-025": [153.594, 160.067], "c03-026": [160.417, 166.224], "c03-027": [166.574, 176.828], "c03-028": [177.178, 182.994], "c03-029": [183.344, 187.258], "c03-030": [187.608, 192.526], "c03-031": [192.876, 197.734], "c03-032": [198.584, 200.128], "c03-033": [200.478, 208.268], "c03-034": [208.618, 213.075], "c03-035": [213.425, 217.82], "c03-036": [218.67, 224.117], "c03-037": [224.467, 228.687], "c03-038": [229.537, 235.547], "c03-039": [235.897, 239.618], "c03-040": [240.468, 242.51], "c03-041": [242.86, 251.606], "c03-042": [252.456, 254.431], "c03-043": [254.781, 258.68], "c03-044": [259.03, 270.065], "c03-045": [270.915, 275.833], "c03-046": [276.183, 281.668], "c03-047": [282.018, 287.83], "c03-048": [288.68, 294.643], "c03-049": [295.493, 301.885], "c03-050": [302.735, 308.486], "c03-051": [308.836, 316.703], "c03-052": [317.553, 329.477], "c03-053": [329.827, 335.617], "c03-054": [336.467, 344.403], "c03-055": [344.753, 356.378]}, "blocks": [{"t": "img", "src": "images/05.webp?v=89dd41e59f", "vid": "images/05.mp4?v=ef38597a91", "cap": "奥林匹斯山", "n": 5}, {"t": "p", "s": [["c03-001", "天上的奥林匹斯山上，住着希腊的众神。"]]}, {"t": "p", "s": [["c03-002", "奥林匹斯山高高地耸立在云彩上面，那里没有风，没有雨，也没有雪，永远是晴朗的天空和明亮的阳光。"], ["c03-003", "众神住在金色的宫殿里，喝着香甜的仙酒，吃着神仙的食物。"]]}, {"t": "p", "s": [["c03-004", "众神之王宙斯，坐在最高的宝座上。"], ["c03-005", "他留着长长的白胡子，手里握着一道金色的闪电。"]]}, {"t": "p", "s": [["c03-006", "宫殿的大厅里，到处都摆着金色的椅子和金色的桌子，墙上挂着一排排发光的盾牌。"], ["c03-007", "小神仙们在大厅里跑来跑去，端着装满仙酒的金杯。"], ["c03-008", "天上的乐神弹着竖琴，缪斯女神们轮流唱着歌，歌声飘得很远很远，连山脚下的人们都能听见。"]]}, {"t": "p", "s": [["c03-009", "这一天，众神都来到了宙斯的宫殿，只有海神波塞冬不在。"], ["c03-010", "他到很远很远的、太阳升起的地方去了，那里的人正在为他献上一百头牛。"]]}, {"t": "p", "s": [["c03-011", "智慧女神雅典娜走到宙斯面前。"], ["c03-012", "她戴着金色的头盔，手里拿着长矛和盾牌，灰色的眼睛像大海一样明亮。"]]}, {"t": "p", "s": [["c03-013", "雅典娜是宙斯最喜欢的女儿。"], ["c03-014", "她是从宙斯的脑袋里一下子蹦出来的，生下来就穿着铠甲。"], ["c03-015", "她最聪明，也最爱帮助那些勇敢又会动脑筋的人。"], ["c03-016", "奥德修斯就是她最喜欢的一个。"], ["c03-017", "在特洛伊的战场上，好多次，都是她悄悄地站在奥德修斯的身边，给他出主意。"]]}, {"t": "img", "src": "images/06.webp?v=5d40534e63", "vid": "images/06.mp4?v=52f6d21b8b", "cap": "雅典娜求情", "n": 6}, {"t": "p", "s": [["c03-018", "雅典娜说：“父亲，我的心为聪明的奥德修斯难过得都要碎了。"], ["c03-019", "别的英雄打完仗，早就回到了家。"], ["c03-020", "只有他，离开家已经快二十年了，到现在还被困在大海中间的一座小岛上。"], ["c03-021", "岛上的仙女卡吕普索不让他走，想让他永远留下来做她的丈夫。"], ["c03-022", "可是奥德修斯一心只想回家。"], ["c03-023", "他天天坐在海边，望着家乡的方向流眼泪，说他哪怕只能看见家乡屋顶上冒出来的炊烟，也就心满意足了。"], ["c03-024", "父亲，您就让他回家吧！”"]]}, {"t": "p", "s": [["c03-025", "宙斯摸着白胡子说：“我的孩子，我怎么会忘记奥德修斯呢？"], ["c03-026", "他是天下最聪明的人，也一直恭恭敬敬地给我们献祭。"], ["c03-027", "可是海神波塞冬还在生他的气，因为奥德修斯弄瞎了波塞冬的儿子，独眼巨人波吕斐摩斯的眼睛。"], ["c03-028", "所以波塞冬让他在海上漂来漂去，怎么也回不了家。"], ["c03-029", "不过，现在波塞冬到远方去了。"], ["c03-030", "我们就趁这个机会，帮奥德修斯回家吧。"], ["c03-031", "波塞冬一个人，总不能和所有的神作对。”"]]}, {"t": "p", "s": [["c03-032", "雅典娜高兴极了。"], ["c03-033", "她说：“那就请您派神使赫尔墨斯，到卡吕普索的小岛上去，告诉她，必须放奥德修斯回家。"], ["c03-034", "我呢，先去伊萨卡，看看他的儿子忒勒马科斯。"], ["c03-035", "我要让那个孩子鼓起勇气，出海去寻找父亲的消息。”"]]}, {"t": "p", "s": [["c03-036", "宙斯点点头，说：“就照你说的办吧，我的孩子。"], ["c03-037", "去吧，别让我们的好朋友再等下去了。”"]]}, {"t": "p", "s": [["c03-038", "宙斯又转过头，看着大厅里的众神，说：“你们都听见了吗？"], ["c03-039", "谁也不许再偷偷地帮波塞冬的忙。”"]]}, {"t": "p", "s": [["c03-040", "众神一个一个地点头。"], ["c03-041", "阿波罗拨了一下琴弦，赫拉整理了一下裙子，战神阿瑞斯重重地哼了一声，没有说话。"]]}, {"t": "p", "s": [["c03-042", "众神都安静地听着。"], ["c03-043", "大厅里只有金杯轻轻碰在一起的声音。"], ["c03-044", "谁都知道，波塞冬的怒气不是一天两天能消的，这一次，奥德修斯能不能回家，还要看他自己的勇气和聪明。"]]}, {"t": "p", "s": [["c03-045", "说完，雅典娜穿上她那双金光闪闪的鞋子。"], ["c03-046", "这双鞋能带着她像风一样，飞过大海，飞过陆地。"], ["c03-047", "她拿起长矛，从奥林匹斯山顶一跃而下，向伊萨卡飞去。"]]}, {"t": "p", "s": [["c03-048", "众神望着她远去的方向，大厅里的竖琴又轻轻地响了起来。"]]}, {"t": "p", "s": [["c03-049", "山下的云海翻滚着，被她的鞋尖带起一圈圈金色的涟漪。"]]}, {"t": "p", "s": [["c03-050", "她出门的时候，大厅里的小神仙们都停下手里的活，目送她远去。"], ["c03-051", "赫拉轻轻地笑了一下，对旁边的人说：“这个孩子，只要是她认定的事，就一定要做成。”"]]}, {"t": "p", "s": [["c03-052", "她飞过白色的云海，飞过绿色的山谷，飞过一座座小岛，海面上的渔夫抬起头，只看见天上一道闪光，像流星一样划了过去。"], ["c03-053", "不一会儿，伊萨卡那些银绿色的橄榄树，就出现在她的脚下了。"]]}, {"t": "p", "s": [["c03-054", "她落在伊萨卡的王宫门口，轻轻理了理头发，想了想，决定变成一位白头发的老船长。"], ["c03-055", "她知道，要让一个难过的孩子重新鼓起勇气，最好的办法，不是吓唬他，而是像一位朋友那样，慢慢地跟他说话。"]]}]}, {"title": "第四章　王宫里的求婚者", "head": "c04-h", "audio": "audio/ch04.m4a?v=72ca81dc3d", "duration": 351.518, "times": {"c04-h": [0.0, 4.06], "c04-001": [5.06, 8.391], "c04-002": [8.741, 14.342], "c04-003": [15.192, 19.511], "c04-004": [19.861, 26.699], "c04-005": [27.049, 32.895], "c04-006": [33.245, 40.751], "c04-007": [41.601, 44.662], "c04-008": [45.512, 52.447], "c04-009": [52.797, 58.583], "c04-010": [59.433, 69.665], "c04-011": [70.015, 76.73], "c04-012": [77.58, 81.418], "c04-013": [81.768, 85.299], "c04-014": [85.649, 88.346], "c04-015": [89.196, 96.018], "c04-016": [96.368, 101.297], "c04-017": [101.647, 111.921], "c04-018": [112.771, 122.862], "c04-019": [123.212, 130.07], "c04-020": [130.42, 137.096], "c04-021": [137.946, 143.273], "c04-022": [143.623, 149.546], "c04-023": [150.396, 152.148], "c04-024": [152.498, 157.468], "c04-025": [158.318, 163.475], "c04-026": [163.825, 170.033], "c04-027": [170.883, 174.557], "c04-028": [174.907, 179.03], "c04-029": [179.38, 190.461], "c04-030": [191.311, 199.458], "c04-031": [200.308, 204.839], "c04-032": [205.189, 215.083], "c04-033": [215.433, 218.704], "c04-034": [219.554, 224.51], "c04-035": [224.86, 227.852], "c04-036": [228.702, 232.887], "c04-037": [233.737, 234.971], "c04-038": [235.321, 245.935], "c04-039": [246.785, 253.407], "c04-040": [253.757, 263.336], "c04-041": [264.186, 269.902], "c04-042": [270.252, 273.226], "c04-043": [274.076, 279.941], "c04-044": [280.291, 284.761], "c04-045": [285.611, 295.88], "c04-046": [296.23, 300.257], "c04-047": [301.107, 304.213], "c04-048": [304.563, 308.702], "c04-049": [309.552, 318.305], "c04-050": [318.655, 325.494], "c04-051": [326.344, 332.545], "c04-052": [332.895, 340.109], "c04-053": [340.459, 350.018]}, "blocks": [{"t": "img", "src": "images/07.webp?v=fee6f2c89f", "vid": "images/07.mp4?v=b1a9ae5aab", "cap": "吵闹的王宫", "n": 7}, {"t": "p", "s": [["c04-001", "伊萨卡的王宫，建在一座小山坡上。"], ["c04-002", "白色的石头墙，高高的大门，院子里有一棵老橄榄树。"]]}, {"t": "p", "s": [["c04-003", "站在王宫的大门口，就能看见山脚下的海湾。"], ["c04-004", "清早的时候，渔船一条一条地出海，帆影在海面上排成长长的一行。"], ["c04-005", "院子里的老橄榄树又粗又歪，据说，它比奥德修斯的年纪还大。"], ["c04-006", "以前，奥德修斯常常坐在树下，一边削木头，一边给小儿子讲故事。"]]}, {"t": "p", "s": [["c04-007", "可是现在，王宫里乱糟糟的。"]]}, {"t": "p", "s": [["c04-008", "一百多个年轻的贵族，从伊萨卡和附近的各个岛上跑来，赖在王宫里不走。"], ["c04-009", "他们穿着华丽的袍子，头发上抹着香油，一个个神气活现。"]]}, {"t": "p", "s": [["c04-010", "他们嘴里说着要娶王后，其实谁也不真心喜欢她，他们想要的，只是奥德修斯的王位、奥德修斯的金子和牛羊。"], ["c04-011", "他们常常一边吃喝，一边互相比较，看谁的袍子最漂亮，看谁的马最壮。"]]}, {"t": "p", "s": [["c04-012", "他们说：“奥德修斯早就死在海上了，被鱼吃掉了！"], ["c04-013", "王后佩涅洛佩，你必须从我们中间选一个人结婚！"], ["c04-014", "谁娶了你，谁就是伊萨卡的新国王。”"]]}, {"t": "p", "s": [["c04-015", "大厅里，到处都是脏盘子和啃剩的骨头，地上洒着打翻了的酒。"], ["c04-016", "猎狗们趴在桌子底下，抢着吃他们扔下的残渣。"], ["c04-017", "女仆们每天都要擦桌子、洗盘子，累得直不起腰来，可是求婚者们连一句谢谢也不说，还常常欺负她们。"]]}, {"t": "p", "s": [["c04-018", "这些求婚者，每天都要杀王宫里最肥的牛、最肥的羊、最肥的猪，喝王宫地窖里最好的美酒。"], ["c04-019", "他们吃饱了就唱歌、跳舞、掷骰子、扔铁饼，一直闹到半夜。"], ["c04-020", "奥德修斯的牛羊，一天比一天少，王宫的仓库，一天比一天空。"]]}, {"t": "img", "src": "images/08.webp?v=493728ca02", "vid": "images/08.mp4?v=f3f67ed0a4", "cap": "角落里的少年", "n": 8}, {"t": "p", "s": [["c04-021", "奥德修斯的儿子忒勒马科斯，已经是一个高高的少年了。"], ["c04-022", "他长着和父亲一样的深棕色卷发，一样亮晶晶的眼睛。"]]}, {"t": "p", "s": [["c04-023", "他从来没有见过父亲。"], ["c04-024", "父亲出门打仗的时候，他还是个躺在摇篮里的小婴儿。"]]}, {"t": "p", "s": [["c04-025", "家里的老仆人们说，他笑起来的样子，和父亲一模一样。"], ["c04-026", "他只是常常听妈妈和老奶妈讲，他的父亲是一个多么了不起的人。"]]}, {"t": "p", "s": [["c04-027", "他最喜欢的，是父亲留下的那把大弓。"], ["c04-028", "大弓挂在库房的墙上，已经落满了灰。"], ["c04-029", "有时候，忒勒马科斯会偷偷地爬上去，用手指轻轻摸一摸那条粗粗的弓弦，想象父亲当年是怎样拉开它的。"]]}, {"t": "p", "s": [["c04-030", "忒勒马科斯坐在大厅的角落里，看着那些吵吵闹闹的求婚者，心里又难过又生气。"]]}, {"t": "p", "s": [["c04-031", "他的面前也摆着一盘肉，可是他一口也咽不下去。"], ["c04-032", "旁边的一个求婚者，一边啃着骨头，一边把油腻腻的手往他的椅子背上擦，笑嘻嘻地说：“小王子，怎么不吃啊？”"], ["c04-033", "忒勒马科斯没有理他，把脸转到了一边。"]]}, {"t": "p", "s": [["c04-034", "他想：“要是父亲能突然回来，把这些人统统赶出去，那该多好啊！"], ["c04-035", "可是我只有一个人，怎么赶得走这么多人呢？”"]]}, {"t": "p", "s": [["c04-036", "就在这时，王宫门口来了一位客人。"]]}, {"t": "p", "s": [["c04-037", "那是雅典娜。"], ["c04-038", "她变成了一个叫门特斯的老船长，白头发，白胡子，披着深蓝色的斗篷，手里拄着一根长矛，站在院子门口。"]]}, {"t": "p", "s": [["c04-039", "他的斗篷边上沾着一点点海水的痕迹，好像刚刚走了很远的路。"], ["c04-040", "他安静地站在门口，看着大厅里乱糟糟的一切，灰色的眼睛里，有一点点愤怒，又有一点点心疼。"]]}, {"t": "p", "s": [["c04-041", "大厅里的求婚者们正忙着掷骰子，谁也没有理会门口的客人。"], ["c04-042", "只有忒勒马科斯一眼就看见了他。"]]}, {"t": "p", "s": [["c04-043", "忒勒马科斯心里很不好意思：怎么能让客人站在门口没人招呼呢？"], ["c04-044", "他赶紧站起来，走过去握住客人的手，接过他的长矛。"]]}, {"t": "p", "s": [["c04-045", "忒勒马科斯从小就听妈妈说过：不管是谁，从远方来的客人，都是宙斯送来的，一定要好好招待。"], ["c04-046", "哪怕他自己心里再难过，也不能让客人受冷落。"]]}, {"t": "p", "s": [["c04-047", "忒勒马科斯说：“欢迎你，远方的客人！"], ["c04-048", "快请进来，先吃点东西，然后再告诉我你需要什么帮助。”"]]}, {"t": "p", "s": [["c04-049", "他把客人领进大厅，请他坐在一张远离求婚者的、铺着软垫的椅子上，自己坐在旁边的小凳上。"], ["c04-050", "女仆端来了金壶和银盆，请客人洗手，又摆上了面包、烤肉和美酒。"]]}, {"t": "p", "s": [["c04-051", "金壶里的水，清清凉凉地倒在银盆里，发出叮咚的声音。"], ["c04-052", "桌子上摆满了烤得香喷喷的肉，还有一小堆一小堆的葡萄和无花果。"], ["c04-053", "客人不慌不忙地洗了手，坐下来，轻轻地点点头，好像在说：这个孩子，教养真好。"]]}]}, {"title": "第五章　老船长的话", "head": "c05-h", "audio": "audio/ch05.m4a?v=892db46c95", "duration": 344.114, "times": {"c05-h": [0.0, 2.514], "c05-001": [3.514, 6.492], "c05-002": [7.342, 15.52], "c05-003": [15.87, 21.344], "c05-004": [21.694, 26.378], "c05-005": [27.228, 31.556], "c05-006": [31.906, 40.276], "c05-007": [40.626, 47.102], "c05-008": [47.952, 57.028], "c05-009": [57.378, 59.935], "c05-010": [60.285, 63.49], "c05-011": [63.84, 65.337], "c05-012": [65.687, 67.52], "c05-013": [67.87, 68.676], "c05-014": [69.026, 70.463], "c05-015": [71.313, 79.423], "c05-016": [80.273, 87.092], "c05-017": [87.442, 90.953], "c05-018": [91.303, 93.772], "c05-019": [94.122, 101.069], "c05-020": [101.919, 109.132], "c05-021": [109.482, 115.498], "c05-022": [116.348, 125.071], "c05-023": [125.421, 130.589], "c05-024": [130.939, 138.48], "c05-025": [138.83, 145.639], "c05-026": [145.989, 152.816], "c05-027": [153.166, 156.046], "c05-028": [156.896, 166.577], "c05-029": [166.927, 170.768], "c05-030": [171.118, 176.708], "c05-031": [177.058, 186.533], "c05-032": [187.383, 190.349], "c05-033": [190.699, 195.113], "c05-034": [195.463, 198.122], "c05-035": [198.972, 200.711], "c05-036": [201.061, 207.846], "c05-037": [208.696, 211.524], "c05-038": [211.874, 214.14], "c05-039": [214.99, 220.556], "c05-040": [224.138, 226.048], "c05-041": [226.398, 230.903], "c05-042": [231.253, 236.671], "c05-043": [237.521, 239.664], "c05-044": [240.014, 244.546], "c05-045": [244.896, 253.203], "c05-046": [254.053, 257.381], "c05-047": [257.731, 266.31], "c05-048": [267.16, 276.313], "c05-049": [276.663, 284.514], "c05-050": [285.364, 292.202], "c05-051": [292.552, 298.409], "c05-052": [299.259, 305.031], "c05-053": [305.381, 307.895], "c05-054": [308.245, 311.672], "c05-055": [312.522, 314.686], "c05-056": [315.036, 317.411], "c05-057": [317.761, 324.91], "c05-058": [325.76, 329.363], "c05-059": [329.713, 335.146], "c05-060": [335.496, 342.614]}, "blocks": [{"t": "p", "s": [["c05-001", "这时，求婚者们也吃起饭来。"]]}, {"t": "p", "s": [["c05-002", "大厅里的火把噼噼啪啪地响，烤肉的油滴在炭火上，冒起一阵阵香气。"], ["c05-003", "王宫里的歌手菲弥俄斯，抱着竖琴，被他们逼着唱歌。"], ["c05-004", "他唱的，正是希腊英雄们从特洛伊回家的故事。"]]}, {"t": "p", "s": [["c05-005", "菲弥俄斯是个瘦瘦的、眼神温和的老人。"], ["c05-006", "他不喜欢给这些吵吵闹闹的人唱歌，可是他必须唱，因为他们有刀有剑，谁也惹不起。"], ["c05-007", "他把竖琴抱在怀里，手指一动，琴弦就像泉水一样响了起来。"]]}, {"t": "p", "s": [["c05-008", "忒勒马科斯凑到客人身边，小声地说：“客人，您看见了吧，这些人整天在我家大吃大喝，吃的都是别人的东西。"], ["c05-009", "他们以为我的父亲早就死在海上了。"], ["c05-010", "要是他能回来，这些人一定会吓得拼命逃跑。"], ["c05-011", "可是他再也回不来了。"], ["c05-012", "请您告诉我，您是谁？"], ["c05-013", "从哪里来？"], ["c05-014", "是不是认识我的父亲？”"]]}, {"t": "p", "s": [["c05-015", "他的声音又低又快，眼睛却一直盯着大厅另一头吵吵闹闹的人，生怕被他们听见。"]]}, {"t": "img", "src": "images/09.webp?v=3ad028f5eb", "vid": "images/09.mp4?v=788ad21187", "cap": "老船长来了", "n": 9}, {"t": "p", "s": [["c05-016", "老船长说：“我叫门特斯，是一个船长，我的父亲和你的祖父是老朋友。"], ["c05-017", "孩子，我告诉你，你的父亲还活着！"], ["c05-018", "他被困在大海里的一座小岛上。"], ["c05-019", "不过，他是一个聪明的人，就算被铁链锁住，他也能想出办法回家的。”"]]}, {"t": "p", "s": [["c05-020", "忒勒马科斯睁大了眼睛，心怦怦直跳，几乎不敢相信自己听到的话。"], ["c05-021", "他张了张嘴，想问许多问题，可是一时间，一句话也说不出来。"]]}, {"t": "p", "s": [["c05-022", "老船长又仔细地看了看忒勒马科斯，说：“你长得可真像奥德修斯，头发像，眼睛也像。"], ["c05-023", "孩子，你已经长大了，不能再像小孩子一样坐在这里发愁了。"], ["c05-024", "明天，你就召集伊萨卡的人们开大会，当着大家的面，叫求婚者们回自己的家去。"], ["c05-025", "然后，你准备一条好船，带上二十个水手，出海去寻找你父亲的消息。"], ["c05-026", "先到皮洛斯去问问老国王涅斯托尔，再到斯巴达去问问国王墨涅拉俄斯。"], ["c05-027", "他们都是和你父亲一起打过仗的人。”"]]}, {"t": "p", "s": [["c05-028", "他又说：“要是你听到你父亲死了的消息，就回来给他堆起一座高高的坟，办一场隆重的葬礼，让你的妈妈改嫁。"], ["c05-029", "要是听到你父亲还活着，你就再等一年。"], ["c05-030", "可是不管怎么样，最后你都要想办法，把这些求婚者赶出你的家。"], ["c05-031", "你别忘了，特洛伊的英雄俄瑞斯忒斯，年纪也不比你大多少，可他为父亲报了仇，全世界的人都夸他。”"]]}, {"t": "p", "s": [["c05-032", "忒勒马科斯说：“谢谢您，客人。"], ["c05-033", "您就像父亲对儿子一样，对我说了这么多好话，我一定会记住的。"], ["c05-034", "您再多住几天吧，我还要送您一件礼物。”"]]}, {"t": "p", "s": [["c05-035", "他的心里暖暖的。"], ["c05-036", "自从父亲走了以后，从来没有人这样认真地、像对一个大人那样，跟他说过话。"]]}, {"t": "p", "s": [["c05-037", "老船长说：“不用了，我还要赶路。"], ["c05-038", "礼物等我下次来的时候再送吧。”"]]}, {"t": "img", "src": "images/10.webp?v=e9e370f725", "vid": "images/10.mp4?v=86200a9823", "cap": "变成鸟飞走了", "n": 10}, {"t": "p", "s": [["c05-039", "说完，老船长变成一只鸟，从屋顶的天窗飞了出去。"]]}, {"t": "p", "s": [["c05-040", "忒勒马科斯惊呆了。"], ["c05-041", "他这才明白，刚才的客人，原来是一位女神。"], ["c05-042", "他的心里一下子充满了勇气，好像父亲就站在他的身边。"]]}, {"t": "p", "s": [["c05-043", "求婚者们一点也没有发现。"], ["c05-044", "他们还在大声地说笑，把骰子扔得叮叮当当响。"], ["c05-045", "只有忒勒马科斯，一动也不动地望着天窗，望着蓝蓝的天空，心里怦怦地跳。"]]}, {"t": "p", "s": [["c05-046", "就在这时，楼上传来了一阵哭声。"], ["c05-047", "王后佩涅洛佩听见了楼下的歌声，带着两个女仆走下楼来，用面纱遮着脸，站在大厅的柱子旁边。"]]}, {"t": "p", "s": [["c05-048", "她的脚步轻轻的，一步一步走下楼梯，白色的裙摆拖在石头台阶上，几乎没有声音。"], ["c05-049", "大厅里闹哄哄的人们看见她，都安静了一小会儿，有几个人偷偷地整理了一下自己的袍子。"]]}, {"t": "p", "s": [["c05-050", "佩涅洛佩含着眼泪说：“菲弥俄斯，你会唱那么多好听的歌，为什么偏偏要唱这一首呢？"], ["c05-051", "每次听到它，我的心都像被刀割一样，因为我的丈夫，到现在还没有回来。”"]]}, {"t": "p", "s": [["c05-052", "忒勒马科斯走过去，温和而坚定地对妈妈说：“妈妈，别怪歌手。"], ["c05-053", "他只是唱出了大家心里想的事情。"], ["c05-054", "您还是回楼上去吧，这里的事情，交给我来处理。”"]]}, {"t": "p", "s": [["c05-055", "佩涅洛佩吃惊地看着儿子。"], ["c05-056", "她发现，儿子长大了。"], ["c05-057", "她没有说话，回到楼上，又哭了很久，直到雅典娜让她甜甜地睡着了。"]]}, {"t": "p", "s": [["c05-058", "她走上楼梯的时候，回头看了一眼。"], ["c05-059", "儿子站在大厅里，背挺得直直的，侧脸那么像奥德修斯。"], ["c05-060", "她的眼睛一下子又湿了，可是这一次，眼泪里面，多了一点点暖暖的东西。"]]}]}, {"title": "第六章　织不完的寿衣", "head": "c06-h", "audio": "audio/ch06.m4a?v=f6d90e19b2", "duration": 358.664, "times": {"c06-h": [0.0, 2.476], "c06-001": [3.476, 8.017], "c06-002": [8.867, 14.759], "c06-003": [15.609, 20.388], "c06-004": [20.738, 29.036], "c06-005": [29.386, 34.959], "c06-006": [35.809, 44.789], "c06-007": [45.639, 48.392], "c06-008": [48.742, 55.212], "c06-009": [56.062, 59.573], "c06-010": [59.923, 68.354], "c06-011": [68.704, 72.464], "c06-012": [73.314, 76.831], "c06-013": [77.681, 86.041], "c06-014": [86.391, 92.114], "c06-015": [92.464, 100.841], "c06-016": [101.191, 104.676], "c06-017": [105.526, 110.27], "c06-018": [111.12, 115.176], "c06-019": [115.526, 116.053], "c06-020": [116.403, 117.119], "c06-021": [117.469, 119.619], "c06-022": [119.969, 123.726], "c06-023": [124.576, 131.992], "c06-024": [132.342, 137.244], "c06-025": [141.815, 147.977], "c06-026": [148.327, 156.347], "c06-027": [156.697, 160.996], "c06-028": [161.846, 172.234], "c06-029": [173.084, 179.227], "c06-030": [180.077, 184.399], "c06-031": [184.749, 188.621], "c06-032": [188.971, 195.343], "c06-033": [195.693, 196.582], "c06-034": [197.432, 199.933], "c06-035": [200.283, 205.075], "c06-036": [205.925, 208.598], "c06-037": [208.948, 212.263], "c06-038": [212.613, 217.858], "c06-039": [218.708, 223.471], "c06-040": [223.821, 230.888], "c06-041": [231.238, 236.174], "c06-042": [237.024, 240.848], "c06-043": [241.198, 247.416], "c06-044": [247.766, 256.018], "c06-045": [256.868, 262.495], "c06-046": [263.345, 273.863], "c06-047": [274.213, 280.693], "c06-048": [281.543, 288.765], "c06-049": [289.615, 295.341], "c06-050": [295.691, 305.093], "c06-051": [305.443, 308.585], "c06-052": [309.435, 314.578], "c06-053": [314.928, 320.904], "c06-054": [321.754, 324.429], "c06-055": [324.779, 327.15], "c06-056": [328.0, 331.061], "c06-057": [331.411, 335.417], "c06-058": [336.267, 341.314], "c06-059": [341.664, 344.614], "c06-060": [344.964, 350.042], "c06-061": [350.392, 357.164]}, "blocks": [{"t": "img", "src": "images/11.webp?v=dd61cbe1be", "vid": "images/11.mp4?v=57e0fb7246", "cap": "织布的王后", "n": 11}, {"t": "p", "s": [["c06-001", "王后佩涅洛佩，是一个又美丽、又聪明的女人。"]]}, {"t": "p", "s": [["c06-002", "她不爱说话，可是只要她开口，大家都愿意安静地听。"]]}, {"t": "p", "s": [["c06-003", "她的头发又黑又长，皮肤像牛奶一样白。"], ["c06-004", "她织的布，图案是全希腊最好看的，上面有花，有鸟，有大海和船。"], ["c06-005", "伊萨卡的女人们都说，佩涅洛佩的手指，是女神给的。"]]}, {"t": "p", "s": [["c06-006", "奥德修斯走了快二十年，别人都说他死了，可是佩涅洛佩一直相信，丈夫总有一天会回来。"]]}, {"t": "p", "s": [["c06-007", "求婚者们天天逼她改嫁。"], ["c06-008", "她不想答应，可是她只有一个人，儿子又还小，怎么对付得了这么多人呢？"]]}, {"t": "p", "s": [["c06-009", "她也曾经想过，要不要躲到别的地方去。"], ["c06-010", "可是她舍不得这座王宫，因为这里的每一块石头、每一棵树，都是奥德修斯留下的。"], ["c06-011", "她要替他守着，一直守到他回来的那一天。"]]}, {"t": "p", "s": [["c06-012", "为了拖住求婚者，她想了一个办法。"]]}, {"t": "p", "s": [["c06-013", "她把求婚者们叫到一起，对他们说：“年轻人，你们既然说奥德修斯已经死了，那我也不再拦着你们。"], ["c06-014", "可是请你们耐心等一等，我要先给奥德修斯的老父亲拉厄尔忒斯织一件寿衣。"], ["c06-015", "他已经很老很老了，要是哪一天他离开了人世，连一件像样的寿衣都没有，伊萨卡的女人们都会笑话我的。"], ["c06-016", "等我把这件寿衣织完了，再从你们中间选一个人结婚。”"]]}, {"t": "p", "s": [["c06-017", "求婚者们想了想，觉得这话也有道理，就答应了。"]]}, {"t": "p", "s": [["c06-018", "他们还互相开着玩笑：“反正一件寿衣能织多长时间？"], ["c06-019", "一个月？"], ["c06-020", "两个月？"], ["c06-021", "到时候，王后还是我们的。”"], ["c06-022", "说完，大家哈哈大笑，继续喝酒去了。"]]}, {"t": "p", "s": [["c06-023", "从那天起，佩涅洛佩白天坐在一台高大的织布机前，一梭一梭地织布。"], ["c06-024", "织布机咔嗒咔嗒地响着，一整天都不停。"]]}, {"t": "p", "s": [["c06-025", "她挑了最细的白线，织出一朵朵小小的花边，针脚整整齐齐。"], ["c06-026", "求婚者们有时走过来看一看，笑着说：“王后，您织得真好看，真是我们伊萨卡最能干的女人。”"], ["c06-027", "她只是低下头，浅浅地笑一笑，什么也不说。"]]}, {"t": "img", "src": "images/12.webp?v=968deadbcf", "vid": "images/12.mp4?v=1961f59712", "cap": "夜里拆布", "n": 12}, {"t": "p", "s": [["c06-028", "可是到了夜里，等求婚者们都睡着了，她就悄悄地点起火把，走到织布机前，把白天织好的布，一根线一根线地拆掉。"]]}, {"t": "p", "s": [["c06-029", "拆完了，她就坐在织布机前，望着窗外的大海，一个人轻轻地哭。"]]}, {"t": "p", "s": [["c06-030", "窗外，月亮把海面照成了一条银色的路。"], ["c06-031", "风带着咸咸的海水味，吹动了她的头发。"], ["c06-032", "她把脸靠在冰冷的织布机架子上，小声地说：“奥德修斯，你听得见吗？"], ["c06-033", "我还在等你。”"]]}, {"t": "p", "s": [["c06-034", "第二天，她又从头开始织。"], ["c06-035", "就这样，白天织，晚上拆，晚上拆，白天织。"]]}, {"t": "p", "s": [["c06-036", "一个月过去了，布还没有织好。"], ["c06-037", "一年过去了，布还是没有织好。"], ["c06-038", "整整三年过去了，那件寿衣，还是只有窄窄的一条。"]]}, {"t": "p", "s": [["c06-039", "有时候，佩涅洛佩会在织布的间隙，抬头看一看窗外。"], ["c06-040", "王宫的院子里，奥德修斯种的那棵小橄榄树，已经长得比她还高了。"], ["c06-041", "她就想，等树结出第一颗果子的时候，他会不会就回来了？"]]}, {"t": "p", "s": [["c06-042", "春天来了，山坡上开满了小小的白花。"], ["c06-043", "秋天来了，橄榄成熟了，掉在草地上，被羊群踩得扁扁的。"], ["c06-044", "一年又一年，求婚者们的胡子长了，佩涅洛佩的眼角也悄悄地多了几道细细的纹路。"]]}, {"t": "p", "s": [["c06-045", "求婚者们觉得奇怪，可是谁也没有想到其中的秘密。"]]}, {"t": "p", "s": [["c06-046", "老奶妈欧律克勒娅有时候看见王后的眼睛红红的，心疼极了，可是她知道这是王后的秘密，一个字也不说。"], ["c06-047", "她只是每天早上，悄悄地在王后的桌子上放一杯热热的羊奶。"]]}, {"t": "img", "src": "images/13.webp?v=06ba601951", "vid": "images/13.mp4?v=e3fbe8f59d", "cap": "秘密被发现了", "n": 13}, {"t": "p", "s": [["c06-048", "到了第四年，王宫里一个不忠心的女仆，偷偷地把这个秘密告诉了求婚者。"]]}, {"t": "p", "s": [["c06-049", "那个女仆喜欢和求婚者们说笑，贪图他们送的小首饰和小礼物。"], ["c06-050", "她有一次夜里起来喝水，看见织布房里亮着火光，就偷偷地趴在门缝里，看见了不该看的一切。"], ["c06-051", "第二天，她就迫不及待地跑去告了密。"]]}, {"t": "p", "s": [["c06-052", "那天夜里，求婚者们举着火把，闯进了织布的房间。"], ["c06-053", "他们看见佩涅洛佩正在一根线一根线地拆布，气得大喊大叫。"]]}, {"t": "p", "s": [["c06-054", "求婚者们说：“原来你一直在骗我们！"], ["c06-055", "马上把布织完，再也不许拖了！”"]]}, {"t": "p", "s": [["c06-056", "佩涅洛佩只好把那件寿衣织完了。"], ["c06-057", "现在，她再也想不出别的办法拖下去了。"]]}, {"t": "p", "s": [["c06-058", "寿衣摊在织布机上，又长又白，在火把底下闪着光。"], ["c06-059", "佩涅洛佩看着它，心里空空的。"], ["c06-060", "这是她用整整三年的夜晚、整整三年的眼泪换来的东西。"], ["c06-061", "现在，它成了她最后一点点的希望，也成了她最大的难题。"]]}]}, {"title": "第七章　伊萨卡的大会", "head": "c07-h", "audio": "audio/ch07.m4a?v=4d34ba6203", "duration": 348.056, "times": {"c07-h": [0.0, 2.717], "c07-001": [3.717, 9.38], "c07-002": [10.23, 12.778], "c07-003": [13.128, 16.072], "c07-004": [16.422, 20.926], "c07-005": [21.276, 23.678], "c07-006": [24.528, 32.24], "c07-007": [32.59, 38.658], "c07-008": [39.508, 44.792], "c07-009": [45.142, 47.45], "c07-010": [47.8, 60.674], "c07-011": [61.524, 63.091], "c07-012": [63.441, 71.476], "c07-013": [72.326, 76.024], "c07-014": [76.374, 78.34], "c07-015": [78.69, 86.748], "c07-016": [87.597, 92.358], "c07-017": [92.708, 102.161], "c07-018": [102.511, 106.898], "c07-019": [107.748, 111.521], "c07-020": [112.371, 117.186], "c07-021": [117.536, 125.858], "c07-022": [126.208, 129.78], "c07-023": [130.63, 134.901], "c07-024": [135.251, 137.1], "c07-025": [137.95, 143.222], "c07-026": [143.572, 144.919], "c07-027": [145.269, 147.313], "c07-028": [147.663, 151.851], "c07-029": [152.201, 160.674], "c07-030": [161.024, 163.547], "c07-031": [164.397, 168.822], "c07-032": [169.172, 173.337], "c07-033": [174.187, 177.895], "c07-034": [178.245, 184.807], "c07-035": [185.157, 189.715], "c07-036": [190.565, 198.681], "c07-037": [199.031, 200.781], "c07-038": [201.131, 205.123], "c07-039": [205.473, 210.861], "c07-040": [211.211, 214.707], "c07-041": [215.557, 220.843], "c07-042": [221.193, 227.36], "c07-043": [228.21, 232.263], "c07-044": [232.613, 234.483], "c07-045": [235.333, 242.453], "c07-046": [243.303, 246.771], "c07-047": [247.121, 260.263], "c07-048": [261.113, 267.03], "c07-049": [267.38, 274.259], "c07-050": [275.109, 281.038], "c07-051": [281.388, 284.068], "c07-052": [284.418, 286.109], "c07-053": [286.459, 291.962], "c07-054": [292.312, 293.534], "c07-055": [294.384, 302.935], "c07-056": [303.285, 310.29], "c07-057": [311.14, 318.238], "c07-058": [318.588, 322.144], "c07-059": [322.994, 324.544], "c07-060": [324.894, 328.693], "c07-061": [329.543, 335.1], "c07-062": [335.45, 339.829], "c07-063": [340.179, 346.556]}, "blocks": [{"t": "p", "s": [["c07-001", "第二天，太阳刚刚升起，忒勒马科斯就从床上跳了起来。"]]}, {"t": "p", "s": [["c07-002", "这一夜，他几乎没有睡着。"], ["c07-003", "他一会儿想，要是大家都不理我怎么办？"], ["c07-004", "一会儿又想，父亲像我这么大的时候，会怎么做？"], ["c07-005", "想着想着，天就亮了。"]]}, {"t": "img", "src": "images/14.webp?v=0ddad87287", "vid": "images/14.mp4?v=e697a40b33", "cap": "少年开大会", "n": 14}, {"t": "p", "s": [["c07-006", "他穿好衣服，背上宝剑，系好凉鞋，走出房间，看上去就像一位年轻的天神。"], ["c07-007", "他叫传令官们到城里去，召集伊萨卡所有的人到广场上开大会。"]]}, {"t": "p", "s": [["c07-008", "传令官们敲着铜锣，一条街一条街地喊：“开大会啦！"], ["c07-009", "王子叫大家都到广场上去！”"], ["c07-010", "卖橄榄油的老头放下了担子，纺线的妇女放下了纺锤，在海边补网的渔夫们，也把渔网搭在了肩膀上，一起向广场走去。"]]}, {"t": "p", "s": [["c07-011", "人们很快就到齐了。"], ["c07-012", "伊萨卡已经快二十年没有开过大会了，大家都很好奇，不知道是谁召集的，要说什么事情。"]]}, {"t": "p", "s": [["c07-013", "忒勒马科斯手里拿着长矛，走进广场。"], ["c07-014", "两条猎狗跟在他的身后。"], ["c07-015", "雅典娜在他身上洒下了光彩，所有的人都望着他，觉得他和他的父亲一模一样。"]]}, {"t": "p", "s": [["c07-016", "广场上的石头长椅，一排一排，已经坐满了人。"], ["c07-017", "老年人拄着拐杖坐在最前面，年轻人站在后面，孩子们爬上了旁边的矮墙，伸长了脖子往里看。"], ["c07-018", "太阳照在白色的石头上，晃得人睁不开眼。"]]}, {"t": "p", "s": [["c07-019", "他走到父亲以前坐的石头座位上，坐了下来。"]]}, {"t": "p", "s": [["c07-020", "那把石头座位已经很旧了，边上长出了绿绿的青苔。"], ["c07-021", "忒勒马科斯小心地坐上去，手放在石头的扶手上，觉得凉凉的，好像摸到了父亲的手。"], ["c07-022", "人们都不说话了，连风都轻轻的。"]]}, {"t": "p", "s": [["c07-023", "一位白头发的老人站起来问：“是谁召集我们开会？"], ["c07-024", "是不是有什么好消息？”"]]}, {"t": "p", "s": [["c07-025", "忒勒马科斯站起来，大声说：“老人家，召集大家的人就是我。"], ["c07-026", "我没有听到什么好消息。"], ["c07-027", "我要说的，是我家里的灾难。"], ["c07-028", "我失去了我的父亲，他是你们的国王，像父亲一样爱护你们。"], ["c07-029", "更糟糕的是，这些求婚者天天赖在我家，杀我家的牛羊，喝我家的酒，用不了多久，我的家就要被他们吃光了！"], ["c07-030", "伊萨卡的人们，你们为什么不管一管？”"]]}, {"t": "p", "s": [["c07-031", "说着说着，他忍不住哭了起来，把长矛扔在了地上。"], ["c07-032", "广场上的人们都很同情他，一下子安静了。"]]}, {"t": "p", "s": [["c07-033", "有几位老奶奶悄悄地用围裙擦起了眼睛。"], ["c07-034", "一个抱着孩子的年轻妈妈小声地对旁边的人说：“这孩子，太可怜了。”"], ["c07-035", "可是，却没有一个人站出来，替他说一句话。"]]}, {"t": "p", "s": [["c07-036", "求婚者的头领安提诺俄斯站了起来，他说：“忒勒马科斯，你这个说大话的家伙，怎么能怪我们？"], ["c07-037", "要怪就怪你的妈妈！"], ["c07-038", "她骗了我们整整三年，白天织布，晚上拆布。"], ["c07-039", "你叫她回娘家去，让她的父亲给她选一个丈夫，嫁出去，我们自然就走了。"], ["c07-040", "她要是一直不嫁，我们就一直在你家吃下去！”"]]}, {"t": "p", "s": [["c07-041", "他说话的时候，脸涨得通红，手在空中挥来挥去。"], ["c07-042", "旁边的几个求婚者也跟着大声地起哄，有人还吹起了口哨。"]]}, {"t": "p", "s": [["c07-043", "忒勒马科斯说：“我怎么能把生我养我的妈妈赶出家门呢？"], ["c07-044", "我请求众神来评一评理！”"]]}, {"t": "p", "s": [["c07-045", "他举起双手，朝着蓝天，大声地说：“宙斯啊，要是我说的是真话，请你给我一个预兆吧！”"]]}, {"t": "p", "s": [["c07-046", "就在这时，天上飞来了两只老鹰。"], ["c07-047", "它们从山顶上飞下来，在广场上空盘旋，扇动着翅膀，用锋利的眼睛盯着求婚者们，然后用爪子互相抓着，飞过城市，向东边飞走了。"]]}, {"t": "p", "s": [["c07-048", "老鹰的翅膀张开来，比一个人还宽，在地上投下一大片黑影。"], ["c07-049", "它们叫了几声，那叫声又尖又亮，让广场上所有的人都不由自主地抬起了头。"]]}, {"t": "p", "s": [["c07-050", "一位会看鸟儿占卜的老人站起来，他叫哈利忒尔塞斯。"], ["c07-051", "他说：“伊萨卡的人们，听我说！"], ["c07-052", "这是一个预兆。"], ["c07-053", "奥德修斯离家不远了，他正在给这些求婚者准备灾难。"], ["c07-054", "你们快停手吧！”"]]}, {"t": "p", "s": [["c07-055", "老人的白胡子在风里飘着，他的声音虽然不大，可是广场上的每一个人，都听得清清楚楚。"], ["c07-056", "有几位老人点了点头，可是年轻的求婚者们，只是把脖子一仰，哼了一声。"]]}, {"t": "p", "s": [["c07-057", "另一个求婚者欧律马科斯大笑起来，他说：“老头子，回家去给你的孩子们占卜吧！"], ["c07-058", "天上飞的鸟多得很，难道每一只都有什么意思吗？”"]]}, {"t": "p", "s": [["c07-059", "大会就这样散了。"], ["c07-060", "求婚者们又回到王宫，继续大吃大喝。"]]}, {"t": "p", "s": [["c07-061", "人们一个一个地走了，广场上只剩下忒勒马科斯一个人。"], ["c07-062", "风吹过空荡荡的石头座位，吹起他的衣角。"], ["c07-063", "他望着天上的云，心里想：既然没有人帮我，我就自己去找父亲。"]]}]}, {"title": "第八章　悄悄出海", "head": "c08-h", "audio": "audio/ch08.m4a?v=2fd065daf2", "duration": 355.437, "times": {"c08-h": [0.0, 3.115], "c08-001": [4.115, 10.006], "c08-002": [10.856, 14.658], "c08-003": [15.508, 24.494], "c08-004": [24.844, 28.77], "c08-005": [29.12, 34.371], "c08-006": [35.221, 41.184], "c08-007": [41.534, 46.049], "c08-008": [46.899, 49.248], "c08-009": [49.598, 57.748], "c08-010": [58.598, 64.974], "c08-011": [65.324, 72.054], "c08-012": [72.404, 80.46], "c08-013": [81.31, 87.173], "c08-014": [87.523, 92.974], "c08-015": [93.824, 97.899], "c08-016": [98.249, 105.179], "c08-017": [105.529, 107.569], "c08-018": [108.419, 118.342], "c08-019": [119.192, 122.305], "c08-020": [123.155, 133.236], "c08-021": [133.586, 140.347], "c08-022": [140.697, 147.608], "c08-023": [148.458, 156.217], "c08-024": [156.567, 166.86], "c08-025": [167.71, 174.242], "c08-026": [174.592, 177.39], "c08-027": [177.74, 179.173], "c08-028": [179.523, 183.242], "c08-029": [183.592, 185.125], "c08-030": [185.975, 189.218], "c08-031": [190.068, 194.503], "c08-032": [194.853, 201.79], "c08-033": [202.14, 206.913], "c08-034": [207.263, 209.849], "c08-035": [210.699, 214.979], "c08-036": [215.329, 217.204], "c08-037": [218.054, 219.802], "c08-038": [220.152, 223.967], "c08-039": [224.817, 228.275], "c08-040": [228.625, 243.224], "c08-041": [244.074, 250.929], "c08-042": [251.779, 259.097], "c08-043": [259.947, 266.911], "c08-044": [267.261, 272.226], "c08-045": [273.076, 278.194], "c08-046": [278.544, 282.994], "c08-047": [283.344, 286.509], "c08-048": [287.359, 292.353], "c08-049": [292.703, 304.373], "c08-050": [305.223, 311.188], "c08-051": [311.538, 323.41], "c08-052": [324.26, 329.304], "c08-053": [329.654, 332.08], "c08-054": [332.93, 338.524], "c08-055": [338.874, 345.445], "c08-056": [345.795, 353.937]}, "blocks": [{"t": "p", "s": [["c08-001", "忒勒马科斯一个人走到海边，用海水洗了洗手，向雅典娜祈祷。"]]}, {"t": "p", "s": [["c08-002", "远处的山顶上，晨光一点一点地爬了下来。"]]}, {"t": "p", "s": [["c08-003", "天还没有亮透，海边的沙滩上冷冷清清的，只有几只海鸟在浪花里找小虫子吃。"], ["c08-004", "海水凉凉的，一点一点漫过他的脚背。"], ["c08-005", "他蹲下去，捧起一捧海水，洗了洗手，又洗了洗脸。"]]}, {"t": "p", "s": [["c08-006", "忒勒马科斯说：“女神啊，昨天您来到我家，叫我出海去寻找父亲的消息。"], ["c08-007", "可是求婚者们处处为难我，伊萨卡的人们也不帮我，我该怎么办呢？”"]]}, {"t": "p", "s": [["c08-008", "雅典娜马上就来了。"], ["c08-009", "这一次，她变成了奥德修斯的老朋友门托尔，样子、声音都和门托尔一模一样。"]]}, {"t": "p", "s": [["c08-010", "门托尔说：“忒勒马科斯，你要是有你父亲的一半勇气，就什么也不用怕。"], ["c08-011", "别管那些求婚者，他们又愚蠢、又没有良心，根本不知道灾难就要来了。"], ["c08-012", "你回家去准备干粮，我到城里去给你找一条最好的快船，再找二十个愿意跟你出海的水手。”"]]}, {"t": "p", "s": [["c08-013", "他的声音沉稳、温暖，让忒勒马科斯心里一下子踏实了。"], ["c08-014", "忒勒马科斯点点头，手心里都是汗，可是眼睛亮亮的。"]]}, {"t": "p", "s": [["c08-015", "忒勒马科斯回到王宫，偷偷地走进了地窖。"], ["c08-016", "地窖里堆着金子、铜器、衣服，还有一坛一坛的橄榄油和美酒。"], ["c08-017", "这些都是父亲留下来的。"]]}, {"t": "p", "s": [["c08-018", "他一件一件地看过去，心里慢慢涌上一股暖暖的东西：这里的每一样东西，父亲都曾经亲手摸过。"]]}, {"t": "img", "src": "images/15.webp?v=0ee0ece99d", "vid": "images/15.mp4?v=a2b59c84f6", "cap": "奶妈的叮嘱", "n": 15}, {"t": "p", "s": [["c08-019", "管地窖的，是老奶妈欧律克勒娅。"]]}, {"t": "p", "s": [["c08-020", "地窖又深又凉，台阶一级一级地通向地下，石头墙上挂着一盏小油灯，照出一团黄黄的亮。"], ["c08-021", "她是奥德修斯小时候的奶妈，也是忒勒马科斯小时候的奶妈。"], ["c08-022", "她已经很老很老了，头发全白了，可还是每天守在地窖门口。"]]}, {"t": "p", "s": [["c08-023", "她的手背上全是皱纹，腰也弯了，可是她记得地窖里每一坛酒的位置。"], ["c08-024", "每次忒勒马科斯路过，她都会塞给他一块蜂蜜饼，小声地说：“孩子，吃吧，别让那些人看见。”"]]}, {"t": "p", "s": [["c08-025", "忒勒马科斯说：“好奶妈，请你给我装十二坛最好的酒，再装二十袋磨好的大麦粉。"], ["c08-026", "今天晚上，我要出海去打听父亲的消息。"], ["c08-027", "千万别告诉我的妈妈。"], ["c08-028", "等过了十一二天，或者她问起我来，你再告诉她。"], ["c08-029", "我不想让她哭坏了眼睛。”"]]}, {"t": "p", "s": [["c08-030", "老奶妈一听，伤心地哭了起来。"]]}, {"t": "p", "s": [["c08-031", "老奶妈说：“我的好孩子，你怎么会有这样的念头？"], ["c08-032", "你是你妈妈唯一的孩子，大海那么宽，那么危险，你为什么要去？"], ["c08-033", "等你一走，这些求婚者就会想办法害你。"], ["c08-034", "孩子，留在家里吧！”"]]}, {"t": "p", "s": [["c08-035", "忒勒马科斯说：“好奶妈，别担心，这是女神的主意。"], ["c08-036", "你先答应我，不告诉妈妈。”"]]}, {"t": "p", "s": [["c08-037", "老奶妈只好发了誓。"], ["c08-038", "她一边给他装好面粉和酒，一边抹着眼泪。"]]}, {"t": "p", "s": [["c08-039", "皮袋子一个接一个地装满了，沉甸甸的。"], ["c08-040", "老奶妈把最软的一块面饼放在最上面，又在袋子口上，悄悄地系了一个小小的、红色的布结，说：“带着它，让它保佑你平平安安地回来。”"]]}, {"t": "p", "s": [["c08-041", "天黑以后，雅典娜让求婚者们个个都打起了瞌睡，早早地回家睡觉去了。"]]}, {"t": "img", "src": "images/16.webp?v=676f777edf", "vid": "images/16.mp4?v=f44cf0cdc8", "cap": "月夜出海", "n": 16}, {"t": "p", "s": [["c08-042", "夜空里一颗星也没有，只有一弯细细的月牙，挂在黑沉沉的山尖上。"]]}, {"t": "p", "s": [["c08-043", "他们喝得东倒西歪，有的趴在桌子上，有的靠在柱子旁，一个个都打起了呼噜。"], ["c08-044", "女仆们踮着脚尖，小心地收拾着盘子，生怕吵醒他们。"]]}, {"t": "p", "s": [["c08-045", "忒勒马科斯带着干粮，悄悄地溜出了王宫，来到海边。"], ["c08-046", "快船已经准备好了，二十个水手正在等着他。"], ["c08-047", "门托尔站在船尾，向他招手。"]]}, {"t": "p", "s": [["c08-048", "水手们竖起桅杆，拉紧绳子，升起了白色的船帆。"], ["c08-049", "雅典娜给他们送来了一阵顺风，船帆被风吹得鼓鼓的，船头劈开紫色的海浪，在月光下的海面上，向远方驶去。"]]}, {"t": "p", "s": [["c08-050", "水手们都是伊萨卡的年轻小伙子，有的比忒勒马科斯还小。"], ["c08-051", "他们有的是渔夫的儿子，有的是牧羊人的弟弟，大家一边拉着绳子，一边小声地说笑，好像不是去冒险，而是去赶一场热闹的集市。"]]}, {"t": "p", "s": [["c08-052", "忒勒马科斯站在船头，回头望着越来越远的伊萨卡。"], ["c08-053", "他心里想：“父亲，我来找你了。”"]]}, {"t": "p", "s": [["c08-054", "岸上的灯火一点一点地变小，最后变成了几颗淡淡的星。"], ["c08-055", "浪花轻轻地拍着船头，月光在海面上铺了一条长长的亮路。"], ["c08-056", "风吹着他的头发，他第一次觉得，大海那么大，可是自己，一点也不害怕。"]]}]}, {"title": "第九章　皮洛斯的老国王", "head": "c09-h", "audio": "audio/ch09.m4a?v=eb5e9ebad6", "duration": 391.192, "times": {"c09-h": [0.0, 2.831], "c09-001": [3.831, 6.415], "c09-002": [6.765, 14.849], "c09-003": [15.699, 18.245], "c09-004": [18.596, 29.969], "c09-005": [30.819, 37.505], "c09-006": [37.855, 43.304], "c09-007": [43.654, 49.96], "c09-008": [50.81, 56.771], "c09-009": [57.121, 60.939], "c09-010": [61.789, 65.319], "c09-011": [65.669, 72.244], "c09-012": [72.594, 79.53], "c09-013": [80.38, 85.401], "c09-014": [85.751, 91.237], "c09-015": [92.087, 96.827], "c09-016": [97.677, 104.389], "c09-017": [105.239, 110.517], "c09-018": [110.867, 117.521], "c09-019": [117.871, 124.077], "c09-020": [124.927, 128.471], "c09-021": [128.821, 137.799], "c09-022": [138.149, 144.183], "c09-023": [145.033, 156.289], "c09-024": [157.139, 160.342], "c09-025": [161.192, 168.622], "c09-026": [168.972, 177.43], "c09-027": [178.28, 182.578], "c09-028": [182.928, 184.299], "c09-029": [184.649, 185.923], "c09-030": [186.273, 191.179], "c09-031": [192.029, 196.402], "c09-032": [196.752, 199.652], "c09-033": [200.002, 202.699], "c09-034": [203.049, 206.572], "c09-035": [206.922, 208.925], "c09-036": [209.275, 212.254], "c09-037": [213.104, 216.065], "c09-038": [216.415, 221.325], "c09-039": [221.675, 226.588], "c09-040": [226.938, 233.58], "c09-041": [234.43, 243.366], "c09-042": [244.216, 248.694], "c09-043": [249.044, 256.317], "c09-044": [257.167, 260.319], "c09-045": [260.669, 268.43], "c09-046": [268.78, 271.361], "c09-047": [272.211, 274.378], "c09-048": [274.728, 280.062], "c09-049": [280.412, 287.574], "c09-050": [287.924, 296.919], "c09-051": [297.769, 302.836], "c09-052": [303.186, 310.621], "c09-053": [310.971, 314.747], "c09-054": [315.097, 319.035], "c09-055": [319.885, 322.58], "c09-056": [322.93, 325.395], "c09-057": [326.245, 331.276], "c09-058": [332.126, 333.885], "c09-059": [334.235, 341.51], "c09-060": [341.86, 346.012], "c09-061": [346.362, 350.345], "c09-062": [350.695, 355.125], "c09-063": [355.975, 364.379], "c09-064": [364.729, 367.911], "c09-065": [368.261, 374.037], "c09-066": [374.887, 380.876], "c09-067": [381.226, 389.692]}, "blocks": [{"t": "p", "s": [["c09-001", "船在海上航行了一整夜。"], ["c09-002", "第二天早上，太阳从大海里升起来，把天空染成了金色，他们来到了皮洛斯。"]]}, {"t": "p", "s": [["c09-003", "皮洛斯的海滩上热闹极了。"], ["c09-004", "九群人整整齐齐地坐在沙滩上，每群五百人，每群面前都摆着九头黑色的公牛，他们正在向海神献祭。"]]}, {"t": "p", "s": [["c09-005", "烤肉的烟一缕一缕地飘上天空，香味顺着海风飘出去老远。"], ["c09-006", "祭司们一边把牛腿肉放在火上烤，一边唱着古老的歌。"], ["c09-007", "孩子们在人群中钻来钻去，手里抓着刚烤好的肉，吃得满嘴是油。"]]}, {"t": "p", "s": [["c09-008", "忒勒马科斯从来没有见过这么多人，也从来没有和国王说过话。"], ["c09-009", "他有点害怕，站在船边不敢走过去。"]]}, {"t": "img", "src": "images/17.webp?v=c50e576d79", "vid": "images/17.mp4?v=124b4bc5df", "cap": "老国王涅斯托尔", "n": 17}, {"t": "p", "s": [["c09-010", "门托尔说：“忒勒马科斯，别害羞。"], ["c09-011", "你出海就是为了打听父亲的消息，现在就去问问老国王涅斯托尔吧。"], ["c09-012", "你心里想说的话，自然会说出来；你想不到的话，众神也会帮你想到。”"]]}, {"t": "p", "s": [["c09-013", "他轻轻地拍了拍忒勒马科斯的肩膀，掌心又厚又暖。"], ["c09-014", "远处的牛叫声和海浪声混在一起，让这个早晨显得特别明亮。"]]}, {"t": "p", "s": [["c09-015", "忒勒马科斯这才鼓起勇气，跟着门托尔走上沙滩。"]]}, {"t": "p", "s": [["c09-016", "海鸥在他的头顶盘旋，发出长长的叫声，好像也在给他加油。"]]}, {"t": "p", "s": [["c09-017", "他的脚踩在软软的沙子上，每一步都觉得特别重。"], ["c09-018", "他一边走，一边在心里一遍一遍地念着想好的话，可是越念越乱。"], ["c09-019", "走到人群边上的时候，他的手心里全是汗，连呼吸都变得小心翼翼。"]]}, {"t": "p", "s": [["c09-020", "老国王涅斯托尔正和儿子们坐在一起。"], ["c09-021", "他是希腊年纪最大的国王，白胡子一直垂到胸口，可是他的眼睛还像年轻人一样明亮。"], ["c09-022", "他打过的仗，比谁都多；他讲的故事，比谁都长。"]]}, {"t": "p", "s": [["c09-023", "老国王的小儿子珀西斯特拉托斯第一个跑过来，拉住客人的手，请他们坐在柔软的羊皮上，又递给他们一杯金杯里的美酒。"]]}, {"t": "p", "s": [["c09-024", "等客人吃饱了，老国王才开口问话。"]]}, {"t": "p", "s": [["c09-025", "这是希腊人的老规矩：不管客人是谁，先让他吃饱喝足，才可以问他的名字。"], ["c09-026", "涅斯托尔的儿子们站在旁边，一个个又高又壮，安安静静地看着这两位远方的客人。"]]}, {"t": "p", "s": [["c09-027", "涅斯托尔说：“客人，现在可以问问你们了。"], ["c09-028", "你们是谁？"], ["c09-029", "从哪里来？"], ["c09-030", "是做生意的商人，还是到处游荡的海盗？”"]]}, {"t": "p", "s": [["c09-031", "忒勒马科斯站起来说：“老国王，我们从伊萨卡来。"], ["c09-032", "我是奥德修斯的儿子忒勒马科斯。"], ["c09-033", "我到这里来，是想打听我父亲的消息。"], ["c09-034", "人们都说，您和他一起在特洛伊打了十年的仗。"], ["c09-035", "请您告诉我，他是死是活？"], ["c09-036", "您不要因为可怜我，就说好听的话骗我。”"]]}, {"t": "p", "s": [["c09-037", "老国王一听，眼睛一下子湿了。"], ["c09-038", "他说：“孩子，你让我想起了那些苦日子。"], ["c09-039", "在特洛伊打仗的时候，没有一个人的主意比得上你的父亲。"], ["c09-040", "我和他从来都是一条心，在大会上说话的时候，我们的意见总是一样的。"]]}, {"t": "p", "s": [["c09-041", "“真奇怪，你说话的样子，和他一模一样，谁也想不到一个年轻人能说出这么得体的话。"]]}, {"t": "p", "s": [["c09-042", "“可是，打完仗以后，我们就分开了。"], ["c09-043", "我带着我的船，一路顺风回到了家，别人的事情，我就不知道了。”"]]}, {"t": "p", "s": [["c09-044", "老国王给他讲了许多英雄回家的故事。"], ["c09-045", "有的人很快就回到了家，有的人在海上遇到了风暴，有的人回家以后又遇到了不幸。"], ["c09-046", "讲着讲着，天就黑了。"]]}, {"t": "p", "s": [["c09-047", "他讲到了阿伽门农国王。"], ["c09-048", "那位总指挥回家以后，被自己的堂弟和不忠的妻子害死了。"], ["c09-049", "他的儿子俄瑞斯忒斯长大以后，为父亲报了仇，从此被全希腊的人称赞。"], ["c09-050", "老国王一边讲，一边看着忒勒马科斯，意思再清楚不过：孩子，你也要像他那样勇敢。"]]}, {"t": "p", "s": [["c09-051", "涅斯托尔说：“孩子，你去斯巴达问问墨涅拉俄斯吧。"], ["c09-052", "他在海上漂了好多年，去过很多很远的地方，是最后一个回到家的人。"], ["c09-053", "说不定，他听到过你父亲的消息。"], ["c09-054", "我让我的儿子驾着马车，陪你一起去。”"]]}, {"t": "p", "s": [["c09-055", "门托尔说：“好，就这样办吧。"], ["c09-056", "我先回船上去，照顾水手们。”"]]}, {"t": "p", "s": [["c09-057", "说完，门托尔变成了一只海鹰，展开翅膀飞走了。"]]}, {"t": "p", "s": [["c09-058", "所有的人都惊呆了。"], ["c09-059", "老国王拉住忒勒马科斯的手说：“孩子，你一定会成为一个了不起的人。"], ["c09-060", "你这么年轻，就有女神陪在身边。"], ["c09-061", "刚才那位，就是宙斯的女儿雅典娜呀！"], ["c09-062", "在特洛伊的时候，她就最喜欢你的父亲。”"]]}, {"t": "p", "s": [["c09-063", "老国王立刻叫人牵来一头一岁的小母牛，让金匠把它的角包上金子，向雅典娜献祭。"], ["c09-064", "火焰升起来，香气飘向天空。"], ["c09-065", "忒勒马科斯站在火边，心里默默地说：女神，谢谢你。"]]}, {"t": "p", "s": [["c09-066", "那天晚上，忒勒马科斯睡在老国王宫殿里一张漂亮的床上。"], ["c09-067", "第二天一早，老国王的小儿子驾起了两匹快马拉的马车，载着他，向斯巴达奔去。"]]}]}, {"title": "第十章　斯巴达的王宫", "head": "c10-h", "audio": "audio/ch10.m4a?v=a60f281985", "duration": 345.909, "times": {"c10-h": [0.0, 3.045], "c10-001": [4.045, 6.634], "c10-002": [6.984, 12.758], "c10-003": [13.608, 22.078], "c10-004": [22.428, 28.583], "c10-005": [28.933, 36.18], "c10-006": [37.03, 49.513], "c10-007": [50.363, 53.631], "c10-008": [53.981, 58.259], "c10-009": [58.609, 69.477], "c10-010": [70.327, 80.881], "c10-011": [81.731, 91.285], "c10-012": [92.135, 98.671], "c10-013": [99.021, 104.722], "c10-014": [105.072, 109.175], "c10-015": [109.525, 112.689], "c10-016": [113.039, 115.624], "c10-017": [115.974, 120.674], "c10-018": [121.024, 126.924], "c10-019": [127.774, 134.791], "c10-020": [135.641, 140.369], "c10-021": [140.719, 145.408], "c10-022": [145.758, 150.856], "c10-023": [151.706, 156.581], "c10-024": [156.931, 163.31], "c10-025": [163.66, 167.9], "c10-026": [168.75, 176.802], "c10-027": [177.152, 179.98], "c10-028": [180.83, 183.342], "c10-029": [183.692, 189.626], "c10-030": [190.476, 200.879], "c10-031": [201.729, 207.318], "c10-032": [207.668, 210.742], "c10-033": [211.592, 215.553], "c10-034": [215.903, 221.51], "c10-035": [221.86, 225.473], "c10-036": [226.323, 229.515], "c10-037": [229.865, 237.06], "c10-038": [237.41, 243.123], "c10-039": [243.473, 247.154], "c10-040": [248.004, 250.965], "c10-041": [251.815, 255.943], "c10-042": [256.293, 265.712], "c10-043": [266.562, 275.808], "c10-044": [276.158, 279.135], "c10-045": [279.485, 283.939], "c10-046": [284.289, 288.646], "c10-047": [289.496, 292.217], "c10-048": [292.567, 300.134], "c10-049": [300.484, 306.459], "c10-050": [306.809, 313.038], "c10-051": [313.888, 320.254], "c10-052": [321.104, 333.925], "c10-053": [334.275, 339.398], "c10-054": [339.748, 344.409]}, "blocks": [{"t": "p", "s": [["c10-001", "马车在大路上奔跑了两天。"], ["c10-002", "他们穿过麦田，穿过山谷，太阳下山的时候，来到了斯巴达。"]]}, {"t": "p", "s": [["c10-003", "路上，他们遇到了赶着羊群的牧羊人，遇到了挑着水罐的农妇，还遇到了一队唱着歌的收麦人。"], ["c10-004", "两匹马的鼻孔里喷着白气，铃铛一路叮叮当当地响。"], ["c10-005", "夜里，他们在一户农家借宿，主人端出了热腾腾的豆汤，两个年轻人喝了个精光。"]]}, {"t": "img", "src": "images/18.webp?v=f4363eecf6", "vid": "images/18.mp4?v=c136b47c3f", "cap": "斯巴达的王宫", "n": 18}, {"t": "p", "s": [["c10-006", "斯巴达的王宫金碧辉煌，墙上闪着铜和金子的光，门口站着银子做的柱子，大厅里的灯光，就像太阳和月亮一样明亮。"]]}, {"t": "p", "s": [["c10-007", "王宫里正在办一场热闹的婚礼。"], ["c10-008", "国王墨涅拉俄斯的女儿，就要嫁到远方去了。"], ["c10-009", "院子里挤满了人，有人在吹笛子，有人在跳舞，两个杂技演员在人群中翻着跟头，惹得孩子们一阵阵欢呼。"]]}, {"t": "p", "s": [["c10-010", "忒勒马科斯小声地对老国王的儿子说：“你看，这里到处都是铜、金子、银子和象牙，宙斯住的宫殿，大概也就是这个样子吧！”"]]}, {"t": "p", "s": [["c10-011", "他把声音压得低低的，生怕被别人听见，可是眼睛却忍不住东看西看，连嘴巴都忘了合上。"]]}, {"t": "p", "s": [["c10-012", "斯巴达国王墨涅拉俄斯听见了，笑着说：“孩子们，谁也比不上宙斯。"], ["c10-013", "我的这些财宝，是我在海上漂了八年，走遍了许多国家才带回来的。"], ["c10-014", "可是，就算我有再多的金子，心里也高兴不起来。"], ["c10-015", "因为我的许多好朋友，都死在了特洛伊。"], ["c10-016", "我最想念的，是奥德修斯。"], ["c10-017", "他为我吃了那么多苦，可到现在，谁也不知道他在哪里。"], ["c10-018", "他的老父亲，他的妻子，还有他刚出生的儿子，一定天天都在想他。”"]]}, {"t": "p", "s": [["c10-019", "忒勒马科斯听到这里，眼泪一下子流了下来，他赶紧用紫色的斗篷遮住了脸。"]]}, {"t": "p", "s": [["c10-020", "墨涅拉俄斯看在眼里，心里已经猜到了几分。"], ["c10-021", "他停下话头，静静地看着这个年轻人，没有打扰他。"], ["c10-022", "大厅里很安静，只有炉火轻轻噼啪作响的声音。"]]}, {"t": "p", "s": [["c10-023", "就在这时，王后海伦从香气扑鼻的房间里走了出来。"], ["c10-024", "她有一头金色的长发，穿着浅金色的长裙，美丽得就像一位女神。"], ["c10-025", "女仆们跟在她身后，捧着金纺锤和银篮子。"]]}, {"t": "p", "s": [["c10-026", "海伦一看见忒勒马科斯，就说：“墨涅拉俄斯，你看这个年轻人，长得多像奥德修斯呀！"], ["c10-027", "他一定就是奥德修斯的儿子忒勒马科斯！”"]]}, {"t": "p", "s": [["c10-028", "墨涅拉俄斯说：“我也这样想。"], ["c10-029", "他的手、他的脚、他的眼睛，还有他的头发，都和奥德修斯一模一样。”"]]}, {"t": "p", "s": [["c10-030", "他一边说，一边伸出手，轻轻地托住了忒勒马科斯的下巴，左看右看，眼眶红了，说不出下一句话。"]]}, {"t": "p", "s": [["c10-031", "老国王涅斯托尔的儿子说：“你们说得没错，他就是奥德修斯的儿子。"], ["c10-032", "他到这里来，是想请您告诉他父亲的消息。”"]]}, {"t": "p", "s": [["c10-033", "大家想起了特洛伊的往事，都难过地哭了。"], ["c10-034", "哭了好一会儿，海伦往酒里放了一种从埃及带来的神奇药草。"], ["c10-035", "谁喝了这种酒，一整天都不会伤心流泪。"]]}, {"t": "p", "s": [["c10-036", "那药草是埃及的一位女王送给她的。"], ["c10-037", "海伦把药草放进大酒碗里，轻轻搅了搅，酒的颜色变得更红更亮了。"], ["c10-038", "谁喝了它，哪怕亲眼看着自己的亲人死去，也不会流一滴眼泪。"], ["c10-039", "大家喝了酒，心里慢慢地松快了许多。"]]}, {"t": "p", "s": [["c10-040", "海伦说：“我给你们讲一个奥德修斯的故事吧。”"]]}, {"t": "p", "s": [["c10-041", "她的声音又轻又柔，像一阵吹过花园的风。"], ["c10-042", "她说话的时候，手指一下一下地绕着衣带，眼睛望着远处，好像又回到了很久很久以前。"]]}, {"t": "p", "s": [["c10-043", "“在特洛伊的时候，有一天，奥德修斯用鞭子把自己打得浑身是伤，穿上一身破破烂烂的衣服，扮成一个乞丐，混进了特洛伊城。"], ["c10-044", "城里的人谁也没有认出他来，只有我认出了他。"], ["c10-045", "我请他洗了澡，给他换了衣服，他才告诉我希腊人的计划。"], ["c10-046", "后来，他带着很多消息，平平安安地回到了希腊人的营地。”"]]}, {"t": "p", "s": [["c10-047", "墨涅拉俄斯说：“我也给你们讲一个。"], ["c10-048", "那匹大木马被拉进特洛伊城的那天夜里，我和奥德修斯，还有很多勇士，都藏在木马的肚子里。"], ["c10-049", "海伦绕着木马走了三圈，学着我们每个人妻子的声音，叫我们的名字。"], ["c10-050", "我们差点就要答应了，是奥德修斯用两只手死死地捂住了一个人的嘴，才救了大家。”"]]}, {"t": "p", "s": [["c10-051", "忒勒马科斯听着这些故事，好像看见了父亲聪明、勇敢的样子。"]]}, {"t": "p", "s": [["c10-052", "那天夜里，斯巴达的王宫安静下来，忒勒马科斯躺在门廊的软床上，睁着眼睛，听着远处的海浪声，一遍一遍地想着那些故事。"], ["c10-053", "他想：原来，我的父亲，是这样的一个人。"], ["c10-054", "想着想着，他的嘴角，悄悄地弯了起来。"]]}]}, {"title": "第十一章　会变身的老海神", "head": "c11-h", "audio": "audio/ch11.m4a?v=017724732e", "duration": 363.467, "times": {"c11-h": [0.0, 4.237], "c11-001": [5.237, 12.359], "c11-002": [13.209, 22.573], "c11-003": [23.423, 30.308], "c11-004": [30.658, 37.421], "c11-005": [37.771, 42.196], "c11-006": [42.546, 45.341], "c11-007": [46.191, 48.087], "c11-008": [48.937, 53.715], "c11-009": [54.065, 58.809], "c11-010": [59.159, 64.044], "c11-011": [64.894, 76.661], "c11-012": [77.011, 81.148], "c11-013": [81.998, 86.463], "c11-014": [86.813, 93.808], "c11-015": [94.158, 98.284], "c11-016": [99.134, 108.116], "c11-017": [108.466, 113.395], "c11-018": [113.745, 118.773], "c11-019": [119.623, 130.268], "c11-020": [131.118, 136.902], "c11-021": [137.252, 143.748], "c11-022": [144.598, 152.2], "c11-023": [152.55, 159.498], "c11-024": [160.348, 165.681], "c11-025": [166.031, 172.804], "c11-026": [173.654, 178.449], "c11-027": [178.799, 185.847], "c11-028": [186.197, 189.16], "c11-029": [190.01, 195.879], "c11-030": [196.229, 206.491], "c11-031": [207.341, 213.101], "c11-032": [213.951, 228.875], "c11-033": [229.725, 241.319], "c11-034": [242.169, 248.027], "c11-035": [248.877, 262.331], "c11-036": [262.681, 269.526], "c11-037": [270.376, 274.629], "c11-038": [274.979, 277.765], "c11-039": [278.615, 284.352], "c11-040": [285.202, 291.042], "c11-041": [291.392, 299.844], "c11-042": [300.194, 304.726], "c11-043": [305.576, 308.647], "c11-044": [308.997, 310.07], "c11-045": [310.42, 315.39], "c11-046": [316.24, 325.134], "c11-047": [325.484, 332.538], "c11-048": [333.388, 340.189], "c11-049": [340.539, 343.258], "c11-050": [343.608, 346.747], "c11-051": [347.097, 351.661], "c11-052": [352.511, 357.484], "c11-053": [357.834, 361.967]}, "blocks": [{"t": "p", "s": [["c11-001", "第二天早上，墨涅拉俄斯问忒勒马科斯：“孩子，你到底为什么到斯巴达来？”"]]}, {"t": "p", "s": [["c11-002", "忒勒马科斯把家里的事情都讲了出来：求婚者赖在家里，吃光了他们的牛羊，逼他的妈妈改嫁。"]]}, {"t": "p", "s": [["c11-003", "墨涅拉俄斯听了，气得拍着椅子说：“这些胆小鬼，竟敢躺在一位英雄的床上！"], ["c11-004", "就像一只母鹿，把刚出生的小鹿放在狮子的窝里，等狮子回来，它们就都完了。"], ["c11-005", "奥德修斯回来的那一天，就是这些求婚者倒霉的日子！"], ["c11-006", "孩子，我告诉你我听到的消息吧。”"]]}, {"t": "p", "s": [["c11-007", "墨涅拉俄斯讲了起来。"]]}, {"t": "p", "s": [["c11-008", "他的声音低低的，像是在讲一件很久以前的梦。"], ["c11-009", "窗外的阳光斜斜地照进来，照在他花白的头发上。"], ["c11-010", "忒勒马科斯和涅斯托尔的儿子，都屏住呼吸听着。"]]}, {"t": "p", "s": [["c11-011", "原来，墨涅拉俄斯从特洛伊回家的时候，被困在埃及附近的一座小岛上，整整二十天，一点风也没有，船怎么也开不出去。"], ["c11-012", "粮食吃光了，水手们只好天天在岛上钓鱼吃。"]]}, {"t": "p", "s": [["c11-013", "他们用弯弯的鱼钩，钓上来的鱼又小又瘦。"], ["c11-014", "水手们一个个饿得肚子咕咕叫，眼睛陷了下去，嘴唇也裂开了口子。"], ["c11-015", "墨涅拉俄斯一个人坐在海边，愁得吃不下饭。"]]}, {"t": "img", "src": "images/19.webp?v=a20e066320", "vid": "images/19.mp4?v=8300215203", "cap": "会变身的老海神", "n": 19}, {"t": "p", "s": [["c11-016", "这时，一位海上的女神可怜他，告诉他：这片海里住着一个老海神，名叫普洛透斯。"], ["c11-017", "他知道大海里所有的秘密，也知道世界上所有的事情。"], ["c11-018", "可是他很难抓住，因为他会变成各种各样的东西。"]]}, {"t": "p", "s": [["c11-019", "女神说，每天中午，老海神都会从海里爬上来，和他的一大群海豹一起，躺在海边的山洞里睡午觉。"]]}, {"t": "p", "s": [["c11-020", "墨涅拉俄斯带着三个最勇敢的伙伴，在沙滩上挖了四个坑。"], ["c11-021", "女神给了他们每人一张海豹皮，让他们披在身上，趴在坑里装成海豹。"]]}, {"t": "p", "s": [["c11-022", "沙子又湿又凉，一铲子下去，就能挖出几只小螃蟹，慌慌张张地爬走了。"], ["c11-023", "四个人挖得满头是汗，谁也没有说话，只听见铲子插进沙子里的声音。"]]}, {"t": "p", "s": [["c11-024", "海豹皮的味道又腥又臭，熏得他们差点晕过去。"], ["c11-025", "女神就在他们的鼻子底下抹了一点仙香，香气一下子把臭味都赶跑了。"]]}, {"t": "p", "s": [["c11-026", "他们趴在坑里，身上盖着一层沙子，一动也不敢动。"], ["c11-027", "太阳晒得背上热辣辣的，苍蝇在耳朵边嗡嗡地飞，谁也不敢伸手去赶。"], ["c11-028", "就这样，他们等了很久很久。"]]}, {"t": "p", "s": [["c11-029", "中午，海豹们一群一群地从海里爬上来，躺在沙滩上晒太阳。"], ["c11-030", "老海神也出来了，他数了数海豹，把墨涅拉俄斯他们也当成海豹数了进去，然后躺下来，呼呼地睡着了。"]]}, {"t": "p", "s": [["c11-031", "墨涅拉俄斯他们大喊一声，扑了上去，紧紧地抱住了老海神。"]]}, {"t": "p", "s": [["c11-032", "老海神一下子变成了一头长着鬃毛的大狮子，又变成了一条大蛇，又变成了一只豹子、一头大野猪，接着又变成了一股流水，最后变成了一棵枝叶茂盛的大树。"]]}, {"t": "p", "s": [["c11-033", "每变一次，他的声音就换一副样子：狮子在吼，蛇在嘶嘶地叫，豹子在低低地咆哮，野猪在呼噜呼噜地喘着气。"]]}, {"t": "p", "s": [["c11-034", "可是不管他变成什么，墨涅拉俄斯他们都死死地抱住不放。"]]}, {"t": "p", "s": [["c11-035", "狮子的爪子抓得他们手臂生疼，大蛇在他们的胳膊上缠了一圈又一圈，水流从指缝里溜走，大树的枝条劈头盖脸地打在他们的脸上。"], ["c11-036", "四个人咬紧牙关，手臂酸得几乎失去了知觉，可是谁也没有松开。"]]}, {"t": "p", "s": [["c11-037", "最后，老海神累了，只好变回了原来的样子。"], ["c11-038", "他说：“你想知道什么，就问吧。”"]]}, {"t": "p", "s": [["c11-039", "墨涅拉俄斯问了自己回家的路，又问了希腊英雄们的消息。"]]}, {"t": "p", "s": [["c11-040", "墨涅拉俄斯对忒勒马科斯说：“老海神告诉我：奥德修斯还活着！"], ["c11-041", "我亲眼看见他了，他在大海中间的一座小岛上，住在仙女卡吕普索的山洞里，一边哭一边想家。"], ["c11-042", "仙女不让他走，他没有船，也没有伙伴，回不了家。”"]]}, {"t": "p", "s": [["c11-043", "忒勒马科斯听了，又高兴，又着急。"], ["c11-044", "父亲还活着！"], ["c11-045", "可是，他在那么远的地方，自己又能做些什么呢？"]]}, {"t": "p", "s": [["c11-046", "窗外的天色渐渐暗下来，他一个人走到王宫外面的石阶上，坐在那里，望着遥远的西方。"], ["c11-047", "晚风吹着他的头发，他的心里，像有一只小鸟，扑棱棱地想要飞出去。"]]}, {"t": "p", "s": [["c11-048", "墨涅拉俄斯想留他多住几天，还要送他三匹好马和一辆漂亮的马车。"], ["c11-049", "忒勒马科斯说：“谢谢您，国王。"], ["c11-050", "伊萨卡到处是石头和山坡，养不了马。"], ["c11-051", "请您送我一件小一点的礼物吧，我的伙伴们还在皮洛斯等着我呢。”"]]}, {"t": "p", "s": [["c11-052", "墨涅拉俄斯哈哈大笑：“孩子，你说话真像你父亲！"], ["c11-053", "好吧，我送你一只银子做的、金边的调酒碗。”"]]}]}, {"title": "第十二章　求婚者的埋伏", "head": "c12-h", "audio": "audio/ch12.m4a?v=076fdd78bc", "duration": 348.866, "times": {"c12-h": [0.0, 2.907], "c12-001": [3.907, 13.657], "c12-002": [14.507, 22.728], "c12-003": [23.078, 25.182], "c12-004": [26.032, 28.691], "c12-005": [29.041, 33.016], "c12-006": [33.366, 39.377], "c12-007": [40.227, 44.118], "c12-008": [44.468, 49.766], "c12-009": [50.116, 53.166], "c12-010": [54.016, 57.717], "c12-011": [58.567, 63.311], "c12-012": [63.661, 66.543], "c12-013": [66.893, 69.935], "c12-014": [70.285, 77.72], "c12-015": [78.07, 80.674], "c12-016": [81.524, 83.718], "c12-017": [84.568, 91.928], "c12-018": [92.778, 99.424], "c12-019": [99.774, 104.093], "c12-020": [104.443, 111.258], "c12-021": [112.108, 116.219], "c12-022": [116.569, 121.558], "c12-023": [122.408, 129.616], "c12-024": [129.966, 138.855], "c12-025": [139.705, 146.247], "c12-026": [146.597, 149.525], "c12-027": [150.375, 156.304], "c12-028": [156.654, 162.638], "c12-029": [163.488, 166.105], "c12-030": [166.455, 169.559], "c12-031": [169.909, 173.122], "c12-032": [173.972, 181.913], "c12-033": [182.263, 187.742], "c12-034": [188.092, 195.259], "c12-035": [195.609, 198.195], "c12-036": [199.045, 204.244], "c12-037": [204.594, 216.207], "c12-038": [217.057, 223.311], "c12-039": [223.661, 228.364], "c12-040": [228.714, 236.935], "c12-041": [237.785, 240.373], "c12-042": [241.223, 242.975], "c12-043": [243.325, 251.639], "c12-044": [252.489, 255.196], "c12-045": [255.546, 259.265], "c12-046": [259.615, 263.392], "c12-047": [263.742, 267.251], "c12-048": [267.601, 269.435], "c12-049": [270.285, 276.809], "c12-050": [277.659, 280.756], "c12-051": [281.606, 287.279], "c12-052": [288.129, 292.308], "c12-053": [293.158, 300.472], "c12-054": [300.822, 312.006], "c12-055": [312.856, 327.768], "c12-056": [328.618, 334.327], "c12-057": [334.677, 339.076], "c12-058": [339.426, 347.366]}, "blocks": [{"t": "p", "s": [["c12-001", "就在忒勒马科斯在斯巴达听故事的时候，伊萨卡的王宫里，求婚者们正在玩扔铁饼和投长矛的游戏。"]]}, {"t": "p", "s": [["c12-002", "一个曾经借船给忒勒马科斯的年轻人走过来，问求婚者们：“你们知道忒勒马科斯什么时候从皮洛斯回来吗？"], ["c12-003", "我借给他的船，我还等着用呢。”"]]}, {"t": "p", "s": [["c12-004", "求婚者们一下子都愣住了。"], ["c12-005", "他们这才知道，忒勒马科斯真的出海了！"], ["c12-006", "他们原以为，他只是到乡下去看他的爷爷，或者去看牧猪人了。"]]}, {"t": "p", "s": [["c12-007", "手里的铁饼“咚”地掉在了地上，砸出一个小坑。"], ["c12-008", "有人的脸色变了，有人互相对视了一眼，谁也没有说话。"], ["c12-009", "大厅里，一下子变得鸦雀无声。"]]}, {"t": "p", "s": [["c12-010", "安提诺俄斯气得两眼冒火，他说："]]}, {"t": "p", "s": [["c12-011", "他把手里的长矛狠狠地插在地上，矛杆微微地颤着。"], ["c12-012", "“这个小孩子，竟然真的做成了这件事！"], ["c12-013", "他要是带回来帮手，就会给我们找麻烦。"], ["c12-014", "给我一条快船和二十个人，我要躲在他回来的路上，在伊萨卡和萨墨岛之间的海峡里等着他。"], ["c12-015", "等他一回来，就让他再也到不了家！”"]]}, {"t": "p", "s": [["c12-016", "求婚者们都说这个主意好。"]]}, {"t": "p", "s": [["c12-017", "有人拍着桌子叫好，有人端起酒杯，一饮而尽，嘴角带着得意的笑。"
