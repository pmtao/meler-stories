]]}, {"t": "p", "s": [["c12-018", "他们立刻忙了起来，有人去搬武器，有人去装干粮，有人跑去港口找船。"], ["c12-019", "安提诺俄斯还特意挑了二十个最凶的年轻人。"], ["c12-020", "他们谁也没有想到，自己的一举一动，早就被天上的一双眼睛看在了眼里。"]]}, {"t": "p", "s": [["c12-021", "可是这些话，被王宫里一个忠心的传令官听见了。"], ["c12-022", "他赶紧跑上楼，把这件事告诉了王后佩涅洛佩。"]]}, {"t": "p", "s": [["c12-023", "这位传令官名叫墨冬，年纪不小了，一向老老实实，从来不爱多说话。"], ["c12-024", "可是这一次，他的手都在发抖，一路小跑着穿过走廊，连鞋子差点跑掉了一只。"]]}, {"t": "p", "s": [["c12-025", "佩涅洛佩一听，腿一软，坐在了门槛上，半天说不出话来。"], ["c12-026", "她的眼睛里含满了眼泪。"]]}, {"t": "p", "s": [["c12-027", "手里的纺锤掉在了地上，滚到了墙角，她也没有发觉。"], ["c12-028", "女仆们围了过来，有的扶她，有的给她递水，屋子里乱成了一团。"]]}, {"t": "p", "s": [["c12-029", "佩涅洛佩说：“我的儿子为什么要走？"], ["c12-030", "他为什么要坐着快船，到大海上去冒险？"], ["c12-031", "难道他想让自己的名字也从这个世界上消失吗？”"]]}, {"t": "p", "s": [["c12-032", "老奶妈欧律克勒娅走过来，跪在她的面前，说：“王后，是我帮他准备的干粮。"], ["c12-033", "他让我发誓，十二天之内不告诉您，怕您哭坏了眼睛。"], ["c12-034", "王后，别伤心了，您去洗把脸，换件干净的衣服，向雅典娜女神祈祷吧。"], ["c12-035", "她一定会保佑您的儿子的。”"]]}, {"t": "p", "s": [["c12-036", "佩涅洛佩洗了脸，换上干净的衣服，向雅典娜祈祷。"], ["c12-037", "祈祷完，她不吃也不喝，躺在床上，翻来覆去地想着儿子，就像一头被猎人围住的狮子，又害怕，又着急。"]]}, {"t": "p", "s": [["c12-038", "窗外，夜渐渐深了，王宫里的灯一盏一盏地熄灭了。"], ["c12-039", "海风从窗缝里钻进来，吹得烛火摇摇晃晃。"], ["c12-040", "她把脸埋在被子里，一遍一遍地念着儿子的名字，一遍一遍地祈祷，求女神让他平平安安。"]]}, {"t": "p", "s": [["c12-041", "想着想着，她终于睡着了。"]]}, {"t": "p", "s": [["c12-042", "雅典娜派来了一个梦。"], ["c12-043", "那个梦变成了佩涅洛佩的妹妹的样子，从门上的钥匙孔里飘了进来，站在她的床头。"]]}, {"t": "p", "s": [["c12-044", "梦说：“姐姐，你睡着了吗？"], ["c12-045", "别再哭了，你的儿子一定会平平安安地回来的。"], ["c12-046", "他没有做错什么事，众神都在保护他。"], ["c12-047", "有一位女神陪在他的身边，就是雅典娜。"], ["c12-048", "是她派我来安慰你的。”"]]}, {"t": "p", "s": [["c12-049", "佩涅洛佩说：“妹妹，要是你真的是女神派来的，那就告诉我，我的丈夫还活着吗？”"]]}, {"t": "p", "s": [["c12-050", "梦说：“这件事，我不能告诉你。”"]]}, {"t": "p", "s": [["c12-051", "说完，梦又从钥匙孔里飘了出去，消失在夜风里。"]]}, {"t": "p", "s": [["c12-052", "佩涅洛佩醒了过来，心里一下子轻松了许多。"]]}, {"t": "p", "s": [["c12-053", "窗外的天已经微微发亮了，远处的海面上，露出一线淡淡的金色。"], ["c12-054", "她坐起来，把头发拢到耳朵后面，深深地吸了一口清晨的空气，觉得这一夜的恐惧，好像被什么温柔的东西轻轻地擦掉了一些。"]]}, {"t": "img", "src": "images/20.webp?v=27ea8b0553", "vid": "images/20.mp4?v=59536bb154", "cap": "埋伏的船", "n": 20}, {"t": "p", "s": [["c12-055", "就在这天夜里，安提诺俄斯带着二十个人，坐上一条黑色的快船，悄悄地开出了港口，躲在了海峡中间一座多石头的小岛后面，等着忒勒马科斯回来。"]]}, {"t": "p", "s": [["c12-056", "那座小岛光秃秃的，只有一些灰色的石头，和几只被惊起来的海鸟。"], ["c12-057", "他们把船藏在岛的背后，熄了火，谁也不敢点灯。"], ["c12-058", "月亮被云盖住了，海面黑得像墨一样，只有浪花偶尔闪过一点点白光。"]]}]}, {"title": "第十三章　卡吕普索的小岛", "head": "c13-h", "audio": "audio/ch13.m4a?v=11d7dc930d", "duration": 360.605, "times": {"c13-h": [0.0, 3.247], "c13-001": [4.247, 10.943], "c13-002": [11.793, 22.043], "c13-003": [22.893, 27.08], "c13-004": [27.43, 33.197], "c13-005": [33.547, 41.313], "c13-006": [42.163, 47.553], "c13-007": [47.903, 54.223], "c13-008": [55.073, 61.877], "c13-009": [62.227, 66.965], "c13-010": [67.815, 75.393], "c13-011": [75.743, 79.978], "c13-012": [80.828, 82.538], "c13-013": [83.388, 89.8], "c13-014": [90.15, 94.815], "c13-015": [95.165, 105.069], "c13-016": [105.919, 112.948], "c13-017": [113.298, 120.848], "c13-018": [121.198, 129.226], "c13-019": [130.076, 135.217], "c13-020": [136.067, 143.434], "c13-021": [143.784, 149.003], "c13-022": [149.353, 154.474], "c13-023": [155.324, 160.964], "c13-024": [161.314, 166.829], "c13-025": [167.179, 175.091], "c13-026": [175.941, 179.337], "c13-027": [179.687, 186.746], "c13-028": [187.596, 194.051], "c13-029": [194.401, 198.983], "c13-030": [199.833, 203.136], "c13-031": [203.986, 213.883], "c13-032": [214.733, 224.538], "c13-033": [224.888, 229.711], "c13-034": [230.561, 235.664], "c13-035": [236.014, 242.081], "c13-036": [242.431, 249.487], "c13-037": [250.337, 252.49], "c13-038": [253.34, 258.432], "c13-039": [258.782, 261.154], "c13-040": [261.504, 265.882], "c13-041": [266.232, 271.3], "c13-042": [271.65, 276.341], "c13-043": [276.691, 277.676], "c13-044": [278.526, 280.991], "c13-045": [281.841, 286.093], "c13-046": [286.443, 292.093], "c13-047": [292.443, 296.356], "c13-048": [296.706, 302.361], "c13-049": [303.211, 307.421], "c13-050": [307.771, 312.815], "c13-051": [313.165, 315.536], "c13-052": [315.886, 325.514], "c13-053": [325.864, 332.145], "c13-054": [332.995, 336.559], "c13-055": [336.909, 339.557], "c13-056": [340.407, 342.697], "c13-057": [343.547, 349.174], "c13-058": [349.524, 359.105]}, "blocks": [{"t": "p", "s": [["c13-001", "天上的奥林匹斯山上，雅典娜又一次来到宙斯面前，为奥德修斯求情。"]]}, {"t": "p", "s": [["c13-002", "宙斯对神使赫尔墨斯说：“赫尔墨斯，你去告诉仙女卡吕普索，众神已经决定了，让奥德修斯回家。”"]]}, {"t": "img", "src": "images/23.webp?v=b07ad52911", "vid": "images/23.mp4?v=85984aac33", "cap": "飞来的神使", "n": 21}, {"t": "p", "s": [["c13-003", "赫尔墨斯马上系好他那双带翅膀的金鞋子。"], ["c13-004", "这双鞋能载着他飞过大海，飞过无边无际的陆地，比风还快。"], ["c13-005", "他拿起那根能让人睡着、也能让人醒来的金手杖，从奥林匹斯山上飞了下来。"]]}, {"t": "p", "s": [["c13-006", "云在他的脚下飞快地向后退，风在他的耳边呼呼地响。"], ["c13-007", "他飞过了雪山，飞过了森林，飞过了一个又一个闪着波光的海湾。"]]}, {"t": "p", "s": [["c13-008", "他掠过海面，就像一只海鸥，在浪花上捕鱼，翅膀上沾满了水珠。"], ["c13-009", "他飞了很远很远，终于来到了大海中间的那座小岛。"]]}, {"t": "p", "s": [["c13-010", "远远地，他就闻到了一股香柏木的香气，混着花香和海水的咸味。"], ["c13-011", "那股香气越来越近，他知道，快到了。"]]}, {"t": "img", "src": "images/21.webp?v=d5a26789d4", "vid": "images/21.mp4?v=9e440ad30f", "cap": "仙女的小岛", "n": 22}, {"t": "p", "s": [["c13-012", "这座小岛美极了。"]]}, {"t": "p", "s": [["c13-013", "这里的天空特别蓝，空气里有花香，也有海水的咸味。"], ["c13-014", "蝴蝶在花丛里飞来飞去，蜜蜂嗡嗡地唱着歌。"], ["c13-015", "一只红色的小鸟，停在葡萄藤的最高处，歪着脑袋看着赫尔墨斯，好像在问：你是从哪里来的客人？"]]}, {"t": "p", "s": [["c13-016", "岛上有一个大山洞，洞口爬满了葡萄藤，一串串紫色的葡萄挂在上面。"], ["c13-017", "山洞四周长着高高的杨树和柏树，树上住着猫头鹰、老鹰和长舌头的海鸟。"], ["c13-018", "四股清清的泉水从石头缝里流出来，流过开满紫罗兰和野芹菜的草地。"]]}, {"t": "p", "s": [["c13-019", "就连天上的神来到这里，也会忍不住停下脚步，看个够。"]]}, {"t": "p", "s": [["c13-020", "山洞里，烧着一大堆香柏木的火，香气飘出去很远很远。"], ["c13-021", "仙女卡吕普索一边唱着好听的歌，一边用金梭子织布。"], ["c13-022", "她有一头黑色的长卷发，头上戴着一个鲜花编的花环。"]]}, {"t": "p", "s": [["c13-023", "她的声音又轻柔又好听，像泉水一样在山洞里回荡。"], ["c13-024", "可是细心的人会发现，歌声里藏着一点点说不出来的孤单。"], ["c13-025", "这座岛太美了，也太安静了，安静得让人忍不住想要有一个朋友，陪着自己说话。"]]}, {"t": "p", "s": [["c13-026", "卡吕普索一看见赫尔墨斯，就认出了他。"], ["c13-027", "她请赫尔墨斯坐在一把闪闪发光的椅子上，给他端来了仙酒和神仙的食物。"]]}, {"t": "p", "s": [["c13-028", "神仙们彼此都认识，不管离得多远，一见面，都像老朋友一样亲切。"], ["c13-029", "赫尔墨斯拍了拍鞋子上的水珠，笑着坐了下来。"]]}, {"t": "p", "s": [["c13-030", "可是，奥德修斯不在山洞里。"]]}, {"t": "p", "s": [["c13-031", "山洞里静静的，只有炉火的噼啪声，和织布机上一根半拉的线头，在风里轻轻地摇晃。"]]}, {"t": "img", "src": "images/22.webp?v=789b3b3924", "vid": "images/22.mp4?v=ed4bbb7074", "cap": "海边的思念", "n": 23}, {"t": "p", "s": [["c13-032", "他像往常一样，坐在海边的一块大石头上，望着空荡荡的大海，眼泪一滴一滴地往下掉。"], ["c13-033", "七年了，他每天都坐在这里，望着家乡的方向。"]]}, {"t": "p", "s": [["c13-034", "潮水退下去又涨上来，太阳升起来又落下去。"], ["c13-035", "海鸥在他头顶盘旋，发出长长的叫声，他连头也不抬一下。"], ["c13-036", "他的衣服被海风吹得发白，手里捏着一块小小的石头，已经被捏得光滑发亮。"]]}, {"t": "p", "s": [["c13-037", "赫尔墨斯吃完了东西，才说："]]}, {"t": "p", "s": [["c13-038", "他把金杯放在桌上，擦了擦嘴，神情变得认真起来。"], ["c13-039", "“卡吕普索，我是奉宙斯的命令来的。"], ["c13-040", "宙斯说，那个和你住在一起的人，是世界上最不幸的人。"], ["c13-041", "他在特洛伊打了十年的仗，又在海上漂了好多年，失去了所有的伙伴。"], ["c13-042", "他命中注定不会死在这里，他一定要回到家乡，见到他的亲人。"], ["c13-043", "你必须放他回家。”"]]}, {"t": "p", "s": [["c13-044", "卡吕普索听了，浑身发抖。"]]}, {"t": "p", "s": [["c13-045", "她的手紧紧地抓着椅子的扶手，指节都发白了。"], ["c13-046", "过了好一会儿，她才慢慢地低下头，眼睛里含着一点点泪光。"], ["c13-047", "她当然知道，宙斯的话是不能违抗的。"], ["c13-048", "她心里的难过，像潮水一样涌了上来，可是她没有哭出声。"]]}, {"t": "p", "s": [["c13-049", "卡吕普索说：“你们这些神真狠心！"], ["c13-050", "为什么一个女神喜欢一个凡人，你们就看不过去呢？"], ["c13-051", "当初，是我救了他。"], ["c13-052", "他的船被宙斯的雷电劈碎了，他一个人抱着一根木头，在海上漂了九天，漂到了我的岛上。"], ["c13-053", "是我照顾他，爱护他，还答应让他长生不老，永远年轻。”"]]}, {"t": "p", "s": [["c13-054", "赫尔墨斯说：“可是，谁也不能违背宙斯的命令。"], ["c13-055", "你还是快点放他走吧，不然宙斯会生气的。”"]]}, {"t": "p", "s": [["c13-056", "说完，赫尔墨斯就飞走了。"]]}, {"t": "p", "s": [["c13-057", "他的影子很快消失在天边，只留下一点点淡淡的风声。"], ["c13-058", "山洞里，炉火还在静静地烧着，卡吕普索一个人坐在那里，坐了很久很久，一动也不动。"]]}]}, {"title": "第十四章　二十棵大树和一条木筏", "head": "c14-h", "audio": "audio/ch14.m4a?v=3c5a1b131c", "duration": 365.547, "times": {"c14-h": [0.0, 4.525], "c14-001": [5.525, 9.15], "c14-002": [9.5, 13.372], "c14-003": [14.222, 20.397], "c14-004": [20.747, 23.571], "c14-005": [23.921, 28.339], "c14-006": [28.689, 40.096], "c14-007": [40.946, 43.882], "c14-008": [44.232, 47.849], "c14-009": [48.699, 57.447], "c14-010": [57.797, 61.439], "c14-011": [61.789, 70.068], "c14-012": [70.918, 74.909], "c14-013": [75.259, 79.699], "c14-014": [80.049, 83.321], "c14-015": [83.671, 87.528], "c14-016": [88.378, 92.503], "c14-017": [92.853, 97.175], "c14-018": [98.025, 102.308], "c14-019": [102.658, 108.307], "c14-020": [108.657, 115.882], "c14-021": [116.232, 119.016], "c14-022": [119.866, 123.92], "c14-023": [124.27, 130.773], "c14-024": [131.623, 134.95], "c14-025": [135.8, 141.465], "c14-026": [141.815, 150.408], "c14-027": [150.758, 155.189], "c14-028": [156.039, 159.017], "c14-029": [159.367, 164.849], "c14-030": [165.199, 169.573], "c14-031": [169.923, 173.048], "c14-032": [173.398, 177.424], "c14-033": [178.274, 179.791], "c14-034": [180.141, 185.713], "c14-035": [186.063, 191.696], "c14-036": [192.546, 202.824], "c14-037": [203.174, 213.748], "c14-038": [214.598, 217.59], "c14-039": [217.94, 227.431], "c14-040": [228.281, 233.847], "c14-041": [234.197, 239.465], "c14-042": [239.815, 250.856], "c14-043": [251.706, 263.008], "c14-044": [263.858, 270.242], "c14-045": [271.092, 277.131], "c14-046": [277.481, 289.467], "c14-047": [290.317, 292.611], "c14-048": [293.461, 300.958], "c14-049": [301.308, 312.377], "c14-050": [313.227, 326.231], "c14-051": [327.081, 330.821], "c14-052": [331.671, 340.97], "c14-053": [341.32, 346.572], "c14-054": [347.422, 354.266], "c14-055": [354.616, 356.764], "c14-056": [357.114, 364.047]}, "blocks": [{"t": "p", "s": [["c14-001", "卡吕普索走到海边，找到了奥德修斯。"], ["c14-002", "他的眼睛哭得红红的，好像从来就没有干过。"]]}, {"t": "p", "s": [["c14-003", "卡吕普索说：“可怜的人，别再哭了，也别再这样折磨自己了。"], ["c14-004", "我真心诚意地送你回家。"], ["c14-005", "你去砍几棵大树，造一条宽宽的木筏。"], ["c14-006", "我给你准备面包、清水和红酒，给你穿上暖和的衣服，再送你一阵顺风，让你平平安安地回到家乡。”"]]}, {"t": "img", "src": "images/24.webp?v=f068a970c6", "vid": "images/24.mp4?v=9679e0bf46", "cap": "仙女放他回家", "n": 24}, {"t": "p", "s": [["c14-007", "奥德修斯一听，心里打了一个冷战。"], ["c14-008", "他不敢相信，仙女会这么轻易地放他走。"]]}, {"t": "p", "s": [["c14-009", "他已经在这座岛上住了七年，试过无数次，想要离开，可每一次，都被拦了回来。"], ["c14-010", "现在，她却突然说要送他走。"], ["c14-011", "他把眼睛睁得大大的，仔细地看着卡吕普索的脸，想从她的表情里，找出一点点真假。"]]}, {"t": "p", "s": [["c14-012", "奥德修斯说：“女神，你一定是在打别的主意吧？"], ["c14-013", "你让我坐着一条小小的木筏，去渡过那么大、那么危险的大海？"], ["c14-014", "就连最快的大船，遇上了风暴也会沉下去的。"], ["c14-015", "除非你向众神发誓，不会害我，我才敢上木筏。”"]]}, {"t": "p", "s": [["c14-016", "他往后退了一步，眼睛一直盯着卡吕普索的脸。"], ["c14-017", "七年的时间，他已经学会了不再轻易相信别人的话。"]]}, {"t": "p", "s": [["c14-018", "卡吕普索笑了，用手轻轻地摸了摸他的头。"], ["c14-019", "她说：“你真是一个聪明的人，什么事都想得这么周到。"], ["c14-020", "我向天空、向大地、向地下的河水发誓，我绝不会害你。"], ["c14-021", "我的心，也不是铁做的。”"]]}, {"t": "p", "s": [["c14-022", "誓言说完，山洞里一下子安静下来。"], ["c14-023", "风也不吹了，浪也不响了，好像整个世界都在认真地听着。"]]}, {"t": "p", "s": [["c14-024", "那天晚上，他们最后一次一起吃饭。"]]}, {"t": "p", "s": [["c14-025", "卡吕普索说：“奥德修斯，你真的这么急着回家吗？"], ["c14-026", "你要是知道回家的路上还要吃多少苦，你一定会愿意留在这里，和我一起守着这个山洞，长生不老。"], ["c14-027", "你那么想念你的妻子，难道她比我还美丽吗？”"]]}, {"t": "p", "s": [["c14-028", "奥德修斯说：“女神，请别生气。"], ["c14-029", "我知道，佩涅洛佩没有你美丽，也不会长生不老，她只是一个普通的人。"], ["c14-030", "可是，我还是天天都想回家，想看见回家的那一天。"], ["c14-031", "就算众神再让我在海上吃苦，我也能忍受。"], ["c14-032", "我已经吃过太多的苦了，再多一点，又有什么关系呢？”"]]}, {"t": "p", "s": [["c14-033", "卡吕普索没有再说话。"], ["c14-034", "她低着头，给他的杯子里倒满了酒，手指微微地发着抖。"], ["c14-035", "窗外，月亮慢慢地爬上了山头，把海面照成了一片银色。"]]}, {"t": "p", "s": [["c14-036", "第二天一早，卡吕普索给了奥德修斯一把锋利的铜斧头，一把磨得亮亮的锛子，带他来到岛的另一头。"], ["c14-037", "那里长着高大的赤杨、白杨和直冲云霄的冷杉，树干早就干透了，最适合做木筏，在水上漂得最轻。"]]}, {"t": "img", "src": "images/25.webp?v=1369fb49be", "vid": "images/25.mp4?v=c49779e1cc", "cap": "造木筏", "n": 25}, {"t": "p", "s": [["c14-038", "奥德修斯一共砍倒了二十棵大树。"], ["c14-039", "他把树干削平，用钻子钻好孔，用木钉和木条把它们一根一根地拼起来，拼成了一条宽宽的木筏。"]]}, {"t": "p", "s": [["c14-040", "斧头一下一下地劈在树干上，木屑像雪花一样飞起来。"], ["c14-041", "汗水顺着他的脸颊往下流，流进了嘴里，咸咸的。"], ["c14-042", "可是他一点儿也不觉得累，他的心里，像有一个小小的鼓，“咚、咚、咚”地敲个不停：回家了，终于要回家了。"]]}, {"t": "p", "s": [["c14-043", "他在木筏上竖起桅杆，装上横杆，做了一个掌舵的舵桨，又用柳条编了一圈挡浪的围栏，在底下压上了很多石头和树枝。"]]}, {"t": "p", "s": [["c14-044", "卡吕普索拿来了布，奥德修斯把它缝成了船帆，系上了绳子。"]]}, {"t": "p", "s": [["c14-045", "她站在旁边，静静地看着他一针一线地缝，没有说话。"], ["c14-046", "有时候，她会递上一根线，或者帮他扶一扶木头，仿佛这只是平常的一天，仿佛他不是要走，而只是要去海边坐一坐。"]]}, {"t": "p", "s": [["c14-047", "四天以后，木筏造好了。"]]}, {"t": "p", "s": [["c14-048", "木筏停在沙滩上，大大的，方方正正，新木头的香味在风里飘。"], ["c14-049", "奥德修斯围着它转了一圈又一圈，用手拍一拍，用脚踩一踩，每一根木头都检查了三遍，才放心地点了点头。"]]}, {"t": "p", "s": [["c14-050", "第五天，卡吕普索给他洗了澡，换上了香喷喷的新衣服，在木筏上放了一皮袋红酒、一大皮袋清水，还有一大袋干粮和很多好吃的东西。"]]}, {"t": "p", "s": [["c14-051", "然后，她送来了一阵温暖、柔和的顺风。"]]}, {"t": "p", "s": [["c14-052", "奥德修斯回头望了一眼那座美丽的小岛，山洞口的葡萄藤在风里轻轻地摇动，好像在对他挥手。"], ["c14-053", "他在心里，对那位仙女说了一声：谢谢你，也请你原谅我。"]]}, {"t": "p", "s": [["c14-054", "奥德修斯高高兴兴地张开船帆，坐在舵桨旁边，熟练地掌着舵。"], ["c14-055", "他向仙女挥手告别。"], ["c14-056", "仙女站在海边，一直望着他，直到木筏变成了海面上的一个小黑点。"]]}]}, {"title": "第十五章　海神的风暴", "head": "c15-h", "audio": "audio/ch15.m4a?v=5099ab5cb2", "duration": 353.869, "times": {"c15-h": [0.0, 3.109], "c15-001": [4.109, 7.454], "c15-002": [8.304, 13.481], "c15-003": [13.831, 21.633], "c15-004": [22.483, 26.526], "c15-005": [26.876, 35.189], "c15-006": [35.539, 37.589], "c15-007": [38.439, 49.072], "c15-008": [49.422, 54.984], "c15-009": [55.834, 57.706], "c15-010": [58.556, 64.421], "c15-011": [64.771, 70.901], "c15-012": [71.251, 76.538], "c15-013": [77.388, 82.6], "c15-014": [82.95, 91.564], "c15-015": [92.414, 95.917], "c15-016": [96.267, 100.537], "c15-017": [100.887, 106.973], "c15-018": [107.323, 109.809], "c15-019": [110.659, 115.736], "c15-020": [116.086, 124.084], "c15-021": [124.934, 130.235], "c15-022": [131.085, 139.714], "c15-023": [140.064, 148.945], "c15-024": [149.795, 151.926], "c15-025": [152.276, 155.352], "c15-026": [155.702, 157.001], "c15-027": [157.351, 160.325], "c15-028": [160.675, 163.173], "c15-029": [164.023, 170.825], "c15-030": [171.175, 175.078], "c15-031": [175.928, 181.182], "c15-032": [184.671, 195.03], "c15-033": [195.38, 201.793], "c15-034": [202.643, 209.167], "c15-035": [209.517, 216.17], "c15-036": [217.02, 223.301], "c15-037": [224.151, 236.521], "c15-038": [237.371, 241.792], "c15-039": [242.642, 245.154], "c15-040": [245.504, 250.085], "c15-041": [250.435, 253.777], "c15-042": [254.627, 260.037], "c15-043": [260.387, 262.539], "c15-044": [262.889, 268.345], "c15-045": [268.695, 271.996], "c15-046": [272.346, 279.232], "c15-047": [279.582, 286.059], "c15-048": [286.909, 296.224], "c15-049": [297.074, 298.925], "c15-050": [299.275, 302.461], "c15-051": [302.811, 307.447], "c15-052": [307.797, 310.283], "c15-053": [311.133, 316.928], "c15-054": [317.278, 321.073], "c15-055": [321.923, 326.944], "c15-056": [327.294, 336.597], "c15-057": [337.447, 345.175], "c15-058": [345.525, 347.318], "c15-059": [348.168, 352.369]}, "blocks": [{"t": "p", "s": [["c15-001", "奥德修斯驾着木筏，在大海上航行。"]]}, {"t": "p", "s": [["c15-002", "他白天看着太阳，夜里不敢合眼，一直盯着天上的星星。"], ["c15-003", "卡吕普索告诉过他：要让大熊星座一直在他的左手边，木筏就不会走错方向。"]]}, {"t": "p", "s": [["c15-004", "就这样，他在海上漂了整整十七天。"], ["c15-005", "到了第十八天，他远远地看见了一片陆地，那片陆地在雾蒙蒙的海面上，像一面盾牌一样。"], ["c15-006", "那是费埃克斯人的国家。"]]}, {"t": "p", "s": [["c15-007", "这十七天里，他吃光了卡吕普索给的面饼，喝完了大半袋清水，皮肤被太阳晒得又黑又干，嘴唇起了皮。"], ["c15-008", "可是他一点也不后悔，一想到家乡，浑身又有了力气。"]]}, {"t": "p", "s": [["c15-009", "奥德修斯高兴极了。"]]}, {"t": "p", "s": [["c15-010", "他甚至忍不住在木筏上站了起来，对着远处的陆地大声地笑。"], ["c15-011", "十七天了，除了海，还是海，除了天，还是天。"], ["c15-012", "他从来没有觉得，一片小小的陆地，竟然这么亲切。"]]}, {"t": "img", "src": "images/26.webp?v=af172e5491", "vid": "images/26.mp4?v=a151e26aa6", "cap": "海神发怒", "n": 26}, {"t": "p", "s": [["c15-013", "偏偏就在这个时候，海神波塞冬从远方回来了。"], ["c15-014", "他站在高高的山顶上，一眼就看见了海面上的木筏，看见了木筏上的奥德修斯。"]]}, {"t": "p", "s": [["c15-015", "波塞冬气得直摇头，他说：“哼！"], ["c15-016", "我才离开几天，众神就改了主意，帮起奥德修斯来了！"], ["c15-017", "他眼看就要到费埃克斯人的国家了，到了那里，他就能逃过这场灾难。"], ["c15-018", "不过，我还要让他再吃够苦头！”"]]}, {"t": "p", "s": [["c15-019", "他的胡子在风里一根一根地竖了起来，眼睛里冒着火。"], ["c15-020", "大海感觉到了他的愤怒，浪头一个接一个地翻滚起来，好像一头头被惹怒的野兽。"]]}, {"t": "p", "s": [["c15-021", "说着，他举起了金色的三叉戟，在大海里狠狠地一搅。"]]}, {"t": "p", "s": [["c15-022", "天上一下子乌云翻滚，把大海和陆地都遮得严严实实，黑夜从天上压了下来。"], ["c15-023", "东风、南风、西风、北风，四面八方的风一起刮了起来，掀起了比山还高的大浪。"]]}, {"t": "p", "s": [["c15-024", "奥德修斯的膝盖都软了。"], ["c15-025", "他望着大浪，对自己说：“我真倒霉啊！"], ["c15-026", "我恐怕要死在这里了。"], ["c15-027", "那些死在特洛伊的英雄们，比我幸运多了。"], ["c15-028", "至少，大家还会记住他们的名字。”"]]}, {"t": "p", "s": [["c15-029", "他话还没说完，一个大浪从头顶上砸了下来，木筏一下子被打得团团转。"], ["c15-030", "奥德修斯被甩了出去，手里的舵桨也飞走了。"]]}, {"t": "img", "src": "images/27.webp?v=e824cc5a97", "vid": "images/27.mp4?v=23cabcc001", "cap": "桅杆断了", "n": 27}, {"t": "p", "s": [["c15-031", "木筏的桅杆“咔嚓”一声断了，船帆和横杆一起掉进了海里。"]]}, {"t": "p", "s": [["c15-032", "奥德修斯被大浪压在海底，好久好久都浮不上来，卡吕普索送他的那身衣服吸满了海水，重得像石头一样。"], ["c15-033", "他拼命地往上游，终于冒出了海面，吐出了一大口咸咸的海水。"]]}, {"t": "p", "s": [["c15-034", "他的耳朵里嗡嗡作响，眼前一阵阵发黑，胸口像被一块大石头压着。"], ["c15-035", "可是他心里有一个声音，一直在重复：不能死，我要回家，我要回家。"]]}, {"t": "p", "s": [["c15-036", "他顾不上喘气，一把抓住了漂在旁边的木筏，爬上去，坐在木筏中间。"]]}, {"t": "p", "s": [["c15-037", "大浪把木筏推来推去，一会儿南风把它扔给北风，一会儿东风又把它扔给西风，就像秋天的风把一团干草，在田野上吹来吹去。"]]}, {"t": "img", "src": "images/28.webp?v=479a695d1a", "vid": "images/28.mp4?v=0df91ca3c6", "cap": "白色的海鸟", "n": 28}, {"t": "p", "s": [["c15-038", "就在这时，一只白色的海鸟落在了木筏上。"]]}, {"t": "p", "s": [["c15-039", "那是好心的海上女神伊诺。"], ["c15-040", "她以前是一个凡人姑娘，后来变成了海里的女神。"], ["c15-041", "她可怜奥德修斯，就从海里飞了出来。"]]}, {"t": "p", "s": [["c15-042", "伊诺说：“可怜的人，海神为什么这么恨你，让你吃这么多苦？"], ["c15-043", "不过，他害不死你。"], ["c15-044", "你听我的话：脱掉这身沉重的衣服，丢下木筏，让风把它吹走吧。"], ["c15-045", "你跳进海里，游到费埃克斯人的岸边去。"], ["c15-046", "把这块头巾系在你的胸口上，有了它，你就不会沉下去，也不会被淹死。"], ["c15-047", "等你游上了岸，就把头巾扔回海里，扔的时候要转过脸去，不要看。”"]]}, {"t": "p", "s": [["c15-048", "说完，伊诺把一块蓝色的、神奇的头巾放在木筏上，又变成一只海鸟，钻进了黑沉沉的海浪里。"]]}, {"t": "p", "s": [["c15-049", "奥德修斯心里犹豫起来。"], ["c15-050", "他想：“这会不会又是哪个神给我设的圈套？"], ["c15-051", "那片陆地还那么远，木筏还没有散，我还是先待在木筏上吧。"], ["c15-052", "等木筏被浪打散了，我再游过去。”"]]}, {"t": "p", "s": [["c15-053", "他刚这样想，波塞冬又掀起了一个可怕的大浪，砸在木筏上。"], ["c15-054", "木筏一下子被打散了，木头四处乱飞。"]]}, {"t": "p", "s": [["c15-055", "奥德修斯骑在一根大木头上，就像骑在一匹马上一样。"], ["c15-056", "他脱掉了湿透的衣服，把伊诺的头巾系在胸口，一头扎进了大海里，张开双臂，拼命地向前游去。"]]}, {"t": "p", "s": [["c15-057", "波塞冬看见了，摇着头说：“好吧，你就这样在海上漂吧，漂到你遇见救你的人为止。"], ["c15-058", "我看你还能吃多少苦！”"]]}, {"t": "p", "s": [["c15-059", "说完，他赶着他的骏马，回到了自己的海底宫殿。"]]}]}, {"title": "第十六章　两天两夜", "head": "c16-h", "audio": "audio/ch16.m4a?v=e89770ec53", "duration": 373.508, "times": {"c16-h": [0.0, 2.805], "c16-001": [3.805, 10.778], "c16-002": [11.628, 15.026], "c16-003": [15.376, 17.684], "c16-004": [18.534, 26.168], "c16-005": [26.518, 32.36], "c16-006": [32.71, 39.084], "c16-007": [39.434, 46.504], "c16-008": [47.354, 53.486], "c16-009": [53.836, 59.816], "c16-010": [60.666, 67.76], "c16-011": [68.11, 77.674], "c16-012": [78.524, 85.893], "c16-013": [86.743, 91.516], "c16-014": [91.866, 102.488], "c16-015": [103.338, 111.353], "c16-016": [111.703, 121.598], "c16-017": [122.448, 133.408], "c16-018": [134.258, 137.929], "c16-019": [138.279, 142.622], "c16-020": [142.972, 148.093], "c16-021": [148.943, 154.738], "c16-022": [155.088, 164.971], "c16-023": [165.821, 168.691], "c16-024": [169.041, 173.637], "c16-025": [174.487, 181.043], "c16-026": [181.393, 188.08], "c16-027": [188.43, 195.561], "c16-028": [196.411, 202.13], "c16-029": [202.48, 207.03], "c16-030": [207.88, 214.572], "c16-031": [214.922, 220.873], "c16-032": [221.723, 230.822], "c16-033": [231.672, 238.02], "c16-034": [238.37, 246.015], "c16-035": [246.865, 248.854], "c16-036": [249.204, 256.725], "c16-037": [257.075, 261.362], "c16-038": [262.212, 264.953], "c16-039": [265.303, 269.752], "c16-040": [270.102, 275.051], "c16-041": [275.901, 287.181], "c16-042": [288.031, 290.773], "c16-043": [291.123, 297.531], "c16-044": [297.881, 306.097], "c16-045": [306.947, 311.844], "c16-046": [312.194, 317.439], "c16-047": [317.789, 323.421], "c16-048": [324.271, 330.526], "c16-049": [331.376, 344.309], "c16-050": [345.159, 348.759], "c16-051": [349.109, 355.876], "c16-052": [356.226, 364.788], "c16-053": [365.638, 369.154], "c16-054": [369.504, 372.008]}, "blocks": [{"t": "p", "s": [["c16-001", "雅典娜马上让别的风都停下来，只留下北风，把海浪推向费埃克斯人的岸边。"]]}, {"t": "p", "s": [["c16-002", "奥德修斯在大海里游了两天两夜。"], ["c16-003", "他好几次以为自己要死了。"]]}, {"t": "p", "s": [["c16-004", "白天，太阳晒得他睁不开眼，海水又咸又苦，嘴唇裂开了口子。"], ["c16-005", "夜里，海水冰凉冰凉的，星星一颗一颗地从头顶滑过去。"], ["c16-006", "他的手臂又酸又疼，两条腿像灌了铅一样，好几次都想要放弃。"], ["c16-007", "可是每一次，他一想到佩涅洛佩和小小的儿子，就又咬紧牙，划起了水。"]]}, {"t": "p", "s": [["c16-008", "到了第三天早上，风停了，海面上一下子变得平静下来。"], ["c16-009", "奥德修斯被一个大浪托起来，向前一看，陆地就在眼前了！"]]}, {"t": "p", "s": [["c16-010", "他的睫毛上结满了白白的盐粒，眼睛又涩又疼，几乎睁不开。"], ["c16-011", "他使劲地眨了眨，再看一眼，那片绿色没有消失，反而更清楚了：山坡、树林、白色的石头。"]]}, {"t": "p", "s": [["c16-012", "他高兴得就像孩子们看见生了重病的父亲又好起来了一样，拼命地向岸边游去。"]]}, {"t": "p", "s": [["c16-013", "可是，当他游近的时候，却听见了一阵可怕的轰隆声。"], ["c16-014", "原来，那里根本没有可以上岸的沙滩，只有陡峭的悬崖和尖尖的礁石，大浪撞在礁石上，溅起了白色的浪花。"]]}, {"t": "p", "s": [["c16-015", "浪花高高地扬起来，又重重地砸下去，像无数头白色的野马，疯狂地冲向石头。"], ["c16-016", "海水退下去的时候，礁石上露出一层滑腻腻的青苔，黑黑的，湿漉漉的，像怪兽的牙齿。"]]}, {"t": "p", "s": [["c16-017", "奥德修斯想：“要是我从这里爬上去，大浪会把我摔在尖尖的礁石上；要是我顺着海岸游，去找平坦的沙滩，又怕大浪把我卷回大海里去。”"]]}, {"t": "p", "s": [["c16-018", "他正在想，一个大浪把他向礁石推了过去。"], ["c16-019", "要不是雅典娜提醒他，他就会被撞得遍体鳞伤。"], ["c16-020", "他用两只手紧紧地抱住了一块礁石，一直抱到大浪过去。"]]}, {"t": "p", "s": [["c16-021", "可是大浪退回去的时候，又把他从礁石上拽了下来，拖进了海里。"], ["c16-022", "他手上的皮都被礁石刮掉了一层，就像章鱼被人从洞里拔出来的时候，吸盘上还粘着小石子一样。"]]}, {"t": "p", "s": [["c16-023", "奥德修斯不敢再靠近礁石了。"], ["c16-024", "他沿着海岸往前游，一边游，一边找能上岸的地方。"]]}, {"t": "p", "s": [["c16-025", "他的掌心火辣辣地疼，血和海水混在一起，从手指缝里流出来。"], ["c16-026", "他吸了一口气，把牙咬得紧紧的，沿着悬崖的边缘，一寸一寸地往前游。"], ["c16-027", "每游一段，他就抬起头，仔细地看一看岸上有没有缝隙，有没有沙滩。"]]}, {"t": "p", "s": [["c16-028", "终于，他看见了一条小河，河水清清的，流进大海。"], ["c16-029", "河口没有礁石，岸边还有一片能挡风的空地。"]]}, {"t": "p", "s": [["c16-030", "奥德修斯向河神祈祷，他说：“河神啊，不管您是谁，请可怜可怜我吧！"], ["c16-031", "我从大海里逃出来，吃了那么多苦，现在来到了您的面前，求您救救我！”"]]}, {"t": "p", "s": [["c16-032", "河神听见了他的祈祷，马上让河水停了下来，让河口的水变得平平静静，让他游进了河里。"]]}, {"t": "p", "s": [["c16-033", "河水温柔地托起了他，像一位老爷爷，轻轻地扶住了一个疲惫的孩子。"], ["c16-034", "岸边的芦苇沙沙地响着，好像在说：欢迎你，可怜的旅人，欢迎你。"]]}, {"t": "p", "s": [["c16-035", "奥德修斯爬上了岸。"], ["c16-036", "他的膝盖弯了，手臂也软了，浑身都肿了，嘴里、鼻子里不停地往外流着海水。"], ["c16-037", "他躺在地上，连话也说不出来，一动也不能动。"]]}, {"t": "p", "s": [["c16-038", "过了好久，他才缓过气来。"], ["c16-039", "他解下胸口的头巾，转过脸去，把它扔回了河里。"], ["c16-040", "河水把头巾送回了大海，伊诺伸出手，接住了它。"]]}, {"t": "p", "s": [["c16-041", "奥德修斯想：“我要是睡在河边，夜里的寒霜和早上的露水，会把我冻坏的；要是爬到山坡上的树林里去睡，又怕野兽把我当成了晚饭。”"]]}, {"t": "p", "s": [["c16-042", "最后，他还是走进了树林。"], ["c16-043", "他找到了两棵挨在一起长着的橄榄树，一棵是野的，一棵是家种的。"], ["c16-044", "两棵树的枝叶紧紧地缠在一起，风吹不进来，雨淋不进来，太阳也照不进来。"]]}, {"t": "p", "s": [["c16-045", "树林里静悄悄的，只有一只小鸟在远处叫了两声。"], ["c16-046", "地上铺着软软的苔藓，空气里有泥土和树叶的味道。"], ["c16-047", "他一路走，一路回头，生怕有什么野兽悄悄跟在后面。"]]}, {"t": "img", "src": "images/29.webp?v=6b740526b6", "vid": "images/29.mp4?v=724efc41aa", "cap": "落叶里睡着了", "n": 29}, {"t": "p", "s": [["c16-048", "树底下，堆着厚厚的一层落叶，足够两三个人在冬天里盖着睡觉。"]]}, {"t": "p", "s": [["c16-049", "奥德修斯躺在落叶中间，又抱来更多的落叶，盖在自己身上，就像住在荒野里的农夫，把一块烧红的木炭埋在灰里，留着第二天生火用一样。"]]}, {"t": "p", "s": [["c16-050", "落叶暖暖的，带着阳光和泥土的气息。"], ["c16-051", "夜风在树梢上轻轻地吹，树叶沙沙作响，好像在唱一支摇篮曲。"], ["c16-052", "他长长地、长长地吐出一口气，二十年来，他第一次觉得，自己的身体是安全的。"]]}, {"t": "p", "s": [["c16-053", "雅典娜在他的眼睛上撒下了甜甜的睡意。"], ["c16-054", "他闭上眼睛，沉沉地睡着了。"]]}]}, {"title": "第十七章　瑙西卡的梦", "head": "c17-h", "audio": "audio/ch17.m4a?v=a4d9ad8061", "duration": 360.84, "times": {"c17-h": [0.0, 3.253], "c17-001": [4.253, 7.32], "c17-002": [7.67, 13.497], "c17-003": [13.847, 20.695], "c17-004": [21.545, 29.366], "c17-005": [30.216, 37.105], "c17-006": [37.455, 42.8], "c17-007": [43.15, 48.798], "c17-008": [49.648, 59.403], "c17-009": [60.253, 64.74], "c17-010": [65.09, 68.03], "c17-011": [68.38, 76.781], "c17-012": [77.131, 85.123], "c17-013": [85.473, 88.566], "c17-014": [89.416, 93.034], "c17-015": [93.884, 98.861], "c17-016": [99.211, 100.798], "c17-017": [101.148, 108.575], "c17-018": [109.425, 115.141], "c17-019": [115.491, 125.083], "c17-020": [125.433, 129.565], "c17-021": [130.415, 135.959], "c17-022": [136.309, 138.468], "c17-023": [138.818, 146.004], "c17-024": [146.354, 149.079], "c17-025": [149.929, 152.71], "c17-026": [153.06, 155.504], "c17-027": [156.354, 161.713], "c17-028": [162.063, 166.842], "c17-029": [167.692, 173.337], "c17-030": [173.687, 177.572], "c17-031": [178.422, 182.487], "c17-032": [182.837, 188.612], "c17-033": [189.462, 191.125], "c17-034": [191.475, 195.899], "c17-035": [196.249, 210.235], "c17-036": [211.085, 216.478], "c17-037": [216.828, 225.883], "c17-038": [226.733, 234.024], "c17-039": [234.374, 237.865], "c17-040": [238.715, 241.1], "c17-041": [241.45, 248.258], "c17-042": [249.108, 256.564], "c17-043": [256.914, 264.77], "c17-044": [265.62, 270.781], "c17-045": [271.131, 281.694], "c17-046": [282.544, 290.124], "c17-047": [290.974, 299.017], "c17-048": [299.367, 307.69], "c17-049": [308.04, 313.771], "c17-050": [314.621, 319.998], "c17-051": [320.848, 328.461], "c17-052": [328.811, 337.653], "c17-053": [338.503, 346.279], "c17-054": [346.629, 352.015], "c17-055": [352.365, 359.34]}, "blocks": [{"t": "p", "s": [["c17-001", "这片陆地，是费埃克斯人的国家。"], ["c17-002", "他们是天下最会航海的人，住在大海边的一座漂亮的城市里。"], ["c17-003", "他们的国王叫阿尔基诺奥斯，国王有一个女儿，名叫瑙西卡。"]]}, {"t": "p", "s": [["c17-004", "瑙西卡十六七岁，长着一头栗色的长辫子，美丽得就像天上的女神。"]]}, {"t": "p", "s": [["c17-005", "她爱笑，爱唱歌，总是穿着浅色的裙子，在王宫的花园里跑来跑去。"], ["c17-006", "费埃克斯人的家家户户，都知道国王有一个最可爱的女儿。"], ["c17-007", "小孩子们见了她，都会跑上去，拉着她的裙角，要她讲故事。"]]}, {"t": "p", "s": [["c17-008", "这天夜里，雅典娜变成了瑙西卡最好的朋友，一个船长的女儿，悄悄地走进了公主的卧室，站在她的床头。"]]}, {"t": "img", "src": "images/30.webp?v=17d88e297c", "vid": "images/30.mp4?v=a5b942d480", "cap": "公主的梦", "n": 30}, {"t": "img", "src": "images/31.webp?v=38255be9cf", "vid": "images/31.mp4?v=fa1f25ab86", "cap": "河边洗衣服", "n": 31}, {"t": "p", "s": [["c17-009", "雅典娜在梦里对她说：“瑙西卡，你怎么这么懒呀？"], ["c17-010", "你漂亮的衣服都堆在那里，还没有洗呢。"], ["c17-011", "你很快就要出嫁了，到时候，你自己要穿漂亮的衣服，还要给送你出嫁的人们穿漂亮的衣服。"], ["c17-012", "明天一早，就去请求你的爸爸，给你准备一辆骡车，装上衣服，我们一起去河边洗衣服吧。"], ["c17-013", "河边的洗衣池，离城里可远着呢。”"]]}, {"t": "p", "s": [["c17-014", "说完，雅典娜就回到了奥林匹斯山。"]]}, {"t": "p", "s": [["c17-015", "第二天早上，瑙西卡醒了过来，想起了那个奇怪的梦。"], ["c17-016", "她跑去找爸爸妈妈。"], ["c17-017", "妈妈正坐在火炉边，纺着紫色的毛线；爸爸正要出门，去参加大臣们的会议。"]]}, {"t": "p", "s": [["c17-018", "窗外的太阳已经升得很高了，鸟儿在树枝上叽叽喳喳。"], ["c17-019", "她揉了揉眼睛，一骨碌爬起来，连头发都顾不上梳，就披着长袍，一路小跑，穿过长长的走廊。"], ["c17-020", "走廊两边的铜墙，被阳光照得闪闪发亮。"]]}, {"t": "p", "s": [["c17-021", "瑙西卡拉着爸爸的手，说：“亲爱的爸爸，您能给我准备一辆高高的骡车吗？"], ["c17-022", "我想把衣服拿到河边去洗。"], ["c17-023", "您出去开会，要穿干干净净的衣服；我的五个哥哥，天天都要换上洗干净的衣服去跳舞。"], ["c17-024", "这些事情，都得我来操心呀。”"]]}, {"t": "p", "s": [["c17-025", "她不好意思说自己快要出嫁了。"], ["c17-026", "可是爸爸心里什么都明白。"]]}, {"t": "p", "s": [["c17-027", "瑙西卡的脸红了，低下头，用手指绕着衣服的带子。"], ["c17-028", "窗外的鸟叫了几声，屋子里一下子安静下来。"]]}, {"t": "p", "s": [["c17-029", "国王笑着说：“孩子，骡车、别的东西，我都不会舍不得给你。"], ["c17-030", "去吧，让仆人们给你准备一辆有车篷的高骡车。”"]]}, {"t": "p", "s": [["c17-031", "他的笑声低低的，眼睛里带着一点点舍不得。"], ["c17-032", "他知道，女儿长大了，再过不了多久，就要离开这座王宫了。"]]}, {"t": "p", "s": [["c17-033", "仆人们套好了骡子。"], ["c17-034", "瑙西卡从房间里抱出了一大堆漂亮的衣服，放在车上。"], ["c17-035", "妈妈给她准备了一篮子好吃的东西，又在一个羊皮袋里装满了红酒，还给了她一个金瓶子，里面装着香喷喷的橄榄油，让她和女仆们洗完澡以后抹在身上。"]]}, {"t": "p", "s": [["c17-036", "骡车的车轮是新上过油的，转起来一点声音也没有。"], ["c17-037", "妈妈站在门口，看着女儿，轻轻地理了理她的头发，笑着说：“早点回来，别在外面玩得太晚了。”"]]}, {"t": "p", "s": [["c17-038", "瑙西卡坐上骡车，拿起鞭子，轻轻一挥，骡子就嗒嗒嗒地跑了起来。"], ["c17-039", "女仆们跟在骡车后面，一路说说笑笑。"]]}, {"t": "p", "s": [["c17-040", "她们来到了美丽的小河边。"], ["c17-041", "那里的洗衣池，一年四季都流着清清的河水，什么脏衣服都能洗得干干净净。"]]}, {"t": "p", "s": [["c17-042", "河边长着高高的芦苇，芦苇丛里，有一些白色的水鸟在悠闲地游来游去。"], ["c17-043", "河水流过光滑的鹅卵石，发出“叮叮咚咚”的声音，像有人在轻轻地弹琴。"]]}, {"t": "p", "s": [["c17-044", "她们卸下骡子，让它们到河边去吃又嫩又甜的青草。"], ["c17-045", "然后，她们把衣服从车上抱下来，泡进黑黝黝的池水里，用脚使劲地踩，看谁踩得快，看谁踩得干净。"]]}, {"t": "p", "s": [["c17-046", "衣服洗干净了，她们把衣服一件一件地晾在海边的鹅卵石上，让太阳晒干。"]]}, {"t": "p", "s": [["c17-047", "白衣服像一朵朵云，铺在石头上；蓝衣服像一片片海，浪花一样翻卷着。"], ["c17-048", "风一吹，衣服的边角轻轻地飘起来，空气里飘着肥皂和阳光混在一起的味道。"], ["c17-049", "女仆们一边晾，一边拍着手笑，说今天的太阳真好。"]]}, {"t": "p", "s": [["c17-050", "然后，她们洗了澡，抹上了橄榄油，坐在河边吃午饭。"]]}, {"t": "p", "s": [["c17-051", "吃完饭，大家解下头巾，在草地上抛起了皮球，一边玩，一边唱歌。"], ["c17-052", "瑙西卡的个子最高，长得最美丽，就像打猎的女神在山上和仙女们一起玩耍一样。"]]}, {"t": "p", "s": [["c17-053", "她们的笑声清清脆脆，飘得很远很远，惊起了树林里的好几只小鸟。"], ["c17-054", "皮球在空中划出一道道弧线，落进她们张开的手里。"], ["c17-055", "没有人想到，在不远的树林里，有一个陌生人，正沉沉地睡在落叶里。"]]}]}, {"title": "第十八章　河边的陌生人", "head": "c18-h", "audio": "audio/ch18.m4a?v=97ed98fc47", "duration": 335.998, "times": {"c18-h": [0.0, 3.429], "c18-001": [4.429, 7.638], "c18-002": [7.988, 12.558], "c18-003": [13.408, 16.262], "c18-004": [17.112, 27.165], "c18-005": [28.015, 30.181], "c18-006": [31.031, 35.979], "c18-007": [36.329, 42.33], "c18-008": [42.68, 47.209], "c18-009": [48.059, 51.647], "c18-010": [51.997, 55.245], "c18-011": [55.595, 61.785], "c18-012": [62.135, 64.079], "c18-013": [64.429, 65.363], "c18-014": [66.213, 68.888], "c18-015": [69.238, 75.004], "c18-016": [75.854, 81.559], "c18-017": [81.909, 87.146], "c18-018": [87.996, 95.987], "c18-019": [96.337, 102.474], "c18-020": [103.324, 110.22], "c18-021": [111.07, 112.942], "c18-022": [113.292, 117.697], "c18-023": [118.047, 122.115], "c18-024": [122.965, 133.59], "c18-025": [134.44, 137.355], "c18-026": [137.705, 142.119], "c18-027": [142.969, 150.21], "c18-028": [150.56, 156.778], "c18-029": [157.128, 165.431], "c18-030": [165.781, 173.199], "c18-031": [173.549, 175.871], "c18-032": [176.221, 181.259], "c18-033": [181.609, 184.587], "c18-034": [184.937, 186.989], "c18-035": [187.339, 191.729], "c18-036": [192.079, 198.336], "c18-037": [199.186, 204.257], "c18-038": [205.107, 209.712], "c18-039": [210.562, 213.807], "c18-040": [214.157, 219.081], "c18-041": [219.431, 224.014], "c18-042": [224.864, 228.978], "c18-043": [229.328, 231.423], "c18-044": [231.773, 232.96], "c18-045": [233.31, 236.944], "c18-046": [237.294, 240.949], "c18-047": [241.799, 244.267], "c18-048": [244.617, 253.062], "c18-049": [253.912, 261.534], "c18-050": [262.384, 272.738], "c18-051": [273.588, 281.864], "c18-052": [282.214, 287.693], "c18-053": [288.543, 293.025], "c18-054": [293.375, 299.834], "c18-055": [300.184, 303.255], "c18-056": [303.605, 306.786], "c18-057": [307.636, 311.726], "c18-058": [312.076, 316.825], "c18-059": [317.675, 325.739], "c18-060": [326.089, 334.498]}, "blocks": [{"t": "p", "s": [["c18-001", "太阳快要落山了，衣服也晒干了。"], ["c18-002", "瑙西卡和女仆们正准备叠好衣服，套上骡子回家。"]]}, {"t": "p", "s": [["c18-003", "这时，雅典娜想出了一个主意。"]]}, {"t": "img", "src": "images/32.webp?v=782630699a", "vid": "images/32.mp4?v=a098cfcd68", "cap": "抛皮球", "n": 32}, {"t": "p", "s": [["c18-004", "瑙西卡把皮球扔给一个女仆，雅典娜让皮球偏了一点，飞过了女仆的头顶，“扑通”一声，掉进了深深的河水里。"]]}, {"t": "p", "s": [["c18-005", "女孩子们一起大叫起来。"]]}, {"t": "p", "s": [["c18-006", "皮球在水面上打了个旋，被河水冲着，越漂越远。"], ["c18-007", "女仆们急得跳脚，有的跑到岸边，有的伸手去够，谁也够不着。"], ["c18-008", "她们的叫声又尖又高，一直传到树林深处。"]]}, {"t": "p", "s": [["c18-009", "叫声把睡在落叶里的奥德修斯吵醒了。"], ["c18-010", "他坐起来，心里想：“我又来到了什么地方？"], ["c18-011", "这里住的人，是凶恶野蛮、不讲道理的人，还是热情好客、敬畏众神的人？"], ["c18-012", "我刚才好像听见了女孩子的声音。"], ["c18-013", "我要过去看一看。”"]]}, {"t": "img", "src": "images/33.webp?v=2f47e83527", "vid": "images/33.mp4?v=75c7f01afd", "cap": "树丛里的陌生人", "n": 33}, {"t": "p", "s": [["c18-014", "奥德修斯从树丛里爬了出来。"], ["c18-015", "他身上什么衣服也没有，只好折下一根长满树叶的树枝，挡在身前。"]]}, {"t": "p", "s": [["c18-016", "树枝上的叶子沙沙地响，露水顺着他的胳膊往下滴。"], ["c18-017", "他的脚底全是伤，每走一步，都轻轻地“嘶”一声。"]]}, {"t": "p", "s": [["c18-018", "他就像一头在山里淋了雨、吹了风的狮子，饿得眼睛里冒着光，向女孩子们走过去。"], ["c18-019", "他浑身沾满了海盐和泥土，头发乱糟糟的，样子可怕极了。"]]}, {"t": "p", "s": [["c18-020", "女仆们一看见他，吓得尖叫起来，四处逃跑，有的一直跑到了海边。"]]}, {"t": "p", "s": [["c18-021", "只有瑙西卡没有跑。"], ["c18-022", "雅典娜在她的心里放进了勇气，赶走了她的害怕。"], ["c18-023", "她站在那里，一动也不动，看着这个陌生人。"]]}, {"t": "p", "s": [["c18-024", "奥德修斯心里想：“我是该走过去，抱住她的膝盖求她呢，还是站得远远的，用好听的话求她，给我一件衣服，告诉我城在哪里呢？”"]]}, {"t": "p", "s": [["c18-025", "他想了想，还是站得远远的好。"], ["c18-026", "要是他走过去抱住姑娘的膝盖，一定会把姑娘吓坏的。"]]}, {"t": "p", "s": [["c18-027", "奥德修斯远远地站着，客客气气地说：“美丽的姑娘，你是一位女神，还是一个凡人？"], ["c18-028", "要是你是一位女神，你一定是打猎的女神，你的个子，你的样子，和她一模一样。"], ["c18-029", "要是你是一个凡人，那你的爸爸妈妈和你的哥哥们，真是太幸福了，他们看见你，心里一定像开了花一样。"], ["c18-030", "我在提洛岛见过一棵新长出来的棕榈树，又高又挺拔，我看着它，惊讶了很久很久。"], ["c18-031", "现在看见你，我也是这样惊讶。"], ["c18-032", "姑娘，我是一个遭了海难的人，昨天才从大海里逃出来。"], ["c18-033", "我在海上漂了二十天，才被海浪冲到这里。"], ["c18-034", "在这里，我一个人也不认识。"], ["c18-035", "求求你可怜可怜我，给我一件旧衣服，告诉我城在哪里吧。"], ["c18-036", "愿众神让你得到你想要的一切：一个好丈夫，一个好家，一家人和和睦睦。”"]]}, {"t": "p", "s": [["c18-037", "瑙西卡说：“陌生人，你看起来不像是坏人，也不像是傻瓜。”"]]}, {"t": "p", "s": [["c18-038", "她把手里的皮球放下，一步一步，走到了河边。"]]}, {"t": "p", "s": [["c18-039", "“是宙斯让你吃了这么多苦，你只好忍着。"], ["c18-040", "现在，你来到了我们的国家，就不会缺衣服，也不会缺吃的。"], ["c18-041", "我是国王阿尔基诺奥斯的女儿，这里是费埃克斯人的国家。”"]]}, {"t": "p", "s": [["c18-042", "瑙西卡转过身，对女仆们喊：“姑娘们，快回来！"], ["c18-043", "你们为什么一看见男人就跑？"], ["c18-044", "他又不是敌人。"], ["c18-045", "他是一个迷路的可怜人，我们应该好好照顾他。"], ["c18-046", "快给他拿吃的、喝的，再带他到河里洗个澡。”"]]}, {"t": "p", "s": [["c18-047", "女仆们这才慢慢地走了回来。"], ["c18-048", "她们拿来了一件外衣和一件长袍，还有那个装着橄榄油的金瓶子，放在河边，请他去洗澡。"]]}, {"t": "p", "s": [["c18-049", "奥德修斯在河里洗掉了身上的海盐和泥土，抹上了橄榄油，穿上了干净的衣服。"]]}, {"t": "p", "s": [["c18-050", "雅典娜在他身上撒下了光彩，让他看起来又高大、又强壮，一头卷发就像风信子的花瓣一样，垂在他的肩膀上。"]]}, {"t": "p", "s": [["c18-051", "河水里映出一个高大的影子，水波轻轻荡漾，那个影子也跟着微微地晃。"], ["c18-052", "奥德修斯低头看了看，几乎认不出，水里的人是自己。"]]}, {"t": "p", "s": [["c18-053", "他走回来，坐在海边，英俊得闪闪发光。"], ["c18-054", "瑙西卡看着他，小声地对女仆们说：“刚才，我还以为他是一个难看的人呢。"], ["c18-055", "现在，他看起来就像天上的神一样。"], ["c18-056", "我真希望我将来的丈夫，也能像他一样。”"]]}, {"t": "p", "s": [["c18-057", "女仆们把吃的、喝的放在奥德修斯面前。"], ["c18-058", "他已经好多天没有吃东西了，狼吞虎咽地吃了起来。"]]}, {"t": "p", "s": [["c18-059", "面包是软的，奶酪是香的，葡萄酒是甜的，他一边吃，一边不停地说谢谢。"], ["c18-060", "女孩子们站在旁边，看着他那副狼吞虎咽的样子，忍不住互相对视了一眼，偷偷地笑了。"]]}]}, {"title": "第十九章　走进城去", "head": "c19-h", "audio": "audio/ch19.m4a?v=460561090c", "duration": 372.23, "times": {"c19-h": [0.0, 3.023], "c19-001": [4.023, 9.366], "c19-002": [10.216, 14.91], "c19-003": [15.26, 18.63], "c19-004": [18.98, 28.221], "c19-005": [28.571, 31.183], "c19-006": [31.533, 37.49], "c19-007": [37.84, 41.308], "c19-008": [41.658, 47.356], "c19-009": [47.706, 52.356], "c19-010": [52.706, 57.397], "c19-011": [57.747, 61.723], "c19-012": [62.573, 69.172], "c19-013": [70.022, 80.416], "c19-014": [80.766, 86.794], "c19-015": [87.644, 92.019], "c19-016": [92.369, 95.833], "c19-017": [96.183, 99.853], "c19-018": [100.703, 106.76], "c19-019": [107.61, 111.694], "c19-020": [112.044, 122.179], "c19-021": [123.029, 127.698], "c19-022": [128.048, 129.562], "c19-023": [130.412, 136.273], "c19-024": [136.623, 140.502], "c19-025": [141.352, 144.382], "c19-026": [144.732, 147.361], "c19-027": [147.711, 152.142], "c19-028": [152.492, 158.684], "c19-029": [159.034, 163.645], "c19-030": [164.495, 168.594], "c19-031": [168.944, 172.415], "c19-032": [173.265, 178.468], "c19-033": [178.818, 186.153], "c19-034": [186.503, 194.341], "c19-035": [194.691, 200.762], "c19-036": [201.612, 203.984], "c19-037": [204.334, 207.032], "c19-038": [207.382, 211.24], "c19-039": [211.59, 216.263], "c19-040": [217.113, 219.847], "c19-041": [220.697, 224.379], "c19-042": [225.229, 241.96], "c19-043": [242.31, 253.129], "c19-044": [253.979, 256.912], "c19-045": [257.262, 262.899], "c19-046": [263.249, 271.746], "c19-047": [272.096, 277.386], "c19-048": [277.736, 286.229], "c19-049": [287.079, 290.493], "c19-050": [290.843, 294.999], "c19-051": [295.849, 300.454], "c19-052": [301.304, 304.796], "c19-053": [305.146, 310.862], "c19-054": [311.712, 319.661], "c19-055": [320.011, 321.595], "c19-056": [321.945, 326.191], "c19-057": [327.041, 330.668], "c19-058": [331.518, 333.45], "c19-059": [333.8, 342.896], "c19-060": [343.246, 344.916], "c19-061": [345.766, 352.317], "c19-062": [352.667, 356.379], "c19-063": [356.729, 362.714], "c19-064": [363.564, 365.513], "c19-065": [365.863, 370.73]}, "blocks": [{"t": "p", "s": [["c19-001", "瑙西卡叠好衣服，放在车上，套好了骡子，坐上了车。"]]}, {"t": "img", "src": "images/34.webp?v=814310b3c0", "vid": "images/34.mp4?v=f9bc9e7c57", "cap": "跟着骡车进城", "n": 34}, {"t": "p", "s": [["c19-002", "瑙西卡说：“陌生人，你跟着我们的骡车走，我带你去城里。"], ["c19-003", "不过，到了城边，你可不能再跟着我了。"], ["c19-004", "城里的人爱说闲话，要是他们看见我带着一个英俊的陌生人进城，一定会说：‘瑙西卡跟着的那个高大英俊的人是谁呀？"], ["c19-005", "是她在哪里找到的未婚夫吧？’"], ["c19-006", "城外的路边，有一片雅典娜的小树林，树林里有一个泉水和一片草地。"], ["c19-007", "你就在那里等一会儿，等我们到了家，你再进城。"], ["c19-008", "进了城，很容易就能找到我爸爸的王宫，随便哪个小孩子都能给你带路。"], ["c19-009", "走进王宫以后，你不要先去找我的爸爸，要先去找我的妈妈。"], ["c19-010", "她坐在火炉边，在纺紫色的毛线，背靠着一根柱子。"], ["c19-011", "只要她喜欢你，肯帮你，你就一定能回到家乡。”"]]}, {"t": "p", "s": [["c19-012", "奥德修斯跟着骡车走，到了城边，就在雅典娜的小树林里坐了下来。"]]}, {"t": "p", "s": [["c19-013", "他靠着一棵粗粗的白杨树坐下，听着远处骡车的铃铛声，越来越轻，越来越远，最后消失在傍晚的风里。"], ["c19-014", "树林里有泉水的声音，一只萤火虫在他面前一闪一闪地亮着。"]]}, {"t": "p", "s": [["c19-015", "他向雅典娜祈祷，他说：“女神啊，请听我说吧！"], ["c19-016", "以前，海神让我吃苦的时候，您没有来帮我。"], ["c19-017", "现在，请让费埃克斯人可怜我、喜欢我吧。”"]]}, {"t": "p", "s": [["c19-018", "雅典娜听见了他的祈祷，可是她没有现身，因为她怕海神波塞冬生气。"]]}, {"t": "p", "s": [["c19-019", "天快黑了，奥德修斯站起来，向城里走去。"], ["c19-020", "雅典娜在他的四周洒下了一层浓浓的雾，让城里的人都看不见他，免得有人对他说难听的话，问他是谁。"]]}, {"t": "p", "s": [["c19-021", "刚走到城门口，他就遇见了一个提着水罐的小姑娘。"], ["c19-022", "那是雅典娜变的。"]]}, {"t": "p", "s": [["c19-023", "奥德修斯说：“孩子，你能给我带路，到国王阿尔基诺奥斯的王宫去吗？"], ["c19-024", "我是一个从远方来的陌生人，在这里一个人也不认识。”"]]}, {"t": "p", "s": [["c19-025", "小姑娘说：“老伯伯，我带你去吧。"], ["c19-026", "国王的王宫，就在我家旁边。"], ["c19-027", "你跟着我走，一路上不要看人，也不要问人。"], ["c19-028", "这里的人不太喜欢陌生人，他们只喜欢坐着快船，在大海上航行。"], ["c19-029", "他们的船，比鸟的翅膀还快，比人的念头还快。”"]]}, {"t": "p", "s": [["c19-030", "小姑娘在前面走，奥德修斯跟在后面。"], ["c19-031", "费埃克斯人走来走去，谁也没有看见他。"]]}, {"t": "p", "s": [["c19-032", "街两边是整整齐齐的房子，门口挂着彩色的布。"], ["c19-033", "港口里停满了黑色的大船，桅杆像一片光秃秃的树林，高高地竖着。"], ["c19-034", "卖鱼的叫卖声、孩子们的笑声、铁匠铺里叮叮当当的敲打声，混成一片。"], ["c19-035", "奥德修斯一边走，一边东张西望，觉得自己好像走进了一个梦里。"]]}, {"t": "p", "s": [["c19-036", "他们来到了国王的王宫门口。"], ["c19-037", "小姑娘说：“这就是你要找的王宫。"], ["c19-038", "进去以后，先去找王后，她叫阿瑞忒。"], ["c19-039", "她心地善良，只要她喜欢你，你就一定能回到家乡。”"]]}, {"t": "p", "s": [["c19-040", "说完，小姑娘就不见了。"]]}, {"t": "p", "s": [["c19-041", "奥德修斯站在王宫门口，惊讶地看着。"]]}, {"t": "img", "src": "images/35.webp?v=f80783fead", "vid": "images/35.mp4?v=dd434d40c2", "cap": "铜墙金门的王宫", "n": 35}, {"t": "p", "s": [["c19-042", "这座王宫，有铜做的墙，一直从门口延伸到最里面；墙顶上镶着蓝色的玻璃；大门是金子做的，门框是银子做的，门槛是铜做的，门上的拉环也是金子做的。"], ["c19-043", "大门两边，站着两只金狗和两只银狗，那是火神亲手做的，它们永远守着王宫的大门，永远不会老。"]]}, {"t": "p", "s": [["c19-044", "王宫外面，有一个大果园。"], ["c19-045", "果园里种着梨树、石榴树、苹果树、无花果树和橄榄树。"], ["c19-046", "这些果树一年四季都结着果子，西风一吹，这边的果子刚成熟，那边的果子又开了花。"], ["c19-047", "果园旁边，还有一片葡萄园和一个开满鲜花的菜园。"], ["c19-048", "两股泉水，一股流过整个花园，一股流到王宫门口，让城里的人都来打水。"]]}, {"t": "p", "s": [["c19-049", "奥德修斯看了好久，才走进了大门。"], ["c19-050", "他身上还裹着雅典娜的浓雾，谁也看不见他。"]]}, {"t": "p", "s": [["c19-051", "他一直走到王后的面前，跪下来，抱住了王后的膝盖。"]]}, {"t": "p", "s": [["c19-052", "就在这时，雅典娜的浓雾一下子散开了。"], ["c19-053", "大厅里的人们看见突然冒出来一个陌生人，都惊讶得说不出话来。"]]}, {"t": "p", "s": [["c19-054", "奥德修斯说：“王后，国王，还有在座的各位客人，我吃了很多苦，才来到你们的面前。"], ["c19-055", "愿众神赐给你们幸福。"], ["c19-056", "我离开家已经很久很久了，求求你们，派一条船送我回家吧。”"]]}, {"t": "p", "s": [["c19-057", "说完，他走到火炉边，坐在了炉灰里。"]]}, {"t": "p", "s": [["c19-058", "大厅里安静了很久。"], ["c19-059", "最后，一位白胡子的老人说话了，他说：“国王，让客人坐在炉灰里，这可不合规矩啊。"], ["c19-060", "快请他坐到椅子上吧。”"]]}, {"t": "p", "s": [["c19-061", "国王阿尔基诺奥斯拉起奥德修斯的手，让他坐在自己身边的一把银椅子上。"], ["c19-062", "那把椅子，原来是国王最喜欢的儿子坐的。"], ["c19-063", "仆人们端来了金壶和银盆，请他洗手，又摆上了面包和肉。"]]}, {"t": "p", "s": [["c19-064", "国王说：“客人，你放心吧。"], ["c19-065", "明天，我们就派一条船，送你回到你的家乡，不管它有多远。”"]]}]}, {"title": "第二十章　费埃克斯人的运动会", "head": "c20-h", "audio": "audio/ch20.m4a?v=eb526fc8b8", "duration": 329.545, "times": {"c20-h": [0.0, 3.876], "c20-001": [4.876, 8.734], "c20-002": [9.084, 17.613], "c20-003": [17.963, 21.42], "c20-004": [22.27, 24.815], "c20-005": [25.165, 26.304], "c20-006": [27.154, 31.36], "c20-007": [31.71, 42.668], "c20-008": [43.018, 45.452], "c20-009": [45.802, 50.08], "c20-010": [50.43, 55.229], "c20-011": [55.579, 60.194], "c20-012": [60.544, 67.133], "c20-013": [67.983, 83.339], "c20-014": [84.189, 86.602], "c20-015": [87.452, 93.715], "c20-016": [94.065, 98.922], "c20-017": [99.772, 103.369], "c20-018": [103.719, 112.689], "c20-019": [113.539, 117.363], "c20-020": [118.213, 123.862], "c20-021": [124.212, 128.465], "c20-022": [128.815, 130.336], "c20-023": [130.686, 133.508], "c20-024": [134.358, 138.306], "c20-025": [138.656, 141.535], "c20-026": [141.885, 142.952], "c20-027": [143.802, 151.883], "c20-028": [152.233, 159.02], "c20-029": [159.87, 162.446], "c20-030": [162.796, 166.922], "c20-031": [167.272, 169.672], "c20-032": [170.022, 177.365], "c20-033": [177.715, 178.588], "c20-034": [178.938, 182.018], "c20-035": [182.868, 187.654], "c20-036": [188.004, 192.385], "c20-037": [193.235, 198.477], "c20-038": [199.327, 202.375], "c20-039": [202.725, 205.23], "c20-040": [205.58, 211.995], "c20-041": [212.845, 223.828], "c20-042": [224.178, 226.754], "c20-043": [227.104, 230.238], "c20-044": [231.088, 238.131], "c20-045": [238.481, 243.854], "c20-046": [244.204, 250.36], "c20-047": [251.21, 252.561], "c20-048": [252.911, 253.87], "c20-049": [254.72, 260.663], "c20-050": [261.013, 266.159], "c20-051": [266.509, 267.734], "c20-052": [268.084, 280.289], "c20-053": [280.639, 284.226], "c20-054": [285.076, 288.528], "c20-055": [288.878, 294.123], "c20-056": [294.473, 301.183], "c20-057": [302.033, 310.907], "c20-058": [311.257, 315.537], "c20-059": [315.887, 319.801], "c20-060": [320.651, 325.639], "c20-061": [325.989, 328.045]}, "blocks": [{"t": "p", "s": [["c20-001", "第二天早上，国王召集了费埃克斯人开大会。"], ["c20-002", "雅典娜变成了国王的传令官，在城里到处跑，对人们说：“快到大会上来，看看那个陌生人吧！"], ["c20-003", "他是从大海里漂来的，长得就像天上的神一样！”"]]}, {"t": "p", "s": [["c20-004", "人们很快就挤满了会场。"], ["c20-005", "国王对大家说："]]}, {"t": "p", "s": [["c20-006", "会场里的石头座位一排一排，坐满了人。"], ["c20-007", "孩子们爬到了树上，老人们拄着拐杖站在最前面，每个人都想看一看，那个从大海里漂来的陌生人，到底长什么样。"], ["c20-008", "“这位客人，要我们送他回家。"], ["c20-009", "我们费埃克斯人，从来没有让一个求我们帮忙的人失望过。"], ["c20-010", "快准备一条最好的黑色快船，挑选五十二个最好的年轻水手！"], ["c20-011", "准备好了，就都到我的王宫里来，我们为客人举行一场宴会。"], ["c20-012", "再把我们的歌手得摩多科斯请来，众神赐给了他一副好嗓子，让他唱歌给我们听。”"]]}, {"t": "p", "s": [["c20-013", "宴会上，大家吃饱了，喝足了，国王又说：“现在，我们到外面去，比赛跑步、摔跤、跳远和扔铁饼，让客人回到家以后，能告诉他的朋友们，我们费埃克斯人有多么了不起！”"]]}, {"t": "p", "s": [["c20-014", "年轻人们都来到了广场上。"]]}, {"t": "p", "s": [["c20-015", "他们先比赛跑步，一个个跑得像风一样快，扬起了一路的尘土。"], ["c20-016", "接着，他们又比赛摔跤、跳远、扔铁饼和拳击。"]]}, {"t": "p", "s": [["c20-017", "观众们围着场地，大声地喊着加油。"], ["c20-018", "年轻人的脸被太阳晒得红通通的，汗水顺着额头往下流，一滴一滴地落在地上，很快就被晒干了。"]]}, {"t": "p", "s": [["c20-019", "国王的儿子拉俄达马斯走过来，对奥德修斯说："]]}, {"t": "p", "s": [["c20-020", "他是国王最小的儿子，个子高高的，是跑得最快的年轻人。"], ["c20-021", "他笑着走过来，脸上带着一点点挑战的神气。"], ["c20-022", "“客人，你也来比一比吧。"], ["c20-023", "你看起来这么强壮，一定也是一个运动高手。”"]]}, {"t": "p", "s": [["c20-024", "奥德修斯说：“拉俄达马斯，你为什么要取笑我？"], ["c20-025", "我心里装满了忧愁，哪有心思比赛呢？"], ["c20-026", "我只想快点回家。”"]]}, {"t": "p", "s": [["c20-027", "另一个年轻人欧律阿罗斯听了，哈哈大笑，他说：“客人，我看你根本就不会什么运动。"], ["c20-028", "你就像一个坐着破船做生意的商人，整天只想着货物和赚钱，哪里是什么运动员！”"]]}, {"t": "p", "s": [["c20-029", "奥德修斯一听，皱起了眉头。"], ["c20-030", "他说：“年轻人，你说这样的话，可不太礼貌。"], ["c20-031", "众神并不把所有的好东西都给一个人。"], ["c20-032", "有的人长得不好看，可是说的话大家都喜欢听；有的人长得像神一样，说的话却一点儿也不中听。"], ["c20-033", "你就是这样的人。"], ["c20-034", "我虽然吃了很多苦，可我还是要试一试！”"]]}, {"t": "p", "s": [["c20-035", "他连斗篷也没有脱，就跳了起来，拿起了一个铁饼。"], ["c20-036", "这个铁饼比费埃克斯人扔的都要大，都要重。"]]}, {"t": "p", "s": [["c20-037", "他转了一圈，用他那只有力的手，把铁饼扔了出去。"]]}, {"t": "p", "s": [["c20-038", "铁饼呼呼地叫着，从空中飞过。"], ["c20-039", "费埃克斯人吓得都趴在了地上。"], ["c20-040", "铁饼飞呀飞呀，飞过了所有人扔出的标记，远远地落在了草地上。"]]}, {"t": "p", "s": [["c20-041", "雅典娜变成了一个费埃克斯人，跑过去做了一个标记，大声说：“客人，就算一个瞎子，也能分清你的标记和别人的标记！"], ["c20-042", "你的铁饼比别人的远多了。"], ["c20-043", "在这项比赛里，谁也赢不了你！”"]]}, {"t": "p", "s": [["c20-044", "奥德修斯高兴起来，他对年轻人们说：“年轻人，你们要是谁能扔得这么远，就来试试吧。"], ["c20-045", "跑步、摔跤、射箭，你们随便挑一样，我都愿意比一比。"], ["c20-046", "只有跑步，我可能比不过你们，因为我在海上漂了太久，腿脚都没有力气了。”"]]}, {"t": "p", "s": [["c20-047", "大家都不说话了。"], ["c20-048", "国王笑着说："]]}, {"t": "p", "s": [["c20-049", "风吹过广场，吹动了树梢，也吹散了刚才有点紧张的气氛。"], ["c20-050", "几个年轻人不好意思地低下了头，有的搓着手，有的看着脚尖。"], ["c20-051", "“客人，你说得对。"], ["c20-052", "我们费埃克斯人，拳击和摔跤都不太行，可是我们跑得快，船开得快，还最喜欢宴会、音乐、跳舞，喜欢换上干净的衣服，洗热水澡，睡软软的床。"], ["c20-053", "来吧，让我们最好的舞蹈家跳个舞给客人看！”"]]}, {"t": "p", "s": [["c20-054", "一个传令官拿来了得摩多科斯的竖琴。"], ["c20-055", "年轻人们在广场中间围成一圈，随着琴声跳起舞来。"], ["c20-056", "他们的脚步又轻又快，奥德修斯看得眼花缭乱，心里佩服极了。"]]}, {"t": "p", "s": [["c20-057", "欧律阿罗斯也走过来，送给奥德修斯一把铜剑，剑柄是银子做的，剑鞘是象牙做的。"], ["c20-058", "他说：“客人，刚才我说了不礼貌的话，请你原谅我。"], ["c20-059", "愿众神保佑你，早日回到家乡，见到你的妻子。”"]]}, {"t": "p", "s": [["c20-060", "奥德修斯接过宝剑，他说：“朋友，愿众神也保佑你。"], ["c20-061", "希望你以后永远不会想念这把剑。”"]]}]}, {"title": "第二十一章　盲歌手的歌", "head": "c21-h", "audio": "audio/ch21.m4a?v=99fe8dc178", "duration": 345.565, "times": {"c21-h": [0.0, 3.303], "c21-001": [4.303, 8.627], "c21-002": [9.477, 17.431], "c21-003": [17.781, 26.589], "c21-004": [27.439, 34.265], "c21-005": [34.615, 37.006], "c21-006": [37.856, 40.798], "c21-007": [41.148, 43.763], "c21-008": [44.113, 45.551], "c21-009": [46.401, 56.549], "c21-010": [57.399, 58.481], "c21-011": [58.831, 67.019], "c21-012": [67.869, 72.941], "c21-013": [73.291, 81.969], "c21-014": [82.319, 86.37], "c21-015": [87.22, 89.407], "c21-016": [89.757, 98.78], "c21-017": [99.63, 106.689], "c21-018": [107.039, 115.538], "c21-019": [116.388, 123.863], "c21-020": [124.213, 127.034], "c21-021": [127.384, 132.76], "c21-022": [133.61, 142.67], "c21-023": [143.02, 145.004], "c21-024": [145.354, 151.041], "c21-025": [151.391, 156.256], "c21-026": [157.106, 160.29], "c21-027": [161.14, 171.915], "c21-028": [172.765, 192.99], "c21-029": [193.84, 199.062], "c21-030": [199.912, 205.674], "c21-031": [206.024, 217.072], "c21-032": [217.922, 224.74], "c21-033": [225.09, 229.644], "c21-034": [230.494, 235.502], "c21-035": [236.352, 243.063], "c21-036": [243.413, 248.639], "c21-037": [249.489, 255.61], "c21-038": [256.46, 259.647], "c21-039": [259.997, 265.328], "c21-040": [266.178, 271.249], "c21-041": [271.599, 275.147], "c21-042": [275.497, 278.978], "c21-043": [279.328, 281.609], "c21-044": [281.959, 283.117], "c21-045": [283.467, 286.739], "c21-046": [287.589, 291.042], "c21-047": [291.892, 296.403], "c21-048": [296.753, 298.684], "c21-049": [299.034, 305.404], "c21-050": [305.754, 309.753], "c21-051": [310.103, 315.498], "c21-052": [315.848, 324.628], "c21-053": [324.978, 328.725], "c21-054": [329.075, 333.561], "c21-055": [334.411, 339.659], "c21-056": [340.009, 344.065]}, "blocks": [{"t": "p", "s": [["c21-001", "天黑了，王宫里又摆起了盛大的宴会。"]]}, {"t": "p", "s": [["c21-002", "国王和王后送给奥德修斯许多礼物：漂亮的衣服、金子和一个闪闪发光的铜鼎。"], ["c21-003", "王后还亲自给他准备了一个结实的箱子，把礼物都装了进去，又教他打了一个奇怪的结，谁也解不开。"]]}, {"t": "p", "s": [["c21-004", "奥德修斯从浴室里出来，在宴会大厅门口，遇见了公主瑙西卡。"], ["c21-005", "她站在门柱旁边，看着他。"]]}, {"t": "p", "s": [["c21-006", "瑙西卡说：“再见了，客人。"], ["c21-007", "等你回到了家乡，不要忘了我。"], ["c21-008", "是我第一个救了你。”"]]}, {"t": "p", "s": [["c21-009", "奥德修斯说：“瑙西卡，宙斯的女儿，要是我能回到家乡，我会每天都像向女神祈祷一样，感谢你，因为是你救了我的命。”"]]}, {"t": "p", "s": [["c21-010", "宴会开始了。"], ["c21-011", "传令官把老歌手得摩多科斯领了进来，让他坐在大厅中间，背靠着一根高高的柱子。"]]}, {"t": "p", "s": [["c21-012", "大厅里的火把烧得旺旺的，照得墙上的铜片金光闪闪。"], ["c21-013", "桌子上摆满了烤肉、面包、葡萄和蜂蜜，酒杯碰在一起，叮叮当当地响。"], ["c21-014", "年轻的侍者端着盘子，在人群里穿来穿去。"]]}, {"t": "p", "s": [["c21-015", "得摩多科斯的眼睛看不见。"], ["c21-016", "众神拿走了他的眼睛，却给了他一副天下最好的嗓子，让他能唱出世界上最动听的歌。"]]}, {"t": "p", "s": [["c21-017", "他的头发已经全白了，脸上刻着深深的皱纹，可是嘴角总是带着微笑。"], ["c21-018", "当他拨动琴弦的时候，整个大厅都会安静下来，连最爱说话的人，也会闭上嘴巴。"]]}, {"t": "p", "s": [["c21-019", "奥德修斯从自己的盘子里，切下了一大块最好的烤肉，请传令官送给老歌手。"], ["c21-020", "他说：“请把这块肉送给得摩多科斯。"], ["c21-021", "天下所有的人都应该尊敬歌手，因为是缪斯女神教会了他们唱歌。”"]]}, {"t": "p", "s": [["c21-022", "大家吃完了饭，奥德修斯对得摩多科斯说：“得摩多科斯，你唱得真好，就好像你亲眼看见过特洛伊的战争一样。"], ["c21-023", "请你唱一唱那匹大木马的故事吧。"], ["c21-024", "唱一唱聪明的奥德修斯，是怎样把木马里藏满勇士，让特洛伊人拉进城去的。"], ["c21-025", "你要是能唱得一点不差，我就告诉所有的人，是众神教会了你唱歌。”"]]}, {"t": "img", "src": "images/36.webp?v=2dfdd13963", "vid": "images/36.mp4?v=5706158bb1", "cap": "盲歌手的竖琴", "n": 36}, {"t": "p", "s": [["c21-026", "老歌手拨动了琴弦，唱了起来。"]]}, {"t": "p", "s": [["c21-027", "琴声像水一样流了出来，先是轻轻的，像远处的海浪，然后慢慢变得响亮，像一支军队，正从很远的地方走来。"]]}, {"t": "p", "s": [["c21-028", "他唱希腊人烧掉营帐，坐船离开；唱勇士们藏在木马的肚子里；唱特洛伊人围着木马，吵来吵去，不知道该把它推下悬崖，还是把它当成献给众神的礼物；唱勇士们半夜里从木马里钻出来，打开了城门。"]]}, {"t": "p", "s": [["c21-029", "他唱到聪明勇敢的奥德修斯，唱他怎样冲在最前面。"]]}, {"t": "p", "s": [["c21-030", "他的歌声里有战鼓，有喊杀声，有火把燃烧的噼啪声。"], ["c21-031", "他唱到特洛伊的大火烧红了半边天，唱到街道上乱成一团，唱到勇士们互相呼喊，在黑夜里，向着城中心冲去。"]]}, {"t": "img", "src": "images/37.webp?v=cb8c55a755", "vid": "images/37.mp4?v=04524ed6f6", "cap": "悄悄地哭了", "n": 37}, {"t": "p", "s": [["c21-032", "奥德修斯听着听着，心都碎了，眼泪顺着脸颊流了下来，打湿了他的衣服。"], ["c21-033", "他就像一个妇人，扑在倒下的丈夫身上痛哭一样。"]]}, {"t": "p", "s": [["c21-034", "他用紫色的袍子遮住脸，悄悄地哭，不让别人看见。"]]}, {"t": "p", "s": [["c21-035", "歌声停了下来，他赶紧擦干眼泪，把酒杯倒满，举起来，假装在敬酒。"], ["c21-036", "可是等歌手又唱起来的时候，他的眼泪又悄悄地涌了出来。"]]}, {"t": "p", "s": [["c21-037", "可是国王阿尔基诺奥斯就坐在他的身边，听见了他沉重的叹息。"]]}, {"t": "p", "s": [["c21-038", "国王对大家说：“歌手，请先停一停吧。"], ["c21-039", "从你开始唱歌，我们的客人就一直在哭，他的心里一定有很大的伤心事。”"]]}, {"t": "p", "s": [["c21-040", "国王转过身，看着奥德修斯，问他：“客人，你为什么哭呀？"], ["c21-041", "你听到希腊人在特洛伊的故事，为什么这样伤心？"], ["c21-042", "是不是你的亲人，或者你的好朋友，死在了那里？"], ["c21-043", "请你告诉我们，你叫什么名字？"], ["c21-044", "你的家乡在哪里？"], ["c21-045", "我们的船要把你送回家，船得知道往哪里开呀。”"]]}, {"t": "p", "s": [["c21-046", "奥德修斯擦干了眼泪，站了起来。"]]}, {"t": "img", "src": "images/38.webp?v=feb4be2ba2", "vid": "images/38.mp4?v=01bdf5390c", "cap": "我就是奥德修斯", "n": 38}, {"t": "p", "s": [["c21-047", "奥德修斯说：“国王，要我先说什么，后说什么呢？"], ["c21-048", "众神让我吃的苦实在太多了。"], ["c21-049", "我先告诉你们我的名字吧，这样以后，就算我回到了遥远的家乡，我们也还是朋友。"], ["c21-050", "我就是奥德修斯，拉厄尔忒斯的儿子，伊萨卡的国王。"], ["c21-051", "我的聪明，全世界的人都知道，我的名声，一直传到了天上。"], ["c21-052", "我的家乡伊萨卡，是一座远在西边大海上的小岛，岛上到处是石头，可是那里长大的孩子，个个都很结实。"], ["c21-053", "对我来说，世界上再也没有比家乡更可爱的地方了。"], ["c21-054", "现在，让我把这十年里遇到的事情，从头讲给你们听吧。”"]]}, {"t": "p", "s": [["c21-055", "大厅里一下子安静下来，连一根针掉在地上都能听见。"], ["c21-056", "大家都竖起耳朵，听奥德修斯讲他的故事。"]]}]}, {"title": "第二十二章　吃了忘忧果的人", "head": "c22-h", "audio": "audio/ch22.m4a?v=06a45dbb69", "duration": 343.417, "times": {"c22-h": [0.0, 3.03], "c22-001": [4.03, 7.661], "c22-002": [8.511, 15.28], "c22-003": [15.63, 23.537], "c22-004": [24.387, 30.49], "c22-005": [30.84, 37.276], "c22-006": [38.127, 44.112], "c22-007": [44.462, 50.416], "c22-008": [50.766, 55.401], "c22-009": [55.751, 62.319], "c22-010": [63.169, 66.151], "c22-011": [66.501, 72.382], "c22-012": [72.732, 80.762], "c22-013": [81.612, 86.942], "c22-014": [87.292, 95.443], "c22-015": [96.293, 100.86], "c22-016": [101.21, 110.503], "c22-017": [110.853, 117.889], "c22-018": [118.739, 122.738], "c22-019": [123.588, 133.968], "c22-020": [134.318, 138.024], "c22-021": [138.374, 145.181], "c22-022": [146.031, 154.116], "c22-023": [154.466, 163.871], "c22-024": [164.721, 168.022], "c22-025": [168.372, 180.139], "c22-026": [180.989, 184.601], "c22-027": [185.451, 193.833], "c22-028": [194.183, 198.998], "c22-029": [199.848, 205.136], "c22-030": [205.486, 213.942], "c22-031": [214.792, 221.591], "c22-032": [221.941, 233.833], "c22-033": [234.683, 238.546], "c22-034": [238.896, 239.779], "c22-035": [240.629, 244.973], "c22-036": [245.323, 251.704], "c22-037": [252.554, 254.146], "c22-038": [254.496, 255.556], "c22-039": [255.906, 258.302], "c22-040": [259.152, 263.177], "c22-041": [263.527, 268.368], "c22-042": [268.718, 276.173], "c22-043": [276.523, 280.363], "c22-044": [281.213, 282.928], "c22-045": [283.278, 294.931], "c22-046": [295.781, 303.834], "c22-047": [304.184, 306.799], "c22-048": [307.649, 315.027], "c22-049": [315.377, 322.355], "c22-050": [322.705, 329.729], "c22-051": [330.579, 335.708], "c22-052": [336.058, 341.917]}, "blocks": [{"t": "p", "s": [["c22-001", "奥德修斯讲起了离开特洛伊以后的事。"]]}, {"t": "p", "s": [["c22-002", "大厅里的火把轻轻地跳动着，把他的影子投在墙上，拉得很长很长。"], ["c22-003", "他把杯子放下，双手放在膝盖上，目光望着很远的地方，好像又回到了那片风浪里。"]]}, {"t": "img", "src": "images/39.webp?v=93f7c2a918", "vid": "images/39.mp4?v=3b8c4e3d17", "cap": "忘忧果", "n": 39}, {"t": "p", "s": [["c22-004", "原来，船队被北风吹离了航线以后，在海上漂了九天九夜。"], ["c22-005", "到了第十天，他们来到了一个陌生的地方，那里住着吃忘忧果的人。"]]}, {"t": "p", "s": [["c22-006", "那九天九夜里，海风像发了疯一样，吹得桅杆吱吱嘎嘎地叫。"], ["c22-007", "浪头一次又一次地盖过船舷，船舱里的水怎么舀也舀不干。"], ["c22-008", "伙伴们互相抱在一起，谁也不敢睁眼，不敢说话。"], ["c22-009", "只有奥德修斯，一直站在舵边，眼睛一眨不眨地盯着前方。"]]}, {"t": "p", "s": [["c22-010", "到了第十天，风忽然停了。"], ["c22-011", "远处的海面上，露出了一条细细的绿线，那是一片陆地。"], ["c22-012", "伙伴们都高兴得跳了起来，有人哭，有人笑，有人跪在甲板上，向天空谢恩。"]]}, {"t": "p", "s": [["c22-013", "大家上了岸，打来了清清的泉水，在船边吃了午饭。"], ["c22-014", "奥德修斯挑了两个伙伴，又派了一个传令官，让他们三个人到岸上去，看看这里住的是什么人。"]]}, {"t": "p", "s": [["c22-015", "岸边的沙子又细又白，踩上去软软的。"], ["c22-016", "远处的山坡上，开满了不知名的花，红的、黄的、紫的，连成一片，像一块巨大的花毯。"], ["c22-017", "空气里有一股淡淡的甜香，闻一口，就让人觉得浑身懒洋洋的。"]]}, {"t": "p", "s": [["c22-018", "那里的人很和善，一点儿也没有想要害他们。"]]}, {"t": "img", "src": "images/40.webp?v=47051e3c58", "vid": "images/40.mp4?v=f4a854ef78", "cap": "拖回船上", "n": 40}, {"t": "p", "s": [["c22-019", "他们说话的声音又轻又软，一句话常常要拖得老长，听着听着，连困意也跟着爬了上来。"], ["c22-020", "他们热情地拿出一种果子，请三个伙伴吃。"], ["c22-021", "那种果子金黄金黄的，像蜂蜜一样甜，名叫忘忧果。"]]}, {"t": "p", "s": [["c22-022", "那些人穿着浅色的长袍，脸上总是带着笑，说话慢吞吞的，好像从来没有什么烦恼。"], ["c22-023", "他们住在用花枝搭成的小屋里，一天到晚，只是坐在树荫下，吃吃果子，聊聊天，看看天上的云。"]]}, {"t": "p", "s": [["c22-024", "谁吃了这种果子，就会把什么都忘了。"], ["c22-025", "忘了自己是从哪里来的，忘了家乡，忘了亲人，也忘了回家的路，只想留在那里，天天和那些人在一起，吃甜甜的忘忧果。"]]}, {"t": "p", "s": [["c22-026", "三个伙伴吃了忘忧果，就再也不想回来了。"]]}, {"t": "p", "s": [["c22-027", "他们坐在花丛里，笑得那么轻松，那么满足，好像世界上所有的烦恼，都和他们没有关系了。"], ["c22-028", "远处的海浪声，听起来也像是一首遥远的歌。"]]}, {"t": "p", "s": [["c22-029", "奥德修斯等了好久，也不见他们回来，就自己找了过去。"], ["c22-030", "他看见三个伙伴坐在花丛里，一边吃着忘忧果，一边傻乎乎地笑，叫他们也不答应。"]]}, {"t": "p", "s": [["c22-031", "他们的眼睛里，没有一点点光，就像在做一个永远醒不来的梦。"], ["c22-032", "奥德修斯蹲下去，摇着他们的肩膀，大声叫着他们的名字，一个一个地叫，可是他们只是笑笑，又继续低头吃果子。"]]}, {"t": "p", "s": [["c22-033", "奥德修斯对他们说：“伙伴们，快跟我回船上去！"], ["c22-034", "我们还要回家呢！”"]]}, {"t": "p", "s": [["c22-035", "他的声音有些沙哑，伸出去的手，微微地发着抖。"], ["c22-036", "他看着伙伴们那一张张笑得傻傻的脸，心里又心疼，又着急。"]]}, {"t": "p", "s": [["c22-037", "伙伴们说：“回家？"], ["c22-038", "回什么家？"], ["c22-039", "这里多好啊，我们哪儿也不去了！”"]]}, {"t": "p", "s": [["c22-040", "奥德修斯没有办法，只好用力把他们拖回船上。"], ["c22-041", "三个伙伴哭着喊着，拼命挣扎，不肯走。"], ["c22-042", "奥德修斯把他们绑在船舱的长凳底下，然后对其他伙伴们说：“快上船，快划桨！"], ["c22-043", "谁也不许再吃忘忧果，不然你们也会忘记回家的！”"]]}, {"t": "p", "s": [["c22-044", "他的心里难受极了。"], ["c22-045", "他一向不愿意对伙伴们用这样的办法，可是他知道，如果这一次不狠心，他们就会永远留在这片温柔的陷阱里，再也回不了家。"]]}, {"t": "p", "s": [["c22-046", "伙伴们赶紧上了船，坐在长凳上，一起划起桨来，白色的浪花在船桨下翻滚。"], ["c22-047", "船很快就离开了那片海岸。"]]}, {"t": "p", "s": [["c22-048", "船离岸越来越远，那片花海渐渐变成了天边一抹淡淡的彩色。"], ["c22-049", "被绑着的三个伙伴，慢慢地安静下来，过了好久，才一个一个地哭了起来。"], ["c22-050", "他们不知道自己为什么哭，只是觉得心里空空的，好像丢了一件很重要的东西。"]]}, {"t": "p", "s": [["c22-051", "奥德修斯坐在他们旁边，默默地把手放在他们的头上。"], ["c22-052", "他想：有些东西，看起来最甜、最温柔，反而最危险。"]]}]}, {"title": "第二十三章　独眼巨人的山洞", "head": "c23-h", "audio": "audio/ch23.m4a?v=0c514f5c43", "duration": 410.999, "times": {"c23-h": [0.0, 3.435], "c23-001": [4.435, 8.997], "c23-002": [9.847, 19.103], "c23-003": [19.453, 26.152], "c23-004": [27.002, 35.121], "c23-005": [35.471, 42.306], "c23-006": [43.156, 48.294], "c23-007": [48.644, 54.516], "c23-008": [55.366, 64.336], "c23-009": [65.186, 71.052], "c23-010": [71.402, 79.519], "c23-011": [80.369, 83.629], "c23-012": [83.979, 91.212], "c23-013": [92.062, 94.468], "c23-014": [94.818, 106.389], "c23-015": [107.239, 113.204], "c23-016": [113.554, 119.258], "c23-017": [119.608, 123.224], "c23-018": [124.074, 132.128], "c23-019": [132.478, 140.514], "c23-020": [141.364, 145.621], "c23-021": [146.471, 150.331], "c23-022": [150.681, 157.125], "c23-023": [157.475, 167.683], "c23-024": [168.533, 171.304], "c23-025": [171.654, 182.893], "c23-026": [183.743, 190.128], "c23-027": [190.978, 192.873], "c23-028": [193.223, 199.485], "c23-029": [200.335, 203.616], "c23-030": [204.466, 210.795], "c23-031": [211.645, 214.042], "c23-032": [214.892, 217.178], "c23-033": [217.528, 222.411], "c23-034": [222.761, 226.632], "c23-035": [227.482, 234.596], "c23-036": [234.946, 238.646], "c23-037": [239.496, 244.017], "c23-038": [244.367, 249.453], "c23-039": [253.425, 257.573], "c23-040": [258.423, 268.786], "c23-041": [269.636, 275.479], "c23-042": [276.329, 280.808], "c23-043": [281.158, 282.127], "c23-044": [282.477, 285.699], "c23-045": [286.549, 289.682], "c23-046": [290.032, 293.43], "c23-047": [294.28, 301.862], "c23-048": [302.212, 306.593], "c23-049": [307.443, 312.288], "c23-050": [312.638, 317.162], "c23-051": [317.512, 319.392], "c23-052": [320.243, 326.173], "c23-053": [326.523, 333.925], "c23-054": [334.275, 337.112], "c23-055": [337.462, 340.469], "c23-056": [341.319, 346.068], "c23-057": [346.418, 352.036], "c23-058": [352.886, 354.709], "c23-059": [355.059, 366.014], "c23-060": [366.864, 374.481], "c23-061": [375.331, 378.334], "c23-062": [378.684, 383.672], "c23-063": [384.022, 392.951], "c23-064": [393.801, 398.244], "c23-065": [398.594, 405.381], "c23-066": [405.731, 409.499]}, "blocks": [{"t": "p", "s": [["c23-001", "他们又在海上航行了好几天，来到了独眼巨人住的地方。"]]}, {"t": "p", "s": [["c23-002", "独眼巨人是一群又高又大的巨人，他们不种地，也不盖房子，每个人都住在高山上的山洞里。"], ["c23-003", "他们没有法律，也不开大会，谁也不管谁，各自管着自己的老婆孩子。"]]}, {"t": "p", "s": [["c23-004", "他们的田里不用耕、不用种，麦子和葡萄自己就会长出来，雨水一浇，又肥又壮。"], ["c23-005", "他们也不怕冷、不怕热，一年到头，赶着羊群，在山坡上走来走去。"]]}, {"t": "p", "s": [["c23-006", "在独眼巨人的岛对面，有一座小小的、长满了树的岛。"], ["c23-007", "岛上有很多很多野山羊，因为从来没有猎人到这里来打猎。"]]}, {"t": "p", "s": [["c23-008", "那天夜里，天黑得伸手不见五指，雅典娜带着他们的船，悄悄地靠上了小岛的沙滩。"]]}, {"t": "p", "s": [["c23-009", "第二天早上，大家在小岛上打了很多野山羊，美美地吃了一顿。"], ["c23-010", "他们望着对面的大岛，能看见那边山洞口冒出的炊烟，还能听见羊群咩咩的叫声。"]]}, {"t": "p", "s": [["c23-011", "奥德修斯说：“伙伴们，你们留在这里。"], ["c23-012", "我带着我的船，到对面去看看，那里住的是什么人，是凶恶野蛮的人，还是热情好客的人。”"]]}, {"t": "img", "src": "images/41.webp?v=68e4b954bc", "vid": "images/41.mp4?v=e8c4fd1a96", "cap": "巨人的山洞", "n": 41}, {"t": "p", "s": [["c23-013", "他们划船到了对面的岛上。"], ["c23-014", "在海边的一个高高的悬崖下面，他们看见了一个大山洞，洞口长着月桂树，洞外用大石头和高大的松树、橡树围成了一个大羊圈。"]]}, {"t": "p", "s": [["c23-015", "羊圈里的石头，一块比一块大，每一块都像一间小屋子。"], ["c23-016", "树干粗得要几个人才能合抱，树皮上长着厚厚的青苔。"], ["c23-017", "伙伴们小声地说：“这到底是谁家的院子啊？”"]]}, {"t": "p", "s": [["c23-018", "奥德修斯挑了十二个最勇敢的伙伴，带上一皮袋又香又浓的好酒，向山洞走去。"], ["c23-019", "这皮袋酒，是一个祭司送给他的，只要倒一杯，掺上二十杯水，满屋子都能闻到香味。"]]}, {"t": "p", "s": [["c23-020", "山洞的主人不在家，他到山上放羊去了。"]]}, {"t": "p", "s": [["c23-021", "洞里有一股浓浓的羊膻味和奶酪的酸味。"], ["c23-022", "伙伴们东看看，西摸摸，谁也不敢大声说话，连脚步都踮着。"], ["c23-023", "他们觉得这里的一切都大得出奇：奶酪筐像澡盆，羊奶桶像小水缸，连挂在墙上的一根绳子，都有手臂那么粗。"]]}, {"t": "p", "s": [["c23-024", "大家走进山洞，到处看了看。"], ["c23-025", "洞里有一筐一筐的奶酪，一桶一桶的羊奶，一圈一圈的小羊羔，大的、中的、小的，分开关在不同的羊圈里。"]]}, {"t": "p", "s": [["c23-026", "伙伴们说：“奥德修斯，我们拿一些奶酪，赶走几只小羊，快点回船上去吧！”"]]}, {"t": "p", "s": [["c23-027", "可是奥德修斯不肯走。"], ["c23-028", "他想看看山洞的主人是什么样子，说不定主人还会送给他们礼物呢。"]]}, {"t": "p", "s": [["c23-029", "这个主意，后来让他们吃尽了苦头。"]]}, {"t": "img", "src": "images/42.webp?v=5c040cb8ed", "vid": "images/42.mp4?v=7be6b2c2be", "cap": "独眼巨人回来了", "n": 42}, {"t": "p", "s": [["c23-030", "他们生起了火，吃了一点奶酪，坐在山洞里等着主人回来。"]]}, {"t": "p", "s": [["c23-031", "傍晚，山洞的主人回来了。"]]}, {"t": "p", "s": [["c23-032", "他是一个像山一样高的巨人。"], ["c23-033", "他的额头正中间，只长着一只又大又圆的眼睛。"], ["c23-034", "他叫波吕斐摩斯，是海神波塞冬的儿子。"]]}, {"t": "p", "s": [["c23-035", "巨人背着一大捆干树枝，往地上一扔，轰隆一声，整个山洞都震动了。"], ["c23-036", "伙伴们吓得都躲到了山洞最里面的角落里。"]]}, {"t": "img", "src": "images/43.webp?v=dfb8472c59", "vid": "images/43.mp4?v=4dd387e670", "cap": "堵住洞口", "n": 43}, {"t": "p", "s": [["c23-037", "巨人把母羊赶进山洞，把公羊留在外面的羊圈里。"], ["c23-038", "然后，他搬起一块大石头，把洞口堵得严严实实。"], ["c23-039", "那块石头，二十二辆四个轮子的大车也拉不动。"]]}, {"t": "p", "s": [["c23-040", "巨人坐下来，一只一只地挤羊奶，把一半羊奶做成奶酪，放进柳条筐里，另一半留着当晚饭喝。"]]}, {"t": "p", "s": [["c23-041", "忙完了这些，他生起了火，一下子看见了躲在角落里的人。"]]}, {"t": "p", "s": [["c23-042", "他看见了他们，大吼一声：“陌生人，你们是什么人？"], ["c23-043", "从哪里来？"], ["c23-044", "是做生意的，还是到处抢东西的海盗？”"]]}, {"t": "p", "s": [["c23-045", "伙伴们的心都吓得怦怦直跳。"], ["c23-046", "巨人的声音那么低沉，样子那么可怕。"]]}, {"t": "p", "s": [["c23-047", "他的影子投在山洞的墙上，黑压压的一大片，把洞里的火光都挡住了一半。"], ["c23-048", "他每走一步，地上的小石子就跟着跳一下。"]]}, {"t": "p", "s": [["c23-049", "奥德修斯说：“我们是希腊人，从特洛伊回家，被大风吹到了这里。"], ["c23-050", "我们来到你的面前，是请你按照众神的规矩，好好招待客人。"], ["c23-051", "宙斯会惩罚那些欺负客人的人。”"]]}, {"t": "p", "s": [["c23-052", "巨人说：“陌生人，你真是个傻瓜，还是从很远的地方来的？"], ["c23-053", "我们独眼巨人才不怕宙斯，也不怕别的神，因为我们比他们强大得多。"], ["c23-054", "告诉我，你们的船停在哪里？"], ["c23-055", "是在海边，还是在附近？”"]]}, {"t": "p", "s": [["c23-056", "奥德修斯一听，就知道巨人想去毁掉他们的船。"], ["c23-057", "他说：“我们的船被海神撞碎在礁石上了，只有我们几个人逃了出来。”"]]}, {"t": "p", "s": [["c23-058", "巨人一句话也没有说。"], ["c23-059", "他伸出两只大手，一把抓住两个伙伴，把他们当成晚饭吃掉了，然后喝了一大桶羊奶，躺在羊群中间，呼呼大睡。"]]}, {"t": "p", "s": [["c23-060", "剩下的人吓得浑身发抖，抱在一起，向宙斯祈祷，可是谁也想不出办法。"]]}, {"t": "img", "src": "images/44.webp?v=406b80004f", "vid": "images/44.mp4?v=0d8f4813c8", "cap": "巨人睡着了", "n": 44}, {"t": "p", "s": [["c23-061", "这一夜，山洞里黑得像墨汁。"], ["c23-062", "巨人的鼾声一阵一阵地传来，像远处滚过的雷。"], ["c23-063", "没有人睡得着，大家睁着眼睛，听着自己的心跳声，一个一个地数着，数着又少了谁。"]]}, {"t": "p", "s": [["c23-064", "奥德修斯想拔出宝剑，刺进巨人的胸口。"], ["c23-065", "可是他又一想：要是巨人死了，谁能搬开那块堵着洞口的大石头呢？"], ["c23-066", "那样，大家就要永远被关在山洞里了。"]]}]}, {"title": "第二十四章　“没有人”", "head": "c24-h", "audio": "audio/ch24.m4a?v=0bfb049562", "duration": 436.535, "times": {"c24-h": [0.0, 2.342], "c24-001": [3.342, 4.391], "c24-002": [4.741, 10.107], "c24-003": [10.957, 23.301], "c24-004": [24.151, 27.099], "c24-005": [27.949, 32.337], "c24-006": [32.687, 35.37], "c24-007": [36.22, 43.981], "c24-008": [44.331, 48.17], "c24-009": [48.52, 55.786], "c24-010": [56.636, 66.922], "c24-011": [67.272, 73.505], "c24-012": [74.355, 79.927], "c24-013": [80.277, 88.357], "c24-014": [89.207, 92.87], "c24-015": [93.22, 101.532], "c24-016": [101.882, 107.05], "c24-017": [107.9, 115.244], "c24-018": [116.094, 122.461], "c24-019": [123.311, 125.661], "c24-020": [126.011, 132.221], "c24-021": [133.071, 138.838], "c24-022": [139.688, 144.121], "c24-023": [144.971, 152.288], "c24-024": [152.638, 160.077], "c24-025": [160.427, 161.384], "c24-026": [162.234, 164.797], "c24-027": [165.147, 168.131], "c24-028": [168.981, 174.847], "c24-029": [175.197, 184.569], "c24-030": [185.419, 189.791], "c24-031": [190.141, 191.521], "c24-032": [191.871, 197.272], "c24-033": [197.622, 203.216], "c24-034": [204.066, 208.772], "c24-035": [209.122, 212.785], "c24-036": [213.635, 216.385], "c24-037": [217.235, 220.303], "c24-038": [220.653, 225.022], "c24-039": [225.872, 231.162], "c24-040": [231.512, 237.419], "c24-041": [238.269, 245.599], "c24-042": [245.949, 249.655], "c24-043": [250.505, 253.262], "c24-044": [253.612, 258.327], "c24-045": [258.677, 266.634], "c24-046": [267.484, 274.123], "c24-047": [274.473, 276.549], "c24-048": [277.399, 287.816], "c24-049": [288.666, 296.482], "c24-050": [297.332, 301.351], "c24-051": [305.394, 308.502], "c24-052": [309.352, 313.002], "c24-053": [313.352, 321.606], "c24-054": [321.956, 325.312], "c24-055": [326.162, 334.534], "c24-056": [335.384, 340.765], "c24-057": [341.615, 346.217], "c24-058": [346.567, 350.474], "c24-059": [350.824, 352.176], "c24-060": [352.526, 353.854], "c24-061": [354.704, 357.594], "c24-062": [357.944, 360.144], "c24-063": [360.994, 364.219], "c24-064": [364.569, 368.238], "c24-065": [368.588, 370.536], "c24-066": [371.386, 373.793], "c24-067": [374.643, 382.365], "song-nobody": [383.565, 389.565], "song-nobody-01": [389.565, 394.425], "song-nobody-02": [394.425, 398.565], "song-nobody-03": [398.565, 414.825], "song-nobody-04": [414.825, 414.825], "song-nobody-05": [414.825, 419.405], "song-nobody-06": [419.405, 421.905], "song-nobody-07": [421.905, 426.265], "song-nobody-08": [426.265, 429.685]}, "blocks": [{"t": "p", "s": [["c24-001", "天亮了。"], ["c24-002", "巨人醒过来，生起火，又挤了羊奶，又抓走了两个伙伴。"]]}, {"t": "p", "s": [["c24-003", "吃完早饭，他轻轻松松地搬开大石头，把羊群赶了出去，然后又把大石头放回洞口，就像人们给箭袋盖上盖子一样容易。"]]}, {"t": "p", "s": [["c24-004", "他吹着口哨，赶着羊群上山去了。"]]}, {"t": "p", "s": [["c24-005", "奥德修斯被关在山洞里，一直在想办法。"], ["c24-006", "最后，他终于想出了一个主意。"]]}, {"t": "p", "s": [["c24-007", "他在山洞里走来走去，手指一下一下地敲着额头，眼睛盯着每一个角落。"], ["c24-008", "羊圈、石头、木桶、火塘……"], ["c24-009", "他把所有的东西，都仔仔细细地看了一遍，好像在下一盘很大很大的棋。"]]}, {"t": "p", "s": [["c24-010", "山洞的羊圈旁边，放着一根巨人砍来的橄榄树干，还是绿的，巨人打算等它干了以后，当成手杖用。"], ["c24-011", "那根树干，又粗又长，就像一条有二十支桨的大船的桅杆。"]]}, {"t": "p", "s": [["c24-012", "奥德修斯砍下了一大段，交给伙伴们，让他们把它削光滑。"], ["c24-013", "他自己把它的一头削尖，放在火里烤得又干又硬，然后藏在了山洞里厚厚的羊粪底下。"]]}, {"t": "p", "s": [["c24-014", "伙伴们的手都在发抖，可是谁也不敢出声。"], ["c24-015", "斧头一下一下地削着木头，木屑落在地上，被他们用脚悄悄地踩进了土里。"], ["c24-016", "他们一边干活，一边竖着耳朵，听着洞外有没有动静。"]]}, {"t": "img", "src": "images/45.webp?v=e7f705d8b1", "vid": "images/45.mp4?v=f00be972b5", "cap": "削尖的木桩", "n": 45}, {"t": "p", "s": [["c24-017", "奥德修斯说：“现在，我们抽签吧，看谁和我一起，把这根木桩，扎进巨人的眼睛里。”"]]}, {"t": "p", "s": [["c24-018", "抽签选出了四个最勇敢的伙伴，正是奥德修斯心里最想选的那四个。"]]}, {"t": "p", "s": [["c24-019", "傍晚，巨人又回来了。"], ["c24-020", "这一次，他把所有的羊都赶进了山洞，一只也没有留在外面。"]]}, {"t": "p", "s": [["c24-021", "他又搬起大石头堵住洞口，挤完了羊奶，又抓走了两个伙伴。"]]}, {"t": "img", "src": "images/46.webp?v=4f5f8f63d9", "vid": "images/46.mp4?v=29b8b55208", "cap": "请巨人喝酒", "n": 46}, {"t": "p", "s": [["c24-022", "这时，奥德修斯端着一大碗酒，走到巨人面前。"]]}, {"t": "p", "s": [["c24-023", "奥德修斯端着一大碗酒，递给他说：“巨人，你吃完了人肉，再尝尝我们的好酒吧！"], ["c24-024", "这是我们船上最好的酒，我本来是带给你当礼物的，希望你可怜可怜我们，放我们回家。"], ["c24-025", "可是你太凶了。”"]]}, {"t": "p", "s": [["c24-026", "巨人接过来，一口气就喝光了。"], ["c24-027", "他高兴得咂咂嘴，又伸出碗来。"]]}, {"t": "p", "s": [["c24-028", "酒的香味一下子在山洞里散开了，像一团暖暖的雾。"], ["c24-029", "巨人闭着那只大眼睛，满足地叹了一口气，摸了摸自己的大肚子，脸上露出了孩子一样的笑容。"]]}, {"t": "p", "s": [["c24-030", "巨人说：“好酒，好酒！"], ["c24-031", "再给我一碗！"], ["c24-032", "告诉我你的名字，我要送你一件礼物，让你高兴高兴。"], ["c24-033", "我们这里也有葡萄酒，可是你这酒，简直就是仙酒！”"]]}, {"t": "p", "s": [["c24-034", "奥德修斯给他倒了一碗，又倒了一碗，又倒了一碗。"], ["c24-035", "巨人一连喝了三大碗，喝得醉醺醺的。"]]}, {"t": "p", "s": [["c24-036", "他醉醺醺地问：“你叫什么名字？”"]]}, {"t": "img", "src": "images/47.webp?v=a1e10c361d", "vid": "images/47.mp4?v=e1848734a5", "cap": "我叫“没有人”", "n": 47}, {"t": "p", "s": [["c24-037", "奥德修斯说：“我的名字叫‘没有人’。"], ["c24-038", "我的爸爸、妈妈，还有我的伙伴们，都叫我‘没有人’。”"]]}, {"t": "p", "s": [["c24-039", "巨人说：“好，‘没有人’，我最后一个吃你！"], ["c24-040", "先吃你的伙伴们，最后再吃你，这就是我送给你的礼物！”"]]}, {"t": "p", "s": [["c24-041", "说完，他仰面朝天，倒在地上，粗粗的脖子歪在一边，睡着了。"], ["c24-042", "他的鼾声像打雷一样，整个山洞都在响。"]]}, {"t": "p", "s": [["c24-043", "酒气从他嘴里一阵一阵地喷出来。"], ["c24-044", "他嘴里还含着一块没嚼完的东西，舌头软软地耷拉着。"], ["c24-045", "伙伴们看得又害怕，又难过，也有一点点恶心，一个个把脸转到了一边。"]]}, {"t": "p", "s": [["c24-046", "奥德修斯从羊粪底下拿出木桩，把它的尖头插进火堆里，烧得通红通红。"], ["c24-047", "他鼓励伙伴们，不要害怕。"]]}, {"t": "p", "s": [["c24-048", "木桩快要烧着了，奥德修斯和伙伴们一起抬起它，冲到巨人身边，用力把烧红的尖头，扎进了巨人的那只大眼睛里。"]]}, {"t": "p", "s": [["c24-049", "奥德修斯在上面使劲地转着木桩，就像木匠用钻子在木板上钻孔一样。"]]}, {"t": "img", "src": "images/48.webp?v=5f387fe385", "vid": "images/48.mp4?v=01edf60d46", "cap": "巨人疼得大叫", "n": 48}, {"t": "p", "s": [["c24-050", "巨人疼得大叫，叫声在山里轰隆隆地回响。"], ["c24-051", "伙伴们吓得赶紧逃到山洞的角落里。"]]}, {"t": "p", "s": [["c24-052", "烧焦的味道弥漫开来，呛得人喘不过气。"], ["c24-053", "巨人在地上翻来滚去，手脚乱挥，山洞里的瓦罐被他踢得稀里哗啦碎了一地。"], ["c24-054", "羊群被吓得四处乱窜，咩咩直叫。"]]}, {"t": "p", "s": [["c24-055", "巨人把木桩从眼睛里拔出来，扔得远远的，然后大声呼喊住在附近山洞里的独眼巨人们。"]]}, {"t": "p", "s": [["c24-056", "别的巨人听见了，从四面八方跑过来，围在洞口外面。"]]}, {"t": "p", "s": [["c24-057", "别的巨人跑过来，在洞外问：“波吕斐摩斯，是谁在害你？"], ["c24-058", "你为什么在这安静的夜里大喊大叫，吵得我们都睡不着觉？"], ["c24-059", "是不是有人偷你的羊？"], ["c24-060", "是不是有人想害死你？”"]]}, {"t": "img", "src": "images/49.webp?v=b11a8ae1d2", "vid": "images/49.mp4?v=1cb68d796d", "cap": "没有人在害我", "n": 49}, {"t": "p", "s": [["c24-061", "巨人在洞里喊：“没有人在害我！"], ["c24-062", "没有人用诡计害我！”"]]}, {"t": "p", "s": [["c24-063", "别的巨人说：“既然没有人害你，那你就别吵了！"], ["c24-064", "你要是生病了，那是宙斯让你生的病，谁也帮不了你。"], ["c24-065", "你还是向你的父亲海神祈祷吧！”"]]}, {"t": "p", "s": [["c24-066", "说完，他们都回家睡觉去了。"]]}, {"t": "p", "s": [["c24-067", "奥德修斯在心里偷偷地笑了：他的这个名字，他的这个好主意，把巨人们都骗过去了。"]]}, {"t": "song", "title": "我叫“没有人”", "head": "song-nobody", "lines": [["song-nobody-01", "巨人问我叫什么名字"], ["song-nobody-02", "我眨眨眼睛慢慢地说"], ["song-nobody-03", "我的名字呀，叫“没有人”"], ["song-nobody-04", "爸爸妈妈都这么叫我"], ["song-nobody-05", "没有人，没有人"], ["song-nobody-06", "没有人在害我"], ["song-nobody-07", "巨人在洞里大喊大叫"], ["song-nobody-08", "没有人，哈哈哈"]]}]}, {"title": "第二十五章　藏在羊肚子底下", "head": "c25-h", "audio": "audio/ch25.m4a?v=1b059b50b9", "duration": 369.599, "times": {"c25-h": [0.0, 3.616], "c25-001": [4.616, 13.19], "c25-002": [13.54, 17.735], "c25-003": [18.585, 24.876], "c25-004": [25.226, 30.333], "c25-005": [31.183, 34.159], "c25-006": [35.009, 38.856], "c25-007": [39.206, 48.191], "c25-008": [48.541, 52.027], "c25-009": [52.877, 59.552], "c25-010": [59.902, 66.983], "c25-011": [67.333, 75.046], "c25-012": [75.896, 79.296], "c25-013": [79.646, 90.859], "c25-014": [91.709, 95.723], "c25-015": [96.573, 101.468], "c25-016": [101.818, 108.934], "c25-017": [109.284, 114.815], "c25-018": [115.665, 121.875], "c25-019": [122.225, 127.197], "c25-020": [127.547, 131.411], "c25-021": [132.261, 137.632], "c25-022": [137.982, 140.153], "c25-023": [141.003, 145.724], "c25-024": [146.074, 156.746], "c25-025": [157.096, 160.486], "c25-026": [160.836, 163.453], "c25-027": [163.803, 169.704], "c25-028": [170.054, 175.223], "c25-029": [175.573, 180.738], "c25-030": [181.588, 183.865], "c25-031": [184.715, 188.071], "c25-032": [188.421, 193.407], "c25-033": [194.257, 198.004], "c25-034": [198.354, 205.206], "c25-035": [206.056, 210.981], "c25-036": [211.331, 216.957], "c25-037": [217.307, 223.838], "c25-038": [224.688, 229.407], "c25-039": [229.757, 233.453], "c25-040": [234.303, 237.995], "c25-041": [238.345, 248.029], "c25-042": [248.379, 250.787], "c25-043": [251.637, 254.16], "c25-044": [254.51, 260.756], "c25-045": [261.606, 268.543], "c25-046": [268.893, 275.593], "c25-047": [276.443, 283.617], "c25-048": [283.967, 292.711], "c25-049": [293.561, 298.232], "c25-050": [298.582, 301.964], "c25-051": [302.814, 307.159], "c25-052": [308.009, 311.9], "c25-053": [312.25, 319.42], "c25-054": [320.27, 326.152], "c25-055": [326.502, 331.033], "c25-056": [331.383, 341.688], "c25-057": [342.538, 345.537], "c25-058": [346.387, 353.562], "c25-059": [353.912, 362.319], "c25-060": [363.169, 368.099]}, "blocks": [{"t": "p", "s": [["c25-001", "巨人疼得哼哼着，摸索着走到洞口，搬开了大石头，然后伸开两只大手，坐在洞口。"], ["c25-002", "他想等着，看看有没有人想混在羊群里溜出去。"]]}, {"t": "p", "s": [["c25-003", "他的脸上全是汗，那只受了伤的眼睛，还在一缩一缩地疼。"], ["c25-004", "他靠着洞壁，嘴里咬牙切齿地嘟囔着，像一头被困住的熊。"]]}, {"t": "p", "s": [["c25-005", "可是奥德修斯早就想好了办法。"]]}, {"t": "p", "s": [["c25-006", "他在黑暗里一直没有睡，脑子里转个不停。"], ["c25-007", "他想起了在特洛伊战场上，那么多次的危险，那么多次，他都靠着一点点聪明，逃了出来。"], ["c25-008", "他告诉自己：这一次，也一定行。"]]}, {"t": "img", "src": "images/50.webp?v=064b8a1c4b", "vid": "images/50.mp4?v=454c100ba3", "cap": "藏在羊肚子底下", "n": 50}, {"t": "p", "s": [["c25-009", "山洞里有一群又肥又壮的大公羊，身上长着又厚又长的黑色羊毛。"], ["c25-010", "奥德修斯用巨人睡觉的柳条，悄悄地把公羊三只三只地绑在一起。"], ["c25-011", "中间那只羊的肚子底下，绑着一个伙伴，两边的两只羊，挡住他，不让巨人摸到。"]]}, {"t": "p", "s": [["c25-012", "最后，只剩下奥德修斯自己了。"], ["c25-013", "他挑了羊群里最大、最壮的那只公羊，钻到它毛茸茸的肚子底下，两只手紧紧地抓住它的羊毛，脸朝上，紧紧地贴着。"]]}, {"t": "p", "s": [["c25-014", "他们就这样，一动也不敢动，等着天亮。"]]}, {"t": "p", "s": [["c25-015", "羊毛里有一股浓浓的膻味，熏得人直想打喷嚏。"], ["c25-016", "他们咬着牙，屏住呼吸，听着自己的心跳声一下一下地敲着胸口。"], ["c25-017", "时间过得又慢又长，每一个瞬间，都像是一整天。"]]}, {"t": "p", "s": [["c25-018", "天亮了，公羊们急着出去吃草，一只一只地往洞口走去。"], ["c25-019", "巨人伸着两只大手，一只一只地摸着走出去的羊背。"], ["c25-020", "他怎么也没有想到，人就绑在羊的肚子底下。"]]}, {"t": "p", "s": [["c25-021", "最后，那只最大的公羊驮着奥德修斯，慢慢地走了出来。"], ["c25-022", "巨人一把摸住了它的背。"]]}, {"t": "p", "s": [["c25-023", "巨人说：“我的好公羊，你为什么最后一个出来？"], ["c25-024", "你以前从来不落在别的羊后面，总是第一个跑去吃嫩草，第一个跑到小河边喝水，晚上第一个跑回羊圈。"], ["c25-025", "可是今天，你却走在最后面。"], ["c25-026", "你是不是在为我的眼睛伤心？"], ["c25-027", "是那个坏蛋‘没有人’，用他的酒把我灌醉，弄瞎了我的眼睛。"], ["c25-028", "要是你会说话，你一定会告诉我，他躲在哪里。"], ["c25-029", "那样我就把他抓住，摔在地上，摔得粉碎！”"]]}, {"t": "p", "s": [["c25-030", "说完，他把公羊放了出去。"]]}, {"t": "p", "s": [["c25-031", "公羊走出了山洞，走出了羊圈。"], ["c25-032", "奥德修斯先从羊肚子底下钻出来，然后解开了伙伴们。"]]}, {"t": "p", "s": [["c25-033", "他们赶着一大群肥羊，飞快地跑回了海边。"], ["c25-034", "船上的伙伴们看见他们回来，高兴极了，可是再一数人，又难过得哭了起来。"]]}, {"t": "p", "s": [["c25-035", "海边的沙滩上，海鸥被他们的脚步声惊得飞了起来。"], ["c25-036", "船上的人都站了起来，拼命地挥手，有的还跳进水里，迎了上去。"], ["c25-037", "可是大家抱在一起的时候，有人认出了谁没有回来，哭声就一下子起来了。"]]}, {"t": "p", "s": [["c25-038", "奥德修斯皱着眉头，向他们摇摇头，叫他们别哭。"], ["c25-039", "他让大家赶快把羊赶上船，拼命地划桨。"]]}, {"t": "img", "src": "images/51.webp?v=8e15273dee", "vid": "images/51.mp4?v=a46595752e", "cap": "站在船头大喊", "n": 51}, {"t": "p", "s": [["c25-040", "他们跑回船上，赶着羊群拼命地划船。"], ["c25-041", "船划远了，奥德修斯忍不住站在船头大喊：“巨人，记住，弄瞎你眼睛的，是伊萨卡的奥德修斯！"], ["c25-042", "谁让你欺负客人，吃掉了他们！”"]]}, {"t": "p", "s": [["c25-043", "巨人听见了，气得发狂。"], ["c25-044", "他从山上掰下一大块岩石，朝着声音传来的方向，狠狠地扔了过来。"]]}, {"t": "p", "s": [["c25-045", "他的声音像山崩一样，从山上滚了下来，惊得海里的鱼都一下子散开了。"], ["c25-046", "他只有一只眼睛，而且已经瞎了，所以只能朝着声音扔石头。"]]}, {"t": "p", "s": [["c25-047", "那块岩石落在船头前面，掀起了一个大浪，大浪一下子把船推回了岸边。"], ["c25-048", "奥德修斯拿起一根长篙，使劲一撑，把船撑离了岸，伙伴们拼命地划桨，才又划了出去。"]]}, {"t": "p", "s": [["c25-049", "伙伴们都劝奥德修斯，他们说：“你为什么还要惹他生气？"], ["c25-050", "他再扔一块石头，就会把我们的船砸成碎片了！”"]]}, {"t": "p", "s": [["c25-051", "可是奥德修斯不听，他又喊了一遍自己的名字。"]]}, {"t": "p", "s": [["c25-052", "巨人又举起一块更大的石头，扔了过来。"], ["c25-053", "这一次，石头落在船尾的后面，掀起的大浪把船推向了前面的小岛。"]]}, {"t": "p", "s": [["c25-054", "巨人向他的父亲波塞冬祈祷，他说：“父亲啊，听我说！"], ["c25-055", "要是我真的是你的儿子，就别让奥德修斯回到家乡！"], ["c25-056", "就算他命中注定要回去，也要让他吃尽苦头，失去所有的伙伴，坐着别人的船，回到家里，还要在家里遇到麻烦！”"]]}, {"t": "p", "s": [["c25-057", "海神波塞冬听见了儿子的祈祷。"]]}, {"t": "p", "s": [["c25-058", "远处的海面上，忽然刮起了一阵阴冷的风，一块乌云慢慢地盖了过来。"], ["c25-059", "海浪低低地怒吼着，好像整个大海都在摇头，对奥德修斯说：不要得意得太早。"]]}, {"t": "p", "s": [["c25-060", "从那天起，海神波塞冬就成了奥德修斯的敌人。"]]}]}, {"title": "第二十六章　风神的口袋", "head": "c26-h", "audio": "audio/ch26.m4a?v=bbe470bc03", "duration": 353.889, "times": {"c26-h": [0.0, 3.128], "c26-001": [4.128, 9.623], "c26-002": [10.473, 15.866], "c26-003": [16.216, 23.498], "c26-004": [24.348, 30.189], "c26-005": [30.539, 35.59], "c26-006": [36.44, 41.502], "c26-007": [41.852, 49.871], "c26-008": [50.221, 55.149], "c26-009": [55.999, 59.559], "c26-010": [59.909, 67.339], "c26-011": [67.689, 70.865], "c26-012": [71.715, 76.283], "c26-013": [77.133, 78.16], "c26-014": [78.51, 86.738], "c26-015": [87.088, 96.9], "c26-016": [97.75, 106.095], "c26-017": [106.945, 112.185], "c26-018": [112.535, 116.593], "c26-019": [116.943, 118.879], "c26-020": [119.729, 123.309], "c26-021": [124.159, 129.868], "c26-022": [130.218, 137.552], "c26-023": [138.402, 145.364], "c26-024": [145.714, 153.229], "c26-025": [154.079, 157.203], "c26-026": [157.553, 160.623], "c26-027": [160.973, 171.393], "c26-028": [172.243, 176.565], "c26-029": [176.915, 181.287], "c26-030": [182.137, 184.321], "c26-031": [185.171, 189.834], "c26-032": [190.684, 196.956], "c26-033": [197.306, 201.825], "c26-034": [202.175, 206.093], "c26-035": [206.943, 211.897], "c26-036": [212.747, 216.259], "c26-037": [216.609, 222.988], "c26-038": [223.338, 231.08], "c26-039": [231.93, 236.607], "c26-040": [236.957, 240.583], "c26-041": [240.933, 249.943], "c26-042": [250.293, 253.733], "c26-043": [254.583, 256.319], "c26-044": [260.914, 269.859], "c26-045": [270.709, 277.325], "c26-046": [277.675, 281.303], "c26-047": [281.653, 287.682], "c26-048": [288.532, 292.158], "c26-049": [292.508, 296.526], "c26-050": [296.876, 303.203], "c26-051": [304.053, 307.03], "c26-052": [307.38, 311.646], "c26-053": [311.996, 316.721], "c26-054": [317.571, 320.556], "c26-055": [320.906, 322.485], "c26-056": [322.835, 324.834], "c26-057": [325.684, 330.173], "c26-058": [330.523, 331.673], "c26-059": [332.523, 334.93], "c26-060": [335.28, 338.663], "c26-061": [339.013, 341.244], "c26-062": [341.594, 342.0], "c26-063": [342.85, 345.226], "c26-064": [345.576, 352.389]}, "blocks": [{"t": "img", "src": "images/52.webp?v=b2f0325d70", "vid": "images/52.mp4?v=3319d363ab", "cap": "风神的浮岛", "n": 52}, {"t": "p", "s": [["c26-001", "离开了独眼巨人的岛，他们又来到了风神埃俄罗斯的浮岛上。"]]}, {"t": "p", "s": [["c26-002", "那座岛浮在海面上，随着海浪轻轻地漂来漂去。"], ["c26-003", "岛的四周，围着一道永远不会坏的铜墙，铜墙下面，是陡峭光滑的悬崖。"]]}, {"t": "p", "s": [["c26-004", "风神住在岛上的宫殿里，和他的妻子，还有十二个孩子住在一起。"], ["c26-005", "他们天天都在宫殿里宴会，宫殿里飘满了烤肉的香味。"]]}, {"t": "p", "s": [["c26-006", "六个儿子娶了六个姑娘，六个女儿嫁给了六个小伙子。"], ["c26-007", "大家围坐在一张长长的桌子前面，有说有笑，吹笛子的吹笛子，唱歌的唱歌。"], ["c26-008", "孩子们在桌子底下钻来钻去，大人们假装没看见。"]]}, {"t": "p", "s": [["c26-009", "风神热情地招待了他们，整整一个月。"], ["c26-010", "他每天都问奥德修斯特洛伊的事情，问希腊人的船，问英雄们是怎样回家的。"], ["c26-011", "奥德修斯一件一件地讲给他听。"]]}, {"t": "p", "s": [["c26-012", "一个月以后，奥德修斯请求风神，送他们回家。"]]}, {"t": "p", "s": [["c26-013", "风神答应了。"], ["c26-014", "他杀了一头九岁的公牛，剥下牛皮，做成了一个大口袋，把所有乱刮的风都装进了口袋里。"], ["c26-015", "因为宙斯让他管着所有的风，他想让哪阵风刮，哪阵风就刮；想让哪阵风停，哪阵风就停。"]]}, {"t": "img", "src": "images/53.webp?v=9388084c92", "vid": "images/53.mp4?v=d8fae5b5c4", "cap": "牛皮口袋", "n": 53}, {"t": "p", "s": [["c26-016", "他把口袋放在奥德修斯的船舱里，用一根闪闪发光的银绳子扎得紧紧的，一点儿风也漏不出来。"]]}, {"t": "p", "s": [["c26-017", "风神说：“奥德修斯，所有乱刮的风，都装在这个口袋里了。"], ["c26-018", "我只给你留下温柔的西风，它会把你们一直吹回家。"], ["c26-019", "记住，千万别打开口袋！”"]]}, {"t": "p", "s": [["c26-020", "奥德修斯谢过了风神，出发了。"]]}, {"t": "p", "s": [["c26-021", "海风吹动着白色的船帆，浪花在船头一朵一朵地开。"], ["c26-022", "伙伴们的心情，像天上的云一样轻快，有人拿出笛子，吹起了回家的调子。"]]}, {"t": "p", "s": [["c26-023", "伙伴们帮着把船上的东西收拾好，把风神送的礼物一样一样地摆好。"], ["c26-024", "风神站在岛的边上，向他们挥手，他的白胡子在风里飘着，像一团柔软的云。"]]}, {"t": "p", "s": [["c26-025", "温柔的西风推着船，一路向东。"], ["c26-026", "他们在海上航行了九天九夜。"], ["c26-027", "这九天九夜里，奥德修斯一直亲手掌着船舵，一刻也没有睡觉，因为他想快一点回家，不想让别人掌舵。"]]}, {"t": "p", "s": [["c26-028", "第十天，他们已经能看见伊萨卡的海岸了。"], ["c26-029", "他们甚至能看见岸边有人在烧火，火光一闪一闪的。"]]}, {"t": "p", "s": [["c26-030", "家，就在眼前了！"]]}, {"t": "p", "s": [["c26-031", "可是，奥德修斯实在太累了，一闭眼就睡着了。"]]}, {"t": "p", "s": [["c26-032", "他的眼睛里布满了红红的血丝，嘴唇干裂，手也磨出了水泡。"], ["c26-033", "他在心里对自己说：只闭一小会儿，就一小会儿。"], ["c26-034", "可是他的头刚刚垂下来，鼾声就响了起来。"]]}, {"t": "p", "s": [["c26-035", "伙伴们围在一起，偷偷地看着船舱里的那个牛皮口袋。"]]}, {"t": "p", "s": [["c26-036", "他们的眼睛里闪着奇怪的光。"], ["c26-037", "有人用手指戳了戳口袋，口袋鼓鼓的，里面好像在微微地动。"], ["c26-038", "有人把耳朵贴上去听，听到了呼呼的响声，像是很远的地方，有一群风在叹气。"]]}, {"t": "p", "s": [["c26-039", "伙伴们小声说：“那个口袋里，一定装满了金子和银子！"], ["c26-040", "他走到哪里，大家都喜欢他，都送给他礼物。"], ["c26-041", "他从特洛伊带回来那么多宝贝，现在风神又送给他这么一大口袋，可是我们跟着他走了那么远的路，回家的时候，两手空空。"], ["c26-042", "快，我们打开看看，里面到底有多少金子银子！”"]]}, {"t": "img", "src": "images/54.webp?v=2ec37ae256", "vid": "images/54.mp4?v=bdb50c3eec", "cap": "打开口袋", "n": 54}, {"t": "p", "s": [["c26-043", "他们解开了银绳子。"]]}, {"t": "p", "s": [["c26-044", "“呼——”所有的风一起冲了出来，掀起了巨大的风暴，把他们的船又吹回了风神的岛。"]]}, {"t": "p", "s": [["c26-045", "奥德修斯醒过来一看，家乡已经看不见了，四周只有咆哮的大海。"], ["c26-046", "他心里难过极了，甚至想跳进大海里去。"], ["c26-047", "可是他忍住了，用斗篷蒙住头，一个人默默地躺在船上。"]]}, {"t": "p", "s": [["c26-048", "他在甲板上坐了很久很久，一句话也不说。"], ["c26-049", "伙伴们站在远处，低着头，谁也不敢走过来。"], ["c26-050", "大风把他们的衣服吹得猎猎作响，雨点打在脸上，冰冷冰冷的。"]]}, {"t": "p", "s": [["c26-051", "大风把他们吹回了风神的浮岛。"], ["c26-052", "奥德修斯带着一个伙伴，又来到了风神的宫殿。"], ["c26-053", "风神和他的家人正在吃饭，看见他们，吃了一惊。"]]}, {"t": "p", "s": [["c26-054", "风神说：“奥德修斯，你怎么又回来了？"], ["c26-055", "是哪个神在跟你作对？"], ["c26-056", "我不是好好地送你回家了吗？”"]]}, {"t": "p", "s": [["c26-057", "奥德修斯说：“是我的伙伴们害了我，还有那该死的睡觉！"], ["c26-058", "请你再帮帮我们吧！”"]]}, {"t": "p", "s": [["c26-059", "可是风神再也不肯帮他们了。"], ["c26-060", "他说：“众神都不喜欢的人，快离开我的岛！"], ["c26-061", "我不能帮助被众神讨厌的人。"], ["c26-062", "走吧！”"]]}, {"t": "p", "s": [["c26-063", "奥德修斯只好难过地离开了。"], ["c26-064", "伙伴们没有了顺风，只好自己划着桨，在大海上又漂了六天六夜。"]]}]}, {"title": "第二十七章　巨人族的海湾", "head": "c27-h", "audio": "audio/ch27.m4a?v=f1217141f0", "duration": 388.761, "times": {"c27-h": [0.0, 3.457], "c27-001": [4.457, 7.586], "c27-002": [8.436, 11.62], "c27-003": [11.97, 17.642], "c27-004": [17.992, 32.234], "c27-005": [33.084, 39.186], "c27-006": [39.536, 43.748], "c27-007": [44.598, 48.977], "c27-008": [49.327, 58.793], "c27-009": [59.143, 64.064], "c27-010": [64.914, 72.516], "c27-011": [72.866, 75.749], "c27-012": [76.099, 81.88], "c27-013": [82.73, 89.255], "c27-014": [89.605, 93.594], "c27-015": [93.944, 100.753], "c27-016": [101.603, 105.654], "c27-017": [106.004, 112.565], "c27-018": [113.415, 116.831], "c27-019": [117.181, 124.072], "c27-020": [124.422, 131.502], "c27-021": [132.352, 137.603], "c27-022": [138.453, 142.868], "c27-023": [143.218, 148.691], "c27-024": [149.041, 150.983], "c27-025": [151.833, 160.354], "c27-026": [160.704, 166.37], "c27-027": [166.72, 171.318], "c27-028": [172.168, 176.118], "c27-029": [176.468, 185.485], "c27-030": [186.335, 188.808], "c27-031": [189.158, 191.821], "c27-032": [192.171, 197.585], "c27-033": [198.435, 201.575], "c27-034": [201.925, 206.045], "c27-035": [206.395, 212.165], "c27-036": [213.015, 215.217], "c27-037": [215.567, 218.1], "c27-038": [218.45, 222.005], "c27-039": [222.855, 229.292], "c27-040": [230.142, 233.629], "c27-041": [233.979, 236.213], "c27-042": [236.563, 242.161], "c27-043": [242.511, 246.117], "c27-044": [246.967, 252.378], "c27-045": [252.728, 261.992], "c27-046": [262.342, 267.552], "c27-047": [268.402, 274.794], "c27-048": [275.144, 283.984], "c27-049": [284.834, 291.697], "c27-050": [292.047, 303.55], "c27-051": [303.9, 306.989], "c27-052": [307.839, 314.065], "c27-053": [314.915, 317.51], "c27-054": [317.86, 318.638], "c27-055": [318.988, 320.954], "c27-056": [321.804, 327.329], "c27-057": [327.679, 332.136], "c27-058": [332.986, 340.644], "c27-059": [340.994, 350.413], "c27-060": [351.264, 355.764], "c27-061": [356.614, 361.007], "c27-062": [361.357, 367.752], "c27-063": [368.602, 371.528], "c27-064": [371.878, 374.679], "c27-065": [375.029, 381.756], "c27-066": [382.106, 387.261]}, "blocks": [{"t": "p", "s": [["c27-001", "第七天，他们来到了一个陌生的海湾。"]]}, {"t": "p", "s": [["c27-002", "这七天里，伙伴们累坏了。"], ["c27-003", "他们的手上磨出了一个又一个水泡，水泡破了，又磨出新的。"], ["c27-004", "晚上，他们躺在甲板上，肩膀酸得抬不起来，嘴里却还在小声地念着“伊萨卡、伊萨卡”，仿佛这个名字有魔力，念着念着，就不累了。"]]}, {"t": "p", "s": [["c27-005", "这个海湾的入口窄窄的，两边是高高的悬崖，一直伸进大海。"], ["c27-006", "海湾里的水平平静静的，连一点浪花都没有。"]]}, {"t": "p", "s": [["c27-007", "悬崖像两堵巨大的墙，把海风挡在了外面。"], ["c27-008", "水面像一面光滑的镜子，把天空和云都倒映在里面，美得让人忍不住想要停下来。"], ["c27-009", "海鸥在水面上悠闲地飞，一点也没有惊慌的样子。"]]}, {"t": "p", "s": [["c27-010", "伙伴们高兴极了，把十一条船都划进了海湾，一条挨着一条，停在里面。"], ["c27-011", "只有奥德修斯，留了一个心眼。"], ["c27-012", "他把自己的船停在海湾外面，用缆绳系在一块礁石上。"]]}, {"t": "p", "s": [["c27-013", "他看着伙伴们的船一条一条地驶进去，心里隐隐有些不安。"], ["c27-014", "这里实在太安静了，安静得有点不对劲。"], ["c27-015", "他从小就听老船长说过：越是看起来平安的地方，越要多留一个心眼。"]]}, {"t": "p", "s": [["c27-016", "奥德修斯爬到高高的岩石上，向远处看。"], ["c27-017", "他既看不见耕过的田地，也看不见牛羊，只看见远处有一缕炊烟。"]]}, {"t": "p", "s": [["c27-018", "他的手搭在额头上，望得眼睛都酸了。"], ["c27-019", "山上的树林里，一片安静，没有牛叫，没有羊叫，也没有人唱歌。"], ["c27-020", "只有那一缕炊烟，细细的，直直地向天上飘着，像一根灰色的线。"]]}, {"t": "p", "s": [["c27-021", "他派了三个伙伴，到岸上去看看，这里住的是什么人。"]]}, {"t": "p", "s": [["c27-022", "三个伙伴顺着马车走过的大路，向城里走去。"], ["c27-023", "在城外的泉水边，他们遇见了一个高大的姑娘，正在打水。"], ["c27-024", "她是这里国王的女儿。"]]}, {"t": "p", "s": [["c27-025", "路上的车辙又深又宽，一道一道地压在泥土里，比他们见过的任何车辙都宽。"], ["c27-026", "路边的树木，也一棵比一棵高，叶子大得像盾牌。"], ["c27-027", "三个伙伴越走越觉得不对劲，心
