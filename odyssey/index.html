里的鼓敲得越来越响。"]]}, {"t": "p", "s": [["c27-028", "姑娘手里提着的水罐，比他们三个人都高。"], ["c27-029", "她看见三个小小的陌生人，惊讶地眨了眨眼睛，却没有害怕，而是弯下腰，好奇地看着他们。"]]}, {"t": "p", "s": [["c27-030", "姑娘把他们领到了她爸爸的王宫。"], ["c27-031", "一进门，他们就看见了王后。"], ["c27-032", "王后高得像一座山，三个伙伴一看见她，吓得浑身发抖。"]]}, {"t": "p", "s": [["c27-033", "王宫的门，有一棵大树那么高。"], ["c27-034", "桌子像一块平整的田地，椅子像一座小山。"], ["c27-035", "三个伙伴从桌腿旁边走过，只觉得自己小得像三粒米。"]]}, {"t": "p", "s": [["c27-036", "王后正坐在火炉边。"], ["c27-037", "她抬起头来，看了他们一眼。"], ["c27-038", "那一眼，让三个伙伴的腿一下子软了。"]]}, {"t": "img", "src": "images/55.webp?v=6da2c9fa47", "vid": "images/55.mp4?v=78c9e2f221", "cap": "悬崖上的巨人", "n": 55}, {"t": "p", "s": [["c27-039", "原来，这里住的是一群凶恶的巨人，名叫莱斯特律戈涅斯人。"]]}, {"t": "p", "s": [["c27-040", "国王从大会上回来了，伸手就要抓他们。"], ["c27-041", "三个伙伴拼命地往回跑。"], ["c27-042", "国王大喊一声，成千上万的巨人从四面八方跑了出来。"], ["c27-043", "他们不像人，倒像一个个巨大的怪物。"]]}, {"t": "p", "s": [["c27-044", "国王一进门，就一把抓住了其中一个伙伴，当成了晚饭。"], ["c27-045", "另外两个吓得魂都飞了，转身就跑，一口气跑出了王宫，跑上了大路，连鞋子掉了都顾不上捡。"], ["c27-046", "他们的耳朵里全是呼呼的风声，和身后越来越近的脚步声。"]]}, {"t": "p", "s": [["c27-047", "巨人们跑到悬崖上，搬起一块一块的大石头，向海湾里的船扔下去。"], ["c27-048", "石头砸在船上，船一条接一条地碎了，伙伴们的喊叫声、船板的断裂声，响成了一片。"]]}, {"t": "p", "s": [["c27-049", "石头像下冰雹一样落下来，每落一块，海面就炸开一朵巨大的水花。"], ["c27-050", "有的伙伴被石头砸中了，有的掉进水里，有的拼命地向岸边游，却被巨人们像串小鱼一样，一个一个地捞了起来。"], ["c27-051", "海湾里的水，很快就红了一片。"]]}, {"t": "p", "s": [["c27-052", "奥德修斯在海湾外面看见了，赶紧拔出宝剑，砍断了系船的缆绳。"]]}, {"t": "p", "s": [["c27-053", "奥德修斯对伙伴们大喊：“快划！"], ["c27-054", "拼命地划！"], ["c27-055", "要不然，我们就都完了！”"]]}, {"t": "p", "s": [["c27-056", "伙伴们害怕极了，拼命地划着桨，水花溅得老高。"], ["c27-057", "他们的船飞快地离开了悬崖，冲进了开阔的大海。"]]}, {"t": "p", "s": [["c27-058", "船板在桨的重压下吱吱作响，伙伴们咬着牙，额头上的青筋一根一根地凸了出来。"], ["c27-059", "身后，石头还在不停地落下来，有一块擦着船尾砸进了水里，溅起的浪花把所有人都淋湿了。"]]}, {"t": "p", "s": [["c27-060", "十二条船里，只有奥德修斯的那一条逃了出来。"]]}, {"t": "p", "s": [["c27-061", "他们回头望着那个海湾，心里又难过，又庆幸。"], ["c27-062", "难过的是，失去了那么多好伙伴；庆幸的是，自己总算逃出来了。"]]}, {"t": "p", "s": [["c27-063", "夜里，船在海上静静地漂着。"], ["c27-064", "没有人说话，也没有人点灯。"], ["c27-065", "奥德修斯一个人坐在船尾，望着黑黑的海面，想起了那些再也不会回来的人。"], ["c27-066", "他小声地念着他们的名字，一个一个地，念了很久很久。"]]}]}, {"title": "第二十八章　喀耳刻的小岛", "head": "c28-h", "audio": "audio/ch28.m4a?v=06a2d024ac", "duration": 364.455, "times": {"c28-h": [0.0, 3.14], "c28-001": [4.14, 8.291], "c28-002": [9.141, 15.608], "c28-003": [16.458, 21.03], "c28-004": [21.381, 28.279], "c28-005": [28.629, 33.575], "c28-006": [34.425, 40.645], "c28-007": [40.995, 44.76], "c28-008": [45.61, 50.217], "c28-009": [50.567, 54.549], "c28-010": [54.899, 60.025], "c28-011": [60.875, 66.513], "c28-012": [66.863, 71.366], "c28-013": [71.716, 78.076], "c28-014": [78.426, 84.128], "c28-015": [84.978, 87.828], "c28-016": [88.178, 92.461], "c28-017": [92.811, 94.73], "c28-018": [95.58, 100.979], "c28-019": [101.829, 109.614], "c28-020": [109.964, 113.948], "c28-021": [114.298, 116.679], "c28-022": [117.529, 120.288], "c28-023": [120.638, 125.15], "c28-024": [126.0, 131.895], "c28-025": [132.245, 136.564], "c28-026": [137.414, 144.714], "c28-027": [145.064, 151.907], "c28-028": [152.757, 158.438], "c28-029": [159.288, 164.994], "c28-030": [165.344, 168.708], "c28-031": [169.558, 172.534], "c28-032": [172.884, 186.917], "c28-033": [187.767, 194.08], "c28-034": [194.43, 197.966], "c28-035": [198.316, 204.706], "c28-036": [205.556, 207.928], "c28-037": [208.778, 211.076], "c28-038": [211.426, 216.649], "c28-039": [216.999, 226.673], "c28-040": [227.523, 233.764], "c28-041": [234.114, 235.124], "c28-042": [235.974, 242.025], "c28-043": [242.375, 245.034], "c28-044": [245.384, 250.187], "c28-045": [251.037, 255.971], "c28-046": [256.321, 262.289], "c28-047": [262.639, 268.516], "c28-048": [269.366, 275.309], "c28-049": [279.901, 285.45], "c28-050": [285.8, 295.277], "c28-051": [296.127, 305.601], "c28-052": [306.451, 310.554], "c28-053": [310.904, 318.596], "c28-054": [319.446, 324.602], "c28-055": [324.952, 327.83], "c28-056": [328.68, 334.192], "c28-057": [334.542, 337.952], "c28-058": [338.302, 342.823], "c28-059": [343.173, 348.701], "c28-060": [349.551, 353.64], "c28-061": [353.99, 359.236], "c28-062": [359.586, 362.955]}, "blocks": [{"t": "p", "s": [["c28-001", "他们又在海上漂了好几天，来到了一座小岛。"]]}, {"t": "p", "s": [["c28-002", "大家又累又难过，在海边一连躺了两天两夜，一句话也不想说。"]]}, {"t": "p", "s": [["c28-003", "海浪一遍一遍地拍着沙滩，海鸟在头顶叫着。"], ["c28-004", "有人把脸埋在沙子里，有人望着天空发呆，还有人偷偷地擦着眼泪。"], ["c28-005", "他们谁也不想吃东西，也不想动，只想让时间停下来。"]]}, {"t": "p", "s": [["c28-006", "第三天早上，奥德修斯拿着长矛和宝剑，爬到了高高的山坡上。"], ["c28-007", "他看见岛中间的树林里，冒着一缕炊烟。"]]}, {"t": "p", "s": [["c28-008", "在回船的路上，他遇见了一头又高又大的鹿。"], ["c28-009", "那头鹿从树林里出来，到小河边喝水。"], ["c28-010", "奥德修斯一矛就把它刺倒了，扛在肩膀上，走回了海边。"]]}, {"t": "p", "s": [["c28-011", "那头鹿的角像一棵枯树，在夕阳下投出长长的影子。"], ["c28-012", "它低头喝水的时候，耳朵一动一动的，什么也没有发现。"], ["c28-013", "奥德修斯屏住呼吸，悄悄地靠近，看准了，才把长矛扔了出去。"], ["c28-014", "他扛着鹿，一步一步走下山坡，鹿血顺着他的肩膀往下滴。"]]}, {"t": "p", "s": [["c28-015", "奥德修斯说：“伙伴们，别再难过了。"], ["c28-016", "我们还没到死的时候，在死以前，我们还能吃饱肚子。"], ["c28-017", "来，起来吃鹿肉吧！”"]]}, {"t": "p", "s": [["c28-018", "伙伴们一看见这么大的一头鹿，都高兴起来，吃了一顿饱饭。"]]}, {"t": "p", "s": [["c28-019", "第二天，奥德修斯对伙伴们说：“我们不知道这是什么地方，太阳从哪边升起，又从哪边落下。"], ["c28-020", "我在山坡上看见，岛中间的树林里，冒着炊烟。"], ["c28-021", "我们得去看看，是谁住在那里。”"]]}, {"t": "p", "s": [["c28-022", "伙伴们一听，都吓得哭了起来。"], ["c28-023", "他们想起了独眼巨人，想起了凶恶的巨人族。"]]}, {"t": "p", "s": [["c28-024", "有人抱住头，蹲在地上，有人把脸转过去，不愿意再听下去。"], ["c28-025", "他们已经失去了太多的朋友，每个人都怕得发抖。"]]}, {"t": "p", "s": [["c28-026", "奥德修斯把伙伴们分成两队，一队由他带领，另一队由欧律罗科斯带领。"], ["c28-027", "他们把两个名字放进头盔里，摇一摇，掉出来的，是欧律罗科斯的名字。"]]}, {"t": "p", "s": [["c28-028", "欧律罗科斯带着二十二个伙伴，哭着向树林里走去。"]]}, {"t": "p", "s": [["c28-029", "他们在山谷里看见了一座石头房子，房子四周围着一片空地。"], ["c28-030", "空地上，有狼和狮子走来走去。"]]}, {"t": "img", "src": "images/56.webp?v=976eb258f1", "vid": "images/56.mp4?v=b59359525b", "cap": "温顺的野兽", "n": 56}, {"t": "p", "s": [["c28-031", "可是这些野兽一点儿也不凶。"], ["c28-032", "它们一看见人，就摇着长长的尾巴，用后腿站起来，围着他们转，就像小狗围着从宴会上回来的主人，等着主人给它们带好吃的东西一样。"]]}, {"t": "p", "s": [["c28-033", "一头大狮子还把毛茸茸的脑袋伸过来，在一个伙伴的手心里蹭了蹭。"], ["c28-034", "伙伴们一动也不敢动，腿肚子直打战。"], ["c28-035", "他们后来才知道，这些野兽，原来都是被喀耳刻用魔药变的人。"]]}, {"t": "p", "s": [["c28-036", "伙伴们还是吓得要命。"]]}, {"t": "p", "s": [["c28-037", "房子里传来了好听的歌声。"], ["c28-038", "房子的主人，是一位美丽的女巫，名叫喀耳刻。"], ["c28-039", "她正在一台高大的织布机前织布，一边织，一边唱歌，织出来的布又轻又亮，就像女神织的一样。"]]}, {"t": "p", "s": [["c28-040", "一个伙伴说：“朋友们，里面有人在一边织布，一边唱歌，唱得真好听。"], ["c28-041", "我们喊她吧！”"]]}, {"t": "p", "s": [["c28-042", "他们一喊，喀耳刻就打开了闪闪发光的大门，请他们进去。"], ["c28-043", "伙伴们傻乎乎地跟着她走了进去。"], ["c28-044", "只有欧律罗科斯，怕里面有什么圈套，留在了门外。"]]}, {"t": "p", "s": [["c28-045", "喀耳刻请伙伴们坐在椅子上，给他们端来了一种饮料。"], ["c28-046", "那是用奶酪、大麦粉、金黄的蜂蜜和红酒调成的，香喷喷的。"], ["c28-047", "可是她在里面放了一种魔药，谁喝了，就会忘记自己的家乡。"]]}, {"t": "img", "src": "images/57.webp?v=f4d11680d7", "vid": "images/57.mp4?v=f484dfc882", "cap": "变成了猪", "n": 57}, {"t": "p", "s": [["c28-048", "伙伴们一喝下去，喀耳刻就用魔杖一点，他们全都变成了猪！"]]}, {"t": "p", "s": [["c28-049", "一阵淡淡的烟雾升了起来，大厅里的椅子和桌子好像都在晃。"], ["c28-050", "烟雾散去，原来坐着人的地方，已经只剩下一群哼哼叫的小猪，在地上乱转，鼻子拱来拱去。"]]}, {"t": "p", "s": [["c28-051", "他们长出了猪的脑袋、猪的鼻子、猪的毛，发出了猪的哼哼声，可是他们的心里，还像以前一样明白。"]]}, {"t": "p", "s": [["c28-052", "伙伴们哭了，可是他们只能哼哼地叫。"], ["c28-053", "喀耳刻把他们赶进了猪圈，扔给他们一堆橡子和野果，让他们像猪一样在地上拱着吃。"]]}, {"t": "p", "s": [["c28-054", "欧律罗科斯在门外等了好久好久，也不见一个人出来。"], ["c28-055", "他知道出事了，赶紧跑回了船上。"]]}, {"t": "p", "s": [["c28-056", "他躲在一棵树后面，把拳头塞进嘴里，不敢发出一点声音。"], ["c28-057", "房子里的歌声，不知什么时候停了。"], ["c28-058", "四周静得可怕，只有风吹树叶的沙沙声。"], ["c28-059", "他一步一步往后退，退出了好远，才转身拼命地跑。"]]}, {"t": "p", "s": [["c28-060", "他跑回船上，哭着说：“伙伴们都不见了！"], ["c28-061", "我们走进了树林，看见了一座漂亮的石头房子，里面有人在唱歌。"], ["c28-062", "他们都进去了，我在外面等了好久，一个人也没有出来！”"]]}]}, {"title": "第二十九章　神奇的仙草", "head": "c29-h", "audio": "audio/ch29.m4a?v=fb537250dd", "duration": 344.539, "times": {"c29-h": [0.0, 2.73], "c29-001": [3.73, 7.562], "c29-002": [8.412, 12.419], "c29-003": [13.269, 19.421], "c29-004": [19.771, 22.831], "c29-005": [23.181, 25.169], "c29-006": [26.019, 31.235], "c29-007": [31.585, 32.347], "c29-008": [32.697, 34.717], "c29-009": [35.567, 37.994], "c29-010": [38.844, 43.578], "c29-011": [43.928, 52.72], "c29-012": [53.57, 58.141], "c29-013": [58.491, 63.69], "c29-014": [64.04, 67.812], "c29-015": [68.662, 78.002], "c29-016": [78.352, 80.52], "c29-017": [80.87, 83.823], "c29-018": [84.173, 85.56], "c29-019": [86.41, 94.6], "c29-020": [94.95, 102.17], "c29-021": [103.02, 107.153], "c29-022": [107.503, 110.285], "c29-023": [110.635, 113.407], "c29-024": [113.757, 118.485], "c29-025": [118.835, 121.081], "c29-026": [121.431, 125.411], "c29-027": [126.261, 130.26], "c29-028": [131.11, 135.278], "c29-029": [135.628, 140.131], "c29-030": [140.981, 146.996], "c29-031": [147.346, 152.569], "c29-032": [153.419, 156.79], "c29-033": [157.64, 166.102], "c29-034": [169.591, 172.194], "c29-035": [172.544, 180.277], "c29-036": [181.127, 183.664], "c29-037": [184.014, 185.011], "c29-038": [185.361, 189.252], "c29-039": [189.602, 191.941], "c29-040": [192.291, 200.02], "c29-041": [200.37, 203.676], "c29-042": [204.526, 208.65], "c29-043": [209.0, 215.015], "c29-044": [215.865, 222.48], "c29-045": [222.83, 226.452], "c29-046": [227.302, 229.105], "c29-047": [229.955, 240.726], "c29-048": [241.576, 247.77], "c29-049": [248.12, 249.597], "c29-050": [249.947, 251.242], "c29-051": [252.092, 259.759], "c29-052": [260.109, 264.92], "c29-053": [265.77, 271.785], "c29-054": [272.635, 275.922], "c29-055": [276.272, 284.727], "c29-056": [285.577, 290.81], "c29-057": [291.16, 298.521], "c29-058": [299.371, 304.092], "c29-059": [304.442, 312.129], "c29-060": [312.979, 315.943], "c29-061": [316.293, 319.382], "c29-062": [320.232, 328.178], "c29-063": [328.528, 335.563], "c29-064": [335.913, 343.039]}, "blocks": [{"t": "p", "s": [["c29-001", "奥德修斯一听，马上背上铜剑，拿起弓箭。"]]}, {"t": "p", "s": [["c29-002", "奥德修斯说：“欧律罗科斯，带我去那里！”"]]}, {"t": "p", "s": [["c29-003", "欧律罗科斯抱住奥德修斯的膝盖，哭着说：“奥德修斯，别去！"], ["c29-004", "你去了，也回不来了，还会把他们全都丢在那里。"], ["c29-005", "我们还是快点开船逃走吧！”"]]}, {"t": "p", "s": [["c29-006", "奥德修斯说：“欧律罗科斯，你就留在这里，在船边吃吃喝喝吧。"], ["c29-007", "我一定要去。"], ["c29-008", "伙伴们有难，我不能不管。”"]]}, {"t": "p", "s": [["c29-009", "奥德修斯一个人走进了树林。"]]}, {"t": "p", "s": [["c29-010", "林子里的光线暗暗的，树叶在头顶沙沙地响。"], ["c29-011", "他的手一直放在剑柄上，眼睛盯着四周，每走一步，都先试探着，才敢把重量落在脚上。"]]}, {"t": "p", "s": [["c29-012", "快到喀耳刻的房子的时候，一个年轻人拦住了他。"], ["c29-013", "他看上去像一个刚长出胡子的少年，最可爱的年纪。"], ["c29-014", "可是奥德修斯知道，他是神使赫尔墨斯。"]]}, {"t": "p", "s": [["c29-015", "赫尔墨斯拉住他的手，说：“可怜的人，你一个人，连路都不认识，就想到喀耳刻的家里去救你的伙伴吗？"], ["c29-016", "他们已经变成猪了，关在猪圈里。"], ["c29-017", "我看，你也会和他们一样，再也出不来了。"], ["c29-018", "不过，我来帮你。”"]]}, {"t": "img", "src": "images/58.webp?v=3dad11e50d", "vid": "images/58.mp4?v=815223da0c", "cap": "黑根白花的仙草", "n": 58}, {"t": "p", "s": [["c29-019", "赫尔墨斯从地上拔出一棵仙草，草根是黑色的，花是雪白的，像牛奶一样。"], ["c29-020", "众神管它叫“摩吕”，凡人很难把它拔出来，可是神仙什么都能做到。"]]}, {"t": "img", "src": "images/59.webp?v=fef1e6b59d", "vid": "images/59.mp4?v=8182998800", "cap": "拔出宝剑", "n": 59}, {"t": "p", "s": [["c29-021", "赫尔墨斯说：“带着这棵仙草，喀耳刻的魔药就害不了你。"], ["c29-022", "她会给你调一碗饮料，在里面放上魔药。"], ["c29-023", "可是有了这棵仙草，魔药就没有用了。"], ["c29-024", "等她用魔杖点你的时候，你就拔出宝剑冲过去，好像要杀她一样。"], ["c29-025", "她就会害怕，会请你留下来。"], ["c29-026", "你要让她向众神发誓，再也不害你，也不害你的伙伴们。”"]]}, {"t": "p", "s": [["c29-027", "说完，赫尔墨斯就飞回了奥林匹斯山。"]]}, {"t": "p", "s": [["c29-028", "奥德修斯来到喀耳刻的家门口，大声地喊她。"], ["c29-029", "喀耳刻打开了闪闪发光的大门，请他进去。"]]}, {"t": "p", "s": [["c29-030", "她请他坐在一把银钉镶边的漂亮椅子上，脚下还放了一张小脚凳。"], ["c29-031", "然后，她用金杯给他调了一杯饮料，在里面放了魔药。"]]}, {"t": "p", "s": [["c29-032", "奥德修斯接过来，一口气喝了下去。"]]}, {"t": "p", "s": [["c29-033", "她果然给他端来了魔药，又用魔杖点了他一下，说：“到猪圈里去，和你的伙伴们待在一起吧！”"]]}, {"t": "p", "s": [["c29-034", "可是奥德修斯一点儿也没有变。"], ["c29-035", "他拔出宝剑冲了过去，喀耳刻吓得大叫一声，跪在地上，抱住了他的膝盖。"]]}, {"t": "p", "s": [["c29-036", "喀耳刻哭着说：“你是谁？"], ["c29-037", "从哪里来？"], ["c29-038", "从来没有一个人喝了我的魔药，还能不变的。"], ["c29-039", "你一定就是聪明的奥德修斯！"], ["c29-040", "赫尔墨斯早就说过，有一天，你从特洛伊回来，会坐着黑色的快船到这里来。"], ["c29-041", "快把宝剑收起来吧，我们做好朋友吧。”"]]}, {"t": "p", "s": [["c29-042", "她的脸色变得苍白，手里的魔杖掉在了地上。"], ["c29-043", "她一边发抖，一边慢慢地站起来，眼睛里全是惊讶和敬佩。"]]}, {"t": "p", "s": [["c29-044", "奥德修斯说：“喀耳刻，你把我的伙伴们变成了猪，现在又想让我放下宝剑？"], ["c29-045", "除非你向众神发誓，再也不害我，我才相信你。”"]]}, {"t": "p", "s": [["c29-046", "喀耳刻马上发了誓。"]]}, {"t": "p", "s": [["c29-047", "可是，喀耳刻给奥德修斯摆上了一桌好吃的东西，奥德修斯却一口也不吃，坐在那里，一句话也不说。"]]}, {"t": "p", "s": [["c29-048", "喀耳刻说：“奥德修斯，你为什么坐在这里，像哑巴一样，不吃也不喝？"], ["c29-049", "你还怕我害你吗？"], ["c29-050", "我已经发过誓了。”"]]}, {"t": "p", "s": [["c29-051", "奥德修斯说：“喀耳刻，一个好人，看见自己的伙伴们还关在猪圈里，怎么吃得下饭呢？"], ["c29-052", "你要是真心对我好，就先放了我的伙伴们，让我亲眼看见他们。”"]]}, {"t": "p", "s": [["c29-053", "喀耳刻拿着魔杖，走出大厅，打开猪圈，把那些猪赶了出来。"]]}, {"t": "img", "src": "images/60.webp?v=0ba8a95ffe", "vid": "images/60.mp4?v=0538273d84", "cap": "变回了人", "n": 60}, {"t": "p", "s": [["c29-054", "她在每头猪的身上，抹了一种药膏。"], ["c29-055", "猪毛一下子就掉了，伙伴们又变回了人，而且比以前更年轻、更高大、更英俊了。"]]}, {"t": "p", "s": [["c29-056", "伙伴们认出了奥德修斯，一个个跑过来，紧紧地握住他的手。"], ["c29-057", "大家都高兴得哭了，哭声响遍了整个房子，就连喀耳刻也被感动了。"]]}, {"t": "p", "s": [["c29-058", "后来，奥德修斯把留在船上的伙伴们也都叫了过来。"], ["c29-059", "喀耳刻给他们洗了澡，抹上了橄榄油，换上了干净的衣服，摆上了丰盛的宴席。"]]}, {"t": "p", "s": [["c29-060", "他们在喀耳刻的岛上住了整整一年。"], ["c29-061", "每天都有吃不完的肉，喝不完的酒。"]]}, {"t": "p", "s": [["c29-062", "白天，伙伴们在海边晒太阳、钓鱼、修船，夜里，大家围着火堆唱歌。"], ["c29-063", "喀耳刻把他们当成了自己最好的朋友，什么好吃的都往他们的盘子里放。"], ["c29-064", "他们渐渐地忘了疲劳，也忘了伤心，有时候，甚至忘了自己是在回家的路上。"]]}]}, {"title": "第三十章　世界尽头的问路", "head": "c30-h", "audio": "audio/ch30.m4a?v=18da8e0c4a", "duration": 405.303, "times": {"c30-h": [0.0, 3.541], "c30-001": [4.541, 7.334], "c30-002": [8.184, 13.814], "c30-003": [14.164, 17.543], "c30-004": [18.393, 23.939], "c30-005": [24.789, 28.537], "c30-006": [28.887, 33.146], "c30-007": [33.496, 40.951], "c30-008": [41.301, 45.54], "c30-009": [45.89, 49.199], "c30-010": [50.049, 52.887], "c30-011": [53.237, 58.687], "c30-012": [59.537, 63.246], "c30-013": [63.596, 66.339], "c30-014": [67.189, 69.592], "c30-015": [69.942, 75.87], "c30-016": [76.72, 80.128], "c30-017": [80.978, 84.098], "c30-018": [84.448, 90.373], "c30-019": [90.723, 98.391], "c30-020": [99.241, 102.116], "c30-021": [102.466, 106.165], "c30-022": [106.515, 109.855], "c30-023": [110.705, 116.031], "c30-024": [116.381, 129.583], "c30-025": [129.933, 133.582], "c30-026": [134.432, 137.248], "c30-027": [138.098, 143.134], "c30-028": [143.484, 151.079], "c30-029": [151.429, 156.104], "c30-030": [156.954, 163.223], "c30-031": [164.073, 168.657], "c30-032": [169.007, 177.727], "c30-033": [178.077, 182.596], "c30-034": [183.446, 191.072], "c30-035": [191.922, 197.684], "c30-036": [198.534, 205.815], "c30-037": [206.165, 210.473], "c30-038": [210.823, 217.22], "c30-039": [217.57, 226.801], "c30-040": [227.151, 232.846], "c30-041": [233.196, 236.089], "c30-042": [236.439, 240.462], "c30-043": [240.812, 247.224], "c30-044": [247.574, 256.907], "c30-045": [257.257, 266.401], "c30-046": [266.751, 268.862], "c30-047": [269.212, 278.417], "c30-048": [279.267, 284.423], "c30-049": [284.773, 287.107], "c30-050": [287.457, 292.766], "c30-051": [293.116, 294.722], "c30-052": [295.572, 297.543], "c30-053": [298.393, 302.706], "c30-054": [303.056, 306.033], "c30-055": [306.883, 313.412], "c30-056": [313.762, 315.35], "c30-057": [315.7, 317.399], "c30-058": [318.249, 322.743], "c30-059": [323.093, 327.853], "c30-060": [328.203, 331.821], "c30-061": [332.171, 333.176], "c30-062": [333.526, 335.502], "c30-063": [336.352, 341.818], "c30-064": [342.668, 352.417], "c30-065": [353.267, 356.749], "c30-066": [357.099, 359.906], "c30-067": [360.256, 366.27], "c30-068": [366.62, 369.898], "c30-069": [370.248, 375.846], "c30-070": [376.196, 377.079], "c30-071": [377.929, 381.269], "c30-072": [382.119, 387.007], "c30-073": [387.357, 392.895], "c30-074": [393.745, 395.498], "c30-075": [395.848, 403.803]}, "blocks": [{"t": "p", "s": [["c30-001", "一年过去了，春天又来了。"]]}, {"t": "p", "s": [["c30-002", "伙伴们来找奥德修斯，他们说：“奥德修斯，你忘了你的家乡了吗？"], ["c30-003", "要是众神让我们回家，现在就该出发了。”"]]}, {"t": "p", "s": [["c30-004", "那天晚上，奥德修斯抱住喀耳刻的膝盖，请求她放他们回家。"]]}, {"t": "p", "s": [["c30-005", "喀耳刻说：“奥德修斯，我不会强留你们。"], ["c30-006", "可是要回家，你得先走一条别人从来没有走过的路。"], ["c30-007", "你得先到世界的尽头去，到幽灵们住的地方，找一位叫忒瑞西阿斯的老先知问路。"], ["c30-008", "他的眼睛看不见，可是他的心，比谁都明白。"], ["c30-009", "只有他能告诉你，回家的路该怎么走。”"]]}, {"t": "p", "s": [["c30-010", "奥德修斯一听，心都碎了。"], ["c30-011", "他坐在床上哭了起来，不想再活下去，也不想再看见阳光。"]]}, {"t": "p", "s": [["c30-012", "奥德修斯说：“喀耳刻，谁能给我们带路呢？"], ["c30-013", "从来没有人坐着黑色的船，到过那里。”"]]}, {"t": "p", "s": [["c30-014", "喀耳刻说：“你不用找人带路。"], ["c30-015", "你竖起桅杆，张开白色的船帆，坐在船上，北风会把你们送到那里的。”"]]}, {"t": "p", "s": [["c30-016", "第二天，天刚亮，他们就出发了。"]]}, {"t": "p", "s": [["c30-017", "喀耳刻站在海边，目送着他们。"], ["c30-018", "她的长袍被风吹得鼓了起来，头发在晨光里闪着金色的光。"], ["c30-019", "伙伴们一边划桨，一边回头望，一直望到岛变成了海面上一个小小的绿点。"]]}, {"t": "p", "s": [["c30-020", "北风推着船，一直向北。"], ["c30-021", "一整天，船帆都被风吹得鼓鼓的。"], ["c30-022", "太阳落山了，四周的路都暗了下来。"]]}, {"t": "img", "src": "images/61.webp?v=07eb5d9a19", "vid": "images/61.mp4?v=39bc5422f5", "cap": "灰蒙蒙的雾", "n": 61}, {"t": "p", "s": [["c30-023", "他们来到了大海的尽头，来到了一个终年不见太阳的地方。"], ["c30-024", "那里住着一群人，他们的城市永远被灰蒙蒙的雾和云遮着，太阳从来照不到那里，不管是早上升起来的时候，还是傍晚落下去的时候。"], ["c30-025", "永远是黑夜，笼罩着那些可怜的人。"]]}, {"t": "p", "s": [["c30-026", "那里，是幽灵们住的地方。"]]}, {"t": "p", "s": [["c30-027", "四周静得吓人，连海浪的声音也变得轻轻的。"], ["c30-028", "空气又冷又湿，吸进肺里，凉凉的，带着一股泥土的味道。"], ["c30-029", "伙伴们缩着脖子，抱着胳膊，牙齿咯咯地打战。"]]}, {"t": "p", "s": [["c30-030", "奥德修斯按照喀耳刻教他的，在地上挖了一个小坑，向幽灵们献祭。"]]}, {"t": "p", "s": [["c30-031", "一个又一个灰白色的影子，从雾里飘了出来。"], ["c30-032", "有年轻的姑娘，有没有结婚的小伙子，有吃过很多苦的老人，还有在战场上倒下的勇士。"], ["c30-033", "他们在小坑周围飘来飘去，发出轻轻的叹息声。"]]}, {"t": "p", "s": [["c30-034", "奥德修斯握着宝剑，坐在小坑旁边，不让别的幽灵靠近，他要先等老先知来。"]]}, {"t": "img", "src": "images/62.webp?v=7886918fdb", "vid": "images/62.mp4?v=6289767ee5", "cap": "老先知", "n": 62}, {"t": "p", "s": [["c30-035", "老先知忒瑞西阿斯的影子，拄着金手杖，从雾里慢慢地走出来。"]]}, {"t": "p", "s": [["c30-036", "老先知说：“奥德修斯，你为什么离开阳光，到这个阴暗的地方来？"], ["c30-037", "你想回家，可是回家的路会很难。"], ["c30-038", "海神波塞冬在生你的气，因为你弄瞎了他的儿子的眼睛。"], ["c30-039", "不过，你们还是能回家的，只要你和你的伙伴们，能管住自己的嘴。"], ["c30-040", "你们会路过太阳神的岛，岛上有太阳神的牛和羊。"], ["c30-041", "千万不要伤害那些牛羊！"], ["c30-042", "只要你们不碰它们，就都能回到家乡。"], ["c30-043", "要是你们伤害了它们，你的船和你的伙伴们都会遭殃。"], ["c30-044", "就算你自己能逃出来，也要过很久很久，失去所有的伙伴，坐着别人的船，才能回到家。"], ["c30-045", "回到家以后，你还会看见一群骄横的人，在你家里吃你的东西，向你的妻子求婚。"], ["c30-046", "可是你会打败他们。"], ["c30-047", "最后，你会在家乡安安稳稳地活到很老很老，你的百姓们都会幸福快乐。”"]]}, {"t": "img", "src": "images/63.webp?v=f320e5c640", "vid": "images/63.mp4?v=4c9099438c", "cap": "妈妈的影子", "n": 63}, {"t": "p", "s": [["c30-048", "奥德修斯说：“老先知，众神既然这样安排，我就照着去做。"], ["c30-049", "可是，请你再告诉我一件事。"], ["c30-050", "我看见我妈妈的影子了，她坐在那里，一句话也不说，也不看我一眼。"], ["c30-051", "我怎样才能让她认出我来呢？”"]]}, {"t": "p", "s": [["c30-052", "老先知告诉了他办法。"]]}, {"t": "p", "s": [["c30-053", "在雾里，奥德修斯还看见了自己的妈妈。"], ["c30-054", "他离开家的时候，她还好好的。"]]}, {"t": "p", "s": [["c30-055", "妈妈一下子就认出了他，她哭着说：“孩子，你怎么活着来到了这个阴暗的地方？"], ["c30-056", "你还没有回过伊萨卡吗？"], ["c30-057", "还没有见到你的妻子吗？”"]]}, {"t": "p", "s": [["c30-058", "奥德修斯说：“妈妈，我是为了问路，才来到这里的。"], ["c30-059", "我离开特洛伊以后，到现在还在海上漂着，一直没有回到家乡。"], ["c30-060", "妈妈，请您告诉我，您是怎么离开人世的？"], ["c30-061", "我的爸爸还好吗？"], ["c30-062", "我的妻子佩涅洛佩还在等我吗？”"]]}, {"t": "p", "s": [["c30-063", "妈妈说：“孩子，你的妻子一直在家里等着你，日日夜夜地流着眼泪。”"]]}, {"t": "p", "s": [["c30-064", "她的影子轻轻的，像一缕被风吹散的烟，说话的声音也细细的，好像从很远很远的地方传来。"]]}, {"t": "p", "s": [["c30-065", "“你的儿子也长大了，替你管着家里的田地。"], ["c30-066", "你的爸爸住在乡下，不再进城了。"], ["c30-067", "他睡在落叶上，穿着破旧的衣服，天天都在想你，一天比一天老了。"], ["c30-068", "我呢，孩子，我不是生病离开人世的。"], ["c30-069", "我是因为太想你，太想你的聪明，太想你的温柔，才离开人世的。"], ["c30-070", "快回家去吧！”"]]}, {"t": "p", "s": [["c30-071", "奥德修斯伸出手，想紧紧地抱住妈妈。"]]}, {"t": "p", "s": [["c30-072", "他三次伸出手去抱她，可三次都只抱住了一团雾。"], ["c30-073", "妈妈的影子，就像一个影子，一个梦，从他的手里飘走了。"]]}, {"t": "p", "s": [["c30-074", "奥德修斯难过极了。"], ["c30-075", "他回到了船上，叫伙伴们赶快解开缆绳，划船离开了那个永远没有阳光的地方。"]]}]}, {"title": "第三十一章　塞壬的歌声", "head": "c31-h", "audio": "audio/ch31.m4a?v=4ec6296cf4", "duration": 434.335, "times": {"c31-h": [0.0, 3.365], "c31-001": [4.365, 6.614], "c31-002": [7.464, 10.982], "c31-003": [11.332, 23.607], "c31-004": [23.957, 31.428], "c31-005": [32.278, 41.033], "c31-006": [41.383, 43.611], "c31-007": [43.961, 48.949], "c31-008": [49.299, 60.073], "c31-009": [60.423, 65.844], "c31-010": [66.194, 70.954], "c31-011": [71.304, 75.62], "c31-012": [75.97, 80.094], "c31-013": [80.944, 84.713], "c31-014": [85.563, 87.926], "c31-015": [88.276, 93.453], "c31-016": [93.803, 99.818], "c31-017": [100.668, 106.226], "c31-018": [107.076, 115.138], "c31-019": [115.488, 121.446], "c31-020": [121.796, 122.509], "c31-021": [123.359, 131.063], "c31-022": [131.413, 134.516], "c31-023": [135.366, 140.555], "c31-024": [140.905, 145.486], "c31-025": [145.836, 154.167], "c31-026": [155.017, 163.039], "c31-027": [163.889, 170.158], "c31-028": [170.508, 174.514], "c31-029": [175.364, 179.744], "c31-030": [180.594, 183.77], "c31-031": [184.12, 189.488], "c31-032": [189.838, 196.364], "c31-033": [197.214, 200.702], "c31-034": [201.052, 204.352], "c31-035": [204.702, 207.638], "c31-036": [208.488, 215.786], "c31-037": [216.636, 220.871], "c31-038": [221.221, 224.234], "c31-039": [224.584, 227.917], "c31-040": [228.767, 237.246], "c31-041": [237.596, 243.479], "c31-042": [243.829, 249.687], "c31-043": [250.537, 256.13], "c31-044": [256.48, 262.8], "c31-045": [263.15, 267.423], "c31-046": [267.773, 271.598], "song-sirens": [272.798, 276.798], "song-sirens-01": [276.798, 282.378], "song-sirens-02": [282.378, 288.998], "song-sirens-03": [289.798, 295.618], "song-sirens-04": [296.698, 301.898], "song-sirens-05": [303.398, 307.798], "song-sirens-06": [308.818, 314.938], "song-sirens-07": [316.018, 321.398], "song-sirens-08": [322.018, 326.438], "c31-047": [332.638, 335.416], "c31-048": [335.766, 344.125], "c31-049": [344.975, 349.244], "c31-050": [349.594, 355.798], "c31-051": [356.148, 362.785], "c31-052": [363.135, 366.979], "c31-053": [367.829, 372.009], "c31-054": [372.359, 377.116], "c31-055": [377.966, 385.106], "c31-056": [385.956, 389.814], "c31-057": [390.164, 396.574], "c31-058": [397.424, 402.764], "c31-059": [403.614, 405.966], "c31-060": [406.316, 412.682], "c31-061": [413.532, 422.339], "c31-062": [422.689, 426.113], "c31-063": [426.463, 432.835]}, "blocks": [{"t": "p", "s": [["c31-001", "他们回到了喀耳刻的岛上。"]]}, {"t": "p", "s": [["c31-002", "夜里，海边的篝火烧得旺旺的。"], ["c31-003", "喀耳刻坐在火堆旁边，一边给火添柴，一边认认真真地给奥德修斯讲着，每讲一样，就停下来，问他有没有听明白。"], ["c31-004", "伙伴们已经睡下了，只有他们两个人，一问一答，影子在沙滩上拉得很长。"]]}, {"t": "img", "src": "images/64.webp?v=1054a22cf1", "vid": "images/64.mp4?v=1f3bca70b0", "cap": "塞壬", "n": 64}, {"t": "p", "s": [["c31-005", "喀耳刻对奥德修斯说：“奥德修斯，你听好了，我告诉你回家路上的危险，众神会帮你记住的。"], ["c31-006", "你们首先会遇到两个塞壬。"], ["c31-007", "她们坐在开满鲜花的草地上，唱着世界上最好听的歌。"], ["c31-008", "谁要是不小心靠近了，听见了她们的歌声，就会忘了一切，把船划过去，再也回不了家，再也见不到他的妻子和孩子了。"], ["c31-009", "她们的身边，堆着很多白骨，那些都是被歌声迷住的水手。"], ["c31-010", "你们经过那里的时候，一定要用蜂蜡塞住伙伴们的耳朵。"], ["c31-011", "你要是自己想听，就让他们把你的手脚绑在桅杆上。"], ["c31-012", "你要是求他们放开你，他们就要把你绑得更紧。”"]]}, {"t": "p", "s": [["c31-013", "第二天一早，他们告别了喀耳刻，出发了。"]]}, {"t": "p", "s": [["c31-014", "喀耳刻没有再留他们。"], ["c31-015", "她的眼睛里有一点点湿润，嘴角却带着微笑。"], ["c31-016", "她抱了抱每一个伙伴，轻轻地说：“愿你们平平安安地回家。”"]]}, {"t": "p", "s": [["c31-017", "喀耳刻送来了一阵顺风，船飞快地向前驶去。"]]}, {"t": "p", "s": [["c31-018", "奥德修斯对伙伴们说：“伙伴们，喀耳刻告诉了我很多事情，我不能一个人知道，要让大家都知道。"], ["c31-019", "前面的海上，有两个塞壬，她们的歌声会把人迷住，让人再也回不了家。"], ["c31-020", "我们要小心！”"]]}, {"t": "p", "s": [["c31-021", "快到那里的时候，风一下子停了，海面上平得像一面镜子，连一点浪花也没有。"], ["c31-022", "一定是哪个神让大海睡着了。"]]}, {"t": "p", "s": [["c31-023", "太阳白花花地照在海面上，晃得人眼睛发花。"], ["c31-024", "船帆软软地垂着，像一块没有力气的布。"], ["c31-025", "海鸥也不叫了，整个世界静得出奇，只听见伙伴们的呼吸声，和心跳声。"]]}, {"t": "p", "s": [["c31-026", "伙伴们收起船帆，坐在长凳上，划起桨来，白色的浪花在船桨下翻滚。"]]}, {"t": "p", "s": [["c31-027", "奥德修斯拿出一大块蜂蜡，用宝剑切成小块，用手揉软。"], ["c31-028", "太阳晒在蜂蜡上，蜂蜡很快就变软了。"]]}, {"t": "img", "src": "images/65.webp?v=e47c2bbe1e", "vid": "images/65.mp4?v=60c60013ff", "cap": "耳朵里的蜂蜡", "n": 65}, {"t": "p", "s": [["c31-029", "他把揉软的蜂蜡，塞进每一个伙伴的耳朵里。"]]}, {"t": "p", "s": [["c31-030", "蜂蜡温温的，带着一点蜜的香味。"], ["c31-031", "伙伴们一个一个低下头，闭上眼睛，让他把蜡塞进去。"], ["c31-032", "耳朵一堵，整个世界一下子安静了，只剩下一种闷闷的嗡嗡声。"]]}, {"t": "p", "s": [["c31-033", "奥德修斯对伙伴们说：“我想听听塞壬的歌声。"], ["c31-034", "你们把我紧紧地绑在桅杆上，让我一动也不能动。"], ["c31-035", "我要是求你们放开我，你们就绑得再紧一点！”"]]}, {"t": "img", "src": "images/66.webp?v=75030ff25e", "vid": "images/66.mp4?v=9df14eb4b4", "cap": "绑在桅杆上", "n": 66}, {"t": "p", "s": [["c31-036", "伙伴们把他的手和脚，紧紧地绑在了桅杆上，然后又坐下来，划起了桨。"]]}, {"t": "p", "s": [["c31-037", "船划了过去，离塞壬的岛越来越近了。"], ["c31-038", "塞壬看见了船，就唱起了歌。"], ["c31-039", "她们的歌声飘了过来，又甜又美。"]]}, {"t": "p", "s": [["c31-040", "岛上开满了花，红的、白的、紫的，一片一片，像天上的云落在了地上。"], ["c31-041", "两个女子坐在花丛里，长发披在肩膀上，被风吹得飘了起来。"], ["c31-042", "她们的嘴唇一动，歌声就像蜂蜜一样，顺着海风，流了过来。"]]}, {"t": "p", "s": [["c31-043", "塞壬唱道：“到这儿来吧，奥德修斯，停下你的船，听听我们的歌！"], ["c31-044", "从来没有一个人，坐着黑色的船从这里经过，不停下来听听我们甜蜜的歌声。"], ["c31-045", "听了我们的歌，他会变得更快乐，知道更多的事情。"], ["c31-046", "我们知道特洛伊的战争，知道世界上所有的事情……”"]]}, {"t": "song", "title": "塞壬的歌", "head": "song-sirens", "lines": [["song-sirens-01", "到这儿来吧，远方的水手"], ["song-sirens-02", "放下你的桨，停下你的船"], ["song-sirens-03", "我们的歌声像蜂蜜一样甜"], ["song-sirens-04", "听一听吧，再也不用走远"], ["song-sirens-05", "来吧来吧，奥德修斯"], ["song-sirens-06", "花丛里阳光暖洋洋"], ["song-sirens-07", "天下的事情我们全知道"], ["song-sirens-08", "留下来吧，别回家乡"]]}, {"t": "p", "s": [["c31-047", "奥德修斯听得心都醉了。"], ["c31-048", "他拼命地点头、皱眉，用眼睛示意伙伴们放开他，他想划船过去，永远留在那里听歌。"]]}, {"t": "p", "s": [["c31-049", "绳子勒进了他的皮肉，他却一点也不觉得疼。"], ["c31-050", "他的眼睛里，只剩下那片开满花的草地，和草地上美丽的女子。"], ["c31-051", "他的嘴唇动了动，想大声喊，可是喉咙里只发出沙哑的声音。"], ["c31-052", "汗水顺着额头，一滴一滴地往下流。"]]}, {"t": "p", "s": [["c31-053", "可是伙伴们听不见，反而更用力地往前划。"], ["c31-054", "两个伙伴站起来，拿来更多的绳子，把他绑得更紧了。"]]}, {"t": "p", "s": [["c31-055", "船渐渐地划远了，塞壬的歌声越来越小，越来越小，最后再也听不见了。"]]}, {"t": "p", "s": [["c31-056", "桅杆上的绳子，还深深地勒在他的身上。"], ["c31-057", "他浑身是汗，大口地喘着气，像是刚刚跑完了一场长长的路。"]]}, {"t": "p", "s": [["c31-058", "直到歌声听不见了，伙伴们才取出耳朵里的蜂蜡，把他解开。"]]}, {"t": "p", "s": [["c31-059", "奥德修斯长长地出了一口气。"], ["c31-060", "他知道，要是没有伙伴们，他早就留在那片开满鲜花的草地上了。"]]}, {"t": "p", "s": [["c31-061", "他看着伙伴们一张一张被汗水湿透的脸，心里涌上了一阵说不出的感激。"], ["c31-062", "他用力拍了拍每个人的肩膀，说不出话来。"], ["c31-063", "伙伴们笑了笑，什么也没有问，又低下头，继续划起了桨。"]]}]}, {"title": "第三十二章　六个头的怪物和大漩涡", "head": "c32-h", "audio": "audio/ch32.m4a?v=1362c43005", "duration": 354.567, "times": {"c32-h": [0.0, 4.168], "c32-001": [5.168, 8.97], "c32-002": [9.82, 19.253], "c32-003": [19.603, 22.352], "c32-004": [23.202, 28.13], "c32-005": [28.48, 33.856], "c32-006": [34.206, 39.453], "c32-007": [40.303, 47.921], "c32-008": [48.271, 54.199], "c32-009": [55.049, 59.493], "c32-010": [60.343, 65.626], "c32-011": [65.976, 73.247], "c32-012": [73.597, 79.124], "c32-013": [79.974, 87.69], "c32-014": [88.04, 91.737], "c32-015": [92.087, 94.432], "c32-016": [94.782, 99.141], "c32-017": [99.491, 104.573], "c32-018": [105.423, 109.69], "c32-019": [110.04, 114.376], "c32-020": [115.226, 118.603], "c32-021": [118.953, 125.635], "c32-022": [125.985, 131.089], "c32-023": [131.939, 144.032], "c32-024": [144.382, 150.289], "c32-025": [150.639, 161.822], "c32-026": [162.172, 167.575], "c32-027": [168.425, 175.206], "c32-028": [175.556, 179.94], "c32-029": [180.29, 186.321], "c32-030": [187.171, 195.968], "c32-031": [196.818, 202.379], "c32-032": [202.729, 206.73], "c32-033": [207.58, 212.555], "c32-034": [212.905, 216.456], "c32-035": [216.806, 220.266], "c32-036": [221.116, 227.775], "c32-037": [228.625, 231.078], "c32-038": [231.428, 238.334], "c32-039": [238.684, 247.695], "c32-040": [248.545, 256.401], "c32-041": [256.751, 269.381], "c32-042": [270.231, 272.257], "c32-043": [273.107, 277.576], "c32-044": [277.926, 282.433], "c32-045": [282.783, 291.111], "c32-046": [291.961, 297.635], "c32-047": [297.985, 304.033], "c32-048": [304.883, 308.867], "c32-049": [309.217, 313.337], "c32-050": [314.187, 316.89], "c32-051": [317.24, 328.694], "c32-052": [329.044, 333.332], "c32-053": [334.182, 338.123], "c32-054": [338.473, 344.217], "c32-055": [344.567, 353.067]}, "blocks": [{"t": "p", "s": [["c32-001", "过了塞壬的岛，前面是一条窄窄的海峡。"]]}, {"t": "p", "s": [["c32-002", "远处，一团团白色的水雾，像云一样飘在海面上，被阳光一照，闪着七彩的光。"], ["c32-003", "可是，那光一点也不美。"]]}, {"t": "p", "s": [["c32-004", "两边的悬崖，像两位沉默的巨人，一左一右地站着。"], ["c32-005", "海水被挤得窄窄的，浪头一个撞着一个，发出轰隆隆的声音。"], ["c32-006", "天空被悬崖遮住了一大半，只剩下一条细细的蓝。"]]}, {"t": "p", "s": [["c32-007", "还没有到海峡，奥德修斯就看见了远处冒起的白色的水雾，听见了轰隆隆的巨响。"], ["c32-008", "伙伴们吓得手一松，船桨都掉进了水里，船停了下来。"]]}, {"t": "p", "s": [["c32-009", "奥德修斯在船上走来走去，一个一个地鼓励他们。"]]}, {"t": "p", "s": [["c32-010", "他走到每一个伙伴的身边，拍拍他们的肩膀，看着他们的眼睛。"], ["c32-011", "有的伙伴在发抖，他就握住他的手；有的伙伴在掉眼泪，他就用袖子替他擦干。"], ["c32-012", "他的声音不高，却很稳，像一块沉在水底的大石头。"]]}, {"t": "p", "s": [["c32-013", "奥德修斯说：“伙伴们，我们以前也遇到过危险，可是这一次，并不比独眼巨人的山洞更可怕。"], ["c32-014", "在那个山洞里，我们都靠着我的勇气和好主意逃了出来。"], ["c32-015", "这一次，我们也一定能逃过去。"], ["c32-016", "现在，大家听我的话，坐在长凳上，用力划桨！"], ["c32-017", "舵手，你要把船远远地避开那边的水雾和大浪，贴着悬崖走！”"]]}, {"t": "p", "s": [["c32-018", "可是，奥德修斯没有告诉伙伴们斯库拉的事情。"], ["c32-019", "他怕伙伴们害怕，丢下船桨，躲进船舱里去。"]]}, {"t": "p", "s": [["c32-020", "他的心里，有一块地方沉甸甸的。"], ["c32-021", "他知道，这是一个骗人的办法，可是为了让大家都能活下来，他只好选择这样。"], ["c32-022", "他把这件事，像一块石头，悄悄地压在了自己的心底。"]]}, {"t": "p", "s": [["c32-023", "喀耳刻早就告诉过他：海峡的一边，是一座高高的悬崖，悬崖的尖顶一直插进云彩里，光秃秃的，滑溜溜的，谁也爬不上去。"], ["c32-024", "悬崖半中间有一个山洞，洞里住着六个头的怪物斯库拉。"], ["c32-025", "她有十二只脚，六根长长的脖子，每根脖子上，都长着一个可怕的头，每个头里，都有三排尖尖的牙齿。"], ["c32-026", "只要有船经过，她的六个头就会伸出来，一下子抓走六个人。"]]}, {"t": "img", "src": "images/67.webp?v=c6307907fb", "vid": "images/67.mp4?v=1d666cfa6c", "cap": "悬崖和漩涡", "n": 67}, {"t": "p", "s": [["c32-027", "海峡的另一边，是一个可怕的大漩涡，名叫卡律布狄斯。"], ["c32-028", "它一天三次，把海水吸进去，又吐出来。"], ["c32-029", "它吸水的时候，什么船靠近了，都会被吞下去，就连海神也救不了。"]]}, {"t": "p", "s": [["c32-030", "喀耳刻说过：宁可贴着斯库拉的悬崖走，失去六个伙伴，也不要让整条船被大漩涡吞下去。"]]}, {"t": "p", "s": [["c32-031", "奥德修斯还是穿上了盔甲，拿起了两根长矛，站在船头。"], ["c32-032", "他想，要是斯库拉出来，他就和她拼一拼。"]]}, {"t": "p", "s": [["c32-033", "铜盔甲冰冷冰冷的，贴在身上，让他打了个哆嗦。"], ["c32-034", "他把长矛握得紧紧的，手心里全是汗。"], ["c32-035", "海风吹起他的披风，哗啦啦地响。"]]}, {"t": "p", "s": [["c32-036", "可是他看来看去，怎么也看不见斯库拉在哪里，眼睛都看酸了。"]]}, {"t": "p", "s": [["c32-037", "他们只好贴着悬崖那一边走。"], ["c32-038", "大家都紧紧盯着另一边的大漩涡，看着它把海水吸得露出了海底的黑沙。"], ["c32-039", "漩涡吐水的时候，海水就像在大锅里煮开了一样，翻滚着，咆哮着，白色的浪花一直溅到悬崖顶上。"]]}, {"t": "p", "s": [["c32-040", "漩涡中间是一个黑洞洞的大嘴，里面传来隆隆的响声，像是大地在咳嗽。"], ["c32-041", "水面上盘旋着一圈又一圈的泡沫，一圈比一圈大，一圈比一圈快，把附近漂着的木头和海草，全都卷了进去，再也看不见了。"]]}, {"t": "p", "s": [["c32-042", "伙伴们吓得脸都白了。"]]}, {"t": "p", "s": [["c32-043", "他们的嘴唇在发抖，手里的桨几乎握不住了。"], ["c32-044", "有的人闭上了眼睛，有的人嘴里念叨着众神的名字。"], ["c32-045", "船贴着悬崖，一寸一寸地往前挪，船舷擦着石壁，发出吱吱的声音。"]]}, {"t": "p", "s": [["c32-046", "就在这时，斯库拉从悬崖上伸下六个头，一下子抓走了六个伙伴。"], ["c32-047", "他们在半空中喊着奥德修斯的名字，伸着手，向他求救。"]]}, {"t": "img", "src": "images/68.webp?v=7677e8c6f0", "vid": "images/68.mp4?v=1cb43a3162", "cap": "冲过海峡", "n": 68}, {"t": "p", "s": [["c32-048", "这是奥德修斯在海上见过的最伤心的一幕。"], ["c32-049", "他们咬着牙，拼命地划，终于冲出了海峡。"]]}, {"t": "p", "s": [["c32-050", "他想冲过去，却一步也动不了。"], ["c32-051", "他只能睁大眼睛，眼睁睁地看着那些熟悉的脸，在半空中一点一点地变小，变小，最后消失在悬崖的阴影里。"], ["c32-052", "他的喉咙像被什么堵住了，眼泪不停地往下流。"]]}, {"t": "p", "s": [["c32-053", "船冲出海峡以后，大家谁也没有说话。"], ["c32-054", "风轻轻地吹着，吹干了脸上的泪，却吹不走心里的难过。"], ["c32-055", "奥德修斯一个人站在船头，望着后面渐渐远去的悬崖，很久很久，没有回头。"]]}]}, {"title": "第三十三章　太阳神的牛", "head": "c33-h", "audio": "audio/ch33.m4a?v=192ee515a9", "duration": 372.364, "times": {"c33-h": [0.0, 3.411], "c33-001": [4.411, 8.26], "c33-002": [9.11, 15.831], "c33-003": [16.181, 22.984], "c33-004": [23.334, 28.144], "c33-005": [28.494, 32.515], "c33-006": [33.365, 36.559], "c33-007": [37.409, 44.741], "c33-008": [45.091, 47.543], "c33-009": [47.893, 50.549], "c33-010": [51.399, 56.934], "c33-011": [57.284, 63.703], "c33-012": [64.053, 69.751], "c33-013": [70.101, 72.747], "c33-014": [73.597, 75.635], "c33-015": [76.485, 86.009], "c33-016": [86.359, 88.026], "c33-017": [88.876, 96.446], "c33-018": [96.796, 101.824], "c33-019": [102.174, 104.311], "c33-020": [105.161, 112.891], "c33-021": [113.741, 117.338], "c33-022": [117.688, 126.354], "c33-023": [127.204, 137.768], "c33-024": [138.118, 141.422], "c33-025": [142.272, 150.264], "c33-026": [150.614, 153.103], "c33-027": [153.453, 156.731], "c33-028": [157.081, 164.582], "c33-029": [164.932, 173.151], "c33-030": [174.001, 177.758], "c33-031": [178.608, 184.797], "c33-032": [185.147, 188.398], "c33-033": [189.248, 192.28], "c33-034": [192.63, 195.5], "c33-035": [196.35, 203.224], "c33-036": [203.574, 205.948], "c33-037": [206.298, 214.74], "c33-038": [215.59, 221.184], "c33-039": [221.534, 227.125], "c33-040": [227.975, 230.726], "c33-041": [231.076, 239.121], "c33-042": [239.971, 246.186], "c33-043": [250.718, 256.576], "c33-044": [256.926, 260.207], "c33-045": [260.557, 271.598], "c33-046": [275.629, 281.811], "c33-047": [282.161, 283.562], "c33-048": [284.412, 297.327], "c33-049": [298.177, 303.045], "c33-050": [303.395, 306.549], "c33-051": [307.399, 309.243], "c33-052": [309.593, 318.711], "c33-053": [319.061, 327.477], "c33-054": [328.327, 334.459], "c33-055": [334.809, 343.66], "c33-056": [344.01, 346.301], "c33-057": [347.151, 349.039], "c33-058": [349.389, 354.941], "c33-059": [355.791, 358.595], "c33-060": [358.945, 362.303], "c33-061": [362.653, 368.531], "c33-062": [368.881, 370.864]}, "blocks": [{"t": "p", "s": [["c33-001", "冲出了海峡，他们来到了太阳神的岛。"]]}, {"t": "img", "src": "images/69.webp?v=a04d1f5d61", "vid": "images/69.mp4?v=cd6b38ff0d", "cap": "太阳神的牛", "n": 69}, {"t": "p", "s": [["c33-002", "还在海上，奥德修斯就听见了牛群的哞哞声和羊群的咩咩声。"], ["c33-003", "岛上的草地上，有七群牛和七群羊，每群五十头，又肥又漂亮。"], ["c33-004", "这些牛羊从来不会生小牛小羊，也从来不会死。"], ["c33-005", "它们是太阳神的，由太阳神的两个女儿看管着。"]]}, {"t": "p", "s": [["c33-006", "奥德修斯想起了老先知和喀耳刻的话。"]]}, {"t": "p", "s": [["c33-007", "奥德修斯对伙伴们说：“伙伴们，我们别上岸了，老先知说过，千万不能伤害太阳神的牛。"], ["c33-008", "我们最大的灾难，就在这座岛上。"], ["c33-009", "我们还是绕过这座岛，继续往前划吧。”"]]}, {"t": "p", "s": [["c33-010", "欧律罗科斯生气地说：“奥德修斯，你真是铁打的，从来不知道累！"], ["c33-011", "可是我们不一样，我们又累又困，你为什么不让我们上岸，好好吃一顿晚饭，睡一个好觉？"], ["c33-012", "天马上就要黑了，夜里的大海最危险，要是遇上了风暴，我们就都完了。"], ["c33-013", "我们就在这里过一夜吧，明天一早再走。”"]]}, {"t": "p", "s": [["c33-014", "伙伴们都说他说得对。"]]}, {"t": "p", "s": [["c33-015", "奥德修斯知道，自己一个人说不过大家，只好让大家发誓，只吃船上带的东西，不碰那些牛羊。"], ["c33-016", "伙伴们都发了誓。"]]}, {"t": "p", "s": [["c33-017", "谁知道，那天夜里，宙斯刮起了一阵大风，海上一下子刮起了南风。"], ["c33-018", "这阵南风，一刮就是整整一个月，一天也没有停过。"], ["c33-019", "他们根本没有办法出海。"]]}, {"t": "p", "s": [["c33-020", "只要船上的粮食和酒还没吃完，伙伴们都遵守着自己的誓言，没有碰那些牛羊。"]]}, {"t": "img", "src": "images/70.webp?v=0c1f3eb2ac", "vid": "images/70.mp4?v=34dde7a820", "cap": "饿着肚子", "n": 70}, {"t": "p", "s": [["c33-021", "可是，船上的粮食终于吃光了。"], ["c33-022", "大家只好钓鱼、抓鸟，用弯弯的鱼钩，在海边钓一切能钓到的东西，饿得肚子咕咕叫。"]]}, {"t": "p", "s": [["c33-023", "有一天，奥德修斯一个人到岛上去，找了一个没有风的地方，洗干净手，向众神祈祷，求众神给他们指一条回家的路。"], ["c33-024", "祈祷完，众神让他甜甜地睡着了。"]]}, {"t": "p", "s": [["c33-025", "伙伴们饿坏了，他们说：“伙伴们，听我说，什么死法都可怕，可是最可怕的，是饿死！"], ["c33-026", "与其饿死，还不如吃一顿饱饭！"], ["c33-027", "我们去赶几头最好的牛来，向众神献祭。"], ["c33-028", "等我们回到了伊萨卡，就给太阳神盖一座漂亮的神庙，送给他很多很多的礼物，他就不会生气了。"], ["c33-029", "就算他真的生气，要毁掉我们的船，我也宁愿在大海里一口气淹死，也不愿意在这座荒岛上慢慢地饿死！”"]]}, {"t": "p", "s": [["c33-030", "他们赶来了几头最肥的牛，宰了吃掉了。"]]}, {"t": "p", "s": [["c33-031", "奥德修斯醒过来，往回走，还没到船边，就闻到了烤肉的香味。"], ["c33-032", "他大叫一声，心里明白：灾难来了。"]]}, {"t": "p", "s": [["c33-033", "太阳神的女儿跑去告诉了她的爸爸。"], ["c33-034", "太阳神知道了，气得去找宙斯。"]]}, {"t": "p", "s": [["c33-035", "太阳神说：“宙斯，还有众神们，快惩罚奥德修斯的伙伴们吧！"], ["c33-036", "他们竟敢杀了我的牛。"], ["c33-037", "要是他们不受到惩罚，我就钻到地底下去，再也不给天上和人间送来阳光了！”"]]}, {"t": "img", "src": "images/71.webp?v=f2664bea7b", "vid": "images/71.mp4?v=2fd4cf8159", "cap": "雷电劈船", "n": 71}, {"t": "p", "s": [["c33-038", "宙斯说：“太阳神，你继续照着众神和人间吧。"], ["c33-039", "我会用雷电，把他们的船在大海中间劈成碎片。”"]]}, {"t": "p", "s": [["c33-040", "伙伴们在岛上吃了六天的牛肉。"], ["c33-041", "到了第七天，风终于停了，他们赶紧上船，竖起桅杆，张开船帆，出海了。"]]}, {"t": "p", "s": [["c33-042", "他们刚一出海，宙斯就打下一道雷电，把船劈成了碎片。"]]}, {"t": "p", "s": [["c33-043", "一大团乌云停在了船的上空，大海一下子变得黑漆漆的。"], ["c33-044", "西风呼啸着刮来，吹断了桅杆。"], ["c33-045", "紧接着，一道雷电打在船上，船一下子转了好几个圈，整条船都碎了，船上满是硫黄的烟。"], ["c33-046", "伙伴们都掉进了大海，就像一群海鸟在黑色的浪花里漂浮着。"], ["c33-047", "他们再也没有回来。"]]}, {"t": "p", "s": [["c33-048", "只有奥德修斯一个人，抓住了漂在水上的桅杆和船底的龙骨，用一根牛皮绳子把它们绑在一起，骑在上面，任凭风浪把他带走。"]]}, {"t": "p", "s": [["c33-049", "南风又刮了起来，把他吹回了那条可怕的海峡。"], ["c33-050", "天亮的时候，他来到了大漩涡的旁边。"]]}, {"t": "p", "s": [["c33-051", "大漩涡正在吸水。"], ["c33-052", "奥德修斯一下子跳了起来，抓住了悬崖上长着的一棵大无花果树，像一只蝙蝠一样，紧紧地挂在树上。"], ["c33-053", "他的脚踩不到地，也爬不上去，只好一直挂着，等着大漩涡把桅杆和龙骨再吐出来。"]]}, {"t": "img", "src": "images/72.webp?v=cb9774cea8", "vid": "images/72.mp4?v=137f0c5cdf", "cap": "抱着桅杆漂流", "n": 72}, {"t": "p", "s": [["c33-054", "过了好久好久，桅杆和龙骨终于又从漩涡里浮了上来。"], ["c33-055", "奥德修斯松开手，“扑通”一声，掉在了它们旁边，赶紧爬了上去，用手当桨，拼命地划。"], ["c33-056", "宙斯没有让斯库拉看见他。"]]}, {"t": "p", "s": [["c33-057", "他在海上漂了九天。"], ["c33-058", "到了第十天夜里，众神把他送到了仙女卡吕普索的岛上。"]]}, {"t": "p", "s": [["c33-059", "奥德修斯讲到这里，停了下来。"], ["c33-060", "他说：“后来，我在卡吕普索的岛上住了七年。"], ["c33-061", "她放我走了，我坐着木筏，在海上遇到了风暴，被海浪冲到了你们的国家。"], ["c33-062", "后来的事，你们就都知道了。”"]]}]}, {"title": "第三十四章　回到伊萨卡", "head": "c34-h", "audio": "audio/ch34.m4a?v=3a1283f767", "duration": 388.52, "times": {"c34-h": [0.0, 2.937], "c34-001": [3.937, 8.678], "c34-002": [9.028, 15.031], "c34-003": [15.881, 20.387], "c34-004": [21.237, 28.757], "c34-005": [29.107, 34.943], "c34-006": [35.793, 38.906], "c34-007": [39.256, 50.709], "c34-008": [51.559, 52.946], "c34-009": [53.796, 63.522], "c34-010": [64.372, 69.284], "c34-011": [69.634, 73.663], "c34-012": [74.013, 76.195], "c34-013": [76.545, 81.505], "c34-014": [82.355, 86.007], "c34-015": [86.857, 92.632], "c34-016": [92.982, 100.865], "c34-017": [101.715, 108.975], "c34-018": [109.325, 120.644], "c34-019": [121.494, 124.582], "c34-020": [124.932, 134.858], "c34-021": [135.208, 137.929], "c34-022": [138.279, 141.687], "c34-023": [142.537, 145.755], "c34-024": [146.105, 155.522], "c34-025": [156.372, 161.464], "c34-026": [162.314, 171.65], "c34-027": [172.0, 176.619], "c34-028": [176.969, 182.616], "c34-029": [183.466, 186.163], "c34-030": [186.513, 194.061], "c34-031": [194.411, 202.894], "c34-032": [203.744, 206.423], "c34-033": [207.273, 210.329], "c34-034": [210.679, 220.554], "c34-035": [221.404, 233.434], "c34-036": [234.284, 239.996], "c34-037": [240.346, 248.106], "c34-038": [248.956, 251.681], "c34-039": [252.031, 259.506], "c34-040": [259.856, 264.82], "c34-041": [265.67, 267.691], "c34-042": [268.041, 269.217], "c34-043": [269.567, 273.723], "c34-044": [274.573, 277.732], "c34-045": [278.082, 284.005], "c34-046": [284.855, 292.97], "c34-047": [293.82, 299.043], "c34-048": [299.893, 302.319], "c34-049": [302.669, 311.273], "c34-050": [312.123, 315.761], "c34-051": [316.611, 323.899], "c34-052": [324.249, 333.343], "c34-053": [334.193, 340.126], "c34-054": [340.476, 345.661], "c34-055": [346.511, 351.568], "c34-056": [351.918, 356.515], "c34-057": [356.865, 360.186], "c34-058": [360.536, 365.462], "c34-059": [365.812, 369.854], "c34-060": [370.704, 387.02]}, "blocks": [{"t": "p", "s": [["c34-001", "奥德修斯讲完了，大厅里很久很久都没有人说话。"], ["c34-002", "大家都被他的故事迷住了，好像还坐在那艘在海上漂了十年的船上。"]]}, {"t": "p", "s": [["c34-003", "过了好一会儿，国王阿尔基诺奥斯才开口说话。"]]}, {"t": "p", "s": [["c34-004", "国王说：“奥德修斯，你来到了我的家，我相信，你不会再在海上漂流了，你一定能回到家乡。"], ["c34-005", "朋友们，我们每个人再送他一件礼物吧，送他一个大铜鼎，再送他一口铜锅！”"]]}, {"t": "p", "s": [["c34-006", "大厅里响起了一片叫好的声音。"], ["c34-007", "仆人们一趟又一趟地搬着礼物，金杯、银盘、漂亮的衣服、结实的鞋子，不一会儿，就在大厅门口堆成了一座小山。"]]}, {"t": "p", "s": [["c34-008", "大家都说好。"]]}, {"t": "p", "s": [["c34-009", "第二天，费埃克斯人把所有的礼物都搬到了船上，整整齐齐地放在长凳底下，免得划桨的时候碰到。"]]}, {"t": "p", "s": [["c34-010", "太阳落山的时候，奥德修斯和国王、王后告别。"], ["c34-011", "他举起酒杯，对王后说：“王后，再见了！"], ["c34-012", "愿你永远幸福，直到老年。"], ["c34-013", "愿你和你的孩子们、你的人民，还有国王，都生活得快快乐乐。”"]]}, {"t": "p", "s": [["c34-014", "说完，他走出了王宫，走上了船。"]]}, {"t": "p", "s": [["c34-015", "水手们在船尾给他铺好了毯子和床单，让他能安安稳稳地睡觉。"], ["c34-016", "奥德修斯一躺下，就睡着了，睡得又香又沉，就像死去了一样，什么也不知道了。"]]}, {"t": "p", "s": [["c34-017", "夜风轻轻地吹着，船身轻轻地摇着，像妈妈在摇一个累坏了的孩子。"], ["c34-018", "星星一颗一颗地亮了起来，月光落在他的脸上，他的嘴角带着一点点微笑，也许，他正梦见自己的家。"]]}, {"t": "img", "src": "images/73.webp?v=79e75b484e", "vid": "images/73.mp4?v=761f388357", "cap": "比老鹰还快的船", "n": 73}, {"t": "p", "s": [["c34-019", "水手们坐在长凳上，划起了桨。"], ["c34-020", "船飞快地前进着，就像四匹骏马拉着的马车，在平原上奔驰，在大海上留下了一道长长的白浪。"], ["c34-021", "那条船跑得比老鹰还快。"], ["c34-022", "就连天上飞得最快的鹰，也追不上它。"]]}, {"t": "p", "s": [["c34-023", "船上载着一个和众神一样聪明的人。"], ["c34-024", "这个人在战场上、在海上吃了那么多苦，现在，他终于安安静静地睡着了，把所有的苦难都忘掉了。"]]}, {"t": "p", "s": [["c34-025", "天上最亮的那颗星星升起来的时候，船靠近了伊萨卡。"]]}, {"t": "p", "s": [["c34-026", "伊萨卡有一个安静的海湾，海湾的两边，是两块伸进海里的大岩石，挡住了外面的大风大浪。"], ["c34-027", "海湾的尽头，长着一棵枝叶茂盛的大橄榄树。"], ["c34-028", "橄榄树旁边，有一个美丽的山洞，那是海里的仙女们住的地方。"]]}, {"t": "img", "src": "images/74.webp?v=8f275bd125", "vid": "images/74.mp4?v=acbc6a2099", "cap": "睡在沙滩上", "n": 74}, {"t": "p", "s": [["c34-029", "天亮的时候，船靠了岸。"], ["c34-030", "水手们把还在睡觉的奥德修斯，连同毯子一起抬了起来，轻轻地放在沙滩上。"], ["c34-031", "他们又把国王送的礼物都搬下来，堆在橄榄树下，离大路远远的，免得过路的人把它们拿走。"]]}, {"t": "p", "s": [["c34-032", "然后，他们就开船回去了。"]]}, {"t": "p", "s": [["c34-033", "海神波塞冬看见了，非常生气。"], ["c34-034", "他去找宙斯，他说：“费埃克斯人竟敢用船把奥德修斯送回了家，还送给他那么多金子和铜器，比他从特洛伊带回来的还多！”"]]}, {"t": "p", "s": [["c34-035", "快船回到费埃克斯人的港口的时候，波塞冬用手掌一拍，那条船一下子变成了一块大石头，在海底生了根，永远立在了港口外面。"]]}, {"t": "p", "s": [["c34-036", "奥德修斯醒过来，四周一片大雾，他根本认不出这是哪里。"], ["c34-037", "雅典娜故意在四周洒下了一层浓雾，让他认不出自己的家乡，好先给他出个主意。"]]}, {"t": "p", "s": [["c34-038", "他揉了揉眼睛，慢慢地坐起来。"], ["c34-039", "沙滩是陌生的，山坡是陌生的，连天空的颜色，也好像和记忆里不一样。"], ["c34-040", "他一个人站在雾里，孤零零的，心里一阵一阵地发凉。"]]}, {"t": "p", "s": [["c34-041", "奥德修斯说：“我真倒霉！"], ["c34-042", "我又来到了什么地方？"], ["c34-043", "费埃克斯人把我丢在了一个陌生的地方，还说要送我回伊萨卡！”"]]}, {"t": "p", "s": [["c34-044", "他数了数身边的礼物，一件也不少。"], ["c34-045", "可是他还是很难过，沿着海边走来走去，想念着家乡。"]]}, {"t": "p", "s": [["c34-046", "雅典娜变成一个年轻的牧羊人，走到他面前，说：“奥德修斯，这里就是你的家乡伊萨卡啊！”"]]}, {"t": "p", "s": [["c34-047", "奥德修斯一下子认出了她，就是宙斯的女儿，雅典娜。"]]}, {"t": "p", "s": [["c34-048", "雅典娜挥了挥手，雾散了。"], ["c34-049", "奥德修斯看见了熟悉的海湾、熟悉的橄榄树和山洞，看见了熟悉的山坡和树林。"]]}, {"t": "img", "src": "images/75.webp?v=f0807d1436", "vid": "images/75.mp4?v=5570873dc2", "cap": "亲吻家乡的土地", "n": 75}, {"t": "p", "s": [["c34-050", "他高兴得跪了下来，亲吻着家乡的土地。"]]}, {"t": "p", "s": [["c34-051", "泥土里有青草的味道，混着咸咸的海风，他深深地吸了一口，眼泪就掉了下来。"], ["c34-052", "二十年了，他每天都在梦里闻着这个味道，现在终于，它就在他的鼻尖，真实得让人想哭。"]]}, {"t": "p", "s": [["c34-053", "雅典娜帮他把礼物藏进了山洞，用一块大石头挡住了洞口。"], ["c34-054", "然后，他们坐在橄榄树下，商量怎样对付那些求婚者。"]]}, {"t": "img", "src": "images/76.webp?v=eb1a7cfdec", "vid": "images/76.mp4?v=d8f88c6216", "cap": "变成老乞丐", "n": 76}, {"t": "p", "s": [["c34-055", "雅典娜说：“王宫里住满了求婚者，你不能就这样回去。"], ["c34-056", "他们已经在你的家里住了三年了，天天逼你的妻子改嫁。"], ["c34-057", "我要把你变成一个老乞丐，谁也认不出你。"], ["c34-058", "你先到你的牧猪人欧迈俄斯那里去，他是一个忠心的人。"], ["c34-059", "我去斯巴达，把你的儿子忒勒马科斯叫回来。”"]]}, {"t": "p", "s": [["c34-060", "她用金手杖一点，奥德修斯的皮肤起了皱纹，头发掉光了，眼睛也浑浊了，身上穿着一件又脏又破的旧衣服，手里拄着一根木棍，背上还背着一个打满补丁的破口袋。"]]}]}, {"title": "第三十五章　牧猪人欧迈俄斯", "head": "c35-h", "audio": "audio/ch35.m4a?v=a593b62193", "duration": 347.937, "times": {"c35-h": [0.0, 4.138], "c35-001": [5.138, 13.356], "c35-002": [14.206, 23.381], "c35-003": [24.231, 31.2], "c35-004": [31.55, 38.076], "c35-005": [38.426, 47.152], "c35-006": [47.502, 52.547], "c35-007": [52.897, 62.391], "c35-008": [63.241, 69.045], "c35-009": [69.895, 76.849], "c35-010": [81.392, 86.53], "c35-011": [87.38, 95.828], "c35-012": [96.678, 104.412], "c35-013": [104.762, 110.679], "c35-014": [111.529, 118.74], "c35-015": [119.09, 120.981], "c35-016": [121.331, 127.843], "c35-017": [128.193, 131.745], "c35-018": [132.095, 139.062], "c35-019": [139.912, 149.372], "c35-020": [150.222, 157.711], "c35-021": [158.561, 164.721], "c35-022": [165.071, 167.992], "c35-023": [168.342, 172.42], "c35-024": [173.27, 184.067], "c35-025": [184.917, 193.909], "c35-026": [194.259, 197.302], "c35-027": [197.652, 202.885], "c35-028": [203.235, 206.115], "c35-029": [206.465, 208.166], "c35-030": [208.516, 215.652], "c35-031": [216.002, 217.261], "c35-032": [218.111, 226.574], "c35-033": [226.924, 230.854], "c35-034": [231.704, 237.509], "c35-035": [237.859, 244.458], "c35-036": [244.808, 251.817], "c35-037": [252.667, 257.353], "c35-038": [257.703, 262.554], "c35-039": [263.404, 272.122], "c35-040": [272.472, 277.116], "c35-041": [277.466, 279.303], "c35-042": [279.653, 283.505], "c35-043": [284.355, 289.917], "c35-044": [290.267, 298.723], "c35-045": [299.573, 306.668], "c35-046": [307.018, 307.93], "c35-047": [308.78, 315.344], "c35-048": [315.694, 325.627], "c35-049": [326.477, 338.017], "c35-050": [338.867, 346.437]}, "blocks": [{"t": "img", "src": "images/77.webp?v=f6a71dc212", "vid": "images/77.mp4?v=35ee095c86", "cap": "山上的猪场", "n": 77}, {"t": "p", "s": [["c35-001", "老乞丐沿着一条崎岖的山路，穿过树林，爬上了山坡，来到了山上的一座猪场。"]]}, {"t": "p", "s": [["c35-002", "这座猪场，是牧猪人欧迈俄斯用石头一块一块垒起来的，四周还围着一圈黑色的橡木栅栏。"]]}, {"t": "p", "s": [["c35-003", "石头墙垒得整整齐齐，一块挨着一块，缝里长出了一点点青苔。"], ["c35-004", "栅栏的木桩又粗又直，上面钉满了尖尖的刺，是用来防狼的。"], ["c35-005", "院子里干干净净，没有一点杂物，看得出来，这里的主人，是一个爱干净、勤快的人。"], ["c35-006", "猪场里有十二个猪圈，每个猪圈里住着五十头母猪。"], ["c35-007", "公猪住在外面，数量越来越少，因为求婚者们天天叫欧迈俄斯送最肥的公猪到王宫里去，让他们吃。"]]}, {"t": "p", "s": [["c35-008", "欧迈俄斯正坐在猪场门口，给自己做一双牛皮凉鞋。"]]}, {"t": "p", "s": [["c35-009", "突然，四条像野兽一样凶猛的大狗，看见了老乞丐，狂叫着冲了过来。"]]}, {"t": "p", "s": [["c35-010", "奥德修斯很聪明，他马上坐在了地上，扔掉了手里的木棍。"]]}, {"t": "p", "s": [["c35-011", "欧迈俄斯听见狗叫，丢下手里的牛皮，赶紧跑过来，大声吆喝，又扔石头把狗赶跑了。"]]}, {"t": "p", "s": [["c35-012", "狗被石头吓得夹着尾巴跑开了，一边跑，一边回头，还不甘心地低声叫着。"], ["c35-013", "欧迈俄斯喘着气，一把扶起了地上的老乞丐，拍了拍他身上的土。"]]}, {"t": "p", "s": [["c35-014", "欧迈俄斯说：“老人家，差一点点，这些狗就把你咬伤了，那样我可就太难过了。"], ["c35-015", "众神已经让我够伤心的了。"], ["c35-016", "我的主人，一个像神一样的人，不在家，不知道在哪里流浪，说不定连饭也吃不饱。"], ["c35-017", "我在这里给别人养猪，看着别人吃掉主人的猪。"], ["c35-018", "老人家，快跟我进屋吧，先吃点东西，喝点酒，再告诉我，你是从哪里来的，吃了什么苦。”"]]}, {"t": "p", "s": [["c35-019", "他把老乞丐领进小屋，在地上铺了一层厚厚的树枝，又在树枝上铺了一张毛茸茸的野山羊皮，请他坐下。"]]}, {"t": "p", "s": [["c35-020", "奥德修斯说：“好心的人，愿宙斯和众神，给你你想要的一切，因为你这样热情地招待我。”"]]}, {"t": "p", "s": [["c35-021", "欧迈俄斯说：“老人家，就算来的客人比你还穷，我也不能不招待他。"], ["c35-022", "所有的客人和乞丐，都是宙斯派来的。"], ["c35-023", "我们这些仆人能给的东西不多，可是我们心里愿意给。”"]]}, {"t": "p", "s": [["c35-024", "欧迈俄斯走到猪圈里，抓来了两头小猪，烤得香喷喷的，放在老乞丐面前，又在木碗里给他调了一碗甜甜的红酒。"]]}, {"t": "img", "src": "images/78.webp?v=521329ad8d", "vid": "images/78.mp4?v=4ae04f51c0", "cap": "牧猪人的叹气", "n": 78}, {"t": "p", "s": [["c35-025", "欧迈俄斯给他铺上羊皮，烤了两头小猪请他吃，一边叹气一边说：“我的主人是天下最好的人。"], ["c35-026", "他一走就是二十年，不知道是不是还活着。"], ["c35-027", "要是他在家，我早就有了一座自己的房子、一块地，还娶上了一个好妻子。"], ["c35-028", "我的主人对我，就像对自己的孩子一样。"], ["c35-029", "可是他再也回不来了。"], ["c35-030", "现在，那些求婚者天天叫我送最肥的猪去王宫，他们吃起东西来，一点儿也不怕众神惩罚。"], ["c35-031", "我心里难过极了。”"]]}, {"t": "p", "s": [["c35-032", "奥德修斯听了，心里暖暖的，可他什么也没有说，只是低着头，大口地吃肉喝酒。"], ["c35-033", "他心里正在想着，怎样惩罚那些求婚者。"]]}, {"t": "p", "s": [["c35-034", "炉火噼噼啪啪地烧着，火光映在墙上，晃来晃去。"], ["c35-035", "窗外，雨点打在屋顶上，沙沙沙沙的，像无数只小脚在跑。"], ["c35-036", "他听着听着，觉得二十年来，这是他第一次，坐在一个真正像家的地方。"]]}, {"t": "p", "s": [["c35-037", "吃完了饭，奥德修斯说：“朋友，你说的那个主人是谁？"], ["c35-038", "要是我见过他，说不定能告诉你他的消息，我走过了很多很多的地方。”"]]}, {"t": "p", "s": [["c35-039", "欧迈俄斯说：“老人家，到伊萨卡来的流浪汉，个个都说见过我的主人，好从王后那里得到一件衣服、一顿饭。"], ["c35-040", "王后每次都把他们请进去，问东问西，一边听一边流眼泪。"], ["c35-041", "可是他们说的都是假话。"], ["c35-042", "我的主人，一定早就被鱼吃掉了，或者被鸟吃掉了。”"]]}, {"t": "p", "s": [["c35-043", "奥德修斯说：“朋友，我现在就向你发誓：奥德修斯一定会回来！"], ["c35-044", "就在这个月里，旧的月亮走了，新的月亮出来的时候，他就会回到家里，惩罚那些欺负他的妻子和儿子的人。”"]]}, {"t": "p", "s": [["c35-045", "欧迈俄斯摇着头说：“老人家，别说了，我不想再听这样的话了，每次听了，我都难过得要命。"], ["c35-046", "我们还是喝酒吧。”"]]}, {"t": "p", "s": [["c35-047", "那天夜里，天气又冷又湿，下起了大雨，西风呼呼地刮着。"], ["c35-048", "欧迈俄斯给老乞丐在火炉边铺了一张床，盖上了绵羊皮和山羊皮，还把自己最厚的一件大斗篷盖在了他的身上。"]]}, {"t": "p", "s": [["c35-049", "而他自己，背上宝剑，披上一件挡风的厚斗篷，拿起一根长矛，走出了小屋，到外面的岩石下面，守着他的猪去了。"]]}, {"t": "p", "s": [["c35-050", "奥德修斯看着他的背影，心里高兴极了：他的这个仆人，真是一个忠心的好人。"]]}]}, {"title": "第三十六章　忒勒马科斯回家", "head": "c36-h", "audio": "audio/ch36.m4a?v=925189fd7c", "duration": 353.142, "times": {"c36-h": [0.0, 3.624], "c36-001": [4.624, 7.541], "c36-002": [8.391, 13.541], "c36-003": [13.891, 17.974], "c36-004": [18.824, 23.732], "c36-005": [24.082, 28.72], "c36-006": [29.07, 39.11], "c36-007": [39.96, 43.517], "c36-008": [43.867, 47.766], "c36-009": [48.616, 57.649], "c36-010": [57.999, 66.537], "c36-011": [66.887, 71.654], "c36-012": [72.504, 82.667], "c36-013": [83.017, 83.703], "c36-014": [84.053, 92.839], "c36-015": [93.189, 96.767], "c36-016": [97.117, 103.94], "c36-017": [104.29, 105.978], "c36-018": [106.828, 109.981], "c36-019": [110.831, 115.632], "c36-020": [116.482, 121.299], "c36-021": [121.649, 128.374], "c36-022": [128.724, 135.581], "c36-023": [136.431, 142.319], "c36-024": [143.169, 154.703], "c36-025": [155.053, 157.695], "c36-026": [158.545, 170.63], "c36-027": [171.48, 176.377], "c36-028": [176.727, 179.505], "c36-029": [179.855, 182.688], "c36-030": [183.038, 184.635], "c36-031": [185.485, 189.505], "c36-032": [190.355, 203.583], "c36-033": [203.933, 208.437], "c36-034": [209.287, 212.643], "c36-035": [212.993, 216.481], "c36-036": [216.831, 220.588], "c36-037": [221.438, 230.501], "c36-038": [230.851, 239.487], "c36-039": [240.337, 248.857], "c36-040": [249.707, 253.733], "c36-041": [254.083, 257.262], "c36-042": [257.612, 263.418], "c36-043": [263.768, 273.559], "c36-044": [274.409, 276.922], "c36-045": [277.772, 281.777], "c36-046": [282.127, 285.18], "c36-047": [285.53, 287.087], "c36-048": [287.937, 295.809], "c36-049": [296.659, 306.356], "c36-050": [306.706, 311.706], "c36-051": [312.056, 319.542], "c36-052": [320.392, 329.271], "c36-053": [330.121, 339.825], "c36-054": [340.175, 346.71], "c36-055": [347.06, 351.642]}, "blocks": [{"t": "p", "s": [["c36-001", "这时候，雅典娜来到了斯巴达。"]]}, {"t": "p", "s": [["c36-002", "她穿着一件深灰色的斗篷，脚步轻得像一片落叶。"], ["c36-003", "守夜的卫兵打了个哈欠，什么也没有发觉。"]]}, {"t": "p", "s": [["c36-004", "斯巴达的夜晚很安静，王宫的灯一盏一盏地熄了。"], ["c36-005", "院子里的石榴树，在月光下投出一团黑黑的影子。"], ["c36-006", "门廊里，忒勒马科斯和涅斯托尔的儿子并排躺着，一个睡得香香的，一个却睁着眼睛，望着天花板。"]]}, {"t": "p", "s": [["c36-007", "忒勒马科斯还在墨涅拉俄斯的王宫里。"], ["c36-008", "那天夜里，他想着父亲，怎么也睡不着。"]]}, {"t": "p", "s": [["c36-009", "来到斯巴达以后，他每天都在听别人讲父亲的故事，可是故事再精彩，也代替不了一个真正的父亲。"], ["c36-010", "他一遍一遍地想：如果我现在就在家里，如果我是个更厉害的人，会不会有什么不一样？"], ["c36-011", "想着想着，他翻了个身，把脸埋进了枕头里。"]]}, {"t": "p", "s": [["c36-012", "雅典娜站在他的床头，对他说：“忒勒马科斯，你不能再在外面待下去了，你家里的财产，都快被那些求婚者吃光了。"], ["c36-013", "快回家吧！"], ["c36-014", "你要记住：求婚者们派了一条船，躲在伊萨卡和萨墨岛之间的海峡里，等着你回来，想要害你。"], ["c36-015", "你的船要绕开那些岛，在夜里航行。"], ["c36-016", "到了伊萨卡，你先让船开到城里去，你一个人上岸，到牧猪人那里去。"], ["c36-017", "他是一个忠心的人。”"]]}, {"t": "p", "s": [["c36-018", "说完，雅典娜就回到了奥林匹斯山。"]]}, {"t": "p", "s": [["c36-019", "天一亮，忒勒马科斯就去向墨涅拉俄斯告别。"]]}, {"t": "p", "s": [["c36-020", "早晨的阳光，把王宫的石头台阶染成了金色。"], ["c36-021", "厨房里飘出烤面包的香味，仆人们正忙着擦桌子，准备早饭。"], ["c36-022", "墨涅拉俄斯已经起来了，披着一件宽大的袍子，站在廊下，看着远方。"]]}, {"t": "p", "s": [["c36-023", "墨涅拉俄斯说：“孩子，我不会留你，你想回家，就回家吧。”"]]}, {"t": "p", "s": [["c36-024", "他拍着忒勒马科斯的肩膀，笑了笑，又叹了一口气，说：“我也想你父亲想了这么多年，我知道，被人惦记着，是多么重要的事。"], ["c36-025", "你回去，帮你妈妈守好那个家吧。”"]]}, {"t": "p", "s": [["c36-026", "墨涅拉俄斯送给他一只银子做的、金边的调酒碗，海伦送给他一件她亲手织的、像星星一样闪闪发光的长袍。"]]}, {"t": "p", "s": [["c36-027", "海伦说：“孩子，我也送你一件礼物，这是海伦亲手织的。"], ["c36-028", "等你结婚的那一天，让你的新娘穿上它。"], ["c36-029", "在这以前，就让你的妈妈替你收着吧。"], ["c36-030", "愿你平平安安地回到家。”"]]}, {"t": "p", "s": [["c36-031", "她笑着摸了摸他的头，像一位亲切的姐姐。"]]}, {"t": "p", "s": [["c36-032", "忒勒马科斯双手接过长袍，那袍子轻得像一片云，在阳光底下闪着细细的光，一点一点，像是把星星织了进去。"], ["c36-033", "他低下头，认认真真地鞠了一躬，说不出一句话来。"]]}, {"t": "p", "s": [["c36-034", "忒勒马科斯坐上马车，回到了皮洛斯。"], ["c36-035", "他的船和水手们，正在海边等着他。"], ["c36-036", "他们竖起桅杆，升起船帆，出海了。"]]}, {"t": "p", "s": [["c36-037", "路上，马车的轮子辘辘地响着，路边的麦田一片金黄，风一吹，像波浪一样起伏。"], ["c36-038", "老国王涅斯托尔在皮洛斯的城门口，送了他最后一程，还塞给他一袋蜂蜜饼，让他在路上吃。"]]}, {"t": "p", "s": [["c36-039", "雅典娜给他们送来了一阵顺风，船在夜里飞快地航行，绕开了求婚者们埋伏的那个海峡。"]]}, {"t": "p", "s": [["c36-040", "夜里的大海黑黑的，只有天上的星星亮着。"], ["c36-041", "舵手紧紧握着舵，眼睛不敢眨一下。"], ["c36-042", "水手们都不说话，轻轻地划着桨，生怕惊动了什么。"], ["c36-043", "船从一座黑黑的小岛旁边无声地滑过，岛后面，隐隐约约有一点火光，一闪，又灭了。"]]}, {"t": "img", "src": "images/79.webp?v=f2c3a91f7f", "vid": "images/79.mp4?v=338edfe478", "cap": "少年回来了", "n": 79}, {"t": "p", "s": [["c36-044", "天亮的时候，他们到了伊萨卡。"]]}, {"t": "p", "s": [["c36-045", "忒勒马科斯对水手们说：“你们把船开到城里去吧。"], ["c36-046", "我要先到乡下去，看看我的牧猪人和田地。"], ["c36-047", "晚上，我再回城里。”"]]}, {"t": "p", "s": [["c36-048", "忒勒马科斯穿上凉鞋，拿起长矛，一个人上了岸，沿着小路，向山上的猪场走去。"]]}, {"t": "p", "s": [["c36-049", "清晨的山路上，露水打湿了他的鞋，草叶上的小水珠，亮晶晶的，一颗一颗，滚落下去。"], ["c36-050", "树林里传来鸟叫声，远处的羊群咩咩地叫着。"], ["c36-051", "他走得很快，心里却又盼望，又害怕，不知道等待自己的，会是什么。"]]}, {"t": "p", "s": [["c36-052", "而那些求婚者，在海峡里等了好多天，连忒勒马科斯的影子也没有看见，只好垂头丧气地回来了。"]]}, {"t": "p", "s": [["c36-053", "他们的脸被海风吹得又黑又粗，眼睛里布满了红血丝，一个个无精打采地从船上跳下来，互相埋怨。"], ["c36-054", "安提诺俄斯气得把头盔摔在了沙滩上，咬牙切齿地骂了一路。"], ["c36-055", "可是他不知道，更大的麻烦，还在后头等着他。"]]}]}, {"title": "第三十七章　父亲和儿子", "head": "c37-h", "audio": "audio/ch37.m4a?v=6f87cc50f1", "duration": 432.203, "times": {"c37-h": [0.0, 3.535], "c37-001": [4.535, 9.941], "c37-002": [10.791, 15.219], "c37-003": [15.569, 24.508], "c37-004": [24.858, 34.311], "c37-005": [35.161, 42.325], "c37-006": [43.175, 47.381], "c37-007": [47.731, 51.248], "c37-008": [52.099, 55.739], "c37-009": [56.589, 59.392], "c37-010": [59.742, 70.341], "c37-011": [70.691, 76.317], "c37-012": [77.167, 81.56], "c37-013": [81.91, 85.634], "c37-014": [85.984, 87.719], "c37-015": [88.569, 90.837], "c37-016": [91.187, 94.246], "c37-017": [95.096, 104.763], "c37-018": [105.113, 113.452], "c37-019": [114.302, 119.095], "c37-020": [119.945, 128.202], "c37-021": [129.052, 132.156], "c37-022": [133.006, 137.847], "c37-023": [138.697, 141.822], "c37-024": [142.172, 149.009], "c37-025": [149.359, 155.384], "c37-026": [156.234, 160.943], "c37-027": [161.293, 166.671], "c37-028": [167.021, 172.769], "c37-029": [173.619, 175.15], "c37-030": [175.5, 180.701], "c37-031": [181.051, 185.197], "c37-032": [186.047, 199.368], "c37-033": [200.218, 201.823], "c37-034": [202.673, 207.324], "c37-035": [207.674, 209.793], "c37-036": [210.143, 215.547], "c37-037": [215.897, 219.8], "c37-038": [220.65, 222.715], "c37-039": [223.065, 227.27], "c37-040": [227.62, 231.329], "c37-041": [232.179, 236.766], "c37-042": [237.116, 240.962], "c37-043": [241.812, 244.774], "c37-044": [245.124, 247.811], "c37-045": [248.161, 251.838], "c37-046": [252.188, 256.077], "c37-047": [256.927, 262.548], "c37-048": [262.898, 265.283], "c37-049": [265.633, 270.604], "c37-050": [270.954, 274.656], "c37-051": [275.006, 278.839], "c37-052": [279.689, 281.608], "c37-053": [282.458, 285.87], "c37-054": [286.22, 296.19], "c37-055": [297.04, 301.678], "c37-056": [302.528, 309.624], "c37-057": [309.974, 319.941], "c37-058": [320.791, 324.849], "c37-059": [325.699, 330.364], "c37-060": [331.214, 337.918], "c37-061": [338.268, 342.325], "c37-062": [343.175, 347.932], "c37-063": [348.282, 356.031], "c37-064": [356.881, 360.506], "c37-065": [360.856, 364.968], "c37-066": [365.818, 369.792], "c37-067": [370.142, 374.647], "c37-068": [374.997, 382.245], "c37-069": [382.595, 394.136], "c37-070": [394.986, 398.82], "c37-071": [399.67, 402.43], "c37-072": [402.78, 410.473], "c37-073": [411.323, 414.937], "c37-074": [415.287, 423.257], "c37-075": [423.607, 430.703]}, "blocks": [{"t": "p", "s": [["c37-001", "天刚亮，奥德修斯和欧迈俄斯在小屋里生火做早饭。"]]}, {"t": "p", "s": [["c37-002", "晨雾还没有散，山坡上的草叶都挂着露水。"], ["c37-003", "柴火噼噼啪啪地烧着，锅里的水冒出了热气，空气里飘着烤面饼的香味。"], ["c37-004", "欧迈俄斯一边哼着小调，一边把面团拍得啪啪响，老乞丐坐在一旁，往火里添着树枝。"]]}, {"t": "p", "s": [["c37-005", "突然，猪场的狗一声也不叫了，反而摇着尾巴，跑到门口去迎接什么人。"]]}, {"t": "p", "s": [["c37-006", "奥德修斯听见了脚步声，说：“欧迈俄斯，有人来了。"], ["c37-007", "一定是你的熟人，因为狗不叫，还在摇尾巴。”"]]}, {"t": "p", "s": [["c37-008", "他的话还没有说完，他的儿子就站在了门口。"]]}, {"t": "p", "s": [["c37-009", "忒勒马科斯走进了猪场的小屋。"], ["c37-010", "欧迈俄斯高兴得扔下手里的碗，抱住他亲个不停，亲他的头，亲他的眼睛，亲他的两只手，眼泪哗哗地流了下来。"], ["c37-011", "就像一个父亲，看见了离家十年的独生儿子从远方回来一样。"]]}, {"t": "p", "s": [["c37-012", "欧迈俄斯说：“忒勒马科斯，我的好孩子，你可回来了！"], ["c37-013", "你坐船到皮洛斯去的时候，我还以为再也见不到你了。"], ["c37-014", "快进来，让我好好看看你！”"]]}, {"t": "p", "s": [["c37-015", "忒勒马科斯走进屋里。"], ["c37-016", "老乞丐站起来，要把座位让给他。"]]}, {"t": "p", "s": [["c37-017", "他看起来累极了，衣服上沾着露水和泥巴，头发被海风吹得乱糟糟的，可是眼睛却亮亮的。"], ["c37-018", "他的目光不经意地扫过那个坐在火边的老人，心里忽然有一点奇怪的感觉，可是他没有说出来。"]]}, {"t": "p", "s": [["c37-019", "忒勒马科斯说：“老人家，您坐着吧，我们会另找一个座位的。”"]]}, {"t": "p", "s": [["c37-020", "吃过早饭，忒勒马科斯让欧迈俄斯到城里去，告诉他的妈妈，他平平安安地回来了。"]]}, {"t": "p", "s": [["c37-021", "欧迈俄斯穿上凉鞋，向城里走去。"]]}, {"t": "p", "s": [["c37-022", "小屋里，只剩下了忒勒马科斯和老乞丐。"]]}, {"t": "p", "s": [["c37-023", "雅典娜在门外向奥德修斯招手。"], ["c37-024", "她变成了一个美丽高大的女人，可是只有奥德修斯和狗能看见她。"], ["c37-025", "狗一看见她，夹着尾巴，呜呜地叫着，跑到了院子的另一头。"]]}, {"t": "p", "s": [["c37-026", "院子里的风忽然停了，树叶不再沙沙地响。"], ["c37-027", "一道淡淡的光，像一层薄纱，落在她的肩膀上。"], ["c37-028", "这个世界上，只有奥德修斯一个人知道，那光是从哪里来的。"]]}, {"t": "p", "s": [["c37-029", "奥德修斯走了出去。"], ["c37-030", "雅典娜说：“奥德修斯，现在可以告诉你的儿子了，不要再瞒着他了。"], ["c37-031", "你们父子两个，一起商量怎样对付那些求婚者吧。”"]]}, {"t": "img", "src": "images/80.webp?v=f3adbd34c9", "vid": "images/80.mp4?v=102dda8f17", "cap": "变回原样", "n": 80}, {"t": "p", "s": [["c37-032", "她用金手杖一点，奥德修斯又变回了原来的样子：头发乌黑，脸庞年轻，皮肤晒得黝黑，下巴上长着深棕色的胡子，穿着干净漂亮的衣服。"]]}, {"t": "p", "s": [["c37-033", "奥德修斯走回屋里。"]]}, {"t": "p", "s": [["c37-034", "忒勒马科斯吓了一跳，他赶紧转过脸去，不敢看他。"], ["c37-035", "他说：“你一定是一位天神吧！"], ["c37-036", "刚才，你还是一个穿着破衣服的老人，现在，你一下子就变了一个样子。"], ["c37-037", "求求你，可怜可怜我们吧，我们会给你献上礼物的！”"]]}, {"t": "p", "s": [["c37-038", "奥德修斯说：“我不是天神。"], ["c37-039", "孩子，我就是你的父亲，你等了二十年的父亲。"], ["c37-040", "为了我，你吃了那么多苦，受了那么多人的欺负。”"]]}, {"t": "p", "s": [["c37-041", "说着，他亲吻着儿子，眼泪一下子流了下来。"], ["c37-042", "他一直强忍着的眼泪，现在终于流了出来。"]]}, {"t": "p", "s": [["c37-043", "可是忒勒马科斯还是不敢相信。"], ["c37-044", "他说：“不，你不是我的父亲。"], ["c37-045", "你一定是一位天神，在骗我，让我更伤心。"], ["c37-046", "一个凡人，怎么能一下子变老，一下子又变年轻呢？”"]]}, {"t": "p", "s": [["c37-047", "奥德修斯说：“忒勒马科斯，你的父亲回来了，你不应该这样惊讶。"], ["c37-048", "不会再有第二个奥德修斯回到这里来了。"], ["c37-049", "我就是他，吃了那么多苦，流浪了二十年，才回到了家乡。"], ["c37-050", "是雅典娜女神，把我变老，又把我变年轻的。"], ["c37-051", "众神想让一个人变成什么样子，就能让他变成什么样子。”"]]}, {"t": "p", "s": [["c37-052", "说完，他坐了下来。"]]}, {"t": "p", "s": [["c37-053", "屋子里静得能听见柴火燃烧的声音。"], ["c37-054", "他的眼睛红红的，手微微地发着抖，可是声音是那样温柔，像是怕一用力，就会把眼前的梦吓跑。"]]}, {"t": "img", "src": "images/81.webp?v=6e168caf16", "vid": "images/81.mp4?v=1b35d5f9ff", "cap": "父子相认", "n": 81}, {"t": "p", "s": [["c37-055", "忒勒马科斯这才扑过去，紧紧地抱住了父亲。"]]}, {"t": "p", "s": [["c37-056", "父子两个紧紧地抱在一起，放声大哭，哭得像两只丢了小鸟的老鹰。"], ["c37-057", "那些小鸟还没有长出翅膀，就被农夫从窝里掏走了，老鹰在天上一边飞，一边大声地叫着。"]]}, {"t": "p", "s": [["c37-058", "要不是太阳落山了，他们说不定会一直哭下去。"]]}, {"t": "p", "s": [["c37-059", "哭完了，他们开始商量怎样对付那一百多个求婚者。"]]}, {"t": "p", "s": [["c37-060", "忒勒马科斯说：“父亲，我一直听说，你是一个了不起的英雄，力气大，主意多。"], ["c37-061", "可是，我们只有两个人，怎么打得过一百多个人呢？”"]]}, {"t": "p", "s": [["c37-062", "他的脸上还挂着泪，嘴角却已经有了一点笑意。"], ["c37-063", "他挺直了身子，像个已经长大了的大人，认认真真地问父亲，一点也没有退缩。"]]}, {"t": "p", "s": [["c37-064", "奥德修斯说：“孩子，我们有雅典娜和宙斯帮忙。"], ["c37-065", "你说，有了他们两位，我们还用得着再找别的帮手吗？”"]]}, {"t": "p", "s": [["c37-066", "奥德修斯说：“明天，我还扮成老乞丐到王宫去。"], ["c37-067", "不管求婚者怎么欺负我，怎么骂我，打我，你都要忍着。"], ["c37-068", "千万别告诉任何人我回来了，连你的妈妈也不要说，连欧迈俄斯也不要说，连你的爷爷也不要说。"], ["c37-069", "等我向你点头，你就把大厅墙上挂着的长矛和盾牌，都悄悄地搬到楼上的库房里去，只给我们两个人，留下两把宝剑、两根长矛和两面盾牌。”"]]}, {"t": "p", "s": [["c37-070", "忒勒马科斯说：“父亲，我一定照你说的做。”"]]}, {"t": "p", "s": [["c37-071", "傍晚，欧迈俄斯回来了。"], ["c37-072", "雅典娜又用金手杖一点，把奥德修斯变回了老乞丐的样子，免得牧猪人认出他来。"]]}, {"t": "p", "s": [["c37-073", "夜里，小屋里的火光一明一暗。"], ["c37-074", "奥德修斯又披上了那件破旧的斗篷，坐在了火炉边，驼着背，和先前一模一样。"], ["c37-075", "可是他的眼睛里，却闪着另一种光，像藏在灰烬底下的一粒火种。"]]}]}, {"title": "第三十八章　老狗阿尔戈斯", "head": "c38-h", "audio": "audio/ch38.m4a?v=07ed1121a5", "duration": 474.532, "times": {"c38-h": [0.0, 2.911], "c38-001": [3.911, 7.926], "c38-002": [8.776, 15.394], "c38-003": [16.244, 23.721], "c38-004": [24.071, 29.14], "c38-005": [29.49, 31.391], "c38-006": [31.741, 34.91], "c38-007": [35.26, 40.084], "c38-008": [40.434, 43.079], "c38-009": [43.929, 54.857], "c38-010": [55.707, 60.743], "c38-011": [61.593, 67.187], "c38-012": [67.537, 74.681], "c38-013": [75.031, 82.414], "c38-014": [83.264, 87.833], "c38-015": [88.183, 94.178], "c38-016": [94.528, 99.111], "c38-017": [99.961, 106.47], "c38-018": [106.82, 110.001], "c38-019": [110.351, 115.207], "c38-020": [116.057, 120.071], "c38-021": [120.921, 124.329], "c38-022": [124.679, 131.93], "c38-023": [132.28, 135.553], "c38-024": [136.403, 139.712], "c38-025": [140.062, 145.425], "c38-026": [145.775, 147.996], "c38-027": [148.846, 150.872], "c38-028": [151.722, 158.118], "c38-029": [158.468, 164.134], "c38-030": [164.984, 175.75], "c38-031": [176.1, 180.85], "c38-032": [181.2, 187.382], "c38-033": [188.232, 194.076], "c38-034": [194.426, 203.235], "c38-035": [203.585, 213.57], "c38-036": [214.42, 223.189], "c38-037": [223.539, 231.038], "c38-038": [231.888, 238.39], "c38-039": [239.24, 244.248], "c38-040": [244.598, 248.586], "c38-041": [249.436, 252.185], "c38-042": [252.535, 257.703], "c38-043": [258.053, 261.352], "c38-044": [261.702, 266.44], "c38-045": [267.29, 273.684], "c38-046": [274.034, 278.393], "c38-047": [279.243, 287.86], "c38-048": [288.21, 291.216], "c38-049": [291.566, 299.067], "song-argos": [300.267, 306.267], "song-argos-01": [306.267, 309.667], "song-argos-02": [309.667, 313.427], "song-argos-03": [313.427, 319.787], "song-argos-04": [320.767, 325.787], "song-argos-05": [326.427, 333.267], "song-argos-06": [333.267, 338.367], "song-argos-07": [338.367, 342.807], "song-argos-08": [343.427, 348.227], "c38-050": [354.427, 359.008], "c38-051": [359.858, 370.417], "c38-052": [371.267, 378.402], "c38-053": [378.752, 386.335], "c38-054": [387.185, 390.557], "c38-055": [390.907, 394.832], "c38-056": [395.182, 396.452], "c38-057": [397.302, 400.979], "c38-058": [401.329, 404.798], "c38-059": [405.648, 411.525], "c38-060": [412.375, 421.227], "c38-061": [422.077, 429.62], "c38-062": [429.97, 435.765], "c38-063": [436.115, 441.289], "c38-064": [442.139, 446.334], "c38-065": [446.684, 452.005], "c38-066": [452.355, 454.13], "c38-067": [454.48, 458.747], "c38-068": [459.597, 462.29], "c38-069": [463.14, 473.032]}, "blocks": [{"t": "p", "s": [["c38-001", "第二天一早，忒勒马科斯先回到了城里。"]]}, {"t": "p", "s": [["c38-002", "佩涅洛佩看见儿子回来了，哭着跑下楼，抱住他，亲他的头和眼睛。"]]}, {"t": "p", "s": [["c38-003", "她赤着脚，披散着头发，一阶一阶地冲下楼梯，裙子都被绊住了好几次。"], ["c38-004", "女仆们在后面追着喊：“王后，慢一点，小心摔倒！”"], ["c38-005", "可是她什么也听不见。"], ["c38-006", "她说：“忒勒马科斯，我的宝贝，你回来了！"], ["c38-007", "你坐着船偷偷地跑到皮洛斯去，我还以为再也见不到你了。"], ["c38-008", "快告诉我，你听到你父亲的消息了吗？”"]]}, {"t": "p", "s": [["c38-009", "忒勒马科斯把墨涅拉俄斯告诉他的话，都讲给了妈妈听：奥德修斯还活着，被一个仙女留在了海中的小岛上。"]]}, {"t": "p", "s": [["c38-010", "过了一会儿，欧迈俄斯带着老乞丐，也往王宫走去。"]]}, {"t": "p", "s": [["c38-011", "路上，太阳升得高高的，大路上扬起一层薄薄的尘土。"], ["c38-012", "老乞丐拄着木棍，一步一步走在后面，腿有一点跛，背也有一点驼。"], ["c38-013", "路边的孩子们看见了，都指着他笑，有的还捡起小石子，扔到他的脚边。"]]}, {"t": "p", "s": [["c38-014", "在城外的泉水边，他们遇见了牧羊人墨兰提俄斯。"], ["c38-015", "他正赶着一群最肥的山羊，到王宫去给求婚者们做晚饭。"], ["c38-016", "他是一个坏心眼的仆人，天天巴结那些求婚者。"]]}, {"t": "p", "s": [["c38-017", "墨兰提俄斯一看见他们，就骂了起来，他说：“你看，一个坏人领着另一个坏人！"], ["c38-018", "欧迈俄斯，你把这个讨厌的乞丐领到哪里去？"], ["c38-019", "他到了王宫，只会站在门口，蹭来蹭去，讨一点剩饭剩菜。”"]]}, {"t": "p", "s": [["c38-020", "说着，他走过去，狠狠地踢了老乞丐一脚。"]]}, {"t": "p", "s": [["c38-021", "老乞丐的身子晃了一下，差点摔倒。"], ["c38-022", "欧迈俄斯气得脸通红，攥紧了拳头，可是被老乞丐轻轻地拉住了。"], ["c38-023", "老乞丐只是低下头，什么也没有说。"]]}, {"t": "p", "s": [["c38-024", "奥德修斯站在那里，一动也没有动。"], ["c38-025", "他心里想：是用木棍把这个家伙打倒在地，还是忍一忍？"], ["c38-026", "最后，他还是忍住了。"]]}, {"t": "p", "s": [["c38-027", "他们来到了王宫门口。"]]}, {"t": "img", "src": "images/82.webp?v=62fb695798", "vid": "images/82.mp4?v=545f1e76a2", "cap": "老狗阿尔戈斯", "n": 82}, {"t": "p", "s": [["c38-028", "王宫门口的一堆干草上，趴着一条又老又瘦的狗，身上爬满了虱子。"], ["c38-029", "它叫阿尔戈斯，是奥德修斯出门前亲手养大的小狗。"]]}, {"t": "p", "s": [["c38-030", "以前，年轻的猎人们常常带着它，到山上去追野山羊、野鹿和野兔子，它跑得比谁都快，鼻子比谁都灵。"], ["c38-031", "可是自从主人走了以后，再也没有人好好照顾它了。"], ["c38-032", "它老了，跑不动了，只好躺在门口的干草堆上，没有人管它。"]]}, {"t": "p", "s": [["c38-033", "院子里的人从它身边走来走去，没有一个人低头看它一眼。"], ["c38-034", "雨天，它缩在干草里发抖；夏天，苍蝇围着它的耳朵嗡嗡地飞，它也只是甩一甩尾巴。"], ["c38-035", "可是每天傍晚，它还是会爬起来，望着大路的尽头，一动也不动，好像在等一个很久很久没有回来的人。"]]}, {"t": "p", "s": [["c38-036", "二十年过去了，谁也认不出老乞丐，可是老狗阿尔戈斯一下子就认出了自己的主人。"], ["c38-037", "它抬起头，摇着尾巴，耷拉着耳朵，可是已经没有力气爬起来，走到主人身边去了。"]]}, {"t": "p", "s": [["c38-038", "奥德修斯看见了，偷偷地擦掉眼泪，不敢走过去摸它，怕欧迈俄斯看出来。"]]}, {"t": "p", "s": [["c38-039", "奥德修斯说：“欧迈俄斯，这条狗躺在干草堆上，真奇怪。"], ["c38-040", "它长得多漂亮啊，以前一定是一条跑得很快的好猎狗。”"]]}, {"t": "p", "s": [["c38-041", "欧迈俄斯说：“这是我的主人的狗。"], ["c38-042", "要是你看见它年轻的时候，你一定会吃惊，它跑得有多快，力气有多大！"], ["c38-043", "在森林里，没有一只野兽能逃过它的追赶。"], ["c38-044", "可是现在，主人不在了，女仆们也不管它，它就成了这个样子。”"]]}, {"t": "p", "s": [["c38-045", "老狗阿尔戈斯看见主人回家了，安心地闭上了眼睛，再也没有醒来。"], ["c38-046", "它等了整整二十年，终于等到了主人回家。"]]}, {"t": "p", "s": [["c38-047", "微风吹过干草堆，轻轻地掀起它背上的一点点毛，就像有谁，温柔地摸了摸它的头。"], ["c38-048", "院子里的阳光很暖，很安静。"], ["c38-049", "奥德修斯站在那里，没有回头，肩膀微微地抖着，用手背使劲抹了一下眼睛。"]]}, {"t": "song", "title": "老狗阿尔戈斯", "head": "song-argos", "lines": [["song-argos-01", "干草堆上趴着一条老狗"], ["song-argos-02", "每天傍晚望着大路尽头"], ["song-argos-03", "二十年的风，二十年的雨"], ["song-argos-04", "它一直在等，没有回头"], ["song-argos-05", "阿尔戈斯，阿尔戈斯"], ["song-argos-06", "你的主人回来了"], ["song-argos-07", "摇摇尾巴，闭上眼睛"], ["song-argos-08", "你终于等到了他"]]}, {"t": "p", "s": [["c38-050", "老乞丐走进大厅，坐在门槛上，背靠着门框。"]]}, {"t": "p", "s": [["c38-051", "忒勒马科斯看见了，让欧迈俄斯给他送去一个面包和一大块肉，又对他说：“老人家，你可以到每个求婚者面前去讨一点吃的。”"]]}, {"t": "p", "s": [["c38-052", "老乞丐挨个向求婚者讨吃的，伸着手，就好像他从小就是一个乞丐一样。"], ["c38-053", "别的人多少给了他一点儿面包和肉，只有头领安提诺俄斯，不但不给，还骂他。"]]}, {"t": "p", "s": [["c38-054", "安提诺俄斯说：“滚开，讨厌的老乞丐！"], ["c38-055", "是哪个神，把这个扫兴的家伙送到我们的宴会上来了？"], ["c38-056", "离我的桌子远一点！”"]]}, {"t": "p", "s": [["c38-057", "奥德修斯说：“你长得这么好看，心却这么坏。"], ["c38-058", "你在别人家里吃饭，却连一块面包都舍不得给别人。”"]]}, {"t": "img", "src": "images/83.webp?v=7fe673f647", "vid": "images/83.mp4?v=45f402b8b3", "cap": "扔脚凳", "n": 83}, {"t": "p", "s": [["c38-059", "安提诺俄斯一听，气得抓起一张脚凳，狠狠地砸在他的背上。"]]}, {"t": "p", "s": [["c38-060", "奥德修斯像一块石头一样站着，一声也不吭，只是默默地摇了摇头，心里想着怎样惩罚他。"]]}, {"t": "p", "s": [["c38-061", "脚凳砸在他的背上，发出沉闷的一声响，可是他的身子，连晃都没有晃一下。"], ["c38-062", "整个大厅都安静了，只有安提诺俄斯呼呼喘气的声音。"], ["c38-063", "旁边的一个女仆，吓得捂住了嘴，赶紧把头转到了一边。"]]}, {"t": "p", "s": [["c38-064", "别的求婚者都觉得安提诺俄斯做得太过分了。"], ["c38-065", "一个求婚者说：“安提诺俄斯，你打一个可怜的流浪汉，可不太好。"], ["c38-066", "要是他是一位天神变的呢？"], ["c38-067", "众神常常变成各种各样的客人，到人间来看看谁好谁坏。”"]]}, {"t": "p", "s": [["c38-068", "可是安提诺俄斯根本不听。"]]}, {"t": "p", "s": [["c38-069", "忒勒马科斯看见父亲被打，心里难过极了，可他还是忍住了，一滴眼泪也没有流，一句话也没有说。"]]}]}, {"title": "第三十九章　乞丐伊罗斯", "head": "c39-h", "audio": "audio/ch39.m4a?v=a8f34ad0f6", "duration": 355.478, "times": {"c39-h": [0.0, 3.267], "c39-001": [4.267, 8.217], "c39-002": [9.067, 14.813], "c39-003": [15.163, 21.152], "c39-004": [21.502, 26.653], "c39-005": [27.503, 32.792], "c39-006": [33.142, 42.422], "c39-007": [43.272, 49.543], "c39-008": [49.893, 51.639], "c39-009": [51.989, 52.705], "c39-010": [53.055, 56.011], "c39-011": [56.861, 63.612], "c39-012": [63.962, 66.281], "c39-013": [66.631, 68.575], "c39-014": [68.925, 71.417], "c39-015": [72.267, 77.297], "c39-016": [77.647, 82.845], "c39-017": [83.695, 87.226], "c39-018": [87.576, 91.3], "c39-019": [91.65, 93.166], "c39-020": [93.516, 100.807], "c39-021": [101.657, 104.464], "c39-022": [105.314, 113.058], "c39-023": [113.408, 119.789], "c39-024": [120.639, 128.954], "c39-025": [129.304, 133.395], "c39-026": [134.245, 137.296], "c39-027": [137.646, 140.262], "c39-028": [140.612, 142.842], "c39-029": [143.692, 148.976], "c39-030": [149.326, 152.753], "c39-031": [153.603, 154.996], "c39-032": [155.346, 160.877], "c39-033": [161.227, 166.503], "c39-034": [167.353, 170.562], "c39-035": [170.912, 174.338], "c39-036": [174.688, 180.649], "c39-037": [181.499, 186.208], "c39-038": [186.558, 194.253], "c39-039": [195.103, 197.909], "c39-040": [198.759, 207.988], "c39-041": [208.838, 215.713], "c39-042": [216.563, 223.558], "c39-043": [224.408, 236.241], "c39-044": [237.091, 245.273], "c39-045": [245.623, 249.261], "c39-046": [250.111, 255.34], "c39-047": [255.69, 261.25], "c39-048": [261.6, 266.692], "c39-049": [267.542, 272.588], "c39-050": [273.438, 283.421], "c39-051": [283.771, 285.966], "c39-052": [286.316, 289.66], "c39-053": [290.01, 299.625], "c39-054": [300.475, 303.943], "c39-055": [304.293, 317.795], "c39-056": [318.645, 322.041], "c39-057": [322.891, 333.986], "c39-058": [334.336, 340.696], "c39-059": [341.546, 353.978]}, "blocks": [{"t": "p", "s": [["c39-001", "就在这时，王宫门口又来了一个乞丐。"]]}, {"t": "p", "s": [["c39-002", "他一路走，一路大声地咳嗽，生怕别人不知道他来了。"], ["c39-003", "他的肚子圆滚滚的，走路一摇一摆，像一只吃饱了的大鹅。"], ["c39-004", "院子里的女仆们看见他，都偷偷地笑，又不敢笑出声来。"]]}, {"t": "p", "s": [["c39-005", "他是伊萨卡城里一个有名的乞丐，名叫伊罗斯。"], ["c39-006", "他长得又高又胖，可是一点儿力气也没有，整天在城里东家吃一顿，西家喝一顿，什么活也不干。"]]}, {"t": "p", "s": [["c39-007", "伊罗斯一看见老乞丐坐在门槛上，就生气地说：“老头子，从门口滚开！"], ["c39-008", "要不然，我就把你拖出去！"], ["c39-009", "你没看见吗？"], ["c39-010", "大家都在向我使眼色，让我把你拖出去呢！”"]]}, {"t": "p", "s": [["c39-011", "奥德修斯皱着眉头看着他，说：“朋友，我又没有惹你，也没有说你的坏话。"], ["c39-012", "这个门槛，足够我们两个人坐的。"], ["c39-013", "你也是一个乞丐，跟我一样。"], ["c39-014", "你还是别惹我生气，免得我打你。”"]]}, {"t": "p", "s": [["c39-015", "伊罗斯说：“哈哈，听听这个老家伙，说话像个烧火的老太婆！"], ["c39-016", "我要用两只拳头，把你的牙齿都打掉，就像打掉一头偷吃庄稼的野猪的牙一样！”"]]}, {"t": "p", "s": [["c39-017", "求婚者们听见了，都哈哈大笑起来。"], ["c39-018", "安提诺俄斯说：“朋友们，这可是最好玩的事情！"], ["c39-019", "两个乞丐要打架了！"], ["c39-020", "我们让他们比一比，谁赢了，就送给他一大块烤羊肚，以后只有他能到我们的宴会上来讨吃的！”"]]}, {"t": "p", "s": [["c39-021", "求婚者们都站起来，围成了一圈。"]]}, {"t": "p", "s": [["c39-022", "有的把酒杯放在脚边，有的爬到了桌子上，有的搂着旁边人的肩膀，伸长了脖子看热闹。"], ["c39-023", "有人还偷偷地下起了赌注，赌谁赢谁输，叽叽喳喳吵成一片。"]]}, {"t": "p", "s": [["c39-024", "奥德修斯把破衣服系在腰上，露出了他结实的大腿、宽宽的肩膀和粗壮的手臂。"], ["c39-025", "雅典娜站在他的身边，让他的身体更加强壮。"]]}, {"t": "p", "s": [["c39-026", "求婚者们一看，都吃了一惊。"], ["c39-027", "他们小声地说：“伊罗斯要倒霉了！"], ["c39-028", "你看那个老头子的腿，多结实啊！”"]]}, {"t": "p", "s": [["c39-029", "伊罗斯一看，吓得浑身发抖，腿都软了，不想再打了。"], ["c39-030", "可是仆人们硬是把他推到了圈子中间。"]]}, {"t": "p", "s": [["c39-031", "两个人举起了拳头。"], ["c39-032", "奥德修斯心里想：是一拳把他打倒，还是轻轻地打他一下？"], ["c39-033", "他想了想，还是轻轻地打一下就好了，免得求婚者们认出他来。"]]}, {"t": "p", "s": [["c39-034", "伊罗斯一拳打在奥德修斯的肩膀上。"], ["c39-035", "奥德修斯一拳打在伊罗斯的耳朵下面。"], ["c39-036", "伊罗斯哎哟一声，倒在了地上，两只脚乱蹬，嘴里直叫唤。"]]}, {"t": "p", "s": [["c39-037", "那一拳，听起来“咚”的一声，像是敲在一面大鼓上。"], ["c39-038", "伊罗斯的嘴里流出了血，牙齿也掉了一颗，在地上滚来滚去，像一条被扔上岸的鱼。"]]}, {"t": "p", "s": [["c39-039", "求婚者们笑得前仰后合。"]]}, {"t": "p", "s": [["c39-040", "奥德修斯拉着伊罗斯的一只脚，把他拖到了院子外面，让他靠在墙上坐着，把一根木棍塞到他手里。"]]}, {"t": "p", "s": [["c39-041", "奥德修斯说：“你就坐在这里，看着猪狗，别再欺负别的乞丐了，免得你遇到更大的麻烦。”"]]}, {"t": "p", "s": [["c39-042", "求婚者们笑着走回大厅，送给老乞丐一大块烤羊肚，还有两个面包。"]]}, {"t": "p", "s": [["c39-043", "就在这时，雅典娜让王后佩涅洛佩想到了一个主意：到楼下去，让求婚者们更想念她，也让她的丈夫和儿子，更加尊重她。"]]}, {"t": "p", "s": [["c39-044", "佩涅洛佩带着两个女仆，走下楼来，站在大厅的柱子旁边，用一块亮亮的面纱遮着脸。"], ["c39-045", "雅典娜让她在睡梦中变得更加美丽了。"]]}, {"t": "p", "s": [["c39-046", "她的脚步很轻，裙摆像水一样滑过石头台阶。"], ["c39-047", "楼下的喧闹声一下子小了，所有的眼睛都转了过来。"], ["c39-048", "有人手里的酒杯倾斜了，酒洒在衣服上，也没有发觉。"]]}, {"t": "p", "s": [["c39-049", "求婚者们一看见她，膝盖都软了，每个人都想娶她。"]]}, {"t": "p", "s": [["c39-050", "佩涅洛佩对求婚者们说：“我的丈夫走的时候，握着我的手对我说：‘要是我回不来，等我们的儿子长出了胡子，你就改嫁吧。’"], ["c39-051", "现在，这一天真的要来了。"], ["c39-052", "可是，我从来没有见过像你们这样求婚的人。"], ["c39-053", "以前，人们向一个女人求婚，都是带着自己的牛羊来请客，送给她贵重的礼物，从来没有人像你们这样，白白地吃别人家的东西。”"]]}, {"t": "p", "s": [["c39-054", "求婚者们听了，都派人回家去取礼物。"], ["c39-055", "有的人送来了一件漂亮的长袍，上面有十二个金扣子；有的人送来了一条金项链，像太阳一样闪闪发光；有的人送来了一对亮晶晶的耳环。"]]}, {"t": "p", "s": [["c39-056", "佩涅洛佩收下了礼物，回到了楼上。"]]}, {"t": "p", "s": [["c39-057", "她把礼物一件一件地交给女仆，自己的脸上一点表情也没有，只是在转身上楼的时候，嘴角微微地向上弯了一下。"], ["c39-058", "大厅里的求婚者们还在互相炫耀，没有一个人发现这个小小的微笑。"]]}, {"t": "p", "s": [["c39-059", "奥德修斯坐在角落里，看着这一切，心里暗暗高兴：他的妻子，真是一个聪明的女人，竟然让求婚者们自己送来了礼物。"]]}]}, {"title": "第四十章　王后和老乞丐", "head": "c40-h", "audio": "audio/ch40.m4a?v=14450ef58c", "duration": 313.648, "times": {"c40-h": [0.0, 3.626], "c40-001": [4.626, 8.685], "c40-002": [9.035, 13.362], "c40-003": [14.212, 22.522], "c40-004": [22.872, 30.825], "c40-005": [31.175, 39.439], "c40-006": [40.289, 47.787], "c40-007": [48.637, 53.735], "c40-008": [54.585, 60.268], "c40-009": [61.118, 72.39], "c40-010": [73.24, 78.844], "c40-011": [79.194, 85.337], "c40-012": [86.187, 92.695], "c40-013": [93.045, 94.713], "c40-014": [95.563, 98.3], "c40-015": [98.65, 99.749], "c40-016": [100.099, 105.479], "c40-017": [106.329, 108.855], "c40-018": [109.705, 112.667], "c40-019": [113.017, 120.57], "c40-020": [120.92, 127.82], "c40-021": [128.67, 134.706], "c40-022": [135.056, 140.239], "c40-023": [141.089, 147.223], "c40-024": [148.073, 160.085], "c40-025": [160.935, 164.663], "c40-026": [165.013, 165.873], "c40-027": [166.223, 167.407], "c40-028": [167.757, 169.144], "c40-029": [169.994, 176.366], "c40-030": [176.716, 179.225], "c40-031": [180.075, 187.835], "c40-032": [188.685, 198.018], "c40-033": [198.868, 201.29], "c40-034": [201.64, 208.804], "c40-035": [209.154, 216.985], "c40-036": [217.335, 218.934], "c40-037": [219.784, 221.694], "c40-038": [222.044, 233.51], "c40-039": [234.36, 242.234], "c40-040": [243.084, 247.833], "c40-041": [248.183, 253.193], "c40-042": [253.543, 256.764], "c40-043": [257.114, 260.353], "c40-044": [260.703, 263.471], "c40-045": [264.321, 267.002], "c40-046": [267.352, 275.163], "c40-047": [276.013, 280.213], "c40-048": [280.563, 283.952], "c40-049": [284.302, 291.315], "c40-050": [291.665, 294.371], "c40-051": [295.221, 300.14], "c40-052": [300.49, 303.695], "c40-053": [304.545, 312.148]}, "blocks": [{"t": "p", "s": [["c40-001", "晚上，求婚者们都回自己家睡觉去了。"], ["c40-002", "大厅里只剩下了奥德修斯和忒勒马科斯。"]]}, {"t": "p", "s": [["c40-003", "长长的大厅里，火把一根一根地熄灭了，只剩下炉子里还有一点红红的炭火。"], ["c40-004", "地上到处是啃剩的骨头和打翻的杯子，一只猫在桌子底下，悄悄地舔着盘子。"], ["c40-005", "窗外，伊萨卡的夜晚安安静静的，只有远处的海浪声，一下一下，拍着岸边的石头。"]]}, {"t": "p", "s": [["c40-006", "奥德修斯说：“忒勒马科斯，现在，我们把墙上挂着的长矛和盾牌，都搬到楼上的库房里去吧。”"]]}, {"t": "p", "s": [["c40-007", "窗外的风吹进来，把最后一点火苗吹得东倒西歪。"]]}, {"t": "p", "s": [["c40-008", "他压低了声音，谨慎地看了看四周，确定没有一个多余的耳朵。"]]}, {"t": "p", "s": [["c40-009", "“要是求婚者们问起来，你就说：‘我怕它们被炉火的烟熏坏了，再说，要是你们喝醉了酒，吵起架来，拿着武器打伤了人，那可就不好了。’”"]]}, {"t": "p", "s": [["c40-010", "父子两个，把头盔、盾牌和长矛，一件一件地搬到了楼上。"], ["c40-011", "雅典娜举着一盏金灯，走在他们的前面，把大厅照得亮亮的。"]]}, {"t": "p", "s": [["c40-012", "忒勒马科斯惊讶地说：“父亲，你看，墙壁、房梁、柱子，都像火一样亮！"], ["c40-013", "一定有一位天神在这里！”"]]}, {"t": "p", "s": [["c40-014", "奥德修斯说：“别出声，不要问。"], ["c40-015", "这是众神的规矩。"], ["c40-016", "你先去睡吧，我还要在这里，试一试女仆们，也试一试你的妈妈。”"]]}, {"t": "p", "s": [["c40-017", "忒勒马科斯回房间睡觉去了。"]]}, {"t": "p", "s": [["c40-018", "他走上楼梯的时候，回头看了一眼。"], ["c40-019", "父亲还坐在炉子旁边，背影被火光拉得长长的，像一座沉默的山。"], ["c40-020", "他的心里，有一种说不出来的踏实：只要父亲在，什么也不用怕。"]]}, {"t": "img", "src": "images/84.webp?v=634e8409e9", "vid": "images/84.mp4?v=bd28a39dc3", "cap": "王后和老乞丐", "n": 84}, {"t": "p", "s": [["c40-021", "不一会儿，王后佩涅洛佩从楼上走了下来，美丽得就像女神一样。"], ["c40-022", "女仆们在火炉边，给她摆了一把镶着银子和象牙的椅子。"]]}, {"t": "p", "s": [["c40-023", "佩涅洛佩请老乞丐坐下，问他有没有听说过奥德修斯的消息。"]]}, {"t": "p", "s": [["c40-024", "火光把她的脸映得红红的，她的眼睛里，有一点点期待，也有一点点害怕，像一个在黑夜里赶路的人，不敢相信前方有灯。"]]}, {"t": "p", "s": [["c40-025", "佩涅洛佩说：“客人，我先问问你，你是谁？"], ["c40-026", "从哪里来？"], ["c40-027", "你的家乡在哪里？"], ["c40-028", "你的爸爸妈妈是谁？”"]]}, {"t": "p", "s": [["c40-029", "奥德修斯说：“王后，你问什么都可以，只是别问我的家乡和我的爸爸妈妈。"], ["c40-030", "一想起这些，我就会伤心得流眼泪。”"]]}, {"t": "p", "s": [["c40-031", "佩涅洛佩叹了一口气，说：“客人，自从我的丈夫坐船去了特洛伊，我就再也没有快乐过。”"]]}, {"t": "p", "s": [["c40-032", "她把手放在膝盖上，指尖轻轻地捏着裙子的边角，眼睛看着炉子里跳动的火苗，声音又低又慢。"]]}, {"t": "p", "s": [["c40-033", "“这么多年，我一直在等他回来。"], ["c40-034", "求婚者们天天逼我改嫁，我用织寿衣的办法，拖了他们三年，可是后来被他们发现了。"], ["c40-035", "现在，我的爸爸妈妈也劝我改嫁，我的儿子也长大了，看着家里的东西被别人吃光，心里也很着急。"], ["c40-036", "我真的不知道该怎么办了。”"]]}, {"t": "p", "s": [["c40-037", "奥德修斯给她讲了一个故事。"], ["c40-038", "他说，他是克里特岛上的人，二十年前，奥德修斯在去特洛伊的路上，被大风吹到了克里特岛，在他家里住了十二天。"]]}, {"t": "p", "s": [["c40-039", "佩涅洛佩想试一试他说的是真是假，就问他：“那你说说，奥德修斯那时候穿的是什么衣服？”"]]}, {"t": "p", "s": [["c40-040", "奥德修斯说：“王后，那么多年过去了，我也记不太清楚了。"], ["c40-041", "我只记得，他穿着一件紫色的羊毛斗篷，斗篷上有一个金别针。"], ["c40-042", "别针上刻着一只猎狗，前爪抓着一只小鹿。"], ["c40-043", "小鹿拼命地想逃走，猎狗紧紧地盯着它。"], ["c40-044", "看见的人都觉得，那只别针做得真好。”"]]}, {"t": "p", "s": [["c40-045", "佩涅洛佩一听，哭了起来。"], ["c40-046", "那件斗篷，是她亲手叠好，交给丈夫的；那个金别针，也是她亲手别在斗篷上的。"]]}, {"t": "p", "s": [["c40-047", "老乞丐说：“王后，别再哭了，也别再伤心了。"], ["c40-048", "我告诉你一个好消息：我见过奥德修斯。"], ["c40-049", "他就快回来了，就在这个月里，旧的月亮走了，新的月亮出来的时候，他就会回到家里。"], ["c40-050", "我向宙斯发誓，我说的都是真话。”"]]}, {"t": "p", "s": [["c40-051", "佩涅洛佩说：“客人，要是你说的话能成真，那该多好啊！"], ["c40-052", "可是我心里知道，奥德修斯再也回不来了。”"]]}, {"t": "p", "s": [["c40-053", "佩涅洛佩叹了一口气，叫老奶妈欧律克勒娅端来一盆热水，给客人洗洗脚。"]]}]}, {"title": "第四十一章　奶妈认出了伤疤", "head": "c41-h", "audio": "audio/ch41.m4a?v=b65b95915f", "duration": 350.713, "times": {"c41-h": [0.0, 3.492], "c41-001": [4.492, 10.101], "c41-002": [10.451, 17.853], "c41-003": [18.203, 24.12], "c41-004": [24.471, 26.341], "c41-005": [26.691, 35.67], "c41-006": [36.02, 41.548], "c41-007": [42.398, 46.817], "c41-008": [47.167, 54.525], "c41-009": [55.375, 56.906], "c41-010": [57.756, 63.022], "c41-011": [63.372, 68.716], "c41-012": [69.566, 74.408], "c41-013": [74.758, 80.13], "c41-014": [80.48, 87.713], "c41-015": [88.063, 93.357], "c41-016": [93.707, 97.268], "c41-017": [97.618, 100.687], "c41-018": [101.037, 104.821], "c41-019": [105.671, 109.035], "c41-020": [109.885, 113.243], "c41-021": [113.593, 121.209], "c41-022": [122.059, 132.139], "c41-023": [135.039, 141.203], "c41-024": [141.553, 146.1], "c41-025": [146.95, 150.392], "c41-026": [150.742, 154.101], "c41-027": [154.451, 157.496], "c41-028": [158.346, 163.718], "c41-029": [164.068, 168.675], "c41-030": [169.525, 174.639], "c41-031": [174.989, 176.058], "c41-032": [176.408, 180.485], "c41-033": [180.835, 185.665], "c41-034": [186.515, 189.818], "c41-035": [190.168, 195.807], "c41-036": [196.657, 203.342], "c41-037": [204.192, 210.277], "c41-038": [210.627, 212.798], "c41-039": [213.148, 218.686], "c41-040": [219.036, 224.875], "c41-041": [225.225, 226.615], "c41-042": [226.965, 235.612], "c41-043": [235.962, 242.678], "c41-044": [243.528, 247.665], "c41-045": [248.015, 251.937], "c41-046": [252.787, 256.785], "c41-047": [257.135, 261.696], "c41-048": [262.046, 268.743], "c41-049": [269.093, 274.658], "c41-050": [275.008, 277.493], "c41-051": [277.843, 283.504], "c41-052": [284.354, 287.346], "c41-053": [287.696, 289.763], "c41-054": [290.113, 293.591], "c41-055": [294.441, 301.799], "c41-056": [302.149, 304.973], "c41-057": [305.323, 310.479], "c41-058": [311.329, 320.13], "c41-059": [320.98, 325.914], "c41-060": [326.264, 334.679], "c41-061": [335.529, 340.612], "c41-062": [340.962, 344.833], "c41-063": [345.183, 349.213]}, "blocks": [{"t": "p", "s": [["c41-001", "老奶妈端来一个闪闪发光的铜盆，倒上冷水，又兑上热水。"], ["c41-002", "她一边洗，一边流着眼泪说：“我的好孩子奥德修斯，众神为什么这样对你？"], ["c41-003", "你走了这么多年，现在说不定也在别人的家里，被女仆们笑话呢。"], ["c41-004", "客人，你知道吗？"], ["c41-005", "到这里来的客人，很多很多，可是从来没有一个人，像你这样像奥德修斯。"], ["c41-006", "你的身材、你的声音、你的脚，都和他一模一样。”"]]}, {"t": "p", "s": [["c41-007", "奥德修斯一听，赶紧转过身去，背对着火光。"], ["c41-008", "他想起来，他的腿上有一道伤疤，要是被老奶妈看见了，她一定会认出他来。"]]}, {"t": "p", "s": [["c41-009", "可是已经来不及了。"]]}, {"t": "img", "src": "images/85.webp?v=f6400b3edf", "vid": "images/85.mp4?v=9c2b39b259", "cap": "腿上的伤疤", "n": 85}, {"t": "p", "s": [["c41-010", "老奶妈一边洗，一边摸到了老乞丐腿上的一道长长的伤疤。"], ["c41-011", "那是奥德修斯小时候上山打猎，被一头野猪的獠牙划伤的。"]]}, {"t": "p", "s": [["c41-012", "那一年，奥德修斯还是一个少年，到外祖父家去玩。"], ["c41-013", "他和舅舅们一起，带着猎狗，到帕耳那索斯山上去打猎。"], ["c41-014", "一头大野猪从树丛里冲了出来，奥德修斯第一个举起长矛，冲了上去。"], ["c41-015", "野猪用獠牙在他的膝盖上面，划了一道又长又深的口子。"], ["c41-016", "可是奥德修斯还是用长矛刺中了野猪。"], ["c41-017", "舅舅们给他包好了伤口，送他回了家。"], ["c41-018", "从那以后，他的腿上就留下了这道伤疤。"]]}, {"t": "p", "s": [["c41-019", "老奶妈一摸到这道伤疤，就认出了他。"]]}, {"t": "p", "s": [["c41-020", "她的手停在半空中，指尖微微发抖。"], ["c41-021", "盆里的水泛着一圈一圈的涟漪，把火光揉成了一团金色的碎片。"]]}, {"t": "p", "s": [["c41-022", "老奶妈手一松，奥德修斯的脚掉进了盆里，“哐当”一声，盆打翻了，热水洒了一地。"]]}, {"t": "p", "s": [["c41-023", "老奶妈又惊又喜，眼泪一下子涌了出来，连话都说不出来了。"], ["c41-024", "她摸着奥德修斯的下巴，过了好一会儿，才说出话来。"]]}, {"t": "p", "s": [["c41-025", "老奶妈说：“你就是奥德修斯！"], ["c41-026", "我的孩子，我早该认出你来的！"], ["c41-027", "我摸了你的脚，才认出你来！”"]]}, {"t": "p", "s": [["c41-028", "她转过头，想看着佩涅洛佩，告诉她，她的丈夫回来了。"], ["c41-029", "可是雅典娜让佩涅洛佩看着别的地方，没有注意到这一切。"]]}, {"t": "p", "s": [["c41-030", "奥德修斯一把捂住她的嘴，小声说：“好奶妈，别出声！"], ["c41-031", "你是想害死我吗？"], ["c41-032", "你喂我长大，现在我吃了二十年的苦，终于回到了家乡。"], ["c41-033", "你既然认出了我，就要把这件事藏在心里，谁也不能知道。”"]]}, {"t": "p", "s": [["c41-034", "老奶妈说：“孩子，你放心吧。"], ["c41-035", "我的心像石头一样硬，像铁一样硬，我一个字也不会说出去。”"]]}, {"t": "p", "s": [["c41-036", "老奶妈又端来了一盆热水，给他把脚洗完了，又给他抹上了橄榄油。"]]}, {"t": "p", "s": [["c41-037", "佩涅洛佩又坐到他的身边，对他说：“客人，我再问你一件事。"], ["c41-038", "我做了一个梦，你帮我解一解吧。"], ["c41-039", "我养了二十只鹅，它们从水槽里吃麦子，我看着它们，心里很高兴。"], ["c41-040", "可是，从山上飞来一只大老鹰，用它弯弯的嘴，把那些鹅全都啄死了。"], ["c41-041", "我在梦里哭了起来。"], ["c41-042", "这时，那只老鹰又飞了回来，停在屋檐上，用人的声音对我说：‘别哭了，这不是梦，这是真的事情。"], ["c41-043", "那些鹅，就是求婚者；我以前是一只老鹰，现在，我是你的丈夫，我回来了。’”"]]}, {"t": "p", "s": [["c41-044", "老乞丐说：“王后，这个梦，再清楚不过了。"], ["c41-045", "奥德修斯自己已经告诉你了：求婚者们的灾难就要来了。”"]]}, {"t": "p", "s": [["c41-046", "佩涅洛佩说：“客人，梦有真的，也有假的。"], ["c41-047", "明天，就是那个可怕的日子了，我要离开奥德修斯的家了。"], ["c41-048", "我要拿出奥德修斯的大弓，再把十二把斧头排成一排，斧头柄上都有一个小圆孔。"], ["c41-049", "奥德修斯在家的时候，常常站得远远的，一箭射过十二把斧头的小孔。"], ["c41-050", "明天，我就让求婚者们来比一比。"], ["c41-051", "谁能拉开这张弓，一箭射穿排成一排的十二把斧头的小孔，我就嫁给谁。”"]]}, {"t": "p", "s": [["c41-052", "老乞丐说：“好主意，王后。"], ["c41-053", "奥德修斯一定会在那之前回来的。"], ["c41-054", "他会在求婚者们拉开弓之前，就站在这座大厅里。”"]]}, {"t": "p", "s": [["c41-055", "佩涅洛佩抬起头，看了他很久，好像想从他的脸上，找出一点什么。"], ["c41-056", "炉火在她的眼睛里一跳一跳的。"], ["c41-057", "她终于微微地点了点头，轻轻地说：“客人，谢谢你的安慰。”"]]}, {"t": "p", "s": [["c41-058", "佩涅洛佩回到楼上，躺在床上，又为奥德修斯哭了很久，直到雅典娜让她甜甜地睡着了。"]]}, {"t": "p", "s": [["c41-059", "奥德修斯躺在门廊里，盖着一张牛皮，怎么也睡不着。"], ["c41-060", "他听见那些不忠心的女仆们，嘻嘻哈哈地跑出去找求婚者们玩，气得心里像狗在叫一样。"]]}, {"t": "p", "s": [["c41-061", "他拍着自己的胸口，对自己的心说：“忍一忍吧，我的心！"], ["c41-062", "在独眼巨人的山洞里，那么可怕的事情，你都忍过来了。"], ["c41-063", "最后，是我的聪明，把你从山洞里救了出来。”"]]}]}, {"title": "第四十二章　谁也拉不开的大弓", "head": "c42-h", "audio": "audio/ch42.m4a?v=0cc74afe32", "duration": 342.516, "times": {"c42-h": [0.0, 3.377], "c42-001": [4.377, 8.798], "c42-002": [9.648, 12.79], "c42-003": [13.14, 18.364], "c42-004": [18.714, 23.645], "c42-005": [23.995, 27.188], "c42-006": [28.038, 33.62], "c42-007": [33.97, 38.258], "c42-008": [39.108, 42.292], "c42-009": [42.642, 50.84], "c42-010": [51.19, 61.764], "c42-011": [62.614, 66.853], "c42-012": [67.203, 76.371], "c42-013": [77.221, 82.076], "c42-014": [82.426, 87.061], "c42-015": [87.411, 91.255], "c42-016": [91.605, 95.268], "c42-017": [96.118, 102.176], "c42-018": [103.026, 109.778], "c42-019": [110.128, 114.8], "c42-020": [115.15, 120.937], "c42-021": [121.787, 125.636], "c42-022": [125.986, 131.093], "c42-023": [131.943, 137.287], "c42-024": [138.137, 150.609], "c42-025": [150.959, 152.791], "c42-026": [153.141, 154.763], "c42-027": [155.113, 161.951], "c42-028": [162.301, 168.198], "c42-029": [169.048, 180.243], "c42-030": [180.593, 183.48], "c42-031": [183.83, 190.017], "c42-03
