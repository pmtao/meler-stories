2": [190.867, 198.089], "c42-033": [198.439, 207.963], "c42-034": [208.313, 213.086], "c42-035": [213.936, 216.39], "c42-036": [216.74, 220.321], "c42-037": [221.171, 225.483], "c42-038": [225.833, 234.595], "c42-039": [235.445, 241.577], "c42-040": [241.927, 243.993], "c42-041": [244.843, 247.828], "c42-042": [248.678, 252.09], "c42-043": [252.44, 258.813], "c42-044": [259.663, 263.011], "c42-045": [263.361, 265.696], "c42-046": [266.546, 272.426], "c42-047": [272.776, 276.209], "c42-048": [277.059, 284.111], "c42-049": [284.461, 287.035], "c42-050": [287.885, 297.318], "c42-051": [297.668, 306.288], "c42-052": [306.638, 312.865], "c42-053": [313.715, 318.085], "c42-054": [318.935, 326.231], "c42-055": [327.081, 332.197], "c42-056": [332.547, 341.016]}, "blocks": [{"t": "p", "s": [["c42-001", "第二天，是射箭之神阿波罗的节日。"]]}, {"t": "p", "s": [["c42-002", "天刚蒙蒙亮，街上就热闹起来了。"], ["c42-003", "人们提着篮子，牵着羊，一路说着笑着，向神庙走去。"], ["c42-004", "孩子们追着跑过的小狗，手里挥舞着刚折下来的橄榄枝。"], ["c42-005", "大海那边，升起了一轮红红的太阳。"]]}, {"t": "p", "s": [["c42-006", "求婚者们一大早就来到了王宫，比往常来得还要早。"], ["c42-007", "他们杀了最肥的牛羊，又开始大吃大喝。"]]}, {"t": "p", "s": [["c42-008", "烤肉的香味顺着风飘出老远。"], ["c42-009", "厨房里的仆人们忙得团团转，一会儿搬柴，一会儿提水，一会儿抬着沉甸甸的木盆跑来跑去。"], ["c42-010", "大厅里的酒杯碰得叮当响，求婚者们一边吃，一边大声地说笑，谁也没有想到，这是他们最后一次这样快活。"]]}, {"t": "p", "s": [["c42-011", "牧猪人欧迈俄斯也赶着三头最肥的猪来了。"], ["c42-012", "还有一个忠心的放牛人，名叫菲罗提俄斯，他赶着一头小母牛和几只肥羊，也来到了王宫。"]]}, {"t": "p", "s": [["c42-013", "放牛人看见了老乞丐，握着他的手说：“老人家，你好！"], ["c42-014", "愿你以后能过上好日子，虽然现在你吃了不少苦。"], ["c42-015", "我一看见你，就想起了我的主人奥德修斯。"], ["c42-016", "他说不定也穿着这样的破衣服，在外面流浪呢。”"]]}, {"t": "p", "s": [["c42-017", "这时，佩涅洛佩上了楼，用一把弯弯的铜钥匙，打开了库房的门。"]]}, {"t": "img", "src": "images/86.webp?v=4d69be7fbc", "vid": "images/86.mp4?v=37d927108a", "cap": "奥德修斯的大弓", "n": 86}, {"t": "p", "s": [["c42-018", "库房里，放着奥德修斯的金子、铜器和铁器，还有他的大弓和装满了箭的箭袋。"], ["c42-019", "这张弓，是他年轻的时候，一个朋友送给他的。"], ["c42-020", "他去特洛伊的时候，没有带走它，留在了家里，作为对朋友的纪念。"]]}, {"t": "p", "s": [["c42-021", "佩涅洛佩从库房里取出了奥德修斯的大弓。"], ["c42-022", "这张弓又大又硬，二十年来，谁也没有拉开过。"]]}, {"t": "p", "s": [["c42-023", "她把大弓放在膝盖上，抱着它，伤心地哭了好久。"]]}, {"t": "img", "src": "images/87.webp?v=fe295ec40b", "vid": "images/87.mp4?v=f355d9cbfd", "cap": "十二把斧头", "n": 87}, {"t": "p", "s": [["c42-024", "然后，她抱着大弓和箭袋，走下楼来，站在大厅的柱子旁边，对求婚者们说：“求婚者们，你们天天在这里吃喝，说是想娶我。"], ["c42-025", "现在，比赛开始了。"], ["c42-026", "这就是奥德修斯的大弓。"], ["c42-027", "谁能最轻松地拉开它，挂上弓弦，一箭射穿十二把斧头的小孔，我就跟他走，离开这个家。"], ["c42-028", "这个家，这么美丽，这么富足，我想，我就是在梦里，也会常常想起它的。”"]]}, {"t": "p", "s": [["c42-029", "忒勒马科斯在大厅里挖了一条长长的沟，把十二把斧头排成一排，斧头柄上的小圆孔对得整整齐齐。"], ["c42-030", "然后，他把土踩得结结实实。"], ["c42-031", "大家看见他排得这么整齐，都很惊讶，因为他从来没有见过别人这样排。"]]}, {"t": "p", "s": [["c42-032", "十二把斧头，亮闪闪的，一把挨着一把，像十二个站得笔直的士兵。"], ["c42-033", "阳光从高高的窗户照进来，在斧头柄的小孔里，穿出十二个小小的光点，排成一条细细的线。"], ["c42-034", "求婚者们围在旁边，一个劲儿地数：一、二、三……"]]}, {"t": "p", "s": [["c42-035", "忒勒马科斯说：“我先来试一试吧。"], ["c42-036", "要是我能拉开父亲的大弓，妈妈就不用离开这个家了。”"]]}, {"t": "p", "s": [["c42-037", "他三次拉弓，三次都差一点点就挂上了弓弦。"], ["c42-038", "第四次，他用尽了全身的力气，眼看就要拉开了，奥德修斯向他摇了摇头，他才停了下来。"]]}, {"t": "p", "s": [["c42-039", "忒勒马科斯说：“唉，看来我以后也是一个没有力气的人，或者是我还太年轻了。"], ["c42-040", "还是你们比我强壮的人来试吧。”"]]}, {"t": "p", "s": [["c42-041", "求婚者们一个接一个地上来试。"]]}, {"t": "p", "s": [["c42-042", "第一个上来的，是一个年轻的祭司。"], ["c42-043", "他的手又软又嫩，从来没有干过活，还没拉开一半，手就累了。"]]}, {"t": "img", "src": "images/88.webp?v=bd1ba15ea7", "vid": "images/88.mp4?v=fd8676f7db", "cap": "谁也拉不开", "n": 88}, {"t": "p", "s": [["c42-044", "他放下弓，说：“朋友们，我拉不开。"], ["c42-045", "这张弓，会让很多人伤心的。”"]]}, {"t": "p", "s": [["c42-046", "安提诺俄斯对牧羊人墨兰提俄斯说：“快去生一堆火，拿一大块油脂来！"], ["c42-047", "我们把弓烤一烤，抹上油，让它变软一点。”"]]}, {"t": "p", "s": [["c42-048", "他们涨红了脸，用火烤弓，用油抹弓，可是谁也没能把弓弦挂上去。"], ["c42-049", "他们的力气，差得太远了。"]]}, {"t": "p", "s": [["c42-050", "一个年轻的求婚者，咬着牙，使出吃奶的力气，脸憋得通红，额头上的青筋一根一根地鼓了起来。"], ["c42-051", "弓只弯了一点点，就“嘣”地一声弹了回去，把他弹得往后退了好几步，一屁股坐在了地上。"], ["c42-052", "大厅里响起了一阵哄笑，可是笑声里，已经没有刚才那么轻松了。"]]}, {"t": "p", "s": [["c42-053", "接下来的人一个接一个地上去，谁也没有成功。"]]}, {"t": "p", "s": [["c42-054", "只有安提诺俄斯和欧律马科斯还没有试，他们是求婚者里力气最大的。"]]}, {"t": "p", "s": [["c42-055", "大厅里的气氛变得有些紧张，连说笑声都低了下去。"], ["c42-056", "有人偷偷地擦着手心的汗，有人不停地看着那张弓，好像那是一头沉睡的野兽。"]]}]}, {"title": "第四十三章　拉开大弓", "head": "c43-h", "audio": "audio/ch43.m4a?v=2ce63d8028", "duration": 331.517, "times": {"c43-h": [0.0, 2.803], "c43-001": [3.803, 10.46], "c43-002": [11.31, 17.75], "c43-003": [18.1, 20.742], "c43-004": [21.592, 27.758], "c43-005": [28.608, 33.769], "c43-006": [34.619, 36.821], "c43-007": [37.171, 40.182], "c43-008": [40.532, 44.582], "c43-009": [45.432, 53.026], "c43-010": [53.876, 58.627], "c43-011": [58.977, 65.721], "c43-012": [66.071, 69.38], "c43-013": [70.23, 74.154], "c43-014": [74.504, 78.904], "c43-015": [79.254, 85.575], "c43-016": [85.925, 89.718], "c43-017": [90.568, 92.013], "c43-018": [92.863, 100.672], "c43-019": [101.522, 105.236], "c43-020": [105.586, 110.18], "c43-021": [110.53, 116.518], "c43-022": [116.868, 119.646], "c43-023": [120.496, 125.105], "c43-024": [125.455, 127.763], "c43-025": [128.113, 131.99], "c43-026": [132.84, 135.048], "c43-027": [135.898, 141.102], "c43-028": [141.452, 144.857], "c43-029": [145.207, 150.871], "c43-030": [151.721, 156.745], "c43-031": [157.095, 162.746], "c43-032": [163.096, 164.949], "c43-033": [165.299, 168.282], "c43-034": [169.132, 173.412], "c43-035": [173.762, 174.913], "c43-036": [175.263, 178.292], "c43-037": [178.642, 180.527], "c43-038": [180.877, 189.698], "c43-039": [190.548, 196.97], "c43-040": [197.32, 198.586], "c43-041": [198.936, 202.791], "c43-042": [203.141, 208.25], "c43-043": [209.1, 211.926], "c43-044": [212.776, 216.771], "c43-045": [217.621, 225.558], "c43-046": [226.408, 228.663], "c43-047": [229.013, 233.665], "c43-048": [234.015, 238.272], "c43-049": [238.622, 247.921], "c43-050": [251.252, 262.417], "c43-051": [263.267, 269.224], "c43-052": [270.074, 274.063], "c43-053": [274.913, 276.858], "c43-054": [277.208, 279.891], "c43-055": [280.241, 282.392], "c43-056": [283.242, 289.615], "c43-057": [290.465, 295.992], "c43-058": [297.672, 303.623], "c43-059": [304.473, 309.265], "c43-060": [309.615, 312.78], "c43-061": [313.13, 318.111], "c43-062": [318.961, 320.501], "c43-063": [321.351, 330.017]}, "blocks": [{"t": "p", "s": [["c43-001", "这时，欧迈俄斯和放牛人一起走出了大厅，奥德修斯也跟着走了出去。"]]}, {"t": "p", "s": [["c43-002", "在院子里，奥德修斯问他们：“朋友们，要是奥德修斯突然回来了，你们会帮谁？"], ["c43-003", "是帮求婚者，还是帮奥德修斯？”"]]}, {"t": "p", "s": [["c43-004", "放牛人说：“宙斯啊，要是主人能回来，我一定让你看看，我的力气有多大！”"]]}, {"t": "p", "s": [["c43-005", "欧迈俄斯也向众神祈祷，求众神让主人回家。"]]}, {"t": "p", "s": [["c43-006", "奥德修斯说：“我就是奥德修斯！"], ["c43-007", "吃了二十年的苦，终于回到了家乡。"], ["c43-008", "你们看，这是那道野猪划伤的伤疤，你们一定还记得。”"]]}, {"t": "p", "s": [["c43-009", "他的声音很轻，很稳，像一块沉在水底多年的石头，终于浮了上来。"]]}, {"t": "p", "s": [["c43-010", "说着，他拉开破衣服，给他们看那道长长的伤疤。"], ["c43-011", "两个忠心的仆人一看，抱住奥德修斯，放声大哭，亲吻着他的头和肩膀。"], ["c43-012", "奥德修斯也亲吻着他们的头和手。"]]}, {"t": "p", "s": [["c43-013", "奥德修斯说：“别哭了，别让大厅里的人看见。"], ["c43-014", "待会儿，欧迈俄斯，你把大弓拿来，交到我的手里。"], ["c43-015", "然后，你去告诉女仆们，把大厅的门都关上，不管听到什么声音，都不要出来。"], ["c43-016", "放牛人，你去把院子的大门锁上，用绳子绑紧。”"]]}, {"t": "p", "s": [["c43-017", "他们回到了大厅里。"]]}, {"t": "p", "s": [["c43-018", "这时，欧律马科斯正在火边烤着大弓，翻过来，翻过去，可还是拉不开。"]]}, {"t": "p", "s": [["c43-019", "欧律马科斯叹了一口气，说：“真丢人哪！"], ["c43-020", "我难过，倒不是因为娶不到王后，伊萨卡还有很多别的女人。"], ["c43-021", "我难过的是，我们的力气，比奥德修斯差得太远了，连他的弓都拉不开。"], ["c43-022", "以后的人听说了，都会笑话我们的！”"]]}, {"t": "p", "s": [["c43-023", "安提诺俄斯说：“今天是射箭之神的节日，不适合射箭。"], ["c43-024", "我们把弓放下，明天再试吧！"], ["c43-025", "到时候，我们向射箭之神献祭，再来比射箭。”"]]}, {"t": "p", "s": [["c43-026", "求婚者们都觉得这个主意好。"]]}, {"t": "p", "s": [["c43-027", "这时，老乞丐站了起来，他说：“求婚者们，请听我说一句。"], ["c43-028", "你们既然明天再比，那就让我这个老头子也试一试吧。"], ["c43-029", "我想看看，我的手里还有没有当年的力气，还是早就被流浪和苦难耗光了。”"]]}, {"t": "p", "s": [["c43-030", "求婚者们一听，都哈哈大笑，大声嚷嚷起来。"], ["c43-031", "安提诺俄斯说：“你这个讨厌的老乞丐，让你在这里吃饭，你还不满足吗？"], ["c43-032", "一定是酒把你灌醉了！"], ["c43-033", "你要是拉开了这张弓，可要倒大霉了！”"]]}, {"t": "p", "s": [["c43-034", "佩涅洛佩说：“安提诺俄斯，你为什么这样欺负客人？"], ["c43-035", "就让他试一试吧。"], ["c43-036", "就算他拉开了大弓，你以为他会娶我吗？"], ["c43-037", "他自己心里也不会这样想的。"], ["c43-038", "要是他拉开了，我就送给他一件新斗篷、一件新衣服、一把锋利的宝剑和一双凉鞋，送他到他想去的地方去。”"]]}, {"t": "p", "s": [["c43-039", "可是忒勒马科斯说：“妈妈，这张弓是我家的，我愿意给谁试，就给谁试！"], ["c43-040", "谁也不能拦着我。"], ["c43-041", "妈妈，您先回楼上去吧，去织您的布，纺您的线。"], ["c43-042", "射箭的事，是男人们的事，特别是我的事，因为我是这个家的主人。”"]]}, {"t": "p", "s": [["c43-043", "佩涅洛佩很惊讶，回到了楼上。"]]}, {"t": "p", "s": [["c43-044", "欧迈俄斯拿起大弓，送到了奥德修斯的手里。"]]}, {"t": "p", "s": [["c43-045", "奥德修斯接过大弓，前前后后仔细地看了看，看看这么多年，弓有没有被虫子蛀坏。"]]}, {"t": "img", "src": "images/89.webp?v=fb73a7ddd9", "vid": "images/89.mp4?v=7e73d0b2c1", "cap": "轻轻一拉", "n": 89}, {"t": "p", "s": [["c43-046", "大厅里一下子安静了。"], ["c43-047", "求婚者们都转过头，盯着那个站在炉火旁边的老乞丐。"], ["c43-048", "有人笑，有人皱眉，有人小声地议论。"], ["c43-049", "可是老乞丐什么也没有听见，他的手指，轻轻地抚摸着弓背，像抚摸一位多年没见的老朋友。"]]}, {"t": "p", "s": [["c43-050", "然后，就像琴师摆弄自己的竖琴一样，轻轻地拧一下弦钮，就能把琴弦挂好，奥德修斯轻轻一拉，就把弓弦挂上了。"]]}, {"t": "p", "s": [["c43-051", "他用手指拨了拨弓弦，弓弦发出清脆的声音，像燕子在叫。"]]}, {"t": "p", "s": [["c43-052", "求婚者们一下子都吓呆了，脸色都变了。"]]}, {"t": "p", "s": [["c43-053", "天上响起了一声雷。"], ["c43-054", "那是宙斯给奥德修斯的预兆。"], ["c43-055", "奥德修斯心里高兴极了。"]]}, {"t": "p", "s": [["c43-056", "他从桌子上拿起一支箭，搭在弓上，坐在凳子上，拉开弓，对准了斧头。"]]}, {"t": "img", "src": "images/90.webp?v=8048b2266d", "vid": "images/90.mp4?v=62e4cc5ae6", "cap": "一箭穿过十二把斧头", "n": 90}, {"t": "p", "s": [["c43-057", "“嗖”的一声，箭从十二把斧头的小孔里一穿而过！"], ["c43-058", "一个孔也没有碰到，箭头从最后一把斧头的孔里飞了出去。"]]}, {"t": "p", "s": [["c43-059", "奥德修斯对儿子说：“忒勒马科斯，你的客人没有给你丢脸吧？"], ["c43-060", "我射中了目标，也没有费多大的力气拉开弓。"], ["c43-061", "我的力气，还和以前一样，并不像那些求婚者说的那么没用。”"]]}, {"t": "p", "s": [["c43-062", "他向儿子点了点头。"]]}, {"t": "p", "s": [["c43-063", "忒勒马科斯马上背上宝剑，拿起长矛，站到了父亲的身边，长矛的铜尖闪闪发光。"]]}]}, {"title": "第四十四章　赶走求婚者", "head": "c44-h", "audio": "audio/ch44.m4a?v=6bdd8c8a2f", "duration": 433.314, "times": {"c44-h": [0.0, 3.638], "c44-001": [4.638, 12.373], "c44-002": [13.223, 17.116], "c44-003": [17.466, 24.449], "c44-004": [24.799, 29.803], "c44-005": [30.653, 42.144], "c44-006": [42.494, 44.553], "c44-007": [45.403, 53.303], "c44-008": [54.153, 61.477], "c44-009": [61.827, 66.71], "c44-010": [67.56, 73.039], "c44-011": [73.389, 79.06], "c44-012": [79.41, 86.361], "c44-013": [87.211, 96.84], "c44-014": [97.69, 100.862], "c44-015": [101.712, 110.597], "c44-016": [110.947, 118.437], "c44-017": [119.287, 124.91], "c44-018": [125.76, 133.7], "c44-019": [134.05, 143.189], "c44-020": [144.039, 157.584], "c44-021": [157.934, 162.664], "c44-022": [163.514, 170.01], "c44-023": [170.86, 182.547], "c44-024": [183.397, 190.124], "c44-025": [190.474, 197.583], "c44-026": [198.433, 200.897], "c44-027": [201.247, 205.238], "c44-028": [206.088, 211.326], "c44-029": [211.676, 213.704], "c44-030": [214.554, 224.509], "c44-031": [224.859, 230.039], "c44-032": [230.889, 237.345], "c44-033": [238.195, 242.282], "c44-034": [242.632, 247.701], "c44-035": [248.051, 253.61], "c44-036": [254.46, 261.687], "c44-037": [262.537, 267.319], "c44-038": [267.669, 278.228], "c44-039": [278.578, 285.29], "c44-040": [286.14, 288.491], "c44-041": [288.841, 294.627], "c44-042": [294.977, 301.29], "c44-043": [302.14, 309.401], "c44-044": [310.251, 316.717], "c44-045": [317.067, 320.432], "c44-046": [321.282, 327.266], "c44-047": [327.616, 332.455], "c44-048": [333.305, 337.689], "c44-049": [338.039, 343.764], "c44-050": [344.614, 346.547], "c44-051": [347.397, 354.026], "c44-052": [354.376, 361.443], "c44-053": [362.293, 365.817], "c44-054": [366.167, 371.003], "c44-055": [371.853, 377.964], "c44-056": [378.314, 380.634], "c44-057": [380.984, 385.422], "c44-058": [386.272, 395.932], "c44-059": [396.782, 404.505], "c44-060": [404.855, 408.644], "c44-061": [408.994, 413.428], "c44-062": [414.278, 422.403], "c44-063": [422.753, 431.814]}, "blocks": [{"t": "p", "s": [["c44-001", "奥德修斯脱掉身上的破衣服，拿着大弓和箭袋，跳上门槛，把箭倒在脚边。"]]}, {"t": "p", "s": [["c44-002", "破衣服落在地上，像一团灰色的影子。"], ["c44-003", "他的身材高大、结实，肩膀宽宽的，眼睛里闪着冷冷的光。"], ["c44-004", "刚才还坐在角落里的那个驼背老乞丐，一下子不见了。"]]}, {"t": "img", "src": "images/91.webp?v=c36a1f8e86", "vid": "images/91.mp4?v=964d50fc2d", "cap": "我回来了", "n": 91}, {"t": "p", "s": [["c44-005", "奥德修斯大声说：“求婚者们，你们以为我再也回不来了，就霸占我的家，欺负我的妻子和儿子，一点儿也不怕天上的众神，也不怕人们的指责。"], ["c44-006", "现在，你们的末日到了！”"]]}, {"t": "p", "s": [["c44-007", "求婚者们吓得脸都白了，这才认出，眼前这个人，就是奥德修斯！"]]}, {"t": "p", "s": [["c44-008", "有人手里的酒杯“啪”地掉在了地上，摔成了碎片；有人想往后退，却被椅子绊倒了。"], ["c44-009", "大厅里的声音，像被一只大手，一下子捂住了。"]]}, {"t": "p", "s": [["c44-010", "欧律马科斯说：“奥德修斯，要是你真的回来了，你说得都对。"], ["c44-011", "可是这都是安提诺俄斯的主意，他想当伊萨卡的国王，想害死你的儿子。"], ["c44-012", "我们愿意赔偿你，每个人赔你二十头牛，还有很多金子和铜器，直到你的心不再生气为止！”"]]}, {"t": "p", "s": [["c44-013", "奥德修斯说：“欧律马科斯，就算你们把自己家里所有的东西都拿来，我也不会放过你们，除非你们为你们做过的坏事付出代价！”"]]}, {"t": "p", "s": [["c44-014", "求婚者们拔出宝剑冲了上来。"]]}, {"t": "p", "s": [["c44-015", "忒勒马科斯、牧猪人欧迈俄斯和放牛人，拿起长矛和盾牌，站到了奥德修斯的身边。"], ["c44-016", "忒勒马科斯跑到楼上的库房里，拿来了四面盾牌、八根长矛和四顶铜头盔。"]]}, {"t": "p", "s": [["c44-017", "奥德修斯的箭一支接一支地射出去，每一支都不落空。"]]}, {"t": "p", "s": [["c44-018", "弓弦的声音又脆又响，嗖，嗖，嗖，像一群飞鸟从空中掠过。"], ["c44-019", "求婚者们乱成一团，有的钻到桌子底下，有的想往门口跑，可是大门早就被牢牢地关上了。"]]}, {"t": "p", "s": [["c44-020", "可是，坏心眼的牧羊人墨兰提俄斯，偷偷地从一个小门溜到了楼上的库房，给求婚者们拿来了十二面盾牌、十二根长矛和十二顶头盔。"], ["c44-021", "原来，忒勒马科斯下楼的时候，忘了关库房的门。"]]}, {"t": "p", "s": [["c44-022", "奥德修斯一看，求婚者们都拿着长矛，戴上了头盔，心里一沉。"]]}, {"t": "p", "s": [["c44-023", "欧迈俄斯和放牛人悄悄地跟着墨兰提俄斯上了楼，在库房里抓住了他，用绳子把他捆了起来，吊在了房梁上。"]]}, {"t": "p", "s": [["c44-024", "墨兰提俄斯手里还抱着一大堆盔甲，吓得连声求饶，可是已经晚了。"], ["c44-025", "绳子一圈一圈地绕上去，他像一个被吊起来的口袋，在房梁上晃来晃去。"]]}, {"t": "p", "s": [["c44-026", "就在这时，雅典娜来了。"], ["c44-027", "她变成了门托尔的样子，站在奥德修斯的身边。"]]}, {"t": "p", "s": [["c44-028", "奥德修斯一眼就认出了她，高兴地喊道：“门托尔，快来帮我！"], ["c44-029", "别忘了，我们是老朋友！”"]]}, {"t": "p", "s": [["c44-030", "雅典娜说：“奥德修斯，你在特洛伊打了九年的仗，那么勇敢，现在回到了自己的家，怎么反而害怕了？"], ["c44-031", "快过来，站在我的身边，看看我怎样帮你！”"]]}, {"t": "img", "src": "images/92.webp?v=1631acb44c", "vid": "images/92.mp4?v=f04a6a5341", "cap": "屋梁上的燕子", "n": 92}, {"t": "p", "s": [["c44-032", "说完，雅典娜变成一只燕子，飞上去，停在了被烟熏黑的屋梁上。"]]}, {"t": "p", "s": [["c44-033", "求婚者们一起举起长矛，向奥德修斯扔过去。"], ["c44-034", "可是雅典娜让他们的长矛，一根也打不中奥德修斯。"], ["c44-035", "有的扎在了门柱上，有的扎在了门上，有的落在了墙上。"]]}, {"t": "p", "s": [["c44-036", "奥德修斯和他的帮手们，一起扔出了长矛，每一根都打中了求婚者。"]]}, {"t": "p", "s": [["c44-037", "这时，雅典娜在屋梁上举起了她那面可怕的神盾。"], ["c44-038", "求婚者们吓得魂都飞了，在大厅里四处乱跑，就像一群牛，在春天的草地上，被牛虻追着叮咬一样。"], ["c44-039", "奥德修斯和他的帮手们，就像从山上飞下来的老鹰，追着那些小鸟。"]]}, {"t": "p", "s": [["c44-040", "这一仗打得天昏地暗。"], ["c44-041", "安提诺俄斯第一个倒下了，欧律马科斯也倒下了。"], ["c44-042", "最后，那些作恶多端的求婚者都倒下了，再也不能欺负人了。"]]}, {"t": "p", "s": [["c44-043", "王宫的歌手菲弥俄斯，抱着竖琴，跪在奥德修斯的面前，求他饶命。"]]}, {"t": "p", "s": [["c44-044", "忒勒马科斯说：“父亲，别伤害他，他是被求婚者们逼着唱歌的，他没有做坏事。"], ["c44-045", "还有传令官墨冬，他在我小的时候，一直照顾我。”"]]}, {"t": "p", "s": [["c44-046", "传令官墨冬正躲在一张椅子底下，身上还裹着一张牛皮。"], ["c44-047", "他一听，赶紧爬了出来，抱住忒勒马科斯的膝盖。"]]}, {"t": "p", "s": [["c44-048", "奥德修斯笑着说：“放心吧，忒勒马科斯救了你们。"], ["c44-049", "你们出去吧，到院子里去，告诉别人：做好事，比做坏事好得多。”"]]}, {"t": "p", "s": [["c44-050", "王宫终于安静下来。"]]}, {"t": "p", "s": [["c44-051", "窗外的阳光斜斜地照进来，照在满地的碎片和翻倒的桌椅上。"], ["c44-052", "空气里还飘着一点烟味，屋梁上的蜘蛛，慢悠悠地爬回了自己的网。"]]}, {"t": "p", "s": [["c44-053", "奥德修斯叫老奶妈欧律克勒娅来。"], ["c44-054", "老奶妈看见大厅里倒满了求婚者，高兴得要欢呼起来。"]]}, {"t": "p", "s": [["c44-055", "奥德修斯拦住了她，他说：“老奶妈，你心里高兴就好了，不要欢呼。"], ["c44-056", "对着倒下的人欢呼，是不对的。"], ["c44-057", "是众神惩罚了他们，因为他们做了太多的坏事，不尊重任何人。”"]]}, {"t": "p", "s": [["c44-058", "奥德修斯叫仆人们打扫大厅，把桌子椅子都擦得干干净净，然后点起火，用硫黄熏干净屋子。"]]}, {"t": "p", "s": [["c44-059", "忠心的女仆们，都举着火把，从房间里跑了出来，围着奥德修斯，欢迎他回家。"], ["c44-060", "她们亲吻着他的头、他的肩膀和他的手。"], ["c44-061", "奥德修斯认出了她们每一个人，忍不住哭了起来。"]]}, {"t": "p", "s": [["c44-062", "老奶妈欧律克勒娅一边擦着眼泪，一边指挥着年轻的仆人们，把一切都收拾得干干净净。"], ["c44-063", "窗户被一扇一扇推开，清凉的风吹了进来，把屋子里的烟味和血腥味，慢慢地吹散了。"]]}]}, {"title": "第四十五章　橄榄树做的床", "head": "c45-h", "audio": "audio/ch45.m4a?v=c3090a2afa", "duration": 452.656, "times": {"c45-h": [0.0, 3.509], "c45-001": [4.509, 11.208], "c45-002": [11.558, 16.241], "c45-003": [17.091, 19.922], "c45-004": [20.272, 23.703], "c45-005": [24.053, 27.817], "c45-006": [28.167, 31.003], "c45-007": [31.853, 36.365], "c45-008": [36.715, 42.34], "c45-009": [42.69, 44.548], "c45-010": [45.398, 55.545], "c45-011": [55.895, 63.395], "c45-012": [63.745, 68.787], "c45-013": [69.137, 73.822], "c45-014": [74.672, 79.159], "c45-015": [79.509, 86.504], "c45-016": [86.854, 89.375], "c45-017": [90.225, 96.537], "c45-018": [96.887, 99.367], "c45-019": [100.217, 108.647], "c45-020": [109.497, 115.737], "c45-021": [116.587, 121.075], "c45-022": [121.425, 126.297], "c45-023": [126.647, 133.749], "c45-024": [134.599, 141.757], "c45-025": [142.107, 145.391], "c45-026": [146.241, 153.872], "c45-027": [154.222, 159.14], "c45-028": [159.49, 165.293], "c45-029": [165.643, 172.325], "c45-030": [173.175, 178.083], "c45-031": [178.433, 187.401], "c45-032": [188.251, 192.409], "c45-033": [193.259, 197.956], "c45-034": [198.306, 202.572], "c45-035": [202.922, 206.751], "c45-036": [207.601, 211.78], "c45-037": [212.63, 218.648], "c45-038": [218.998, 221.792], "c45-039": [222.642, 226.842], "c45-040": [227.192, 228.256], "c45-041": [228.606, 231.03], "c45-042": [231.38, 236.867], "c45-043": [237.217, 243.126], "c45-044": [243.476, 255.44], "c45-045": [255.79, 259.12], "c45-046": [259.47, 263.812], "c45-047": [264.662, 268.737], "c45-048": [269.087, 273.965], "c45-049": [274.815, 278.436], "c45-050": [279.286, 281.567], "c45-051": [281.917, 283.418], "c45-052": [283.768, 285.756], "c45-053": [286.106, 289.433], "c45-054": [289.783, 295.07], "c45-055": [295.42, 299.633], "c45-056": [299.983, 303.048], "c45-057": [303.398, 310.024], "c45-058": [310.374, 312.464], "c45-059": [313.314, 318.402], "c45-060": [319.252, 332.741], "c45-061": [333.091, 342.589], "c45-062": [343.439, 352.626], "c45-063": [353.476, 375.884], "c45-064": [376.734, 386.332], "c45-065": [387.182, 392.546], "song-olive-bed": [393.746, 397.006], "song-olive-bed-01": [397.006, 402.326], "song-olive-bed-02": [403.606, 409.206], "song-olive-bed-03": [410.906, 415.966], "song-olive-bed-04": [416.446, 423.746], "song-olive-bed-05": [425.446, 429.186], "song-olive-bed-06": [429.426, 433.786], "song-olive-bed-07": [433.786, 439.786], "song-olive-bed-08": [440.186, 445.806]}, "blocks": [{"t": "p", "s": [["c45-001", "老奶妈欧律克勒娅高兴得一路小跑，膝盖都不疼了，脚步也轻快了。"], ["c45-002", "她跑上楼，跑到王后的床边，摇醒了佩涅洛佩。"]]}, {"t": "p", "s": [["c45-003", "老奶妈说：“王后，快醒醒！"], ["c45-004", "您日日夜夜等着的人，回来了！"], ["c45-005", "奥德修斯回来了，那个老乞丐就是他！"], ["c45-006", "他打败了所有的求婚者！”"]]}, {"t": "p", "s": [["c45-007", "佩涅洛佩揉揉眼睛，说：“好奶妈，你是不是疯了？"], ["c45-008", "我好不容易睡得这么香，自从奥德修斯走了以后，我还从来没有睡得这么香过。"], ["c45-009", "你为什么要说这样的话来骗我？”"]]}, {"t": "p", "s": [["c45-010", "老奶妈说：“我没有骗你，孩子，奥德修斯真的回来了，就是那个在大厅里被大家欺负的老乞丐。"], ["c45-011", "忒勒马科斯早就知道了，可是他一直瞒着，等着他的父亲惩罚那些坏人。"], ["c45-012", "我还摸到了他腿上的那道伤疤，就是野猪划伤的那一道！"], ["c45-013", "我当时就想告诉你，可是他捂住了我的嘴，不让我说。”"]]}, {"t": "p", "s": [["c45-014", "佩涅洛佩跳下床，抱住老奶妈，眼泪流了下来。"], ["c45-015", "可是她马上又想：“这会不会是哪一位天神，变成了奥德修斯的样子，来惩罚那些求婚者？"], ["c45-016", "我的奥德修斯，早就死在远方了。”"]]}, {"t": "img", "src": "images/93.webp?v=5d365ed58f", "vid": "images/93.mp4?v=5b3824d66f", "cap": "二十年了", "n": 93}, {"t": "p", "s": [["c45-017", "佩涅洛佩走下楼，坐在火炉边，望着眼前的人，一句话也不说。"], ["c45-018", "二十年了，她不敢相信。"]]}, {"t": "p", "s": [["c45-019", "她一会儿觉得，眼前这个人就是她的丈夫；一会儿又觉得，他还是那个穿着破衣服的陌生人。"]]}, {"t": "p", "s": [["c45-020", "奥德修斯靠在一根高高的柱子旁边，低着头，等着妻子先开口。"]]}, {"t": "p", "s": [["c45-021", "忒勒马科斯着急地说：“妈妈，你的心怎么比石头还硬呀！"], ["c45-022", "你为什么离父亲那么远，不坐到他的身边去，不跟他说话，也不问问他？"], ["c45-023", "哪一个妻子，在丈夫离开了二十年，吃了那么多苦，终于回到家的时候，还会这样冷冰冰地坐着？”"]]}, {"t": "p", "s": [["c45-024", "佩涅洛佩说：“孩子，要是他真的是奥德修斯，我们之间有一个只有我们两个人知道的秘密。"], ["c45-025", "我们会认出对方来的，比别人认得更清楚。”"]]}, {"t": "p", "s": [["c45-026", "奥德修斯笑了，他对儿子说：“忒勒马科斯，让你的妈妈试一试我吧，她很快就会认出我来的。"], ["c45-027", "现在，我身上又脏又破，她当然不相信我就是奥德修斯。"], ["c45-028", "我们先去洗个澡，换上干净的衣服，再让歌手弹起竖琴，让大家跳起舞来。"], ["c45-029", "这样，过路的人听见了，会以为王宫里在举行婚礼，不会知道求婚者们出了事。”"]]}, {"t": "p", "s": [["c45-030", "奥德修斯洗了澡，抹上了橄榄油，换上了漂亮的衣服。"], ["c45-031", "雅典娜在他的头上和肩膀上洒下了光彩，让他看起来又高大、又英俊，就像天上的神一样。"]]}, {"t": "p", "s": [["c45-032", "他走回大厅，坐在了佩涅洛佩对面的椅子上。"]]}, {"t": "p", "s": [["c45-033", "奥德修斯说：“奇怪的女人，众神给了你一颗比谁都硬的心。"], ["c45-034", "没有一个女人，会这样冷冰冰地对待离开了二十年才回家的丈夫。"], ["c45-035", "好吧，奶妈，给我铺一张床吧，我一个人睡。”"]]}, {"t": "p", "s": [["c45-036", "佩涅洛佩想了想，决定用那个秘密来试一试他。"]]}, {"t": "p", "s": [["c45-037", "她转身对女仆说：“去，把我们卧室里那张大床搬出来，给客人铺好被子。"], ["c45-038", "铺上羊皮、毯子和漂亮的床单。”"]]}, {"t": "img", "src": "images/94.webp?v=686b496f91", "vid": "images/94.mp4?v=c7e9da58cb", "cap": "橄榄树做的床", "n": 94}, {"t": "p", "s": [["c45-039", "奥德修斯一听，急了，他说：“谁搬得动那张床？"], ["c45-040", "那是我亲手做的！"], ["c45-041", "这张床有一个秘密，只有我知道。"], ["c45-042", "当年，院子里长着一棵大橄榄树，树干又粗又壮，像柱子一样。"], ["c45-043", "我在这棵橄榄树周围，用石头盖了我们的卧室，盖上了屋顶，装上了结实的门。"], ["c45-044", "然后，我把橄榄树砍掉树枝，把树干削得光光的，用它做了床腿，又在上面做了床，镶上了金子、银子和象牙，还铺上了紫色的牛皮。"], ["c45-045", "那张床，是长在地上的，谁也搬不走！"], ["c45-046", "除非有人把橄榄树砍断了，我也不知道，它现在还在不在那里。”"]]}, {"t": "p", "s": [["c45-047", "佩涅洛佩一听，膝盖一软，心也软了。"], ["c45-048", "她认出了这个秘密，这个只有他们两个人知道的秘密。"]]}, {"t": "p", "s": [["c45-049", "她哭着跑过去，紧紧地抱住了奥德修斯。"]]}, {"t": "p", "s": [["c45-050", "佩涅洛佩说：“你真的回来了！"], ["c45-051", "只有你才知道这个秘密！"], ["c45-052", "奥德修斯，别生我的气。"], ["c45-053", "你是世界上最聪明的人，你一定明白我的心。"], ["c45-054", "众神让我们分开了这么久，不让我们一起过年轻的日子，一起慢慢变老。"], ["c45-055", "我一直担心，会有一个骗子，假装是你，来骗我。"], ["c45-056", "所以，我一看见你，没有马上抱住你。"], ["c45-057", "现在，你说出了我们的床的秘密，除了你和我，还有一个看门的女仆，谁也不知道。"], ["c45-058", "我的心，终于相信了。”"]]}, {"t": "img", "src": "images/95.webp?v=b08d1ef4bc", "vid": "images/95.mp4?v=3ada506492", "cap": "终于团聚", "n": 95}, {"t": "p", "s": [["c45-059", "奥德修斯紧紧地抱着他忠心、聪明的妻子，也哭了起来。"]]}, {"t": "p", "s": [["c45-060", "他就像一个在大海上遇到了风暴、船被打碎了的水手，游了好久好久，终于看见了陆地，高高兴兴地爬上了岸，身上还沾满了咸咸的海水。"], ["c45-061", "佩涅洛佩看着丈夫，也是这样高兴，她的两只雪白的手臂，紧紧地抱着他的脖子，怎么也不肯放开。"]]}, {"t": "p", "s": [["c45-062", "那天夜里，雅典娜让黑夜走得慢一些，让太阳晚一点升起来，好让他们把二十年的话，慢慢地说完。"]]}, {"t": "p", "s": [["c45-063", "奥德修斯给佩涅洛佩讲了他在海上遇到的所有事情：喀孔涅斯人，忘忧果，独眼巨人，风神的口袋，巨人族的海湾，喀耳刻，世界的尽头，塞壬的歌声，斯库拉和大漩涡，太阳神的牛，仙女卡吕普索，还有费埃克斯人。"]]}, {"t": "p", "s": [["c45-064", "佩涅洛佩也给他讲了二十年里，她在家里吃的苦，那件织了三年的寿衣，那些一天比一天放肆的求婚者。"]]}, {"t": "p", "s": [["c45-065", "他们说着说着，一直到天快亮的时候，才甜甜地睡着了。"]]}, {"t": "song", "title": "橄榄树做的床", "head": "song-olive-bed", "lines": [["song-olive-bed-01", "院子里有一棵橄榄树"], ["song-olive-bed-02", "长在地上，谁也搬不走"], ["song-olive-bed-03", "树干做成了我们的床"], ["song-olive-bed-04", "一等就是二十个春秋"], ["song-olive-bed-05", "回来啦，回来啦"], ["song-olive-bed-06", "灯火亮着，不再离开"], ["song-olive-bed-07", "橄榄树下，睡个好觉"], ["song-olive-bed-08", "天亮以后，我们都在"]]}]}, {"title": "第四十六章　果园里的老父亲", "head": "c46-h", "audio": "audio/ch46.m4a?v=7c84a0512c", "duration": 479.504, "times": {"c46-h": [0.0, 3.545], "c46-001": [4.545, 10.799], "c46-002": [11.149, 12.448], "c46-003": [12.798, 16.933], "c4 04": [420.717, 424.997], "song-theme-05": [426.237, 431.657], "song-theme-06": [431.657, 437.117], "song-theme-07": [438.417, 442.457], "song-theme-08": [443.077, 447.557], "song-theme-09": [449.497, 454.717], "song-theme-10": [454.717, 460.357], "song-theme-11": [460.357, 466.017], "song-theme-12": [466.717, 470.917], "c46-065": [477.117, 478.004]}, "blocks": [{"t": "img", "src": "images/96.webp?v=c31db0e850", "vid": "images/96.mp4?v=d6d5510cec", "cap": "果园里的老父亲", "n": 96}, {"t": "p", "s": [["c46-001", "第二天，奥德修斯对佩涅洛佩说：“我要到乡下的果园里，去看望我的老父亲。"], ["c46-002", "他一直在为我伤心。"], ["c46-003", "你和女仆们待在楼上，不要见任何人，也不要问任何人。”"]]}, {"t": "p", "s": [["c46-004", "奥德修斯带着忒勒马科斯、欧迈俄斯和放牛人，出了城，来到了乡下。"]]}, {"t": "p", "s": [["c46-005", "奥德修斯的老父亲拉厄尔忒斯，就住在这里的一座农庄里。"], ["c46-006", "他已经很老很老了。"], ["c46-007", "自从儿子走了以后，他就不愿意再进城，一个人住在乡下，和几个老仆人一起种地。"]]}, {"t": "p", "s": [["c46-008", "奥德修斯说：“你们先进屋去，做一顿午饭。"], ["c46-009", "我一个人到果园里去，看看我的父亲还能不能认出我来。”"]]}, {"t": "p", "s": [["c46-010", "他走进了果园，在果园里找来找去，终于看见了他的老父亲。"]]}, {"t": "p", "s": [["c46-011", "老父亲穿着打满补丁的旧衣服，腿上绑着牛皮做的护腿，手上戴着防荆棘的手套，头上还戴着一顶羊皮帽子，正弯着腰，在一棵小树下松土。"]]}, {"t": "img", "src": "images/97.webp?v=a14d9d0b82", "vid": "images/97.mp4?v=5341737855", "cap": "十三棵梨树", "n": 97}, {"t": "p", "s": [["c46-012", "奥德修斯看见父亲这么老，这么伤心，站在一棵高高的梨树下，忍不住流下了眼泪。"]]}, {"t": "p", "s": [["c46-013", "他本来想马上跑过去，抱住父亲，亲吻他，告诉他：“父亲，我回来了。”"], ["c46-014", "可是，他又想先和父亲说说话，试一试他。"]]}, {"t": "p", "s": [["c46-015", "奥德修斯走过去说：“老人家，你把果园照顾得真好，每一棵树，每一株葡萄，每一棵梨树和无花果树，都长得那么好。"], ["c46-016", "可是，你自己却没有被照顾好，穿得这么破旧。"], ["c46-017", "你是谁家的仆人？"], ["c46-018", "请你告诉我，这里是不是伊萨卡？"], ["c46-019", "我以前在我的家乡，招待过一个伊萨卡人，他说他的父亲叫拉厄尔忒斯。”"]]}, {"t": "p", "s": [["c46-020", "老父亲一听，眼泪流了下来。"], ["c46-021", "他说：“客人，你说的那个人，就是我的儿子，我那可怜的儿子奥德修斯。"], ["c46-022", "他离开家已经二十年了，一定早就死在了远方的大海上，被鱼吃掉了，或者被野兽吃掉了。"], ["c46-023", "他的妈妈没能为他哭泣，我也没能为他哭泣。"], ["c46-024", "他那贤惠的妻子，也没能在他的床边，为他合上眼睛。”"]]}, {"t": "p", "s": [["c46-025", "说着，老父亲抓起了一把黑色的泥土，撒在自己的白头发上，伤心地哭了起来。"]]}, {"t": "img", "src": "images/98.webp?v=089a27f78f", "vid": "images/98.mp4?v=8a1f5136ae", "cap": "父子拥抱", "n": 98}, {"t": "p", "s": [["c46-026", "奥德修斯再也忍不住了，他一下子扑过去，抱住了父亲，亲吻着他。"]]}, {"t": "p", "s": [["c46-027", "奥德修斯说：“父亲，我回来了！"], ["c46-028", "我就是你的儿子，离开家二十年，终于回到了家乡。"], ["c46-029", "别哭了，我已经惩罚了那些在我们家里作恶的求婚者。”"]]}, {"t": "p", "s": [["c46-030", "老父亲不相信，他说：“你要是我的儿子，就给我一个证明，让我相信。”"]]}, {"t": "p", "s": [["c46-031", "奥德修斯说：“父亲，你看看我腿上的这道伤疤，那是我小时候到外祖父家去，在山上打猎，被野猪的獠牙划伤的。"], ["c46-032", "我再告诉你一件事。”"]]}, {"t": "p", "s": [["c46-033", "奥德修斯指着果园说：“父亲，我小时候跟着你在果园里走，我向你要这棵树，要那棵树，你一棵一棵地告诉我它们的名字。"], ["c46-034", "你送给我十三棵梨树、十棵苹果树、四十棵无花果树，还有五十行葡萄。"], ["c46-035", "我都记得清清楚楚。”"]]}, {"t": "p", "s": [["c46-036", "老父亲一听，腿一软，一把抱住了儿子，哭得像个孩子。"], ["c46-037", "他差一点就晕了过去，奥德修斯紧紧地扶住了他。"]]}, {"t": "p", "s": [["c46-038", "过了好一会儿，老父亲才缓过气来，他举起双手，向天上祈祷，他说：“宙斯啊，众神还在天上！"], ["c46-039", "那些作恶的求婚者，终于受到了惩罚！”"]]}, {"t": "p", "s": [["c46-040", "他们一起走进了屋子，忒勒马科斯和仆人们已经做好了午饭。"], ["c46-041", "雅典娜让老父亲变得更高大、更强壮，就像年轻了很多岁一样。"]]}, {"t": "p", "s": [["c46-042", "就在这时，城里的消息传开了。"], ["c46-043", "求婚者们的家人，听说求婚者们都倒下了，一个个又伤心，又愤怒。"], ["c46-044", "他们拿着武器，聚在一起，向乡下的农庄冲了过来，要找奥德修斯报仇。"]]}, {"t": "p", "s": [["c46-045", "奥德修斯、忒勒马科斯、老父亲和仆人们，都拿起了武器，站在了一起。"]]}, {"t": "p", "s": [["c46-046", "老父亲说：“众神啊，今天是多么好的一天！"], ["c46-047", "我的儿子和我的孙子，一起站在我的身边，比赛谁更勇敢！”"]]}, {"t": "p", "s": [["c46-048", "老父亲举起长矛，扔了出去，打中了领头的人。"]]}, {"t": "p", "s": [["c46-049", "眼看一场大仗就要打起来了，雅典娜从天上飞了下来。"]]}, {"t": "p", "s": [["c46-050", "雅典娜大声说：“伊萨卡的人们，住手吧！"], ["c46-051", "不要再打仗了，不要再流血了。"], ["c46-052", "从今以后，大家要和和气气地过日子。”"]]}, {"t": "p", "s": [["c46-053", "她的声音像雷一样响亮。"], ["c46-054", "那些人吓得手里的武器都掉在了地上，转身就往城里逃跑。"]]}, {"t": "p", "s": [["c46-055", "宙斯也从天上打下了一道雷电，落在雅典娜的脚边。"]]}, {"t": "p", "s": [["c46-056", "雅典娜对奥德修斯说：“奥德修斯，停手吧，别再打了，不然宙斯会生气的。”"]]}, {"t": "p", "s": [["c46-057", "奥德修斯听了女神的话，心里很高兴，放下了武器。"]]}, {"t": "p", "s": [["c46-058", "雅典娜又变成了门托尔的样子，让两边的人都发了誓，从今以后，永远和平地生活在一起。"], ["c46-059", "奥德修斯还是伊萨卡的国王，所有的人都尊敬他。"]]}, {"t": "img", "src": "images/99.webp?v=3caa3f9a02", "vid": "images/99.mp4?v=516b3f4bf0", "cap": "一家团聚", "n": 99}, {"t": "p", "s": [["c46-060", "从此，伊萨卡又恢复了和平。"], ["c46-061", "奥德修斯和佩涅洛佩、忒勒马科斯，还有老父亲，一家人终于团聚了。"]]}, {"t": "p", "s": [["c46-062", "山坡上的橄榄树绿了，海湾里的渔船又出海了，王宫的大厅里，又响起了歌手菲弥俄斯的竖琴声。"], ["c46-063", "这一次，他唱的，是奥德修斯回家的故事。"]]}, {"t": "p", "s": [["c46-064", "聪明又勇敢的奥德修斯，用了整整十年，打赢了一场战争；又用了整整十年，终于回到了家。"]]}, {"t": "song", "title": "回家的路", "head": "song-theme", "lines": [["song-theme-01", "大木马里藏着好主意"], ["song-theme-02", "独眼巨人找不到“没有人”"], ["song-theme-03", "风神的口袋不能打开"], ["song-theme-04", "塞壬的歌声也要忍一忍"], ["song-theme-05", "大海那么大，风浪那么高"], ["song-theme-06", "十年的路呀走得那么远"], ["song-theme-07", "织布机前有人在等"], ["song-theme-08", "老狗阿尔戈斯也在门口盼"], ["song-theme-09", "回家的路，再远也要走"], ["song-theme-10", "聪明勇敢，从不放弃"], ["song-theme-11", "橄榄树下，灯还亮着"], ["song-theme-12", "伊萨卡，我回来了"]]}, {"t": "p", "s": [["c46-065", "（完）"]]}, {"t": "note", "text": "读完以后，可以和孩子聊一聊：奥德修斯靠什么一次又一次地逃出了危险？他的伙伴们有好几次没有听他的话，结果怎么样了？佩涅洛佩、忒勒马科斯、牧猪人和老狗阿尔戈斯，是怎样一直等着他回家的？"}]}], "music": 3, "images": [{"from": "c01-h", "src": "images/01.webp?v=16c991aa64", "vid": "images/01.mp4?v=9177193a2e", "cap": "小岛伊萨卡", "n": 1}, {"from": "c01-012", "src": "images/02.webp?v=e612092eca", "vid": "images/02.mp4?v=1a80c9e729", "cap": "聪明的奥德修斯", "n": 2}, {"from": "c01-043", "src": "images/03.webp?v=32b0bd7a76", "vid": "images/03.mp4?v=74633f03b0", "cap": "大木马", "n": 3}, {"from": "c01-068", "src": "images/04.webp?v=1da354652f", "vid": "images/04.mp4?v=a2bc16c1d2", "cap": "扬帆回家", "n": 4}, {"from": "c03-h", "src": "images/05.webp?v=89dd41e59f", "vid": "images/05.mp4?v=ef38597a91", "cap": "奥林匹斯山", "n": 5}, {"from": "c03-018", "src": "images/06.webp?v=5d40534e63", "vid": "images/06.mp4?v=52f6d21b8b", "cap": "雅典娜求情", "n": 6}, {"from": "c04-h", "src": "images/07.webp?v=fee6f2c89f", "vid": "images/07.mp4?v=b1a9ae5aab", "cap": "吵闹的王宫", "n": 7}, {"from": "c04-021", "src": "images/08.webp?v=493728ca02", "vid": "images/08.mp4?v=f3f67ed0a4", "cap": "角落里的少年", "n": 8}, {"from": "c05-016", "src": "images/09.webp?v=3ad028f5eb", "vid": "images/09.mp4?v=788ad21187", "cap": "老船长来了", "n": 9}, {"from": "c05-039", "src": "images     }
  }
}

function sync(force) {
  if (cur < 0) return;
  const t = audio.currentTime;
  const s = songs[plIdx];
  if (s && playing && cur === s.ch && t >= s.end - 0.05) return playSong(plIdx + 1);   // 这首唱完了，接下一首
  setActive(lineAt(cur, t), force);
  if (!seeking) $('#seek').value = t;
  $('#nowTime').textContent = `${buffering ? '加载中… ' : ''}${fmt(t)} / ${fmt(BOOK.chapters[cur].duration)}`;
  paintSeek();
}

// ---------- 弱网：显示下载进度、缓冲提示、预先加载下一章、出错重试 ----------
const SEEK_PLAYED = 'var(--sea)', SEEK_BUF = 'color-mix(in srgb, var(--sea) 50%, var(--line))';
let buffering = false, retry = null, prefetched = new Set();
function paintSeek() {
  const seek = $('#seek');
  const d = cur < 0 ? 0 : (audio.duration || BOOK.chapters[cur].duration);
  if (!d) { seek.style.setProperty('--seek-bg', 'var(--line)'); return; }
  const pc = x => (Math.min(1, Math.max(0, x / d)) * 100).toFixed(2) + '%';
  const p = pc(+seek.value), stops = [];
  for (let i = 0; i < audio.buffered.length; i++) {
    const a = pc(audio.buffered.start(i)), b = pc(audio.buffered.end(i));
    stops.push(`transparent ${a}`, `${SEEK_BUF} ${a}`, `${SEEK_BUF} ${b}`, `transparent ${b}`);
  }
  const buf = stops.length ? `linear-gradient(to right, ${stops.join(', ')}), ` : '';
  seek.style.setProperty('--seek-bg', `linear-gradient(to right, ${SEEK_PLAYED} ${p}, transparent ${p}), ${buf}var(--line)`);
}
function setBuffering(on) {
  if (buffering === on) return;
  buffering = on;
  document.body.classList.toggle('buffering', on);
  if (cur >= 0) sync(false);
}
audio.addEventListener('waiting', () => setBuffering(true));
['playing', 'canplay', 'pause'].forEach(ev => audio.addEventListener(ev, () => setBuffering(false)));
audio.addEventListener('progress', () => {
  paintSeek();
  // 这一章下载完了而且正在听：提前把下一章拉进浏览器缓存（地址带内容指纹、长期缓存），换章时不用再等
  const next = BOOK.chapters[cur + 1], b = audio.buffered, d = audio.duration;
  if (!playing || !next || prefetched.has(next.audio) || !b.length || !(b.end(b.length - 1) >= d - 0.5)) return;
  if (navigator.connection && navigator.connection.saveData) return;
  prefetched.add(next.audio);
  fetch(next.audio, { priority: 'low' }).then(r => r.blob()).catch(() => {});   // 只试一次，失败了到时照常边下边放
});
audio.addEventListener('error', () => {
  if (cur < 0) return;
  setBuffering(false);
  retry = { ch: cur, t: audio.currentTime };   // 再点播放时从断开的地方重新加载
  cur = -1;
  toast('网络不太好，音频没加载出来，点播放键重试');
});

let raf = 0;
function loop() { sync(false); raf = requestAnimationFrame(loop); }
audio.addEventListener('play', () => { playing = true; document.body.classList.add('playing'); story.classList.add('reading'); renderPlay(); cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause', () => { playing = false; document.body.classList.remove('playing'); renderPlay(); cancelAnimationFrame(raf); sync(false); savePos(); });
audio.addEventListener('ended', () => {
  if (plIdx >= 0) playSong(plIdx + 1);   // 插曲在章末：这章放完就是这首唱完了
  else if (cur < BOOK.chapters.length - 1) playFrom(cur + 1, 0);
  else { toast('故事讲完啦，晚安 🌙'); setActive(null); localStorage.removeItem(POS_KEY); }
});

function renderPlay() {
  $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $('#playBtn').setAttribute('aria-label', playing ? '暂停' : '播放');
}
renderPlay();

function toggle() {
  if (cur < 0) { const p = retry || readPos(); retry = null; return p ? playFrom(p.ch, p.t) : playFrom(0, 0); }
  playing ? audio.pause() : audio.play();
}
function step(d) {
  const i = active ? lines.indexOf(active) : -1;
  // 上一句：如果当前句已读了 1.5 秒以上，先回到本句开头
  if (d < 0 && active && audio.currentTime - active.start > 1.5) return playLine(active, playing || cur < 0);
  const L = lines[Math.min(lines.length - 1, Math.max(0, i + d))];
  if (L) playLine(L, true);
}
function chapterJump(d) {
  if (plIdx >= 0) return playSong(Math.min(songs.length - 1, plIdx + d));   // 欣赏插曲时，上一章 / 下一章换成上一首 / 下一首
  const ci = Math.min(BOOK.chapters.length - 1, Math.max(0, (cur < 0 ? 0 : cur) + d));
  playFrom(ci, 0);
}

// ---------- 交互 ----------
$('#playBtn').onclick = toggle;
$('#prevS').onclick = () => step(-1);
$('#nextS').onclick = () => step(1);
$('#prevCh').onclick = () => chapterJump(-1);
$('#nextCh').onclick = () => chapterJump(1);
$('#startBtn').onclick = () => { stopSongs(); playFrom(0, 0); };
$('#tocBtn').onclick = () => {
  if (mode === 'picture') setMode('read', true);   // 纯图模式没有目录，先回到阅读模式
  $('.toc').scrollIntoView({ behavior: 'smooth' });
};
story.addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) { stopSongs(); playLine(byId[el.dataset.id], true); userScrollAt = 0; return; }
  const pic = e.target.closest('figure .pic'), img = pic && pic.querySelector('img');
  if (img) { const lb = $('#lightbox'); lb.querySelector('img').src = img.src; lb.querySelector('p').textContent = img.alt; lb.classList.add('open'); }
});
$('#lightbox').onclick = () => $('#lightbox').classList.remove('open');
$('#toc').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ci = +b.dataset.ch;
  stopSongs(); playFrom(ci, 0);
  document.getElementById('ch' + (ci + 1)).scrollIntoView({ behavior: 'smooth' });
});
$('#speedBtn').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  $('#speedBtn').textContent = SPEEDS[speedIdx].toFixed(1) + '×';
};
$('#followBtn').onclick = () => {
  follow = !follow;
  $('#followBtn').setAttribute('aria-pressed', follow);
  toast(follow ? '跟读：自动翻到正在读的地方' : '跟读已关闭，可以自由翻看');
  if (follow && active) setActive(active, true);
};
// ---------- 显示模式：阅读 / 左图右文（宽屏才有）/ 纯图 ----------
const MODES = { read: '阅读', split: '左图右文', picture: '纯图' };
const wide = matchMedia('(min-width: 900px)');
let mode = 'read', stageIdx = -1, stageLayer = 0;
$('#stageVid').onplaying = () => $('#stageVid').classList.add('show');
function showStage(i, force) {
  if (i === stageIdx && !force) return;
  stageIdx = i;
  const im = imgs[i];
  const layers = document.querySelectorAll('#stage img');
  const next = layers[stageLayer ^= 1], prev = layers[stageLayer ^ 1];
  next.onload = () => { next.classList.add('show'); prev.classList.remove('show'); };
  next.src = im.src;
  if (imgs[i + 1]) new Image().src = imgs[i + 1].src;   // 顺手预载下一张，念到时直接换上
  next.alt = im.cap;
  // 动图短片盖在静态图上，开始播放再淡入；阅读模式看不见舞台，不播
  const v = $('#stageVid');
  v.classList.remove('show');
  if (anim && im.vid && mode !== 'read') { v.src = im.vid; v.play().catch(() => {}); }
  else if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
  $('#stageBg').style.backgroundImage = `url("${im.src}")`;
  $('#stageCap').textContent = `插图 ${im.n} · ${im.cap}`;
  $('#stageTop').textContent = BOOK.chapters[(active || {}).ch ?? im.ch].title.replace('　', ' ');
}
// 字幕换句时先淡出再换字，免得两句文字跳动
let subT = 0;
function setSubtitle(L) {
  const sub = $('#stageSub');
  const text = !L ? '' : L.el.tagName === 'H2' ? BOOK.chapters[L.ch].title.replace('　', ' ')
    : L.el.tagName === 'H3' ? '♪ ' + L.el.textContent : L.el.closest('.song') ? '♪ ' + L.el.textContent + ' ♪' : L.el.textContent;
  if (sub.dataset.text === text) return;
  sub.dataset.text = text;
  sub.classList.add('fade');
  clearTimeout(subT);
  subT = setTimeout(() => { sub.textContent = text; sub.classList.remove('fade'); }, 180);
}
function setMode(m, quiet) {
  if (m === 'split' && !wide.matches) m = 'read';
  mode = m;
  document.body.dataset.mode = m;
  $('#modeBtn').textContent = MODES[m];
  try { localStorage.setItem(PREF + 'mode', m); } catch (e) {}
  showStage(active ? active.img : Math.max(0, stageIdx), true);
  if (m !== 'picture' && active) setTimeout(() => setActive(active, true), 30);
  if (!quiet) toast('显示模式：' + MODES[m] + (m === 'picture' ? '（点画面播放 / 暂停）' : ''));
}
$('#modeBtn').onclick = () => {
  const order = wide.matches ? ['read', 'split', 'picture'] : ['read', 'picture'];
  setMode(order[(order.indexOf(mode) + 1) % order.length]);
};
wide.addEventListener('change', () => { if (mode === 'split' && !wide.matches) setMode('read', true); });
$('#stage').onclick = () => { if (mode === 'picture') toggle(); };
$('#stagePlay').onclick = e => { e.stopPropagation(); toggle(); };
// 舞台的底边贴着播放条
new ResizeObserver(() => document.documentElement.style.setProperty('--ph', $('#player').offsetHeight + 'px')).observe($('#player'));
try { setMode(localStorage.getItem(PREF + 'mode') || 'read', true); } catch (e) { setMode('read', true); }

function renderAnim() {
  $('#animBtn').setAttribute('aria-pressed', anim);
  document.querySelectorAll('figure video').forEach(v => {
    if (anim) { vio.unobserve(v); vio.observe(v); }   // 重新观察会立即回调一次，看得见的接着播
    else { v.pause(); v.classList.remove('on'); }
  });
  if (stageIdx >= 0) showStage(stageIdx, true);
}
$('#animBtn').onclick = () => {
  anim = !anim;
  try { localStorage.setItem(PREF + 'anim', anim ? 'on' : 'off'); } catch (e) {}
  renderAnim();
  toast(anim ? '插图：动图' : '插图：静态图');
};
renderAnim();
$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(PREF + 'theme', root.dataset.theme); } catch (e) {}
};
try { const th = localStorage.getItem(PREF + 'theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; if (cur < 0) return; audio.currentTime = +$('#seek').value; sync(true); });
$('#seek').addEventListener('change', () => { seeking = false; });
if (cur < 0) $('#seek').addEventListener('pointerdown', () => { if (cur < 0) loadChapter(0); }, { once: true });

// 用户自己滚动页面时，暂停自动跟读 5 秒
let programmatic = 0;
['wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => { userScrollAt = Date.now(); }, { passive: true }));
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Escape') $('#lightbox').classList.remove('open');
});

// ---------- 记住上次听到哪里 ----------
function savePos() { if (cur < 0) return; try { localStorage.setItem(POS_KEY, JSON.stringify({ ch: cur, t: audio.currentTime, id: active && active.id })); } catch (e) {} }
function readPos() { try { const p = JSON.parse(localStorage.getItem(POS_KEY)); return p && p.ch >= 0 && p.ch < BOOK.chapters.length ? p : null; } catch (e) { return null; } }
setInterval(() => { if (playing) savePos(); }, 3000);
const last = readPos();
if (last && (last.ch > 0 || last.t > 5)) {
  const rb = $('#resumeBtn');
  rb.hidden = false;
  rb.textContent = `继续听 · ${BOOK.chapters[last.ch].title.split('　')[0]} ${fmt(last.t)}`;
  rb.onclick = () => {
    stopSongs();
    const L = last.id && byId[last.id];
    L ? playLine(L) : playFrom(last.ch, last.t);
    if (L) setTimeout(() => setActive(L, true), 50);
  };
}
$('#nowTitle').textContent = '点击任意一句，就从那里开始听';

// ---------- 锁屏 / 耳机控制 ----------
function updateMedia() {
  if (!('mediaSession' in navigator) || cur < 0) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: plIdx >= 0 ? songs[plIdx].title : BOOK.chapters[cur].title.replace('　', ' '), artist: BOOK.voice, album: BOOK.title,
    artwork: [{ src: BOOK.cover, sizes: '1152x768', type: 'image/webp' }]
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => chapterJump(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => chapterJump(1));
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
</script>
</body>
</html>
