<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 24px; }
.versions a, .versions span { font-size: 13px; padding: 5px 14px; border-radius: 999px; color: #fff; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, .5); background: rgba(8, 25, 40, .3); }
.versions a:hover { background: rgba(8, 25, 40, .55); }
.versions[hidden] { display: none; }
.versions .on { background: #fff; color: #123f55; border-color: #fff; font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }
/* 书末的「欣赏插曲」：全书插曲的播放列表 */
.songlist { margin: 40px 0 0; padding: 24px 18px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.songlist h3 { margin: 0 0 4px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 24px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; }
.songlist .sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
.btn-song { background: var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.songlist ol { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px; text-align: left; counter-reset: song; }
.songlist li button { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  text-align: left; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.songlist li button::before { counter-increment: song; content: counter(song); grid-row: span 2; color: var(--sea); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.songlist li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.songlist li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.songlist .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 进度条：深色是已播放，浅色是已经下载好的部分（--seek-bg 由 paintSeek() 按 audio.buffered 算），网络慢时一眼看出还要等多久 */
.seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 8px 0 6px; height: 18px;
  background: transparent; cursor: pointer; --seek-bg: var(--line); }
.seek::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border: 0;
  border-radius: 50%; background: var(--sea); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--sea);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
/* 缓冲中：播放键外圈转圈 */
.play { position: relative; }
.play::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent;
  border-top-color: var(--sea); border-right-color: var(--sea); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.buffering .play::after { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="versions" id="versions" hidden></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>

<script>
const BOOK = {"id": "soushenji", "title": "搜神记", "intro": "《搜神记》是晋代的干宝写的一部志怪故事集，里面记着神仙、异人、会报恩的动物和许许多多古老的传说。这本书从中挑出十个故事：每个故事先读一段书里的原文，再用白话文说一遍，最后讲成一个完整的故事。适合 6 到 12 岁的小朋友和爸爸妈妈一起读、一起听。", "kicker": "中国古代志怪", "cover": "images/24.webp?v=ce63895921", "voice": "Elias，本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "第一章　神农鞭百草", "head": "c01-h", "audio": "audio/ch01.m4a?v=6208341fcf", "duration": 290.702, "times": {"c01-h": [0.0, 3.884], "c01-001": [4.884, 7.961], "c01-002": [8.811, 19.232], "c01-003": [20.082, 21.206], "c01-004": [22.056, 36.28], "c01-005": [36.63, 43.109], "c01-006": [43.959, 44.724], "c01-007": [45.575, 49.439], "c01-008": [49.789, 56.079], "c01-009": [56.429, 65.016], "c01-010": [65.866, 70.111], "c01-011": [70.461, 79.281], "c01-012": [80.131, 83.879], "c01-013": [84.229, 90.56], "c01-014": [90.91, 93.518], "c01-015": [94.368, 101.108], "c01-016": [101.458, 106.714], "c01-017": [107.564, 115.119], "c01-018": [115.469, 120.914], "c01-019": [121.264, 129.02], "c01-020": [129.87, 134.674], "c01-021": [135.024, 145.316], "c01-022": [146.166, 150.215], "c01-023": [150.565, 166.041], "c01-024": [166.391, 168.265], "c01-025": [169.115, 174.076], "c01-026": [174.426, 177.773], "c01-027": [178.123, 186.396], "c01-028": [186.746, 193.812], "c01-029": [194.162, 200.339], "c01-030": [201.189, 205.3], "c01-031": [206.15, 209.022], "c01-032": [209.372, 218.987], "c01-033": [219.337, 223.706], "c01-034": [224.556, 227.006], "c01-035": [227.356, 239.324], "c01-036": [240.174, 251.113], "c01-037": [251.463, 255.927], "c01-038": [256.777, 267.934], "c01-039": [268.784, 272.195], "c01-040": [272.545, 275.193], "c01-041": [275.543, 279.423], "c01-042": [280.273, 287.451], "c01-043": [288.301, 289.202]}, "blocks": [{"t": "img", "src": "images/01.webp?v=2b6f61d03e", "vid": "images/01.mp4?v=e2c2c4c9b1", "cap": "神农在山中", "n": 1}, {"t": "p", "s": [["c01-001", "原文，出自《搜神记》第一卷。"]]}, {"t": "p", "s": [["c01-002", "神农以赭鞭鞭百草，尽知其平毒寒温之性，臭味所主，以播百谷，故天下号神农也。"]]}, {"t": "p", "s": [["c01-003", "白话文。"]]}, {"t": "p", "s": [["c01-004", "神农用一根红色的鞭子抽打各种草木，这样就能知道每一种草是有毒还是无毒，是寒凉还是温热，闻起来、尝起来是什么味道，能治什么病。"], ["c01-005", "他又用这些知识教人们播种各种谷物，所以天下的人都称他为“神农”。"]]}, {"t": "p", "s": [["c01-006", "故事。"]]}, {"t": "p", "s": [["c01-007", "很久很久以前，人们还不知道怎样种庄稼。"], ["c01-008", "他们靠打猎和采野果过日子，打不到猎物的时候，就只好饿着肚子。"], ["c01-009", "有时候，人们吃了不认识的草和果子，就会肚子疼、头发晕，严重的时候，还会倒在地上起不来。"]]}, {"t": "p", "s": [["c01-010", "那时候，有一位首领，大家叫他神农。"], ["c01-011", "他长得很特别，肚子是透明的，像一块晶莹的玻璃，吃下去的东西，在肚子里看得清清楚楚。"]]}, {"t": "p", "s": [["c01-012", "神农看着大家受苦，心里很着急。"], ["c01-013", "他说：“草木那么多，一定有能吃的，有能治病的，也有不能碰的。"], ["c01-014", "我要把它们一样一样地弄清楚。”"]]}, {"t": "p", "s": [["c01-015", "于是，他背上一个小竹筐，拿着一根红色的鞭子，走进了大山。"], ["c01-016", "那根鞭子是用赭石的颜色染红的，人们叫它“赭鞭”。"]]}, {"t": "img", "src": "images/02.webp?v=28c88a7d54", "vid": "images/02.mp4?v=f2fc03320f", "cap": "鞭草辨性", "n": 2}, {"t": "p", "s": [["c01-017", "他走到一片草地上，看见一棵绿油油的小草，就用赭鞭轻轻地一抽。"], ["c01-018", "说也奇怪，那棵草的叶子上，立刻浮起一层淡淡的光。"], ["c01-019", "神农点点头，说：“这一种是平和的，没有毒，煮汤给大家喝，可以清清火。”"]]}, {"t": "p", "s": [["c01-020", "他走到一丛开着紫花的灌木前，又用赭鞭一抽。"], ["c01-021", "这一次，叶子上冒出了一缕黑黑的烟，神农赶紧往后退了一步，说：“这一种有毒，千万不能乱吃。”"]]}, {"t": "p", "s": [["c01-022", "他就这样一棵一棵地试，一片一片地认。"], ["c01-023", "哪些草性子寒凉，吃了能退热；哪些草性子温暖，吃了能驱寒；哪些草闻起来香香的，能让人精神；哪些草尝起来苦苦的，却能治肚子疼。"], ["c01-024", "他都一一记在心里。"]]}, {"t": "img", "src": "images/03.webp?v=4df5499321", "vid": "images/03.mp4?v=2e9d458c27", "cap": "神农尝草", "n": 3}, {"t": "p", "s": [["c01-025", "有时候，鞭子也看不出来的东西，神农就亲口去尝。"], ["c01-026", "他尝了一口，肚子里的颜色立刻变了。"], ["c01-027", "如果变成了红色，说明这东西有些辣；变成黑色，说明有毒；变成金色，说明是好东西。"], ["c01-028", "有一天，他吃到了一种很毒的草，肚子一下子变得乌黑，他疼得直冒冷汗。"], ["c01-029", "他赶紧找来一种茶叶一样的嫩叶，嚼了几口，黑色才慢慢退下去。"]]}, {"t": "p", "s": [["c01-030", "后来，人们说，那种嫩叶，就是最早的茶。"]]}, {"t": "p", "s": [["c01-031", "神农走遍了高山和河谷。"], ["c01-032", "回到村子里，他把所有的草药都画了下来，教人们：哪些可以煮汤，哪些可以治病，哪些要离得远远的。"], ["c01-033", "生病的人，喝了他配的药，很快就好起来了。"]]}, {"t": "p", "s": [["c01-034", "可是，光有药还不够。"], ["c01-035", "神农又想：“大家总是靠打猎吃饭，遇到下雨下雪，就要挨饿，要是能把种子种在地里，让它自己长出粮食来，那该多好啊。”"]]}, {"t": "p", "s": [["c01-036", "于是，他把山里的野稻子、野小米一粒一粒收集起来，挑出最饱满的，教大家松土、播种、浇水、除草。"], ["c01-037", "他还削了一把木头做的犁，让人们用它翻土。"]]}, {"t": "img", "src": "images/04.webp?v=dc9a74f59f", "vid": "images/04.mp4?v=20106ebaf9", "cap": "五谷丰收", "n": 4}, {"t": "p", "s": [["c01-038", "春天的时候，田野里冒出一片嫩绿；夏天的时候，绿色越长越高；到了秋天，金黄的谷穗沉甸甸地弯下了腰。"]]}, {"t": "p", "s": [["c01-039", "人们捧着第一碗新米饭，眼睛都亮了。"], ["c01-040", "有人说：“这是神农教我们的呀！”"], ["c01-041", "大家都叫他“神农氏”，一代一代地传了下来。"]]}, {"t": "p", "s": [["c01-042", "今天，我们吃的粮食，用的草药，很多都是从那时候一点一点摸索出来的。"]]}, {"t": "p", "s": [["c01-043", "（完）"]]}]}, {"title": "第二章　董永和织女", "head": "c02-h", "audio": "audio/ch02.m4a?v=e516484679", "duration": 519.613, "times": {"c02-h": [0.0, 3.092], "c02-001": [4.092, 6.946], "c02-002": [7.796, 10.843], "c02-003": [11.193, 17.351], "c02-004": [17.701, 23.104], "c02-005": [23.454, 27.767], "c02-006": [28.117, 33.362], "c02-007": [33.712, 37.35], "c02-008": [37.7, 39.17], "c02-009": [39.52, 43.66], "c02-010": [44.01, 53.208], "c02-011": [53.558, 56.032], "c02-012": [56.382, 58.358], "c02-013": [58.708, 64.55], "c02-014": [64.9, 68.747], "c02-015": [69.097, 74.31], "c02-016": [74.66, 79.118], "c02-017": [79.468, 82.887], "c02-018": [83.737, 84.857], "c02-019": [85.707, 89.721], "c02-020": [90.071, 99.044], "c02-021": [99.394, 107.732], "c02-022": [108.082, 112.776], "c02-023": [113.126, 118.634], "c02-024": [118.984, 124.582], "c02-025": [124.932, 126.341], "c02-026": [126.691, 129.832], "c02-027": [130.182, 135.686], "c02-028": [136.036, 141.195], "c02-029": [141.545, 143.939], "c02-030": [144.289, 146.432], "c02-031": [146.782, 152.681], "c02-032": [153.031, 157.837], "c02-033": [158.187, 162.908], "c02-034": [163.258, 166.843], "c02-035": [167.193, 170.773], "c02-036": [171.623, 172.431], "c02-037": [173.281, 179.749], "c02-038": [180.599, 183.118], "c02-039": [183.468, 191.765], "c02-040": [192.115, 205.89], "c02-041": [206.74, 211.554], "c02-042": [212.404, 216.298], "c02-043": [216.648, 221.332], "c02-044": [221.682, 235.309], "c02-045": [236.159, 241.981], "c02-046": [242.331, 246.011], "c02-047": [246.361, 251.311], "c02-048": [252.161, 255.79], "c02-049": [256.64, 261.113], "c02-050": [261.463, 267.283], "c02-051": [267.633, 270.561], "c02-052": [271.411, 275.066], "c02-053": [275.416, 280.134], "c02-054": [280.484, 285.059], "c02-055": [285.409, 291.479], "c02-056": [292.329, 297.05], "c02-057": [297.9, 306.811], "c02-058": [307.661, 310.623], "c02-059": [311.473, 314.964], "c02-060": [315.814, 321.323], "c02-061": [321.673, 322.748], "c02-062": [323.598, 327.239], "c02-063": [327.589, 332.675], "c02-064": [333.525, 338.004], "c02-065": [338.854, 340.894], "c02-066": [341.744, 348.893], "c02-067": [349.743, 350.735], "c02-068": [351.085, 353.853], "c02-069": [354.203, 360.338], "c02-070": [361.188, 362.92], "c02-071": [363.27, 374.414], "c02-072": [374.764, 382.787], "c02-073": [383.637, 386.845], "c02-074": [387.195, 394.784], "c02-075": [395.634, 399.73], "c02-076": [400.58, 408.26], "c02-077": [408.61, 416.136], "c02-078": [416.486, 419.266], "c02-079": [420.116, 422.384], "c02-080": [422.734, 423.762], "c02-081": [424.612, 431.625], "c02-082": [432.475, 447.325], "c02-083": [448.175, 453.158], "c02-084": [454.008, 463.007], "song-weave": [464.207, 470.207], "song-weave-01": [470.207, 475.307], "song-weave-02": [476.847, 481.987], "song-weave-03": [483.407, 488.627], "song-weave-04": [490.447, 495.047], "song-weave-05": [495.047, 501.627], "song-weave-06": [501.627, 508.467], "song-weave-07": [509.967, 514.807], "c02-085": [517.207, 518.113]}, "blocks": [{"t": "img", "src": "images/05.webp?v=6eddf1229d", "vid": "images/05.mp4?v=9e9a399623", "cap": "董永推车", "n": 5}, {"t": "p", "s": [["c02-001", "原文，出自《搜神记》第一卷。"]]}, {"t": "p", "s": [["c02-002", "汉，董永，千乘人。"], ["c02-003", "少偏孤，与父居肆，力田亩，鹿车载自随。"], ["c02-004", "父亡，无以葬，乃自卖为奴，以供丧事。"], ["c02-005", "主人知其贤，与钱一万，遣之。"], ["c02-006", "永行，三年丧毕，欲还主人，供其奴职。"], ["c02-007", "道逢一妇人曰：“愿为子妻。”"], ["c02-008", "遂与之俱。"], ["c02-009", "主人谓永曰：“以钱与君矣。”"], ["c02-010", "永曰：“蒙君之惠，父丧收藏，永虽小人，必欲服勤致力，以报厚德。”"], ["c02-011", "主曰：“妇人何能？”"], ["c02-012", "永曰：“能织。”"], ["c02-013", "主曰：“必尔者，但令君妇为我织缣百疋。”"], ["c02-014", "于是永妻为主人家织，十日而毕。"], ["c02-015", "女出门，谓永曰：“我，天之织女也。"], ["c02-016", "缘君至孝，天帝令我助君偿债耳。”"], ["c02-017", "语毕，凌空而去，不知所在。"]]}, {"t": "p", "s": [["c02-018", "白话文。"]]}, {"t": "p", "s": [["c02-019", "汉朝的时候，有一个人叫董永，是千乘人。"], ["c02-020", "他很小就失去了母亲，和父亲住在一起，靠种田过日子，出门的时候，就用一辆小鹿车拉着父亲。"], ["c02-021", "后来父亲去世了，他连安葬的钱都没有，就把自己卖给别人做奴仆，用换来的钱办了丧事。"], ["c02-022", "主人知道他是个贤德的人，给了他一万钱，让他回家去。"], ["c02-023", "董永守孝三年之后，想回到主人家，去做完自己该做的活。"], ["c02-024", "半路上，他遇见了一位妇人，对他说：“我愿意做你的妻子。”"], ["c02-025", "于是两个人一起走。"], ["c02-026", "主人对董永说：“钱已经给你了。”"], ["c02-027", "董永说：“承蒙您的恩惠，我的父亲才得以安葬。"], ["c02-028", "我虽然是个小人物，也一定要努力干活，来报答您的深恩。”"], ["c02-029", "主人问：“你的妻子会做什么？”"], ["c02-030", "董永说：“她会织布。”"], ["c02-031", "主人说：“如果真是这样，就请你的妻子替我织一百匹细绢吧。”"], ["c02-032", "于是董永的妻子在主人家织布，只用了十天就织完了。"], ["c02-033", "她走出门，对董永说：“我是天上的织女。"], ["c02-034", "因为你特别孝顺，天帝让我来帮你还债。”"], ["c02-035", "说完，她就腾空飞走了，不知去了哪里。"]]}, {"t": "p", "s": [["c02-036", "故事。"]]}, {"t": "p", "s": [["c02-037", "在很久以前的汉朝，千乘这个地方，有一个年轻人，名叫董永。"]]}, {"t": "p", "s": [["c02-038", "董永很小的时候，妈妈就去世了。"], ["c02-039", "他和爸爸相依为命，爸爸年纪大了，走不动路，董永就用一辆小鹿车，推着爸爸去田里。"], ["c02-040", "春天，他在田埂上给爸爸铺一块软软的草垫，让爸爸坐着晒太阳；夏天，他把自己的草帽戴在爸爸的头上，自己光着头在太阳下干活。"]]}, {"t": "p", "s": [["c02-041", "可是有一年冬天，爸爸病倒了，再也没有好起来。"]]}, {"t": "p", "s": [["c02-042", "董永守在爸爸的床边，哭得眼睛都肿了。"], ["c02-043", "爸爸去世后，家里穷得连一口像样的棺木也买不起。"], ["c02-044", "董永想了又想，最后一咬牙，走到村里最有钱的一位老爷家门口，说：“老爷，我想把自己卖给您做工，您给我一些钱，让我把父亲好好地安葬。”"]]}, {"t": "p", "s": [["c02-045", "老爷看着这个瘦瘦的年轻人，见他又老实又孝顺，心里很感动。"], ["c02-046", "他说：“你是个好孩子，我不要你卖身。"], ["c02-047", "这一万钱，你拿去安葬父亲，剩下的，你自己留着。”"]]}, {"t": "p", "s": [["c02-048", "董永深深地鞠了一躬，眼泪掉了下来。"]]}, {"t": "p", "s": [["c02-049", "他用钱安葬了爸爸，在坟前守了整整三年。"], ["c02-050", "三年过去了，他想：“老爷帮了我这么大的忙，我不能赖账。"], ["c02-051", "我要回去做工，把这笔钱还上。”"]]}, {"t": "img", "src": "images/06.webp?v=d5aa9c32fa", "vid": "images/06.mp4?v=d4106b5b63", "cap": "路遇仙女", "n": 6}, {"t": "p", "s": [["c02-052", "他背着小包袱，走在去老爷家的路上。"], ["c02-053", "路边的柳树刚刚发出新芽，风吹过来，软软的。"], ["c02-054", "走着走着，前面的小路上，站着一位年轻的姑娘。"], ["c02-055", "她穿着浅色的衣裳，眉眼温柔，像天上的月亮一样干净。"]]}, {"t": "p", "s": [["c02-056", "姑娘对他说：“我愿意做你的妻子，陪你一起去。”"]]}, {"t": "p", "s": [["c02-057", "董永吓了一跳，连忙摆手：“姑娘，我是个穷人，要去给人做工还债，哪能让你跟着受苦呢？”"]]}, {"t": "p", "s": [["c02-058", "姑娘笑了笑，说：“我不怕。”"]]}, {"t": "p", "s": [["c02-059", "于是，两个人一起，来到了老爷家。"]]}, {"t": "p", "s": [["c02-060", "老爷看见董永来了，吃了一惊：“我不是已经把钱给你了吗？"], ["c02-061", "你怎么还来？”"]]}, {"t": "p", "s": [["c02-062", "董永说：“您的恩情，我一辈子都记得。"], ["c02-063", "我虽然是个小人物，但也想努力干活，来报答您。”"]]}, {"t": "p", "s": [["c02-064", "老爷看了看他身旁的姑娘，问：“你的妻子会做什么？”"]]}, {"t": "p", "s": [["c02-065", "董永说：“她会织布。”"]]}, {"t": "p", "s": [["c02-066", "老爷想了想，说：“那好，请你的妻子替我织一百匹细绢，就算两清了。”"]]}, {"t": "p", "s": [["c02-067", "一百匹！"], ["c02-068", "这可是要织好几个月的活儿。"], ["c02-069", "董永担心地看着妻子，可妻子只是轻轻地点点头，走进了织房。"]]}, {"t": "img", "src": "images/07.webp?v=fe7852c856", "vid": "images/07.mp4?v=db9505189a", "cap": "织房织绢", "n": 7}, {"t": "p", "s": [["c02-070", "奇怪的事情发生了。"], ["c02-071", "织房里的织机，从早到晚，一刻也不停，“咔嗒，咔嗒，咔嗒”，像有好几双手同时在忙碌。"], ["c02-072", "窗户里透出淡淡的光，那光芒有时是金色的，有时是粉色的，像天上的云霞。"]]}, {"t": "p", "s": [["c02-073", "第十天的傍晚，织房的门打开了。"], ["c02-074", "一百匹光滑柔软的细绢，整整齐齐地堆在屋子里，在夕阳下闪着光。"]]}, {"t": "p", "s": [["c02-075", "老爷和家人看得目瞪口呆，连连称赞。"]]}, {"t": "p", "s": [["c02-076", "姑娘走出屋子，来到董永的身边，轻轻地说：“董永，我是天上的织女。"], ["c02-077", "你对父亲那么孝顺，感动了天帝，天帝才让我下来，帮你把债还清。"], ["c02-078", "现在债还完了，我也该回去了。”"]]}, {"t": "p", "s": [["c02-079", "董永愣住了：“你……"], ["c02-080", "你要走了吗？”"]]}, {"t": "p", "s": [["c02-081", "织女点点头，眼睛里闪着泪光，说：“你是一个好人，要好好过日子。”"]]}, {"t": "img", "src": "images/08.webp?v=04940c3e70", "vid": "images/08.mp4?v=5fbd535f39", "cap": "织女飞天", "n": 8}, {"t": "p", "s": [["c02-082", "话音刚落，她的衣袖轻轻一挥，一片祥云托着她，慢慢地升上了天空，越飞越高，越飞越远，最后变成了天边的一缕霞光，消失不见了。"]]}, {"t": "p", "s": [["c02-083", "董永站在原地，望着天空，很久很久没有动。"]]}, {"t": "p", "s": [["c02-084", "后来，人们一代一代地讲起这个故事，大家都说：一个人对亲人的爱，是可以感动天地的。"]]}, {"t": "song", "title": "织女的歌", "head": "song-weave", "lines": [["song-weave-01", "织机在唱歌，一根一根丝"], ["song-weave-02", "织出天上的，一片片云霞"], ["song-weave-03", "十天十夜，织成一百匹"], ["song-weave-04", "只为帮你，把债还清"], ["song-weave-05", "天上的织女，地上的孝心"], ["song-weave-06", "云彩飘走了，爱还留下"], ["song-weave-07", "你要好好地，过好每一天"]]}, {"t": "p", "s": [["c02-085", "（完）"]]}]}, {"title": "第三章　骑木羊的葛由", "head": "c03-h", "audio": "audio/ch03.m4a?v=53be074db6", "duration": 317.523, "times": {"c03-h": [0.0, 2.922], "c03-001": [3.922, 7.483], "c03-002": [8.333, 11.171], "c03-003": [11.521, 15.683], "c03-004": [16.033, 22.923], "c03-005": [23.273, 28.439], "c03-006": [28.789, 32.444], "c03-007": [32.794, 38.612], "c03-008": [38.962, 41.505], "c03-009": [42.355, 43.477], "c03-010": [44.327, 49.343], "c03-011": [49.693, 54.636], "c03-012": [54.986, 59.521], "c03-013": [59.871, 64.72], "c03-014": [65.07, 71.195], "c03-015": [71.545, 77.041], "c03-016": [77.391, 85.106], "c03-017": [85.456, 89.117], "c03-018": [89.967, 90.752], "c03-019": [91.602, 98.011], "c03-020": [98.361, 113.774], "c03-021": [114.624, 120.199], "c03-022": [120.549, 134.626], "c03-023": [135.476, 140.549], "c03-024": [141.399, 144.52], "c03-025": [145.37, 150.246], "c03-026": [151.096, 157.1], "c03-027": [157.45, 165.911], "c03-028": [166.261, 172.792], "c03-029": [173.642, 177.561], "c03-030": [179.508, 189.172], "c03-031": [190.022, 192.686], "c03-032": [193.036, 196.399], "c03-033": [196.749, 199.323], "c03-034": [200.173, 205.897], "c03-035": [206.247, 208.817], "c03-036": [209.167, 210.08], "c03-037": [210.43, 211.782], "c03-038": [212.632, 221.336], "c03-039": [221.686, 224.393], "c03-040": [225.243, 229.757], "c03-041": [230.107, 241.492], "c03-042": [242.342, 254.328], "c03-043": [255.178, 260.08], "c03-044": [260.43, 263.443], "c03-045": [264.293, 268.45], "c03-046": [269.3, 282.01], "c03-047": [282.86, 294.182], "c03-048": [295.032, 301.981], "c03-049": [302.831, 314.277], "c03-050": [315.127, 316.023]}, "blocks": [{"t": "img", "src": "images/09.webp?v=9a1b40ddee", "vid": "images/09.mp4?v=dee449b36d", "cap": "葛由雕羊", "n": 9}, {"t": "p", "s": [["c03-001", "原文，出自《搜神记》第一卷。"]]}, {"t": "p", "s": [["c03-002", "前周葛由，蜀羌人也。"], ["c03-003", "周成王时，好刻木作羊卖之。"], ["c03-004", "一旦，乘木羊入蜀中，蜀中王侯贵人追之，上绥山。"], ["c03-005", "绥山多桃，在峨眉山西南，高无极也。"], ["c03-006", "随之者不复还，皆得仙道。"], ["c03-007", "故里谚曰：“得绥山一桃，虽不能仙，亦足以豪。”"], ["c03-008", "山下立祠数十处。"]]}, {"t": "p", "s": [["c03-009", "白话文。"]]}, {"t": "p", "s": [["c03-010", "周朝以前，有一个叫葛由的人，是蜀地的羌人。"], ["c03-011", "周成王的时候，他喜欢雕刻木头，做成小羊拿去卖。"], ["c03-012", "有一天早上，他骑着一只木头做的羊，走进了蜀地。"], ["c03-013", "蜀地的王侯和有钱人都去追他，一直追到了绥山。"], ["c03-014", "绥山上有很多桃树，在峨眉山的西南边，高得望不到头。"], ["c03-015", "跟着他上山的人，都没有再回来，据说都成了仙。"], ["c03-016", "所以当地有一句谚语：“能得到绥山的一个桃子，就算不能成仙，也足以让人感到豪迈了。”"], ["c03-017", "山下还建起了几十座祠堂来纪念他。"]]}, {"t": "p", "s": [["c03-018", "故事。"]]}, {"t": "p", "s": [["c03-019", "很久很久以前，在蜀地的一座小村子里，住着一位手艺人，名叫葛由。"], ["c03-020", "他的手特别巧，一块普普通通的木头，到了他的手里，削一削，磨一磨，就变成了一只可爱的小羊：圆圆的眼睛，卷卷的羊毛，小小的蹄子，就像是真的一样。"]]}, {"t": "p", "s": [["c03-021", "葛由每天都坐在树荫底下，一边哼着歌，一边雕羊。"], ["c03-022", "他把做好的小羊摆在集市上卖，孩子们最喜欢来看，一个个蹲在摊子前，伸出小手摸摸羊角，捏捏羊耳朵：“葛叔叔，这只羊会叫吗？”"]]}, {"t": "p", "s": [["c03-023", "葛由笑着说：“它呀，只在月亮好的晚上才会叫。”"]]}, {"t": "p", "s": [["c03-024", "孩子们哈哈大笑，没有人当真。"]]}, {"t": "p", "s": [["c03-025", "可是，有一天早上，村子里发生了一件奇怪的事。"]]}, {"t": "p", "s": [["c03-026", "那天，天刚蒙蒙亮，葛由牵出了他做的最大的一只木羊。"], ["c03-027", "这只羊足有一匹小马那么大，羊角弯弯的，羊毛像云朵一样一圈一圈地卷着。"], ["c03-028", "葛由拍了拍羊背，笑着说：“伙计，今天，咱们去远一点的地方看看吧。”"]]}, {"t": "img", "src": "images/10.webp?v=1a94b6ea10", "vid": "images/10.mp4?v=9ffab5be6d", "cap": "骑羊出发", "n": 10}, {"t": "p", "s": [["c03-029", "话音刚落，他就轻轻地跨上羊背。"], ["c03-030", "那只木头羊，忽然“咩”的一声，抖了抖身子，四只蹄子迈了起来，就像活了一样，一路向着蜀中跑去。"]]}, {"t": "p", "s": [["c03-031", "集市上的人们全都看呆了。"], ["c03-032", "有人揉着眼睛说：“我是不是还没睡醒？"], ["c03-033", "那只木羊，怎么自己跑起来了？”"]]}, {"t": "p", "s": [["c03-034", "蜀中的王侯们，听说有人骑着木羊在街上走，纷纷赶来看热闹。"], ["c03-035", "有人叫喊着追上去：“等一等！"], ["c03-036", "你是什么人？"], ["c03-037", "这羊是怎么回事？”"]]}, {"t": "p", "s": [["c03-038", "可是，那只羊越跑越快，穿过了田野，越过了小河，一直跑到了一座高高的山上。"], ["c03-039", "那座山，就是绥山。"]]}, {"t": "p", "s": [["c03-040", "绥山，又高又秀，山上长满了桃树。"], ["c03-041", "春天的时候，漫山遍野都是粉红色的桃花，像一片云；到了夏天，树上结满了又大又红的桃子，香味飘出老远。"]]}, {"t": "img", "src": "images/11.webp?v=6d534ed6c8", "vid": "images/11.mp4?v=4c79119e3b", "cap": "上绥山", "n": 11}, {"t": "p", "s": [["c03-042", "葛由骑着木羊，一步一步地往山上走，越走越高，越走越高，最后，他和那只羊一起，走进了山顶的白云里，再也看不见了。"]]}, {"t": "p", "s": [["c03-043", "追来的人们，站在山脚下，一个个仰着头张望。"], ["c03-044", "有的人不甘心，也跟着爬上山去。"]]}, {"t": "p", "s": [["c03-045", "可是，跟着他们上山的人，一个也没有再回来。"]]}, {"t": "img", "src": "images/12.webp?v=23205ac1ee", "vid": "images/12.mp4?v=56ab62aadf", "cap": "桃园仙境", "n": 12}, {"t": "p", "s": [["c03-046", "后来，有人在山下听到了这样的传说：那些人遇见了葛由，葛由请他们吃了山上的桃子，他们就都留在山里，变成了逍遥自在的神仙。"]]}, {"t": "p", "s": [["c03-047", "从那以后，山下的人们家家都念叨着一句话：“要是能吃到绥山的一个桃子，就算不能成仙，也足够让人觉得痛快了！”"]]}, {"t": "p", "s": [["c03-048", "人们在山脚下盖起了几十座小小的祠堂，纪念那个骑着木羊的手艺人。"]]}, {"t": "p", "s": [["c03-049", "直到今天，很多孩子还爱听这个故事：只要你的手够巧，心够诚，就算只是一块木头，也能带着你飞向很远的地方。"]]}, {"t": "p", "s": [["c03-050", "（完）"]]}]}, {"title": "第四章　李寄斩蛇", "head": "c04-h", "audio": "audio/ch04.m4a?v=7dc9a7e743", "duration": 659.466, "times": {"c04-h": [0.0, 2.807], "c04-001": [3.807, 7.503], "c04-002": [8.353, 20.318], "c04-003": [20.668, 24.474], "c04-004": [24.824, 33.738], "c04-005": [34.088, 47.035], "c04-006": [47.385, 50.244], "c04-007": [50.594, 54.138], "c04-008": [54.488, 61.674], "c04-009": [62.024, 62.931], "c04-010": [63.281, 71.008], "c04-011": [71.358, 84.536], "c04-012": [84.886, 87.393], "c04-013": [87.743, 90.098], "c04-014": [90.448, 110.046], "c04-015": [110.396, 120.802], "c04-016": [121.151, 132.278], "c04-017": [132.628, 134.892], "c04-018": [135.242, 143.148], "c04-019": [143.498, 146.31], "c04-020": [146.66, 149.564], "c04-021": [150.414, 151.434], "c04-022": [152.284, 157.385], "c04-023": [157.735, 167.92], "c04-024": [168.27, 173.246], "c04-025": [173.596, 177.839], "c04-026": [178.189, 185.559], "c04-027": [185.909, 191.425], "c04-028": [191.775, 202.595], "c04-029": [202.945, 206.714], "c04-030": [207.064, 212.226], "c04-031": [212.576, 219.325], "c04-032": [219.675, 220.653], "c04-033": [221.003, 229.01], "c04-034": [229.36, 241.617], "c04-035": [241.967, 247.269], "c04-036": [247.619, 250.716], "c04-037": [251. ]}, "blocks": [{"t": "img", "src": "images/13.webp?v=9bc74555ff", "vid": "images/13.mp4?v=56518b6f1d", "cap": "庸岭", "n": 13}, {"t": "p", "s": [["c04-001", "原文，出自《搜神记》第十九卷。"]]}, {"t": "p", "s": [["c04-002", "东越闽中，有庸岭，高数十里，其西北隙中，有大蛇，长七八丈大十余围，土俗常惧。"], ["c04-003", "东治都尉及属城长吏，多有死者。"], ["c04-004", "祭以牛羊，故不得福，或与人梦，或下谕巫祝，欲得啖童女年十二三者。"], ["c04-005", "都尉令长并共患之，然气厉不息，共请求人家生婢子，兼有罪家女养之，至八月朝，祭送蛇穴口，蛇出吞啮之。"], ["c04-006", "累年如此，已用九女。"], ["c04-007", "尔时预复募索，未得其女。"], ["c04-008", "将乐县李诞家有六女，无男，其小女名寄，应募欲行。"], ["c04-009", "父母不听。"], ["c04-010", "寄曰：“父母无相，惟生六女，无有一男，虽有如无。"], ["c04-011", "女无缇萦济父母之功，既不能供养，徒费衣食，生无所益，不如早死；卖寄之身，可得少钱，以供父母，岂不善耶！”"], ["c04-012", "父母慈怜，终不听去。"], ["c04-013", "寄自潜行，不可禁止。"], ["c04-014", "寄乃告请好剑及咋蛇犬，至八月朝，便诣庙中坐，怀剑，将犬，先将数石米餈，用蜜麨灌之，以置穴口，蛇便出，头大如囷，目如二尺镜，闻餈香气，先啖食之。"], ["c04-015", "寄便放犬，犬就啮咋，寄从后斫得数创，疮痛急，蛇因踊出，至庭而死。"], ["c04-016", "寄入视穴，得其九女髑髅，悉举出，咤言曰：“汝曹怯弱，为蛇所食，甚可哀愍。”"], ["c04-017", "于是寄女缓步而归。"], ["c04-018", "越王闻之，聘寄女为后，指其父为将乐令，母及姊皆有赏赐。"], ["c04-019", "自是东治无复妖邪之物。"], ["c04-020", "其歌谣至今存焉。"]]}, {"t": "p", "s": [["c04-021", "白话文。"]]}, {"t": "p", "s": [["c04-022", "在东越的闽中，有一座庸岭，高达几十里。"], ["c04-023", "岭的西北边有一道山缝，缝里住着一条大蛇，长七八丈，身子有十几围那么粗，当地人一直很害怕它。"], ["c04-024", "东冶的都尉和附近县城的官员，有好几位因为它而丧命。"], ["c04-025", "人们用牛羊去祭祀它，却没有得到平安。"], ["c04-026", "这条蛇有时托梦给人，有时借巫师传话，说它想吃十二三岁的女孩。"], ["c04-027", "都尉和县令们都很发愁，可是蛇带来的灾祸总不停止。"], ["c04-028", "大家只好从人家买来女婢，还有犯了罪的人家的女儿，养在一起，到了八月初一，就把她们送到蛇洞口，让蛇出来吃掉。"], ["c04-029", "年复一年，已经送去了九个女孩。"], ["c04-030", "这一年，官府又在悬赏寻找女孩，却没有找到。"], ["c04-031", "将乐县李诞家有六个女儿，没有儿子，最小的女儿名叫寄，想要报名去。"], ["c04-032", "父母不答应。"], ["c04-033", "李寄说：“爹娘没有福气，只生了六个女儿，没有一个儿子，有跟没有也差不多。"], ["c04-034", "我们这些女儿，又没有像缇萦那样救父亲的本事，既不能奉养你们，还白白花费衣食，活着没什么用处，不如早点死掉。"], ["c04-035", "把我卖了，还能换些钱，来供养爹娘，这不是很好吗？”"], ["c04-036", "父母疼爱她，始终不让她去。"], ["c04-037", "李寄就自己悄悄地走了，谁也拦不住。"], ["c04-038", "她请人给她一把好剑和一条会咬蛇的狗。"], ["c04-039", "到了八月初一，她就到庙里坐着，怀里藏着剑，带着狗，先准备好几石米糕，用蜜和炒面浇在上面，放在蛇洞口。"], ["c04-040", "蛇果然出来了，头大得像谷仓，眼睛像两面二尺大的镜子，闻到米糕的香气，就先低头去吃。"], ["c04-041", "李寄就放出狗，狗扑上去咬，李寄又在后面砍了它好几刀。"], ["c04-042", "蛇受了重伤，疼得猛地蹿出洞口，到了庭院里就死了。"], ["c04-043", "李寄走进洞里查看，找到了九位女孩的骷髅，把它们都搬了出来，惋惜地说：“你们太胆小软弱了，才被蛇吃掉，真是可怜。”"], ["c04-044", "于是李寄不慌不忙地走回家去。"], ["c04-045", "越王听说了这件事，聘李寄做了王后，又任命她的父亲做将乐县令，她的母亲和姐姐们也都得到了赏赐。"], ["c04-046", "从此，东冶一带再也没有出现妖怪。"], ["c04-047", "当地还有歌谣，至今仍然流传着。"]]}, {"t": "p", "s": [["c04-048", "故事。"]]}, {"t": "p", "s": [["c04-049", "在很久以前，东越的闽中，有一座很高很高的山岭，叫庸岭。"], ["c04-050", "岭的西北边，山壁裂开了一道又黑又深的缝，缝里住着一条大蛇。"], ["c04-051", "它有七八丈长，身子比水缸还粗，一抬头，能把屋顶也碰到。"], ["c04-052", "它的眼睛又圆又大，像两面亮闪闪的镜子。"]]}, {"t": "p", "s": [["c04-053", "这条大蛇，让山下的人们非常害怕。"], ["c04-054", "每到夜里，没有人敢出门，连小狗也不敢叫。"], ["c04-055", "官府想了许多办法，用牛羊去祭它，可是大蛇并不满意。"], ["c04-056", "有一天，它托梦给巫师，说：“我要吃十二三岁的小姑娘。”"]]}, {"t": "p", "s": [["c04-057", "官员们愁得睡不着觉。"], ["c04-058", "他们不忍心，却又怕蛇继续害人，只好每年从别的人家买来一些女孩，到了八月初一，送到蛇洞口。"], ["c04-059", "一年又一年，大蛇已经吃了九个女孩。"]]}, {"t": "p", "s": [["c04-060", "这一年，官府又在到处寻找合适的女孩。"], ["c04-061", "将乐县有一户姓李的人家，生了六个女儿，没有儿子。"], ["c04-062", "最小的女儿，名字叫李寄，她那一年才十二三岁。"]]}, {"t": "img", "src": "images/14.webp?v=bc3485213d", "vid": "images/14.mp4?v=2bc01434fa", "cap": "李寄请行", "n": 14}, {"t": "p", "s": [["c04-063", "李寄听说了这件事，对父母说：“我要去。”"]]}, {"t": "p", "s": [["c04-064", "父母吓得脸都白了：“不行！"], ["c04-065", "你怎么能去呢？”"]]}, {"t": "p", "s": [["c04-066", "李寄却很冷静，说：“爹，娘，家里有六个女儿，我又没有哥哥弟弟，我留在家里，也帮不上太多忙。"], ["c04-067", "如果我去了，还能换些钱来养活你们。”"]]}, {"t": "p", "s": [["c04-068", "她的话刚说完，妈妈就哭了，抱着她，怎么也不放手。"], ["c04-069", "爸爸摇着头说：“就算家里再穷，我们也不能把你送去。”"]]}, {"t": "p", "s": [["c04-070", "可是，李寄心里早就有了主意。"], ["c04-071", "她想：“我不是去送死的，我是去除掉那条蛇的。”"]]}, {"t": "p", "s": [["c04-072", "一天夜里，趁着父母睡着，李寄悄悄地走出了家门。"], ["c04-073", "她去找一位老猎人，请他借给她一把锋利的宝剑，还有一条专门咬蛇的猎犬。"], ["c04-074", "老猎人看着这个小姑娘，又吃惊又佩服，说：“孩子，你一定要小心。”"]]}, {"t": "p", "s": [["c04-075", "李寄点点头，把剑藏在怀里，牵着狗，回到家里。"], ["c04-076", "她又悄悄地准备了好几石米糕，用蜜和炒面浇在上面，香喷喷的，老远就能闻到甜味。"]]}, {"t": "p", "s": [["c04-077", "八月初一那天，天气晴朗。"], ["c04-078", "李寄一个人，坐在庙里，怀里抱着剑，身边卧着猎犬。"], ["c04-079", "她把那一大堆米糕放在蛇洞口，自己躲到旁边的树后面。"]]}, {"t": "img", "src": "images/15.webp?v=d2b8a19e73", "vid": "images/15.mp4?v=451072e412", "cap": "大蛇出洞", "n": 15}, {"t": "p", "s": [["c04-080", "等了很久很久，洞里终于有了动静。"]]}, {"t": "p", "s": [["c04-081", "先是一阵“沙沙沙”的响声，像风吹过树叶。"], ["c04-082", "接着，一个巨大的脑袋，从黑洞里伸了出来。"], ["c04-083", "它的头像一个大谷仓，眼睛像两面大镜子，亮得吓人。"], ["c04-084", "蛇的舌头一伸一缩，闻到了米糕的香味，先低下头，大口大口地吃了起来。"]]}, {"t": "p", "s": [["c04-085", "就在这个时候，李寄大喊一声：“上！”"]]}, {"t": "p", "s": [["c04-086", "那条猎犬立刻冲了上去，一口咬住了蛇的脖子。"], ["c04-087", "李寄也冲了出来，举起宝剑，朝着蛇的身上用力砍去，一下，两下，三下。"], ["c04-088", "大蛇疼得翻来滚去，猛地从洞口蹿了出来，一直冲到庙前的院子里，再也没有力气了，重重地倒在了地上。"]]}, {"t": "p", "s": [["c04-089", "山谷里一下子安静了。"]]}, {"t": "p", "s": [["c04-090", "李寄喘着气，走进蛇洞里去查看。"], ["c04-091", "洞里很暗，地上散落着许多白色的东西，她仔细一看，是九个女孩留下的遗骨。"], ["c04-092", "李寄的心里一阵难过，眼睛红了。"], ["c04-093", "她把遗骨一件一件地搬出了洞外，轻轻地说：“你们太胆小了，才被这条蛇害了，我真替你们难过。”"]]}, {"t": "p", "s": [["c04-094", "然后，她牵着猎犬，一步一步，慢慢地走回了家。"]]}, {"t": "img", "src": "images/16.webp?v=649c5b212e", "vid": "images/16.mp4?v=5087cf1f72", "cap": "欢庆", "n": 16}, {"t": "p", "s": [["c04-095", "消息传开以后，整个闽中都沸腾了。"], ["c04-096", "人们敲锣打鼓，涌上街头，大家都说：“那条害人的大蛇，被一个小姑娘打死了！”"]]}, {"t": "p", "s": [["c04-097", "越王听说了这件事，大为感动，他说：“这样勇敢又聪明的女孩，我要请她做我的王后！”"], ["c04-098", "他还任命李寄的父亲做将乐县的县令，对她的母亲和姐姐们也给了许多赏赐。"]]}, {"t": "p", "s": [["c04-099", "从那以后，东冶一带再也没有出现过妖怪。"], ["c04-100", "孩子们开开心心地在山脚下玩耍，大人们在田里安心地种庄稼。"], ["c04-101", "人们还编了一首歌谣，歌里唱着李寄的名字，一代一代，一直传到了今天。"]]}, {"t": "p", "s": [["c04-102", "（完）"]]}]}, {"title": "第五章　宋定伯捉鬼", "head": "c05-h", "audio": "audio/ch05.m4a?v=ab0d370241", "duration": 517.518, "times": {"c05-h": [0.0, 3.029], "c05-001": [4.029, 7.683], "c05-002": [8.533, 14.955], "c05-003": [15.305, 17.844], "c05-004": [18.194, 20.702], "c05-005": [21.052, 24.084], "c05-006": [24.434, 26.977], "c05-007": [27.327, 29.965], "c05-008": [30.315, 33.955], "c05-009": [34.305, 35.182], "c05-010": [35.532, 42.443], "c05-011": [42.793, 44.686], "c05-012": [45.036, 47.555], "c05-013": [47.905, 52.125], "c05-014": [52.475, 56.669], "c05-015": [57.019, 60.513], "c05-016": [60.863, 67.459], "c05-017": [67.809, 70.386], "c05-018": [70.736, 72.324], "c05-019": [72.674, 78.249], "c05-020": [78.599, 81.189], "c05-021": [
