<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 24px; }
.versions a, .versions span { font-size: 13px; padding: 5px 14px; border-radius: 999px; color: #fff; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, .5); background: rgba(8, 25, 40, .3); }
.versions a:hover { background: rgba(8, 25, 40, .55); }
.versions[hidden] { display: none; }
.versions .on { background: #fff; color: #123f55; border-color: #fff; font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }
/* 书末的「欣赏插曲」：全书插曲的播放列表 */
.songlist { margin: 40px 0 0; padding: 24px 18px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.songlist h3 { margin: 0 0 4px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 24px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; }
.songlist .sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
.btn-song { background: var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.songlist ol { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px; text-align: left; counter-reset: song; }
.songlist li button { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  text-align: left; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.songlist li button::before { counter-increment: song; content: counter(song); grid-row: span 2; color: var(--sea); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.songlist li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.songlist li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.songlist .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 进度条：深色是已播放，浅色是已经下载好的部分（--seek-bg 由 paintSeek() 按 audio.buffered 算），网络慢时一眼看出还要等多久 */
.seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 8px 0 6px; height: 18px;
  background: transparent; cursor: pointer; --seek-bg: var(--line); }
.seek::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border: 0;
  border-radius: 50%; background: var(--sea); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--sea);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
/* 缓冲中：播放键外圈转圈 */
.play { position: relative; }
.play::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent;
  border-top-color: var(--sea); border-right-color: var(--sea); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.buffering .play::after { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="versions" id="versions" hidden></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>
<div class="toast" id="toast"></div>

<script>
const BOOK = {"id": "wizard-of-oz", "title": "绿野仙踪", "intro": "根据弗兰克·鲍姆《绿野仙踪》（又译《奥兹国的魔法师》）浓缩改写，适合 5 到 10 岁的小朋友和爸爸妈妈一起读、一起听。", "kicker": "鲍姆童话", "cover": "images/25.webp?v=35d45238cb", "voice": "Ethan（阳光温暖的哥哥），本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "第一章　龙卷风来了", "head": "c01-h", "audio": "audio/ch01.m4a?v=24a9e1e5d7", "duration": 83.31, "times": {"c01-h": [0.0, 3.636], "c01-001": [4.636, 8.817], "c01-002": [9.167, 16.365], "c01-003": [17.215, 23.084], "c01-004": [23.434, 27.854], "c01-005": [28.204, 34.284], "c01-006": [35.134, 38.438], "c01-007": [38.788, 41.436], "c01-008": [41.786, 42.904], "c01-009": [43.754, 45.874], "c01-010": [46.224, 50.616], "c01-011": [50.966, 55.164], "c01-012": [61.232, 69.816], "c01-013": [70.666, 75.596], "c01-014": [75.946, 81.81]}, "blocks": [{"t": "img", "src": "images/01.webp?v=6c9ff8459a", "vid": "images/01.mp4?v=06ced0e78d", "cap": "灰色大草原上的小木屋", "n": 1}, {"t": "p", "s": [["c01-001", "小姑娘多萝西住在美国堪萨斯州的大草原上。"], ["c01-002", "和她住在一起的，有亨利叔叔、艾姆婶婶，还有一只黑色的小狗，名叫托托。"]]}, {"t": "img", "src": "images/02.webp?v=237904fdec", "vid": "images/02.mp4?v=fbfceb22f7", "cap": "托托逗得多萝西哈哈大笑", "n": 2}, {"t": "p", "s": [["c01-003", "他们的家是一间小小的木头房子，四周是一望无际的灰色草原。"], ["c01-004", "太阳把草晒成了灰色，把房子也晒成了灰色。"], ["c01-005", "可是托托一点儿也不灰，它整天跑来跑去，逗得多萝西哈哈大笑。"]]}, {"t": "img", "src": "images/03.webp?v=6ddfd941ad", "vid": "images/03.mp4?v=f99d770b10", "cap": "天空突然变得黑沉沉的", "n": 3}, {"t": "p", "s": [["c01-006", "有一天，天空突然变得黑沉沉的。"], ["c01-007", "亨利叔叔大喊：“龙卷风来了！"], ["c01-008", "快躲进地窖里去！”"]]}, {"t": "img", "src": "images/04.webp?v=94e1145b5c", "vid": "images/04.mp4?v=a524e7169b", "cap": "托托吓得钻到了床底下", "n": 4}, {"t": "p", "s": [["c01-009", "艾姆婶婶赶紧跑进了地窖。"], ["c01-010", "多萝西正要跟过去，托托却吓得钻到了床底下。"], ["c01-011", "她刚把托托抱出来，大风就呼呼地刮来了。"]]}, {"t": "img", "src": "images/05.webp?v=8b96df53c9", "vid": "images/05.mp4?v=6760b00dd1", "cap": "小木屋被龙卷风举了起来", "n": 5}, {"t": "p", "s": [["c01-012", "小木屋转了两三圈，竟然被龙卷风慢慢地举了起来，越升越高，好像坐在一个大气球里一样。"]]}, {"t": "img", "src": "images/06.webp?v=7894fb8820", "vid": "images/06.mp4?v=f6eaeff3aa", "cap": "房子摇呀摇，她睡着了", "n": 6}, {"t": "p", "s": [["c01-013", "多萝西抱着托托，坐在屋子里，心里又害怕又好奇。"], ["c01-014", "房子摇呀摇，摇呀摇，最后，她竟然躺在床上睡着了。"]]}]}, {"title": "第二章　芒奇金人的国度", "head": "c02-h", "audio": "audio/ch02.m4a?v=42a650d2c9", "duration": 117.044, "times": {"c02-h": [0.0, 2.873], "c02-001": [3.873, 8.176], "c02-002": [10.97, 13.287], "c02-003": [14.137, 23.329], "c02-004": [23.679, 26.28], "c02-005": [27.13, 29.963], "c02-006": [30.313, 39.826], "c02-007": [44.401, 48.743], "c02-008": [49.093, 53.778], "c02-009": [54.628, 58.585], "c02-010": [58.935, 64.389], "c02-011": [65.239, 70.263], "c02-012": [70.613, 76.94], "c02-013": [77.79, 83.683], "c02-014": [84.533, 90.257], "c02-015": [91.107, 99.333], "c02-016": [99.683, 104.581], "c02-017": [105.431, 112.679], "c02-018": [113.029, 115.544]}, "blocks": [{"t": "img", "src": "images/07.webp?v=1ec5b3aa56", "vid": "images/07.mp4?v=b116ee0e64", "cap": "门外是一个美丽的地方", "n": 7}, {"t": "p", "s": [["c02-001", "“砰”的一声，房子落到了地上，多萝西醒了过来。"], ["c02-002", "她打开门，一下子惊呆了。"]]}, {"t": "p", "s": [["c02-003", "门外是一个美丽的地方：绿油油的草地，五颜六色的花朵，挂满果子的大树，还有一条亮晶晶的小河。"], ["c02-004", "小鸟在树上唱着好听的歌。"]]}, {"t": "img", "src": "images/08.webp?v=d644f73f05", "vid": "images/08.mp4?v=d2ffe51d7e", "cap": "芒奇金人和北方的好女巫", "n": 8}, {"t": "p", "s": [["c02-005", "这时，走过来几个奇怪的小人儿。"], ["c02-006", "他们个子小小的，穿着蓝色的衣服，戴着蓝色的尖顶帽，帽子边上挂着小铃铛，一走路就丁零丁零地响。"]]}, {"t": "p", "s": [["c02-007", "走在中间的，是一位穿白色长袍的老奶奶。"], ["c02-008", "她的长袍上闪着小星星，她就是北方的好女巫。"]]}, {"t": "p", "s": [["c02-009", "好女巫说：“欢迎你，了不起的小姑娘！"], ["c02-010", "你的房子正好压住了东方的坏女巫，芒奇金人从此自由了！”"]]}, {"t": "img", "src": "images/09.webp?v=c776014ee2", "vid": "images/09.mp4?v=aa6955682d", "cap": "房子底下露出一双银鞋子", "n": 9}, {"t": "p", "s": [["c02-011", "多萝西回头一看，房子底下露出了一双穿着银鞋子的脚。"], ["c02-012", "可是一眨眼，坏女巫就在太阳底下化成了一阵烟，只留下了那双银鞋子。"]]}, {"t": "img", "src": "images/10.webp?v=cc64f6d3b4", "vid": "images/10.mp4?v=842dcbed05", "cap": "好女巫把银鞋子送给多萝西", "n": 10}, {"t": "p", "s": [["c02-013", "好女巫把银鞋子送给了多萝西：“这双鞋子有魔力，你穿上它吧。”"]]}, {"t": "p", "s": [["c02-014", "多萝西说：“谢谢您，可是，我想回家，回到堪萨斯去。”"]]}, {"t": "img", "src": "images/11.webp?v=44e09576e6", "vid": "images/11.mp4?v=03dae35381", "cap": "沿着黄砖路，就能走到翡翠城", "n": 11}, {"t": "p", "s": [["c02-015", "好女巫想了想，说：“去翡翠城吧，那里住着伟大的魔法师奥兹，他一定能帮助你。"], ["c02-016", "你只要沿着黄砖铺成的路一直走，就能走到翡翠城。”"]]}, {"t": "img", "src": "images/12.webp?v=6ffac5d246", "vid": "images/12.mp4?v=4ff56b6e6a", "cap": "额头上一个闪亮的印记", "n": 12}, {"t": "p", "s": [["c02-017", "说完，好女巫在多萝西的额头上轻轻地吻了一下，留下了一个闪亮的印记。"], ["c02-018", "“有了它，谁也不敢伤害你。”"]]}]}, {"title": "第三章　稻草人", "head": "c03-h", "audio": "audio/ch03.m4a?v=a787a94db3", "duration": 69.086, "times": {"c03-h": [0.0, 2.023], "c03-001": [3.023, 9.832], "c03-002": [10.682, 18.164], "c03-003": [18.514, 25.091], "c03-004": [25.941, 28.926], "c03-005": [29.776, 31.287], "c03-006": [31.637, 33.151], "c03-007": [33.501, 35.629], "c03-008": [36.479, 38.417], "c03-009": [38.767, 42.548], "c03-010": [42.898, 45.176], "c03-011": [45.526, 48.671], "c03-012": [49.521, 58.001], "c03-013": [58.851, 59.472], "c03-014": [59.822, 64.053], "c03-015": [64.403, 67.586]}, "blocks": [{"t": "img", "src": "images/13.webp?v=485f8d4348", "vid": "images/13.mp4?v=b0b278857c", "cap": "踏上黄砖路", "n": 13}, {"t": "p", "s": [["c03-001", "多萝西穿上银鞋子，提着装面包的小篮子，带着托托，踏上了黄砖路。"]]}, {"t": "img", "src": "images/14.webp?v=a83d811015", "vid": "images/14.mp4?v=54d2fad077", "cap": "玉米地里的稻草人", "n": 14}, {"t": "p", "s": [["c03-002", "走了一会儿，她看见路边的玉米地里，竖着一根高高的木杆，木杆上挂着一个稻草人。"], ["c03-003", "稻草人的脑袋是一个装满稻草的小布袋，上面画着眼睛、鼻子和嘴巴。"]]}, {"t": "img", "src": "images/15.webp?v=f567c506a1", "vid": "images/15.mp4?v=edbd1a1301", "cap": "稻草人朝她眨了眨眼睛", "n": 15}, {"t": "p", "s": [["c03-004", "忽然，稻草人朝她眨了眨眼睛。"]]}, {"t": "p", "s": [["c03-005", "稻草人说：“你好！"], ["c03-006", "能帮我从杆子上下来吗？"], ["c03-007", "一直挂在这里，真是无聊极了。”"]]}, {"t": "img", "src": "images/16.webp?v=298e3ffb80", "vid": "images/16.mp4?v=bb4243c568", "cap": "多萝西帮他取了下来", "n": 16}, {"t": "p", "s": [["c03-008", "多萝西帮他取了下来。"], ["c03-009", "稻草人伸了个懒腰，高兴地说：“谢谢你！"], ["c03-010", "我的脑袋里装的全是稻草，没有脑子。"], ["c03-011", "连乌鸦都不怕我，还落在我的肩膀上笑话我。”"]]}, {"t": "p", "s": [["c03-012", "多萝西说：“我要去翡翠城找奥兹，请他送我回家，你和我一起去吧，也许奥兹能给你一个脑子。”"]]}, {"t": "img", "src": "images/17.webp?v=ac52052f07", "vid": "images/17.mp4?v=9e27504903", "cap": "稻草人高兴得摔了个跟头", "n": 17}, {"t": "p", "s": [["c03-013", "“太好了！”"], ["c03-014", "稻草人高兴得跳了起来，可是一下子就摔了个跟头。"], ["c03-015", "多萝西咯咯地笑了，把他扶了起来。"]]}]}, {"title": "第四章　铁皮人", "head": "c04-h", "audio": "audio/ch04.m4a?v=2815d615da", "duration": 65.324, "times": {"c04-h": [0.0, 2.176], "c04-001": [3.176, 4.997], "c04-002": [5.347, 10.078], "c04-003": [10.928, 15.793], "c04-004": [16.143, 19.022], "c04-005": [19.872, 26.023], "c04-006": [26.873, 32.706], "c04-007": [33.056, 37.813], "c04-008": [40.284, 42.266], "c04-009": [42.616, 44.568], "c04-010": [44.918, 50.068], "c04-011": [50.418, 53.033], "c04-012": [53.883, 59.076], "c04-013": [59.926, 63.824]}, "blocks": [{"t": "img", "src": "images/18.webp?v=a4b9a27c54", "vid": "images/18.mp4?v=aab19c0683", "cap": "走进一片大树林", "n": 18}, {"t": "p", "s": [["c04-001", "他们走进了一片大树林。"], ["c04-002", "忽然，树林里传来一阵“哎哟、哎哟”的声音。"]]}, {"t": "img", "src": "images/19.webp?v=c988820517", "vid": "images/19.mp4?v=e4a2f096b4", "cap": "生锈的铁皮人", "n": 19}, {"t": "p", "s": [["c04-003", "他们走过去一看，原来是一个全身都是铁皮的人。"], ["c04-004", "他举着一把斧头，一动也不能动。"]]}, {"t": "p", "s": [["c04-005", "铁皮人说：“我生锈了，请帮我拿那边的油壶，给我的关节上点儿油吧。”"]]}, {"t": "img", "src": "images/20.webp?v=860f9753e3", "vid": "images/20.mp4?v=44defd0614", "cap": "给铁皮人的关节上油", "n": 20}, {"t": "p", "s": [["c04-006", "多萝西给他的脖子上了油，稻草人帮他扶着脑袋，慢慢地转一转。"], ["c04-007", "又给他的胳膊和腿都上了油，铁皮人终于又能动了。"]]}, {"t": "p", "s": [["c04-008", "铁皮人说：“谢谢你们！"], ["c04-009", "我在这里站了整整一年。"], ["c04-010", "我是一个樵夫，全身都是铁做的，可是，我没有一颗心。"], ["c04-011", "没有心，就不能真正地去爱别人。”"]]}, {"t": "p", "s": [["c04-012", "多萝西说：“那就和我们一起去找奥兹吧，请他给你一颗心。”"]]}, {"t": "img", "src": "images/21.webp?v=69f7980bb8", "vid": "images/21.mp4?v=2e490756dd", "cap": "铁皮人高高兴兴地跟上了他们", "n": 21}, {"t": "p", "s": [["c04-013", "铁皮人扛起斧头，高高兴兴地跟上了他们。"]]}]}, {"title": "第五章　胆小的狮子", "head": "c05-h", "audio": "audio/ch05.m4a?v=b6b26dc53a", "duration": 104.619, "times": {"c05-h": [0.0, 2.37], "c05-001": [3.37, 4.87], "c05-002": [5.22, 9.647], "c05-003": [13.175, 18.213], "c05-004": [19.063, 23.248], "c05-005": [24.098, 30.332], "c05-006": [30.682, 34.592], "c05-007": [35.442, 42.006], "c05-008": [42.356, 46.881], "c05-009": [47.731, 52.303], "c05-010": [53.153, 62.609], "song-road-song": [63.809, 65.929], "song-road-song-01": [65.929, 68.269], "song-road-song-02": [68.269, 71.369], "song-road-song-03": [72.489, 76.389], "song-road-song-04": [76.549, 80.109], "song-road-song-05": [80.109, 84.609], "song-road-song-06": [84.609, 89.389], "song-road-song-07": [89.389, 93.109], "song-road-song-08": [94.109, 97.769]}, "blocks": [{"t": "img", "src": "images/22.webp?v=a486e3a50e", "vid": "images/22.mp4?v=49c3ecb328", "cap": "一头大狮子跳到了路中间", "n": 22}, {"t": "p", "s": [["c05-001", "树林越来越密了。"], ["c05-002", "突然，“嗷呜”一声，一头大狮子跳到了路中间。"], ["c05-003", "他一爪子把稻草人推倒在路边，又把铁皮人撞得砰的一声。"]]}, {"t": "p", "s": [["c05-004", "接着，他张开大嘴，朝小狗托托扑了过去。"]]}, {"t": "img", "src": "images/23.webp?v=76fdeb8009", "vid": "images/23.mp4?v=f50b4ef871", "cap": "多萝西打了狮子的鼻子", "n": 23}, {"t": "p", "s": [["c05-005", "多萝西顾不上害怕，跑上去，在狮子的鼻子上打了一下：“不许欺负小狗！"], ["c05-006", "你这么大，还欺负小狗，真是个胆小鬼！”"]]}, {"t": "img", "src": "images/24.webp?v=2900dbc26a", "vid": "images/24.mp4?v=66c91fef03", "cap": "我就是一个胆小鬼", "n": 24}, {"t": "p", "s": [["c05-007", "狮子用爪子揉着鼻子，委屈地说：“你说得对，我就是一个胆小鬼。"], ["c05-008", "我只会大声吼叫，其实心里怕得要命。”"]]}, {"t": "p", "s": [["c05-009", "稻草人说：“那你也和我们一起去找奥兹吧，请他给你一点儿勇气。”"]]}, {"t": "img", "src": "images/25.webp?v=35d45238cb", "vid": "images/25.mp4?v=d15e14da71", "cap": "五个好朋友一起往前走", "n": 25}, {"t": "p", "s": [["c05-010", "就这样，多萝西、托托、稻草人、铁皮人和胆小的狮子，成了好朋友，一起沿着黄砖路往前走。"]]}, {"t": "song", "title": "黄砖路上一起走", "head": "song-road-song", "lines": [["song-road-song-01", "黄砖路，弯又长"], ["song-road-song-02", "我们一起向前方"], ["song-road-song-03", "稻草人想要一个脑袋"], ["song-road-song-04", "铁皮人想要一颗心脏"], ["song-road-song-05", "狮子想要勇敢的胆量"], ["song-road-song-06", "多萝西想回她的家乡"], ["song-road-song-07", "手拉手，肩并肩，不害怕"], ["song-road-song-08", "一起走向闪亮的远方"]]}]}, {"title": "第六章　深沟和大河", "head": "c06-h", "audio": "audio/ch06.m4a?v=8443081044", "duration": 58.25, "times": {"c06-h": [0.0, 2.713], "c06-001": [3.713, 7.833], "c06-002": [8.183, 11.397], "c06-003": [12.247, 18.042], "c06-004": [18.892, 24.388], "c06-005": [24.738, 28.28], "c06-006": [29.13, 31.739], "c06-007": [32.089, 36.961], "c06-008": [37.811, 45.056], "c06-009": [45.406, 48.688], "c06-010": [49.538, 56.75]}, "blocks": [{"t": "img", "src": "images/26.webp?v=6d10fb84ff", "vid": "images/26.mp4?v=c057779e0e", "cap": "又宽又深的大沟", "n": 26}, {"t": "p", "s": [["c06-001", "走着走着，一条又宽又深的大沟挡住了他们的路。"], ["c06-002", "沟底全是尖尖的石头，根本过不去。"]]}, {"t": "p", "s": [["c06-003", "狮子说：“我来试试，我虽然害怕，可是我能跳得很远。”"]]}, {"t": "img", "src": "images/27.webp?v=bef9493963", "vid": "images/27.mp4?v=1127749d67", "cap": "狮子驮着大家跳了过去", "n": 27}, {"t": "p", "s": [["c06-004", "狮子让大家一个一个坐在他的背上，用力一跳，就跳到了对面。"], ["c06-005", "他来来回回跳了好几趟，把大家都送了过去。"]]}, {"t": "img", "src": "images/28.webp?v=a50dc5d501", "vid": "images/28.mp4?v=8981d57ed6", "cap": "大家一起做了一只木筏", "n": 28}, {"t": "p", "s": [["c06-006", "后来，他们又遇到了一条大河。"], ["c06-007", "铁皮人用斧头砍倒了几棵大树，大家一起做了一只木筏。"]]}, {"t": "img", "src": "images/29.webp?v=53375fc252", "vid": "images/29.mp4?v=54de7a3d8e", "cap": "稻草人被留在了河中间", "n": 29}, {"t": "p", "s": [["c06-008", "木筏漂到河中间，稻草人用长竿撑船，竿子却插进了河底的泥里拔不出来。"], ["c06-009", "稻草人抱着竿子，被留在了河中间！"]]}, {"t": "img", "src": "images/30.webp?v=99243d19d2", "vid": "images/30.mp4?v=ea55d1b793", "cap": "大鹳鸟叼起了稻草人", "n": 30}, {"t": "p", "s": [["c06-010", "多亏一只好心的大鹳鸟飞过来，用长长的嘴巴叼起稻草人，把他送回了大家身边。"]]}]}, {"title": "第七章　罂粟花田", "head": "c07-h", "audio": "audio/ch07.m4a?v=ca8505a13c", "duration": 62.583, "times": {"c07-h": [0.0, 2.447], "c07-001": [3.447, 7.46], "c07-002": [7.81, 11.653], "c07-003": [12.503, 17.965], "c07-004": [18.315, 19.549], "c07-005": [20.399, 23.237], "c07-006": [23.587, 24.499], "c07-007": [24.849, 28.259], "c07-008": [28.609, 33.588], "c07-009": [34.438, 38.072], "c07-010": [38.422, 41.422], "c07-011": [42.272, 44.913], "c07-012": [45.263, 51.983], "c07-013": [52.833, 61.083]}, "blocks": [{"t": "img", "src": "images/31.webp?v=859ae57cd4", "vid": "images/31.mp4?v=4ad09becbb", "cap": "一大片红色的罂粟花田", "n": 31}, {"t": "p", "s": [["c07-001", "过了河，眼前是一大片红色的罂粟花田。"], ["c07-002", "花开得又大又红，香味浓得让人发晕。"]]}, {"t": "img", "src": "images/32.webp?v=38aaea22b3", "vid": "images/32.mp4?v=6d04d7028c", "cap": "多萝西在花丛中睡着了", "n": 32}, {"t": "p", "s": [["c07-003", "多萝西闻着闻着，眼皮越来越沉，躺在花丛中睡着了。"], ["c07-004", "托托也睡着了。"]]}, {"t": "img", "src": "images/33.webp?v=4d3baa5ebf", "vid": "images/33.mp4?v=afccaceedb", "cap": "把多萝西抬出了花田", "n": 33}, {"t": "p", "s": [["c07-005", "“这些花有魔力，会让人一直睡下去！”"], ["c07-006", "铁皮人说。"], ["c07-007", "稻草人和铁皮人不用呼吸，一点儿也不困。"], ["c07-008", "他们赶紧用手臂搭成椅子，把多萝西和托托抬出了花田。"]]}, {"t": "p", "s": [["c07-009", "可是，狮子太重了，他们抬不动。"], ["c07-010", "狮子走到一半，也呼呼地睡着了。"]]}, {"t": "img", "src": "images/34.webp?v=1461f5cb00", "vid": "images/34.mp4?v=3fab785585", "cap": "小田鼠们把狮子拉出了花田", "n": 34}, {"t": "p", "s": [["c07-011", "这时，一群田鼠赶来帮忙。"], ["c07-012", "原来，铁皮人刚才救了田鼠女王，所以成千上万只小田鼠都来报答他们。"]]}, {"t": "p", "s": [["c07-013", "小田鼠们拉着一根根细绳，绳子绑在一辆木头车上，一起使劲，终于把狮子拉出了花田。"]]}]}, {"title": "第八章　翡翠城", "head": "c08-h", "audio": "audio/ch08.m4a?v=20768508f4", "duration": 38.898, "times": {"c08-h": [0.0, 2.357], "c08-001": [3.357, 7.923], "c08-002": [8.273, 13.886], "c08-003": [14.736, 19.23], "c08-004": [19.58, 23.106], "c08-005": [23.956, 26.641], "c08-006": [26.991, 33.011], "c08-007": [33.361, 37.398]}, "blocks": [{"t": "img", "src": "images/35.webp?v=e408f741b0", "vid": "images/35.mp4?v=e15181f489", "cap": "远处出现了美丽的绿光", "n": 35}, {"t": "p", "s": [["c08-001", "他们沿着黄砖路继续走，周围的东西变得越来越绿。"], ["c08-002", "终于，远处出现了一片美丽的绿光，那就是翡翠城。"]]}, {"t": "img", "src": "images/36.webp?v=5e4ba565b5", "vid": "images/36.mp4?v=d77343df62", "cap": "守门人给大家戴上绿眼镜", "n": 36}, {"t": "p", "s": [["c08-003", "城门口的守门人给每个人都戴上了一副绿色的眼镜。"], ["c08-004", "“翡翠城太亮了，不戴眼镜会刺伤眼睛的。”"]]}, {"t": "img", "src": "images/37.webp?v=b70ebebb9c", "vid": "images/37.mp4?v=d87b3a0265", "cap": "走进翡翠城", "n": 37}, {"t": "p", "s": [["c08-005", "走进城里，大家都看呆了。"], ["c08-006", "街道是绿色的，房子是绿色的，路上镶满了亮晶晶的绿宝石。"], ["c08-007", "就连人们的衣服和皮肤，看起来都是淡淡的绿色。"]]}]}, {"title": "第九章　伟大的奥兹", "head": "c09-h", "audio": "audio/ch09.m4a?v=8142e14bff", "duration": 58.25, "times": {"c09-h": [0.0, 2.498], "c09-001": [3.498, 5.986], "c09-002": [6.836, 15.994], "c09-003": [16.844, 20.937], "c09-004": [21.787, 25.231], "c09-005": [25.581, 27.828], "c09-006": [28.178, 30.913], "c09-007": [31.763, 44.282], "c09-008": [44.632, 50.213], "c09-009": [51.063, 56.75]}, "blocks": [{"t": "img", "src": "images/38.webp?v=61dea6e4bf", "vid": "images/38.mp4?v=13fd514135", "cap": "宝座上悬着一个巨大的脑袋", "n": 38}, {"t": "p", "s": [["c09-001", "伟大的奥兹每天只见一个人。"]]}, {"t": "p", "s": [["c09-002", "多萝西走进宽大的宫殿，看见一张绿宝石做的宝座上，悬着一个巨大的脑袋，没有身体，也没有手脚。"]]}, {"t": "p", "s": [["c09-003", "大脑袋说：“我是伟大的奥兹，你为什么来找我？”"]]}, {"t": "p", "s": [["c09-004", "多萝西鼓起勇气，说出了自己的愿望。"], ["c09-005", "奥兹说：“我可以帮你回家。"], ["c09-006", "可是你必须先打败西方的坏女巫。”"]]}, {"t": "img", "src": "images/39.webp?v=0a2b2d5dc0", "vid": "images/39.mp4?v=b7e8b7ce54", "cap": "每个人看见的奥兹都不一样", "n": 39}, {"t": "p", "s": [["c09-007", "第二天，稻草人看见的奥兹，是一位美丽的仙女；铁皮人看见的，是一头可怕的怪兽；狮子看见的，是一个熊熊燃烧的大火球。"], ["c09-008", "奥兹对他们说的，都是同一句话：先去打败西方的坏女巫。"]]}, {"t": "p", "s": [["c09-009", "大家心里都很难过，可是为了实现愿望，他们决定一起向西走。"]]}]}, {"title": "第十章　西方的坏女巫", "head": "c10-h", "audio": "audio/ch10.m4a?v=357c234e64", "duration": 73.52, "times": {"c10-h": [0.0, 2.544], "c10-001": [3.544, 10.383], "c10-002": [10.733, 13.395], "c10-003": [14.245, 19.507], "c10-004": [19.857, 24.532], "c10-005": [24.882, 30.565], "c10-006": [31.415, 32.803], "c10-007": [33.153, 36.849], "c10-008": [37.699, 46.993], "c10-009": [51.569, 60.892], "c10-010": [61.742, 67.804], "c10-011": [68.154, 72.02]}, "blocks": [{"t": "img", "src": "images/40.webp?v=81f4e36d3e", "vid": "images/40.mp4?v=883afbc136", "cap": "坏女巫的眼睛能看得很远", "n": 40}, {"t": "p", "s": [["c10-001", "西方的坏女巫只有一只眼睛，可是那只眼睛像望远镜一样，能看得很远很远。"], ["c10-002", "她早就看见多萝西他们来了。"]]}, {"t": "img", "src": "images/41.webp?v=289127972d", "vid": "images/41.mp4?v=a48065691c", "cap": "铁皮人和稻草人赶跑了狼群和乌鸦", "n": 41}, {"t": "p", "s": [["c10-003", "她派出了一群大灰狼，铁皮人挥着斧头，把狼全都赶跑了。"], ["c10-004", "她派出了一群乌鸦，稻草人张开手臂，把乌鸦都吓跑了。"], ["c10-005", "她派出了一群黑蜜蜂，蜜蜂蜇在铁皮人身上，刺全都断了。"]]}, {"t": "img", "src": "images/42.webp?v=58a42d1047", "vid": "images/42.mp4?v=c58d2abdc7", "cap": "会飞的猴子", "n": 42}, {"t": "p", "s": [["c10-006", "坏女巫气坏了。"], ["c10-007", "她戴上了一顶金帽子，召来了会飞的猴子。"]]}, {"t": "p", "s": [["c10-008", "飞猴们呼啦啦地飞来，把稻草人身上的稻草扯了出来，把铁皮人扔到了石头堆上，还把狮子捆了起来。"], ["c10-009", "可是，他们看见了多萝西额头上好女巫的印记，不敢伤害她，只好把她和托托带到了坏女巫的城堡里。"]]}, {"t": "img", "src": "images/43.webp?v=0a0ea5702c", "vid": "images/43.mp4?v=fa8fd695ca", "cap": "多萝西每天擦洗地板", "n": 43}, {"t": "p", "s": [["c10-010", "坏女巫让多萝西每天打扫厨房、擦洗地板，还把狮子关进了笼子里。"], ["c10-011", "多萝西每天晚上都悄悄地给狮子送吃的。"]]}]}, {"title": "第十一章　一桶水", "head": "c11-h", "audio": "audio/ch11.m4a?v=1656eeda04", "duration": 64.673, "times": {"c11-h": [0.0, 2.288], "c11-001": [3.288, 6.543], "c11-002": [6.893, 15.469], "c11-003": [16.319, 17.561], "c11-004": [17.911, 24.519], "c11-005": [27.883, 31.709], "c11-006": [32.059, 33.385], "c11-007": [34.235, 37.191], "c11-008": [37.541, 45.608], "c11-009": [50.516, 54.537], "c11-010": [54.887, 63.173]}, "blocks": [{"t": "p", "s": [["c11-001", "坏女巫一直想得到多萝西的银鞋子。"], ["c11-002", "有一天，她用一根看不见的铁棍把多萝西绊倒了，一只银鞋子掉了下来，坏女巫一把抢了过去。"]]}, {"t": "img", "src": "images/44.webp?v=51dc93f90d", "vid": "images/44.mp4?v=d5274151f5", "cap": "多萝西把一桶水泼了过去", "n": 44}, {"t": "p", "s": [["c11-003", "“把鞋子还给我！”"], ["c11-004", "多萝西气极了，顺手提起旁边的一桶水，哗啦一下泼在了坏女巫身上。"]]}, {"t": "p", "s": [["c11-005", "坏女巫尖叫起来：“哎呀，你看你干了什么！"], ["c11-006", "我要化掉了！”"]]}, {"t": "img", "src": "images/45.webp?v=949c917a11", "vid": "images/45.mp4?v=60a86d7100", "cap": "坏女巫化成了一摊水", "n": 45}, {"t": "p", "s": [["c11-007", "原来，坏女巫最怕的就是水。"], ["c11-008", "她的身子越缩越小，越缩越小，最后，化成了一摊黑黑的水，只剩下了那只银鞋子。"]]}, {"t": "img", "src": "images/46.webp?v=4c3f575d21", "vid": "images/46.mp4?v=e35714a1a6", "cap": "大家又团聚了", "n": 46}, {"t": "p", "s": [["c11-009", "多萝西放出了狮子，城堡里的人们也都自由了。"], ["c11-010", "大家一起找回了铁皮人，把他身上的坑敲平；又找回了稻草人的衣服，重新塞满了干干净净的稻草。"]]}]}, {"title": "第十二章　奥兹的秘密", "head": "c12-h", "audio": "audio/ch12.m4a?v=eb3ae947d3", "duration": 73.433, "times": {"c12-h": [0.0, 2.405], "c12-001": [3.405, 7.268], "c12-002": [7.618, 12.778], "c12-003": [13.628, 18.386], "c12-004": [21.397, 24.759], "c12-005": [25.609, 26.343], "c12-006": [26.693, 27.917], "c12-007": [28.767, 38.053], "c12-008": [38.403, 42.488], "c12-009": [43.338, 44.801], "c12-010": [45.151, 48.81], "c12-011": [49.66, 54.763], "c12-012": [55.113, 59.094], "c12-013": [59.444, 64.196], "c12-014": [65.046, 71.933]}, "blocks": [{"t": "p", "s": [["c12-001", "他们回到翡翠城，去找奥兹兑现他的承诺。"], ["c12-002", "可是这一次，宫殿里什么也看不见，只听见一个声音。"]]}, {"t": "img", "src": "images/47.webp?v=60d2d6af71", "vid": "images/47.mp4?v=31224a8ec2", "cap": "托托撞倒了屏风", "n": 47}, {"t": "p", "s": [["c12-003", "就在这时，托托跑到墙角，一下子撞倒了一扇屏风。"], ["c12-004", "屏风后面，站着一个秃顶的小老头。"]]}, {"t": "p", "s": [["c12-005", "“你是谁？”"], ["c12-006", "大家吃惊地问。"]]}, {"t": "p", "s": [["c12-007", "小老头不好意思地说：“我就是伟大的奥兹，其实，我不是什么魔法师，只是一个会变戏法的普通人。"], ["c12-008", "很多年前，我坐着热气球，被大风吹到了这里。”"]]}, {"t": "p", "s": [["c12-009", "大家都很失望。"], ["c12-010", "可是奥兹说：“别着急，我想办法帮帮你们。”"]]}, {"t": "img", "src": "images/48.webp?v=8a23289708", "vid": "images/48.mp4?v=c1a323a8b0", "cap": "奥兹送给他们的礼物", "n": 48}, {"t": "p", "s": [["c12-011", "他在稻草人的脑袋里装上了糠和针，说：“这是新的脑子。”"], ["c12-012", "他在铁皮人的胸口放进了一颗丝绸做的心。"], ["c12-013", "他又给狮子喝了一碗绿色的饮料，说：“这就是勇气。”"]]}, {"t": "p", "s": [["c12-014", "稻草人觉得自己聪明多了，铁皮人觉得心里暖暖的，狮子觉得自己什么都不怕了。"]]}]}, {"title": "第十三章　热气球", "head": "c13-h", "audio": "audio/ch13.m4a?v=4c29638dea", "duration": 48.641, "times": {"c13-h": [0.0, 2.371], "c13-001": [3.371, 8.452], "c13-002": [9.302, 14.208], "c13-003": [14.558, 17.881], "c13-004": [18.731, 20.559], "c13-005": [20.909, 24.995], "c13-006": [25.345, 27.122], "c13-007": [27.972, 33.742], "c13-008": [34.592, 35.044], "c13-009": [35.394, 36.346], "c13-010": [36.696, 37.953], "c13-011": [38.803, 40.714], "c13-012": [41.064, 42.636], "c13-013": [42.986, 47.141]}, "blocks": [{"t": "p", "s": [["c13-001", "奥兹说：“我也想回到家乡去，我们一起坐热气球走吧，多萝西。”"]]}, {"t": "img", "src": "images/49.webp?v=593fd423f7", "vid": "images/49.mp4?v=bcb0fbfb9d", "cap": "缝一个大大的热气球", "n": 49}, {"t": "p", "s": [["c13-002", "他和多萝西用绿色的绸布，缝成了一个大大的热气球。"], ["c13-003", "出发的那天，全城的人都来送行。"]]}, {"t": "img", "src": "images/50.webp?v=a4ea6e404a", "vid": "images/50.mp4?v=c0b8bf8b5c", "cap": "托托追着小猫跑开了", "n": 50}, {"t": "p", "s": [["c13-004", "奥兹先坐进了篮子里。"], ["c13-005", "可是就在这时，托托追着一只小猫跑开了。"], ["c13-006", "多萝西赶紧去追托托。"]]}, {"t": "img", "src": "images/51.webp?v=e60ea745d5", "vid": "images/51.mp4?v=a2b3b77b8b", "cap": "热气球升上了天空", "n": 51}, {"t": "p", "s": [["c13-007", "等她抱着托托跑回来，绳子已经断了，热气球慢慢地升上了天空。"]]}, {"t": "p", "s": [["c13-008", "“回来！"], ["c13-009", "我也要走！”"], ["c13-010", "多萝西大喊。"]]}, {"t": "p", "s": [["c13-011", "“我回不来啦，再见！”"], ["c13-012", "奥兹在天上喊。"], ["c13-013", "热气球越飞越高，越飞越远，再也看不见了。"]]}]}, {"title": "第十四章　南方的好女巫", "head": "c14-h", "audio": "audio/ch14.m4a?v=2f8db8ff3e", "duration": 66.576, "times": {"c14-h": [0.0, 2.834], "c14-001": [3.834, 5.737], "c14-002": [6.087, 12.022], "c14-003": [12.872, 16.729], "c14-004": [17.079, 22.951], "c14-005": [23.801, 28.656], "c14-006": [29.006, 34.093], "c14-007": [34.443, 37.381], "c14-008": [38.231, 39.043], "c14-009": [39.393, 41.731], "c14-010": [42.581, 44.705], "c14-011": [45.555, 55.205], "c14-012": [56.055, 65.076]}, "blocks": [{"t": "img", "src": "images/52.webp?v=780cf10c1e", "vid": "images/52.mp4?v=669dd12343", "cap": "多萝西伤心地哭了", "n": 52}, {"t": "p", "s": [["c14-001", "多萝西伤心地哭了。"], ["c14-002", "翡翠城的士兵告诉她：“去找南方的好女巫格林达吧，她也许能帮你回家。”"]]}, {"t": "img", "src": "images/53.webp?v=774a63fa2a", "vid": "images/53.mp4?v=ce3be0d5c9", "cap": "又走了很远很远的路", "n": 53}, {"t": "p", "s": [["c14-003", "朋友们陪着多萝西，又走了很远很远的路。"], ["c14-004", "他们穿过会打人的大树林，翻过小山，终于来到了格林达的城堡。"]]}, {"t": "img", "src": "images/54.webp?v=de03d657e4", "vid": "images/54.mp4?v=c7adbf9e72", "cap": "南方的好女巫格林达", "n": 54}, {"t": "p", "s": [["c14-005", "格林达是一位红头发的美丽女巫，穿着雪白的长裙。"], ["c14-006", "她温柔地说：“孩子，其实，你一直都有回家的办法。"], ["c14-007", "你脚上的银鞋子，能把你带到任何地方。”"]]}, {"t": "p", "s": [["c14-008", "“真的吗？”"], ["c14-009", "多萝西又惊又喜。"]]}, {"t": "p", "s": [["c14-010", "稻草人说：“要是早知道就好了。”"]]}, {"t": "p", "s": [["c14-011", "格林达笑着说：“可是，如果早知道了，稻草人就不会得到他的脑子，铁皮人就不会得到他的心，狮子也不会得到他的勇气。”"]]}, {"t": "img", "src": "images/55.webp?v=3fadf33b86", "vid": "images/55.mp4?v=4107df347a", "cap": "三个好朋友都当上了国王", "n": 55}, {"t": "p", "s": [["c14-012", "后来，稻草人当上了翡翠城的国王，铁皮人成了西方国家的国王，狮子做了森林里所有动物的大王。"]]}]}, {"title": "第十五章　回家", "head": "c15-h", "audio": "audio/ch15.m4a?v=61de7a0cca", "duration": 188.498, "times": {"c15-h": [0.0, 2.108], "c15-001": [3.108, 5.841], "c15-002": [6.191, 12.704], "c15-003": [13.554, 21.706], "c15-004": [25.317, 30.803], "c15-005": [31.653, 36.121], "c15-006": [36.471, 40.906], "c15-007": [41.256, 45.125], "c15-008": [45.975, 52.0], "c15-009": [52.85, 56.973], "c15-010": [57.323, 58.889], "c15-011": [59.739, 63.354], "c15-012": [63.704, 66.823], "c15-013": [67.673, 68.758], "song-home": [69.958, 75.958], "song-home-01": [75.958, 80.028], "song-home-02": [81.328, 86.028], "song-home-03": [87.088, 91.448], "song-home-04": [91.448, 96.128], "song-home-05": [98.268, 102.988], "song-home-06": [104.538, 108.728], "song-home-07": [110.198, 114.408], "song-home-08": [114.408, 120.528], "song-home-09": [122.348, 128.588], "song-home-10": [128.588, 133.608], "song-home-11": [133.608, 139.658], "song-home-12": [140.148, 144.568], "song-home-13": [149.358, 153.008], "song-home-14": [154.828, 158.348], "song-home-15": [159.708, 165.768], "song-home-16": [165.768, 170.828], "song-home-17": [170.828, 176.878], "song-home-18": [176.988, 181.648]}, "blocks": [{"t": "img", "src": "images/56.webp?v=a1c671e2c4", "vid": "images/56.mp4?v=0e7ad9a32e", "cap": "和朋友们一一拥抱告别", "n": 56}, {"t": "p", "s": [["c15-001", "多萝西和朋友们一一拥抱告别。"], ["c15-002", "稻草人、铁皮人和狮子都舍不得她，铁皮人的眼泪又差点儿让自己生了锈。"]]}, {"t": "img", "src": "images/57.webp?v=1e4cbfd6e4", "vid": "images/57.mp4?v=2378f65931", "cap": "鞋跟轻轻地碰了三下", "n": 57}, {"t": "p", "s": [["c15-003", "多萝西抱起托托，把两只鞋跟轻轻地碰了三下，说：“带我回家，回到艾姆婶婶身边去！”"]]}, {"t": "img", "src": "images/58.webp?v=c7fd60c8ce", "vid": "images/58.mp4?v=3b589a14ba", "cap": "她在空中飞了起来", "n": 58}, {"t": "p", "s": [["c15-004", "一眨眼，她就在空中飞了起来，耳边只听见呼呼的风声。"]]}, {"t": "img", "src": "images/59.webp?v=7ab033081f", "vid": "images/59.mp4?v=9e4e518a27", "cap": "亨利叔叔盖好了一座新房子", "n": 59}, {"t": "p", "s": [["c15-005", "等她站稳了，眼前又是一望无际的堪萨斯大草原。"], ["c15-006", "亨利叔叔已经盖好了一座新房子，正在挤牛奶。"], ["c15-007", "那双银鞋子在飞行的时候掉了，再也找不到了。"]]}, {"t": "img", "src": "images/60.webp?v=be0c66f4e4", "vid": "images/60.mp4?v=08189c01ef", "cap": "我回家了，我真高兴", "n": 60}, {"t": "p", "s": [["c15-008", "艾姆婶婶正在给白菜浇水，一抬头，看见多萝西朝她跑了过来。"]]}, {"t": "p", "s": [["c15-009", "艾姆婶婶紧紧地抱住她，说：“我的好孩子！"], ["c15-010", "你到底去哪里了？”"]]}, {"t": "p", "s": [["c15-011", "多萝西说：“我去了奥兹国，托托也去了。"], ["c15-012", "艾姆婶婶，我回家了，我真高兴！”"]]}, {"t": "p", "s": [["c15-013", "（完）"]]}, {"t": "song", "title": "哪里都不如家", "head": "song-home", "lines": [["song-home-01", "龙卷风吹走了小木屋"], ["song-home-02", "我落在彩色的远方"], ["song-home-03", "银鞋子踩着黄砖路"], ["song-home-04", "一路有朋友在身旁"], ["song-home-05", "稻草人其实很聪明"], ["song-home-06", "铁皮人的心最善良"], ["song-home-07", "狮子总是冲在前面"], ["song-home-08", "原来想要的早就有了"], ["song-home-09", "碰碰脚跟，一二三"], ["song-home-10", "带我回到家乡"], ["song-home-11", "灰色的草原，灰色的小屋"], ["song-home-12", "哪里都不如家"], ["song-home-13", "艾姆婶婶张开手"], ["song-home-14", "我回来啦"], ["song-home-15", "碰碰脚跟，一二三"], ["song-home-16", "带我回到家乡"], ["song-home-17", "灰色的草原，灰色的小屋"], ["song-home-18", "哪里都不如家"]]}, {"t": "note", "text": "读完以后，可以和孩子聊一聊：稻草人、铁皮人和狮子想要的东西，是奥兹给的，还是他们一路上本来就有的？如果你也去了奥兹国，你最想和谁做朋友？"}]}], "music": 3, "images": [{"from": "c01-h", "src": "images/01.webp?v=6c9ff8459a", "vid": "images/01.mp4?v=06ced0e78d", "cap": "灰色大草原上的小木屋", "n": 1}, {"from": "c01-005", "src": "images/02.webp?v=237904fdec", "vid": "images/02.mp4?v=fbfceb2   audio.currentTime = t;
  sync(true);
  if (autoplay) { try { await audio.play(); } catch (e) { toast('点击播放按钮开始朗读'); } }
}
const playLine = (L, autoplay = true) => playFrom(L.ch, L.start + 0.001, autoplay);

function lineAt(ci, t) {
  // 找本章里开始时间 ≤ t 的最后一句
  let best = null;
  for (const L of lines) {
    if (L.ch !== ci) { if (best) break; continue; }
    if (L.start <= t + 0.03) best = L; else break;
  }
  return best;
}

function setActive(L, force) {
  if (L === active && !force) return;
  if (active) active.el.classList.remove('on');
  active = L;
  if (!L) return;
  L.el.classList.add('on');
  const idx = lines.indexOf(L);
  lines.forEach((x, i) => x.el.classList.toggle('past', i < idx));
  const ch = BOOK.chapters[L.ch];
  $('#nowTitle').textContent = plIdx >= 0 ? `♪ ${plIdx + 1}/${songs.length} ${songs[plIdx].title}` : ch.title.replace('　', ' ');
  if (mode !== 'read') showStage(L.img);   // 阅读模式不用舞台，免得在后台加载动图
  setSubtitle(L);
  if (follow && mode !== 'picture' && (force || Date.now() - userScrollAt > 5000)) {
    const r = L.el.getBoundingClientRect();
    const vh = window.innerHeight;
    if (r.top < vh * 0.18 || r.bottom > vh * 0.62) {
      programmatic = Date.now();
      window.scrollBy({ top: r.top - vh * 0.32, behavior: 'smooth' });
    }
  }
}

function sync(force) {
  if (cur < 0) return;
  const t = audio.currentTime;
  const s = songs[plIdx];
  if (s && playing && cur === s.ch && t >= s.end - 0.05) return playSong(plIdx + 1);   // 这首唱完了，接下一首
  setActive(lineAt(cur, t), force);
  if (!seeking) $('#seek').value = t;
  $('#nowTime').textContent = `${buffering ? '加载中… ' : ''}${fmt(t)} / ${fmt(BOOK.chapters[cur].duration)}`;
  paintSeek();
}

// ---------- 弱网：显示下载进度、缓冲提示、预先加载下一章、出错重试 ----------
const SEEK_PLAYED = 'var(--sea)', SEEK_BUF = 'color-mix(in srgb, var(--sea) 50%, var(--line))';
let buffering = false, retry = null, prefetched = new Set();
function paintSeek() {
  const seek = $('#seek');
  const d = cur < 0 ? 0 : (audio.duration || BOOK.chapters[cur].duration);
  if (!d) { seek.style.setProperty('--seek-bg', 'var(--line)'); return; }
  const pc = x => (Math.min(1, Math.max(0, x / d)) * 100).toFixed(2) + '%';
  const p = pc(+seek.value), stops = [];
  for (let i = 0; i < audio.buffered.length; i++) {
    const a = pc(audio.buffered.start(i)), b = pc(audio.buffered.end(i));
    stops.push(`transparent ${a}`, `${SEEK_BUF} ${a}`, `${SEEK_BUF} ${b}`, `transparent ${b}`);
  }
  const buf = stops.length ? `linear-gradient(to right, ${stops.join(', ')}), ` : '';
  seek.style.setProperty('--seek-bg', `linear-gradient(to right, ${SEEK_PLAYED} ${p}, transparent ${p}), ${buf}var(--line)`);
}
function setBuffering(on) {
  if (buffering === on) return;
  buffering = on;
  document.body.classList.toggle('buffering', on);
  if (cur >= 0) sync(false);
}
audio.addEventListener('waiting', () => setBuffering(true));
['playing', 'canplay', 'pause'].forEach(ev => audio.addEventListener(ev, () => setBuffering(false)));
audio.addEventListener('progress', () => {
  paintSeek();
  // 这一章下载完了而且正在听：提前把下一章拉进浏览器缓存（地址带内容指纹、长期缓存），换章时不用再等
  const next = BOOK.chapters[cur + 1], b = audio.buffered, d = audio.duration;
  if (!playing || !next || prefetched.has(next.audio) || !b.length || !(b.end(b.length - 1) >= d - 0.5)) return;
  if (navigator.connection && navigator.connection.saveData) return;
  prefetched.add(next.audio);
  fetch(next.audio, { priority: 'low' }).then(r => r.blob()).catch(() => {});   // 只试一次，失败了到时照常边下边放
});
audio.addEventListener('error', () => {
  if (cur < 0) return;
  setBuffering(false);
  retry = { ch: cur, t: audio.currentTime };   // 再点播放时从断开的地方重新加载
  cur = -1;
  toast('网络不太好，音频没加载出来，点播放键重试');
});

let raf = 0;
function loop() { sync(false); raf = requestAnimationFrame(loop); }
audio.addEventListener('play', () => { playing = true; document.body.classList.add('playing'); story.classList.add('reading'); renderPlay(); cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause', () => { playing = false; document.body.classList.remove('playing'); renderPlay(); cancelAnimationFrame(raf); sync(false); savePos(); });
audio.addEventListener('ended', () => {
  if (plIdx >= 0) playSong(plIdx + 1);   // 插曲在章末：这章放完就是这首唱完了
  else if (cur < BOOK.chapters.length - 1) playFrom(cur + 1, 0);
  else { toast('故事讲完啦，晚安 🌙'); setActive(null); localStorage.removeItem(POS_KEY); }
});

function renderPlay() {
  $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $('#playBtn').setAttribute('aria-label', playing ? '暂停' : '播放');
}
renderPlay();

function toggle() {
  if (cur < 0) { const p = retry || readPos(); retry = null; return p ? playFrom(p.ch, p.t) : playFrom(0, 0); }
  playing ? audio.pause() : audio.play();
}
function step(d) {
  const i = active ? lines.indexOf(active) : -1;
  // 上一句：如果当前句已读了 1.5 秒以上，先回到本句开头
  if (d < 0 && active && audio.currentTime - active.start > 1.5) return playLine(active, playing || cur < 0);
  const L = lines[Math.min(lines.length - 1, Math.max(0, i + d))];
  if (L) playLine(L, true);
}
function chapterJump(d) {
  if (plIdx >= 0) return playSong(Math.min(songs.length - 1, plIdx + d));   // 欣赏插曲时，上一章 / 下一章换成上一首 / 下一首
  const ci = Math.min(BOOK.chapters.length - 1, Math.max(0, (cur < 0 ? 0 : cur) + d));
  playFrom(ci, 0);
}

// ---------- 交互 ----------
$('#playBtn').onclick = toggle;
$('#prevS').onclick = () => step(-1);
$('#nextS').onclick = () => step(1);
$('#prevCh').onclick = () => chapterJump(-1);
$('#nextCh').onclick = () => chapterJump(1);
$('#startBtn').onclick = () => { stopSongs(); playFrom(0, 0); };
$('#tocBtn').onclick = () => {
  if (mode === 'picture') setMode('read', true);   // 纯图模式没有目录，先回到阅读模式
  $('.toc').scrollIntoView({ behavior: 'smooth' });
};
story.addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) { stopSongs(); playLine(byId[el.dataset.id], true); userScrollAt = 0; return; }
  const pic = e.target.closest('figure .pic'), img = pic && pic.querySelector('img');
  if (img) { const lb = $('#lightbox'); lb.querySelector('img').src = img.src; lb.querySelector('p').textContent = img.alt; lb.classList.add('open'); }
});
$('#lightbox').onclick = () => $('#lightbox').classList.remove('open');
$('#toc').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ci = +b.dataset.ch;
  stopSongs(); playFrom(ci, 0);
  document.getElementById('ch' + (ci + 1)).scrollIntoView({ behavior: 'smooth' });
});
$('#speedBtn').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  $('#speedBtn').textContent = SPEEDS[speedIdx].toFixed(1) + '×';
};
$('#followBtn').onclick = () => {
  follow = !follow;
  $('#followBtn').setAttribute('aria-pressed', follow);
  toast(follow ? '跟读：自动翻到正在读的地方' : '跟读已关闭，可以自由翻看');
  if (follow && active) setActive(active, true);
};
// ---------- 显示模式：阅读 / 左图右文（宽屏才有）/ 纯图 ----------
const MODES = { read: '阅读', split: '左图右文', picture: '纯图' };
const wide = matchMedia('(min-width: 900px)');
let mode = 'read', stageIdx = -1, stageLayer = 0;
$('#stageVid').onplaying = () => $('#stageVid').classList.add('show');
function showStage(i, force) {
  if (i === stageIdx && !force) return;
  stageIdx = i;
  const im = imgs[i];
  const layers = document.querySelectorAll('#stage img');
  const next = layers[stageLayer ^= 1], prev = layers[stageLayer ^ 1];
  next.onload = () => { next.classList.add('show'); prev.classList.remove('show'); };
  next.src = im.src;
  if (imgs[i + 1]) new Image().src = imgs[i + 1].src;   // 顺手预载下一张，念到时直接换上
  next.alt = im.cap;
  // 动图短片盖在静态图上，开始播放再淡入；阅读模式看不见舞台，不播
  const v = $('#stageVid');
  v.classList.remove('show');
  if (anim && im.vid && mode !== 'read') { v.src = im.vid; v.play().catch(() => {}); }
  else if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
  $('#stageBg').style.backgroundImage = `url("${im.src}")`;
  $('#stageCap').textContent = `插图 ${im.n} · ${im.cap}`;
  $('#stageTop').textContent = BOOK.chapters[(active || {}).ch ?? im.ch].title.replace('　', ' ');
}
// 字幕换句时先淡出再换字，免得两句文字跳动
let subT = 0;
function setSubtitle(L) {
  const sub = $('#stageSub');
  const text = !L ? '' : L.el.tagName === 'H2' ? BOOK.chapters[L.ch].title.replace('　', ' ')
    : L.el.tagName === 'H3' ? '♪ ' + L.el.textContent : L.el.closest('.song') ? '♪ ' + L.el.textContent + ' ♪' : L.el.textContent;
  if (sub.dataset.text === text) return;
  sub.dataset.text = text;
  sub.classList.add('fade');
  clearTimeout(subT);
  subT = setTimeout(() => { sub.textContent = text; sub.classList.remove('fade'); }, 180);
}
function setMode(m, quiet) {
  if (m === 'split' && !wide.matches) m = 'read';
  mode = m;
  document.body.dataset.mode = m;
  $('#modeBtn').textContent = MODES[m];
  try { localStorage.setItem(PREF + 'mode', m); } catch (e) {}
  showStage(active ? active.img : Math.max(0, stageIdx), true);
  if (m !== 'picture' && active) setTimeout(() => setActive(active, true), 30);
  if (!quiet) toast('显示模式：' + MODES[m] + (m === 'picture' ? '（点画面播放 / 暂停）' : ''));
}
$('#modeBtn').onclick = () => {
  const order = wide.matches ? ['read', 'split', 'picture'] : ['read', 'picture'];
  setMode(order[(order.indexOf(mode) + 1) % order.length]);
};
wide.addEventListener('change', () => { if (mode === 'split' && !wide.matches) setMode('read', true); });
$('#stage').onclick = () => { if (mode === 'picture') toggle(); };
$('#stagePlay').onclick = e => { e.stopPropagation(); toggle(); };
// 舞台的底边贴着播放条
new ResizeObserver(() => document.documentElement.style.setProperty('--ph', $('#player').offsetHeight + 'px')).observe($('#player'));
try { setMode(localStorage.getItem(PREF + 'mode') || 'read', true); } catch (e) { setMode('read', true); }

function renderAnim() {
  $('#animBtn').setAttribute('aria-pressed', anim);
  document.querySelectorAll('figure video').forEach(v => {
    if (anim) { vio.unobserve(v); vio.observe(v); }   // 重新观察会立即回调一次，看得见的接着播
    else { v.pause(); v.classList.remove('on'); }
  });
  if (stageIdx >= 0) showStage(stageIdx, true);
}
$('#animBtn').onclick = () => {
  anim = !anim;
  try { localStorage.setItem(PREF + 'anim', anim ? 'on' : 'off'); } catch (e) {}
  renderAnim();
  toast(anim ? '插图：动图' : '插图：静态图');
};
renderAnim();
$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(PREF + 'theme', root.dataset.theme); } catch (e) {}
};
try { const th = localStorage.getItem(PREF + 'theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; if (cur < 0) return; audio.currentTime = +$('#seek').value; sync(true); });
$('#seek').addEventListener('change', () => { seeking = false; });
if (cur < 0) $('#seek').addEventListener('pointerdown', () => { if (cur < 0) loadChapter(0); }, { once: true });

// 用户自己滚动页面时，暂停自动跟读 5 秒
let programmatic = 0;
['wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => { userScrollAt = Date.now(); }, { passive: true }));
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Escape') $('#lightbox').classList.remove('open');
});

// ---------- 记住上次听到哪里 ----------
function savePos() { if (cur < 0) return; try { localStorage.setItem(POS_KEY, JSON.stringify({ ch: cur, t: audio.currentTime, id: active && active.id })); } catch (e) {} }
function readPos() { try { const p = JSON.parse(localStorage.getItem(POS_KEY)); return p && p.ch >= 0 && p.ch < BOOK.chapters.length ? p : null; } catch (e) { return null; } }
setInterval(() => { if (playing) savePos(); }, 3000);
const last = readPos();
if (last && (last.ch > 0 || last.t > 5)) {
  const rb = $('#resumeBtn');
  rb.hidden = false;
  rb.textContent = `继续听 · ${BOOK.chapters[last.ch].title.split('　')[0]} ${fmt(last.t)}`;
  rb.onclick = () => {
    stopSongs();
    const L = last.id && byId[last.id];
    L ? playLine(L) : playFrom(last.ch, last.t);
    if (L) setTimeout(() => setActive(L, true), 50);
  };
}
$('#nowTitle').textContent = '点击任意一句，就从那里开始听';

// ---------- 锁屏 / 耳机控制 ----------
function updateMedia() {
  if (!('mediaSession' in navigator) || cur < 0) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: plIdx >= 0 ? songs[plIdx].title : BOOK.chapters[cur].title.replace('　', ' '), artist: BOOK.voice, album: BOOK.title,
    artwork: [{ src: BOOK.cover, sizes: '1152x768', type: 'image/webp' }]
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => chapterJump(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => chapterJump(1));
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
</script>
</body>
</html>
