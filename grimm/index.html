<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 24px; }
.versions a, .versions span { font-size: 13px; padding: 5px 14px; border-radius: 999px; color: #fff; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, .5); background: rgba(8, 25, 40, .3); }
.versions a:hover { background: rgba(8, 25, 40, .55); }
.versions[hidden] { display: none; }
.versions .on { background: #fff; color: #123f55; border-color: #fff; font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }
/* 书末的「欣赏插曲」：全书插曲的播放列表 */
.songlist { margin: 40px 0 0; padding: 24px 18px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.songlist h3 { margin: 0 0 4px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 24px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; }
.songlist .sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
.btn-song { background: var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.songlist ol { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px; text-align: left; counter-reset: song; }
.songlist li button { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  text-align: left; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.songlist li button::before { counter-increment: song; content: counter(song); grid-row: span 2; color: var(--sea); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.songlist li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.songlist li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.songlist .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 进度条：深色是已播放，浅色是已经下载好的部分（--seek-bg 由 paintSeek() 按 audio.buffered 算），网络慢时一眼看出还要等多久 */
.seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 8px 0 6px; height: 18px;
  background: transparent; cursor: pointer; --seek-bg: var(--line); }
.seek::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border: 0;
  border-radius: 50%; background: var(--sea); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--sea);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
/* 缓冲中：播放键外圈转圈 */
.play { position: relative; }
.play::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent;
  border-top-color: var(--sea); border-right-color: var(--sea); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.buffering .play::after { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="versions" id="versions" hidden></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>
<div class="toast" id="toast"></div>

<script>
const BOOK = {"id": "grimm", "title": "格林童话精选", "intro": "从《格林童话》里选了七个故事改写：汉赛尔与格莱特、白雪公主、青蛙王子、小红帽、十二个猎人、不莱梅的音乐家、幸运的汉斯。适合 5 到 10 岁的小朋友和爸爸妈妈一起读、一起听。", "kicker": "格林童话", "cover": "images/07.webp?v=947abd2632", "voice": "Elias（会讲故事的老师），本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "汉赛尔与格莱特　白色的小石子", "head": "c01-h", "audio": "audio/ch01.m4a?v=2d14a17986", "duration": 90.249, "times": {"c01-h": [0.0, 5.834], "c01-001": [6.834, 12.51], "c01-002": [12.86, 17.704], "c01-003": [18.554, 22.255], "c01-004": [22.605, 30.925], "c01-005": [31.275, 34.063], "c01-006": [34.913, 38.923], "c01-007": [39.773, 43.894], "c01-008": [44.244, 46.526], "c01-009": [47.376, 51.683], "c01-010": [52.533, 56.046], "c01-011": [56.396, 61.83], "c01-012": [62.18, 65.022], "c01-013": [65.872, 68.358], "c01-014": [68.708, 73.929], "c01-015": [74.779, 78.912], "c01-016": [79.262, 88.749]}, "blocks": [{"t": "img", "src": "images/01.webp?v=fd8c8f76b7", "vid": "images/01.mp4?v=f26d752143", "cap": "森林边的小木屋", "n": 1}, {"t": "p", "s": [["c01-001", "从前，在一片大森林的边上，住着一个穷苦的樵夫。"], ["c01-002", "他有两个孩子，哥哥叫汉赛尔，妹妹叫格莱特。"]]}, {"t": "p", "s": [["c01-003", "那一年闹饥荒，家里连面包都快吃完了。"], ["c01-004", "孩子们的继母对樵夫说：“明天一早，把两个孩子带到森林最深的地方去，让他们自己找路吧。"], ["c01-005", "不然，我们四个人都要饿死了。”"]]}, {"t": "p", "s": [["c01-006", "樵夫心里难过极了，可是他拗不过继母。"]]}, {"t": "img", "src": "images/02.webp?v=9d307ff2e9", "vid": "images/02.mp4?v=a6d34f6187", "cap": "偷听大人说话", "n": 2}, {"t": "p", "s": [["c01-007", "这些话，全被饿得睡不着的两个孩子听见了。"], ["c01-008", "格莱特伤心地哭了起来。"]]}, {"t": "p", "s": [["c01-009", "汉赛尔小声说：“别哭，格莱特，我有办法。”"]]}, {"t": "img", "src": "images/03.webp?v=01950457e9", "vid": "images/03.mp4?v=9c8647e821", "cap": "月光下的白石子", "n": 3}, {"t": "p", "s": [["c01-010", "等大人睡着了，汉赛尔悄悄溜到门外。"], ["c01-011", "月光下，门前的小白石子闪闪发亮，像一枚枚银币。"], ["c01-012", "他弯下腰，把口袋装得满满的。"]]}, {"t": "p", "s": [["c01-013", "第二天，一家人走进森林。"], ["c01-014", "汉赛尔走几步，就回头看一看，偷偷丢下一颗白石子。"]]}, {"t": "img", "src": "images/04.webp?v=be754194f5", "vid": "images/04.mp4?v=e7d4db7005", "cap": "跟着石子回家", "n": 4}, {"t": "p", "s": [["c01-015", "到了森林深处，大人们生了一堆火，就走了。"], ["c01-016", "天黑以后，月亮升起来，汉赛尔拉着妹妹的手，跟着月光下一闪一闪的白石子，一直走回了家。"]]}]}, {"title": "汉赛尔与格莱特　森林里的糖果屋", "head": "c02-h", "audio": "audio/ch02.m4a?v=20005fda92", "duration": 86.121, "times": {"c02-h": [0.0, 4.475], "c02-001": [5.475, 8.038], "c02-002": [8.388, 14.277], "c02-003": [15.127, 22.366], "c02-004": [23.216, 30.133], "c02-005": [30.983, 35.842], "c02-006": [36.192, 42.42], "c02-007": [46.342, 50.761], "c02-008": [51.111, 57.771], "c02-009": [58.621, 64.222], "c02-010": [68.249, 71.59], "c02-011": [71.94, 73.654], "c02-012": [74.504, 78.591], "c02-013": [78.941, 84.621]}, "blocks": [{"t": "p", "s": [["c02-001", "没过多久，家里又没有吃的了。"], ["c02-002", "这一次，继母把门锁上了，汉赛尔没办法出去捡石子。"]]}, {"t": "img", "src": "images/05.webp?v=5edb982f43", "vid": "images/05.mp4?v=7be5f6cc72", "cap": "撒面包屑", "n": 5}, {"t": "p", "s": [["c02-003", "第二天进森林的时候，汉赛尔只好把自己的那块面包掰成碎屑，一路撒在地上。"]]}, {"t": "p", "s": [["c02-004", "可是天黑以后，他们一点儿面包屑也找不到了，原来全被森林里的小鸟吃掉了。"]]}, {"t": "img", "src": "images/06.webp?v=75408d1fb3", "vid": "images/06.mp4?v=f7670bf7d0", "cap": "雪白的小鸟带路", "n": 6}, {"t": "p", "s": [["c02-005", "兄妹俩在森林里走了整整三天，又累又饿。"], ["c02-006", "忽然，一只雪白的小鸟在树枝上唱歌，好像在给他们带路。"]]}, {"t": "img", "src": "images/07.webp?v=947abd2632", "vid": "images/07.mp4?v=05ded84eed", "cap": "糖果屋", "n": 7}, {"t": "p", "s": [["c02-007", "他们跟着小鸟走啊走，来到了一座小房子跟前。"], ["c02-008", "哇，这座房子是用面包做的，屋顶是蛋糕，窗户是透明的冰糖！"]]}, {"t": "img", "src": "images/08.webp?v=ebf0fb70c4", "vid": "images/08.mp4?v=2ab3a8a38f", "cap": "啃小房子", "n": 8}, {"t": "p", "s": [["c02-009", "汉赛尔掰下一块屋顶，格莱特啃起了窗户，吃得香极了。"]]}, {"t": "p", "s": [["c02-010", "“咔嚓，咔嚓，是谁在啃我的小房子？”"], ["c02-011", "屋里传来一个声音。"]]}, {"t": "img", "src": "images/09.webp?v=c25183311b", "vid": "images/09.mp4?v=ca0679714c", "cap": "老婆婆开门", "n": 9}, {"t": "p", "s": [["c02-012", "门开了，一个拄着拐杖的老婆婆走了出来。"], ["c02-013", "她笑眯眯地说：“哎哟，可爱的孩子们，快进来吧，我给你们做好吃的！”"]]}]}, {"title": "汉赛尔与格莱特　聪明的格莱特", "head": "c03-h", "audio": "audio/ch03.m4a?v=5cfccbef16", "duration": 99.34, "times": {"c03-h": [0.0, 3.396], "c03-001": [4.396, 9.196], "c03-002": [9.546, 14.411], "c03-003": [15.261, 25.502], "c03-004": [26.352, 31.581], "c03-005": [31.931, 36.394], "c03-006": [36.744, 40.413], "c03-007": [41.263, 48.305], "c03-008": [49.155, 54.636], "c03-009": [55.486, 59.547], "c03-010": [59.897, 62.448], "c03-011": [63.298, 70.327], "c03-012": [74.377, 77.749], "c03-013": [78.099, 85.598], "c03-014": [86.448, 88.156], "c03-015": [88.506, 91.628], "c03-016": [91.978, 97.84]}, "blocks": [{"t": "p", "s": [["c03-001", "其实，那个老婆婆是一个坏心眼的老巫婆。"], ["c03-002", "她的眼睛红红的，看不远，可是鼻子特别灵。"]]}, {"t": "img", "src": "images/10.webp?v=f04494d74e", "vid": "images/10.mp4?v=3aeee737cb", "cap": "关进笼子", "n": 10}, {"t": "p", "s": [["c03-003", "第二天，老巫婆把汉赛尔关进了一个小笼子里，对格莱特说：“快去做饭，把你哥哥喂得胖胖的，等他长胖了，我就把他吃掉！”"]]}, {"t": "img", "src": "images/11.webp?v=7f95e97161", "vid": "images/11.mp4?v=1e4131e8bc", "cap": "伸出小骨头", "n": 11}, {"t": "p", "s": [["c03-004", "每天早上，老巫婆都叫汉赛尔伸出手指，摸摸他胖了没有。"], ["c03-005", "聪明的汉赛尔每次都伸出一根细细的小骨头。"], ["c03-006", "老巫婆眼睛看不清，还以为他一直那么瘦。"]]}, {"t": "p", "s": [["c03-007", "过了四个星期，老巫婆等不及了：“格莱特，去看看炉子烧热了没有，你爬进去瞧瞧！”"]]}, {"t": "p", "s": [["c03-008", "格莱特知道老巫婆不怀好意，就说：“我不知道怎么进去呀。”"]]}, {"t": "p", "s": [["c03-009", "老巫婆自己把头伸进了炉子，说：“笨丫头！"], ["c03-010", "这么大的炉口，连我都钻得进去！”"]]}, {"t": "img", "src": "images/12.webp?v=a51243eb79", "vid": "images/12.mp4?v=cf9a394b04", "cap": "关上炉门", "n": 12}, {"t": "p", "s": [["c03-011", "格莱特使劲一推，老巫婆一头栽进了炉子里，格莱特赶紧关上了铁门。"]]}, {"t": "img", "src": "images/13.webp?v=ca514ee2ef", "vid": "images/13.mp4?v=3fa38ef38c", "cap": "珍珠和宝石", "n": 13}, {"t": "p", "s": [["c03-012", "她跑去打开笼子，把哥哥放了出来。"], ["c03-013", "兄妹俩在巫婆的屋子里，找到了好多亮闪闪的珍珠和宝石，装满了口袋。"]]}, {"t": "img", "src": "images/14.webp?v=4c78c853d5", "vid": "images/14.mp4?v=a2f46f5bf6", "cap": "回到爸爸身边", "n": 14}, {"t": "p", "s": [["c03-014", "他们找到了回家的路。"], ["c03-015", "爸爸一看见他们，高兴得哭了起来。"], ["c03-016", "那个狠心的继母已经离开了家，从此，一家三口再也不用挨饿了。"]]}]}, {"title": "白雪公主　魔镜啊魔镜", "head": "c04-h", "audio": "audio/ch04.m4a?v=2fba979900", "duration": 79.617, "times": {"c04-h": [0.0, 3.064], "c04-001": [4.064, 8.03], "c04-002": [8.38, 18.724], "c04-003": [19.574, 21.47], "c04-004": [21.82, 28.937], "c04-005": [29.787, 31.8], "c04-006": [32.15, 37.611], "c04-007": [38.461, 42.717], "c04-008": [43.567, 46.996], "c04-009": [47.346, 56.64], "c04-010": [57.49, 59.901], "c04-011": [60.251, 66.224], "c04-012": [67.074, 78.117]}, "blocks": [{"t": "img", "src": "images/15.webp?v=19c866ab41", "vid": "images/15.mp4?v=1fe8ddf09f", "cap": "雪一样白的小婴儿", "n": 15}, {"t": "p", "s": [["c04-001", "从前，有一位王后，生下了一个女孩。"], ["c04-002", "她的皮肤像雪一样白，嘴唇像血一样红，头发像乌木一样黑，大家都叫她白雪公主。"]]}, {"t": "p", "s": [["c04-003", "可是王后很快就去世了。"], ["c04-004", "国王又娶了一位新王后，她长得很美，却非常骄傲，最受不了别人比她漂亮。"]]}, {"t": "img", "src": "images/16.webp?v=899c78886b", "vid": "images/16.mp4?v=bc9e370a18", "cap": "魔镜啊魔镜", "n": 16}, {"t": "p", "s": [["c04-005", "新王后有一面魔镜。"], ["c04-006", "她每天都对着镜子问：“魔镜啊魔镜，谁是世界上最美丽的女人？”"]]}, {"t": "p", "s": [["c04-007", "魔镜总是回答：“王后，您是世界上最美丽的女人。”"]]}, {"t": "p", "s": [["c04-008", "白雪公主一天天长大，越长越美。"], ["c04-009", "有一天，王后又去问魔镜，魔镜说：“王后，您很美丽，可是白雪公主比您还要美丽一千倍。”"]]}, {"t": "img", "src": "images/17.webp?v=c57f9c5b68", "vid": "images/17.mp4?v=8fb623699f", "cap": "王后气坏了", "n": 17}, {"t": "p", "s": [["c04-010", "王后气得脸都发青了。"], ["c04-011", "她叫来一个猎人，命令他把白雪公主带到森林里，再也不许她回来。"]]}, {"t": "img", "src": "images/18.webp?v=3bf3587aab", "vid": "images/18.mp4?v=be7d560c51", "cap": "快跑吧", "n": 18}, {"t": "p", "s": [["c04-012", "猎人把白雪公主带进森林，可是看着她那么善良可爱，心一软，就对她说：“快跑吧，可怜的孩子，千万别回王宫去了！”"]]}]}, {"title": "白雪公主　七个小矮人", "head": "c05-h", "audio": "audio/ch05.m4a?v=a9568196f5", "duration": 64.059, "times": {"c05-h": [0.0, 3.085], "c05-001": [4.085, 10.831], "c05-002": [11.681, 21.496], "c05-003": [22.346, 31.161], "c05-004": [32.011, 34.445], "c05-005": [34.795, 39.118], "c05-006": [39.968, 41.216], "c05-007": [42.066, 43.325], "c05-008": [44.175, 50.967], "c05-009": [51.817, 55.23], "c05-010": [55.58, 59.904], "c05-011": [60.254, 62.559]}, "blocks": [{"t": "img", "src": "images/19.webp?v=ad60fb76de", "vid": "images/19.mp4?v=867f05144a", "cap": "森林里的小房子", "n": 19}, {"t": "p", "s": [["c05-001", "白雪公主一个人在森林里跑啊跑，天快黑的时候，她看见了一座小房子。"]]}, {"t": "img", "src": "images/20.webp?v=e32ffe3cc7", "vid": "images/20.mp4?v=857546da54", "cap": "七个小盘子", "n": 20}, {"t": "p", "s": [["c05-002", "屋子里的东西都小小的：一张小桌子上摆着七个小盘子、七把小勺子、七个小杯子，墙边还有七张小床。"]]}, {"t": "p", "s": [["c05-003", "白雪公主又饿又累，每个盘子里吃了一点儿，每个杯子里喝了一口，然后躺在第七张小床上睡着了。"]]}, {"t": "p", "s": [["c05-004", "天黑了，屋子的主人回来了。"], ["c05-005", "原来，这里住着七个在山里挖矿的小矮人。"]]}, {"t": "p", "s": [["c05-006", "“是谁坐过我的小椅子？”"]]}, {"t": "p", "s": [["c05-007", "“是谁用过我的小勺子？”"]]}, {"t": "img", "src": "images/21.webp?v=3890167715", "vid": "images/21.mp4?v=4477b231c6", "cap": "小矮人回来了", "n": 21}, {"t": "p", "s": [["c05-008", "他们看见床上睡着一个美丽的姑娘，都轻手轻脚的，谁也舍不得叫醒她。"]]}, {"t": "img", "src": "images/22.webp?v=14ac37d719", "vid": "images/22.mp4?v=4bbe713956", "cap": "住了下来", "n": 22}, {"t": "p", "s": [["c05-009", "第二天，白雪公主把自己的事讲给他们听。"], ["c05-010", "小矮人们说：“你就住在这里吧，帮我们做饭、收拾屋子。"], ["c05-011", "不过，千万别给陌生人开门！”"]]}]}, {"title": "白雪公主　毒苹果", "head": "c06-h", "audio": "audio/ch06.m4a?v=942b9dc4ac", "duration": 102.082, "times": {"c06-h": [0.0, 2.2], "c06-001": [3.2, 12.89], "c06-002": [13.74, 16.819], "c06-003": [17.169, 24.063], "c06-004": [24.413, 29.691], "c06-005": [30.541, 34.467], "c06-006": [35.317, 36.335], "c06-007": [36.685, 37.996], "c06-008": [38.846, 45.788], "c06-009": [46.138, 52.812], "c06-010": [55.008, 58.637], "c06-011": [58.987, 66.869], "c06-012": [67.719, 73.229], "c06-013": [73.579, 83.466], "c06-014": [84.316, 88.553], "c06-015": [89.403, 90.364], "c06-016": [90.714, 92.085], "c06-017": [92.435, 95.214], "c06-018": [95.564, 100.582]}, "blocks": [{"t": "p", "s": [["c06-001", "王后又去问魔镜，魔镜说：“在七座山的那一边，七个小矮人的家里，白雪公主还是比您美丽一千倍。”"]]}, {"t": "img", "src": "images/23.webp?v=651228aea9", "vid": "images/23.mp4?v=f8e32de676", "cap": "卖苹果的老婆婆", "n": 23}, {"t": "p", "s": [["c06-002", "王后知道猎人骗了她，气坏了。"], ["c06-003", "她做了一个毒苹果，一半是白的，一半是红的，红的那一半有毒。"], ["c06-004", "然后，她扮成一个卖苹果的老婆婆，来到小矮人的家门口。"]]}, {"t": "p", "s": [["c06-005", "“好孩子，尝尝我的苹果吧，可甜啦！”"]]}, {"t": "p", "s": [["c06-006", "“我不能开门。”"], ["c06-007", "白雪公主说。"]]}, {"t": "img", "src": "images/24.webp?v=3ff0c24c51", "vid": "images/24.mp4?v=142d947a0f", "cap": "咬了一口", "n": 24}, {"t": "p", "s": [["c06-008", "王后把苹果切成两半，自己吃了白的那一半，把红的那一半递给她。"], ["c06-009", "白雪公主看着红红的苹果，忍不住接了过来，刚咬一口，就倒在了地上。"]]}, {"t": "img", "src": "images/25.webp?v=c886357f14", "vid": "images/25.mp4?v=b4fbc5b4f4", "cap": "水晶棺材", "n": 25}, {"t": "p", "s": [["c06-010", "小矮人们回来，难过得哭了三天三夜。"], ["c06-011", "他们做了一口透明的水晶棺材，把白雪公主放在里面，放在山顶上，轮流守着她。"]]}, {"t": "img", "src": "images/26.webp?v=64559d6abb", "vid": "images/26.mp4?v=b32566f44e", "cap": "王子来了", "n": 26}, {"t": "p", "s": [["c06-012", "有一天，一位王子骑着马经过，一眼就喜欢上了白雪公主。"], ["c06-013", "小矮人们抬起棺材，想让王子把她带走，一不小心绊了一下，那块毒苹果从白雪公主的喉咙里跳了出来。"]]}, {"t": "img", "src": "images/27.webp?v=88413f53e8", "vid": "images/27.mp4?v=c4a0f0aec0", "cap": "醒过来了", "n": 27}, {"t": "p", "s": [["c06-014", "白雪公主睁开眼睛，坐了起来：“我这是在哪儿呀？”"]]}, {"t": "img", "src": "images/28.webp?v=1c42dc7234", "vid": "images/28.mp4?v=e6d771cb51", "cap": "盛大的婚礼", "n": 28}, {"t": "p", "s": [["c06-015", "“你和我在一起。”"], ["c06-016", "王子高兴地说。"], ["c06-017", "后来，他们举行了盛大的婚礼。"], ["c06-018", "那个坏王后又羞又气，从此再也没有人见过她。"]]}]}, {"title": "青蛙王子　掉进井里的金球", "head": "c07-h", "audio": "audio/ch07.m4a?v=82b53f1d2a", "duration": 93.189, "times": {"c07-h": [0.0, 3.407], "c07-001": [4.407, 13.454], "c07-002": [14.304, 17.988], "c07-003": [18.338, 26.241], "c07-004": [27.091, 33.079], "c07-005": [36.52, 38.659], "c07-006": [39.509, 41.809], "c07-007": [42.159, 43.144], "c07-008": [43.994, 50.396], "c07-009": [51.246, 53.345], "c07-010": [53.695, 54.523], "c07-011": [55.373, 65.698], "c07-012": [66.548, 69.248], "c07-013": [69.598, 74.626], "c07-014": [75.476, 78.711], "c07-015": [79.061, 83.05], "c07-016": [83.9, 85.534], "c07-017": [85.884, 90.321]}, "blocks": [{"t": "p", "s": [["c07-001", "从前，有一位国王，他最小的女儿美丽极了，连见多识广的太阳照在她脸上，都会觉得惊奇。"]]}, {"t": "img", "src": "images/29.webp?v=614c5f2349", "vid": "images/29.mp4?v=021f09d830", "cap": "井边的金球", "n": 29}, {"t": "p", "s": [["c07-002", "小公主最喜欢的玩具，是一个金球。"], ["c07-003", "天热的时候，她就到森林里的老水井边，把金球抛起来、接住，玩个不停。"]]}, {"t": "img", "src": "images/30.webp?v=5f11c62521", "vid": "images/30.mp4?v=dae2eef2a9", "cap": "金球掉进井里", "n": 30}, {"t": "p", "s": [["c07-004", "有一天，她没有接住，金球“扑通”一声掉进了深深的井里。"], ["c07-005", "小公主伤心地哭了起来。"]]}, {"t": "p", "s": [["c07-006", "“公主，你为什么哭得这么伤心？”"], ["c07-007", "一个声音问。"]]}, {"t": "img", "src": "images/31.webp?v=ce9c4639fb", "vid": "images/31.mp4?v=dfef9078b0", "cap": "井里的青蛙", "n": 31}, {"t": "p", "s": [["c07-008", "她回头一看，原来是一只青蛙，从水里伸出又大又丑的脑袋。"]]}, {"t": "p", "s": [["c07-009", "“我的金球掉进井里了。”"], ["c07-010", "公主说。"]]}, {"t": "p", "s": [["c07-011", "青蛙说：“我能帮你捞上来，可是你要答应我：让我做你的朋友，和你在一张小桌子上吃饭，用你的小金盘子，晚上睡在你的小床边。”"]]}, {"t": "p", "s": [["c07-012", "“好，好，我都答应你！”"], ["c07-013", "公主心里想，一只青蛙，怎么能做人的朋友呢？"]]}, {"t": "img", "src": "images/32.webp?v=8d0eee4d83", "vid": "images/32.mp4?v=b42858004f", "cap": "叼来金球", "n": 32}, {"t": "p", "s": [["c07-014", "青蛙钻进水里，把金球叼了上来。"], ["c07-015", "公主一把抢过金球，头也不回地跑回了王宫。"]]}, {"t": "p", "s": [["c07-016", "“等等我，带上我呀！”"], ["c07-017", "青蛙在后面呱呱地叫，可是公主早就跑远了。"]]}]}, {"title": "青蛙王子　说话要算数", "head": "c08-h", "audio": "audio/ch08.m4a?v=321c8a18c3", "duration": 104.28, "times": {"c08-h": [0.0, 2.299], "c08-001": [3.299, 14.886], "c08-002": [17.98, 23.786], "c08-003": [24.636, 29.623], "c08-004": [30.473, 34.135], "c08-005": [34.485, 35.177], "c08-006": [36.027, 38.216], "c08-007": [38.566, 47.09], "c08-008": [47.94, 51.903], "c08-009": [52.253, 54.376], "c08-010": [54.726, 63.069], "c08-011": [63.919, 72.277], "c08-012": [73.127, 77.971], "c08-013": [78.321, 81.918], "c08-014": [82.268, 89.395], "c08-015": [90.245, 95.748], "c08-016": [96.852, 102.78]}, "blocks": [{"t": "img", "src": "images/33.webp?v=cd3fce9667", "vid": "images/33.mp4?v=ae50b65008", "cap": "青蛙敲门", "n": 33}, {"t": "p", "s": [["c08-001", "第二天，公主正和国王一起吃饭，就听见“啪嗒、啪嗒”，有什么东西爬上了大理石台阶，接着有人敲门：“公主，公主，快给我开门！”"]]}, {"t": "p", "s": [["c08-002", "公主打开门一看，是那只青蛙，吓得赶紧把门关上了。"]]}, {"t": "p", "s": [["c08-003", "国王问她怎么了，公主只好把井边的事说了出来。"]]}, {"t": "p", "s": [["c08-004", "国王说：“答应过别人的事，就一定要做到。"], ["c08-005", "快去开门。”"]]}, {"t": "img", "src": "images/34.webp?v=79d9329117", "vid": "images/34.mp4?v=740eb300a1", "cap": "青蛙上桌", "n": 34}, {"t": "p", "s": [["c08-006", "公主只好让青蛙进来。"], ["c08-007", "青蛙跳上桌子，用她的小金盘子吃饭，吃得津津有味，可是公主一口也吃不下去。"]]}, {"t": "img", "src": "images/35.webp?v=996774a36e", "vid": "images/35.mp4?v=a7bef00826", "cap": "变成了王子", "n": 35}, {"t": "p", "s": [["c08-008", "晚上，公主把青蛙放在床边的小枕头上。"], ["c08-009", "第一天这样，第二天也这样。"], ["c08-010", "到了第三天早上，公主醒来一看，枕头上的青蛙不见了，床边站着一位英俊的王子。"]]}, {"t": "p", "s": [["c08-011", "原来，王子被一个坏巫婆施了魔法，变成了青蛙，只有公主让他做朋友，魔法才会解除。"]]}, {"t": "p", "s": [["c08-012", "第二天，一辆八匹白马拉的马车来接王子回国。"], ["c08-013", "赶车的是王子忠心的仆人亨利。"], ["c08-014", "王子变成青蛙以后，他难过得心都要碎了，只好在胸口箍上三道铁箍。"]]}, {"t": "img", "src": "images/36.webp?v=38cfaa8ef3", "vid": "images/36.mp4?v=437b1e79b2", "cap": "铁箍崩断了", "n": 36}, {"t": "p", "s": [["c08-015", "马车走在路上，只听见“咔嚓、咔嚓、咔嚓”三声响。"], ["c08-016", "那是亨利胸口上的三道铁箍，因为太高兴，一道一道地崩断了。"]]}]}, {"title": "小红帽　森林里的大灰狼", "head": "c09-h", "audio": "audio/ch09.m4a?v=306c632831", "duration": 75.072, "times": {"c09-h": [0.0, 3.002], "c09-001": [4.002, 8.458], "c09-002": [8.808, 14.992], "c09-003": [15.842, 22.422], "c09-004": [22.772, 26.619], "c09-005": [27.469, 28.504], "c09-006": [28.854, 29.843], "c09-007": [30.693, 32.408], "c09-008": [32.758, 36.877], "c09-009": [37.227, 40.757], "c09-010": [41.607, 46.485], "c09-011": [47.335, 50.957], "c09-012": [51.807, 60.71], "c09-013": [61.56, 65.842], "c09-014": [66.192, 69.659], "c09-015": [70.509, 73.572]}, "blocks": [{"t": "img", "src": "images/37.webp?v=998bfec88c", "vid": "images/37.mp4?v=684a97b270", "cap": "小红帽", "n": 37}, {"t": "p", "s": [["c09-001", "从前，有一个可爱的小姑娘，谁见了都喜欢。"], ["c09-002", "外婆送给她一顶红色的小帽子，她天天戴着，大家就叫她小红帽。"]]}, {"t": "img", "src": "images/38.webp?v=d1f992254c", "vid": "images/38.mp4?v=5774434da6", "cap": "妈妈的叮嘱", "n": 38}, {"t": "p", "s": [["c09-003", "有一天，妈妈说：“小红帽，外婆生病了，你把这块蛋糕和这瓶果汁给外婆送去。"], ["c09-004", "路上要好好走，别离开大路，也别和陌生人说话。”"]]}, {"t": "p", "s": [["c09-005", "“我一定记住。”"], ["c09-006", "小红帽说。"]]}, {"t": "img", "src": "images/39.webp?v=c0c7c794c9", "vid": "images/39.mp4?v=ad2f8bc78c", "cap": "遇见大灰狼", "n": 39}, {"t": "p", "s": [["c09-007", "外婆住在森林里。"], ["c09-008", "小红帽刚走进森林，就遇见了一只大灰狼。"], ["c09-009", "她不知道狼有多坏，一点儿也不害怕。"]]}, {"t": "p", "s": [["c09-010", "大灰狼说：“你好，小红帽，这么早要到哪里去呀？”"]]}, {"t": "p", "s": [["c09-011", "“去外婆家，外婆住在三棵大橡树下面。”"]]}, {"t": "p", "s": [["c09-012", "大灰狼眼珠一转，说：“你看，周围的花儿多漂亮，你怎么不摘一些带给外婆呢？”"]]}, {"t": "img", "src": "images/40.webp?v=0e62dd60c8", "vid": "images/40.mp4?v=94df3df4a5", "cap": "林子里摘花", "n": 40}, {"t": "p", "s": [["c09-013", "小红帽一看，可不是吗，到处都开满了花。"], ["c09-014", "她离开大路，跑进林子里摘花去了。"]]}, {"t": "p", "s": [["c09-015", "大灰狼却一溜烟跑到了外婆家。"]]}]}, {"title": "小红帽　外婆的大嘴巴", "head": "c10-h", "audio": "audio/ch10.m4a?v=e7b696e57b", "duration": 106.997, "times": {"c10-h": [0.0, 2.742], "c10-001": [3.742, 11.686], "c10-002": [12.536, 15.059], "c10-003": [15.409, 16.547], "c10-004": [17.397, 21.206], "c10-005": [21.556, 28.919], "c10-006": [29.769, 34.016], "c10-007": [34.366, 36.857], "c10-008": [37.707, 40.404], "c10-009": [41.254, 43.714], "c10-010": [44.564, 47.219], "c10-011": [48.069, 50.251], "c10-012": [51.101, 54.085], "c10-013": [54.935, 56.944], "c10-014": [57.794, 61.629], "c10-015": [61.979, 66.302], "c10-016": [70.533, 75.078], "c10-017": [75.428, 77.579], "c10-018": [77.929, 81.739], "c10-019": [82.089, 84.971], "c10-020": [85.82, 89.999], "c10-021": [90.349, 98.909], "c10-022": [99.759, 104.016], "c10-023": [104.366, 105.497]}, "blocks": [{"t": "p", "s": [["c10-001", "大灰狼敲敲门，学着小红帽的声音说：“外婆，我是小红帽，给您送蛋糕来了。”"]]}, {"t": "p", "s": [["c10-002", "“门没锁，自己进来吧。”"], ["c10-003", "外婆说。"]]}, {"t": "img", "src": "images/41.webp?v=5f38063efe", "vid": "images/41.mp4?v=9bcdacc8f1", "cap": "假扮外婆", "n": 41}, {"t": "p", "s": [["c10-004", "大灰狼冲进屋子，一口把外婆吞了下去。"], ["c10-005", "然后，它穿上外婆的衣服，戴上外婆的睡帽，躺在床上，拉上了床帘。"]]}, {"t": "p", "s": [["c10-006", "小红帽摘了一大把花，才想起外婆来。"], ["c10-007", "她走进屋子，觉得怪怪的。"]]}, {"t": "p", "s": [["c10-008", "“外婆，您的耳朵怎么这么大呀？”"]]}, {"t": "p", "s": [["c10-009", "“为了更好地听你说话呀。”"]]}, {"t": "p", "s": [["c10-010", "“外婆，您的眼睛怎么这么大呀？”"]]}, {"t": "p", "s": [["c10-011", "“为了更好地看着你呀。”"]]}, {"t": "img", "src": "images/42.webp?v=a89c1429cc", "vid": "images/42.mp4?v=b0f5bdb7dd", "cap": "您的嘴巴怎么这么大", "n": 42}, {"t": "p", "s": [["c10-012", "“外婆，您的嘴巴怎么这么大呀？”"]]}, {"t": "p", "s": [["c10-013", "“为了一口把你吃掉！”"]]}, {"t": "p", "s": [["c10-014", "大灰狼从床上跳起来，把小红帽也吞了下去。"], ["c10-015", "吃饱以后，它躺在床上，呼噜呼噜地睡着了。"]]}, {"t": "img", "src": "images/43.webp?v=5ad3b9e6b7", "vid": "images/43.mp4?v=c9846ac049", "cap": "猎人来了", "n": 43}, {"t": "img", "src": "images/44.webp?v=b520d52cad", "vid": "images/44.mp4?v=af8913c0cf", "cap": "救出来了", "n": 44}, {"t": "p", "s": [["c10-016", "一个猎人正好路过，心想：“老婆婆怎么打这么响的呼噜？”"], ["c10-017", "他进屋一看，是大灰狼！"], ["c10-018", "他赶紧拿出剪刀，剪开了大灰狼的肚子。"], ["c10-019", "小红帽和外婆一下子跳了出来。"]]}, {"t": "p", "s": [["c10-020", "小红帽搬来几块大石头，塞进了狼的肚子里。"], ["c10-021", "大灰狼醒来想逃，可是肚子里的石头太重了，它一下子摔倒在地上，再也爬不起来了。"]]}, {"t": "img", "src": "images/45.webp?v=5d97dcf641", "vid": "images/45.mp4?v=3b5685ad3a", "cap": "一起吃蛋糕", "n": 45}, {"t": "p", "s": [["c10-022", "“以后，我再也不离开大路，一个人跑进森林里了。”"], ["c10-023", "小红帽说。"]]}]}, {"title": "十二个猎人　十二个一模一样的猎人", "head": "c11-h", "audio": "audio/ch11.m4a?v=0b1f368dae", "duration": 76.102, "times": {"c11-h": [0.0, 3.936], "c11-001": [4.936, 11.98], "c11-002": [12.83, 20.436], "c11-003": [20.786, 25.35], "c11-004": [26.2, 30.797], "c11-005": [31.147, 33.086], "c11-006": [33.936, 43.078], "c11-007": [43.928, 47.485], "c11-008": [48.335, 51.695], "c11-009": [52.045, 57.989], "c11-010": [58.839, 62.96], "c11-011": [63.31, 68.723], "c11-012": [69.073, 72.053], "c11-013": [72.903, 73.388], "c11-014": [73.738, 74.602]}, "blocks": [{"t": "img", "src": "images/46.webp?v=5aa82409fb", "vid": "images/46.mp4?v=3072abe9f0", "cap": "金戒指", "n": 46}, {"t": "p", "s": [["c11-001", "从前，有一位王子，他和一位美丽的姑娘订了婚，送给她一枚金戒指。"]]}, {"t": "p", "s": [["c11-002", "有一天，王子的父亲病得很重，对他说：“孩子，我想让你娶邻国的公主。”"], ["c11-003", "王子很伤心，可是为了让父亲安心，他还是答应了。"]]}, {"t": "p", "s": [["c11-004", "那位姑娘听说王子要娶别人，难过得吃不下饭。"], ["c11-005", "后来，她想出了一个办法。"]]}, {"t": "img", "src": "images/47.webp?v=f5556b32cd", "vid": "images/47.mp4?v=824353c076", "cap": "十二个猎人", "n": 47}, {"t": "p", "s": [["c11-006", "她找来十一个和自己长得一模一样的姑娘，十二个人都穿上猎人的衣服，骑着马来到王宫。"]]}, {"t": "p", "s": [["c11-007", "她说：“我们是十二个猎人，想为国王效劳。”"]]}, {"t": "img", "src": "images/48.webp?v=c08ee13638", "vid": "images/48.mp4?v=7f8bcf8da2", "cap": "国王收留猎人", "n": 48}, {"t": "p", "s": [["c11-008", "这时候，王子已经当上了国王。"], ["c11-009", "他没有认出她来，看见这十二个猎人长得那么英俊，就把他们都留了下来。"]]}, {"t": "img", "src": "images/49.webp?v=6674c8e4ea", "vid": "images/49.mp4?v=522cd8666e", "cap": "狮子的秘密", "n": 49}, {"t": "p", "s": [["c11-010", "国王有一头神奇的狮子，什么秘密都知道。"], ["c11-011", "一天晚上，狮子对国王说：“您以为那是十二个猎人吗？"], ["c11-012", "她们其实是十二个姑娘。”"]]}, {"t": "p", "s": [["c11-013", "“我不信。”"], ["c11-014", "国王说。"]]}]}, {"title": "十二个猎人　狮子的考验", "head": "c12-h", "audio": "audio/ch12.m4a?v=9f0449b96a", "duration": 112.954, "times": {"c12-h": [0.0, 3.624], "c12-001": [4.624, 10.093], "c12-002": [10.443, 19.757], "c12-003": [20.607, 25.9], "c12-004": [26.25, 35.507], "c12-005": [36.357, 40.519], "c12-006": [40.869, 45.89], "c12-007": [46.74, 49.736], "c12-008": [50.086, 54.057], "c12-009": [54.907, 58.782], "c12-010": [59.632, 62.993], "c12-011": [67.087, 70.839], "c12-012": [71.689, 76.264], "c12-013": [76.614, 84.893], "c12-014": [85.743, 90.272], "c12-015": [90.622, 96.061], "c12-016": [96.911, 100.754], "c12-017": [101.104, 104.287], "c12-018": [104.637, 111.454]}, "blocks": [{"t": "p", "s": [["c12-001", "狮子说：“那就试一试吧，在屋里的地上撒满豌豆。"], ["c12-002", "男人走路脚步很重，踩在豌豆上也不会滑；姑娘走路轻轻的，会踩得豌豆骨碌碌乱滚。”"]]}, {"t": "img", "src": "images/50.webp?v=3a4ba3fbd9", "vid": "images/50.mp4?v=fb20760252", "cap": "踩豌豆", "n": 50}, {"t": "p", "s": [["c12-003", "国王有一个好心的仆人，偷偷把这件事告诉了猎人们。"], ["c12-004", "于是，十二个姑娘走进屋子的时候，都重重地踩在豌豆上，稳稳当当，一颗豌豆也没有滚动。"]]}, {"t": "p", "s": [["c12-005", "狮子又说：“在前厅里放十二架纺车。"], ["c12-006", "姑娘们看见纺车，一定会高高兴兴地围上去看。”"]]}, {"t": "p", "s": [["c12-007", "好心的仆人又悄悄告诉了她们。"], ["c12-008", "十二个姑娘走过纺车，连看都没看一眼。"]]}, {"t": "p", "s": [["c12-009", "从那以后，国王再也不相信狮子的话了。"]]}, {"t": "p", "s": [["c12-010", "有一天，国王带着十二个猎人去打猎。"], ["c12-011", "忽然有人来报信：新娘的马车快到了！"]]}, {"t": "img", "src": "images/51.webp?v=dbfafd0531", "vid": "images/51.mp4?v=0e5e232411", "cap": "晕倒的猎人", "n": 51}, {"t": "p", "s": [["c12-012", "第一个猎人听见了，心里一痛，一下子晕倒在地上。"], ["c12-013", "国王跑过去，想帮他脱下手套，却看见他手上戴着的，正是自己送出去的那枚金戒指。"]]}, {"t": "p", "s": [["c12-014", "国王仔细一看，原来是他真正喜欢的那位姑娘！"], ["c12-015", "他高兴极了，说：“你是我的，我也是你的，谁也不能把我们分开。”"]]}, {"t": "img", "src": "images/52.webp?v=91d8b0b6ae", "vid": "images/52.mp4?v=799eaaba98", "cap": "真正的婚礼", "n": 52}, {"t": "p", "s": [["c12-016", "邻国的公主知道了这件事，就带着嫁妆回国去了。"], ["c12-017", "国王和他心爱的姑娘举行了婚礼。"], ["c12-018", "那头狮子呢，又成了国王最信任的狮子，因为它说的，本来就是真话。"]]}]}, {"title": "不莱梅的音乐家　去不莱梅当音乐家", "head": "c13-h", "audio": "audio/ch13.m4a?v=bd73bb6235", "duration": 141.907, "times": {"c13-h": [0.0, 3.685], "c13-001": [4.685, 9.932], "c13-002": [10.282, 15.05], "c13-003": [15.9, 18.591], "c13-004": [18.941, 23.311], "c13-005": [24.161, 28.955], "c13-006": [29.805, 31.413], "c13-007": [32.263, 36.211], "c13-008": [36.561, 37.289], "c13-009": [38.139, 41.53], "c13-010": [41.88, 43.37], "c13-011": [44.22, 45.879], "c13-012": [46.229, 50.494], "c13-013": [50.844, 56.182], "c13-014": [57.032, 59.927], "c13-015": [60.777, 68.055], "c13-016": [71.577, 74.703], "c13-017": [75.553, 78.342], "c13-018": [78.692, 82.511], "c13-019": [83.361, 89.917], "song-bremen-song": [91.117, 97.117], "song-bremen-song-01": [97.117, 99.177], "song-bremen-song-02": [99.177, 101.297], "song-bremen-song-03": [101.297, 103.377], "song-bremen-song-04": [103.377, 105.577], "song-bremen-song-05": [105.697, 107.697], "song-bremen-song-06": [107.697, 109.777], "song-bremen-song-07": [109.777, 111.877], "song-bremen-song-08": [111.957, 135.057]}, "blocks": [{"t": "p", "s": [["c13-001", "从前，有一头老驴子，给主人驮了很多年的麦子。"], ["c13-002", "现在它老了，驮不动了，主人就不想再喂它。"]]}, {"t": "img", "src": "images/53.webp?v=09ee8035be", "vid": "images/53.mp4?v=6e5a230d44", "cap": "老驴子出发", "n": 53}, {"t": "p", "s": [["c13-003", "老驴子心想：“我可不能在这里等着。"], ["c13-004", "我的嗓门这么大，不如去不莱梅城当个音乐家吧！”"]]}, {"t": "img", "src": "images/54.webp?v=2b93fc08af", "vid": "images/54.mp4?v=dd6f24dd08", "cap": "遇见老猎狗", "n": 54}, {"t": "p", "s": [["c13-005", "走着走着，它看见一只老猎狗趴在路边，喘着粗气。"]]}, {"t": "p", "s": [["c13-006", "“你怎么啦，老猎狗？”"]]}, {"t": "p", "s": [["c13-007", "“唉，我老了，跑不动了，主人不要我了。”"], ["c13-008", "猎狗说。"]]}, {"t": "p", "s": [["c13-009", "驴子说：“跟我一起去不莱梅当音乐家吧！"], ["c13-010", "我弹琴，你打鼓。”"]]}, {"t": "img", "src": "images/55.webp?v=576812a2fa", "vid": "images/55.mp4?v=016afe6dc7", "cap": "愁眉苦脸的老猫", "n": 55}, {"t": "p", "s": [["c13-011", "猎狗高兴地答应了。"], ["c13-012", "没走多远，它们又遇见了一只愁眉苦脸的老猫。"], ["c13-013", "老猫的牙齿钝了，抓不到老鼠，女主人也不要它了。"]]}, {"t": "p", "s": [["c13-014", "“跟我们一起去吧，你最会唱夜曲了！”"]]}, {"t": "img", "src": "images/56.webp?v=a22cda9d56", "vid": "images/56.mp4?v=c9ab15886f", "cap": "门上的大公鸡", "n": 56}, {"t": "p", "s": [["c13-015", "接着，它们又走过一个农家院子，一只大公鸡站在门上，扯着嗓子大叫。"], ["c13-016", "原来，主人明天要把它炖成汤了。"]]}, {"t": "p", "s": [["c13-017", "驴子说：“红脑袋，跟我们走吧！"], ["c13-018", "你的嗓子这么好，和我们一起唱，一定好听极了！”"]]}, {"t": "img", "src": "images/57.webp?v=c53b737bc7", "vid": "images/57.mp4?v=245bfcd5a6", "cap": "四个音乐家上路", "n": 57}, {"t": "p", "s": [["c13-019", "于是，驴子、猎狗、老猫和公鸡，一起向不莱梅出发了。"]]}, {"t": "song", "title": "我们去不莱梅", "head": "song-bremen-song", "lines": [["song-bremen-song-01", "老驴子，老猎狗"], ["song-bremen-song-02", "老猫公鸡跟着走"], ["song-bremen-song-03", "年纪大了没关系"], ["song-bremen-song-04", "一起唱歌手拉手"], ["song-bremen-song-05", "去不莱梅，去不莱梅"], ["song-bremen-song-06", "我们要当音乐家"], ["song-bremen-song-07", "你弹琴来我打鼓"], ["song-bremen-song-08", "唱得大家笑哈哈"]]}]}, {"title": "不莱梅的音乐家　强盗的房子", "head": "c14-h", "audio": "audio/ch14.m4a?v=dc58a52a04", "duration": 85.343, "times": {"c14-h": [0.0, 3.141], "c14-001": [4.141, 6.823], "c14-002": [7.173, 11.84], "c14-003": [12.69, 19.56], "c14-004": [20.41, 24.666], "c14-005": [25.016, 28.399], "c14-006": [29.249, 30.483], "c14-007": [30.833, 31.691], "c14-008": [32.541, 40.679], "c14-009": [41.529, 43.292], "c14-010": [43.642, 52.413], "c14-011": [53.263, 64.205], "c14-012": [68.606, 75.155], "c14-013": [78.369, 83.843]}, "blocks": [{"t": "p", "s": [["c14-001", "不莱梅太远了，一天走不到。"], ["c14-002", "天黑的时候，它们来到一片森林，准备在树下过夜。"]]}, {"t": "img", "src": "images/58.webp?v=0618a9789a", "vid": "images/58.mp4?v=b70edf94d9", "cap": "树顶上的公鸡", "n": 58}, {"t": "p", "s": [["c14-003", "公鸡飞到树顶上，四下一望，看见远处有一点亮光：“那边有一座房子！”"]]}, {"t": "p", "s": [["c14-004", "它们朝亮光走去，来到了一座亮着灯的房子。"], ["c14-005", "驴子个子最高，凑到窗前往里看。"]]}, {"t": "p", "s": [["c14-006", "“你看见什么了？”"], ["c14-007", "公鸡问。"]]}, {"t": "img", "src": "images/59.webp?v=ca5935e28c", "vid": "images/59.mp4?v=950a859122", "cap": "偷看强盗", "n": 59}, {"t": "p", "s": [["c14-008", "驴子说：“我看见一张桌子，上面摆满了好吃的，还有几个强盗，正坐在那里大吃大喝呢。”"]]}, {"t": "img", "src": "images/60.webp?v=b4139af2c4", "vid": "images/60.mp4?v=3f1e288fc6", "cap": "叠成一座塔", "n": 60}, {"t": "p", "s": [["c14-009", "它们商量好了一个办法。"], ["c14-010", "驴子把前脚搭在窗台上，猎狗跳到驴子背上，老猫爬到猎狗背上，公鸡飞到老猫的头上。"]]}, {"t": "p", "s": [["c14-011", "然后，它们一起唱起来：驴子嗯昂嗯昂地叫，猎狗汪汪地叫，老猫喵喵地叫，公鸡喔喔地叫。"], ["c14-012", "接着，它们一起冲破窗户，跳进了屋子，玻璃稀里哗啦地碎了一地。"]]}, {"t": "img", "src": "images/61.webp?v=2e78934346", "vid": "images/61.mp4?v=dcb0a5c09d", "cap": "强盗逃跑", "n": 61}, {"t": "p", "s": [["c14-013", "强盗们以为来了妖怪，吓得魂都飞了，一溜烟逃进了森林。"]]}]}, {"title": "不莱梅的音乐家　黑夜里的妖怪", "head": "c15-h", "audio": "audio/ch15.m4a?v=a0213682ff", "duration": 96.281, "times": {"c15-h": [0.0, 3.269], "c15-001": [4.269, 8.642], "c15-002": [8.992, 24.171], "c15-003": [25.021, 30.271], "c15-004": [31.121, 32.63], "c15-005": [32.98, 39.365], "c15-006": [39.715, 41.856], "c15-007": [42.706, 46.434], "c15-008": [46.784, 51.591], "c15-009": [51.941, 57.359], "c15-010": [57.709, 62.318], "c15-011": [66.34, 71.29], "c15-012": [71.64, 83.885], "c15-013": [84.735, 88.42], "c15-014": [88.77, 94.781]}, "blocks": [{"t": "img", "src": "images/62.webp?v=fafda39680", "vid": "images/62.mp4?v=926d27ad64", "cap": "各自睡觉", "n": 62}, {"t": "p", "s": [["c15-001", "四个好朋友坐下来，把桌子上的东西吃了个精光。"], ["c15-002", "然后，它们熄了灯，各自找地方睡觉：驴子躺在院子里的草堆上，猎狗趴在门后，老猫蜷在暖暖的炉灰旁边，公鸡飞到了屋梁上。"]]}, {"t": "p", "s": [["c15-003", "半夜里，强盗头子派了一个强盗，回来看看屋子里怎么样了。"]]}, {"t": "img", "src": "images/63.webp?v=607ff1d323", "vid": "images/63.mp4?v=dd73a143c8", "cap": "黑暗里的亮眼睛", "n": 63}, {"t": "p", "s": [["c15-004", "屋子里黑乎乎的。"], ["c15-005", "强盗看见炉灰里有两点亮光，以为是火炭，就拿火柴凑过去点火。"], ["c15-006", "那其实是老猫的眼睛！"]]}, {"t": "img", "src": "images/64.webp?v=54d1a5654d", "vid": "images/64.mp4?v=aaed3e95e9", "cap": "打跑强盗", "n": 64}, {"t": "p", "s": [["c15-007", "老猫跳起来，朝他脸上狠狠地抓了一把。"], ["c15-008", "强盗吓得往后门跑，猎狗扑上来，咬了他的腿。"], ["c15-009", "他跑过院子，驴子又抬起后腿，狠狠地踢了他一脚。"], ["c15-010", "屋梁上的公鸡也醒了，大叫一声：“喔喔喔！”"]]}, {"t": "p", "s": [["c15-011", "强盗没命地跑回森林，对强盗头子说：“不得了啦！"], ["c15-012", "屋里有一个可怕的巫婆，用长指甲抓我的脸；门后有个人拿刀子扎我的腿；院子里有个黑怪物，用大木棒打我；屋顶上还有个法官在大喊：把这个坏蛋抓过来！”"]]}, {"t": "img", "src": "images/65.webp?v=f0a69cc74c", "vid": "images/65.mp4?v=c253e85290", "cap": "快乐的新家", "n": 65}, {"t": "p", "s": [["c15-013", "从那以后，强盗们再也不敢回那座房子了。"], ["c15-014", "四个音乐家觉得这里太舒服了，就住了下来，再也不想去不莱梅了。"]]}]}, {"title": "幸运的汉斯　一块大金子", "head": "c16-h", "audio": "audio/ch16.m4a?v=de92988a99", "duration": 73.8, "times": {"c16-h": [0.0, 3.257], "c16-001": [4.257, 6.886], "c16-002": [7.236, 9.771], "c16-003": [10.121, 15.117], "c16-004": [15.967, 20.827], "c16-005": [21.177, 23.917], "c16-006": [24.767, 27.12], "c16-007": [27.47, 29.522], "c16-008": [30.372, 34.984], "c16-009": [35.834, 37.582], "c16-010": [37.932, 41.845], "c16-011": [46.416, 49.103], "c16-012": [49.453, 51.703], "c16-013": [52.053, 56.21], "c16-014": [56.56, 59.281], "c16-015": [60.131, 69.092]}, "blocks": [{"t": "img", "src": "images/66.webp?v=499002cb60", "vid": "images/66.mp4?v=3bedd62411", "cap": "七年的工钱", "n": 66}, {"t": "p", "s": [["c16-001", "汉斯给主人干了七年活。"], ["c16-002", "七年过去了，他想回家看妈妈。"], ["c16-003", "主人给了他一块和他的脑袋一样大的金子，作为工钱。"]]}, {"t": "p", "s": [["c16-004", "汉斯扛着金子往家走，金子太重了，压得他满头大汗。"], ["c16-005", "这时，一个骑马的人跑了过来。"]]}, {"t": "p", "s": [["c16-006", "汉斯说：“骑马多舒服啊！"], ["c16-007", "不会累，也不会磨破鞋子。”"]]}, {"t": "img", "src": "images/67.webp?v=4bed9a776d", "vid": "images/67.mp4?v=8bb3c1d32a", "cap": "用金子换马", "n": 67}, {"t": "p", "s": [["c16-008", "骑马的人说：“那我们换一换吧，我的马给你，你的金子给我。”"]]}, {"t": "p", "s": [["c16-009", "汉斯高兴地答应了。"], ["c16-010", "可是马跑得太快，一下子就把他摔到了沟里。"]]}, {"t": "p", "s": [["c16-011", "一个牵着奶牛的农夫走过来。"], ["c16-012", "汉斯说：“我再也不骑马了。"], ["c16-013", "还是奶牛好，走得慢慢的，每天还能喝到新鲜的牛奶。”"], ["c16-014", "于是，他又用马换了奶牛。"]]}, {"t": "img", "src": "images/68.webp?v=2f1ed420d0", "vid": "images/68.mp4?v=067389a87c", "cap": "挤不出牛奶", "n": 68}, {"t": "p", "s": [["c16-015", "到了中午，汉斯又渴又累，想挤点牛奶喝，可是他怎么挤也挤不出来，还被奶牛踢了一脚。"]]}]}, {"title": "幸运的汉斯　最幸运的人", "head": "c17-h", "audio": "audio/ch17.m4a?v=d85cadb7af", "duration": 161.537, "times": {"c17-h": [0.0, 3.197], "c17-001": [4.197, 10.505], "c17-002": [11.355, 15.362], "c17-003": [15.712, 22.798], "c17-004": [23.648, 27.517], "c17-005": [28.367, 31.855], "c17-006": [32.205, 38.116], "c17-007": [38.466, 41.966], "c17-008": [42.816, 47.315], "c17-009": [48.165, 51.422], "c17-010": [51.772, 59.324], "c17-011": [63.065, 67.914], "c17-012": [68.264, 70.748], "c17-013": [71.098, 73.029], "c17-014": [73.879, 80.192], "c17-015": [81.042, 82.187], "song-grimm-tales": [83.387, 89.387], "song-grimm-tales-01": [89.387, 94.127], "song-grimm-tales-02": [94.127, 100.367], "song-grimm-tales-03": [100.367, 105.227], "song-grimm-tales-04": [105.227, 110.547], "song-grimm-tales-05": [110.867, 115.407], "song-grimm-tales-06": [115.407, 120.767], "song-grimm-tales-07": [120.767, 125.987], "song-grimm-tales-08": [126.587, 131.127], "song-grimm-tales-09": [134.427, 139.687], "song-grimm-tales-10": [139.687, 144.427], "song-grimm-tales-11": [144.427, 150.087], "song-grimm-tales-12": [150.087, 154.687]}, "blocks": [{"t": "img", "src": "images/69.webp?v=bb4bc8f26e", "vid": "images/69.mp4?v=d955c579bb", "cap": "换来小肥猪", "n": 69}, {"t": "p", "s": [["c17-001", "一个赶着小猪的屠夫走过来，汉斯就用奶牛换了一头小肥猪。"]]}, {"t": "p", "s": [["c17-002", "后来，他遇见了一个抱着大白鹅的年轻人。"], ["c17-003", "年轻人说：“这头猪是从村长家偷来的，村长正派人到处找呢，你要倒霉啦！”"]]}, {"t": "img", "src": "images/70.webp?v=fb60af1737", "vid": "images/70.mp4?v=ccf6375951", "cap": "大白鹅", "n": 70}, {"t": "p", "s": [["c17-004", "汉斯吓了一跳，赶紧用小猪换了大白鹅。"]]}, {"t": "p", "s": [["c17-005", "走到一个村子，他又遇见一个磨剪刀的人。"], ["c17-006", "磨剪刀的人说：“磨剪刀这一行，口袋里永远不会没钱。"], ["c17-007", "我把这块磨刀石给你，你把鹅给我吧！”"]]}, {"t": "img", "src": "images/71.webp?v=df8ea458f8", "vid": "images/71.mp4?v=d5309333a9", "cap": "沉甸甸的磨刀石", "n": 71}, {"t": "p", "s": [["c17-008", "汉斯又换了，扛着沉甸甸的磨刀石往前走。"]]}, {"t": "img", "src": "images/72.webp?v=f0d81dcbc8", "vid": "images/72.mp4?v=3dc3556e9b", "cap": "掉进了井里", "n": 72}, {"t": "p", "s": [["c17-009", "走到一口井边，汉斯想喝口水。"], ["c17-010", "他把磨刀石放在井沿上，一弯腰，不小心碰了一下，磨刀石“扑通”一声掉进了井里。"]]}, {"t": "p", "s": [["c17-011", "汉斯一点儿也不难过，反而高兴得跳了起来：“太好了！"], ["c17-012", "那块石头太重了，我正不想扛呢。"], ["c17-013", "我真是世界上最幸运的人！”"]]}, {"t": "img", "src": "images/73.webp?v=1166242862", "vid": "images/73.mp4?v=8c2adc7620", "cap": "回到妈妈身边", "n": 73}, {"t": "p", "s": [["c17-014", "他两手空空，心里轻松，一路蹦蹦跳跳，回到了妈妈的身边。"]]}, {"t": "p", "s": [["c17-015", "（完）"]]}, {"t": "song", "title": "格林童话陪着我", "head": "song-grimm-tales", "lines": [["song-grimm-tales-01", "白石子，亮晶晶"], ["song-grimm-tales-02", "糖果屋里格莱特真聪明"], ["song-grimm-tales-03", "魔镜啊魔镜，毒苹果"], ["song-grimm-tales-04", "水晶棺里的公主醒过来"], ["song-grimm-tales-05", "井边的青蛙呱呱唱"], ["song-grimm-tales-06", "小红帽记住走大路"], ["song-grimm-tales-07", "十二个猎人踩豌豆"], ["song-grimm-tales-08", "四个音乐家唱得响"], ["song-grimm-tales-09", "翻开书，故事真多"], ["song-grimm-tales-10", "善良的人会有好结果"], ["song-grimm-tales-11", "聪明勇敢，诚实快乐"], ["song-grimm-tales-12", "格林童话陪着我"]]}, {"t": "note", "text": "读完以后，可以和孩子聊一聊：这七个故事里，你最喜欢哪一个？汉斯用一块金子换来换去，最后什么也没有了，他为什么还说自己最幸运呢？"}]}], "music": 4, "images": [{"from": "c01-h", "src": "images/01.webp?v=fd8c8f76b7", "vid": "images/01.mp4?v=f26d752143", "cap": "森林边的小木屋", "n": 1}, {"from": "c01-007", "src": "images/02.webp?v const NUM = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>';
const $ = s => document.querySelector(s);
const fmt = t => { t = Math.max(0, t | 0); return String(t / 60 | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

// ---------- 渲染 ----------
const story = $('#story');
let anim = true;   // 插图用动图还是静态图
try { anim = localStorage.getItem(PREF + 'anim') !== 'off'; } catch (e) {}
const lines = [];          // 全书按顺序：{id, ch, start, end, el, img}
const imgs = BOOK.images;  // 全书插图（故事顺序）：{from, src, vid, cap, n}，from = 从哪一句开始显示；vid 是动图短片
// 正文里的动图：进入视野附近才加载、播放，离开就暂停（几十段短片同时播手机吃不消）
const vio = new IntersectionObserver(es => es.forEach(e => {

const byId = {};
document.title = BOOK.title + ' · 有声绘本';
$('#bookTitle').textContent = BOOK.title;

const total = BOOK.chapters.reduce((a, c) => a + c.duration, 0);

// 同一个故事的其他版本（精简版 / 完整版）

}
$('#meta').textContent = `${BOOK.chapters.length} 章 · ${nImg} 幅插画${nSong ? ` · ${nSong} 首插曲` : ''}${BOOK.music ? ` · ${BOOK.music} 首配乐` : ''} · 全长约 ${Math.round(total / 60)} 分钟 · 朗读：${BOOK.voice}`;

BOOK.chapters.forEach((ch, ci) => {
  const sec = document.createElement('section');
  sec.className = 'chapter'; sec.id = 'ch' + (ci + 1);
  const [no, ...rest] = ch.title.split('　');

  h.dataset.id = ch.head;
  sec.appendChild(h);

// 每幅插图从它的 from 那句开始显示，一直到下一幅开始
imgs.forEach(im => { im.ch = byId[im.from].ch; im.at = lines.indexOf(byId[im.from]); });
lines.forEach((L, k) => {

});
const endMark = document.createElement('div'); endMark.className = 'end-mark'; endMark.textContent = '— 全书完 —';
story.appendChild(endMark);

// ---------- 欣赏插曲：全书插曲排成播放列表，每首只放章节音频里歌的那一段，放完接着下一首 ----------
const songs = [];
BOOK.chapters.forEach((ch, ci) => ch.blocks.forEach(b => {
  if (b.t !== 'song') return;
  const i = lines.indexOf(byId[b.lines[b.lines.length - 1][0]]), next = lines[i + 1];
  songs.push({ title: b.title, ch: ci, start: byId[b.head].start, end: next && next.ch === ci ? next.start : ch.duration });
}));
let plIdx = -1;   // 正在放播放列表里的第几首，-1 是平常听书

  const box = document.createElement('section'); box.className = 'songlist'; box.id = 'songlist';
  const mins = Math.max(1, Math.round(songs.reduce((a, s) => a + s.end - s.start, 0) / 60));
  box.innerHTML = `<h3>♪ 本书插曲</h3><div class="sub">${songs.length} 首 · 约 ${mins} 分钟</div>
    <button class="btn btn-song" id="songAll">${ICON_PLAY}欣赏插曲</button><ol></ol>`;
  songs.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button data-song="${i}"><span></span><span class="dur">${BOOK.chapters[s.ch].title.split('　')[0]} · ${fmt(s.end - s.start)}</span></button>`;
    li.querySelector('span').textContent = s.title;

  });
  box.querySelector('#songAll').onclick = () => playSong(0);
  box.querySelector('ol').onclick = e => { const b = e.target.closest('button'); if (b) playSong(+b.dataset.song); };
  story.appendChild(box);
}
function renderSongs() {
  document.querySelectorAll('.songlist li button').forEach((b, i) => b.classList.toggle('now', i === plIdx));
}
function playSong(i) {
  if (i >= songs.length) { plIdx = -1; renderSongs(); audio.pause(); toast('插曲都放完啦'); return; }
  plIdx = Math.max(0, i); renderSongs();
  const s = songs[plIdx];
  playFrom(s.ch, s.start + 0.001).then(updateMedia);
  toast(`♪ 插曲 ${plIdx + 1}/${songs.length}：${s.title}`);
}
const stopSongs = () => { if (plIdx >= 0) { plIdx = -1; renderSongs(); } };

// ---------- 播放 ----------
const audio = new Audio();
audio.preload = 'auto';
let cur = -1, active = null, playing = false;
let follow = true, userScrollAt = 0, speedIdx = 1;
const SPEEDS = [0.8, 1, 1.2, 1.5];

function loadChapter(ci) {
  if (ci === cur) return Promise.resolve();
  cur = ci;
  audio.src = BOOK.chapters[ci].audio;
  setBuffering(true);   // 到能播放之前转圈（canplay / playing 时停）
  audio.playbackRate = SPEEDS[speedIdx];
  document.querySelectorAll('.toc button').forEach((b, i) => b.classList.toggle('now', i === ci));
  $('#seek').max = BOOK.chapters[ci].duration;
  updateMedia();
  return new Promise(res => audio.addEventListener('loadedmetadata', res, { once: true }));
}

async function playFrom(ci, t, autoplay = true) {
  await loadChapter(ci);
  audio.currentTime = t;
  sync(true);
  if (autoplay) { try { await audio.play(); } catch (e) { toast('点击播放按钮开始朗读'); } }
}
const playLine = (L, autoplay = true) => playFrom(L.ch, L.start + 0.001, autoplay);

function lineAt(ci, t) {
  // 找本章里开始时间 ≤ t 的最后一句
  let best = null;
  for (const L of lines) {
    if (L.ch !== ci) { if (best) break; continue; }
    if (L.start <= t + 0.03) best = L; else break;
  }
  return best;
}

function setActive(L, force) {
  if (L === active && !force) return;
  if (active) active.el.classList.remove('on');
  active = L;
  if (!L) return;
  L.el.classList.add('on');
  const idx = lines.indexOf(L);
  lines.forEach((x, i) => x.el.classList.toggle('past', i < idx));
  const ch = BOOK.chapters[L.ch];
  $('#nowTitle').textContent = plIdx >= 0 ? `♪ ${plIdx + 1}/${songs.length} ${songs[plIdx].title}` : ch.title.replace('　', ' ');
  if (mode !== 'read') showStage(L.img);   // 阅读模式不用舞台，免得在后台加载动图
  setSubtitle(L);
  if (follow && mode !== 'picture' && (force || Date.now() - userScrollAt > 5000)) {
    const r = L.el.getBoundingClientRect();
    const vh = window.innerHeight;
    if (r.top < vh * 0.18 || r.bottom > vh * 0.62) {
      programmatic = Date.now();
      window.scrollBy({ top: r.top - vh * 0.32, behavior: 'smooth' });
    }
  }
}

function sync(force) {
  if (cur < 0) return;
  const t = audio.currentTime;
  const s = songs[plIdx];
  if (s && playing && cur === s.ch && t >= s.end - 0.05) return playSong(plIdx + 1);   // 这首唱完了，接下一首
  setActive(lineAt(cur, t), force);
  if (!seeking) $('#seek').value = t;
  $('#nowTime').textContent = `${buffering ? '加载中… ' : ''}${fmt(t)} / ${fmt(BOOK.chapters[cur].duration)}`;
  paintSeek();
}

// ---------- 弱网：显示下载进度、缓冲提示、预先加载下一章、出错重试 ----------
const SEEK_PLAYED = 'var(--sea)', SEEK_BUF = 'color-mix(in srgb, var(--sea) 50%, var(--line))';
let buffering = false, retry = null, prefetched = new Set();
function paintSeek() {
  const seek = $('#seek');
  const d = cur < 0 ? 0 : (audio.duration || BOOK.chapters[cur].duration);
  if (!d) { seek.style.setProperty('--seek-bg', 'var(--line)'); return; }
  const pc = x => (Math.min(1, Math.max(0, x / d)) * 100).toFixed(2) + '%';
  const p = pc(+seek.value), stops = [];
  for (let i = 0; i < audio.buffered.length; i++) {
    const a = pc(audio.buffered.start(i)), b = pc(audio.buffered.end(i));
    stops.push(`transparent ${a}`, `${SEEK_BUF} ${a}`, `${SEEK_BUF} ${b}`, `transparent ${b}`);
  }
  const buf = stops.length ? `linear-gradient(to right, ${stops.join(', ')}), ` : '';
  seek.style.setProperty('--seek-bg', `linear-gradient(to right, ${SEEK_PLAYED} ${p}, transparent ${p}), ${buf}var(--line)`);
}
function setBuffering(on) {
  if (buffering === on) return;
  buffering = on;
  document.body.classList.toggle('buffering', on);
  if (cur >= 0) sync(false);
}
audio.addEventListener('waiting', () => setBuffering(true));
['playing', 'canplay', 'pause'].forEach(ev => audio.addEventListener(ev, () => setBuffering(false)));
audio.addEventListener('progress', () => {
  paintSeek();
  // 这一章下载完了而且正在听：提前把下一章拉进浏览器缓存（地址带内容指纹、长期缓存），换章时不用再等
  const next = BOOK.chapters[cur + 1], b = audio.buffered, d = audio.duration;
  if (!playing || !next || prefetched.has(next.audio) || !b.length || !(b.end(b.length - 1) >= d - 0.5)) return;
  if (navigator.connection && navigator.connection.saveData) return;
  prefetched.add(next.audio);
  fetch(next.audio, { priority: 'low' }).then(r => r.blob()).catch(() => {});   // 只试一次，失败了到时照常边下边放
});
audio.addEventListener('error', () => {
  if (cur < 0) return;
  setBuffering(false);
  retry = { ch: cur, t: audio.currentTime };   // 再点播放时从断开的地方重新加载
  cur = -1;
  toast('网络不太好，音频没加载出来，点播放键重试');
});

let raf = 0;
function loop() { sync(false); raf = requestAnimationFrame(loop); }
audio.addEventListener('play', () => { playing = true; document.body.classList.add('playing'); story.classList.add('reading'); renderPlay(); cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause', () => { playing = false; document.body.classList.remove('playing'); renderPlay(); cancelAnimationFrame(raf); sync(false); savePos(); });
audio.addEventListener('ended', () => {
  if (plIdx >= 0) playSong(plIdx + 1);   // 插曲在章末：这章放完就是这首唱完了
  else if (cur < BOOK.chapters.length - 1) playFrom(cur + 1, 0);
  else { toast('故事讲完啦，晚安 🌙'); setActive(null); localStorage.removeItem(POS_KEY); }
});

function renderPlay() {
  $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $('#playBtn').setAttribute('aria-label', playing ? '暂停' : '播放');
}
renderPlay();

function toggle() {
  if (cur < 0) { const p = retry || readPos(); retry = null; return p ? playFrom(p.ch, p.t) : playFrom(0, 0); }
  playing ? audio.pause() : audio.play();
}
function step(d) {
  const i = active ? lines.indexOf(active) : -1;
  // 上一句：如果当前句已读了 1.5 秒以上，先回到本句开头
  if (d < 0 && active && audio.currentTime - active.start > 1.5) return playLine(active, playing || cur < 0);
  const L = lines[Math.min(lines.length - 1, Math.max(0, i + d))];
  if (L) playLine(L, true);
}
function chapterJump(d) {
  if (plIdx >= 0) return playSong(Math.min(songs.length - 1, plIdx + d));   // 欣赏插曲时，上一章 / 下一章换成上一首 / 下一首
  const ci = Math.min(BOOK.chapters.length - 1, Math.max(0, (cur < 0 ? 0 : cur) + d));
  playFrom(ci, 0);
}

// ---------- 交互 ----------
$('#playBtn').onclick = toggle;
$('#prevS').onclick = () => step(-1);
$('#nextS').onclick = () => step(1);
$('#prevCh').onclick = () => chapterJump(-1);
$('#nextCh').onclick = () => chapterJump(1);
$('#startBtn').onclick = () => { stopSongs(); playFrom(0, 0); };
$('#tocBtn').onclick = () => {

// ---------- 显示模式：阅读 / 左图右文（宽屏才有）/ 纯图 ----------
const MODES = { read: '阅读', split: '左图右文', picture: '纯图' };
const wide = matchMedia('(min-width: 900px)');
let mode = 'read', stageIdx = -1, stageLayer = 0;
$('#stageVid').onplaying = () => $('#stageVid').classList.add('show');
function showStage(i, force) {

  $('#stageCap').textContent = `插图 ${im.n} · ${im.cap}`;

// 字幕换句时先淡出再换字，免得两句文字跳动
let subT = 0;

    : L.el.tagName === 'H3' ? '♪ ' + L.el.textContent : L.el.closest('.song') ? '♪ ' + L.el.textContent + ' ♪' : L.el.textContent;

function setMode(m, quiet) {

}
$('#modeBtn').onclick = () => {
  const order = wide.matches ? ['read', 'split', 'picture'] : ['read', 'picture'];
  setMode(order[(order.indexOf(mode) + 1) % order.length]);
};
wide.addEventListener('change', () => { if (mode === 'split' && !wide.matches) setMode('read', true); });
$('#stage').onclick = () => { if (mode === 'picture') toggle(); };
$('#stagePlay').onclick = e => { e.stopPropagation(); toggle(); };
// 舞台的底边贴着播放条
new ResizeObserver(() => document.documentElement.style.setProperty('--ph', $('#player').offsetHeight + 'px')).observe($('#player'));

function renderAnim() {
  $('#animBtn').setAttribute('aria-pressed', anim);
  document.querySelectorAll('figure video').forEach(v => {
    if (anim) { vio.unobserve(v); vio.observe(v); }   // 重新观察会立即回调一次，看得见的接着播

$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(PREF + 'theme', root.dataset.theme); } catch (e) {}
};

let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; if (cur < 0) return; audio.currentTime = +$('#seek').value; sync(true); });

// 用户自己滚动页面时，暂停自动跟读 5 秒
let programmatic = 0;
['wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => { userScrollAt = Date.now(); }, { passive: true }));

  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Escape') $('#lightbox').classList.remove('open');
});

// ---------- 记住上次听到哪里 ----------
function savePos() { if (cur < 0) return; try { localStorage.setItem(POS_KEY, JSON.stringify({ ch: cur, t: audio.currentTime, id: active && active.id })); } catch (e) {} }
function readPos() { try { const p = JSON.parse(localStorage.getItem(POS_KEY)); return p && p.ch >= 0 && p.ch < BOOK.chapters.length ? p : null; } catch (e) { return null; } }
setInterval(() => { if (playing) savePos(); }, 3000);
const last = readPos();
if (last && (last.ch > 0 || last.t > 5)) {
  const rb = $('#resumeBtn');
  rb.hidden = false;
  rb.textContent = `继续听 · ${BOOK.chapters[last.ch].title.split('　')[0]} ${fmt(last.t)}`;
  rb.onclick = () => {
    stopSongs();
    const L = last.id && byId[last.id];
    L ? playLine(L) : playFrom(last.ch, last.t);
    if (L) setTimeout(() => setActive(L, true), 50);
  };
}
$('#nowTitle').textContent = '点击任意一句，就从那里开始听';

// ---------- 锁屏 / 耳机控制 ----------
function updateMedia() {
  if (!('mediaSession' in navigator) || cur < 0) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: plIdx >= 0 ? songs[plIdx].title : BOOK.chapters[cur].title.replace('　', ' '), artist: BOOK.voice, album: BOOK.title,
    artwork: [{ src: BOOK.cover, sizes: '1152x768', type: 'image/webp' }]
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => chapterJump(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => chapterJump(1));
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
</script>
</body>
