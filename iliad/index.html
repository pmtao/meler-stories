<script>
const BOOK = {"id": "iliad", "title": "伊利亚特", "intro": "根据古希腊荷马的长诗《伊利亚特》改写成故事。原著是用诗歌写的，这里把它讲成一个完整的长故事：特洛伊战争打到第十年，英雄阿喀琉斯为什么生气，为什么又回到战场，以及这场战争最后留给人们的是什么。适合 6 到 12 岁的小朋友和爸爸妈妈一起读、一起听。", "kicker": "古希腊神话", "cover": "images/81.webp?v=a8fb6d51ff", "voice": "Arthur，本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "第一章　金苹果", "head": "c01-h", "audio": "audio/ch01.m4a?v=8bc36c1843", "duration": 459.137, "times": {"c01-h": [0.0, 3.351], "c01-001": [4.351, 10.114], "c01-002": [10.964, 14.694], "c01-003": [15.044, 21.453], "c01-004": [21.803, 28.59], "c01-005": [28.94, 37.149], "c01-006": [37.999, 42.864], "c01-007": [43.214, 52.387], "c01-008": [52.737, 65.423], "c01-009": [65.773, 72.504], "c01-010": [73.354, 80.625], "c01-011": [80.975, 89.769], "c01-012": [90.619, 94.059], "c01-013": [94.909, 97.415], "c01-014": [97.765, 100.306], "c01-015": [100.656, 106.039], "c01-016": [106.889, 112.06], "c01-017": [112.41, 122.73], "c01-018": [123.58, 128.311], "c01-019": [129.161, 134.646], "c01-020": [135.496, 141.128], "c01-021": [141.978, 149.176], "c01-022": [150.026, 158.147], "c01-023": [158.997, 167.647], "c01-024": [168.497, 172.964], "c01-025": [173.314, 176.79], "c01-026": [177.64, 180.083], "c01-027": [180.433, 187.685], "c01-028": [188.035, 192.86], "c01-029": [193.21, 200.095], "c01-030": [200.445, 203.96], "c01-031": [204.81, 208.022], "c01-032": [208.372, 211.622], "c01-033": [211.972, 218.077], "c01-034": [218.427, 222.123], "c01-035": [222.473, 225.571], "c01-036": [225.921, 229.663], "c01-037": [230.513, 235.099], "c01-038": [235.449, 242.381], "c01-039": [243.231, 246.04], "c01-040": [246.89, 256.205], "c01-041": [256.555, 266.578], "c01-042": [267.428, 272.977], "c01-043": [273.827, 280.974], "c01-044": [281.824, 290.417], "c01-045": [291.267, 293.498], "c01-046": [293.848, 297.217], "c01-047": [298.067, 300.434], "c01-048": [300.784, 307.409], "c01-049": [307.759, 309.942], "c01-050": [310.292, 315.793], "c01-051": [316.143, 326.645], "c01-052": [327.495, 335.911], "c01-053": [336.761, 340.575], "c01-054": [341.425, 347.872], "c01-055": [348.722, 350.567], "c01-056": [350.917, 365.397], "c01-057": [366.247, 373.334], "c01-058": [373.684, 378.968], "c01-059": [379.818, 383.394], "c01-060": [383.744, 389.255], "c01-061": [390.105, 398.651], "c01-062": [399.001, 403.308], "c01-063": [404.158, 409.421], "c01-064": [409.771, 414.972], "c01-065": [415.322, 420.887], "c01-066": [421.237, 424.928], "c01-067": [425.778, 431.627], "c01-068": [432.477, 440.322], "c01-069": [441.172, 450.455], "c01-070": [451.305, 457.637]}, "blocks": [{"t": "img", "src": "images/01.webp?v=3cca79a730", "vid": "images/01.mp4?v=5cb00df9b4", "cap": "奥林匹斯山的婚礼", "n": 1}, {"t": "p", "s": [["c01-001", "很久很久以前，在希腊的奥林匹斯山上，住着一群神仙。"]]}, {"t": "p", "s": [["c01-002", "有一年，山上要办一场盛大的婚礼。"], ["c01-003", "新郎是人间的国王珀琉斯，新娘是美丽的海洋女神忒提斯。"], ["c01-004", "众神都收到了请柬，穿上最漂亮的衣服，带着礼物，高高兴兴地赶来了。"], ["c01-005", "大厅里点着金灯，桌上摆满了蜜糖和葡萄，竖琴和笛子的声音飘得很远很远。"]]}, {"t": "p", "s": [["c01-006", "九位缪斯女神站在大厅中央轮流唱起了好听的歌。"], ["c01-007", "太阳神阿波罗拨动着金色的竖琴，琴弦一响，窗外的鸟儿就都停在窗台上歪着头听。"], ["c01-008", "天后赫拉穿着绣满孔雀羽毛的长裙，雅典娜把闪亮的头盔放在膝盖上海神波塞冬笑得连三叉戟都放到了一边。"], ["c01-009", "连脾气最大的战神阿瑞斯，也难得地端起了杯子，慢慢地喝着蜜酒。"]]}, {"t": "p", "s": [["c01-010", "新娘忒提斯坐在最里面长长的头发像海浪一样披在肩上脸颊红红的。"], ["c01-011", "她身边的珀琉斯国王，紧张得一会儿摸摸衣领，一会儿摸摸腰带，逗得旁边的客人偷偷地笑。"]]}, {"t": "p", "s": [["c01-012", "可是有一位女神，没有收到请柬。"]]}, {"t": "img", "src": "images/87.webp?v=f6a89e6821", "vid": "images/87.mp4?v=1d23bbcc77", "cap": "不请自来的女神", "n": 2}, {"t": "p", "s": [["c01-013", "她叫厄里斯，是不和女神。"], ["c01-014", "她走到哪里，哪里就会吵架。"], ["c01-015", "所以谁也不愿意请她，生怕好好的婚礼被她搅乱了。"]]}, {"t": "p", "s": [["c01-016", "厄里斯站在门外听着里面的笑声，心里又气又委屈。"], ["c01-017", "她想了想，从袍子里掏出一个金光闪闪的苹果，在上面刻了一行小字，然后一扬手，把苹果骨碌碌地滚进了大厅。"]]}, {"t": "img", "src": "images/02.webp?v=8ce4c3b338", "vid": "images/02.mp4?v=7c42632977", "cap": "金苹果", "n": 3}, {"t": "p", "s": [["c01-018", "苹果在地上转了几个圈，停在了三位女神的脚边。"]]}, {"t": "p", "s": [["c01-019", "人们弯腰一看，苹果上写着：“送给最美丽的女神。”"]]}, {"t": "p", "s": [["c01-020", "天后赫拉第一个伸出手，说：“这当然是我的，我是众神之后。”"]]}, {"t": "p", "s": [["c01-021", "她的指尖还没碰到苹果，雅典娜就把长矛伸了过来，轻轻地挡住了她的手。"]]}, {"t": "p", "s": [["c01-022", "智慧女神雅典娜把长矛往地上一顿，说：“不对，应该是我的，我又聪明又勇敢。”"]]}, {"t": "p", "s": [["c01-023", "爱与美的女神阿芙洛狄忒微微一笑，说：“你们都别争了，天下最美丽的女神，当然是我。”"]]}, {"t": "p", "s": [["c01-024", "三位女神谁也不肯让谁吵得整个大厅都安静了。"], ["c01-025", "她们跑去找众神之王宙斯，请他来评一评。"]]}, {"t": "p", "s": [["c01-026", "宙斯一听，头都大了。"], ["c01-027", "他摸着白胡子，想：不管我把苹果给谁另外两位都会生我的气。"], ["c01-028", "他眼珠一转，说：“这件事，我可不管。"], ["c01-029", "在特洛伊城的山坡上，有一个年轻的牧羊人，名叫帕里斯。"], ["c01-030", "他是个公正的人，你们去找他吧。”"]]}, {"t": "p", "s": [["c01-031", "其实，帕里斯不是普通的牧羊人。"], ["c01-032", "他是特洛伊国王普里阿摩斯的儿子。"], ["c01-033", "他刚出生的时候，有人预言，这个孩子长大以后，会给特洛伊带来灾难。"], ["c01-034", "国王害怕极了，就叫人把他抱到山上去。"], ["c01-035", "好心的牧羊人捡到了他，把他养大。"], ["c01-036", "所以，帕里斯自己也不知道，他是一位王子。"]]}, {"t": "img", "src": "images/88.webp?v=0e79b6cf37", "vid": "images/88.mp4?v=dc5ba5610d", "cap": "山坡上的牧羊人", "n": 4}, {"t": "p", "s": [["c01-037", "这一天，帕里斯正坐在山坡上看着羊群吃草。"], ["c01-038", "突然，三位光芒耀眼的女神，从天上落了下来，站在了他的面前。"]]}, {"t": "p", "s": [["c01-039", "帕里斯吓得连笛子都掉在了地上。"]]}, {"t": "p", "s": [["c01-040", "他从小在山坡上长大，见过的最大的东西，是自己的羊群，见过最亮的光，是清晨的太阳。"], ["c01-041", "现在，三团比太阳还耀眼的光，围着他转来转去，他连头都不敢抬，只觉得膝盖在微微地发抖。"]]}, {"t": "p", "s": [["c01-042", "赫拉说：“年轻人，把苹果给我，我让你做天下最有权势的国王。”"]]}, {"t": "p", "s": [["c01-043", "雅典娜说：“把苹果给我，我让你变成最聪明、最勇敢的英雄，打仗从来不会输。”"]]}, {"t": "p", "s": [["c01-044", "阿芙洛狄忒温柔地看着他，说：“把苹果给我，我就把世界上最美丽的女人，送给你做妻子。”"]]}, {"t": "img", "src": "images/03.webp?v=315d8c8eca", "vid": "images/03.mp4?v=1521bd7894", "cap": "牧羊人的选择", "n": 5}, {"t": "p", "s": [["c01-045", "帕里斯想了很久很久。"], ["c01-046", "山风吹过来，羊群咩咩地叫着。"]]}, {"t": "p", "s": [["c01-047", "他先想到了赫拉的王冠。"], ["c01-048", "国王多威风啊，可是国王也有数不清的烦恼，每天都要处理别人的争吵。"], ["c01-049", "他又想到了雅典娜的长矛。"], ["c01-050", "英雄多神气啊，可是英雄总要上战场，总要受伤。"], ["c01-051", "最后，他想到了那个世界上最美丽的女人，想到她笑起来的样子，心里就像被春风吹过一样，暖洋洋的。"]]}, {"t": "p", "s": [["c01-052", "他是一个年轻人，他还不懂，有些礼物看起来很美，背后却拴着很重很重的东西。"]]}, {"t": "p", "s": [["c01-053", "最后，他把金苹果递给了阿芙洛狄忒。"]]}, {"t": "p", "s": [["c01-054", "苹果在他的手心里，凉凉的，沉沉的，好像比一块石头还要重。"]]}, {"t": "p", "s": [["c01-055", "阿芙洛狄忒高兴极了。"], ["c01-056", "赫拉和雅典娜却气得脸色发青，她们对着特洛伊城的方向，狠狠地看了一眼，心里暗暗地发誓：总有一天，要让这座城市付出代价。"]]}, {"t": "p", "s": [["c01-057", "天上的云忽然变得灰蒙蒙的，山坡上的羊群，不安地挤成了一团。"], ["c01-058", "帕里斯抬起头，什么也没有看见，只觉得后背凉了一下。"]]}, {"t": "p", "s": [["c01-059", "世界上最美丽的女人，是谁呢？"], ["c01-060", "她叫海伦，是希腊斯巴达国王墨涅拉俄斯的妻子。"]]}, {"t": "img", "src": "images/89.webp?v=d83442ef0a", "vid": "images/89.mp4?v=1ebfa78848", "cap": "最美的女人", "n": 6}, {"t": "p", "s": [["c01-061", "她有一头像阳光一样的金发，笑起来的时候，连冬天的花园里，花儿都想要开放。"], ["c01-062", "人们说，只要看她一眼，就会忘记自己要去哪里。"]]}, {"t": "p", "s": [["c01-063", "后来，帕里斯认回了自己的父亲，成了特洛伊的王子。"], ["c01-064", "有一天，他坐上大船，渡过大海，来到了斯巴达做客。"], ["c01-065", "墨涅拉俄斯国王热情地招待了他，给他准备了最好的饭菜。"], ["c01-066", "可是第二天，国王有事出了远门。"]]}, {"t": "p", "s": [["c01-067", "他嘱咐海伦好好招待客人，自己便骑上快马，翻过了山岭。"]]}, {"t": "img", "src": "images/90.webp?v=17552ebfc2", "vid": "images/90.mp4?v=98171b1054", "cap": "悄悄起航", "n": 7}, {"t": "p", "s": [["c01-068", "就在这个时候帕里斯带着海伦，悄悄地登上了船，一路向东回到了特洛伊。"]]}, {"t": "p", "s": [["c01-069", "一个小小的金苹果，一次小小的选择，谁也没有想到，它会引来一场打了整整十年的大战争。"]]}, {"t": "p", "s": [["c01-070", "而在奥林匹斯山上，赫拉和雅典娜，已经在悄悄地商量下一步了。"]]}]}, {"title": "第二章　海伦被带走了", "head": "c02-h", "audio": "audio/ch02.m4a?v=67d61bd7fc", "duration": 372.043, "times": {"c02-h": [0.0, 2.843], "c02-001": [3.843, 12.858], "c02-002": [13.708, 16.105], "c02-003": [16.456, 17.04], "c02-004": [17.89, 30.53], "c02-005": [31.38, 32.352], "c02-006": [33.202, 38.662], "c02-007": [39.512, 42.951], "c02-008": [43.301, 46.877], "c02-009": [47.227, 50.09], "c02-010": [50.94, 56.324], "c02-011": [56.674, 66.475], "c02-012": [67.325, 76.664], "c02-013": [77.514, 86.633], "c02-014": [86.983, 98.707], "c02-015": [99.057, 103.217], "c02-016": [104.067, 107.775], "c02-017": [108.625, 111.349], "c02-018": [112.199, 118.647], "c02-019": [118.997, 125.123], "c02-020": [125.973, 132.222], "c02-021": [132.572, 135.121], "c02-022": [135.471, 139.276], "c02-023": [140.126, 144.529], "c02-024": [144.879, 156.844], "c02-025": [157.694, 169.748], "c02-026": [170.598, 176.813], "c02-027": [177.163, 179.728], "c02-028": [180.578, 183.817], "c02-029": [184.167, 186.258], "c02-030": [187.108, 195.969], "c02-031": [196.819, 201.317], "c02-032": [201.667, 210.643], "c02-033": [210.993, 218.309], "c02-034": [219.159, 223.105], "c02-035": [223.955, 226.555], "c02-036": [226.905, 241.36], "c02-037": [242.21, 247.273], "c02-038": [248.123, 253.676], "c02-039": [254.026, 256.551], "c02-040": [257.401, 262.288], "c02-041": [263.138, 271.605], "c02-042": [271.955, 282.771], "c02-043": [283.621, 286.564], "c02-044": [287.414, 302.65], "c02-045": [303.0, 307.821], "c02-046": [308.671, 316.095], "c02-047": [316.945, 320.27], "c02-048": [320.62, 329.369], "c02-049": [330.219, 332.696], "c02-050": [333.046, 338.427], "c02-051": [339.277, 340.903], "c02-052": [341.253, 348.44], "c02-053": [348.79, 356.44], "c02-054": [356.79, 364.882], "c02-055": [365.732, 370.543]}, "blocks": [{"t": "img", "src": "images/04.webp?v=3751c71e6b", "vid": "images/04.mp4?v=30399088e2", "cap": "海伦不见了", "n": 8}, {"t": "p", "s": [["c02-001", "墨涅拉俄斯回到王宫的时候，大厅里空荡荡的，海伦的织布机还摆在窗前上面的线才织了一半。"]]}, {"t": "p", "s": [["c02-002", "他一连喊了好几声：“海伦！"], ["c02-003", "海伦！”"]]}, {"t": "p", "s": [["c02-004", "他跑上楼梯，推开每一扇门，花园里、厨房里、海边的石头路上，都找了一遍，只找到了一只被风吹落在地上的银发簪。"]]}, {"t": "p", "s": [["c02-005", "没有人回答。"]]}, {"t": "p", "s": [["c02-006", "仆人们哭着告诉他：“国王，王后被特洛伊来的客人带走了。”"]]}, {"t": "p", "s": [["c02-007", "墨涅拉俄斯的脸，一下子变得雪白。"], ["c02-008", "他一拳砸在柱子上大声说：“好大的胆子！"], ["c02-009", "我把他当成客人，他却偷走了我的妻子！”"]]}, {"t": "img", "src": "images/91.webp?v=dbfc88ff47", "vid": "images/91.mp4?v=435ea3a2d8", "cap": "连夜赶路", "n": 9}, {"t": "p", "s": [["c02-010", "他连夜坐船，赶到了迈锡尼，去找他的哥哥阿伽门农。"], ["c02-011", "阿伽门农是希腊最强大的国王，他的王宫里，有成百上千的武士，粮仓里装满了麦子和美酒。"]]}, {"t": "p", "s": [["c02-012", "阿伽门农听了弟弟的话，把手里的金杯重重地放在桌上，说：“弟弟，别难过，这不只是你一个人的事。”"]]}, {"t": "p", "s": [["c02-013", "原来，很多年以前，海伦刚要出嫁的时候，希腊各地的国王和英雄们都来求婚，吵得不可开交。"], ["c02-014", "后来，有一位聪明的国王想了一个办法，他叫所有的求婚者围成一圈，一起发了一个誓：“不管海伦嫁给谁，我们都要保护她和她的丈夫。"], ["c02-015", "要是有人伤害他们，我们大家就一起去，帮他讨回公道！”"]]}, {"t": "p", "s": [["c02-016", "这位聪明的国王，就是伊萨卡的奥德修斯。"]]}, {"t": "p", "s": [["c02-017", "现在，誓言该兑现了。"]]}, {"t": "p", "s": [["c02-018", "阿伽门农派出了许多使者，坐着快船，到希腊的每一个角落去送信。"], ["c02-019", "信里只有一句话：“海伦被抢走了，请大家兑现誓言，到奥利斯港口集合。”"]]}, {"t": "p", "s": [["c02-020", "使者来到了伊萨卡，奥德修斯正在山坡上赶着牛，犁地。"], ["c02-021", "他听见了消息，叹了一口气。"], ["c02-022", "他的儿子才刚刚出生，他一点儿也不想离开家。"]]}, {"t": "img", "src": "images/06.webp?v=d74db9ed3e", "vid": "images/06.mp4?v=0f829882b5", "cap": "犁沙滩的国王", "n": 10}, {"t": "p", "s": [["c02-023", "其实，他早就听到了风声，想了一个办法。"], ["c02-024", "他戴上一顶尖尖的毡帽，装成一个疯子，把一头驴和一头牛套在同一架犁上，一边唱着乱七八糟的歌，一边在沙滩上撒盐。"]]}, {"t": "p", "s": [["c02-025", "使者们看了半天，正在摇头一位叫帕拉墨得斯的聪明人，一把抱起了奥德修斯刚出生的小儿子，轻轻地放在了犁的前面。"]]}, {"t": "p", "s": [["c02-026", "奥德修斯一看，马上拉住了犁，绕了过去，一点儿也没有伤着孩子。"], ["c02-027", "装疯的办法，被识破了。"]]}, {"t": "p", "s": [["c02-028", "可是，誓言是他自己想出来的。"], ["c02-029", "他是一个说话算话的人。"]]}, {"t": "p", "s": [["c02-030", "他回到家，抱了抱妻子，又亲了亲儿子的小脸蛋，然后戴上头盔，一步一步，向海边走去。"]]}, {"t": "p", "s": [["c02-031", "使者来到了菲提亚，那里住着一个年轻的英雄。"], ["c02-032", "他叫阿喀琉斯，是刚才那场婚礼上新娘忒提斯的儿子，一半是神，一半是人。"], ["c02-033", "阿喀琉斯又高又壮，跑得比马还快，金色的头发在阳光下闪闪发亮。"]]}, {"t": "p", "s": [["c02-034", "阿喀琉斯一听说要打仗，眼睛都亮了。"]]}, {"t": "p", "s": [["c02-035", "他的母亲忒提斯却担心极了。"], ["c02-036", "她知道，一个预言说，她的儿子要么在家乡平平安安地活到老，要么去特洛伊打仗，在战场上赢得永远的名声，可是会很早很早就死去。"]]}, {"t": "p", "s": [["c02-037", "忒提斯拉着他的手，说：“孩子，你不要去，好不好？”"]]}, {"t": "p", "s": [["c02-038", "阿喀琉斯摇了摇头，说：“妈妈，我想让所有的人都记住我。"], ["c02-039", "我不想做一个一辈子没有人知道名字的人。”"]]}, {"t": "p", "s": [["c02-040", "忒提斯的眼泪，一滴一滴地落在了他的手背上。"]]}, {"t": "img", "src": "images/92.webp?v=0f0d773420", "vid": "images/92.mp4?v=aef07bfeef", "cap": "闪亮的铠甲", "n": 11}, {"t": "p", "s": [["c02-041", "她给儿子准备了一副闪闪发光的铠甲，又派了一位叫帕特洛克罗斯的好朋友，陪着他一起去。"], ["c02-042", "帕特洛克罗斯比阿喀琉斯大几岁，脾气温和，总是笑眯眯的，他们俩从小一起长大，像亲兄弟一样。"]]}, {"t": "p", "s": [["c02-043", "渐渐地，各地的英雄都来了。"]]}, {"t": "p", "s": [["c02-044", "有身材高大、像一座小山一样的埃阿斯；有勇敢的狄奥墨得斯；有白胡子的老国王涅斯托尔，他活了很久很久，肚子里装满了好主意；还有聪明的奥德修斯。"], ["c02-045", "他们带着成百上千条大船，来到了奥利斯的港口。"]]}, {"t": "img", "src": "images/05.webp?v=0c5e15e84c", "vid": "images/05.mp4?v=42d57f4c5c", "cap": "奥利斯港", "n": 12}, {"t": "p", "s": [["c02-046", "海面上，桅杆像一片黑色的森林，白色的帆在风里鼓鼓地响着。"]]}, {"t": "p", "s": [["c02-047", "英雄们推选阿伽门农当大元帅。"], ["c02-048", "风停了好几天以后，终于吹起了顺风，一千多条大船一起扬起帆，向东边的特洛伊驶去。"]]}, {"t": "p", "s": [["c02-049", "太阳照在海面上闪闪发亮。"], ["c02-050", "每一个年轻的武士，心里都想着：打赢了，就能早点回家。"]]}, {"t": "img", "src": "images/93.webp?v=8cff13e44d", "vid": "images/93.mp4?v=c869934c85", "cap": "热闹的港口", "n": 13}, {"t": "p", "s": [["c02-051", "港口里热闹极了。"], ["c02-052", "木匠们叮叮当当地修着船，铁匠们抡着大锤，打出一把把亮闪闪的剑。"], ["c02-053", "女人们站在岸边，把一袋袋面饼和一罐罐橄榄油，递给自己的丈夫和儿子。"], ["c02-054", "有的小孩子骑在爸爸的肩膀上，不明白为什么大家都在哭，还高高兴兴地挥着小手。"]]}, {"t": "p", "s": [["c02-055", "谁也没有想到，这一仗，要打整整十年。"]]}]}, {"title": "第三章　高高的城墙", "head": "c03-h", "audio": "audio/ch03.m4a?v=78c1983256", "duration": 377.942, "times": {"c03-h": [0.0, 3.056], "c03-001": [4.056, 10.223], "c03-002": [11.073, 12.461], "c03-003": [13.311, 20.789], "c03-004": [21.639, 32.806], "c03-005": [33.156, 42.18], "c03-006": [42.53, 49.208], "c03-007": [49.558, 60.934], "c03-008": [61.284, 71.702], "c03-009": [72.552, 78.339], "c03-010": [78.689, 85.689], "c03-011": [86.539, 89.651], "c03-012": [90.001, 98.421], "c03-013": [98.771, 109.554], "c03-014": [110.404, 115.413], "c03-015": [115.763, 125.657], "c03-016": [126.007, 133.637], "c03-017": [134.487, 146.853], "c03-018": [147.203, 150.21], "c03-019": [151.06, 159.981], "c03-020": [160.331, 169.37], "c03-021": [170.22, 179.657], "c03-022": [180.007, 191.547], "c03-023": [191.897, 196.09], "c03-024": [196.94, 200.028], "c03-025": [200.878, 212.551], "c03-026": [212.901, 217.069], "c03-027": [217.919, 220.899], "c03-028": [221.749, 224.981], "c03-029": [225.331, 231.938], "c03-030": [232.788, 241.672], "c03-031": [242.022, 253.842], "c03-032": [254.192, 259.269], "c03-033": [259.619, 268.233], "c03-034": [269.083, 274.108], "c03-035": [274.958, 276.813], "c03-036": [277.663, 281.662], "c03-037": [282.512, 286.41], "c03-038": [287.26, 290.369], "c03-039": [290.719, 297.146], "c03-040": [297.496, 304.295], "c03-041": [305.145, 307.384], "c03-042": [307.734, 314.87], "c03-043": [315.22, 323.277], "c03-044": [324.127, 327.695], "c03-045": [328.045, 337.592], "c03-046": [338.442, 343.472], "c03-047": [343.822, 352.57], "c03-048": [352.92, 357.765], "c03-049": [358.615, 368.873], "c03-050": [369.723, 373.049], "c03-051": [373.899, 376.442]}, "blocks": [{"t": "p", "s": [["c03-001", "希腊人的船队，在海上走了许多天，终于看见了一座高高的城。"]]}, {"t": "p", "s": [["c03-002", "那就是特洛伊。"]]}, {"t": "img", "src": "images/07.webp?v=425e9cc637", "vid": "images/07.mp4?v=6ec2de4630", "cap": "高高的特洛伊", "n": 14}, {"t": "p", "s": [["c03-003", "它建在一座小山坡上，周围围着厚厚的石头城墙，墙高得好像要碰到云彩。"]]}, {"t": "p", "s": [["c03-004", "城墙外面，是一大片平平的草地，中间有两条小河流过，一条叫斯卡曼德罗斯，一条叫西摩伊斯。"], ["c03-005", "春天的时候，草地上开满了黄色和白色的小花，羊群和马群，在河边慢悠悠地走来走去。"], ["c03-006", "谁也没有想到，这片美丽的草地，以后会变成一个巨大的战场。"], ["c03-007", "听说，这道城墙是海神波塞冬和太阳神阿波罗一起盖起来的，每一块石头都严丝合缝，连一根头发也插不进去。"], ["c03-008", "城里有金色的屋顶、宽宽的街道、热闹的集市，城门口有一棵老无花果树，树下总有孩子在玩耍。"]]}, {"t": "img", "src": "images/94.webp?v=2ce0ee194f", "vid": "images/94.mp4?v=42d8fcf0b3", "cap": "白发的老国王", "n": 15}, {"t": "p", "s": [["c03-009", "特洛伊的国王普里阿摩斯，已经是一位白发苍苍的老人了。"], ["c03-010", "他有五十个儿子、许多个女儿，其中最让他骄傲的，是长子赫克托耳。"]]}, {"t": "img", "src": "images/08.webp?v=c6fef1403f", "vid": "images/08.mp4?v=ba94660927", "cap": "赫克托耳和小宝宝", "n": 16}, {"t": "p", "s": [["c03-011", "赫克托耳是特洛伊最勇敢的人。"], ["c03-012", "他个子高，肩膀宽，头盔上插着一撮马鬃，走起路来，红色的羽毛一晃一晃的。"], ["c03-013", "可是他又是一个温和的人，他爱他的老父亲，爱他的妻子，爱他的小宝宝，也爱这座城市里每一个普通的人。"]]}, {"t": "p", "s": [["c03-014", "他的妻子，叫安德洛玛刻，是一位温柔的王后。"], ["c03-015", "他们的小宝宝，才几岁，圆圆的脸，大大的眼睛，每次看见爸爸回来，都伸着小手，咯咯地笑。"], ["c03-016", "赫克托耳最喜欢在傍晚的时候，把他举到肩膀上，沿着城墙，慢慢地走一圈。"]]}, {"t": "p", "s": [["c03-017", "希腊人把大船拉上了沙滩，排成长长的一排，在海边搭起了无数个帐篷，又用木头和泥土筑起了一道矮矮的围墙，保护他们的船。"], ["c03-018", "从那一天起，战争就开始了。"]]}, {"t": "img", "src": "images/95.webp?v=bf0fe13a5e", "vid": "images/95.mp4?v=10bc1ded82", "cap": "平原上的两军", "n": 17}, {"t": "p", "s": [["c03-019", "白天，两边的武士在城外的平原上冲杀，尘土飞扬，盾牌和长矛撞在一起叮叮当当。"], ["c03-020", "夜里，双方各回各的地方，点起火把，包扎伤口，谁也想不出办法，怎样才能赢。"]]}, {"t": "p", "s": [["c03-021", "有时候，希腊人冲到了城墙脚下，眼看就要攻进去了，特洛伊的援军，又从远方赶来把他们打了回去。"], ["c03-022", "有时候，特洛伊人冲出城门，一直追到海边，眼看就要烧掉大船了，阿喀琉斯又举着长矛，大喊一声，冲了出来。"], ["c03-023", "就这样，你来我往，谁也没有占到便宜。"]]}, {"t": "p", "s": [["c03-024", "一年过去了，两年过去了。"]]}, {"t": "p", "s": [["c03-025", "希腊人带来的麦子吃完了，就分出一部分人，坐着船，到四周的小城镇去抢粮食，也抢回来很多东西，其中还有被抓来的人。"], ["c03-026", "这些人，被当成战利品，分给了英雄们。"]]}, {"t": "p", "s": [["c03-027", "三年过去了，五年过去了。"]]}, {"t": "img", "src": "images/09.webp?v=2ec2162cc6", "vid": "images/09.mp4?v=8e47d1a75e", "cap": "沙滩上的营地", "n": 18}, {"t": "p", "s": [["c03-028", "沙滩上的帐篷，被风吹得发白。"], ["c03-029", "士兵们的脸晒得又黑又糙，有人的头发里，已经夹杂着几根白的。"]]}, {"t": "p", "s": [["c03-030", "沙滩上的木头船，被海水泡得发黑，船底爬满了小小的贝壳和海草，连缆绳都朽了。"], ["c03-031", "有的士兵，已经好几年没有收到过家里的信了，他们不知道，家里的孩子，长了多高，老妈妈的身体，还好不好。"], ["c03-032", "夜里，常常有人对着海的那边，默默地流眼泪。"], ["c03-033", "他们常常坐在海边望着西边的大海，想念家乡的橄榄树，想念老妈妈做的面饼。"]]}, {"t": "p", "s": [["c03-034", "可是城墙还是那样高，城门还是那样紧紧地关着。"]]}, {"t": "p", "s": [["c03-035", "九年就这样过去了。"]]}, {"t": "p", "s": [["c03-036", "到了第十年，希腊军营里，发生了一件事。"]]}, {"t": "p", "s": [["c03-037", "在这座沙滩上的营地里，有三位最重要的人。"]]}, {"t": "p", "s": [["c03-038", "第一位是大元帅阿伽门农。"], ["c03-039", "他是迈锡尼的国王，身材高大，嗓门洪亮，爱发号施令。"], ["c03-040", "他拥有最多的船，最多的武士，所以他觉得，所有人都应该听他的。"]]}, {"t": "p", "s": [["c03-041", "第二位是阿喀琉斯。"], ["c03-042", "他不是最年长的，也不是国王，可是，他是整个军营里最能打的人。"], ["c03-043", "每次他冲上战场，对面的武士，就会往后退，退到城墙脚下，再也不敢出来。"]]}, {"t": "img", "src": "images/96.webp?v=fa88c7d36f", "vid": "images/96.mp4?v=f1fedb80ee", "cap": "老国王讲故事", "n": 19}, {"t": "p", "s": [["c03-044", "第三位是聪明的老国王涅斯托尔。"], ["c03-045", "他不怎么能打仗了，可是，每次吵架吵得不可开交的时候，大家都会安静下来，听他慢慢地说上几句。"]]}, {"t": "p", "s": [["c03-046", "他说话的声音，沙沙的，像风吹过老橄榄树的叶子。"], ["c03-047", "他常常说：“我年轻的时候，见过比你们更勇敢的人，可是，他们也都听我的劝。”"], ["c03-048", "大家听了，都忍不住笑，可是，谁也不敢不听。"]]}, {"t": "p", "s": [["c03-049", "那一年的春天，这三个人，和他们周围的几万人，谁也没有想到，一场最大的风暴，正在悄悄地来。"]]}, {"t": "p", "s": [["c03-050", "它不是从海上来的也不是从城墙里来的。"]]}, {"t": "p", "s": [["c03-051", "它是从一个老人的哭声里来的。"]]}]}, {"title": "第四章　太阳神的箭", "head": "c04-h", "audio": "audio/ch04.m4a?v=a30d3d26ea", "duration": 365.08, "times": {"c04-h": [0.0, 2.765], "c04-001": [3.765, 11.814], "c04-002": [12.664, 19.565], "c04-003": [19.915, 23.966], "c04-004": [24.816, 34.987], "c04-005": [35.337, 37.64], "c04-006": [38.49, 42.116], "c04-007": [42.466, 51.156], "c04-008": [52.006, 56.654], "c04-009": [57.004, 60.758], "c04-010": [61.608, 70.525], "c04-011": [70.875, 76.686], "c04-012": [77.536, 81.862], "c04-013": [82.712, 86.363], "c04-014": [86.713, 89.409], "c04-015": [90.259, 92.651], "c04-016": [93.001, 97.439], "c04-017": [97.789, 99.119], "c04-018": [99.469, 102.27], "c04-019": [102.62, 106.031], "c04-020": [106.881, 111.542], "c04-021": [112.392, 118.617], "c04-022": [118.967, 123.932], "c04-023": [124.782, 131.939], "c04-024": [132.289, 141.021], "c04-025": [141.371, 152.568], "c04-026": [153.418, 154.484], "c04-027": [155.334, 164.348], "c04-028": [165.039, 168.16], "c04-029": [169.01, 171.556], "c04-030": [172.406, 179.517], "c04-031": [180.367, 185.238], "c04-032": [186.088, 189.753], "c04-033": [190.603, 195.206], "c04-034": [196.056, 201.115], "c04-035": [201.465, 208.438], "c04-036": [208.788, 218.108], "c04-037": [218.958, 221.969], "c04-038": [222.319, 225.42], "c04-039": [226.27, 232.027], "c04-040": [232.877, 242.734], "c04-041": [243.584, 246.718], "c04-042": [247.068, 251.636], "c04-043": [251.986, 257.176], "c04-044": [258.026, 265.442], "c04-045": [265.792, 270.779], "c04-046": [271.629, 273.783], "c04-047": [274.133, 279.727], "c04-048": [280.077, 282.76], "c04-049": [283.61, 288.666], "c04-050": [289.016, 292.52], "c04-051": [292.87, 300.344], "c04-052": [301.194, 305.46], "c04-053": [306.31, 312.551], "c04-054": [313.401, 316.689], "c04-055": [317.039, 321.767], "c04-056": [322.117, 330.87], "c04-057": [331.22, 335.441], "c04-058": [336.291, 341.054], "c04-059": [341.404, 346.571], "c04-060": [346.921, 352.267], "c04-061": [352.617, 359.123], "c04-062": [359.973, 363.58]}, "blocks": [{"t": "img", "src": "images/97.webp?v=d876ef0624", "vid": "images/97.mp4?v=1371b80d5b", "cap": "走来的老人", "n": 20}, {"t": "p", "s": [["c04-001", "那天清晨，一个白胡子的老人，沿着海边的小路，一步一步走进了希腊人的营地。"]]}, {"t": "p", "s": [["c04-002", "他手里拿着一根金色的权杖，权杖上，系着太阳神阿波罗的白色头带。"], ["c04-003", "他是阿波罗神庙的祭司，名叫克律塞斯。"]]}, {"t": "p", "s": [["c04-004", "他的胡子，像海边的浪花一样白，背有一点点驼，走了很远很远的路，脚上的草鞋都磨破了。"], ["c04-005", "可是，他一步也没有停下来。"]]}, {"t": "img", "src": "images/10.webp?v=ff3923ba0e", "vid": "images/10.mp4?v=3cdcd9e1d2", "cap": "老祭司求女儿", "n": 21}, {"t": "p", "s": [["c04-006", "老人走到阿伽门农的帐篷前，跪了下来。"], ["c04-007", "他的身后，跟着几个仆人，抬着一个又一个沉甸甸的箱子，里面装满了金子、银子和漂亮的铜器。"]]}, {"t": "p", "s": [["c04-008", "老人说：“尊敬的元帅，请你们收下这些礼物。"], ["c04-009", "我只有一个请求，请你把我的女儿还给我。”"]]}, {"t": "p", "s": [["c04-010", "原来，前几天，希腊人攻打了克律塞斯住的小城，抓走了一个年轻的姑娘，名叫克律塞伊斯。"], ["c04-011", "按照规矩，大元帅阿伽门农把她挑走了，留在自己的帐篷里。"]]}, {"t": "p", "s": [["c04-012", "军营里的人，都觉得，应该答应老人。"]]}, {"t": "p", "s": [["c04-013", "士兵们说：“收下礼物，把姑娘还给她的父亲吧！"], ["c04-014", "他是阿波罗的祭司，我们要尊敬神。”"]]}, {"t": "p", "s": [["c04-015", "可是，阿伽门农不高兴。"], ["c04-016", "他皱着眉头，大声说：“老头儿，别再来了！"], ["c04-017", "我才不会放她走。"], ["c04-018", "她要在我的家里，一辈子给我织布。"], ["c04-019", "你快走吧，再让我看见你，我就不客气了！”"]]}, {"t": "p", "s": [["c04-020", "老人吓得全身发抖，一句话也不敢再说，转身就走。"]]}, {"t": "p", "s": [["c04-021", "风从海面上吹来，吹乱了他的白胡子，也吹起了他破旧的袍子。"], ["c04-022", "营地里的人，都低下了头，不忍心去看他的背影。"]]}, {"t": "img", "src": "images/98.webp?v=ee59502535", "vid": "images/98.mp4?v=b972cee00f", "cap": "老人的祈祷", "n": 22}, {"t": "p", "s": [["c04-023", "他一个人走在海边海浪哗哗地响着，天上的云慢慢地变暗了。"], ["c04-024", "老人抬起头，对着天空，流着眼泪，大声地祈祷：“银弓之神啊，请你听听我的话。"], ["c04-025", "要是我以前给您盖过神庙，献过肥肥的羊腿，求您用您的箭，叫希腊人，为我的眼泪，付出代价吧！”"]]}, {"t": "p", "s": [["c04-026", "阿波罗听见了。"]]}, {"t": "img", "src": "images/11.webp?v=a9e5a78d2c", "vid": "images/11.mp4?v=f0098169ea", "cap": "太阳神的箭", "n": 23}, {"t": "p", "s": [["c04-027", "他从奥林匹斯山上飞了下来，肩膀上背着一把银色的大弓，一支一支的箭，在箭袋里叮叮当当地响。"], ["c04-028", "他的脸，黑得像夜里的乌云。"]]}, {"t": "p", "s": [["c04-029", "他坐在大船的对面拉开了弓。"]]}, {"t": "p", "s": [["c04-030", "弓弦响起来的声音，又尖又冷，像银色的雨点，从天上落下来。"]]}, {"t": "p", "s": [["c04-031", "第一支箭射出去，射中的，是骡子和狗。"]]}, {"t": "p", "s": [["c04-032", "第二支箭射出去，射中的，是士兵。"]]}, {"t": "p", "s": [["c04-033", "一时间，营地里，起了一场可怕的瘟疫。"]]}, {"t": "img", "src": "images/99.webp?v=b12d9f52a5", "vid": "images/99.mp4?v=d23e0ba62f", "cap": "营地里的病", "n": 24}, {"t": "p", "s": [["c04-034", "士兵们躺在帐篷里发着高烧，嘴唇干得裂开了口子。"], ["c04-035", "军医们提着药箱，一个帐篷一个帐篷地跑，可是，什么药也不管用。"], ["c04-036", "人们一个接一个地病倒了，每天夜里，海边都烧着一堆又一堆的火，那是在为死去的人送行。"]]}, {"t": "p", "s": [["c04-037", "一天，两天，三天……"], ["c04-038", "整整九天，瘟疫没有停下来。"]]}, {"t": "p", "s": [["c04-039", "第十天的早上，阿喀琉斯召集了所有的人，到沙滩上开会。"]]}, {"t": "p", "s": [["c04-040", "他站起来，对大家说：“元帅，我看，我们大概只有一个办法，就是去问一问预言家，到底是哪位神仙，生了我们的气。”"]]}, {"t": "img", "src": "images/12.webp?v=293a6c390a", "vid": "images/12.mp4?v=bf840ca3f2", "cap": "预言家说话", "n": 25}, {"t": "p", "s": [["c04-041", "人群里，站出来一位白发的老人。"], ["c04-042", "他是希腊军里最有名的预言家，名叫卡尔卡斯。"], ["c04-043", "他看一眼过去的事，也看一眼将来的事，从来不会说错。"]]}, {"t": "p", "s": [["c04-044", "卡尔卡斯小声地说：“阿喀琉斯，你要保证，不管我说什么，你都会保护我。"], ["c04-045", "我怕说出来，有一个很有权势的人，会生气。”"]]}, {"t": "p", "s": [["c04-046", "阿喀琉斯大声说：“你说吧。"], ["c04-047", "只要我活着，只要我的眼睛还能看见阳光，没有一个人敢碰你一根头发。"], ["c04-048", "就算你要说的是阿伽门农，也不要紧！”"]]}, {"t": "p", "s": [["c04-049", "卡尔卡斯这才说：“这场瘟疫，是阿波罗降下来的。"], ["c04-050", "因为我们的元帅，侮辱了他的祭司。"], ["c04-051", "除非把姑娘还给她的父亲，还要送上一百头牛，不然瘟疫是不会停的。”"]]}, {"t": "p", "s": [["c04-052", "沙滩上，一下子，静得连海浪声都听得见。"]]}, {"t": "p", "s": [["c04-053", "没有人说话，连最爱吵闹的小鸟，都停在了帆杆上一动也不动。"]]}, {"t": "p", "s": [["c04-054", "夜深了，海边的风凉了起来。"], ["c04-055", "祭司克律塞斯的影子，在沙滩上拖得长长的。"], ["c04-056", "他回头望了一眼希腊人的营火，那么多火堆连成一片，可是没有一堆，是为他女儿点的。"], ["c04-057", "老人把拐杖握得紧紧的，指节都发白了。"]]}, {"t": "p", "s": [["c04-058", "士兵们把死去的朋友，一个一个地抬到海边。"], ["c04-059", "他们用最干净的白布，把朋友的身体包好，放在柴堆上。"], ["c04-060", "点火的时候，没有人说话，只有火苗噼噼啪啪的声音。"], ["c04-061", "有一个年轻的小伙子，一边添柴，一边小声地说：“再等等我，我很快就回来看你。”"]]}, {"t": "p", "s": [["c04-062", "阿伽门农猛地站了起来，眼睛里像着了火。"]]}]}, {"title": "第五章　阿喀琉斯的愤怒", "head": "c05-h", "audio": "audio/ch05.m4a?v=8f280c4585", "duration": 341.837, "times": {"c05-h": [0.0, 3.15], "c05-001": [4.15, 11.589], "c05-002": [11.939, 16.26], "c05-003": [16.61, 21.419], "c05-004": [22.269, 30.13], "c05-005": [30.48, 34.833], "c05-006": [35.683, 42.03], "c05-007": [42.88, 45.401], "c05-008": [45.751, 48.841], "c05-009": [49.191, 52.679], "c05-010": [53.029, 58.417], "c05-011": [59.267, 61.541], "c05-012": [62.391, 68.52], "c05-013": [69.37, 71.95], "c05-014": [72.3, 75.208], "c05-015": [75.558, 78.031], "c05-016": [78.381, 83.072], "c05-017": [83.422, 87.79], "c05-018": [88.14, 91.465], "c05-019": [91.815, 94.685], "c05-020": [95.035, 97.651], "c05-021": [98.501, 103.014], "c05-022": [103.364, 112.369], "c05-023": [113.219, 117.169], "c05-024": [118.019, 120.81], "c05-025": [121.16, 124.201], "c05-026": [124.551, 127.374], "c05-027": [128.224, 132.974], "c05-028": [133.824, 140.95], "c05-029": [141.8, 145.496], "c05-030": [145.846, 151.5], "c05-031": [152.35, 153.426], "c05-032": [153.776, 158.482], "c05-033": [159.332, 163.094], "c05-034": [163.444, 166.193], "c05-035": [166.543, 172.171], "c05-036": [172.521, 178.95], "c05-037": [179.8, 184.438], "c05-038": [185.288, 193.236], "c05-039": [194.086, 198.353], "c05-040": [199.203, 203.783], "c05-041": [204.633, 217.462], "c05-042": [218.312, 222.035], "c05-043": [222.885, 227.441], "c05-044": [227.791, 236.63], "c05-045": [236.98, 242.193], "c05-046": [243.043, 245.315], "c05-047": [246.165, 249.497], "c05-048": [249.847, 252.924], "c05-049": [253.274, 260.574], "c05-050": [261.424, 262.453], "c05-051": [262.803, 266.723], "c05-052": [267.073, 279.161], "c05-053": [280.011, 286.23], "c05-054": [287.08, 293.553], "c05-055": [293.903, 298.596], "c05-056": [299.446, 303.491], "c05-057": [303.841, 310.151], "c05-058": [311.001, 320.53], "c05-059": [321.38, 326.888], "c05-060": [327.238, 330.823], "c05-061": [331.173, 335.929], "c05-062": [336.779, 338.337], "c05-063": [338.687, 339.072], "c05-064": [339.422, 340.337]}, "blocks": [{"t": "img", "src": "images/13.webp?v=9a3a241f54", "vid": "images/13.mp4?v=1687e0bfa5", "cap": "元帅和英雄吵架", "n": 26}, {"t": "p", "s": [["c05-001", "阿伽门农瞪着卡尔卡斯，咬着牙说：“你这个老头，从来没有对我说过一句好听的话！"], ["c05-002", "好，我可以把姑娘还回去，我也不想看着大家生病。"], ["c05-003", "可是，你们得给我另一份礼物，我不能一个人空着手回去。”"]]}, {"t": "p", "s": [["c05-004", "阿喀琉斯皱着眉头，说：“元帅，大家的战利品，早就分完了，哪里还有多出来的？"], ["c05-005", "你先把姑娘还回去，等我们攻下特洛伊，我们加倍补给你。”"]]}, {"t": "p", "s": [["c05-006", "他说话的声音，不高，可是每个字，都像石头一样落在地上。"]]}, {"t": "p", "s": [["c05-007", "阿伽门农大叫起来：“我不要等！"], ["c05-008", "你们都有，只有我没有，这怎么行？"], ["c05-009", "我告诉你们，我要从你们当中，拿一个走。"], ["c05-010", "是埃阿斯的，是奥德修斯的，还是你阿喀琉斯的，我自己去挑！”"]]}, {"t": "p", "s": [["c05-011", "阿喀琉斯再也忍不住了。"]]}, {"t": "p", "s": [["c05-012", "他的脸，涨得通红，额头上的青筋，一根一根地跳了起来。"]]}, {"t": "img", "src": "images/100.webp?v=3da7652c38", "vid": "images/100.mp4?v=0068bcac24", "cap": "愤怒的英雄", "n": 27}, {"t": "p", "s": [["c05-013", "他说：“你这个只想着自己的贪心的人！"], ["c05-014", "我从特洛伊来，我根本没有和他们有仇。"], ["c05-015", "他们没偷过我的牛，也没抢过我的马。"], ["c05-016", "我是为了你们的面子，为了你的弟弟的妻子，才到这里来拼命的。"], ["c05-017", "可是，每一次最苦、最累的仗，都是我在打。"], ["c05-018", "分战利品的时候，最多的，都是你拿走。"], ["c05-019", "现在，你还要把我的那一份也夺走吗？"], ["c05-020", "我回家去了，我再也不给你打仗了！”"]]}, {"t": "p", "s": [["c05-021", "阿伽门农冷冷地说：“你要走就走吧，我才不求你。"], ["c05-022", "你以为你是最能打的，我告诉你，我要把你的那个姑娘布里塞伊斯带走，让你知道，谁才是这里的元帅！”"]]}, {"t": "p", "s": [["c05-023", "阿喀琉斯的手，慢慢地握住了腰上的剑柄。"]]}, {"t": "p", "s": [["c05-024", "他的血，一下子涌上了头顶。"], ["c05-025", "他想：杀了他，杀了这个傲慢的人。"], ["c05-026", "他的剑，已经拔出来了一半。"]]}, {"t": "p", "s": [["c05-027", "周围的人，都屏住了呼吸，连风都不敢吹。"]]}, {"t": "p", "s": [["c05-028", "就在这个时候一只温暖的手，突然从后面轻轻地抓住了他金色的头发。"]]}, {"t": "p", "s": [["c05-029", "阿喀琉斯回过头去，一个人也没有看见。"], ["c05-030", "可是，他看见了一双灰色的眼睛，闪着像星星一样的光。"]]}, {"t": "p", "s": [["c05-031", "那是雅典娜。"], ["c05-032", "她从天上悄悄地飞下来，只有阿喀琉斯一个人看得见。"]]}, {"t": "img", "src": "images/14.webp?v=fd0a350947", "vid": "images/14.mp4?v=7f8ba7c1fc", "cap": "抓住头发的手", "n": 28}, {"t": "p", "s": [["c05-033", "雅典娜小声说：“阿喀琉斯，别拔剑。"], ["c05-034", "赫拉和我，都爱你们两个人。"], ["c05-035", "你可以骂他，可以说最难听的话，可是，不要动手。"], ["c05-036", "我告诉你，总有一天，你会得到三倍的礼物，来补偿今天受的气。”"]]}, {"t": "p", "s": [["c05-037", "阿喀琉斯喘着粗气，把剑，慢慢地插回了剑鞘。"]]}, {"t": "p", "s": [["c05-038", "他看着雅典娜，眼睛里的火，渐渐地熄了一点点，可是，并没有完全熄灭。"]]}, {"t": "p", "s": [["c05-039", "他对雅典娜说：“女神，您的话，我一定听。”"]]}, {"t": "p", "s": [["c05-040", "可是，他的心里，像压着一块大石头。"]]}, {"t": "p", "s": [["c05-041", "他转过身，对阿伽门农说：“我今天对天发誓，总有一天，希腊人会想起我阿喀琉斯，到那时候，你们会一个一个地倒在赫克托耳的手下，而你连一个人都救不了！”"]]}, {"t": "p", "s": [["c05-042", "说完，他把权杖狠狠地摔在了地上。"]]}, {"t": "p", "s": [["c05-043", "老国王涅斯托尔，慢慢地站起来，想劝一劝。"], ["c05-044", "他说：“你们两个，一个是最有权势的人，一个是最勇敢的人，为什么要吵架呢？"], ["c05-045", "特洛伊的人，要是知道了，肯定会笑掉大牙的。”"]]}, {"t": "p", "s": [["c05-046", "可是，谁也没有听进去。"]]}, {"t": "p", "s": [["c05-047", "阿伽门农别过脸去，装作没有听见。"], ["c05-048", "阿喀琉斯气呼呼地看着远处的海面。"], ["c05-049", "老人叹了一口气，慢慢地坐了回去，他知道，这一次，他的话，没有用了。"]]}, {"t": "p", "s": [["c05-050", "会开散了。"], ["c05-051", "阿喀琉斯和帕特洛克罗斯回到了自己的帐篷。"], ["c05-052", "阿伽门农派人，把克律塞伊斯送上了一条快船，还给她的父亲又派了两个传令官，到阿喀琉斯的帐篷里，把布里塞伊斯带走。"]]}, {"t": "img", "src": "images/101.webp?v=066941135f", "vid": "images/101.mp4?v=d7284c6090", "cap": "独坐的英雄", "n": 29}, {"t": "p", "s": [["c05-053", "阿喀琉斯一个人，坐在帐篷门口望着灰色的大海，一句话也没有说。"]]}, {"t": "p", "s": [["c05-054", "帕特洛克罗斯在旁边什么也没有问，只是默默地，给他端来了一碗热汤。"], ["c05-055", "可是，汤凉了，阿喀琉斯也没有喝一口。"]]}, {"t": "img", "src": "images/102.webp?v=74a941e6a6", "vid": "images/102.mp4?v=790151d48e", "cap": "被带走的姑娘", "n": 30}, {"t": "p", "s": [["c05-056", "布里塞伊斯回头看了他好几眼，眼睛里满是眼泪。"], ["c05-057", "她是一个温柔的姑娘，在阿喀琉斯的帐篷里，从来没有被人欺负过。"]]}, {"t": "img", "src": "images/15.webp?v=ef46f347e0", "vid": "images/15.mp4?v=c4142b3a22", "cap": "向妈妈呼喊", "n": 31}, {"t": "p", "s": [["c05-058", "等传令官们走远，阿喀琉斯一个人，走到海边，坐在冰冷的石头上，向着大海，伸出了手。"]]}, {"t": "p", "s": [["c05-059", "远处的海浪一下一下地拍着沙滩，像在替谁叹气。"], ["c05-060", "士兵们站在会场的边上，不敢大声喘气。"], ["c05-061", "有人悄悄地拉了拉旁边人的袖子，小声说：“这下糟了。”"]]}, {"t": "p", "s": [["c05-062", "他大声地喊：“妈妈！"], ["c05-063", "妈妈！"], ["c05-064", "您听得见我吗？”"]]}]}, {"title": "第六章　母亲的请求", "head": "c06-h", "audio": "audio/ch06.m4a?v=90a1130eb9", "duration": 392.29, "times": {"c06-h": [0.0, 2.82], "c06-001": [3.82, 6.975], "c06-002": [7.825, 15.759], "c06-003": [16.11, 21.937], "c06-004": [22.787, 26.601], "c06-005": [27.451, 31.836], "c06-006": [32.186, 34.828], "c06-007": [35.178, 39.67], "c06-008": [40.02, 42.017], "c06-009": [42.867, 45.707], "c06-010": [46.057, 52.367], "c06-011": [52.717, 56.043], "c06-012": [56.893, 61.699], "c06-013": [62.049, 66.552], "c06-014": [66.902, 75.695], "c06-015": [76.045, 81.03], "c06-016": [81.88, 83.671], "c06-017": [84.521, 96.892], "c06-018": [97.742, 103.098], "c06-019": [103.948, 108.794], "c06-020": [109.644, 113.986], "c06-021": [114.336, 120.798], "c06-022": [121.148, 136.538], "c06-023": [136.888, 146.312], "c06-024": [146.662, 156.612], "c06-025": [157.462, 161.311], "c06-026": [162.161, 168.243], "c06-027": [168.593, 173.007], "c06-028": [173.357, 179.228], "c06-029": [179.578, 181.725], "c06-030": [182.075, 187.089], "c06-031": [187.939, 195.242], "c06-032": [195.592, 199.238], "c06-033": [200.088, 209.826], "c06-034": [210.176, 214.104], "c06-035": [214.954, 217.337], "c06-036": [218.187, 222.121], "c06-037": [222.471, 232.884], "c06-038": [233.234, 235.782], "c06-039": [236.632, 243.348], "c06-040": [243.698, 249.28], "c06-041": [250.13, 253.745], "c06-042": [254.095, 257.485], "c06-043": [258.335, 270.796], "c06-044": [271.146, 274.098], "c06-045": [274.948, 280.438], "c06-046": [281.288, 288.122], "c06-047": [288.472, 294.299], "c06-048": [295.149, 304.613], "c06-049": [305.463, 314.698], "c06-050": [315.048, 318.303], "c06-051": [319.153, 323.142], "c06-052": [323.992, 326.63], "c06-053": [326.98, 335.727], "c06-054": [336.077, 343.975], "c06-055": [344.325, 352.397], "c06-056": [353.247, 361.252], "c06-057": [361.602, 366.888], "c06-058": [367.238, 370.907], "c06-059": [371.757, 375.186], "c06-060": [375.536, 380.93], "c06-061": [381.28, 386.248], "c06-062": [387.098, 390.79]}, "blocks": [{"t": "p", "s": [["c06-001", "海面上，起了一层白色的雾。"]]}, {"t": "img", "src": "images/16.webp?v=57ccf77df4", "vid": "images/16.mp4?v=f4504385c3", "cap": "海里的母亲", "n": 32}, {"t": "p", "s": [["c06-002", "忒提斯从灰色的海水里，慢慢地升了上来，像一朵白云，坐在了儿子的身边。"], ["c06-003", "她轻轻地摸了摸他的头发，问：“孩子，你为什么哭？”"]]}, {"t": "p", "s": [["c06-004", "阿喀琉斯把整件事一五一十地告诉了妈妈。"]]}, {"t": "p", "s": [["c06-005", "他说：“妈妈，您说过，我的命，不长。"], ["c06-006", "那至少，应该让我活得有光彩。"], ["c06-007", "可是，现在，阿伽门农用侮辱，来回报我。"], ["c06-008", "我的礼物，被他夺走了。”"]]}, {"t": "p", "s": [["c06-009", "忒提斯的眼泪，落了下来。"], ["c06-010", "她说：“我的孩子，你为什么要生在这个世界上，受这么多苦？"], ["c06-011", "你的命，注定那样短。”"]]}, {"t": "p", "s": [["c06-012", "可是，她还是想了想，说：“孩子，别难过。"], ["c06-013", "我现在就上奥林匹斯山，去求宙斯。"], ["c06-014", "可是，宙斯今天，到海边的埃塞俄比亚人那里赴宴去了，要等十二天，才会回来。"], ["c06-015", "你就待在船边，不要再打仗，等着我的消息。”"]]}, {"t": "p", "s": [["c06-016", "阿喀琉斯点了点头。"]]}, {"t": "p", "s": [["c06-017", "忒提斯轻轻地吻了吻他的额头，然后，像一阵薄雾一样，慢慢地沉进了海里，只剩下水面上，几圈圆圆的波纹。"]]}, {"t": "img", "src": "images/103.webp?v=030b84e4ce", "vid": "images/103.mp4?v=3650b6dbc9", "cap": "登上奥林匹斯山", "n": 33}, {"t": "p", "s": [["c06-018", "第十二天，忒提斯穿过浓浓的云雾，登上了奥林匹斯山。"]]}, {"t": "p", "s": [["c06-019", "她在最高的山峰上，找到了坐在金色宝座上的宙斯。"]]}, {"t": "p", "s": [["c06-020", "那里的云，比雪还白，比棉花还软。"], ["c06-021", "宙斯的身边，站着两只金色的老鹰，闭着眼睛，在打瞌睡。"], ["c06-022", "她跪下来，抱住了宙斯的膝盖，用左手托着他的下巴，说：“宙斯，我的父亲，要是我在神仙当中，曾经帮助过您，请您答应我一件事。"], ["c06-023", "我的儿子，是命运最短的人，可是，阿伽门农夺走了他的礼物，侮辱了他。"], ["c06-024", "求您，让特洛伊人占上风，让希腊人输，直到他们明白，应该怎样尊敬我的儿子。”"]]}, {"t": "img", "src": "images/17.webp?v=c39a0b0525", "vid": "images/17.mp4?v=505d66aa08", "cap": "求宙斯点头", "n": 34}, {"t": "p", "s": [["c06-025", "宙斯沉默着，很久很久，没有说话。"]]}, {"t": "p", "s": [["c06-026", "终于，他说：“忒提斯，这件事，会让我为难。"], ["c06-027", "天后赫拉，已经够爱和我吵架了。"], ["c06-028", "要是她知道，我帮助特洛伊人，她又要大吵一顿。"], ["c06-029", "可是，你放心。"], ["c06-030", "我点一下头，这个许诺，就不会改变。”"]]}, {"t": "p", "s": [["c06-031", "说完，他低下了头，一头乌黑发亮的卷发，在额前轻轻地垂了下来。"], ["c06-032", "整座奥林匹斯山，都跟着晃动了一下。"]]}, {"t": "p", "s": [["c06-033", "山下的人，抬头看看天，看见一团一团的云，在天上慢慢地翻滚，像大海在翻浪。"], ["c06-034", "老人们说：“宙斯点头了，要有大事了。”"]]}, {"t": "p", "s": [["c06-035", "忒提斯满意地回到了海里。"]]}, {"t": "img", "src": "images/104.webp?v=afefe966df", "vid": "images/104.mp4?v=610076ed17", "cap": "众神迎接", "n": 35}, {"t": "p", "s": [["c06-036", "宙斯回到大厅，众神们都站起来迎接他。"], ["c06-037", "赫拉早就看见了他和海洋女神的悄悄话，一等宙斯坐下，就尖声说：“是哪个神，又来找你，说悄悄话了？"], ["c06-038", "你总是瞒着我，做自己的决定！”"]]}, {"t": "p", "s": [["c06-039", "宙斯皱着眉头，说：“赫拉，我的事，你不要什么都想知道。"], ["c06-040", "你要是再问，我就让你知道，我的手有多重。”"]]}, {"t": "p", "s": [["c06-041", "赫拉吓得闭上了嘴，坐在一边生着闷气。"], ["c06-042", "大厅里，没有一个神，敢出声。"]]}, {"t": "img", "src": "images/18.webp?v=51e1c58f8f", "vid": "images/18.mp4?v=d805015dc4", "cap": "大厅里的笑声", "n": 36}, {"t": "p", "s": [["c06-043", "这时候，铁匠神赫菲斯托斯，拄着拐杖，一瘸一拐地走过来，笑着说：“为了几个凡人，你们就在天上吵成这样，我们的酒会，不是要被破坏了吗？"], ["c06-044", "妈妈，您就忍一忍，给爸爸赔个不是吧。”"]]}, {"t": "p", "s": [["c06-045", "他倒了一杯蜜酒，递给赫拉又给别的神仙一个一个地倒酒。"]]}, {"t": "p", "s": [["c06-046", "他一瘸一拐地绕着大厅，转来转去的样子，把所有的神仙，都逗笑了。"], ["c06-047", "笑声像一阵风，把大厅里的紧张空气，一下子吹散了。"]]}, {"t": "p", "s": [["c06-048", "那一天，众神吃着，喝着，听着阿波罗拨动金色的琴弦，唱着好听的歌，一直到太阳落山。"]]}, {"t": "p", "s": [["c06-049", "赫拉的脸色，渐渐地好看了一点，可是，她的眼睛，还是不时地，偷偷瞥一眼宙斯。"], ["c06-050", "她在心里已经想好了一百个办法。"]]}, {"t": "p", "s": [["c06-051", "可是，山下的沙滩上，没有人快乐。"]]}, {"t": "img", "src": "images/105.webp?v=8df7f6bfe2", "vid": "images/105.mp4?v=587e2fe59c", "cap": "海面上的云", "n": 37}, {"t": "p", "s": [["c06-052", "忒提斯一路飞得很高。"], ["c06-053", "她从海底出发，穿过浪花，穿过云层，穿过雾和风，一直飞到奥林匹斯山的脚下。"], ["c06-054", "路上，她不停地想：我的孩子，才这么年轻，为什么偏偏要受这样的委屈？"], ["c06-055", "她把裙子的边角捏得皱皱的，直到看见了山顶的金光，才轻轻地擦了擦眼泪。"]]}, {"t": "p", "s": [["c06-056", "山脚下的牧羊人，抬起头，看见一朵从没见过的云，从海上飘上了山顶。"], ["c06-057", "他挠了挠头，对身边的小羊说：“看，神仙又要办大事了。”"], ["c06-058", "小羊咩咩地叫了两声，好像听懂了。"]]}, {"t": "p", "s": [["c06-059", "宙斯的宫殿里，传来了淡淡的花香。"], ["c06-060", "侍女们端着金盘子，轻轻地走来走去，没有一点声音。"], ["c06-061", "可是忒提斯，什么也看不进去，只盯着宙斯的脸。"]]}, {"t": "p", "s": [["c06-062", "有一场大战，正在慢慢地逼近。"]]}]}, {"title": "第七章　宙斯的梦", "head": "c07-h", "audio": "audio/ch07.m4a?v=8fa6e58b3d", "duration": 346.446, "times": {"c07-h": [0.0, 2.709], "c07-001": [3.709, 8.609], "c07-002": [9.459, 14.962], "c07-003": [15.312, 23.745], "c07-004": [24.595, 27.569], "c07-005": [28.419, 46.943], "c07-006": [47.793, 54.026], "c07-007": [54.876, 56.934], "c07-008": [57.284, 62.907], "c07-009": [63.257, 65.841], "c07-010": [66.191, 69.779], "c07-011": [70.129, 75.466], "c07-012": [76.316, 78.458], "c07-013": [79.308, 83.965], "c07-014": [84.315, 89.661], "c07-015": [90.011, 94.016], "c07-016": [94.866, 98.253], "c07-017": [98.603, 105.63], "c07-018": [105.98, 109.216], "c07-019": [109.566, 111.941], "c07-020": [112.291, 114.756], "c07-021": [115.606, 121.293], "c07-022": [121.643, 129.872], "c07-023": [130.722, 137.909], "c07-024": [138.259, 141.882], "c07-025": [142.232, 150.32], "c07-026": [150.67, 151.598], "c07-027": [151.948, 154.925], "c07-028": [155.775, 159.12], "c07-029": [159.97, 167.086], "c07-030": [167.436, 173.122], "c07-031": [173.472, 174.124], "c07-032": [174.474, 177.787], "c07-033": [178.637, 182.836], "c07-034": [183.186, 186.319], "c07-035": [186.669, 191.872], "c07-036": [192.722, 196.783], "c07-037": [197.133, 200.884], "c07-038": [201.734, 206.996], "c07-039": [207.346, 210.939], "c07-040": [211.789, 216.627], "c07-041": [216.977, 227.512], "c07-042": [227.862, 237.9], "c07-043": [238.75, 241.62], "c07-044": [242.47, 246.034], "c07-045": [246.384, 256.305], "c07-046": [256.655, 258.414], "c07-047": [259.264, 263.148], "c07-048": [263.498, 267.241], "c07-049": [267.591, 272.213], "c07-050": [273.063, 284.07], "c07-051": [284.42, 289.114], "c07-052": [289.964, 294.991], "c07-053": [295.341, 299.927], "c07-054": [300.777, 305.062], "c07-055": [305.912, 312.047], "c07-056": [312.897, 323.005], "c07-057": [323.855, 327.068], "c07-058": [327.418, 339.285], "c07-059": [340.135, 344.946]}, "blocks": [{"t": "p", "s": [["c07-001", "那天夜里，所有的神仙都睡着了，只有宙斯没有睡。"]]}, {"t": "p", "s": [["c07-002", "他躺在金色的大床上，翻来覆去，想着对忒提斯的许诺。"], ["c07-003", "他要让特洛伊人占上风，可是，怎样才能让希腊人主动冲上战场，吃一个大亏呢？"]]}, {"t": "p", "s": [["c07-004", "想了很久，他终于想出了一个办法。"]]}, {"t": "img", "src": "images/19.webp?v=b26322e981", "vid": "images/19.mp4?v=b9331604f4", "cap": "宙斯的梦", "n": 38}, {"t": "p", "s": [["c07-005", "宙斯把梦神叫到了身边，对他说：“你去，飞到希腊人的营地里，找到阿伽门农，对他说：‘现在，你就可以带着所有人去攻城了，特洛伊城，今天就是你的了。’”"]]}, {"t": "p", "s": [["c07-006", "梦神点了点头，变成了老国王涅斯托尔的样子，悄悄地飞下了山。"]]}, {"t": "img", "src": "images/106.webp?v=ccd064b89b", "vid": "images/106.mp4?v=8bfd3bbaf8", "cap": "宙斯的梦", "n": 39}, {"t": "p", "s": [["c07-007", "阿伽门农正睡得香。"], ["c07-008", "梦神站在他的床头轻轻地对他说：“元帅，你怎么还在睡觉呢？"], ["c07-009", "一个统帅，不应该睡懒觉。"], ["c07-010", "快起来，带着你的武士，去攻城吧！"], ["c07-011", "众神已经改变了主意，特洛伊的末日，就要到了！”"]]}, {"t": "p", "s": [["c07-012", "说完，梦就消失了。"]]}, {"t": "p", "s": [["c07-013", "阿伽门农猛地坐了起来，揉了揉眼睛，心里高兴极了。"], ["c07-014", "他穿好衣服，披上大披风，拿起权杖，走出了帐篷。"], ["c07-015", "东方的天空，刚刚透出一点点亮光。"]]}, {"t": "p", "s": [["c07-016", "他先叫来了几位老国王，开了一个小会。"], ["c07-017", "他说：“朋友们，我做了一个梦，梦里的老涅斯托尔，对我说，今天就可以攻下特洛伊。"], ["c07-018", "可是，我想，先试一试大家的心。"], ["c07-019", "我要对士兵们说，我们回家吧。"], ["c07-020", "你们等一等，再出来劝大家留下。”"]]}, {"t": "p", "s": [["c07-021", "天亮了，传令官们敲着铜锣，把所有的士兵召集到了沙滩上。"], ["c07-022", "人们像潮水一样，涌了过来，坐在石头上、沙子上，吵吵闹闹的声音，像一群蜜蜂。"]]}, {"t": "img", "src": "images/107.webp?v=de38aa8cb2", "vid": "images/107.mp4?v=e436d0f8aa", "cap": "元帅的演讲", "n": 40}, {"t": "p", "s": [["c07-023", "阿伽门农举起权杖，大声说：“朋友们，大神宙斯，给了我一个很坏的消息。"], ["c07-024", "他当初答应，让我们攻下特洛伊，再回家。"], ["c07-025", "可是现在，我们已经打了九年，大船的木头烂了，缆绳也断了，家里的妻子和孩子，在盼着我们。"], ["c07-026", "我们回家吧！"], ["c07-027", "特洛伊，我们是永远攻不下来的！”"]]}, {"t": "p", "s": [["c07-028", "话音刚落，沙滩上一下子就乱了。"]]}, {"t": "img", "src": "images/20.webp?v=3928c3f70f", "vid": "images/20.mp4?v=ea70d3dafd", "cap": "奔向大船", "n": 41}, {"t": "p", "s": [["c07-029", "士兵们像风吹过麦田一样，齐刷刷地站起来，哗啦哗啦地向海边的大船跑去。"], ["c07-030", "有的人去拉船，有的人去搬东西，有的人高兴得大叫：“回家喽！"], ["c07-031", "回家喽！”"], ["c07-032", "尘土飞得老高，连太阳都看不清了。"]]}, {"t": "p", "s": [["c07-033", "天后赫拉，在山顶上看见了，急得直跺脚。"], ["c07-034", "她对雅典娜说：“你快去，别让他们回去。"], ["c07-035", "要是希腊人真的走了，海伦和特洛伊的财宝，就都留给敌人了！”"]]}, {"t": "p", "s": [["c07-036", "雅典娜从山上飞了下来，找到了奥德修斯。"], ["c07-037", "他站在一边一动也不动，一脸的忧愁。"]]}, {"t": "p", "s": [["c07-038", "雅典娜对他说：“奥德修斯，你难道就要这样，让大家逃回家吗？"], ["c07-039", "快去，用你的好口才，拦住他们！”"]]}, {"t": "img", "src": "images/108.webp?v=075f3924a7", "vid": "images/108.mp4?v=e8ef598e69", "cap": "拦住逃兵", "n": 42}, {"t": "p", "s": [["c07-040", "奥德修斯一听，马上扔掉了披风，大步冲进人群。"], ["c07-041", "他碰见国王，就小声地劝：“尊敬的国王，您别像一个胆小鬼那样逃跑，元帅是在试探大家的心，他的话，不是真的。”"], ["c07-042", "他碰见普通士兵，就用权杖轻轻地敲着他们的肩膀，说：“坐下吧，朋友听一听别人的话，你们不是最勇敢的人。”"]]}, {"t": "p", "s": [["c07-043", "人们渐渐地，又回到了沙滩上。"]]}, {"t": "p", "s": [["c07-044", "可是，有一个人，还在大声吵闹。"], ["c07-045", "他叫忒耳西忒斯，是一个又矮又丑的人，罗圈腿，驼背，头上只有几根稀稀拉拉的头发。"], ["c07-046", "他总是爱说别人的坏话。"]]}, {"t": "p", "s": [["c07-047", "他扯着嗓子喊：“阿伽门农，你还想要什么？"], ["c07-048", "你的帐篷里，堆满了金子，装满了女人。"], ["c07-049", "我们回去吧，让他自己留在这儿，看看没有我们，他怎么办！”"]]}, {"t": "img", "src": "images/109.webp?v=31102e53f9", "vid": "images/109.mp4?v=d9d1708bff", "cap": "爱吵的人", "n": 43}, {"t": "p", "s": [["c07-050", "奥德修斯一步跳到了他的面前，用权杖，轻轻地，打了一下他的背，说：“你这个只会乱叫的家伙，闭上你的嘴！"], ["c07-051", "再让我听见你骂国王，我就把你的衣服扒光，用鞭子赶回家去！”"]]}, {"t": "p", "s": [["c07-052", "忒耳西忒斯疼得缩成了一团，眼泪也掉了下来。"], ["c07-053", "士兵们看着他那狼狈的样子，都哈哈大笑起来。"]]}, {"t": "p", "s": [["c07-054", "笑声里，士兵们的心情，一下子好了。"]]}, {"t": "p", "s": [["c07-055", "老涅斯托尔站起来，说：“好了，吃了早饭，大家就去打仗吧。”"]]}, {"t": "p", "s": [["c07-056", "那天，希腊的营地里，到处升起了炊烟，士兵们磨亮了长矛，擦亮了盾牌，把自己的马喂得饱饱的。"]]}, {"t": "p", "s": [["c07-057", "营地里这一夜睡得很不安稳。"], ["c07-058", "有人梦见了家乡的麦田，有人梦见了妈妈做的面饼，也有人翻来覆去，听着海浪的声音，数着自己还要在这里待多少个日子。"]]}, {"t": "p", "s": [["c07-059", "只有阿喀琉斯，还是坐在自己的帐篷门口，一动也不动。"]]}]}, {"title": "第八章　两支军队", "head": "c08-h", "audio": "audio/ch08.m4a?v=cbeb3c1925", "duration": 324.7, "times": {"c08-h": [0.0, 2.576], "c08-001": [3.576, 9.439], "c08-002": [10.289, 13.815], "c08-003": [14.165, 23.35], "c08-004": [23.7, 28.003], "c08-005": [28.353, 33.489], "c08-006": [34.339, 37.374], "c08-007": [37.724, 50.039], "c08-008": [50.889, 54.708], "c08-009": [55.558, 67.319], "c08-010": [68.169, 72.764], "c08-011": [73.614, 80.321], "c08-012": [80.671, 86.327], "c08-013": [87.177, 90.682], "c08-014": [91.032, 99.769], "c08-015": [100.619, 105.581], "c08-016": [106.431, 111.403], "c08-017": [111.753, 115.67], "c08-018": [116.02, 118.227], "c08-019": [118.577, 121.631], "c08-020": [121.981, 126.092], "c08-021": [126.942, 130.94], "c08-022": [131.29, 133.126], "c08-023": [133.476, 138.192], "c08-024": [138.542, 145.308], "c08-025": [145.658, 147.255], "c08-026": [148.105, 150.746], "c08-027": [151.096, 157.554], "c08-028": [157.904, 164.725], "c08-029": [165.575, 174.101], "c08-030": [174.451, 181.725], "c08-031": [182.575, 186.624], "c08-032": [186.974, 189.619], "c08-033": [189.969, 195.996], "c08-034": [196.346, 201.519], "c08-035": [202.369, 205.891], "c08-036": [206.741, 209.871], "c08-037": [210.221, 214.454], "c08-038": [214.804, 220.344], "c08-039": [220.694, 225.242], "c08-040": [226.092, 230.18], "c08-041": [230.53, 242.44], "c08-042": [243.29, 249.295], "c08-043": [249.645, 257.935], "c08-044": [258.785, 266.194], "c08-045": [267.044, 274.956], "c08-046": [275.306, 279.971], "c08-047": [280.321, 288.372], "c08-048": [288.722, 295.356], "c08-049": [296.206, 304.649], "c08-050": [305.499, 307.712], "c08-051": [308.062, 312.704], "c08-052": [313.054, 318.472], "c08-053": [319.322, 323.2]}, "blocks": [{"t": "p", "s": [["c08-001", "太阳升得高高的时候，希腊人和特洛伊人，各自排好了队伍。"]]}, {"t": "img", "src": "images/21.webp?v=5a169c05d2", "vid": "images/21.mp4?v=e650ee5c59", "cap": "两支军队", "n": 44}, {"t": "p", "s": [["c08-002", "希腊人的队伍，像一片金属的海洋。"], ["c08-003", "一队一队的士兵，戴着闪亮的头盔，拿着一人高的大盾牌，长矛像一片树林，竖在空中。"], ["c08-004", "每个国王，站在自己的队伍前面，指挥着他的人。"], ["c08-005", "他们一句话也不说，只能听见脚下的沙子，沙沙地响。"]]}, {"t": "p", "s": [["c08-006", "特洛伊人的队伍，却是吵吵闹闹的。"], ["c08-007", "他们来自很远很远的地方，有的说这种话，有的说那种话，大呼小叫地走着，像一群飞过天空的仙鹤，叫声把大地都震得发抖。"]]}, {"t": "p", "s": [["c08-008", "走在特洛伊队伍最前面的，是帕里斯。"]]}, {"t": "p", "s": [["c08-009", "他披着一张豹皮，背着一把弯弯的弓，腰里挂着一把剑手里挥舞着两支长矛，大声喊着：“希腊人，谁敢来和我单独打一仗？”"]]}, {"t": "p", "s": [["c08-010", "希腊人的队伍里，墨涅拉俄斯一眼就看见了他。"]]}, {"t": "p", "s": [["c08-011", "他就像一头饿了好几天的狮子，看见了一只肥肥的山羊，高兴得眼睛都发亮了。"], ["c08-012", "他从战车上跳下来，大步向帕里斯走去，长矛握得紧紧的。"]]}, {"t": "img", "src": "images/22.webp?v=e1be45d846", "vid": "images/22.mp4?v=7bc507c8e2", "cap": "胆小的帕里斯", "n": 45}, {"t": "p", "s": [["c08-013", "帕里斯看见了他，脸一下子吓得惨白。"], ["c08-014", "他腿一软，转身就往自己的队伍里钻，像一个在山谷里看见了蛇的人，吓得连脚步都乱了。"]]}, {"t": "p", "s": [["c08-015", "赫克托耳在队伍中间看见了弟弟的样子，又气又羞。"]]}, {"t": "p", "s": [["c08-016", "他大声骂道：“帕里斯，你这个漂亮的家伙，空有一张好看的脸！"], ["c08-017", "你抢走了别人的妻子，现在，又不敢面对她的丈夫。"], ["c08-018", "要是你早点死了，该多好！"], ["c08-019", "希腊人看着你，一定会笑得前仰后合。"], ["c08-020", "你以为，你的竖琴、你的头发，能保护你吗？”"]]}, {"t": "p", "s": [["c08-021", "帕里斯红着脸，小声说：“哥哥，你骂得对。"], ["c08-022", "可是，请你不要骂我的好看。"], ["c08-023", "这是金色的阿芙洛狄忒送我的礼物，凡人是不能拒绝神仙的赏赐的。"], ["c08-024", "这样吧，我愿意和墨涅拉俄斯，单独打一场，谁赢了，海伦和所有的财宝，就归谁。"], ["c08-025", "别人，就都不要再打了。”"]]}, {"t": "p", "s": [["c08-026", "赫克托耳一听，高兴极了。"], ["c08-027", "他举起长矛，走到两军中间，大声喊：“希腊人，特洛伊人，请你们停一停！"], ["c08-028", "我的弟弟，想和墨涅拉俄斯单独决斗，谁赢谁就带走海伦，别的人，我们就可以握手言和了！”"]]}, {"t": "img", "src": "images/110.webp?v=50d4ab45a1", "vid": "images/110.mp4?v=faf3110e0e", "cap": "放下武器", "n": 46}, {"t": "p", "s": [["c08-029", "两边的士兵，都放下了长矛，希腊人把盾牌靠在了腿边特洛伊人把弓放了下来。"], ["c08-030", "人们的心里，都升起了一点点希望：要是真的这样，就不用再打下去了。"]]}, {"t": "p", "s": [["c08-031", "墨涅拉俄斯走上前，说：“好，我听见了。"], ["c08-032", "我们谁死谁活，让命运来决定吧。"], ["c08-033", "你们去牵来两只羊，一只白的，一只黑的，我们要在神的面前，立下誓言。"], ["c08-034", "也请国王普里阿摩斯亲自来，因为他的几个儿子，说话是不算数的。”"]]}, {"t": "p", "s": [["c08-035", "特洛伊人的信使，飞快地跑进了城。"]]}, {"t": "p", "s": [["c08-036", "中午的太阳，晒得盾牌发烫。"], ["c08-037", "平原上的小花，被千万只脚踩得低低的。"], ["c08-038", "两边的孩子兵，都咬着嘴唇，把长矛握得紧紧的。"], ["c08-039", "他们的手心全是汗，可是谁也不肯第一个松开。"]]}, {"t": "p", "s": [["c08-040", "这时候，城墙上的老人们，也都出来了。"], ["c08-041", "他们拄着拐杖，坐在城楼的石头上，眯着眼睛，望着远处那一片闪光的队伍，一个一个地数着，心里想着自己年轻时的事。"]]}, {"t": "p", "s": [["c08-042", "特洛伊的号手吹响了铜号，希腊人的号手也吹响了铜号。"], ["c08-043", "两种声音，在天空中碰在一起，又散开了，好像在互相问：“你们准备好了吗？”"]]}, {"t": "p", "s": [["c08-044", "可是这一天，谁也没有想到，第一个走出队伍的人，竟然不是想打仗的人。"]]}, {"t": "img", "src": "images/111.webp?v=12d5c11650", "vid": "images/111.mp4?v=0cfdac32f6", "cap": "举旗的年轻人", "n": 47}, {"t": "p", "s": [["c08-045", "队伍中间，有一位年轻的传令官，捧着一面小小的旗子，不停地擦着额头上的汗。"], ["c08-046", "他是第一次上战场，腿肚子一直在打战。"], ["c08-047", "他的老师傅走过来，拍了拍他的肩膀，笑着说：“怕就对了，只有不怕的人，才最危险。"], ["c08-048", "你记着，眼睛看前面，脚踩稳了，别的事，就交给神仙。”"]]}, {"t": "p", "s": [["c08-049", "年轻人用力地点了点头，把旗子举得高高的，旗子上的穗子，在风里哗啦哗啦地抖。"]]}, {"t": "p", "s": [["c08-050", "风，忽然停了。"], ["c08-051", "远处的旗子，一动也不动，像也屏住了呼吸。"], ["c08-052", "大家都等着，等着看，到底会有谁，第一个迈出那一步。"]]}, {"t": "p", "s": [["c08-053", "那一天，城墙上，站满了人。"]]}]}, {"title": "第九章　城墙上的海伦", "head": "c09-h", "audio": "audio/ch09.m4a?v=80fc2d37b1", "duration": 353.054, "times": {"c09-h": [0.0, 3.105], "c09-001": [4.105, 10.682], "c09-002": [11.532, 19.963], "c09-003": [20.313, 25.013], "c09-004": [25.863, 38.326], "c09-005": [38.676, 45.754], "c09-006": [46.604, 53.986], "c09-007": [54.336, 60.899], "c09-008": [61.749, 64.919], "c09-009": [65.769, 69.155], "c09-010": [69.505, 79.528], "c09-011": [80.378, 93.515], "c09-012": [93.865, 97.146], "c09-013": [97.496, 102.194], "c09-014": [103.044, 109.576], "c09-015": [109.926, 110.862], "c09-016": [111.212, 112.906], "c09-017": [113.256, 115.856], "c09-018": [116.206, 121.277], "c09-019": [122.127, 129.475], "c09-020": [130.325, 131.98], "c09-021": [132.33, 143.661], "c09-022": [144.511, 148.243], "c09-023": [148.593, 150.628], "c09-024": [151.478, 156.399], "c09-025": [156.749, 157.691], "c09-026": [158.041, 165.147], "c09-027": [165.497, 177.301], "c09-028": [178.151, 181.876], "c09-029": [182.226, 183.061], "c09-030": [183.411, 186.39], "c09-031": [187.24, 191.124], "c09-032": [191.974, 198.626], "c09-033": [198.976, 205.301], "c09-034": [206.151, 209.775], "c09-035": [210.625, 213.663], "c09-036": [214.513, 220.246], "c09-037": [220.596, 227.069], "c09-038": [227.419, 238.217], "c09-039": [238.567, 246.763], "c09-040": [247.113, 252.194], "c09-041": [253.044, 256.954], "c09-042": [257.804, 268.494], "c09-043": [268.844, 273.149], "c09-044": [273.999, 277.527], "c09-045": [277.877, 289.07], "c09-046": [289.42, 294.019], "c09-047": [294.869, 299.986], "c09-048": [300.336, 308.221], "c09-049": [308.571, 317.642], "c09-050": [318.492, 323.078], "c09-051": [323.428, 327.6], "c09-052": [327.95, 333.673], "c09-053": [334.023, 338.16], "c09-054": [339.01, 342.731], "c09-055": [343.081, 347.927], "c09-056": [348.777, 351.554]}, "blocks": [{"t": "img", "src": "images/23.webp?v=f88fbf10e5", "vid": "images/23.mp4?v=6c673f498b", "cap": "红披风上的故事", "n": 48}, {"t": "p", "s": [["c09-001", "特洛伊城里，海伦正坐在高高的房间里，织着一块大大的红色披风。"]]}, {"t": "p", "s": [["c09-002", "披风上，绣着特洛伊人和希腊人，一场一场的战争，他们都是为了她，才拿起了武器。"], ["c09-003", "她一针一线地绣着，眼睛里，常常蒙着一层雾。"]]}, {"t": "img", "src": "images/112.webp?v=6275d7d165", "vid": "images/112.mp4?v=645d2f71b4", "cap": "彩虹女神", "n": 49}, {"t": "p", "s": [["c09-004", "这时，彩虹女神伊里斯，变成了国王的女儿的样子，轻轻地推开了门，对她说：“海伦，快来看，特洛伊人和希腊人，不打了。"], ["c09-005", "他们就要比一场，是你的两个丈夫，帕里斯和墨涅拉俄斯，谁赢了，你就是谁的。”"]]}, {"t": "p", "s": [["c09-006", "海伦听了，心里一下子，涌起了对第一个丈夫、对故乡斯巴达、对父母的无限思念。"], ["c09-007", "她拿起白色的面纱，蒙在头上眼泪一颗一颗地，掉了下来。"]]}, {"t": "p", "s": [["c09-008", "她带着两个女仆，快步走向了城门。"]]}, {"t": "img", "src": "images/24.webp?v=84dc577b1e", "vid": "images/24.mp4?v=47ea30fd44", "cap": "城楼上的老人们", "n": 50}, {"t": "p", "s": [["c09-009", "城门楼上，坐着几位白发的老人。"], ["c09-010", "他们年轻的时候，也是勇士，现在老了打不动了，就坐在这里像知了一样，絮絮叨叨地说着话。"]]}, {"t": "p", "s": [["c09-011", "看见海伦走过来，老人们小声地互相说：可是，他们又说：“难怪啊，难怪特洛伊人和希腊人，为了她，打了这么多年。"], ["c09-012", "她走路的样子，真像一位女神。"], ["c09-013", "她要是回到她的家乡去，就好了，别再给我们带来灾难。”"]]}, {"t": "p", "s": [["c09-014", "国王普里阿摩斯，把她叫到了身边，慈祥地说：“来，孩子坐在我这里。"], ["c09-015", "我不怪你。"], ["c09-016", "我只怪神仙。"], ["c09-017", "你看，那边那个人，是谁？"], ["c09-018", "他高高大大的，肩膀宽宽的，像一位国王。”"]]}, {"t": "p", "s": [["c09-019", "海伦说：“那是阿伽门农，他是我的大伯子，是希腊最伟大的国王，也是一位英勇的武士。”"]]}, {"t": "p", "s": [["c09-020", "老国王问：“那个呢？"], ["c09-021", "他比阿伽门农矮一点，可是肩膀宽，胸膛也宽，在队伍里走来走去，像一只头羊，管着一大群羊。”"]]}, {"t": "p", "s": [["c09-022", "海伦说：“他是奥德修斯，伊萨卡的国王。"], ["c09-023", "他很聪明，有很多好主意。”"]]}, {"t": "p", "s": [["c09-024", "一位老人，叫安忒诺耳，在旁边说：“你说得没错。"], ["c09-025", "我见过他。"], ["c09-026", "有一次，他和墨涅拉俄斯，一起来到我们的城里，要求我们还回海伦。"], ["c09-027", "他站着的时候，看起来不起眼，可是，他一开口说话，声音像冬天的雪片一样，一片一片地飘下来，谁也不能和他比。”"]]}, {"t": "img", "src": "images/113.webp?v=b2f3e7ce7d", "vid": "images/113.mp4?v=ca159162a4", "cap": "远处的大个子", "n": 51}, {"t": "p", "s": [["c09-028", "老国王又指着远处一个巨大的身影：“那个呢？"], ["c09-029", "那个是谁？"], ["c09-030", "他的头，比所有的人都高。”"]]}, {"t": "p", "s": [["c09-031", "海伦说：“那是埃阿斯，他是希腊人的一座大城墙。”"]]}, {"t": "p", "s": [["c09-032", "她的眼睛，在人群里，一个一个地找着，找她两个熟悉的哥哥，找不到。"], ["c09-033", "她不知道，他们早就已经死去，葬在了她的家乡斯巴达的土地里。"]]}, {"t": "p", "s": [["c09-034", "她望着远处的人群，轻轻地叹了一口气。"]]}, {"t": "p", "s": [["c09-035", "远处，传来了铜锣的声音。"]]}, {"t": "img", "src": "images/114.webp?v=519d49fc9a", "vid": "images/114.mp4?v=69c9b0bac5", "cap": "立下和约", "n": 52}, {"t": "p", "s": [["c09-036", "两只羊被牵到了战场中间，一只白色的，一只黑色的。"], ["c09-037", "传令官们，把它们的毛，剪下来一小撮，分给两边的国王。"], ["c09-038", "阿伽门农拔出短剑，割下了一些羊毛，高高地举起手，向天上，大声祈祷：“众神之父宙斯，啊，请你做证！"], ["c09-039", "如果墨涅拉俄斯杀死了帕里斯，海伦和她所有的财产，就应该还给我们，特洛伊人还要赔偿一份礼物。"], ["c09-040", "要是帕里斯杀死了墨涅拉俄斯，我们就带着船，回自己的家乡！”"]]}, {"t": "p", "s": [["c09-041", "誓言说完，羊被杀死酒洒在了地上。"]]}, {"t": "p", "s": [["c09-042", "老国王普里阿摩斯，心里有一个很不好的预感，他对大家说：“我不想亲眼看着我的儿子被杀，我先回城了。"], ["c09-043", "宙斯才知道，他们两个人当中，谁会死。”"]]}, {"t": "p", "s": [["c09-044", "她的手指，在织布机上微微发抖。"], ["c09-045", "她想起了斯巴达那座白色的宫殿，想起了窗前那一株老橄榄树，想起了小时候和哥哥们在河边跑来跑去的日子。"], ["c09-046", "那些日子，已经很远很远了，远得像一场梦。"]]}, {"t": "p", "s": [["c09-047", "可是，她又想起了自己的女儿，赫耳弥俄涅。"], ["c09-048", "离开家的时候，那个小姑娘才这么高，抱着她的衣角，一直哭，一直哭。"], ["c09-049", "想到这里，海伦的眼泪，大颗大颗地掉在了红色的披风上，把那一小块布，染得更深了。"]]}, {"t": "p", "s": [["c09-050", "她一边走，一边听见街上的人们，在小声地议论。"], ["c09-051", "有人叹着气，说：“都十年了，什么时候是个头呀。”"], ["c09-052", "有人说：“听说，今天，两位国王要比一场，赢的人带走海伦。”"], ["c09-053", "还有人，从窗户里探出头来，偷偷地看她。"]]}, {"t": "p", "s": [["c09-054", "海伦把面纱拉得低低的，一句话也没有说。"], ["c09-055", "她知道，每一个人，心里都在想着同一件事。"]]}, {"t": "p", "s": [["c09-056", "他坐上马车，慢慢地回去了。"]]}]}, {"title": "第十章　一对一的决斗", "head": "c10-h", "audio": "audio/ch10.m4a?v=135d34126e", "duration": 343.625, "times": {"c10-h": [0.0, 3.108], "c10-001": [4.108, 8.991], "c10-002": [9.341, 17.288], "c10-003": [18.138, 20.498], "c10-004": [21.348, 22.664], "c10-005": [23.514, 32.321], "c10-006": [32.671, 34.52], "c10-007": [35.37, 37.942], "c10-008": [38.292, 46.014], "c10-009": [46.864, 55.063], "c10-010": [55.913, 65.356], "c10-011": [65.706, 68.675], "c10-012": [69.525, 78.437], "c10-013": [78.787, 82.011], "c10-014": [82.861, 89.353], "c10-015": [89.703, 98.294], "c10-016": [99.144, 102.466], "c10-017": [103.316, 107.645], "c10-018": [107.995, 112.778], "c10-019": [113.128, 117.419], "c10-020": [118.269, 124.478], "c10-021": [125.328, 127.97], "c10-022": [128.82, 138.096], "c10-023": [138.446, 141.384], "c10-024": [142.234, 154.853], "c10-025": [155.703, 163.903], "c10-026": [164.253, 166.188], "c10-027": [166.538, 169.02], "c10-028": [169.87, 173.368], "c10-029": [173.718, 179.909], "c10-030": [180.759, 182.639], "c10-031": [182.989, 187.917], "c10-032": [188.767, 195.128], "c10-033": [195.978, 198.705], "c10-034": [199.055, 201.714], "c10-035": [202.064, 207.815], "c10-036": [208.665, 211.502], "c10-037": [211.852, 214.867], "c10-038": [215.217, 217.232], "c10-039": [217.582, 219.281], "c10-040": [220.131, 223.071], "c10-041": [223.921, 230.392], "c10-042": [230.742, 236.569], "c10-043": [237.419, 242.435], "c10-044": [242.785, 244.228], "c10-045": [244.578, 248.207], "c10-046": [249.057, 255.992], "c10-047": [256.842, 259.465], "c10-048": [259.815, 264.537], "c10-049": [264.887, 271.445], "c10-050": [271.795, 274.966], "c10-051": [275.816, 281.973], "c10-052": [282.323, 286.562], "c10-053": [286.912, 291.965], "c10-054": [292.815, 300.384], "c10-055": [300.734, 308.028], "c10-056": [308.378, 311.213], "c10-057": [311.563, 317.8], "c10-058": [318.65, 325.643], "c10-059": [325.993, 328.724], "c10-060": [329.074, 335.059], "c10-061": [335.909, 342.125]}, "blocks": [{"t": "img", "src": "images/25.webp?v=621b721389", "vid": "images/25.mp4?v=f5ed7fbb9f", "cap": "决斗开始", "n": 53}, {"t": "p", "s": [["c10-001", "赫克托耳和奥德修斯，在战场中间，量好了一块空地。"], ["c10-002", "他们把两块石头，放进头盔里，摇了摇，一块跳出来的石头，决定了谁先扔长矛。"]]}, {"t": "p", "s": [["c10-003", "石头，是帕里斯的。"]]}, {"t": "p", "s": [["c10-004", "人们全都安静了。"]]}, {"t": "p", "s": [["c10-005", "帕里斯和墨涅拉俄斯，各自穿上盔甲，戴上头盔，慢慢地走到了场地中间，怒目相视。"], ["c10-006", "大地都好像不敢出声。"]]}, {"t": "img", "src": "images/115.webp?v=b354e249f8", "vid": "images/115.mp4?v=20d55fc532", "cap": "掷出长矛", "n": 54}, {"t": "p", "s": [["c10-007", "帕里斯抢先掷出了长矛。"], ["c10-008", "长矛飞过去，砰的一声，撞在墨涅拉俄斯的圆盾上，长矛的头，一下子弯了。"]]}, {"t": "p", "s": [["c10-009", "墨涅拉俄斯举起长矛，向天空祈祷：“宙斯，请您帮我，让这个抢了我妻子的人，得到教训。”"]]}, {"t": "p", "s": [["c10-010", "他一用力长矛像一道闪电，穿过了帕里斯的盾牌，穿过了铠甲，只差一点点，就刺到了他的身体。"], ["c10-011", "帕里斯一闪身，才躲了过去。"]]}, {"t": "p", "s": [["c10-012", "墨涅拉俄斯又拔出了长剑，冲上去，用力一砍，剑一下子断成了四截，落在了地上。"], ["c10-013", "他气得大叫：“宙斯，您为什么和我作对？”"]]}, {"t": "p", "s": [["c10-014", "他一把抓住了帕里斯头盔上的马鬃，用力一拖，把他拖到了希腊人的这一边。"], ["c10-015", "头盔的皮带，勒在帕里斯的脖子上，他喘不过气来，两只手乱抓，脸涨得通红。"]]}, {"t": "p", "s": [["c10-016", "眼看，墨涅拉俄斯就要赢了。"]]}, {"t": "img", "src": "images/116.webp?v=ad75b446d3", "vid": "images/116.mp4?v=cc58dfd199", "cap": "白鸽飘来", "n": 55}, {"t": "p", "s": [["c10-017", "就在这个时候阿芙洛狄忒，悄悄地飞了下来。"], ["c10-018", "她轻轻地一扯，那根皮带，啪的一声，断了。"], ["c10-019", "墨涅拉俄斯手里，只剩下一个空空的头盔。"]]}, {"t": "p", "s": [["c10-020", "他气得把头盔扔进了希腊人的队伍里，转身，又提着长矛追过去。"]]}, {"t": "p", "s": [["c10-021", "可是，帕里斯不见了。"]]}, {"t": "img", "src": "images/26.webp?v=733baa5c73", "vid": "images/26.mp4?v=fb7dd2c022", "cap": "女神救走了帕里斯", "n": 56}, {"t": "p", "s": [["c10-022", "阿芙洛狄忒在他的身上罩上了一层浓浓的雾，带着他飞回了城里，轻轻地放在了他的床上。"], ["c10-023", "房间里，弥漫着甜甜的香气。"]]}, {"t": "p", "s": [["c10-024", "她又变成一个老妇人的样子，去找海伦，对她说：“帕里斯在房间里等你呢，他看起来，一点也不像刚打了一场仗，倒像是要去参加舞会。”"]]}, {"t": "p", "s": [["c10-025", "海伦一看见她那闪闪发光的眼睛，就认出来了，她生气地说：“女神，你总是骗我。"], ["c10-026", "你想让我再到什么地方去？"], ["c10-027", "我才不去，我不想再服侍他了。”"]]}, {"t": "p", "s": [["c10-028", "阿芙洛狄忒的脸一沉，说：“不许顶嘴！"], ["c10-029", "要是你再惹我生气，我就让你恨所有的人，让你两边都不讨好。”"]]}, {"t": "p", "s": [["c10-030", "海伦吓得浑身发抖。"], ["c10-031", "她披上白色的面纱，一声不响地，跟着女神走了。"]]}, {"t": "p", "s": [["c10-032", "房间里，帕里斯坐在床上漂亮的脸上，一点羞愧的神色也没有。"]]}, {"t": "img", "src": "images/117.webp?v=9190f9cb40", "vid": "images/117.mp4?v=b9a0b24c29", "cap": "海伦的责备", "n": 57}, {"t": "p", "s": [["c10-033", "海伦瞪着他，说：“你回来了。"], ["c10-034", "你为什么不死在那个人的手里呢？"], ["c10-035", "以前，你总是说，你比他强，现在，你去叫他再来打一次呀。”"]]}, {"t": "p", "s": [["c10-036", "帕里斯笑着说：“亲爱的，别生气。"], ["c10-037", "这一次，他靠雅典娜的帮助，赢了我。"], ["c10-038", "下一次，我也会有神的帮助。"], ["c10-039", "来，我们不要说这些了。”"]]}, {"t": "p", "s": [["c10-040", "海伦低下了头，一句话也没说。"]]}, {"t": "p", "s": [["c10-041", "战场上，墨涅拉俄斯像一头野兽，在人群里，找来找去。"], ["c10-042", "可是，没有一个特洛伊人，能告诉他，帕里斯在哪里。"]]}, {"t": "p", "s": [["c10-043", "阿伽门农举起手，大声宣布：“特洛伊人，你们都看见了。"], ["c10-044", "墨涅拉俄斯赢了。"], ["c10-045", "你们把海伦和财宝还回来，再赔偿一份礼物吧！”"]]}, {"t": "p", "s": [["c10-046", "希腊人的队伍里，爆发出一阵欢呼，像潮水一样，向天空涌去。"]]}, {"t": "img", "src": "images/216.webp?v=8ea9bc0ddd", "vid": "images/216.mp4?v=99dc01589c", "cap": "等待的人群", "n": 58}, {"t": "p", "s": [["c10-047", "看台上的人，都伸长了脖子。"], ["c10-048", "有的老爷爷，激动得把手里的拐杖，掉在了地上。"], ["c10-049", "有的小孩子，躲在妈妈的怀里，只露出一只眼睛来偷偷地看。"], ["c10-050", "大家的心，都提到了嗓子眼。"]]}, {"t": "p", "s": [["c10-051", "天空忽然暗了一下，有一片云，从太阳前面慢慢地飘过去。"], ["c10-052", "风把战场上的尘土，卷成了一个个小小的漩涡。"], ["c10-053", "就连两匹拉车的马，也不安地打着响鼻，用蹄子刨着地。"]]}, {"t": "p", "s": [["c10-054", "墨涅拉俄斯的手，微微地发着抖，不是因为怕，而是因为盼了太久。"], ["c10-055", "十年了，他每一天，都想象着今天，想象着自己站在这里，面对着那个人。"], ["c10-056", "现在，那一天终于到了。"], ["c10-057", "他深深地吸了一口气，在心里，对自己说：“稳住，稳住，就这一次。”"]]}, {"t": "p", "s": [["c10-058", "有一个小男孩，爬到了城墙最高的垛口上，被他的妈妈，一把抱了下来。"], ["c10-059", "妈妈说：“别看，别看，会做噩梦的。”"], ["c10-060", "可是，小男孩，还是从指缝里，偷偷地望着远处。"]]}, {"t": "p", "s": [["c10-061", "谁也没有想到，天上的赫拉，却对这样的结局，很不满意。"]]}]}, {"title": "第十一章　被打破的和约", "head": "c11-h", "audio": "audio/ch11.m4a?v=b7ee285fdb", "duration": 353.922, "times": {"c11-h": [0.0, 3.097], "c11-001": [4.097, 7.584], "c11-002": [8.434, 18.769], "c11-003": [19.119, 28.755], "c11-004": [29.605, 32.502], "c11-005": [32.852, 35.563], "c11-006": [35.913, 42.943], "c11-007": [43.793, 51.096], "c11-008": [51.446, 58.571], "c11-009": [59.421, 64.092], "c11-010": [64.442, 66.824], "c11-011": [67.674, 72.241], "c11-012": [73.091, 79.331], "c11-013": [79.681, 86.452], "c11-014": [87.302, 91.426], "c11-015": [91.776, 97.149], "c11-016": [97.499, 99.85], "c11-017": [100.7, 102.122], "c11-018": [102.472, 107.246], "c11-019": [108.096, 111.079], "c11-020": [111.929, 116.187], "c11-021": [116.537, 130.357], "c11-022": [131.207, 136.377], "c11-023": [137.227, 139.735], "c11-024": [140.085, 142.984], "c11-025": [143.334, 144.549], "c11-026": [144.899, 148.816], "c11-027": [149.166, 152.76], "c11-028": [153.61, 157.743], "c11-029": [158.093, 160.154], "c11-030": [161.004, 170.492], "c11-031": [171.342, 174.566], "c11-032": [175.416, 179.742], "c11-033": [180.092, 183.908], "c11-034": [184.258, 187.527], "c11-035": [188.377, 196.087], "c11-036": [196.937, 201.185], "c11-037": [201.535, 205.716], "c11-038": [206.566, 211.118], "c11-039": [211.468, 214.375], "c11-040": [214.725, 217.958], "c11-041": [218.808, 220.628], "c11-042": [220.978, 227.117], "c11-043": [227.967, 236.856], "c11-044": [237.706, 246.635], "c11-045": [246.985, 252.613], "c11-046": [252.963, 253.768], "c11-047": [254.618, 261.186], "c11-048": [262.036, 269.794], "c11-049": [270.644, 276.852], "c11-050": [277.202, 282.829], "c11-051": [283.179, 287.651], "c11-052": [288.501, 291.92], "c11-053": [292.27, 297.418], "c11-054": [297.768, 301.705], "c11-055": [302.555, 306.302], "c11-056": [306.652, 312.536], "c11-057": [312.886, 328.667], "c11-058": [329.517, 332.333], "c11-059": [332.683, 342.438], "c11-060": [343.288, 352.422]}, "blocks": [{"t": "img", "src": "images/118.webp?v=2232cf0652", "vid": "images/118.mp4?v=8a3a47c630", "cap": "众神观战", "n": 59}, {"t": "p", "s": [["c11-001", "奥林匹斯山上，众神也在看着战场。"]]}, {"t": "p", "s": [["c11-002", "宙斯坐在金色的宝座上，慢悠悠地对赫拉说：“你看，墨涅拉俄斯赢了，海伦应该还给他。"], ["c11-003", "要不然，我们就让两边和好吧，让特洛伊城，平平安安地留着，让人们都过上好日子。”"]]}, {"t": "p", "s": [["c11-004", "赫拉一听，气得脸都红了。"], ["c11-005", "她大声说：“你怎么能说出这样的话？"], ["c11-006", "我为了毁掉特洛伊，跑来跑去，累得马都喘不过气，现在，你却要放过它？”"]]}, {"t": "p", "s": [["c11-007", "宙斯叹了一口气，说：“好吧，赫拉，你要毁掉它，我不拦你。"], ["c11-008", "可是，下一次，我要毁掉你最喜欢的城市，你也不要拦我。”"]]}, {"t": "p", "s": [["c11-009", "赫拉说：“好，我最喜欢的三座城，你想毁就毁。"], ["c11-010", "可是这一次，你要让我满意。”"]]}, {"t": "p", "s": [["c11-011", "宙斯就派雅典娜，去战场上，搅乱和约。"]]}, {"t": "img", "src": "images/27.webp?v=0ba55e1949", "vid": "images/27.mp4?v=3a51b5dc02", "cap": "偷偷射出的箭", "n": 60}, {"t": "p", "s": [["c11-012", "雅典娜变成了一个特洛伊战士的样子，走到了一个叫潘达洛斯的人身边。"], ["c11-013", "潘达洛斯是一个出色的射手，手里有一把弓是用野山羊的角做的。"]]}, {"t": "p", "s": [["c11-014", "她小声说：“潘达洛斯，你愿意一举成名吗？"], ["c11-015", "要是你能射中墨涅拉俄斯，帕里斯一定会送你一份丰厚的礼物。"], ["c11-016", "快，对准他，射吧！”"]]}, {"t": "p", "s": [["c11-017", "潘达洛斯被说动了。"], ["c11-018", "他拉开弓，把箭搭在了弦上嗖的一声，射了出去。"]]}, {"t": "p", "s": [["c11-019", "箭在空气里发出尖尖的呼啸。"]]}, {"t": "p", "s": [["c11-020", "可是，雅典娜伸出手，轻轻地拨了一下。"], ["c11-021", "她就像一位妈妈，赶走了落在孩子脸上的苍蝇，那支箭，偏了一点，射中了墨涅拉俄斯腰带上的扣子，穿过了铠甲，只划破了一点点皮。"]]}, {"t": "p", "s": [["c11-022", "红色的血，一滴一滴，顺着他的腿，流了下来。"]]}, {"t": "p", "s": [["c11-023", "阿伽门农一看，吓坏了。"], ["c11-024", "他抓住弟弟的手，大声说：“弟弟！"], ["c11-025", "我的好弟弟！"], ["c11-026", "我们刚刚立过誓，现在，他们就用箭射你。"], ["c11-027", "要是你死了，我回到希腊，怎么向人们交代？”"]]}, {"t": "p", "s": [["c11-028", "墨涅拉俄斯说：“哥哥，别怕，没什么大事。"], ["c11-029", "箭上的金腰带，挡住了。”"]]}, {"t": "img", "src": "images/119.webp?v=91487724c5", "vid": "images/119.mp4?v=1b52316b5f", "cap": "医生的药", "n": 61}, {"t": "p", "s": [["c11-030", "阿伽门农这才松了口气，叫来了医生马卡昂，拔出了箭，敷上了一种神奇的药粉，血很快就止住了。"]]}, {"t": "p", "s": [["c11-031", "可是，和平，已经完了。"]]}, {"t": "p", "s": [["c11-032", "希腊人又拿起了武器，一队一队地冲上了战场。"], ["c11-033", "阿伽门农坐在战车上来回地巡视着队伍。"], ["c11-034", "他对每一位国王都说着鼓励的话。"]]}, {"t": "p", "s": [["c11-035", "他看见奥德修斯，正站在队伍里一动不动，就对他说：“你为什么站在这里发呆，不和大家一起冲呢？”"]]}, {"t": "p", "s": [["c11-036", "奥德修斯瞪着他，说：“阿伽门农，你说的什么话？"], ["c11-037", "等你看见我冲在最前面的时候，你就会知道，我是不是怕。”"]]}, {"t": "p", "s": [["c11-038", "阿伽门农一听，马上笑着说：“对不起，我说错了。"], ["c11-039", "我知道你的心，永远和我的心一样。"], ["c11-040", "你肯定不会，在战场上落在别人的后面。”"]]}, {"t": "p", "s": [["c11-041", "他又去找狄奥墨得斯。"], ["c11-042", "年轻的狄奥墨得斯，站在战车旁边静静地听着，一句话也不反驳。"]]}, {"t": "p", "s": [["c11-043", "只有他的朋友斯特涅罗斯，不服气地说：“元帅，请你不要说谎，我们比我们的父辈，更勇敢。”"]]}, {"t": "p", "s": [["c11-044", "狄奥墨得斯却把他拉到了一边，小声说：“朋友，别生气，元帅这样说，是为了鼓励我们。"], ["c11-045", "要是我们打赢了，光荣是他的；要是我们打输了，伤心的，也是他。"], ["c11-046", "我们去战斗吧。”"]]}, {"t": "p", "s": [["c11-047", "说完，他从战车上跳了下来，盔甲在胸前碰出一阵叮当的声响。"]]}, {"t": "img", "src": "images/120.webp?v=a81412cf11", "vid": "images/120.mp4?v=2e3da817e0", "cap": "两军相撞", "n": 62}, {"t": "p", "s": [["c11-048", "大地震动了，两支大军，像两堵高高的海浪，轰的一声，撞在了一起。"]]}, {"t": "p", "s": [["c11-049", "医生马卡昂检查伤口的时候，墨涅拉俄斯一直盯着远处的特洛伊城。"], ["c11-050", "他的脸上，没有一点痛苦的样子，只有一种说不出的气愤。"], ["c11-051", "他想：我是来讲道理的，他们却先用了箭。"]]}, {"t": "p", "s": [["c11-052", "这样的事，被所有的希腊人看在眼里。"], ["c11-053", "刚才还在握手的士兵们，现在，都重新拿起了长矛。"], ["c11-054", "他们说，既然对方不讲信用，我们也不用再客气了。"]]}, {"t": "p", "s": [["c11-055", "医生用温水，轻轻地擦着伤口周围的血。"], ["c11-056", "他一边擦，一边说：“国王，这点伤，不碍事，您放心。”"], ["c11-057", "可是，墨涅拉俄斯一句话也听不进去，他的眼睛，一直望着特洛伊人的队伍，那里，一个个黑色的影子，正在慢慢地移动，像一片渐渐涨起来的潮水。"]]}, {"t": "p", "s": [["c11-058", "远处的号角，又一次响了起来。"], ["c11-059", "这一次，不是和平的号角，而是战争的号角，粗粗的，低低的，在平原的上空，一圈一圈地荡开。"]]}, {"t": "p", "s": [["c11-060", "这一天，战场上，没有谁赢，也没有谁输，只有一片又一片的尘土，在阳光里飘着。"]]}]}, {"title": "第十二章　狄奥墨得斯的怒火", "head": "c12-h", "audio": "audio/ch12.m4a?v=f9e3f03743", "duration": 357.253, "times": {"c12-h": [0.0, 3.751], "c12-001": [4.751, 8.492], "c12-002": [9.342, 17.83], "c12-003": [18.18, 21.659], "c12-004": [22.509, 30.621], "c12-005": [30.971, 34.801], "c12-006": [35.651, 41.653], "c12-007": [42.003, 48.546], "c12-008": [49.396, 55.279], "c12-009": [56.129, 58.843], "c12-010": [59.193, 69.279], "c12-011": [70.129, 76.532], "c12-012": [76.882, 83.851], "c12-013": [84.201, 91.452], "c12-014": [92.302, 94.51], "c12-015": [95.36, 104.002], "c12-016": [104.352, 109.763], "c12-017": [110.613, 114.527], "c12-018": [115.377, 117.897], "c12-019": [118.247, 121.803], "c12-020": [122.153, 131.928], "c12-021": [132.778, 138.178], "c12-022": [139.028, 146.688], "c12-023": [147.538, 157.82], "c12-024": [158.67, 164.7], "c12-025": [165.05, 173.227], "c12-026": [174.077, 185.251], "c12-027": [185.601, 189.896], "c12-028": [190.746, 195.593], "c12-029": [196.443, 205.9], "c12-030": [206.75, 210.742], "c12-031": [211.592, 214.56], "c12-032": [214.91, 221.912], "c12-033": [222.262, 234.392], "c12-034": [235.242, 245.978], "c12-035": [246.328, 251.103], "c12-036": [251.953, 258.923], "c12-037": [259.773, 275.07], "c12-038": [275.92, 277.702], "c12-039": [278.552, 284.108], "c12-040": [284.458, 289.98], "c12-041": [290.33, 294.225], "c12-042": [295.075, 302.523], "c12-043": [302.873, 308.229], "c12-044": [309.079, 317.011], "c12-045": [317.361, 323.05], "c12-046": [323.9, 331.964], "c12-047": [332.814, 337.028], "c12-048": [337.378, 342.672], "c12-049": [343.022, 348.016], "c12-050": [348.866, 355.753]}, "blocks": [{"t": "p", "s": [["c12-001", "雅典娜给了狄奥墨得斯格外的力量。"]]}, {"t": "img", "src": "images/28.webp?v=db1225e4ea", "vid": "images/28.mp4?v=d9f4d8146e", "cap": "燃烧的狄奥墨得斯", "n": 63}, {"t": "p", "s": [["c12-002", "她让他的头盔和盾牌上，冒出一道道火焰，像夏末的天狼星，在天空中，亮闪闪的。"], ["c12-003", "狄奥墨得斯冲进了人群最密的地方。"]]}, {"t": "p", "s": [["c12-004", "他像一条涨满了水的河，冲过堤坝，没有一座桥，没有一道篱笆，能挡得住他。"], ["c12-005", "特洛伊人的队伍，被他冲出了一个大大的缺口。"]]}, {"t": "img", "src": "images/121.webp?v=70e0c9c9b5", "vid": "images/121.mp4?v=d5b62bcd47", "cap": "神箭手", "n": 64}, {"t": "p", "s": [["c12-006", "特洛伊有一个神箭手，名叫潘达洛斯，就是刚才射伤墨涅拉俄斯的人。"], ["c12-007", "他看见了狄奥墨得斯，马上拉开弓，射了一箭，射中了他的肩膀。"]]}, {"t": "p", "s": [["c12-008", "潘达洛斯高兴得大叫：“特洛伊人，快来，我射中了希腊最勇敢的人！”"]]}, {"t": "p", "s": [["c12-009", "狄奥墨得斯却一点也不怕。"], ["c12-010", "他从战车上跳下来，让朋友斯特涅罗斯帮他拔出了箭，向雅典娜祈祷：“女神，请您帮助我，让我杀死那个射箭的人。”"]]}, {"t": "p", "s": [["c12-011", "雅典娜说：“别怕，狄奥墨得斯，我给了你和你父亲一样的勇气。"], ["c12-012", "我还把你眼睛里的雾，拨开了，让你能看清，哪个是神，哪个是人。"], ["c12-013", "你只要记住：别和神仙打架，只有阿芙洛狄忒，你可以用你的长矛，刺她一下。”"]]}, {"t": "p", "s": [["c12-014", "狄奥墨得斯又冲了上去。"]]}, {"t": "p", "s": [["c12-015", "特洛伊人里，有一位英雄，叫埃涅阿斯，他是阿芙洛狄忒的儿子，也是潘达洛斯的朋友。"], ["c12-016", "他对潘达洛斯说：“来，我们俩一起，坐我的战车，去对付他。”"]]}, {"t": "p", "s": [["c12-017", "两个人的战车，向狄奥墨得斯冲了过来。"]]}, {"t": "p", "s": [["c12-018", "狄奥墨得斯没有后退。"], ["c12-019", "他用力投出一支长矛，击倒了潘达洛斯。"], ["c12-020", "他又捡起一块大石头，那块石头，现在的人两个人也抬不动，他一个人，轻轻地举了起来，砸向了埃涅阿斯。"]]}, {"t": "p", "s": [["c12-021", "埃涅阿斯被砸倒在地上眼前一片黑暗，几乎要死去。"]]}, {"t": "p", "s": [["c12-022", "阿芙洛狄忒心疼极了，她飞下来，用白白的手臂，抱住了她的儿子，想把他带走。"]]}, {"t": "img", "src": "images/29.webp?v=1a94d30c9d", "vid": "images/29.mp4?v=2c1d62be6e", "cap": "女神的手", "n": 65}, {"t": "p", "s": [["c12-023", "狄奥墨得斯记得雅典娜的话，他追了上去，用长矛，在女神那只娇嫩的手上，轻轻地划了一下。"]]}, {"t": "p", "s": [["c12-024", "神的手上，流出来的血，不是红色的，是淡淡的金色。"], ["c12-025", "阿芙洛狄忒尖叫一声，松开了手，哭着，飞回了奥林匹斯山，扑进了妈妈的怀里。"]]}, {"t": "img", "src": "images/122.webp?v=2d13591d09", "vid": "images/122.mp4?v=b9406c2281", "cap": "女神哭泣", "n": 66}, {"t": "p", "s": [["c12-026", "宙斯看见她哭得那样伤心，不由得笑了，说：“孩子，打仗不是你的事，你的事，是爱和美。"], ["c12-027", "战争，就让阿瑞斯和雅典娜去管吧。”"]]}, {"t": "p", "s": [["c12-028", "雅典娜在一边捂着嘴笑，赫拉也偷偷地笑。"]]}, {"t": "p", "s": [["c12-029", "这时，阿波罗，把受了伤的埃涅阿斯，藏在了一团云里，带回了自己的神庙里，让他在那里养伤。"]]}, {"t": "p", "s": [["c12-030", "战场上，到处都是狄奥墨得斯的影子。"]]}, {"t": "p", "s": [["c12-031", "他杀得特洛伊人，节节败退。"], ["c12-032", "连阿瑞斯，那位又高又壮、全身披着铁甲的战神，也被他刺伤了。"], ["c12-033", "阿瑞斯疼得大叫，叫声像九千个人、一万个人，一起喊出来的那样响，他像一团黑云，飞回了奥林匹斯山，向宙斯告状。"]]}, {"t": "p", "s": [["c12-034", "可是，宙斯连看也没有看他一眼，说：“你这个家伙，最喜欢吵吵闹闹，我最讨厌你。"], ["c12-035", "你的伤，等一会儿，让医神去治吧。”"]]}, {"t": "p", "s": [["c12-036", "战场上，赫克托耳，已经看出来，特洛伊人再这样下去，会输得很惨。"]]}, {"t": "img", "src": "images/123.webp?v=ba284c9852", "vid": "images/123.mp4?v=5e53458c00", "cap": "预言家的劝告", "n": 67}, {"t": "p", "s": [["c12-037", "他的弟弟，预言家赫勒诺斯，走过来，对他说：“哥哥，你快回城，去告诉母亲，叫城里的老太太们，带着最漂亮的长袍，到雅典娜的神庙里去，求女神，让狄奥墨得斯不要再打了。”"]]}, {"t": "p", "s": [["c12-038", "赫克托耳点了点头。"]]}, {"t": "p", "s": [["c12-039", "狄奥墨得斯的盔甲上，溅满了泥点，可他一点也不在意。"], ["c12-040", "他的脸，被火光映得红红的，眼睛亮得像两颗星星。"], ["c12-041", "他一边冲，一边大声地喊：“跟上我，不要停！”"]]}, {"t": "p", "s": [["c12-042", "他身后的希腊人，像被一根看不见的绳子拉着，一个个紧紧地跟着他。"], ["c12-043", "他们的脚步声，咚咚咚，咚咚咚，像一面巨大的鼓。"]]}, {"t": "p", "s": [["c12-044", "狄奥墨得斯的朋友斯特涅罗斯，紧紧地跟在他身后，举着盾牌，替他挡着飞来的石头。"], ["c12-045", "他一边挡，一边笑着说：“喂，你慢一点，我的腿，都快跑断了！”"]]}, {"t": "p", "s": [["c12-046", "狄奥墨得斯回头，对他笑了一下，说：“再坚持一会儿，等今天过去，我请你喝最好的酒。”"]]}, {"t": "p", "s": [["c12-047", "战场上的风，吹得人的眼睛，睁不开。"], ["c12-048", "可是，狄奥墨得斯，一直把眼睛，睁得大大的。"], ["c12-049", "他的脑子里，只想着一件事：保护身后的朋友们。"]]}, {"t": "p", "s": [["c12-050", "他从战车上跳下来，大声喊了几句话，鼓励大家，然后，转身向城里走去。"]]}]}, {"title": "第十三章　赫克托耳和安德洛玛刻", "head": "c13-h", "audio": "audio/ch13.m4a?v=a164329561", "duration": 376.767, "times": {"c13-h": [0.0, 4.393], "c13-001": [5.393, 9.798], "c13-002": [10.648, 15.874], "c13-003": [16.224, 17.156], "c13-004": [17.506, 18.529], "c13-005": [18.879, 23.578], "c13-006": [24.428, 31.217], "c13-007": [32.067, 38.924], "c13-008": [39.274, 41.594], "c13-009": [41.944, 47.987], "c13-010": [48.837, 55.261], "c13-011": [55.611, 60.97], "c13-012": [61.32, 67.151], "c13-013": [68.001, 6 c13-002", "妈妈们和妻子们，抱着孩子，焦急地问：“我的丈夫呢？"], ["c13-003", "我的儿子呢？"], ["c13-004", "他们还好吗？”"], ["c13-005", "赫克托耳不敢多说，只是对她们说：“快去向神祈祷吧。”"]]}, {"t": "img", "src": "images/30.webp?v=c6d060f888", "vid": "images/30.mp4?v=621ed492de", "cap": "母亲和儿子", "n": 68}, {"t": "p", "s": [["c13-006", "他走进了王宫，在金色的大厅里，他看见了母亲，老王后赫卡柏。"]]}, {"t": "p", "s": [["c13-007", "母亲一把抱住了他的手，说：“孩子，你怎么从战场上回来了？"], ["c13-008", "是不是敌人把你逼回来的？"], ["c13-009", "来，我给你倒一杯甜甜的酒，喝完了，再去祈祷。”"]]}, {"t": "p", "s": [["c13-010", "赫克托耳摇了摇头，说：“妈妈，我手上沾着血和尘土，不能向神祈祷。"], ["c13-011", "请您带着城里年纪最大的女人们，拿着您最漂亮的那件袍子，去求雅典娜吧。"], ["c13-012", "我还要去叫帕里斯，他这个家伙，像一个躲在家里的孩子，一点也不想去打仗。”"]]}, {"t": "p", "s": [["c13-013", "老王后答应了。"], ["c13-014", "她带着女人们，抬着最美丽的长袍，走进了雅典娜的神庙，把袍子，披在了女神的膝头，向她祈祷：“请您帮助我们，折断狄奥墨得斯的长矛。”"]]}, {"t": "p", "s": [["c13-015", "可是，雅典娜，微微地偏过了头，没有答应。"]]}, {"t": "img", "src": "images/124.webp?v=8ca8ca168e", "vid": "images/124.mp4?v=b151dc5848", "cap": "帕里斯的家", "n": 69}, {"t": "p", "s": [["c13-016", "赫克托耳走进了帕里斯的家。"], ["c13-017", "他看见帕里斯，正坐在那里擦着盔甲，海伦和女仆们，坐在一边织着布。"]]}, {"t": "p", "s": [["c13-018", "赫克托耳说：“你为什么坐在这里？"], ["c13-019", "你的同胞，正在城外死去，你却躲在这里生闷气。"], ["c13-020", "你快去吧，再不去，这座城就要被烧毁了！”"]]}, {"t": "p", "s": [["c13-021", "帕里斯红了脸，站了起来，说：“哥哥，你骂得对，我没有生气，我只是很难过。"], ["c13-022", "我现在就穿好盔甲，追你去。”"]]}, {"t": "p", "s": [["c13-023", "海伦看着赫克托耳，轻轻地说：“我的好大伯，请你坐下来歇一歇吧。"], ["c13-024", "你是最辛苦的人，所有的苦，都是因为我，和这个没有出息的人。”"]]}, {"t": "p", "s": [["c13-025", "赫克托耳摇了摇头，说：“海伦，请别让我坐，我不能停下来。"], ["c13-026", "我要回家，再看一眼我的妻子和孩子。"], ["c13-027", "因为我不知道，我还会不会回来。”"]]}, {"t": "p", "s": [["c13-028", "他快步走回了家，可是，屋子里，空空的，没有人。"]]}, {"t": "p", "s": [["c13-029", "一个女仆告诉他：“她听说希腊人占了上风，带着孩子，到城墙上去了。”"]]}, {"t": "p", "s": [["c13-030", "赫克托耳转身就往城门跑。"], ["c13-031", "就在城门口他看见了安德洛玛刻。"], ["c13-032", "她抱着孩子，快步跑了过来，后面，跟着保姆。"]]}, {"t": "img", "src": "images/125.webp?v=421d57c3bd", "vid": "images/125.mp4?v=3c2922a2a4", "cap": "城墙上的告别", "n": 70}, {"t": "p", "s": [["c13-033", "安德洛玛刻一把抓住了他的手，流着泪，说：“我的丈夫，你这样勇敢，会害死你的。"], ["c13-034", "你不可怜你的孩子，也不可怜我吗？"], ["c13-035", "我的父亲和七个兄弟，都被阿喀琉斯杀死了。"], ["c13-036", "我的妈妈，也死了。"], ["c13-037", "你就是我的父亲、我的母亲、我的兄弟，也是我的丈夫。"], ["c13-038", "求你，留在城墙上吧，别再冲出去了。”"]]}, {"t": "p", "s": [["c13-039", "赫克托耳温柔地看着她，说：“我也想到过这些。"], ["c13-040", "可是，我要是像一个胆小鬼一样，躲在城墙后面，我怎么面对城里的人？"], ["c13-041", "我从小就学会了，要勇敢地站在最前面，为我的父亲争光。”"]]}, {"t": "p", "s": [["c13-042", "他停了停，说：“我心里知道，总有一天，特洛伊会被毁掉。"], ["c13-043", "可是，我最担心的，不是那些，而是你。"], ["c13-044", "想到你被带走，想到你在远方的地方，给别人织布、提水，别人指着你说：‘这是赫克托耳的妻子。’"], ["c13-045", "我宁愿，在这之前，就已经埋在了地下。”"]]}, {"t": "p", "s": [["c13-046", "说完，他伸出手臂，想去抱他的小儿子。"]]}, {"t": "img", "src": "images/31.webp?v=b1301814fa", "vid": "images/31.mp4?v=a87fa1f1c9", "cap": "吓哭的小宝宝", "n": 71}, {"t": "p", "s": [["c13-047", "可是，小宝宝，一看见爸爸头盔上那一大撮马鬃，在风里晃来晃去，吓得尖叫着，扑进了保姆的怀里。"]]}, {"t": "p", "s": [["c13-048", "赫克托耳和安德洛玛刻，一起笑了起来。"], ["c13-049", "笑声里，有着眼泪。"]]}, {"t": "p", "s": [["c13-050", "赫克托耳摘下了头盔，放在地上亮闪闪的头盔，滚了一圈，才停下来。"], ["c13-051", "他把孩子举得高高的，轻轻地亲了亲，又把他放进了妻子的怀里，说：“宙斯和众神啊，请你们保佑我的孩子，让他像我一样勇敢，将来，人们见到他，会说：‘他比他的父亲，还要好。’”"]]}, {"t": "p", "s": [["c13-052", "安德洛玛刻笑着，流着眼泪，接过了孩子。"]]}, {"t": "p", "s": [["c13-053", "赫克托耳摸了摸她的头发，说：“亲爱的，不要这样难过。"], ["c13-054", "没有人，能在命运规定的时候之前，把我送进地府。"], ["c13-055", "你回家吧，去织你的布，管好你的仆人。"], ["c13-056", "战争，是男人的事。”"]]}, {"t": "p", "s": [["c13-057", "他戴上头盔，转身，大步走出了城门。"]]}, {"t": "img", "src": "images/126.webp?v=a5b029b113", "vid": "images/126.mp4?v=6525f52eb1", "cap": "一步一回头", "n": 72}, {"t": "p", "s": [["c13-058", "安德洛玛刻一步一回头，看着他的背影，一直到再也看不见。"]]}, {"t": "p", "s": [["c13-059", "回到家，她和女仆们一起，大声地哭了起来。"], ["c13-060", "她们在为一个还活着的人，哭泣。"]]}, {"t": "song", "title": "等你回来", "head": "song-lullaby", "lines": [["song-lullaby-01", "城墙上的风，轻轻地吹"], ["song-lullaby-02", "小小的孩子，睡在我怀里"], ["song-lullaby-03", "你的头盔闪着光，吓得他哭了"], ["song-lullaby-04", "你笑着摘下来，放在地上"], ["song-lullaby-05", "你转身走出城门"], ["song-lullaby-06", "我一步一回头"], ["song-lullaby-07", "路那么长，天那么高"], ["song-lullaby-08", "我在家里，点着灯"], ["song-lullaby-09", "等你回来，等你回来"], ["song-lullaby-10", "星星一颗一颗亮起来"], ["song-lullaby-11", "孩子睡着了，我还在等"]]}]}, {"title": "第十四章　埃阿斯和赫克托耳", "head": "c14-h", "audio": "audio/ch14.m4a?v=37d1d1f62c", "duration": 347.37, "times": {"c14-h": [0.0, 3.698], "c14-001": [4.698, 12.813], "c14-002": [13.163, 20.519], "c14-003": [21.369, 26.66], "c14-004": [27.01, 32.534], "c14-005": [33.384, 35.993], "c14-006": [36.843, 46.318], "c14-007": [47.168, 52.871], "c14-008": [53.721, 59.497], "c14-009": [59.847, 64.422], "c14-010": [65.272, 69.731], "c14-011": [70.081, 78.909], "c14-012": [79.759, 82.821], "c14-013": [83.671, 87.762], "c14-014": [88.112, 97.916], "c14-015": [98.266, 101.461], "c14-016": [102.311, 109.081], "c14-017": [109.431, 110.692], "c14-018": [111.042, 115.009], "c14-019": [115.359, 121.255], "c14-020": [121.605, 131.306], "c14-021": [132.156, 135.341], "c14-022": [136.191, 137.46], "c14-023": [137.81, 139.271], "c14-024": [139.621, 144.463], "c14-025": [145.313, 151.619], "c14-026": [151.969, 153.219], "c14-027": [154.069, 158.272], "c14-028": [158.622, 160.085], "c14-029": [160.435, 163.255], "c14-030": [163.605, 165.478], "c14-031": [166.328, 179.066], "c14-032": [179.416, 186.165], "c14-033": [186.515, 190.876], "c14-034": [191.726, 195.736], "c14-035": [196.586, 205.716], "c14-036": [206.566, 208.65], "c14-037": [209.5, 214.749], "c14-038": [215.099, 220.168], "c14-039": [221.018, 225.358], "c14-040": [225.708, 228.526], "c14-041": [229.376, 233.089], "c14-042": [233.439, 243.782], "c14-043": [244.632, 249.354], "c14-044": [249.704, 252.155], "c14-045": [252.505, 257.06], "c14-046": [257.91, 262.049], "c14-047": [262.899, 274.323], "c14-048": [275.173, 278.349], "c14-049": [279.199, 282.049], "c14-050": [282.399, 285.9], "c14-051": [286.25, 293.31], "c14-052": [294.16, 301.187], "c14-053": [301.537, 309.062], "c14-054": [309.412, 312.953], "c14-055": [313.803, 321.794], "c14-056": [322.144, 330.548], "c14-057": [331.398, 338.28], "c14-058": [338.63, 342.81], "c14-059": [343.66, 345.87]}, "blocks": [{"t": "p", "s": [["c14-001", "赫克托耳刚走到城门口，帕里斯，就穿着闪闪发光的盔甲，从后面追了上来。"], ["c14-002", "他快乐得像一匹吃饱了草料的马，奔跑着，脖子上的长鬃，在风里飞。"]]}, {"t": "p", "s": [["c14-003", "赫克托耳说：“你这个人，没有人能说你不勇敢，可是你总是爱偷懒。"], ["c14-004", "来，一起走吧，等我们打赢了，我们要在大厅里，为自由，一起喝酒。”"]]}, {"t": "p", "s": [["c14-005", "两兄弟，一起冲上了战场。"]]}, {"t": "p", "s": [["c14-006", "特洛伊人看见了赫克托耳回来，像在海上遇到风暴的水手们，终于得到了一阵顺风，一下子，士气大振。"]]}, {"t": "p", "s": [["c14-007", "赫克托耳杀进了希腊人的阵里，一连刺倒了好几个人。"]]}, {"t": "p", "s": [["c14-008", "天上的雅典娜，看见了，就想从山上冲下来，帮助希腊人。"], ["c14-009", "可是，阿波罗，在半路上，拦住了她。"]]}, {"t": "p", "s": [["c14-010", "阿波罗说：“雅典娜，别再让这场仗，打下去了。"], ["c14-011", "我们不如，让赫克托耳和希腊人当中的一个英雄，一对一地比一比，让其他的人，好好歇一歇。”"]]}, {"t": "p", "s": [["c14-012", "雅典娜说：“好，我也这样想。”"]]}, {"t": "p", "s": [["c14-013", "预言家赫勒诺斯，听见了神仙的话。"], ["c14-014", "他对赫克托耳说：“哥哥，你去，向希腊人喊话，让他们选出一个最勇敢的人来，和你单独决斗。"], ["c14-015", "你不会死，神仙是这么对我说的。”"]]}, {"t": "img", "src": "images/127.webp?v=b566a4991d", "vid": "images/127.mp4?v=e6028f515f", "cap": "城下的挑战", "n": 73}, {"t": "p", "s": [["c14-016", "赫克托耳走到了两军的中间，举起长矛，向希腊人大声喊：“希腊人，你们听着！"], ["c14-017", "我是赫克托耳。"], ["c14-018", "我提出一个办法：你们派最好的一个人，来和我打一场。"], ["c14-019", "要是我赢了，我就拿走他的盔甲，把他的尸体还给你们，让你们在海边好好地埋葬他。"], ["c14-020", "要是他赢了，他就可以拿走我的盔甲，把我的尸体，送还给特洛伊人，让我们的妻子，烧掉我，这样两边就可以不再打下去。”"]]}, {"t": "p", "s": [["c14-021", "希腊人的队伍里，一点声音也没有。"]]}, {"t": "p", "s": [["c14-022", "大家都低着头。"], ["c14-023", "没有人敢站出来。"], ["c14-024", "因为大家都知道，赫克托耳，是多么可怕的对手。"]]}, {"t": "p", "s": [["c14-025", "墨涅拉俄斯又羞又气，站起来，说：“你们这些懦夫，真让我丢脸。"], ["c14-026", "好吧，我自己上。”"]]}, {"t": "p", "s": [["c14-027", "阿伽门农一把拉住了他，说：“弟弟，你疯了？"], ["c14-028", "你根本打不过他。"], ["c14-029", "就是阿喀琉斯，也害怕和他交手。"], ["c14-030", "你回去，我们另想办法。”"]]}, {"t": "p", "s": [["c14-031", "老涅斯托尔慢慢地站起身，叹了一口气，说：“唉，希腊人啊，要是老珀琉斯，听见我们现在的样子，一定会伤心死的。"], ["c14-032", "我年轻的时候，也和一个比赫克托耳更强的人，一对一地打过。"], ["c14-033", "要是我还年轻，我一个人，就可以上。”"]]}, {"t": "p", "s": [["c14-034", "他这样一说，九个人，一个接一个地站了起来。"]]}, {"t": "p", "s": [["c14-035", "阿伽门农第一个，接着是狄奥墨得斯，两个埃阿斯，奥德修斯，还有几位年轻的国王。"]]}, {"t": "p", "s": [["c14-036", "涅斯托尔说：“那就抽签吧。”"]]}, {"t": "img", "src": "images/32.webp?v=8ba70db356", "vid": "images/32.mp4?v=a833218e6a", "cap": "抽签选英雄", "n": 74}, {"t": "p", "s": [["c14-037", "九个人，把自己的记号，放进了阿伽门农的头盔里。"], ["c14-038", "涅斯托尔摇了摇头盔，一块小石头，从里面跳了出来。"]]}, {"t": "p", "s": [["c14-039", "传令官，把头盔举起来，一个人一个人地让大家看。"], ["c14-040", "每个人，都说：“不是我的。”"]]}, {"t": "p", "s": [["c14-041", "最后，传令官走到了一个高大的人面前。"], ["c14-042", "他是大埃阿斯，身材像一座塔，手里拿着一面用七层牛皮、外面再包了一层铜的盾牌，像一堵墙。"]]}, {"t": "img", "src": "images/128.webp?v=4bb347d410", "vid": "images/128.mp4?v=e352b81b0b", "cap": "抽中的签", "n": 75}, {"t": "p", "s": [["c14-043", "他一看那块石头，就高兴地笑了：“朋友们，这是我的签！"], ["c14-044", "我知道，我能打败赫克托耳。"], ["c14-045", "大家向宙斯祈祷吧，要小声一点，别让特洛伊人听见。”"]]}, {"t": "p", "s": [["c14-046", "说完，他披上了铠甲，大步走向了战场。"]]}, {"t": "p", "s": [["c14-047", "他大步走路的样子，像战神阿瑞斯一样，微笑着，一步一步，向赫克托耳走去，每一步，都让大地微微地颤抖。"]]}, {"t": "p", "s": [["c14-048", "赫克托耳的心，也怦怦地跳了起来。"]]}, {"t": "p", "s": [["c14-049", "夜色，慢慢地把平原罩了起来。"], ["c14-050", "远处的山，变成了一条黑色的线。"], ["c14-051", "风一吹，营地里的旗子，哗啦哗啦地响，像在为两位勇士鼓掌。"]]}, {"t": "p", "s": [["c14-052", "老涅斯托尔坐在一块石头上，看着埃阿斯的背影，忽然想起了自己年轻的时候。"], ["c14-053", "他想：时间过得多快呀，当年和我一起打仗的朋友，如今只剩下我一个了。"], ["c14-054", "可是，看到这些年轻人，我又放心了。"]]}, {"t": "p", "s": [["c14-055", "远处的山顶上，有一只老鹰，张开翅膀，静静地盘旋着，像一位耐心的观众。"], ["c14-056", "它的影子，从两军的头顶，慢慢地滑过去，一会儿落在这边，一会儿落在那边。"]]}, {"t": "img", "src": "images/129.webp?v=6d2a78de2e", "vid": "images/129.mp4?v=8bda84c8b2", "cap": "夜里的腰带", "n": 76}, {"t": "p", "s": [["c14-057", "入夜以后，埃阿斯，坐在帐篷门口，擦着赫克托耳送给他的那条腰带。"], ["c14-058", "他把它，叠得整整齐齐的，放进了箱子里。"]]}, {"t": "p", "s": [["c14-059", "可是，他已经没有退路了。"]]}]}, {"title": "第十五章　不分胜负的决斗", "head": "c15-h", "audio": "audio/ch15.m4a?v=3b560bcd61", "duration": 361.833, "times": {"c15-h": [0.0, 3.352], "c15-001": [4.352, 11.323], "c15-002": [12.173, 15.927], "c15-003": [16.277, 25.849], "c15-004": [26.699, 28.652], "c15-005": [29.002, 32.553], "c15-006": [32.903, 40.811], "c15-007": [41.161, 44.276], "c15-008": [45.126, 51.381], "c15-009": [52.231, 57.714], "c15-010": [58.064, 64.654], "c15-011": [65.504, 68.612], "c15-012": [68.962, 76.193], "c15-013": [76.543, 83.64], "c15-014": [84.49, 90.821], "c15-015": [91.171, 98.407], "c15-016": [99.257, 103.891], "c15-017": [104.741, 109.457], "c15-018": [110.307, 11
