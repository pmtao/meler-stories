9.852], "c15-019": [120.702, 129.886], "c15-020": [130.236, 134.902], "c15-021": [135.752, 140.834], "c15-022": [141.684, 149.092], "c15-023": [149.442, 151.726], "c15-024": [152.076, 161.075], "c15-025": [161.925, 167.246], "c15-026": [167.596, 171.68], "c15-027": [172.53, 177.346], "c15-028": [178.196, 186.63], "c15-029": [186.98, 193.296], "c15-030": [194.146, 203.246], "c15-031": [203.596, 208.657], "c15-032": [209.507, 221.449], "c15-033": [221.799, 231.096], "c15-034": [231.946, 234.321], "c15-035": [235.171, 241.09], "c15-036": [241.94, 249.536], "c15-037": [249.886, 256.621], "c15-038": [257.471, 269.525], "c15-039": [270.375, 274.516], "c15-040": [275.366, 282.418], "c15-041": [283.268, 286.829], "c15-042": [287.179, 299.157], "c15-043": [299.507, 304.682], "c15-044": [305.532, 310.483], "c15-045": [310.833, 314.549], "c15-046": [314.899, 319.986], "c15-047": [320.836, 325.392], "c15-048": [325.742, 330.615], "c15-049": [330.965, 337.836], "c15-050": [338.686, 341.22], "c15-051": [341.57, 348.612], "c15-052": [349.462, 351.374], "c15-053": [351.724, 360.333]}, "blocks": [{"t": "img", "src": "images/130.webp?v=0abcec7704", "vid": "images/130.mp4?v=6aa01654d4", "cap": "围成圆圈", "n": 77}, {"t": "p", "s": [["c15-001", "两边的士兵，都坐了下来，围成了一个大大的圆圈，等着看这场决斗。"]]}, {"t": "p", "s": [["c15-002", "赫克托耳先举起了长矛，用力一掷。"], ["c15-003", "长矛带着风声，飞了过去，撞在埃阿斯的大盾牌上，穿过了六层牛皮，只差一层，就刺到他了。"]]}, {"t": "p", "s": [["c15-004", "埃阿斯没有后退。"], ["c15-005", "他举起了自己的长矛，大喝一声，掷了出去。"], ["c15-006", "长矛像一颗流星，穿透了赫克托耳的盾牌，划破了他的衣服，擦着他的腰边，飞了过去。"], ["c15-007", "赫克托耳一闪身，才躲开了。"]]}, {"t": "p", "s": [["c15-008", "两个人，又拔出了长矛，像两头红了眼睛的野猪，扑在了一起。"]]}, {"t": "p", "s": [["c15-009", "赫克托耳刺中了埃阿斯的盾，可是长矛的头弯了。"], ["c15-010", "埃阿斯一矛，刺在了赫克托耳的脖子上，血，一下子流了出来。"]]}, {"t": "p", "s": [["c15-011", "可是，赫克托耳没有倒下。"], ["c15-012", "他向后退了几步，从地上，捡起了一块黑黑的大石头，使劲砸了过去。"], ["c15-013", "石头砸在埃阿斯的盾牌上，发出一声巨响，像一口大钟被撞响了。"]]}, {"t": "img", "src": "images/217.webp?v=988a37e5e4", "vid": "images/217.mp4?v=ddb355a147", "cap": "大石头", "n": 78}, {"t": "p", "s": [["c15-014", "埃阿斯，也捡起了一块比它还大的石头，转了几圈，狠狠地砸了出去。"], ["c15-015", "石头砸在赫克托耳的盾牌上，把他砸得向后倒去仰面躺在了地上。"]]}, {"t": "p", "s": [["c15-016", "可是，阿波罗，一把扶住了他，让他站了起来。"]]}, {"t": "p", "s": [["c15-017", "两个人，又拔出了长剑，要拼个你死我活。"]]}, {"t": "p", "s": [["c15-018", "就在这个时候两位传令官，一个希腊人，一个特洛伊人，举着手里的权杖，跑到了中间，把他们两个隔开了。"]]}, {"t": "p", "s": [["c15-019", "特洛伊的老传令官说：“孩子们，别打了，你们两个，都是宙斯疼爱的人，都是最勇敢的战士。"], ["c15-020", "天快黑了，夜晚是应该听从的，让我们停下来吧。”"]]}, {"t": "p", "s": [["c15-021", "埃阿斯说：“是赫克托耳先提出来的，只要他说停，我就停。”"]]}, {"t": "img", "src": "images/33.webp?v=c8d1dbaba1", "vid": "images/33.mp4?v=1b67934213", "cap": "互赠礼物", "n": 79}, {"t": "p", "s": [["c15-022", "赫克托耳点了点头，说：“埃阿斯，神给了你高大的身材，给了你力气，给了你智慧。"], ["c15-023", "你是希腊人中，最优秀的武士。"], ["c15-024", "今天，我们都打得很累了，不如，我们互相送给对方一件礼物，让大家都知道，我们是为了荣誉，才打这一场，没有仇恨。”"]]}, {"t": "p", "s": [["c15-025", "他把自己银钉镶边的宝剑，连同剑鞘，送给了埃阿斯。"], ["c15-026", "埃阿斯把一条紫色的腰带，送给了赫克托耳。"]]}, {"t": "p", "s": [["c15-027", "两个人，握了握手，各自走回了自己的队伍。"]]}, {"t": "p", "s": [["c15-028", "特洛伊人看见赫克托耳平安地回来了，高兴得又叫又跳，把他抬了起来，一直抬进了城里。"], ["c15-029", "希腊人也把埃阿斯高高地举起来，大声地欢呼，带回了阿伽门农的帐篷。"]]}, {"t": "img", "src": "images/131.webp?v=170f6b2007", "vid": "images/131.mp4?v=3167c4008a", "cap": "英雄们的宴会", "n": 80}, {"t": "p", "s": [["c15-030", "那天晚上，阿伽门农宰了一头五岁的大公牛，请所有的英雄，吃烤肉、喝美酒。"], ["c15-031", "他把最好的一块脊骨肉，留给了埃阿斯向他表示敬意。"]]}, {"t": "p", "s": [["c15-032", "老涅斯托尔又站起来，给大家出了一个主意：“明天，我们先停战一天，把死去的朋友，都烧了，把骨灰带回他们的家乡。"], ["c15-033", "再在大船的前面，挖一道深深的壕沟，再造一堵高高的墙，来保护我们的船。”"]]}, {"t": "p", "s": [["c15-034", "大家都说：“这是个好主意。”"]]}, {"t": "p", "s": [["c15-035", "可是，在奥林匹斯山上，海神波塞冬，皱起了眉头。"]]}, {"t": "p", "s": [["c15-036", "他对宙斯说：“你看，这些希腊人，没有给神仙献祭，就盖了一堵这么大的墙。"], ["c15-037", "我和阿波罗，当年辛辛苦苦造的特洛伊城墙，人们都快把它忘了。”"]]}, {"t": "p", "s": [["c15-038", "宙斯笑着说：“你放心，等希腊人走了，你可以用海水，把这堵墙，冲进大海里，一点痕迹也不留。”"]]}, {"t": "img", "src": "images/132.webp?v=7935cf6715", "vid": "images/132.mp4?v=db0b8f3932", "cap": "筑起高墙", "n": 81}, {"t": "p", "s": [["c15-039", "第二天，一大早，希腊人开始造墙。"]]}, {"t": "p", "s": [["c15-040", "夜里，营地里，火光闪闪，士兵们在海边喝着酒，唱着歌。"]]}, {"t": "p", "s": [["c15-041", "埃阿斯回到帐篷里，慢慢地解下盔甲。"], ["c15-042", "他的手臂上，有好几道淤青，可是，他一点也不觉得疼，只觉得心里，有一种暖暖的东西，在慢慢地涨起来。"], ["c15-043", "他想，原来，和敌人也可以互相尊敬。"]]}, {"t": "p", "s": [["c15-044", "与此同时，赫克托耳在城里，抱起了他的小儿子。"], ["c15-045", "孩子的手，抓着他的头发，咯咯地笑。"], ["c15-046", "赫克托耳，把脸贴在孩子的小脸上，什么话也没有说。"]]}, {"t": "p", "s": [["c15-047", "晚上的营火边，士兵们纷纷议论着白天的比赛。"], ["c15-048", "有人说：“你看见了吗，埃阿斯那一下，真像一座山压下来！”"], ["c15-049", "也有人说：“赫克托耳的石头，也不是吃素的，我在远处听了，都觉得耳朵嗡嗡的。”"]]}, {"t": "p", "s": [["c15-050", "说到后来，大家都笑了。"], ["c15-051", "他们谁也没有注意到，一颗流星，从天边划过，落进了黑黑的大海里。"]]}, {"t": "p", "s": [["c15-052", "可是，宙斯没有睡。"], ["c15-053", "他坐在天上听着下面传来的嘈杂的声音，一整夜，都在琢磨怎样兑现他对忒提斯的诺言。"]]}]}, {"title": "第十六章　宙斯的金秤", "head": "c16-h", "audio": "audio/ch16.m4a?v=f9af642c27", "duration": 368.193, "times": {"c16-h": [0.0, 3.026], "c16-001": [4.026, 9.018], "c16-002": [9.868, 21.343], "c16-003": [21.693, 27.851], "c16-004": [28.201, 38.823], "c16-005": [39.173, 59.82], "c16-006": [60.67, 64.001], "c16-007": [64.851, 70.963], "c16-008": [71.313, 76.808], "c16-009": [77.658, 88.194], "c16-010": [89.044, 93.86], "c16-011": [94.71, 105.534], "c16-012": [105.884, 108.95], "c16-013": [109.8, 114.758], "c16-014": [118.789, 122.974], "c16-015": [123.824, 130.266], "c16-016": [131.116, 134.216], "c16-017": [135.066, 142.722], "c16-018": [143.572, 152.049], "c16-019": [152.399, 156.011], "c16-020": [156.861, 162.143], "c16-021": [162.993, 166.637], "c16-022": [167.487, 171.159], "c16-023": [171.509, 183.642], "c16-024": [184.492, 194.891], "c16-025": [195.241, 197.22], "c16-026": [198.07, 201.378], "c16-027": [202.228, 208.639], "c16-028": [208.989, 212.831], "c16-029": [213.681, 216.764], "c16-030": [217.114, 228.413], "c16-031": [229.263, 235.735], "c16-032": [236.085, 240.114], "c16-033": [240.964, 250.608], "c16-034": [254.639, 258.108], "c16-035": [258.958, 261.832], "c16-036": [262.182, 264.609], "c16-037": [264.959, 267.634], "c16-038": [268.484, 274.261], "c16-039": [275.111, 278.533], "c16-040": [278.883, 285.142], "c16-041": [285.492, 289.046], "c16-042": [289.896, 293.677], "c16-043": [294.027, 299.743], "c16-044": [300.593, 302.562], "c16-045": [302.912, 307.207], "c16-046": [308.057, 313.42], "c16-047": [313.77, 321.184], "c16-048": [321.534, 326.519], "c16-049": [327.369, 339.919], "c16-050": [340.769, 345.262], "c16-051": [345.612, 351.498], "c16-052": [351.848, 359.736], "c16-053": [360.586, 366.693]}, "blocks": [{"t": "p", "s": [["c16-001", "清晨，太阳从海面上升起来，照亮了整个大地。"]]}, {"t": "img", "src": "images/133.webp?v=59d869200c", "vid": "images/133.mp4?v=3c6318498b", "cap": "宙斯的命令", "n": 82}, {"t": "p", "s": [["c16-002", "宙斯召集了所有的神仙，坐在奥林匹斯山的最高处，对大家说：“我现在，要下一道命令，谁也不许违抗。"], ["c16-003", "不管是男神，还是女神，都不许下山去帮助任何一方。"], ["c16-004", "谁要是不听，我就把他抓起来，扔进最深最黑的地狱里，让他知道，我有多强大。"], ["c16-005", "你们要是不信，可以试一试：拿一根金绳子，从天上垂下去，你们所有的神仙，一起拉，也拉不动我；可是我一使劲，就可以把你们和大地、大海，一起提起来，系在山尖上。”"]]}, {"t": "p", "s": [["c16-006", "神仙们一个个，都吓得闭上了嘴。"]]}, {"t": "p", "s": [["c16-007", "雅典娜小声说：“父亲，我们知道，您的力量，没有人能比。"], ["c16-008", "不过，我们还是可怜那些希腊人，他们就要吃一个大亏了。”"]]}, {"t": "p", "s": [["c16-009", "宙斯笑了笑，说：“别难过，孩子，我并不是真的生你的气，我的话，只是说说而已。”"]]}, {"t": "p", "s": [["c16-010", "说完，他驾着金色的战车，来到了伊达山的山顶。"]]}, {"t": "img", "src": "images/34.webp?v=aa4730abcf", "vid": "images/34.mp4?v=55482a345f", "cap": "宙斯的金秤", "n": 83}, {"t": "p", "s": [["c16-011", "他拿出了一杆金色的秤，把两个命运，放在了两个托盘里：一个，是特洛伊人的，一个，是希腊人的。"], ["c16-012", "他拿着秤的中间，轻轻地一提。"]]}, {"t": "p", "s": [["c16-013", "希腊人的那一边，沉了下去，一直沉到了大地上。"], ["c16-014", "特洛伊人的那一边，却高高地升向了天空。"]]}, {"t": "p", "s": [["c16-015", "宙斯从山顶上打出了一道亮闪闪的雷电，落在了希腊人的队伍里。"]]}, {"t": "p", "s": [["c16-016", "希腊人看见了，吓得脸色发白。"]]}, {"t": "p", "s": [["c16-017", "那一天，战场上，特洛伊人像一群狼，把希腊人，赶得连连后退。"]]}, {"t": "img", "src": "images/134.webp?v=e224b980f4", "vid": "images/134.mp4?v=9589d80ae6", "cap": "赫克托耳冲锋", "n": 84}, {"t": "p", "s": [["c16-018", "赫克托耳站在战车上头盔上的马鬃，一颤一颤，大声地喊着：“冲啊，朋友们，别让他们跑掉了！"], ["c16-019", "希腊人那堵可笑的墙，根本拦不住我们的马！”"]]}, {"t": "p", "s": [["c16-020", "希腊人一退再退，一直退到了那条深深的壕沟前。"]]}, {"t": "p", "s": [["c16-021", "他们挤在一起像一群被赶进羊圈的羊。"]]}, {"t": "p", "s": [["c16-022", "奥德修斯和狄奥墨得斯，拼命地拦着。"], ["c16-023", "老涅斯托尔的马，被帕里斯射死了一匹，他从战车上跳下来，拔剑去砍马的缰绳，一支长矛，几乎擦着他的头顶飞过。"]]}, {"t": "img", "src": "images/135.webp?v=da604727c8", "vid": "images/135.mp4?v=12eac24a3f", "cap": "救老国王", "n": 85}, {"t": "p", "s": [["c16-024", "狄奥墨得斯大喊着，跳上了战车，把老人，拉了上来，说：“老国王，您年纪大了，不要再待在这里了。"], ["c16-025", "我们一起向赫克托耳冲过去！”"]]}, {"t": "p", "s": [["c16-026", "涅斯托尔说：“好，我听你的。”"]]}, {"t": "p", "s": [["c16-027", "狄奥墨得斯投出了长矛，打中了赫克托耳的车夫，车夫倒了下去。"], ["c16-028", "赫克托耳又找了一个车夫，才没有被俘虏。"]]}, {"t": "p", "s": [["c16-029", "宙斯在天上看见了，心里很不高兴。"], ["c16-030", "他又从天空中投下了一道亮闪闪的雷电，落在了狄奥墨得斯的战车前，把地面劈出一个大大的坑，冒着蓝色的硫黄烟。"]]}, {"t": "p", "s": [["c16-031", "老涅斯托尔吓得扔下了缰绳，说：“狄奥墨得斯，快逃吧！"], ["c16-032", "看起来，宙斯今天，不让我们赢。”"]]}, {"t": "p", "s": [["c16-033", "可是，狄奥墨得斯说：“要是我这样逃回去，赫克托耳会对大家说：‘狄奥墨得斯是个胆小鬼，吓得逃回了船里。’"], ["c16-034", "到那时，我宁愿大地裂开，把我吞下去。”"]]}, {"t": "p", "s": [["c16-035", "涅斯托尔说：“你说什么傻话？"], ["c16-036", "别人怎么会相信他的话呢？"], ["c16-037", "他们都知道你有多勇敢。”"]]}, {"t": "img", "src": "images/218.webp?v=ce921dc394", "vid": "images/218.mp4?v=0083fb25d3", "cap": "奔向大船", "n": 86}, {"t": "p", "s": [["c16-038", "他一拉缰绳，把战车调了头，向大船那边，飞奔而去。"]]}, {"t": "p", "s": [["c16-039", "赫克托耳在后面大声地喊：“狄奥墨得斯！"], ["c16-040", "希腊人曾经让你坐在上座，给你最好的肉和酒，现在，他们要把你当成一个女人。"], ["c16-041", "你这个胆小鬼，我要把你的头，砍下来！”"]]}, {"t": "p", "s": [["c16-042", "狄奥墨得斯的心里，像被针扎了一样。"], ["c16-043", "他三次想要掉转头，三次，宙斯都在天上打出一阵雷声。"]]}, {"t": "p", "s": [["c16-044", "最后，太阳落山了。"], ["c16-045", "黑夜降临，特洛伊人，才不情愿地，停了下来。"]]}, {"t": "img", "src": "images/35.webp?v=18e0196791", "vid": "images/35.mp4?v=204084671e", "cap": "平原上的千堆火", "n": 87}, {"t": "p", "s": [["c16-046", "赫克托耳召集了所有的特洛伊人，在平原上，开了一个会。"], ["c16-047", "他举着长矛，大声说：“朋友们，今天，我们本来可以烧掉他们的船，可是，天黑了。"], ["c16-048", "让我们，就在这里，点起火堆，吃饭等天亮，再冲上去！”"]]}, {"t": "p", "s": [["c16-049", "特洛伊人在平原上点起了一千堆火，每一堆火的旁边，坐着五十个人，火光映红了天空，像夜空里的星星，落在了大地上。"]]}, {"t": "p", "s": [["c16-050", "远处的火堆，一个接一个，慢慢地烧旺了。"], ["c16-051", "希腊人坐在大船边，看着那些红色的光，一句话也不想说。"], ["c16-052", "有个年轻的士兵，悄悄地把家乡的一小块泥土，放在手心里，轻轻地吹了吹。"]]}, {"t": "p", "s": [["c16-053", "希腊人看着那一片红色的火光，心里，像压了一块冰冷的石头。"]]}]}, {"title": "第十七章　营地里的使者", "head": "c17-h", "audio": "audio/ch17.m4a?v=325fedf018", "duration": 334.607, "times": {"c17-h": [0.0, 2.985], "c17-001": [3.985, 7.248], "c17-002": [8.098, 14.964], "c17-003": [15.314, 19.331], "c17-004": [19.681, 23.922], "c17-005": [24.272, 27.027], "c17-006": [27.877, 31.684], "c17-007": [32.534, 36.723], "c17-008": [37.073, 40.793], "c17-009": [41.143, 46.698], "c17-010": [47.048, 54.335], "c17-011": [55.185, 57.665], "c17-012": [58.515, 65.04], "c17-013": [65.39, 70.708], "c17-014": [71.058, 73.818], "c17-015": [74.168, 79.146], "c17-016": [79.996, 83.196], "c17-017": [84.046, 88.907], "c17-018": [89.257, 89.983], "c17-019": [90.333, 106.122], "c17-020": [106.472, 114.098], "c17-021": [114.448, 119.325], "c17-022": [120.175, 132.865], "c17-023": [133.715, 136.963], "c17-024": [137.813, 147.269], "c17-025": [148.119, 152.411], "c17-026": [153.261, 161.209], "c17-027": [161.559, 166.544], "c17-028": [167.394, 172.724], "c17-029": [173.074, 173.932], "c17-030": [174.282, 181.926], "c17-031": [182.776, 186.086], "c17-032": [186.436, 190.139], "c17-033": [190.989, 196.994], "c17-034": [197.844, 201.711], "c17-035": [202.061, 205.856], "c17-036": [206.206, 215.811], "c17-037": [216.161, 220.635], "c17-038": [220.985, 222.859], "c17-039": [223.709, 236.539], "c17-040": [236.889, 237.931], "c17-041": [238.281, 245.356], "c17-042": [246.206, 251.198], "c17-043": [252.048, 257.073], "c17-044": [257.923, 263.947], "c17-045": [264.297, 270.888], "c17-046": [271.738, 275.183], "c17-047": [275.533, 278.436], "c17-048": [278.786, 286.463], "c17-049": [287.313, 292.267], "c17-050": [292.617, 298.264], "c17-051": [298.614, 310.54], "c17-052": [311.39, 320.096], "c17-053": [320.946, 323.566], "c17-054": [323.916, 329.01], "c17-055": [329.86, 333.107]}, "blocks": [{"t": "p", "s": [["c17-001", "希腊人的营地里，一点笑声也没有。"]]}, {"t": "img", "src": "images/136.webp?v=70f6857eff", "vid": "images/136.mp4?v=c9a3a237f9", "cap": "愁眉苦脸的元帅", "n": 88}, {"t": "p", "s": [["c17-002", "阿伽门农像一个丢了孩子的父亲，一个人，坐在大帐篷里眼睛红红的。"], ["c17-003", "他叹着气，说：“宙斯啊，您为什么这样捉弄我？"], ["c17-004", "我吃了那么多苦，您为什么，还要让我在这里丢脸？"], ["c17-005", "我们逃回去吧，我再也不想打下去了。”"]]}, {"t": "p", "s": [["c17-006", "老将们，都不说话，他们也很难过。"]]}, {"t": "p", "s": [["c17-007", "狄奥墨得斯站了起来，说：“元帅，别灰心。"], ["c17-008", "要是你想回去，你的船，就在海边，你尽管走。"], ["c17-009", "我们别的人，会留下来，等攻下特洛伊，再回去。"], ["c17-010", "就算所有的人都走了，我和斯特涅罗斯，也会一起留下来，因为是神，把我们送到了这里。”"]]}, {"t": "p", "s": [["c17-011", "大家一起鼓掌，叫好。"]]}, {"t": "p", "s": [["c17-012", "老涅斯托尔也站起来，说：“元帅，我有一句话，你听不听？"], ["c17-013", "是你自己，冒犯了阿喀琉斯，夺走了他的礼物。"], ["c17-014", "现在，我们需要他。"], ["c17-015", "你应该，向他赔罪，送他一些礼物，让他回来。”"]]}, {"t": "p", "s": [["c17-016", "阿伽门农低着头，想了很久。"]]}, {"t": "p", "s": [["c17-017", "终于，他说：“老人家，你说得对，我做了蠢事。"], ["c17-018", "我承认。"], ["c17-019", "我愿意给他很多很多礼物：七个三脚鼎，十块金子，二十个大锅，十二匹得过奖的快马，七个美丽的女人，还要把布里塞伊斯，原原本本地还给他，我对神发誓，我从来没有碰过她。"], ["c17-020", "要是我们攻下了特洛伊，他可以在战利品里，装满一整条船的金子和铜，还可以娶我的女儿中的任何一个。"], ["c17-021", "可是，他必须认输，因为我是国王，我比他年长。”"]]}, {"t": "p", "s": [["c17-022", "涅斯托尔说：“好，我们派三个人去：老福尼克斯，他是阿喀琉斯的老师；大埃阿斯；还有聪明的奥德修斯，再加上两个传令官。”"]]}, {"t": "p", "s": [["c17-023", "大家在一起向宙斯倒了酒，祈祷。"]]}, {"t": "img", "src": "images/36.webp?v=ab6479eb16", "vid": "images/36.mp4?v=8f221e54ad", "cap": "去找阿喀琉斯", "n": 89}, {"t": "p", "s": [["c17-024", "使者们沿着海边走，海浪在身边哗啦哗啦地响着，天上的星星，一颗一颗，亮了起来。"]]}, {"t": "img", "src": "images/37.webp?v=64eaed6a0e", "vid": "images/37.mp4?v=589748e648", "cap": "弹琴的英雄", "n": 90}, {"t": "p", "s": [["c17-025", "走到阿喀琉斯的帐篷，他们远远地听见了琴声。"]]}, {"t": "p", "s": [["c17-026", "阿喀琉斯正坐在帐篷门口拨着一把银色的七弦琴，轻轻地唱着英雄们的故事。"], ["c17-027", "帕特洛克罗斯坐在对面静静地听着，等他唱完了一曲。"]]}, {"t": "p", "s": [["c17-028", "阿喀琉斯看见了他们，高兴地站了起来，说：“欢迎，我的朋友们！"], ["c17-029", "你们来得正好。"], ["c17-030", "帕特洛克罗斯，快去拿一只大一点的碗，倒上最浓的酒，这三个人，都是我最喜欢的朋友。”"]]}, {"t": "img", "src": "images/137.webp?v=a84c50e748", "vid": "images/137.mp4?v=520a788c2d", "cap": "热情招待", "n": 91}, {"t": "p", "s": [["c17-031", "大家坐了下来，吃了烤肉，喝了酒。"], ["c17-032", "吃完了，埃阿斯向福尼克斯使了个眼色。"]]}, {"t": "p", "s": [["c17-033", "奥德修斯举起了杯子，向阿喀琉斯祝酒，然后，开始说话了。"]]}, {"t": "p", "s": [["c17-034", "“阿喀琉斯，我们不愁没有吃的，也不愁没有喝的。"], ["c17-035", "可是我们的大船，正面临着可怕的危险。"], ["c17-036", "特洛伊人和他们的盟友，就在我们的壕沟外面，点起了无数的火堆，他们说，天一亮，就要烧掉我们的船，把我们都杀光。"], ["c17-037", "宙斯在向他们打雷，赫克托耳，也像一头发了疯的野兽。"], ["c17-038", "只有你，能救大家。”"]]}, {"t": "p", "s": [["c17-039", "他又说：“你离开的那一天，你的父亲珀琉斯，对你说过：‘孩子，力量是神给你的，可是，你要管好你的心，因为温和的话，比愤怒的话，更有力量。’"], ["c17-040", "你难道忘了吗？"], ["c17-041", "现在，阿伽门农愿意用这么多的礼物，来赔罪，请你看在你的朋友们的份上，回来吧。”"]]}, {"t": "p", "s": [["c17-042", "他把阿伽门农的礼物，一件一件地，念给阿喀琉斯听。"]]}, {"t": "p", "s": [["c17-043", "可是，阿喀琉斯，一直低着头，听着。"]]}, {"t": "p", "s": [["c17-044", "炉火在帐篷里跳动，把大家的影子，投在了布墙上，一晃一晃的。"], ["c17-045", "帕特洛克罗斯往炉子里添了一块柴，火花啪的一声，溅了起来。"]]}, {"t": "p", "s": [["c17-046", "奥德修斯说完话，没有马上坐下。"], ["c17-047", "他用眼睛，一直看着阿喀琉斯。"], ["c17-048", "他知道，这个年轻的英雄，心里有一座山，要把那座山搬开，不是几句话的事。"]]}, {"t": "p", "s": [["c17-049", "狄奥墨得斯的话，让大帐篷里，有了一点点暖意。"], ["c17-050", "年轻的传令官，赶忙给每一位英雄的杯子里，都倒满了酒。"], ["c17-051", "奥德修斯接过杯子，却没有喝，他把杯子，轻轻地放在了桌子上，说：“我们去的时候，要记住，不能让他觉得，我们是在命令他。”"]]}, {"t": "p", "s": [["c17-052", "大埃阿斯点了点头，说：“你放心，我这个人，笨嘴笨舌，不会说话，我就站在旁边，看着你。”"]]}, {"t": "img", "src": "images/138.webp?v=712efd733c", "vid": "images/138.mp4?v=8052a2a361", "cap": "沉默的归途", "n": 92}, {"t": "p", "s": [["c17-053", "走在路上，三个人都没有说话。"], ["c17-054", "海浪在脚边，一下一下地拍着，像在替他们数着步子。"]]}, {"t": "p", "s": [["c17-055", "他的脸，慢慢地，变得严肃了。"]]}]}, {"title": "第十八章　阿喀琉斯的回答", "head": "c18-h", "audio": "audio/ch18.m4a?v=21ab845b62", "duration": 324.781, "times": {"c18-h": [0.0, 2.874], "c18-001": [3.874, 7.972], "c18-002": [8.322, 11.414], "c18-003": [12.264, 20.879], "c18-004": [21.229, 26.055], "c18-005": [26.905, 33.379], "c18-006": [33.729, 44.42], "c18-007": [44.77, 48.192], "c18-008": [48.542, 56.032], "c18-009": [56.882, 61.691], "c18-010": [62.041, 65.531], "c18-011": [65.881, 70.171], "c18-012": [70.521, 79.834], "c18-013": [80.684, 100.903], "c18-014": [101.253, 103.807], "c18-015": [104.157, 108.276], "c18-016": [109.126, 115.321], "c18-017": [115.671, 123.848], "c18-018": [124.698, 126.51], "c18-019": [126.86, 132.556], "c18-020": [132.906, 140.288], "c18-021": [140.638, 147.587], "c18-022": [147.937, 155.921], "c18-023": [156.771, 159.003], "c18-024": [159.853, 169.04], "c18-025": [169.39, 175.008], "c18-026": [175.358, 184.31], "c18-027": [184.66, 189.239], "c18-028": [190.089, 197.315], "c18-029": [198.165, 203.602], "c18-030": [203.952, 208.508], "c18-031": [208.858, 210.5], "c18-032": [210.85, 215.775], "c18-033": [216.625, 219.784], "c18-034": [220.134, 225.985], "c18-035": [226.835, 235.225], "c18-036": [235.575, 238.55], "c18-037": [238.9, 241.654], "c18-038": [242.004, 250.027], "c18-039": [250.877, 256.868], "c18-040": [257.218, 263.72], "c18-041": [264.07, 270.124], "c18-042": [270.974, 276.661], "c18-043": [277.511, 279.32], "c18-044": [279.67, 280.818], "c18-045": [281.668, 288.388], "c18-046": [289.238, 293.267], "c18-047": [294.117, 297.723], "c18-048": [298.073, 302.985], "c18-049": [303.335, 305.712], "c18-050": [306.062, 310.296], "c18-051": [311.146, 314.198], "c18-052": [315.048, 317.597], "c18-053": [318.447, 323.281]}, "blocks": [{"t": "p", "s": [["c18-001", "奥德修斯说完，帐篷里，安静了好久。"], ["c18-002", "炉子里的火，噼噼啪啪地响着。"]]}, {"t": "img", "src": "images/139.webp?v=0244698627", "vid": "images/139.mp4?v=130a571402", "cap": "倔强的回答", "n": 93}, {"t": "p", "s": [["c18-003", "阿喀琉斯抬起头，说：“聪明的奥德修斯，我要对你说老实话，这样，你们就不用一个一个地来劝我了。"], ["c18-004", "我讨厌那种嘴上说一套、心里想一套的人，就像讨厌地狱的大门一样。”"]]}, {"t": "p", "s": [["c18-005", "他慢慢地说：“我觉得，阿伽门农，不会说服我，别的希腊人，也不会。"], ["c18-006", "因为，我拼命地打仗，一天一天，没有休息，可是，不管谁打得好，不管谁打得不好，得到的奖赏，都是一样的。"], ["c18-007", "懦夫和勇士，受到的尊重，是同样的。"], ["c18-008", "我什么也没有得到，我把性命，一次又一次放在危险里，可是，他只拿走了一个姑娘。”"]]}, {"t": "p", "s": [["c18-009", "“他想要什么，就让他自己拿吧，我的心，已经被他伤透了。"], ["c18-010", "我不要他的礼物，哪怕他给我十倍、二十倍。"], ["c18-011", "就算他把全世界的财富，都拿来，也比不上我的生命。"], ["c18-012", "牛羊，可以抢来，金子可以换来，可是，一个人的生命，一旦走了，是永远不会再回来的。”"]]}, {"t": "p", "s": [["c18-013", "他又叹了一口气，说：“我的母亲，海洋女神，对我说，有两种命运，等着我：要是我留在这里，和特洛伊人打仗，我就不能回家，可是我的名字，会永远流传；要是我回到故乡，我的名声会消失，可是，我会活到很老很老。"], ["c18-014", "我现在觉得，我应该选后一种。"], ["c18-015", "我劝你们也回家吧，因为你们根本攻不下高高的特洛伊城。”"]]}, {"t": "p", "s": [["c18-016", "“明天一早，你们可以看见，我把大船拉到海里，扬起白帆，回我的家乡去。"], ["c18-017", "要是老天保佑，第三天，我就可以回到我的故乡，我的父亲给我留下了大片的土地、很多财富，等着我。”"]]}, {"t": "img", "src": "images/38.webp?v=7cb0e6d252", "vid": "images/38.mp4?v=a0b136d8cc", "cap": "老师的眼泪", "n": 94}, {"t": "p", "s": [["c18-018", "老福尼克斯哭了起来。"], ["c18-019", "他是阿喀琉斯的老师，从小，一口饭一口饭地，把他喂大。"], ["c18-020", "他一边流着泪，一边说：“我的孩子，你要是真的想回去，我怎么舍得，一个人留在这里？"], ["c18-021", "你的父亲，把你交给我的时候，你还是一个什么也不懂的小孩子，我教你怎样说话，怎样打仗。"], ["c18-022", "你小时候，总是不肯一个人吃饭，总是坐在我的膝头，让我喂你，把我的衣服，弄得湿漉漉的。”"]]}, {"t": "p", "s": [["c18-023", "他给阿喀琉斯讲了一个故事。"]]}, {"t": "p", "s": [["c18-024", "很久很久以前，有一位英雄，叫墨勒阿格洛斯，他和敌人打仗，生了气，回到家里，不肯出来。"], ["c18-025", "城里的人，哭着来求他，送给他很多礼物，他也不肯理。"], ["c18-026", "等到敌人已经冲进了城门，大火烧到了他的房顶，他的妻子哭着求他，他才拿起武器，冲出去，赶走了敌人。"], ["c18-027", "可是，那时候，人们已经不再送给他礼物了。"]]}, {"t": "p", "s": [["c18-028", "福尼克斯说：“我的孩子，你不要像他一样，等到船都着火了，才回来。”"]]}, {"t": "img", "src": "images/219.webp?v=5e42e7f31c", "vid": "images/219.mp4?v=2b7afe6ede", "cap": "摇头", "n": 95}, {"t": "p", "s": [["c18-029", "阿喀琉斯轻轻地摇了摇头，说：“老师，我不需要这种荣誉。"], ["c18-030", "我只想守着我的心，愿意留在这里，等着看，会发生什么。"], ["c18-031", "你别哭了，别让我难过。"], ["c18-032", "你今晚留在这里睡吧，明天，我们再商量，是走还是留。”"]]}, {"t": "p", "s": [["c18-033", "他向帕特洛克罗斯，使了一个眼色。"], ["c18-034", "帕特洛克罗斯马上，在帐篷里，给老人铺了一张软软的床。"]]}, {"t": "p", "s": [["c18-035", "大埃阿斯一直没有说话，这时站了起来，对奥德修斯说：“我们走吧，我们的话，是白说了。"], ["c18-036", "我们得回去告诉他们，让他们别指望了。"], ["c18-037", "这个人，心像石头一样硬。"], ["c18-038", "就连别人杀死了自己的哥哥，也可以收下赔偿，可是，他为了一个姑娘，就这样不依不饶。”"]]}, {"t": "p", "s": [["c18-039", "阿喀琉斯看着他，说：“埃阿斯，你说的话，我心里是明白的。"], ["c18-040", "可是，一想到阿伽门农，用什么样的话，当着大家的面，侮辱我，我就气得发抖。"], ["c18-041", "你们回去告诉他：只有等到赫克托耳，冲到了我的船边，我才会拿起武器。”"]]}, {"t": "p", "s": [["c18-042", "使者们，举起酒杯，向他告别，回到了阿伽门农的帐篷里。"]]}, {"t": "img", "src": "images/140.webp?v=2d9728090e", "vid": "images/140.mp4?v=2a7f5a8981", "cap": "回去禀报", "n": 96}, {"t": "p", "s": [["c18-043", "阿伽门农问：“怎么样？"], ["c18-044", "他愿意回来吗？”"]]}, {"t": "p", "s": [["c18-045", "奥德修斯摇了摇头，把阿喀琉斯的话，一字不差地，说了一遍。"]]}, {"t": "p", "s": [["c18-046", "大厅里，所有的人，都沉默了。"]]}, {"t": "p", "s": [["c18-047", "狄奥墨得斯小声说：“我们不应该求他的。"], ["c18-048", "他的骄傲，已经够多了，我们的礼物，只会让他更傲慢。"], ["c18-049", "让他想走就走，想留就留吧。"], ["c18-050", "我们现在，去休息，明天，我们靠自己，冲上去。”"]]}, {"t": "p", "s": [["c18-051", "大家一起点头，各自回到了帐篷里。"]]}, {"t": "p", "s": [["c18-052", "夜，已经很深了。"]]}, {"t": "img", "src": "images/141.webp?v=70472a387a", "vid": "images/141.mp4?v=998c6f2706", "cap": "睡不着的夜", "n": 97}, {"t": "p", "s": [["c18-053", "可是，营地里，有好几个人，睡不着。"]]}]}, {"title": "第十九章　夜里的间谍", "head": "c19-h", "audio": "audio/ch19.m4a?v=fd5c0a5d44", "duration": 348.177, "times": {"c19-h": [0.0, 3.03], "c19-001": [4.03, 7.91], "c19-002": [8.76, 19.847], "c19-003": [20.197, 25.664], "c19-004": [26.514, 33.343], "c19-005": [34.193, 40.967], "c19-006": [41.317, 46.797], "c19-007": [47.647, 54.214], "c19-008": [55.064, 63.553], "c19-009": [63.903, 69.298], "c19-010": [70.148, 80.058], "c19-011": [80.408, 84.758], "c19-012": [85.608, 89.671], "c19-013": [90.021, 91.681], "c19-014": [92.031, 95.747], "c19-015": [96.597, 99.792], "c19-016": [100.642, 103.804], "c19-017": [104.154, 107.671], "c19-018": [108.021, 111.594], "c19-019": [112.444, 117.919], "c19-020": [118.769, 131.416], "c19-021": [131.766, 134.734], "c19-022": [135.584, 143.455], "c19-023": [143.805, 152.825], "c19-024": [153.675, 159.324], "c19-025": [159.674, 164.145], "c19-026": [164.995, 168.992], "c19-027": [169.342, 174.05], "c19-028": [174.9, 177.357], "c19-029": [177.707, 180.183], "c19-030": [181.033, 186.063], "c19-031": [186.913, 190.398], "c19-032": [190.748, 201.293], "c19-033": [202.143, 206.521], "c19-034": [206.871, 210.514], "c19-035": [211.364, 221.101], "c19-036": [221.951, 225.33], "c19-037": [225.68, 227.922], "c19-038": [228.772, 232.921], "c19-039": [233.271, 241.672], "c19-040": [242.022, 260.984], "c19-041": [261.834, 271.366], "c19-042": [271.716, 274.522], "c19-043": [275.372, 280.082], "c19-044": [280.932, 289.278], "c19-045": [290.128, 299.16], "c19-046": [300.01, 306.562], "c19-047": [306.912, 310.335], "c19-048": [311.185, 316.359], "c19-049": [316.709, 323.214], "c19-050": [324.064, 337.182], "c19-051": [338.032, 344.158], "c19-052": [345.008, 346.677]}, "blocks": [{"t": "img", "src": "images/142.webp?v=65954d0f7a", "vid": "images/142.mp4?v=de8829ef81", "cap": "睡不着的元帅", "n": 98}, {"t": "p", "s": [["c19-001", "阿伽门农在帐篷里翻来覆去，睡不着觉。"]]}, {"t": "p", "s": [["c19-002", "他一会儿看看远处平原上，特洛伊人的火堆，一会儿又听听特洛伊人的笛子和风笛的声音，心里，像压了一块石头。"], ["c19-003", "他一把一把地拔着自己的头发，向天上的宙斯祈祷。"]]}, {"t": "p", "s": [["c19-004", "他悄悄披上一张狮子皮，拿起长矛，走出了帐篷，想去找老涅斯托尔商量。"]]}, {"t": "p", "s": [["c19-005", "他的弟弟墨涅拉俄斯，也没有睡着，也披着一张豹皮，走了出来。"], ["c19-006", "兄弟俩在黑暗里碰见了，一起去叫醒了老涅斯托尔。"]]}, {"t": "p", "s": [["c19-007", "老涅斯托尔一听，马上披上了衣服，拿起了长矛，说：“我们去看看哨兵吧。”"]]}, {"t": "p", "s": [["c19-008", "他们走到壕沟边，看见哨兵们，都睁着眼睛，像看着羊群的牧羊犬，一点也没有睡着。"], ["c19-009", "涅斯托尔笑着说：“好孩子们，这才是好样的。”"]]}, {"t": "p", "s": [["c19-010", "老涅斯托尔提议：“我们应该派一个人，趁着夜色，溜到特洛伊人的营地里，去打听一下，他们的打算。"], ["c19-011", "要是回来，一定会得到很多奖赏。”"]]}, {"t": "p", "s": [["c19-012", "狄奥墨得斯第一个站起来，说：“我去。"], ["c19-013", "可是，我想要一个伙伴。"], ["c19-014", "有两个人一起走，就可以互相照应，可以想得更周到。”"]]}, {"t": "p", "s": [["c19-015", "好几位英雄，都想和他一起去。"]]}, {"t": "p", "s": [["c19-016", "狄奥墨得斯却说：“我选奥德修斯。"], ["c19-017", "他的心，最勇敢，雅典娜也特别喜欢他。"], ["c19-018", "有他跟着我，就是穿过大火，也可以平安回来。”"]]}, {"t": "p", "s": [["c19-019", "奥德修斯笑着说：“你别夸我了，我们快走吧，夜已经快过去一大半了。”"]]}, {"t": "p", "s": [["c19-020", "两个人，披上了最轻便的盔甲，狄奥墨得斯戴着一顶用牛皮做的头盔，奥德修斯，戴着一顶用野猪牙镶成的头盔，那是他的外公送的。"], ["c19-021", "他们拿起了长矛，走进了黑暗里。"]]}, {"t": "img", "src": "images/39.webp?v=779e0313df", "vid": "images/39.mp4?v=4ee8488849", "cap": "夜里的间谍", "n": 99}, {"t": "p", "s": [["c19-022", "就在这时候特洛伊那边，也派出了一个侦察兵，名叫多隆，他是一个很会跑的人。"], ["c19-023", "他披着一张灰狼皮，戴着黄鼠狼皮做的帽子，手里拿着一根标枪，悄悄地，向希腊人的船边溜来。"]]}, {"t": "p", "s": [["c19-024", "奥德修斯一眼就看见了他，小声对狄奥墨得斯说：“趴下，别动。"], ["c19-025", "让他先过去，我们再从后面，追上他，把他赶到我们的船那边。”"]]}, {"t": "img", "src": "images/143.webp?v=05a321c06b", "vid": "images/143.mp4?v=afb48e87e4", "cap": "追赶多隆", "n": 100}, {"t": "p", "s": [["c19-026", "多隆跑得很快，像一条狗追着一只兔子。"], ["c19-027", "可是，狄奥墨得斯和奥德修斯，更快。"]]}, {"t": "p", "s": [["c19-028", "狄奥墨得斯大喊：“站住！"], ["c19-029", "不然，我的长矛，就要飞出去了！”"]]}, {"t": "p", "s": [["c19-030", "长矛，擦着多隆的肩膀，飞了过去，钉在了地上。"]]}, {"t": "p", "s": [["c19-031", "多隆吓得脸色发白，牙齿咯咯地响。"], ["c19-032", "他跪下来，说：“饶了我吧，我家里，有很多金子，要是你们放了我，我的父亲会送来很多的赎金。”"]]}, {"t": "p", "s": [["c19-033", "奥德修斯用温和的声音说：“别怕，孩子别想着死。"], ["c19-034", "告诉我，你为什么，一个人，溜到这里来？”"]]}, {"t": "p", "s": [["c19-035", "多隆，一五一十地，说了出来：“赫克托耳，答应送给我阿喀琉斯的战车和那两匹快马，要我来打听消息。”"]]}, {"t": "img", "src": "images/220.webp?v=25ae91cca8", "vid": "images/220.mp4?v=9170ca6703", "cap": "抓住了侦察兵", "n": 101}, {"t": "p", "s": [["c19-036", "奥德修斯又问：“特洛伊人，睡在哪里？"], ["c19-037", "他们的岗哨，是怎么站的？”"]]}, {"t": "p", "s": [["c19-038", "多隆说：“他们点起火堆，四处都有人看着。"], ["c19-039", "可是，那些从远方来的援军，睡得很死，他们不是自己的家，也不用管妻子和孩子。"], ["c19-040", "在最边上，是色雷斯人，他们的国王，叫瑞索斯，他的马，比雪还白，比风还快，他的战车，用金子和银子装饰，他的铠甲，是金子做的，大得凡人不适合穿，只适合神仙穿。”"]]}, {"t": "p", "s": [["c19-041", "狄奥墨得斯听了，对奥德修斯点了点头，说：“你已经说出了你知道的一切，现在，我们不能放你走。"], ["c19-042", "你要是回去，还是会成为我们的敌人。”"]]}, {"t": "p", "s": [["c19-043", "多隆，伸出手，想要摸他的下巴，求他饶命。"]]}, {"t": "p", "s": [["c19-044", "狄奥墨得斯没有再看他，只是把他的双手绑在了一棵树上，拿走了他的狼皮帽子和标枪。"]]}, {"t": "p", "s": [["c19-045", "两个人，把这些东西放在一棵柽柳树上，做了记号，然后，悄悄地摸进了色雷斯人的营地。"]]}, {"t": "p", "s": [["c19-046", "月光下，一匹一匹雪白的马，站在战车的旁边，睡得很香。"], ["c19-047", "国王瑞索斯，躺在中间一动也不动。"]]}, {"t": "img", "src": "images/40.webp?v=3633da3001", "vid": "images/40.mp4?v=e4450255b4", "cap": "雪白的快马", "n": 102}, {"t": "p", "s": [["c19-048", "狄奥墨得斯像一阵风，轻轻地走过了熟睡的人。"], ["c19-049", "奥德修斯解开了马的缰绳，把雪白的马，一匹一匹地牵了出来。"]]}, {"t": "p", "s": [["c19-050", "雅典娜从天上落了下来，站在狄奥墨得斯的身边，悄悄地说：“孩子，别再往前走了，快回到大船边去，不然会有别的神仙，把特洛伊人唤醒了。”"]]}, {"t": "img", "src": "images/144.webp?v=e71a13866f", "vid": "images/144.mp4?v=acb00a9e92", "cap": "骑上白马", "n": 103}, {"t": "p", "s": [["c19-051", "两个人，跳上白色的快马，像两个影子，向海边飞奔而去。"]]}, {"t": "p", "s": [["c19-052", "天，快亮了。"]]}]}, {"title": "第二十章　受伤的国王们", "head": "c20-h", "audio": "audio/ch20.m4a?v=505572f36f", "duration": 358.676, "times": {"c20-h": [0.0, 3.076], "c20-001": [4.076, 8.164], "c20-002": [9.014, 11.297], "c20-003": [11.647, 24.451], "c20-004": [24.801, 31.204], "c20-005": [32.054, 37.401], "c20-006": [38.251, 41.607], "c20-007": [41.957, 47.075], "c20-008": [47.425, 55.424], "c20-009": [56.274, 75.461], "c20-010": [76.311, 80.241], "c20-011": [81.091, 83.52], "c20-012": [84.37, 90.606], "c20-013": [90.956, 95.592], "c20-014": [95.942, 107.061], "c20-015": [107.911, 110.989], "c20-016": [111.839, 119.307], "c20-017": [120.157, 127.267], "c20-018": [128.117, 133.113], "c20-019": [133.463, 143.004], "c20-020": [143.854, 148.261], "c20-021": [148.611, 151.569], "c20-022": [152.419, 159.285], "c20-023": [159.635, 162.903], "c20-024": [163.753, 175.396], "c20-025": [176.246, 179.351], "c20-026": [180.201, 183.076], "c20-027": [183.426, 189.373], "c20-028": [189.723, 192.925], "c20-029": [193.775, 198.753], "c20-030": [199.603, 203.635], "c20-031": [203.985, 208.714], "c20-032": [209.564, 212.438], "c20-033": [212.788, 213.507], "c20-034": [213.857, 214.287], "c20-035": [215.137, 224.891], "c20-036": [225.741, 234.077], "c20-037": [234.427, 240.758], "c20-038": [241.608, 245.433], "c20-039": [246.283, 251.62], "c20-040": [252.47, 256.556], "c20-041": [256.906, 260.442], "c20-042": [261.292, 266.58], "c20-043": [266.93, 273.362], "c20-044": [274.212, 280.259], "c20-045": [281.109, 285.843], "c20-046": [286.193, 291.304], "c20-047": [291.654, 300.547], "c20-048": [301.397, 306.124], "c20-049": [306.474, 314.844], "c20-050": [315.694, 321.635], "c20-051": [321.985, 332.558], "c20-052": [332.908, 335.801], "c20-053": [336.151, 339.776], "c20-054": [340.626, 346.575], "c20-055": [346.925, 354.365], "c20-056": [355.215, 357.176]}, "blocks": [{"t": "p", "s": [["c20-001", "天一亮，战场上，又响起了号角声。"]]}, {"t": "img", "src": "images/41.webp?v=a9589d3041", "vid": "images/41.mp4?v=5be2da92cf", "cap": "元帅冲锋", "n": 104}, {"t": "p", "s": [["c20-002", "阿伽门农最先冲了出去。"], ["c20-003", "他穿着一件光闪闪的盔甲，胸甲上有十条蓝色的钢带，十二条金带，二十四条锡带，每一条，都像一条蛇一样，闪着光。"], ["c20-004", "他的盾牌上，画着一个可怕的怪物，那是一个长着蛇发的女妖。"]]}, {"t": "p", "s": [["c20-005", "天上，赫拉和雅典娜，发出了一阵雷鸣，替他加油。"]]}, {"t": "p", "s": [["c20-006", "那一天，阿伽门农，勇敢极了。"], ["c20-007", "他像一头狮子，冲进了特洛伊人的队伍，一连杀了十几个人。"], ["c20-008", "特洛伊人被他赶得像一群受惊的牛，一直逃到了城墙下，逃到了那棵老无花果树的旁边。"]]}, {"t": "img", "src": "images/145.webp?v=ba52e335f5", "vid": "images/145.mp4?v=3f8b84fc65", "cap": "彩虹的消息", "n": 105}, {"t": "p", "s": [["c20-009", "宙斯在伊达山顶看着这一切，派了彩虹女神伊里斯，去传话：“告诉赫克托耳，让他先别和阿伽门农打，等到国王受了伤，离开了战场，我就会给他力量，让他一直冲到大船边。”"]]}, {"t": "p", "s": [["c20-010", "赫克托耳听了，就叫特洛伊人，守在后面等着。"]]}, {"t": "p", "s": [["c20-011", "阿伽门农冲得越来越远。"]]}, {"t": "p", "s": [["c20-012", "可是，一个叫科翁的特洛伊人，用长矛，刺中了他的胳膊。"], ["c20-013", "阿伽门农一回手，用长矛，杀死了科翁。"], ["c20-014", "血，从他的伤口里，不停地流出来，一开始还很热，后来，血干了，疼得越来越厉害，就像女人生孩子时的痛。"]]}, {"t": "p", "s": [["c20-015", "他跳上战车，对车夫说：“快回去。”"]]}, {"t": "p", "s": [["c20-016", "他回头，大声喊：“朋友们，快挡住他们，保护大船，宙斯不让我在这里打下去了。”"]]}, {"t": "p", "s": [["c20-017", "赫克托耳一听这话，像一阵暴风，扑了过来，一连杀了九个希腊人。"]]}, {"t": "p", "s": [["c20-018", "狄奥墨得斯和奥德修斯，并肩站在一起拼命地拦着。"], ["c20-019", "可是，帕里斯，躲在一块石碑后面，射出了一箭，射穿了狄奥墨得斯的脚，把他钉在了地上。"]]}, {"t": "p", "s": [["c20-020", "帕里斯大笑着，跳出来，喊：“我一箭，没有射偏！"], ["c20-021", "要是我射中的，是你的肚子，就好了！”"]]}, {"t": "p", "s": [["c20-022", "狄奥墨得斯轻蔑地说：“你这个只会射冷箭的家伙，只有躲在石头后面，才敢射箭。"], ["c20-023", "你要是和我一对一，你的箭，什么用也没有。”"]]}, {"t": "p", "s": [["c20-024", "奥德修斯站在他的前面替他挡着，狄奥墨得斯，坐在地上拔出了脚上的箭，疼得叫了一声，跳上战车，也回到了大船边。"]]}, {"t": "img", "src": "images/42.webp?v=7960fef658", "vid": "images/42.mp4?v=0d1c07e87f", "cap": "被围住的奥德修斯", "n": 106}, {"t": "p", "s": [["c20-025", "奥德修斯一个人，被围在了中间。"]]}, {"t": "p", "s": [["c20-026", "他对自己说：“我现在，怎么办？"], ["c20-027", "要是我逃跑，是一种耻辱，可要是被他们抓住，我是一个人，也是危险。"], ["c20-028", "可是，一个勇敢的人，永远不能想着逃。”"]]}, {"t": "p", "s": [["c20-029", "特洛伊人像猎人围着一头野猪，一圈一圈地围上来。"]]}, {"t": "p", "s": [["c20-030", "他杀死了几个，自己的肋骨，也被刺伤了。"], ["c20-031", "雅典娜保住了他的命，没有让长矛刺进他的内脏。"]]}, {"t": "p", "s": [["c20-032", "奥德修斯大声喊：“墨涅拉俄斯！"], ["c20-033", "埃阿斯！"], ["c20-034", "快来！”"]]}, {"t": "p", "s": [["c20-035", "声音，传到了墨涅拉俄斯的耳朵里，他对大埃阿斯说：“你听，奥德修斯在喊，他一个人，被围住了。”"]]}, {"t": "img", "src": "images/146.webp?v=9b640fdb2b", "vid": "images/146.mp4?v=96f69defaf", "cap": "盾牌像塔", "n": 107}, {"t": "p", "s": [["c20-036", "大埃阿斯，拿着他那面像塔一样的大盾牌，冲了过去，把奥德修斯，护在了身后。"], ["c20-037", "特洛伊人就像一群豺狼，看见了狮子，一下子，就散开了。"]]}, {"t": "p", "s": [["c20-038", "墨涅拉俄斯扶着奥德修斯，回到了战车上。"]]}, {"t": "p", "s": [["c20-039", "那一天，希腊最勇敢的英雄，一个接一个，受了伤。"]]}, {"t": "p", "s": [["c20-040", "医生马卡昂，也被帕里斯射中了肩膀。"], ["c20-041", "老涅斯托尔驾着战车，把他送回了大船边。"]]}, {"t": "p", "s": [["c20-042", "阿喀琉斯站在自己大船的船尾上，远远地望着战场。"], ["c20-043", "他看见了那辆战车，认出了涅斯托尔，却没有看清，车上的是谁。"]]}, {"t": "p", "s": [["c20-044", "他对帕特洛克罗斯说：“你去问一问，被老涅斯托尔，送回来的，是谁？”"]]}, {"t": "img", "src": "images/147.webp?v=0952bba29e", "vid": "images/147.mp4?v=46cdb8e6d6", "cap": "抬回大船", "n": 108}, {"t": "p", "s": [["c20-045", "战场上，一批一批的伤员，被抬回了大船边。"], ["c20-046", "医生们挽起袖子，一刻不停地洗伤口、敷药、包扎。"], ["c20-047", "有的人咬着一块木头，不让自己叫出声来；有的人躺在那里，望着天空，心里想着家里的人。"]]}, {"t": "p", "s": [["c20-048", "老涅斯托尔扶着受伤的马卡昂，一路慢慢地走着。"], ["c20-049", "他一边走，一边小声地对他说：“孩子，别睡着，看着我，咱们马上就到了。”"]]}, {"t": "p", "s": [["c20-050", "在大船后面，有几位老人，正坐在一起，默默地磨着长矛。"], ["c20-051", "他们年轻的时候，都是勇士，现在，打不动了，可是，每一天，仍然把矛尖，磨得闪闪发亮。"], ["c20-052", "有人问他们：“您几位，歇一会儿吧。”"], ["c20-053", "老人笑着说：“歇着，心里更慌。”"]]}, {"t": "p", "s": [["c20-054", "有一个小男孩，是军医的徒弟，提着一个小药箱，一路小跑。"], ["c20-055", "他的小脸，被汗水冲出了一道一道的白印子，可是，他一点也不觉得累。"]]}, {"t": "p", "s": [["c20-056", "帕特洛克罗斯走了过去。"]]}]}, {"title": "第二十一章　城墙被冲破了", "head": "c21-h", "audio": "audio/ch21.m4a?v=eb8fc2347d", "duration": 372.249, "times": {"c21-h": [0.0, 3.099], "c21-001": [4.099, 7.741], "c21-002": [8.591, 15.215], "c21-003": [15.565, 24.997], "c21-004": [25.347, 29.837], "c21-005": [30.687, 39.05], "c21-006": [39.4, 44.927], "c21-007": [45.277, 52.635], "c21-008": [52.985, 60.219], "c21-009": [64.252, 69.961], "c21-010": [70.811, 79.615], "c21-011": [79.965, 92.261], "c21-012": [92.611, 96.595], "c21-013": [96.945, 100.998], "c21-014": [101.348, 114.086], "c21-015": [114.436, 118.504], "c21-016": [119.354, 122.839], "c21-017": [123.689, 132.892], "c21-018": [133.242, 142.29], "c21-019": [143.14, 149.238], "c21-020": [150.088, 158.205], "c21-021": [158.555, 166.122], "c21-022": [166.972, 168.634], "c21-023": [169.484, 174.822], "c21-024": [175.672, 179.334], "c21-025": [179.684, 196.287], "c21-026": [197.137, 201.475], "c21-027": [201.825, 207.676], "c21-028": [208.526, 211.97], "c21-029": [212.82, 216.129], "c21-030": [216.479, 220.502], "c21-031": [220.852, 224.965], "c21-032": [225.815, 227.947], "c21-033": [228.797, 236.183], "c21-034": [236.533, 239.849], "c21-035": [240.699, 246.882], "c21-036": [247.232, 254.481], "c21-037": [255.331, 263.055], "c21-038": [263.405, 268.845], "c21-039": [269.695, 277.272], "c21-040": [278.122, 285.11], "c21-041": [285.96, 287.931], "c21-042": [288.281, 290.462], "c21-043": [291.312, 294.397], "c21-044": [295.247, 302.989], "c21-045": [303.339, 314.811], "c21-046": [315.661, 322.189], "c21-047": [323.039, 331.75], "c21-048": [332.1, 341.259], "c21-049": [342.109, 348.097], "c21-050": [348.447, 351.617], "c21-051": [352.467, 358.2], "c21-052": [358.55, 366.126], "c21-053": [366.976, 370.749]}, "blocks": [{"t": "img", "src": "images/43.webp?v=8d7a7006cf", "vid": "images/43.mp4?v=c878304345", "cap": "担心的朋友", "n": 109}, {"t": "p", "s": [["c21-001", "帕特洛克罗斯走到了老涅斯托尔的帐篷前。"]]}, {"t": "img", "src": "images/148.webp?v=dcede4f863", "vid": "images/148.mp4?v=e7c1a9a67e", "cap": "调药的姑娘", "n": 110}, {"t": "p", "s": [["c21-002", "他看见受伤的马卡昂，躺在椅子上一位美丽的姑娘，正在给他调一杯蜜酒。"], ["c21-003", "老涅斯托尔拉着帕特洛克罗斯的手，请他坐下，可是帕特洛克罗斯说：“老人家，我不能坐，阿喀琉斯，在等我回话。"], ["c21-004", "我只是想知道，被送回来的，是不是马卡昂。”"]]}, {"t": "p", "s": [["c21-005", "老涅斯托尔叹了一口气，说：“阿喀琉斯，为什么，现在才关心我们的伤员呢？"], ["c21-006", "他难道不知道，我们这里最勇敢的人，都受了伤吗？"], ["c21-007", "狄奥墨得斯，奥德修斯，阿伽门农，现在，都躺在帐篷里。"], ["c21-008", "可是，阿喀琉斯，他的心，像一块冷石头，一点也不为我们难过。"], ["c21-009", "要等到我们的大船，被大火烧光，他才会明白吗？”"]]}, {"t": "p", "s": [["c21-010", "他看着帕特洛克罗斯，慢慢地说：“我年轻的时候，和你的父亲，一起去过阿喀琉斯的家。"], ["c21-011", "你的父亲对你说：‘孩子，阿喀琉斯，比你高贵，可是，你比他年长，你要给他出好主意，要用温和的话，劝劝他。’"], ["c21-012", "现在，你为什么，不去劝他呢？"], ["c21-013", "你们去，也许，他会听你的话。"], ["c21-014", "要是他不愿意回来，那你就请他，把他的盔甲，借给你，你穿上它，特洛伊人，会以为你是他，就会吓得，不敢进攻。"], ["c21-015", "我们累极了的战士，就可以喘一口气。”"]]}, {"t": "p", "s": [["c21-016", "帕特洛克罗斯听得心里一阵一阵地发热。"]]}, {"t": "p", "s": [["c21-017", "他快步走回帐篷，在半路上，看见了受伤的欧律皮洛斯，一个瘸着腿的英雄，正一拐一拐地走着。"], ["c21-018", "帕特洛克罗斯把他扶回了自己的帐篷，给他的伤口，敷上了药，又用温水给他洗干净了血迹。"]]}, {"t": "p", "s": [["c21-019", "希腊人的战壕外，赫克托耳，正带着特洛伊人，向前冲。"]]}, {"t": "img", "src": "images/149.webp?v=5aebf98dd9", "vid": "images/149.mp4?v=265c2a46f4", "cap": "深深的壕沟", "n": 111}, {"t": "p", "s": [["c21-020", "壕沟，又深又宽，里面，插着许多尖尖的木桩，马和战车，根本不能过去。"], ["c21-021", "预言家波吕达马斯说：“赫克托耳，我们把战车，留在外面，大家下车，跟着你，走过去。”"]]}, {"t": "p", "s": [["c21-022", "赫克托耳同意了。"]]}, {"t": "p", "s": [["c21-023", "特洛伊人分成五队，像五条大河，涌向了希腊人的墙。"]]}, {"t": "p", "s": [["c21-024", "在墙头上一直站着一个人，守着。"], ["c21-025", "就在特洛伊人快要冲上来的时候，天上飞来了一只老鹰，爪子里，抓着一条血红色的大蛇，那条蛇，一回头，咬了老鹰一口，老鹰疼得松开了爪子，蛇，掉在了特洛伊人的队伍中间。"]]}, {"t": "p", "s": [["c21-026", "波吕达马斯，对赫克托耳说：“这是一个坏兆头。"], ["c21-027", "我们要是冲进去，也会像这只老鹰一样，抓到了猎物，却回不来了。”"]]}, {"t": "p", "s": [["c21-028", "可是，赫克托耳，很不高兴。"]]}, {"t": "p", "s": [["c21-029", "他说：“波吕达马斯，你说的话，我不爱听。"], ["c21-030", "宙斯，已经答应了我，对于一只鸟，我才不在乎。"], ["c21-031", "最好的预兆，只有一个：为自己的国家，去战斗！”"]]}, {"t": "p", "s": [["c21-032", "他一个人，冲了上去。"]]}, {"t": "p", "s": [["c21-033", "特洛伊人跟着他一起，用石头砸，用长矛刺，向墙上，一层一层地涌去。"], ["c21-034", "墙上的希腊人，也拼命地反击。"]]}, {"t": "p", "s": [["c21-035", "一个叫萨耳佩冬的人，是宙斯的儿子，他是吕喀亚人的国王。"], ["c21-036", "他像一头山里的狮子，饿了好几天，闯进了羊圈，一个人，就拆掉了城垛。"]]}, {"t": "p", "s": [["c21-037", "赫克托耳看见了一块大石头，放在门口的地上，两个最强壮的人，也抬不动。"], ["c21-038", "可是，他一个人，举了起来，像举着一块小木板。"]]}, {"t": "img", "src": "images/44.webp?v=f49096416a", "vid": "images/44.mp4?v=11f222696a", "cap": "赫克托耳砸开城门", "n": 112}, {"t": "p", "s": [["c21-039", "他把石头砸在了墙门上门闩，应声断了，两扇大门，一下子，被砸开了。"]]}, {"t": "p", "s": [["c21-040", "赫克托耳像一团黑色的夜云，冲了进去，眼睛里，闪着火焰一样的光。"]]}, {"t": "p", "s": [["c21-041", "他大喊：“特洛伊人！"], ["c21-042", "跟我冲进去，烧了他们的船！”"]]}, {"t": "p", "s": [["c21-043", "特洛伊人像潮水一样，涌了进来。"]]}, {"t": "p", "s": [["c21-044", "路上，有一只小鸟，落在了帕特洛克罗斯的肩膀上，叽叽地叫了两声，又飞走了。"], ["c21-045", "他望着它飞远的方向，心里想：要是能像它一样，飞到阿喀琉斯面前，把大家的难处，都讲给他听，该多好。"]]}, {"t": "p", "s": [["c21-046", "他握了握拳头，下定了决心：不管阿喀琉斯怎么说，我都要去试一试。"]]}, {"t": "img", "src": "images/150.webp?v=9abd8a963b", "vid": "images/150.mp4?v=4ab1bffb45", "cap": "擦拭铠甲", "n": 113}, {"t": "p", "s": [["c21-047", "帕特洛克罗斯回到帐篷里的时候，阿喀琉斯，正在用一块软布，一遍一遍地擦着一把小竖琴。"], ["c21-048", "他的动作，很慢，很轻，好像手里托着的，不是琴，而是一只受了伤的小鸟。"]]}, {"t": "p", "s": [["c21-049", "帕特洛克罗斯，在门口站了很久，几次张开嘴，又合上了。"], ["c21-050", "他不知道，应该怎样，开口。"]]}, {"t": "p", "s": [["c21-051", "远远地，有一队士兵，抬着一个受伤的朋友，从他身边走过。"], ["c21-052", "帕特洛克罗斯，让到了一边，看着他们的背影，心里，又添了一分着急。"]]}, {"t": "p", "s": [["c21-053", "希腊人吓得，向大船那边，乱成了一团。"]]}]}, {"title": "第二十二章　海神的帮助", "head": "c22-h", "audio": "audio/ch22.m4a?v=d2b13c6c62", "duration": 374.37, "times": {"c22-h": [0.0, 3.143], "c22-001": [4.143, 11.652], "c22-002": [12.002, 15.633], "c22-003": [16.483, 18.573], "c22-004": [19.423, 26.102], "c22-005": [26.452, 31.301], "c22-006": [32.151, 39.161], "c22-007": [39.511, 50.652], "c22-008": [51.002, 58.731], "c22-009": [59.581, 64.563], "c22-010": [65.413, 78.258], "c22-011": [79.108, 84.507], "c22-012": [85.357, 93.668], "c22-013": [94.018, 105.134], "c22-014": [105.484, 108.51], "c22-015": [109.36, 120.24], "c22-016": [121.09, 131.918], "c22-017": [132.768, 134.923], "c22-018": [135.273, 139.099], "c22-019": [139.949, 148.601], "c22-020": [148.951, 157.032], "c22-021": [157.882, 162.195], "c22-022": [163.045, 166.071], "c22-023": [166.421, 174.294], "c22-024": [175.144, 178.484], "c22-025": [179.334, 186.339], "c22-026": [186.689, 190.309], "c22-027": [190.659, 192.727], "c22-028": [193.577, 201.987], "c22-029": [202.337, 210.115], "c22-030": [210.965, 212.36], "c22-031": [213.21, 216.26], "c22-032": [216.61, 231.129], "c22-033": [231.979, 242.846], "c22-034": [243.696, 248.722], "c22-035": [249.072, 256.872], "c22-036": [257.722, 262.947], "c22-037": [263.297, 266.019], "c22-038": [266.869, 271.915], "c22-039": [272.265, 272.914], "c22-040": [273.764, 278.9], "c22-041": [279.25, 281.611], "c22-042": [282.461, 289.379], "c22-043": [289.729, 295.443], "c22-044": [296.293, 299.786], "c22-045": [300.136, 302.064], "c22-046": [302.914, 309.219], "c22-047": [310.069, 313.11], "c22-048": [313.46, 321.539], "c22-049": [321.889, 324.887], "c22-050": [325.737, 329.549], "c22-051": [330.399, 336.018], "c22-052": [336.368, 348.096], "c22-053": [348.946, 355.259], "c22-054": [355.609, 363.828], "c22-055": [364.678, 372.87]}, "blocks": [{"t": "p", "s": [["c22-001", "宙斯看着特洛伊人，冲进了希腊人的营地，满意地，转过了头，不再看他们。"], ["c22-002", "他不相信，别的神仙，还会来帮忙。"]]}, {"t": "p", "s": [["c22-003", "可是，他想错了。"]]}, {"t": "p", "s": [["c22-004", "海神波塞冬，坐在海边的一座高山上，把一切，都看在了眼里。"], ["c22-005", "他心疼那些被追得到处乱跑的希腊人，又气又急。"]]}, {"t": "img", "src": "images/45.webp?v=be4fb6430b", "vid": "images/45.mp4?v=c859308105", "cap": "海神来帮忙", "n": 114}, {"t": "p", "s": [["c22-006", "他拿着三叉戟，一步，就走下了山，大地都在他的脚下抖了起来。"], ["c22-007", "他有一座金色的宫殿，在深深的海底，他在宫殿里套上了两匹铜蹄的骏马，坐上了金色的战车，在浪尖上飞驰。"], ["c22-008", "海里的鱼、海豚和海怪，都从水底钻出来，高高兴兴地跳着，给他让路。"]]}, {"t": "p", "s": [["c22-009", "他的马，跑得太快了，车轴，一点也没有被浪沾湿。"]]}, {"t": "p", "s": [["c22-010", "他一直跑到了希腊人的大船边，把马，拴在了一个山洞里，给它们喂了仙草，又用金色的链子，把它们的腿绊住，好让它们不乱跑。"]]}, {"t": "img", "src": "images/151.webp?v=cb2dc1e114", "vid": "images/151.mp4?v=feaf734df1", "cap": "变成预言家的海神", "n": 115}, {"t": "p", "s": [["c22-011", "他变成了一个预言家卡尔卡斯的样子，找到了两个埃阿斯。"]]}, {"t": "p", "s": [["c22-012", "他对他们说：“埃阿斯，你们是希腊人的救星，你们要想着勇敢，别想着逃跑。"], ["c22-013", "别的地方，我都不怕，可是这里，赫克托耳，像一团火一样冲来，我怕他，会烧掉我们的船。"], ["c22-014", "快上去吧，神会帮你们的。”"]]}, {"t": "p", "s": [["c22-015", "他用手杖轻轻地碰了碰两个埃阿斯，他们的身体，一下子，充满了力量，腿和手，变得很轻，很灵活。"]]}, {"t": "p", "s": [["c22-016", "小埃阿斯对大埃阿斯，说：“哥哥，我觉得，我的心，在胸膛里，热得发烫，我的手，一直想战斗。”"]]}, {"t": "p", "s": [["c22-017", "大埃阿斯说：“我也是。"], ["c22-018", "我觉得，好像有一位神仙，给了我力气。”"]]}, {"t": "p", "s": [["c22-019", "波塞冬又找到了那些，被打得坐在地上哭的希腊人，对他们说：“你们为什么，不去战斗了呢？"], ["c22-020", "赫克托耳，不过，是一个人而已，我们这么多人，怎么能怕他一个人？”"]]}, {"t": "p", "s": [["c22-021", "他用手轻轻拍着他们的肩膀，一个一个地鼓励他们。"]]}, {"t": "p", "s": [["c22-022", "希腊人的队伍，重新站了起来。"], ["c22-023", "他们像一堵厚厚的墙，盾挨着盾，矛挨着矛，把冲进来的特洛伊人，挡在了外面。"]]}, {"t": "p", "s": [["c22-024", "赫克托耳用尽了力气也冲不进去。"]]}, {"t": "p", "s": [["c22-025", "一个叫伊多墨纽斯的克里特国王，勇敢极了，带着自己的人，从后面赶了上来。"], ["c22-026", "他对另一个英雄墨里奥涅斯说：“你的长矛呢？"], ["c22-027", "快去拿，我们得一起挡住他们。”"]]}, {"t": "p", "s": [["c22-028", "在奥林匹斯山上，天后赫拉，从山顶，看见了波塞冬正在帮助希腊人，高兴极了。"], ["c22-029", "可是，她又看见了坐在伊达山上的宙斯，心里，一下子，非常恼火。"]]}, {"t": "p", "s": [["c22-030", "她想了一个办法。"]]}, {"t": "p", "s": [["c22-031", "她回到了自己的房间，关上了门。"], ["c22-032", "她用神仙的香油，洗了澡，把头发，梳得又光又亮，穿上一件雅典娜织的紫红色长裙，戴上耳环、项链、面纱，又去找阿芙洛狄忒。"]]}, {"t": "img", "src": "images/46.webp?v=0b7ba4fd7b", "vid": "images/46.mp4?v=990f3f9bd6", "cap": "借爱情的腰带", "n": 116}, {"t": "p", "s": [["c22-033", "她骗阿芙洛狄忒，说：“亲爱的，请你借给我你那条绣着爱情的腰带，我要去，劝我的两位老朋友，不再吵架。”"]]}, {"t": "p", "s": [["c22-034", "阿芙洛狄忒笑着，把那条腰带，解了下来，交给了她。"], ["c22-035", "那条腰带上，绣着爱情、欲望、温柔的话语，谁看了，都会爱上她。"]]}, {"t": "p", "s": [["c22-036", "赫拉又去找睡眠之神，对他说：“你去，让宙斯睡着。"], ["c22-037", "我送你一把金椅子，永远不会坏。”"]]}, {"t": "p", "s": [["c22-038", "睡眠之神，有点害怕，说：“我曾经被宙斯，追打过。"], ["c22-039", "我可不敢。”"]]}, {"t": "p", "s": [["c22-040", "赫拉又答应，把一位最美丽的女神，嫁给他。"], ["c22-041", "睡眠之神，才答应了。"]]}, {"t": "img", "src": "images/152.webp?v=240c9cd295", "vid": "images/152.mp4?v=73cfd76fd4", "cap": "金色的云", "n": 117}, {"t": "p", "s": [["c22-042", "她走到了伊达山，宙斯一看见她，心里，一下子，被爱情占满了。"], ["c22-043", "他坐在山顶上看着她，温柔地说：“赫拉，你要去哪里？”"]]}, {"t": "p", "s": [["c22-044", "赫拉笑着，说：“我要去看望海边的老朋友。"], ["c22-045", "我想，先来告诉你一声。”"]]}, {"t": "p", "s": [["c22-046", "宙斯拉着她的手，说：“来，我们坐下，先好好地，待一会儿吧。”"]]}, {"t": "p", "s": [["c22-047", "他们在一团金色的云里，坐了下来。"], ["c22-048", "草地上，开出了一大片，柔软的花，三叶草、番红花、风信子。"], ["c22-049", "云里，落下了金色的小雨。"]]}, {"t": "img", "src": "images/153.webp?v=69d174c311", "vid": "images/153.mp4?v=3132ac5cdc", "cap": "宙斯睡着了", "n": 118}, {"t": "p", "s": [["c22-050", "宙斯慢慢地，闭上了眼睛，睡着了。"]]}, {"t": "p", "s": [["c22-051", "浪花一朵一朵地打在大船的木头上，发出轻轻的声响。"], ["c22-052", "波塞冬站在水边，用手摸了摸一条受伤的小船，像一位老爷爷摸着自己的小孙子，温和地说：“别怕，有我在呢。”"]]}, {"t": "p", "s": [["c22-053", "海风里，有一股咸咸的味道，也有一点点，雨前的凉。"], ["c22-054", "大地，似乎在微微地颤抖，好像，有一位看不见的巨人，正在慢慢地走近。"]]}, {"t": "p", "s": [["c22-055", "睡眠之神，飞下山去，告诉波塞冬：“现在，可以放手帮助希腊人了，宙斯睡着了。”"]]}]}, {"title": "第二十三章　大火烧到了船", "head": "c23-h", "audio": "audio/ch23.m4a?v=e48f9834f6", "duration": 380.221, "times": {"c23-h": [0.0, 3.15], "c23-001": [4.15, 11.759], "c23-002": [12.609, 16.82], "c23-003": [17.17, 24.922], "c23-004": [25.272, 29.527], "c23-005": [29.877, 33.836], "c23-006": [34.686, 44.305], "c23-007": [45.155, 47.803], "c23-008": [48.653, 52.954], "c23-009": [53.304, 61.692], "c23-010": [62.542, 70.202], "c23-011": [70.552, 75.504], "c23-012": [76.354, 88.36], "c23-013": [89.21, 96.137], "c23-014": [96.487, 103.306], "c23-015": [104.156, 108.123], "c23-016": [108.973, 118.969], "c23-017": [119.819, 125.132], "c23-018": [125.982, 139.274], "c23-019": [140.124, 153.07], "c23-020": [157.101, 159.927], "c23-021": [160.277, 170.705], "c23-022": [171.555, 182.147], "c23-023": [182.497, 186.976], "c23-024": [187.826, 204.834], "c23-025": [205.684, 208.462], "c23-026": [209.312, 219.933], "c23-027": [220.283, 222.692], "c23-028": [223.042, 230.583], "c23-029": [231.433, 234.945], "c23-030": [235.295, 244.514], "c23-031": [245.364, 254.334], "c23-032": [254.684, 263.739], "c23-033": [264.589, 268.556], "c23-034": [269.406, 273.053], "c23-035": [273.903, 276.634], "c23-036": [276.984, 284.707], "c23-037": [285.057, 294.586], "c23-038": [295.436, 298.997], "c23-039": [299.347, 300.281], "c23-040": [301.131, 309.118], "c23-041": [309.968, 313.004], "c23-042": [313.854, 319.564], "c23-043": [319.914, 323.012], "c23-044": [323.862, 330.044], "c23-045": [330.894, 339.207], "c23-046": [339.557, 344.429], "c23-047": [344.779, 346.566], "c23-048": [347.416, 353.304], "c23-049": [354.154, 360.613], "c23-050": [360.963, 367.52], "c23-051": [368.37, 374.507], "c23-052": [375.357, 378.721]}, "blocks": [{"t": "p", "s": [["c23-001", "睡眠之神，飞下了山，悄悄地告诉波塞冬：现在，可以放手去帮助希腊人了。"]]}, {"t": "p", "s": [["c23-002", "波塞冬一下子，冲到了队伍的最前面。"], ["c23-003", "他大声地喊：“希腊人，难道，我们真的要把胜利，让给赫克托耳吗？"], ["c23-004", "他会烧毁我们的大船，抢走我们的荣誉。"], ["c23-005", "来，我们拿最好的盾牌，把胸膛挺起来！”"]]}, {"t": "p", "s": [["c23-006", "他手里的那把剑闪着一道长长的闪电，像一道不可碰的光，没有一个凡人，敢拿着矛，走到它的面前。"]]}, {"t": "p", "s": [["c23-007", "两边的人，又打到了一起。"]]}, {"t": "p", "s": [["c23-008", "赫克托耳举起了长矛，向大埃阿斯，投了过去。"], ["c23-009", "长矛打在埃阿斯胸前的两条皮带上，一条是盾牌的，一条是剑的，一点也没有伤到他。"]]}, {"t": "p", "s": [["c23-010", "埃阿斯随手捡起了一块大石头，那是用来固定大船的石头，有一人那么大，放在脚边。"], ["c23-011", "他举起石头，转了一圈，向赫克托耳，砸了出去。"]]}, {"t": "img", "src": "images/47.webp?v=73f94d7148", "vid": "images/47.mp4?v=863445487f", "cap": "赫克托耳倒下了", "n": 119}, {"t": "p", "s": [["c23-012", "石头，砸在了赫克托耳的胸口上，他像一棵被闪电劈断的橡树，轰的一声，倒在了地上手里的长矛和盾牌，都掉了。"]]}, {"t": "p", "s": [["c23-013", "特洛伊人大叫着，拼命地冲上去，用盾牌，围住了他，把他，抬出了战场。"], ["c23-014", "人们，把他放在战车上送到了河边，用清凉的河水，泼在他的脸上。"]]}, {"t": "p", "s": [["c23-015", "他吐出了一口黑色的血，又倒了下去，昏了过去。"]]}, {"t": "p", "s": [["c23-016", "希腊人看见赫克托耳，被抬走了，高兴得大喊着，冲上去，把特洛伊人，追得，一直追到了壕沟边上。"]]}, {"t": "p", "s": [["c23-017", "就在这时候宙斯，在伊达山顶，醒了过来。"]]}, {"t": "p", "s": [["c23-018", "他一睁眼，就看见了，希腊人，在追赶特洛伊人，赫克托耳，躺在平原上口里吐着血，波塞冬，正在战场上帮着希腊人。"]]}, {"t": "p", "s": [["c23-019", "宙斯怒不可遏，瞪着赫拉，说：“你这个狡猾的家伙，是你用你的诡计，让我睡着了，让赫克托耳，受了伤。"], ["c23-020", "我真想用鞭子，抽你一顿。"], ["c23-021", "你忘了，你曾经，被吊在天上，两个脚上，挂着铁砧，是我把你放下来的吗？”"]]}, {"t": "p", "s": [["c23-022", "赫拉吓得发抖，说：“我对大地、天空和冥河的水发誓，不是我，让波塞冬帮的忙，是他自己，同情那些希腊人。"], ["c23-023", "要是你愿意，我可以劝他，回到海里去，听你的话。”"]]}, {"t": "p", "s": [["c23-024", "宙斯叹了一口气，笑了，说：“好，赫拉，你去，叫彩虹女神伊里斯，叫波塞冬回去，再让阿波罗，去给赫克托耳，疗伤给他力量。”"]]}, {"t": "p", "s": [["c23-025", "波塞冬不情愿地，回到了海里。"]]}, {"t": "img", "src": "images/154.webp?v=b3e7568165", "vid": "images/154.mp4?v=edc36b7386", "cap": "阿波罗扶起赫克托耳", "n": 120}, {"t": "p", "s": [["c23-026", "阿波罗，悄悄地来到了赫克托耳的身边，对他说：“赫克托耳，你为什么，躺在这里，没有力气？"], ["c23-027", "我是阿波罗，是来救你的。"], ["c23-028", "你快起来，叫你的骑兵，冲到大船边去，我会走在你的前面，替你把路，铺平。”"]]}, {"t": "p", "s": [["c23-029", "赫克托耳的身体里，充满了新的力量。"], ["c23-030", "他像一匹吃饱了麦子的骏马，挣断了缰绳，飞奔着，冲出了马厩，一路狂奔，往河里跑去。"]]}, {"t": "img", "src": "images/155.webp?v=51512bb196", "vid": "images/155.mp4?v=5d7ca4db9a", "cap": "推倒壕沟", "n": 121}, {"t": "p", "s": [["c23-031", "阿波罗走在特洛伊人的前面，用他的手，轻轻一推，那道又深又宽的壕沟，就被填平了。"], ["c23-032", "他用沙子堆起了一座大桥，希腊人垒起来的那堵墙，在他的手里，像一座沙堡，被推倒了。"]]}, {"t": "p", "s": [["c23-033", "特洛伊人像一股洪水，冲进了希腊人的营地。"]]}, {"t": "p", "s": [["c23-034", "他们赶着战车，向着大船，冲了过去。"]]}, {"t": "p", "s": [["c23-035", "希腊人在大船边拼命地挡着。"], ["c23-036", "他们爬上船尾，用长长的船篙，用手里的长矛，打退一个又一个冲上来的敌人。"], ["c23-037", "大埃阿斯站在一条条船的甲板上，跳来跳去，手里，举着一根十几米长的大长矛，守着。"]]}, {"t": "img", "src": "images/48.webp?v=08e2a8566b", "vid": "images/48.mp4?v=6d111a31ed", "cap": "烧着的大船", "n": 122}, {"t": "p", "s": [["c23-038", "赫克托耳举着火把，大喊：“给我火！"], ["c23-039", "给我火！”"]]}, {"t": "p", "s": [["c23-040", "一个特洛伊人，抱着一团火，冲到了一条船的旁边，往船尾的木头上，扔了过去。"]]}, {"t": "p", "s": [["c23-041", "火苗，一下子，升了起来。"]]}, {"t": "p", "s": [["c23-042", "红色的火舌，像一条长长的蛇，沿着船板，爬上了桅杆。"], ["c23-043", "浓浓的黑烟，升到了天空。"]]}, {"t": "p", "s": [["c23-044", "希腊人大叫着，端着水，冲了过去，可是，来不及了。"]]}, {"t": "p", "s": [["c23-045", "大埃阿斯站在剩下的船边，对着人们，大声地喊：“我的朋友们，大船是我们回家的路。"], ["c23-046", "要是没了船，我们就回不了家，就会永远留在这个陌生的地方！"], ["c23-047", "勇敢些，别后退一步！”"]]}, {"t": "p", "s": [["c23-048", "他挥舞着长矛，把冲上来的特洛伊人，一个一个地，打了回去。"]]}, {"t": "img", "src": "images/156.webp?v=54b0292e31", "vid": "images/156.mp4?v=731ba0411f", "cap": "传水桶", "n": 123}, {"t": "p", "s": [["c23-049", "一位老水手，抱着一桶水，从火边跑过，被烟熏得直咳嗽。"], ["c23-050", "他一边跑，一边对身边的年轻人喊：“快，把水递过来，别让火烧到帆上去！”"]]}, {"t": "p", "s": [["c23-051", "年轻人把水桶一只一只传过去，手都磨破了，可是谁也没有停下来。"]]}, {"t": "p", "s": [["c23-052", "天空，被烧得，红了半边。"]]}]}, {"title": "第二十四章　帕特洛克罗斯的请求", "head": "c24-h", "audio": "audio/ch24.m4a?v=78a20c09cc", "duration": 348.084, "times": {"c24-h": [0.0, 3.656], "c24-001": [4.656, 9.302], "c24-002": [10.152, 16.993], "c24-003": [17.343, 25.794], "c24-004": [26.644, 35.381], "c24-005": [35.731, 36.79], "c24-006": [37.14, 41.322], "c24-007": [41.672, 45.965], "c24-008": [46.815, 53.68], "c24-009": [54.03, 56.849], "c24-010": [57.199, 63.938], "c24-011": [64.288, 70.497], "c24-012": [71.347, 84.079], "c24-013": [84.429, 92.111], "c24-014": [92.461, 97.072], "c24-015": [97.422, 103.098], "c24-016": [103.948, 110.118], "c24-017": [110.468, 114.1], "c24-018": [114.45, 120.039], "c24-019": [120.389, 126.479], "c24-020": [126.829, 128.183], "c24-021": [129.033, 134.016], "c24-022": [134.366, 146.301], "c24-023": [146.651, 157.712], "c24-024": [158.562, 167.568], "c24-025": [168.418, 173.393], "c24-026": [174.243, 190.254], "c24-027": [190.604, 205.034], "c24-028": [205.884, 214.631], "c24-029": [214.981, 220.594], "c24-030": [221.444, 231.565], "c24-031": [231.915, 235.708], "c24-032": [236.558, 246.348], "c24-033": [247.198, 254.138], "c24-034": [254.488, 261.801], "c24-035": [262.151, 267.444], "c24-036": [268.294, 281.391], "c24-037": [281.741, 286.564], "c24-038": [287.414, 288.692], "c24-039": [289.542, 292.305], "c24-040": [292.655, 297.262], "c24-041": [297.612, 308.63], "c24-042": [309.48, 316.231], "c24-043": [316.581, 324.974], "c24-044": [325.324, 332.478], "c24-045": [333.328, 335.061], "c24-046": [335.411, 336.303], "c24-047": [337.153, 342.619], "c24-048": [343.469, 346.584]}, "blocks": [{"t": "img", "src": "images/157.webp?v=0f342f1038", "vid": "images/157.mp4?v=940e142bd7", "cap": "流泪的朋友", "n": 124}, {"t": "p", "s": [["c24-001", "帕特洛克罗斯站在阿喀琉斯的身后，泪流满面。"]]}, {"t": "p", "s": [["c24-002", "他看见了远处，被烧着的大船，看见了一个又一个，受伤的希腊人。"], ["c24-003", "他的眼泪，一颗一颗，掉在了地上像一股清泉，从黑色的石头上，滴落下来。"]]}, {"t": "p", "s": [["c24-004", "阿喀琉斯看着他，心疼地说：“帕特洛克罗斯，你为什么，哭得像一个小女孩，拉着妈妈的衣裙，求她抱抱？"], ["c24-005", "你有什么坏消息吗？"], ["c24-006", "是不是，你的父亲，或者我的父亲，去世了？"], ["c24-007", "还是，你在为那些，在大船边，受苦的希腊人哭泣？”"]]}, {"t": "p", "s": [["c24-008", "帕特洛克罗斯擦了擦眼泪，说：“阿喀琉斯，我最勇敢的朋友，请不要生气。"], ["c24-009", "希腊人，真的遇到了大麻烦。"], ["c24-010", "阿伽门农，被刺伤了，狄奥墨得斯，也受了伤，奥德修斯，也受了伤。"], ["c24-011", "医生们，用药治他们，可是，你的心，却一点也没有被软化。”"]]}, {"t": "img", "src": "images/49.webp?v=8523f1797b", "vid": "images/49.mp4?v=eb4af9c7ee", "cap": "借盔甲", "n": 125}, {"t": "p", "s": [["c24-012", "“我真怀疑，你的父亲不是珀琉斯，你的母亲也不是忒提斯，你是从大海里的一块岩石里，蹦出来的，要不然，你的心，怎么会这么硬？"], ["c24-013", "要是你，心里有什么预言，不能出战，那么请让我，穿上你的盔甲，带着你的部队去。"], ["c24-014", "特洛伊人，看见我，以为是你，就会吓得，不敢再打。"], ["c24-015", "我们这些筋疲力尽的人，可以歇一口气，把他们，赶回城里去。”"]]}, {"t": "p", "s": [["c24-016", "阿喀琉斯叹了一口气，说：“我的朋友，我心里，不是不为他们难过。"], ["c24-017", "可是，我实在忘不掉，他当众羞辱我的那一刻。"], ["c24-018", "阿伽门农，夺走了我的奖品，就像夺走了一个没有人尊敬的流浪汉的东西。"], ["c24-019", "可是，我说过，只要特洛伊人，没有杀到我的大船边，我就不再生气。"], ["c24-020", "我不能一直这样记仇。”"]]}, {"t": "p", "s": [["c24-021", "他想了想，说：“好，你去吧，穿上我的盔甲，带上我的部队。"], ["c24-022", "去保护大船，赶走特洛伊人，可是，你要答应我，只要把他们，赶出了大船，就马上回来，不要追到城墙下去，更不要和赫克托耳硬拼。"], ["c24-023", "因为，要是你，抢走了我本来想要得到的荣誉，我会很伤心的，也不要，想着攻下特洛伊，因为，有神仙在那里，保护着它。”"]]}, {"t": "p", "s": [["c24-024", "他一边说，一边向远处看看到了一条船，已经烧着了，火苗，一直窜到了天空。"]]}, {"t": "p", "s": [["c24-025", "他急忙说：“快，快去，穿上盔甲，我去召集我的人。”"]]}, {"t": "img", "src": "images/158.webp?v=a147a05455", "vid": "images/158.mp4?v=8e50a5e27e", "cap": "穿上盔甲", "n": 126}, {"t": "p", "s": [["c24-026", "帕特洛克罗斯穿上了阿喀琉斯的盔甲：先是青铜做的护腿，再是闪闪发光的胸甲，肩上，挂着镶银钉的宝剑，手里，拿着盾牌，头上，戴着插着马鬃的头盔。"], ["c24-027", "只有一样东西，他没有拿，是阿喀琉斯的那支大长矛，那支长矛，是智慧的老半人马，从山上砍来的，只有阿喀琉斯一个人，拿得动。"]]}, {"t": "p", "s": [["c24-028", "阿喀琉斯召集了他的部队，五十条船，每条船上，有五十个战士，他们叫密耳弥冬人。"], ["c24-029", "他们像饿了好几天的狼，围着自己的帐篷，等着战斗的号令。"]]}, {"t": "p", "s": [["c24-030", "阿喀琉斯对他们说：“密耳弥冬人，你们以前，总是对我生气，说我不让你们出战，说我是一个，只知道发脾气的人。"], ["c24-031", "现在，你们要的战争，来了，勇敢地去吧！”"]]}, {"t": "p", "s": [["c24-032", "士兵们，像一堵厚厚的墙，盾挨着盾，头盔挨着头盔，站得紧紧的，连一根针，也插不进去。"]]}, {"t": "img", "src": "images/50.webp?v=a8c55c4170", "vid": "images/50.mp4?v=de1b0afa1b", "cap": "金色的杯子", "n": 127}, {"t": "p", "s": [["c24-033", "阿喀琉斯回到帐篷里，打开了一个雕花的箱子，那是他的母亲，放在船上的。"], ["c24-034", "箱子里，有一只金色的杯子，只有他一个人，用它来喝酒、向宙斯献祭。"], ["c24-035", "他用硫黄把杯子洗得干干净净，倒上了红红的酒。"]]}, {"t": "p", "s": [["c24-036", "他站在帐篷前对天空，高高地举起酒杯，大声祈祷：“宙斯，请您让帕特洛克罗斯，赢得荣耀，让他平平安安，带着我的盔甲，回到我的身边。"], ["c24-037", "我把他，送到战场上，可是，我要留在这里。”"]]}, {"t": "p", "s": [["c24-038", "宙斯听见了。"]]}, {"t": "p", "s": [["c24-039", "帐篷外，天色已经有些暗了。"], ["c24-040", "海风带着一点咸咸的味道，吹动了帕特洛克罗斯的衣角。"], ["c24-041", "他看着阿喀琉斯，把那件闪闪发光的盔甲，慢慢地披在自己身上，忽然觉得，肩膀上沉沉的，像扛着整个希腊人的希望。"]]}, {"t": "img", "src": "images/159.webp?v=c7f4c661eb", "vid": "images/159.mp4?v=ae62cf9273", "cap": "临行的叮嘱", "n": 128}, {"t": "p", "s": [["c24-042", "帕特洛克罗斯穿好盔甲，转过身来，阿喀琉斯，一下子愣住了。"], ["c24-043", "那个人，站在昏黄的灯光里，高高的个子，闪着金光的头盔，几乎和他自己，一模一样。"], ["c24-044", "他忽然有一点害怕，不是怕别的，而是怕，自己说不出口的那份担心。"]]}, {"t": "p", "s": [["c24-045", "他轻轻地说：“你要小心。"], ["c24-046", "记住我说的话。”"]]}, {"t": "p", "s": [["c24-047", "帕特洛克罗斯，笑了笑，说：“放心，我会回来的。”"]]}, {"t": "p", "s": [["c24-048", "可是，他只答应了，一半。"]]}]}, {"title": "第二十五章　穿着盔甲的朋友", "head": "c25-h", "audio": "audio/ch25.m4a?v=0344a765eb", "duration": 372.262, "times": {"c25-h": [0.0, 3.647], "c25-001": [4.647, 9.378], "c25-002": [10.228, 18.82], "c25-003": [19.67, 30.79], "c25-004": [31.64, 42.386], "c25-005": [42.736, 51.331], "c25-006": [52.181, 64.429], "c25-007": [65.279, 73.066], "c25-008": [73.916, 78.219], "c25-009": [79.069, 80.143], "c25-010": [80.493, 85.509], "c25-011": [86.359, 89.822], "c25-012": [90.672, 94.17], "c25-013": [94.52, 102.577], "c25-014": [103.427, 114.031], "c25-015": [114.881, 121.083], "c25-016": [121.933, 129.549], "c25-017": [130.399, 133.847], "c25-018": [134.697, 142.232], "c25-019": [143.082, 146.186], "c25-020": [146.536, 161.622], "c25-021": [162.472, 165.273], "c25-022": [166.123, 171.52], "c25-023": [172.37, 175.783], "c25-024": [176.133, 186.5], "c25-025": [186.85, 193.117], "c25-026": [193.967, 199.015], "c25-027": [199.365, 205.086], "c25-028": [205.436, 211.756], "c25-029": [212.106, 216.976], "c25-030": [217.826, 220.616], "c25-031": [221.466, 229.33], "c25-032": [230.18, 233.514], "c25-033": [234.364, 249.269], "c25-034": [250.119, 258.293], "c25-035": [258.643, 261.908], "c25-036": [262.258, 266.061], "c25-037": [266.911, 283.577], "c25-038": [284.427, 289.284], "c25-039": [290.134, 292.066], "c25-040": [292.916, 296.223], "c25-041": [296.573, 304.721], "c25-042": [305.571, 312.037], "c25-043": [312.387, 317.925], "c25-044": [318.275, 323.047], "c25-045": [323.397, 326.952], "c25-046": [327.802, 332.325], "c25-047": [332.675, 341.283], "c25-048": [341.633, 342.622], "c25-049": [342.972, 351.373], "c25-050": [352.223, 358.239], "c25-051": [358.589, 364.779], "c25-052": [365.629, 370.762]}, "blocks": [{"t": "img", "src": "images/51.webp?v=e671904d92", "vid": "images/51.mp4?v=597d4542db", "cap": "密耳弥冬人冲锋", "n": 129}, {"t": "p", "s": [["c25-001", "帕特洛克罗斯带着密耳弥冬人，冲出了营地。"]]}, {"t": "p", "s": [["c25-002", "他们像一群被激怒的黄蜂，当有人去捅蜂窝，就一下子飞出来，把路过的人，团团围住。"]]}, {"t": "p", "s": [["c25-003", "帕特洛克罗斯大声喊：“密耳弥冬人，要记住阿喀琉斯，是怎么吩咐你们的，你们要让阿伽门农，明白他的错误！”"]]}, {"t": "p", "s": [["c25-004", "特洛伊人远远地，看见了那一身熟悉的盔甲，看见了那高高的马鬃，心里，一下子，充满了恐惧。"], ["c25-005", "他们以为，阿喀琉斯，已经出来了，一个个，四处张望，想找一条逃命的路。"]]}, {"t": "img", "src": "images/160.webp?v=1aa86ef209", "vid": "images/160.mp4?v=d60c4fddbd", "cap": "扑灭大火", "n": 130}, {"t": "p", "s": [["c25-006", "帕特洛克罗斯，冲到了最先着火的那条船的旁边，一矛，刺倒了点火的人，高声大喊，让人们赶快，把火扑灭。"]]}, {"t": "p", "s": [["c25-007", "特洛伊人被吓得退到了一边，大船上的火，被扑灭了，冒着一缕一缕的青烟。"]]}, {"t": "p", "s": [["c25-008", "希腊人又重新，聚在了一起大声欢呼。"]]}, {"t": "p", "s": [["c25-009", "“把他们赶走！”"], ["c25-010", "帕特洛克罗斯向前冲，“别让他们，靠近我们的船！”"]]}, {"t": "p", "s": [["c25-011", "特洛伊人的队伍，被冲得七零八落。"]]}, {"t": "p", "s": [["c25-012", "赫克托耳调转了马头，也要逃。"], ["c25-013", "可是，他的马，被大壕沟，挡住了，好多人，被挤在了沟里。"]]}, {"t": "img", "src": "images/52.webp?v=faeabeaed0", "vid": "images/52.mp4?v=59ea2d3924", "cap": "神马克珊托斯", "n": 131}, {"t": "p", "s": [["c25-014", "帕特洛克罗斯驾着阿喀琉斯的那两匹神马，克珊托斯和巴利奥斯，一跃，就越过了壕沟，一直冲向了平原。"]]}, {"t": "p", "s": [["c25-015", "那两匹马，是神马，跑起来，像风一样，从来没有输过。"]]}, {"t": "p", "s": [["c25-016", "他一路杀去，像一场大雨，冲过大地，所有的河流，都涨满了水。"]]}, {"t": "p", "s": [["c25-017", "特洛伊人一个个，被赶回了城墙下。"]]}, {"t": "p", "s": [["c25-018", "赫克托耳咬着牙，不想后退，可是，他的朋友们，已经乱成了一团。"]]}, {"t": "p", "s": [["c25-019", "神仙们也在天上看着这场战争。"], ["c25-020", "宙斯的儿子，萨耳佩冬，吕喀亚人的国王，看见了他的人，被帕特洛克罗斯，打得节节败退，他从战车上跳下来，说：“让开，我要去，会会这个人，看看他，到底是谁。”"]]}, {"t": "p", "s": [["c25-021", "帕特洛克罗斯也跳下了战车。"]]}, {"t": "p", "s": [["c25-022", "两个英雄，像两只发怒的老鹰，扑在一起大声地吼叫。"]]}, {"t": "img", "src": "images/161.webp?v=b4652327cd", "vid": "images/161.mp4?v=e766062fb5", "cap": "宙斯的难过", "n": 132}, {"t": "p", "s": [["c25-023", "宙斯在天上看着，心里很难过。"], ["c25-024", "他对赫拉说：“唉，萨耳佩冬，是我最疼爱的儿子，命运让他死在了帕特洛克罗斯手里。"], ["c25-025", "我真想，把他从战场上，抱走送回他的故乡，吕喀亚。”"]]}, {"t": "p", "s": [["c25-026", "赫拉皱着眉头，说：“你这个，威严的宙斯，你说的是什么话？"], ["c25-027", "一个凡人，早就注定了命运，你想把他，从死亡中拉回来吗？"], ["c25-028", "要是你这样做，别的神仙，也会这样做，到时候，天下就会大乱了。"], ["c25-029", "你不如，让他的兄弟们，把他的尸体，送回家，好好安葬。”"]]}, {"t": "p", "s": [["c25-030", "宙斯叹了一口气，点了点头。"]]}, {"t": "p", "s": [["c25-031", "可是，他让天上下起了血红色的雨点，落在大地上为他的儿子，流下了泪。"]]}, {"t": "p", "s": [["c25-032", "帕特洛克罗斯一矛，击倒了萨耳佩冬。"]]}, {"t": "p", "s": [["c25-033", "萨耳佩冬倒在地上像一棵倒下的大松树，抓着地上的尘土，对朋友格劳科斯，说：“朋友，不要让他们，抢走我的盔甲，你要像一个，真正的英雄一样，保护我。”"]]}, {"t": "p", "s": [["c25-034", "格劳科斯，心里难过极了，他自己的手臂，也受了伤，他向阿波罗祈祷。"], ["c25-035", "阿波罗听到了，治好了他的伤。"], ["c25-036", "他召集了吕喀亚人，围在国王的尸体周围。"]]}, {"t": "p", "s": [["c25-037", "宙斯还是想办法，让阿波罗，把萨耳佩冬的身体，从战场上，擦干净血迹，抹上神仙的油，交给睡眠和死亡这两位孪生神，带回了遥远的吕喀亚，让他的亲人，为他举行葬礼。"]]}, {"t": "p", "s": [["c25-038", "帕特洛克罗斯打得，越来越勇敢，越来越高兴。"]]}, {"t": "p", "s": [["c25-039", "他忘了阿喀琉斯的叮嘱。"]]}, {"t": "p", "s": [["c25-040", "特洛伊人的队伍，乱成了一锅粥。"], ["c25-041", "有的人扔下了盾牌，有的人丢掉了头盔，有的人一边跑一边回头看，吓得连路都认不清了。"]]}, {"t": "p", "s": [["c25-042", "可是，有一个人，一直没有后退，那就是赫克托耳。"], ["c25-043", "他站在远处，看着那一身熟悉的盔甲，眉头皱得紧紧的。"], ["c25-044", "他在心里想：这一次，是不是真的是阿喀琉斯？"], ["c25-045", "可是，他又觉得，哪里有一点不对劲。"]]}, {"t": "img", "src": "images/221.webp?v=55f6493bbf", "vid": "images/221.mp4?v=a71f0355bc", "cap": "沙滩上的欢呼", "n": 133}, {"t": "p", "s": [["c25-046", "那天，大船边的沙滩上，到处是欢呼声。"], ["c25-047", "刚才还躺在地上、满脸是灰的希腊人，现在，一个个跳起来，大声地喊着：“阿喀琉斯！"], ["c25-048", "阿喀琉斯！”"], ["c25-049", "他们不知道，那个穿着盔甲的人，不是阿喀琉斯，只知道，希望，又回来了。"]]}, {"t": "p", "s": [["c25-050", "有的密耳弥冬人，一边冲，一边大声地唱起了家乡的歌。"], ["c25-051", "歌声，沙哑，却很响，在战场上，一阵一阵地回荡。"]]}, {"t": "img", "src": "images/162.webp?v=ff3da7cad6", "vid": "images/162.mp4?v=ab778ab0e5", "cap": "城墙下", "n": 134}, {"t": "p", "s": [["c25-052", "他一直，往前冲，往前冲，冲到了特洛伊的城墙下。"]]}]}, {"title": "第二十六章　帕特洛克罗斯倒下了", "head": "c26-h", "audio": "audio/ch26.m4a?v=6ba5cb398c", "duration": 349.672, "times": {"c26-h": [0.0, 3.679], "c26-001": [4.679, 9.402], "c26-002": [10.252, 17.873], "c26-003": [18.723, 20.689], "c26-004": [21.039, 29.753], "c26-005": [30.603, 34.838], "c26-006": [35.188, 43.536], "c26-007": [44.386, 48.751], "c26-008": [49.601, 56.695], "c26-009": [57.045, 63.033], "c26-010": [63.383, 67.077], "c26-011": [67.927, 72.911], "c26-012": [73.761, 83.905], "c26-013": [84.255, 89.934], "c26-014": [90.784, 93.314], "c26-015": [94.164, 100.792], "c26-016": [101.642, 110.496], "c26-017": [111.346, 120.4], "c26-018": [121.25, 125.77], "c26-019": [126.12, 132.029], "c26-020": [132.879, 137.912], "c26-021": [138.762, 143.212], "c26-022": [144.062, 150.318], "c26-023": [150.668, 157.966], "c26-024": [158.816, 169.479], "c26-025": [170.329, 175.562], "c26-026": [176.412, 186.468], "c26-027": [187.318, 194.722], "c26-028": [195.572, 200.159], "c26-029": [201.009, 204.815], "c26-030": [205.665, 209.529], "c26-031": [210.379, 219.263], "c26-032": [219.613, 226.382], "c26-033": [226.732, 229.853], "c26-034": [230.703, 241.059], "c26-035": [241.409, 249.856], "c26-036": [250.706, 254.279], "c26-037": [255.129, 264.558], "c26-038": [265.408, 269.453], "c26-039": [269.803, 275.809], "c26-040": [276.159, 282.915], "c26-041": [283.765, 288.633], "c26-042": [288.983, 297.698], "c26-043": [298.548, 303.395], "c26-044": [303.745, 310.012], "c26-045": [310.362, 313.935], "c26-046": [314.285, 323.142], "c26-047": [323.992, 329.245], "c26-048": [329.595, 337.154], "c26-049": [338.004, 348.172]}, "blocks": [{"t": "p", "s": [["c26-001", "特洛伊的城墙，高高地矗立着，像一座灰色的山。"]]}, {"t": "p", "s": [["c26-002", "帕特洛克罗斯三次想爬上城墙，三次，都被一只无形的大手，推了回来。"]]}, {"t": "img", "src": "images/53.webp?v=ec9303c9ad", "vid": "images/53.mp4?v=0abdb72ce9", "cap": "阿波罗的手", "n": 135}, {"t": "p", "s": [["c26-003", "他抬起头，吃了一惊。"], ["c26-004", "在城墙的角楼上，站着一位神仙，穿着闪光的衣服，脸上蒙着一层雾，是阿波罗。"]]}, {"t": "p", "s": [["c26-005", "阿波罗大声说：“退下去，帕特洛克罗斯！"], ["c26-006", "特洛伊，不是你的矛，能攻下来的，也不是阿喀琉斯，能攻下来的，他比你，强得多。”"]]}, {"t": "p", "s": [["c26-007", "帕特洛克罗斯吓了一跳，慢慢地，退了回来。"]]}, {"t": "img", "src": "images/163.webp?v=d26d3844d6", "vid": "images/163.mp4?v=2f41d5eda0", "cap": "斯卡亚门前", "n": 136}, {"t": "p", "s": [["c26-008", "赫克托耳站在斯卡亚门口，不知道，应该继续冲上去，还是退回城里。"], ["c26-009", "阿波罗变成了他的叔叔，对他说：“赫克托耳，你为什么，不打了？"], ["c26-010", "去，驾上战车，冲出去，我会帮你。”"]]}, {"t": "p", "s": [["c26-011", "赫克托耳驾着战车，向帕特洛克罗斯，冲了过去。"]]}, {"t": "p", "s": [["c26-012", "帕特洛克罗斯从战车上跳了下来，左手拿着长矛，右手，捡起了一块白色的大石头，朝赫克托耳，砸了过去。"], ["c26-013", "石头，砸在了赫克托耳的车夫的头上，车夫，倒了下去。"]]}, {"t": "p", "s": [["c26-014", "赫克托耳也跳下了战车。"]]}, {"t": "p", "s": [["c26-015", "两个人，像两头山上的狮子，为了一头小鹿，打成了一团。"]]}, {"t": "p", "s": [["c26-016", "特洛伊人和希腊人，一起，涌了上来，战场上，一阵混乱，灰尘遮住了太阳。"]]}, {"t": "p", "s": [["c26-017", "直到太阳，偏西的时候，希腊人，才占了上风，把帕特洛克罗斯，拖出了人群。"]]}, {"t": "p", "s": [["c26-018", "帕特洛克罗斯又冲了上去，一连刺倒了许多人。"], ["c26-019", "可是，这时候，有一位神，悄悄地，走到了他的背后。"]]}, {"t": "p", "s": [["c26-020", "那是阿波罗，他的脸上，罩着一层浓浓的雾。"]]}, {"t": "p", "s": [["c26-021", "他伸出手，在帕特洛克罗斯的背上，打了一下。"]]}, {"t": "img", "src": "images/164.webp?v=b8de1d5d62", "vid": "images/164.mp4?v=d7346a6887", "cap": "滚落的头盔", "n": 137}, {"t": "p", "s": [["c26-022", "帕特洛克罗斯眼前一黑，头盔，掉在了地上滚到了马蹄下。"], ["c26-023", "它的马鬃，沾满了灰尘，那是阿喀琉斯的头盔，从来没有被灰尘弄脏过。"]]}, {"t": "p", "s": [["c26-024", "他手里的长矛，一下子，断了，盾牌，也从肩上滑了下来，胸甲，被解开，落在了地上。"]]}, {"t": "p", "s": [["c26-025", "他像一个，被人从梦里推醒的人，站在那里什么也不知道。"]]}, {"t": "p", "s": [["c26-026", "一个叫欧福耳玻斯的特洛伊人，从后面，用长矛，轻轻地，刺了他一下，就悄悄地躲开了。"]]}, {"t": "p", "s": [["c26-027", "帕特洛克罗斯想退回到自己的人群里，可是，赫克托耳，已经看见了。"]]}, {"t": "p", "s": [["c26-028", "他冲上去，一矛，刺进了帕特洛克罗斯的身体。"]]}, {"t": "p", "s": [["c26-029", "帕特洛克罗斯重重地，倒在了地上。"]]}, {"t": "p", "s": [["c26-030", "希腊人看见了，发出了一声悲伤的叫喊。"]]}, {"t": "p", "s": [["c26-031", "赫克托耳站在他的身边得意地说：“帕特洛克罗斯，你以为，你可以攻下特洛伊城，把我们的女人，抓回你们的船上。"], ["c26-032", "可是，我的快马，保护着我们，我的长矛，比谁都快，它让你，倒在了这里。"], ["c26-033", "可怜的人，阿喀琉斯，也救不了你了。”"]]}, {"t": "p", "s": [["c26-034", "帕特洛克罗斯用最后一点力气，说：“赫克托耳，你不要得意，是宙斯，是阿波罗，把我打败的，不是你。"], ["c26-035", "你自己，也活不长了，死亡和命运，已经站在了你的身边，阿喀琉斯，会来找你的。”"]]}, {"t": "p", "s": [["c26-036", "说完，他的眼睛，慢慢地闭上了。"]]}, {"t": "p", "s": [["c26-037", "赫克托耳想拔出自己的长矛，向车夫，投去，可是，车夫，已经驾着车，逃远了。"]]}, {"t": "p", "s": [["c26-038", "平原上，忽然，刮起了一阵大风。"], ["c26-039", "风里，有尘土，有碎草，也有一种说不出的凉意。"], ["c26-040", "远处，有一只乌鸦，在天空中盘旋，叫声又长又哑。"]]}, {"t": "p", "s": [["c26-041", "站在大船边的希腊人，不知道为什么，心突然紧了一下。"], ["c26-042", "他们转过头，向战场的方向望去，什么也没有看见，只看见一团灰色的烟，慢慢地升了起来。"]]}, {"t": "img", "src": "images/165.webp?v=8e191e6883", "vid": "images/165.mp4?v=edb3092c78", "cap": "帐篷里的寒战", "n": 138}, {"t": "p", "s": [["c26-043", "在远处的帐篷里，阿喀琉斯，忽然，打了一个寒战。"], ["c26-044", "他放下手里的竖琴，走到门口，望着战场的方向，看了很久。"], ["c26-045", "他对自己说：“怎么回事，心跳得这样厉害？”"], ["c26-046", "可是，他什么也没有看见，只看见了，被夕阳染红的云，一片一片，铺满了天空。"]]}, {"t": "p", "s": [["c26-047", "风渐渐地大了，吹得帐篷的布帘，啪啪地响。"], ["c26-048", "有一只小狗，不知道从哪里跑出来，对着战场的方向，呜呜地叫着，怎么哄也不肯停。"]]}, {"t": "p", "s": [["c26-049", "他蹲下来，开始，把阿喀琉斯那一身，闪着光的盔甲，从帕特洛克罗斯的身上，一件一件地，脱了下来。"]]}]}, {"title": "第二十七章　争夺尸体", "head": "c27-h", "audio": "audio/ch27.m4a?v=a183996294", "duration": 351.872, "times": {"c27-h": [0.0, 2.747], "c27-001": [3.747, 9.092], "c27-002": [9.942, 21.888], "c27-003": [22.738, 29.321], "c27-004": [30.171, 35.511], "c27-005": [36.361, 39.276], "c27-006": [40.126, 45.245], "c27-007": [45.595, 52.784], "c27-008": [53.634, 68.616], "c27-009": [68.966, 77.361], "c27-010": [78.211, 85.891], "c27-011": [86.741, 97.657], "c27-012": [98.007, 103.823], "c27-013": [104.673, 119.773], "c27-014": [120.123, 122.033], "c27-015": [122.883, 129.968], "c27-016": [130.318, 132.488], "c27-017": [133.338, 144.667], "c27-018": [145.517, 150.669], "c27-019": [151.519, 155.076], "c27-020": [155.426, 159.396], "c27-021": [160.246, 174.074], "c27-022": [174.924, 179.246], "c27-023": [179.596, 187.956], "c27-024": [188.806, 201.213], "c27-025": [201.563, 205.703], "c27-026": [206.053, 211.932], "c27-027": [212.782, 224.034], "c27-028": [224.384, 231.263], "c27-029": [232.113, 236.345], "c27-030": [237.195, 247.442], "c27-031": [247.792, 255.878], "c27-032": [256.728, 263.389], "c27-033": [264.239, 268.402], "c27-034": [269.252, 272.867], "c27-035": [273.717, 278.895], "c27-036": [279.245, 286.814], "c27-037": [287.664, 291.108], "c27-038": [291.458, 297.669], "c27-039": [298.019, 301.381], "c27-040": [302.231, 310.008], "c27-041": [310.358, 317.793], "c27-042": [318.143, 321.224], "c27-043": [322.074, 329.221], "c27-044": [329.571, 330.335], "c27-045": [330.685, 340.991], "c27-046": [341.841, 350.372]}, "blocks": [{"t": "img", "src": "images/54.webp?v=df3b619bb4", "vid": "images/54.mp4?v=cc3c2502a4", "cap": "守护朋友", "n": 139}, {"t": "p", "s": [["c27-001", "墨涅拉俄斯是第一个，看见帕特洛克罗斯倒下的希腊人。"]]}, {"t": "p", "s": [["c27-002", "他像一头母牛，保护着刚出生的小牛一样，站在尸体的旁边，把盾牌和长矛，都举了起来，大声地喊：“来吧，谁敢走近一步！”"]]}, {"t": "p", "s": [["c27-003", "欧福耳玻斯走上来，说：“墨涅拉俄斯，你让开，别让我把你的盔甲，也带回去。”"]]}, {"t": "p", "s": [["c27-004", "墨涅拉俄斯毫不退让，一矛，把他杀死了。"]]}, {"t": "p", "s": [["c27-005", "赫克托耳在远处听到了，赶了回来。"]]}, {"t": "p", "s": [["c27-006", "他脱下了自己的盔甲，把阿喀琉斯那一身，穿在了身上。"], ["c27-007", "那身盔甲，又亮，又重，穿在他的身上闪着金光，像战神阿瑞斯。"]]}, {"t": "p", "s": [["c27-008", "宙斯看见了，摇着头，说：“可怜的赫克托耳，你穿上了，一个最强大的人的盔甲，可是，你一点也不知道，死亡已经离你很近了。"], ["c27-009", "你再也回不到你的妻子身边，不会让她，从你手里，接过阿喀琉斯的盔甲了。”"]]}, {"t": "p", "s": [["c27-010", "他轻轻地，点了点头，赫克托耳的身体里，一下子，充满了无边的力量。"]]}, {"t": "p", "s": [["c27-011", "赫克托耳大声地呼喊着，召集了盟友们：“朋友们，我不是为了，要你们的人数，才叫你们来的，我是为了，让你们保护我们的妻子和孩子。"], ["c27-012", "你们，谁能把帕特洛克罗斯，拖回特洛伊，我就把战利品，分一半给他！”"]]}, {"t": "p", "s": [["c27-013", "墨涅拉俄斯一看，赫克托耳，带着大队的人马，冲了过来，急忙，对大埃阿斯说：“埃阿斯，快来，我们要保护帕特洛克罗斯的尸体，别让它，落到特洛伊人的手里。"], ["c27-014", "阿喀琉斯，一定很伤心。”"]]}, {"t": "img", "src": "images/166.webp?v=4b4341754b", "vid": "images/166.mp4?v=9a3625920a", "cap": "塔一样的盾牌", "n": 140}, {"t": "p", "s": [["c27-015", "大埃阿斯走在最前面用他那面像塔一样的盾牌，把尸体，护在了后面。"], ["c27-016", "小埃阿斯也冲了过来。"]]}, {"t": "p", "s": [["c27-017", "两边的人，围着帕特洛克罗斯，拉来拉去，一会儿，往东，一会儿，往西，像一群蚂蚁，抬着一块大面包。"]]}, {"t": "p", "s": [["c27-018", "天上的太阳，被尘土，遮住了，灰蒙蒙的。"]]}, {"t": "p", "s": [["c27-019", "阿喀琉斯还在大船边等着他的朋友回来。"], ["c27-020", "他不知道，帕特洛克罗斯，已经倒下了。"]]}, {"t": "p", "s": [["c27-021", "墨涅拉俄斯对老涅斯托尔的儿子，安提洛科斯，说：“你快去，告诉阿喀琉斯，他的朋友，倒下了，让他快点来，救出尸体，盔甲已经被赫克托耳，拿走了。”"]]}, {"t": "p", "s": [["c27-022", "安提洛科斯，是希腊军中，跑得最快的小伙子。"], ["c27-023", "他一听，眼泪就流了下来，把盾牌，交给了朋友拼命地，向大船跑去。"]]}, {"t": "p", "s": [["c27-024", "阿喀琉斯正站在船边担心着，他看见，远处，特洛伊人，已经，冲到了大船边，希腊人，在哭喊着，乱跑。"], ["c27-025", "他对自己说：“我早就知道，这样的事，会发生。"], ["c27-026", "母亲对我说过，在我活着的时候，我最好的朋友，会死在特洛伊人的手里。”"]]}, {"t": "img", "src": "images/167.webp?v=666530340f", "vid": "images/167.mp4?v=97c0843ddd", "cap": "报信的人", "n": 141}, {"t": "p", "s": [["c27-027", "安提洛科斯，跑到了他的面前，一边哭，一边说：“阿喀琉斯，我带来了一个，可怕的消息，我希望，这一切，不是真的。"], ["c27-028", "帕特洛克罗斯，倒下了，大家正在争夺他的尸体，他的盔甲，被赫克托耳，拿走了。”"]]}, {"t": "p", "s": [["c27-029", "一团黑色的云，罩在了阿喀琉斯的心上。"]]}, {"t": "img", "src": "images/55.webp?v=253f7e5590", "vid": "images/55.mp4?v=b980f04051", "cap": "悲伤的阿喀琉斯", "n": 142}, {"t": "p", "s": [["c27-030", "他用双手抓起了地上的黑色灰尘，撒在了自己的头上，又撒在了美丽的脸上，金色的头发，也变成了灰色。"], ["c27-031", "他一下子，倒在了地上在尘土里，打着滚，撕扯着自己的头发，大声地哭喊。"]]}, {"t": "p", "s": [["c27-032", "帐篷里的姑娘们，听见了，也都跑出来，哭着，捶着自己的胸口。"]]}, {"t": "p", "s": [["c27-033", "安提洛科斯，抓着他的手，怕他伤了自己。"]]}, {"t": "p", "s": [["c27-034", "阿喀琉斯哭得，那样大声，那样悲伤。"]]}, {"t": "p", "s": [["c27-035", "他的哭声，像一阵风，吹到了深深的大海里。"], ["c27-036", "他的母亲，忒提斯，坐在她的父亲老海神的身边，听见了儿子的哭声。"]]}, {"t": "p", "s": [["c27-037", "暮色，一点一点地，爬上了平原。"], ["c27-038", "云层的缝隙里，透出了一道红红的光，像一条长长的伤口。"], ["c27-039", "风里，带着一点点潮湿的味道。"]]}, {"t": "img", "src": "images/168.webp?v=d0df448931", "vid": "images/168.mp4?v=467752dc93", "cap": "暮色里的守护", "n": 143}, {"t": "p", "s": [["c27-040", "在这样的光里，墨涅拉俄斯望着地上的帕特洛克罗斯，心里，难受极了。"], ["c27-041", "他想起了这位年轻人平时笑眯眯的样子，总是第一个给别人端汤，第一个替别人包扎伤口。"], ["c27-042", "他轻轻地对自己说：“我一定要把他带回去。”"]]}, {"t": "p", "s": [["c27-043", "有一个年轻的士兵，趴在尸体旁边，小声地说：“帕特洛克罗斯，你听得见吗？"], ["c27-044", "我们来接你了。”"], ["c27-045", "他的声音，被喊杀声盖住了，可是，他还是一遍一遍地说，好像怕他一个人，在这里，会害怕。"]]}, {"t": "p", "s": [["c27-046", "忒提斯急忙，带着一群，海里的姐妹，浮出了水面，向特洛伊的海边，游去。"]]}]}, {"title": "第二十八章　阿喀琉斯的哭声", "head": "c28-h", "audio": "audio/ch28.m4a?v=45efa1470f", "duration": 362.975, "times": {"c28-h": [0.0, 3.43], "c28-001": [4.43, 7.49], "c28-002": [8.34, 13.051], "c28-003": [13.401, 20.26], "c28-004": [21.11, 29.796], "c28-005": [30.146, 34.295], "c28-006": [34.645, 38.747], "c28-007": [39.097, 46.164], "c28-008": [47.014, 60.085], "c28-009": [60.935, 64.086], "c28-010": [64.436, 68.26], "c28-011": [68.61, 75.632], "c28-012": [76.482, 80.969], "c28-013": [81.319, 84.914], "c28-014": [85.264, 88.102], "c28-015": [88.452, 93.027], "c28-016": [93.877, 96.509], "c28-017": [97.359, 101.228], "c28-018": [101.578, 116.486], "c28-019": [116.836, 120.863], "c28-020": [121.713, 132.84], "c28-021": [133.69, 136.986], "c28-022": [137.836, 144.212], "c28-023": [145.062, 155.332], "c28-024": [156.182, 168.787], "c28-025": [169.637, 172.712], "c28-026": [173.562, 178.619], "c28-027": [179.469, 190.377], "c28-028": [191.227, 196.141], "c28-029": [196.991, 198.673], "c28-030": [199.523, 205.362], "c28-031": [205.712, 218.557], "c28-032": [219.407, 229.367], "c28-033": [230.217, 239.179], "c28-034": [240.029, 244.103], "c28-035": [244.953, 249.124], "c28-036": [249.974, 258.019], "c28-037": [258.369, 263.729], "c28-038": [264.579, 269.777], "c28-039": [270.127, 273.964], "c28-040": [274.314, 278.996], "c28-041": [279.346, 282.922], "c28-042": [283.772, 288.716], "c28-043": [289.566, 295.57], "c28-044": [296.42, 306.644], "c28-045": [307.494, 309.873], "c28-046": [310.223, 315.932], "c28-047": [316.282, 320.492], "c28-048": [320.842, 328.871], "c28-049": [329.721, 333.092], "c28-050": [333.442, 349.057], "c28-051": [349.407, 353.217], "c28-052": [354.067, 361.475]}, "blocks": [{"t": "img", "src": "images/56.webp?v=c40bc66f7c", "vid": "images/56.mp4?v=a7774c11b9", "cap": "妈妈的拥抱", "n": 144}, {"t": "p", "s": [["c28-001", "忒提斯在海边找到了她的儿子。"]]}, {"t": "p", "s": [["c28-002", "她轻轻地抱住他的头，问：“我的孩子，你为什么哭？"], ["c28-003", "是不是，宙斯没有实现你的愿望，让希腊人，被赶到了大船边？”"]]}, {"t": "p", "s": [["c28-004", "阿喀琉斯叹着气，说：“妈妈，宙斯是实现了我的愿望，可是，我已经，一点也不快乐了。"], ["c28-005", "我最好的朋友，帕特洛克罗斯，被赫克托耳，杀死了。"], ["c28-006", "盔甲，也被抢走了，那是众神送给我父亲的礼物。"], ["c28-007", "我现在，一点也不想活着，除非，我能杀死赫克托耳，为帕特洛克罗斯，报仇。”"]]}, {"t": "p", "s": [["c28-008", "忒提斯流着泪，说：“我的孩子，你的命，本来就不长，要是你杀死赫克托耳，你自己，也很快，就要死了。”"]]}, {"t": "p", "s": [["c28-009", "阿喀琉斯说：“那就让我，快点死吧。"], ["c28-010", "我没有能救我的朋友，让他一个人，死在了远方。"], ["c28-011", "我再也不回到我的家乡了，我只想杀死赫克托耳，让所有的人，知道，我有多勇敢。”"]]}, {"t": "p", "s": [["c28-012", "他又说：“我再也不会，因为一个姑娘，和人生气了。"], ["c28-013", "让生气，从神仙和人间，永远消失吧。"], ["c28-014", "我不会，再被愤怒，控制了。"], ["c28-015", "可是，现在，我要用我的愤怒，去找赫克托耳。”"]]}, {"t": "p", "s": [["c28-016", "忒提斯抱着他，哭了很久。"]]}, {"t": "p", "s": [["c28-017", "终于，她说：“好，孩子，我不拦你。"], ["c28-018", "可是，你现在，一件盔甲，也没有，你等一等，明天早上，太阳升起的时候，我会带着铁匠神，赫菲斯托斯，给你做的盔甲，回来。"], ["c28-019", "你不要，现在就去打仗，等我回来。”"]]}, {"t": "img", "src": "images/169.webp?v=0f031ff031", "vid": "images/169.mp4?v=c60deeffc1", "cap": "飞上天空", "n": 145}, {"t": "p", "s": [["c28-020", "她在海里对姐妹们说：“你们回去，告诉老海神，我要上奥林匹斯山，找赫菲斯托斯，替我的儿子，做一套新的盔甲。”"]]}, {"t": "p", "s": [["c28-021", "说完，她一下子，飞向了天空。"]]}, {"t": "p", "s": [["c28-022", "那时候，战场上，两边的人，还在争夺帕特洛克罗斯的尸体。"]]}, {"t": "p", "s": [["c28-023", "赫克托耳已经，两次抓住了他的脚，想拖走，可是，两个埃阿斯，都冲了上去，把他赶开。"]]}, {"t": "p", "s": [["c28-024", "赫拉派了彩虹女神伊里斯，去告诉阿喀琉斯：“你快去，到壕沟边，站着，让特洛伊人，看你一眼，他们会害怕得，不敢再争夺尸体。”"]]}, {"t": "p", "s": [["c28-025", "阿喀琉斯说：“我没有盔甲，怎么去？”"]]}, {"t": "p", "s": [["c28-026", "伊里斯说：“你不用盔甲，只要站着，让他们看看你，就可以了。”"]]}, {"t": "img", "src": "images/57.webp?v=58f0e34f66", "vid": "images/57.mp4?v=2fc644c6c1", "cap": "壕沟边的呼喊", "n": 146}, {"t": "p", "s": [["c28-027", "雅典娜在他的肩膀上，披上了她的神盾，在他的头上，罩上了一朵金色的云，又在云里点燃了一团，像火一样的光。"]]}, {"t": "p", "s": [["c28-028", "阿喀琉斯走到了壕沟边，站在那里一动也不动。"]]}, {"t": "p", "s": [["c28-029", "他大声喊了三下。"]]}, {"t": "p", "s": [["c28-030", "他的声音，像一阵号角声，把整个平原，都震动了。"], ["c28-031", "特洛伊人被这一声大喊，吓得脸色发白，他们的马，也惊慌地，往后退，战车，一辆撞着一辆，十二个人，在混乱里，倒下了。"]]}, {"t": "p", "s": [["c28-032", "希腊人趁着这个机会，把帕特洛克罗斯的尸体，从人群里，抬了出来，放在担架上抬到了阿喀琉斯的帐篷里。"]]}, {"t": "p", "s": [["c28-033", "阿喀琉斯跟在担架后面哭着，看着他的朋友，躺在那里身上，有那么多，伤口。"]]}, {"t": "p", "s": [["c28-034", "太阳，慢慢地，落到了海里。"]]}, {"t": "img", "src": "images/170.webp?v=8702a38592", "vid": "images/170.mp4?v=df31b6b558", "cap": "夜里开会", "n": 147}, {"t": "p", "s": [["c28-035", "那天夜里，特洛伊人，在平原上，开会。"]]}, {"t": "p", "s": [["c28-036", "预言家波吕达马斯，对赫克托耳说：“我们现在，应该回到城里去，守在城墙后面。"], ["c28-037", "阿喀琉斯，一回来，你就知道，他和别的人，不一样了。”"]]}, {"t": "p", "s": [["c28-038", "赫克托耳生气地说：“我们在城里，守了这么多年，已经受够了。"], ["c28-039", "我们的金子、银子，都被拿去，换粮食了。"], ["c28-040", "现在，宙斯把荣耀，送到了我的手里，我怎么能不去？"], ["c28-041", "要是阿喀琉斯，真的来了，那我就和他，打一场。”"]]}, {"t": "p", "s": [["c28-042", "特洛伊人欢呼起来，他们真是一群，被神迷了心窍的人。"]]}, {"t": "p", "s": [["c28-043", "那天夜里，希腊人，守在帕特洛克罗斯的身边，哭了一整夜。"]]}, {"t": "p", "s": [["c28-044", "阿喀琉斯把手放在朋友的胸口上，轻轻地说：“我答应你，我会为你报仇，把赫克托耳的盔甲，带回来，放在你的面前。”"]]}, {"t": "p", "s": [["c28-045", "夜里，大海特别安静。"], ["c28-046", "星星一颗一颗地亮了起来，倒映在水面上，像撒了一把碎银子。"], ["c28-047", "远处，有一只海鸥，孤零零地叫着。"], ["c28-048", "阿喀琉斯望着那一片黑黑的海，忽然觉得，自己是这个世界上，最孤单的人。"]]}, {"t": "img", "src": "images/171.webp?v=a0775a03ad", "vid": "images/171.mp4?v=a8da06de73", "cap": "不眠的夜", "n": 148}, {"t": "p", "s": [["c28-049", "阿喀琉斯一整夜，都没有合眼。"], ["c28-050", "他坐在朋友的身边，一遍一遍地，想起他们小时候的事：想起他们一起去山里摘野果，想起他们一起在河里游泳，想起帕特洛克罗斯，总是把最大的那颗果子，留给他。"], ["c28-051", "想着想着，他的眼泪，又流了下来。"]]}, {"t": "p", "s": [["c28-052", "月亮，落下去了，东方，渐渐，亮起了一点白色的光。"]]}]}, {"title": "第二十九章　赫菲斯托斯的盾牌", "head": "c29-h", "audio": "audio/ch29.m4a?v=da55148441", "duration": 437.47, "times": {"c29-h": [0.0, 3.955], "c29-001": [4.955, 10.923], "c29-002": [11.773, 17.027], "c29-003": [17.377, 30.433], "c29-004": [31.283, 40.289], "c29-005": [41.139, 43.68], "c29-006": [44.53, 53.064], "c29-007": [53.414, 66.904], "c29-008": [67.754, 75.086], "c29-009": [75.936, 80.76], "c29-010": [81.61, 90.226], "c29-011": [90.576, 95.123], "c29-012": [95.973, 107.897], "c29-013": [108.247, 116.097], "c29-014": [116.947, 120.553], "c29-015": [121.403, 126.121], "c29-016": [126.971, 135.977], "c29-017": [136.327, 141.804], "c29-018": [142.654, 145.244], "c29-019": [146.094, 160.752], "c29-020": [161.102, 174.82], "c29-021": [175.67, 182.474], "c29-022": [183.324, 197.49], "c29-023": [198.34, 209.165], "c29-024": [209.515, 214.416], "c29-025": [215.266, 229.097], "c29-026": [229.947, 237.539], "c29-027": [238.389, 249.619], "c29-028": [250.469, 261.227], "c29-029": [262.077, 269.238], "c29-030": [270.088, 275.501], "c29-031": [276.351, 281.53], "c29-032": [282.38, 291.155], "c29-033": [291.505, 302.102], "c29-034": [302.952, 307.106], "c29-035": [307.456, 312.537], "c29-036": [312.887, 321.994], "c29-037": [322.844, 327.461], "c29-038": [327.811, 335.929], "c29-039": [336.779, 344.04], "c29-040": [344.39, 353.04], "c29-041": [353.39, 361.493], "c29-042": [362.343, 366.278], "c29-043": [366.628, 377.216], "c29-044": [378.066, 381.561], "c29-045": [381.911, 383.74], "song-shield": [384.94, 390.94], "song-shield-01": [390.94, 394.5], "song-shield-02": [394.5, 397.62], "song-shield-03": [397.78, 400.84], "song-shield-04": [400.84, 403.86], "song-shield-05": [404.44, 407.66], "song-shield-06": [407.66, 410.5], "song-shield-07": [410.5, 414.2], "song-shield-08": [414.2, 417.18], "song-shield-09": [418.96, 421.96], "song-shield-10": [422.3, 426.58], "song-shield-11": [426.78, 430.62]}, "blocks": [{"t": "p", "s": [["c29-001", "奥林匹斯山上，忒提斯，来到了铁匠神赫菲斯托斯的家。"]]}, {"t": "img", "src": "images/58.webp?v=162f12f5b5", "vid": "images/58.mp4?v=2cca657a89", "cap": "铁匠神的家", "n": 149}, {"t": "p", "s": [["c29-002", "那是一座，用青铜造的、闪着星星一样的光的宫殿。"], ["c29-003", "赫菲斯托斯正在他的铁匠铺里，满头大汗地，用大锤，敲打着一个风箱，旁边，二十个金子做的小风箱，不用人自己就在吹气。"]]}, {"t": "p", "s": [["c29-004", "他的妻子，美丽的卡里斯，看见了忒提斯，高兴地说：“美丽的忒提斯，你难得来一次，快请坐。”"]]}, {"t": "p", "s": [["c29-005", "她赶紧去叫赫菲斯托斯。"]]}, {"t": "p", "s": [["c29-006", "赫菲斯托斯听说是忒提斯来了，急急忙忙，擦了擦手，拄着拐杖，一瘸一拐地，走了出来。"], ["c29-007", "他对妻子说：“她是我的恩人，当年，我被我的母亲赫拉，扔下了奥林匹斯山，是她把我藏在海底的山洞里，照顾了我九年，我在那里，给她做了许多，漂亮的小首饰。”"]]}, {"t": "p", "s": [["c29-008", "他微笑着，对忒提斯说：“请告诉我，你需要什么，只要我，能做到，我一定帮助你。”"]]}, {"t": "p", "s": [["c29-009", "忒提斯一边哭，一边把阿喀琉斯的事，都告诉了他。"]]}, {"t": "p", "s": [["c29-010", "赫菲斯托斯说：“别哭，我一定会，给他做一副，无与伦比的盔甲，让所有看见它的人，都惊叹。"], ["c29-011", "我希望，我也能像做盔甲一样，让他躲开悲惨的命运。”"]]}, {"t": "img", "src": "images/172.webp?v=54c2768c0a", "vid": "images/172.mp4?v=cac531a178", "cap": "二十个风箱", "n": 150}, {"t": "p", "s": [["c29-012", "说完，他走到了他的二十个风箱前，把它们，对着火炉，轻轻一吹，火，一下子，烧得，又旺，又红。"], ["c29-013", "他把青铜、锡、金子、银子，一起，放进了火里，熔成了金色的水。"]]}, {"t": "p", "s": [["c29-014", "他先做了一面，又大，又厚的盾牌。"]]}, {"t": "img", "src": "images/59.webp?v=36dc8f308a", "vid": "images/59.mp4?v=508186d9f6", "cap": "刻满世界的盾牌", "n": 151}, {"t": "p", "s": [["c29-015", "盾牌上，他用金子一点一点，刻出了整个世界。"]]}, {"t": "p", "s": [["c29-016", "在中间有大地、天空、大海，有不知疲倦的太阳，有满月，有满天的星星。"], ["c29-017", "有北斗七星，在天上，围着自己，慢慢地转。"]]}, {"t": "p", "s": [["c29-018", "在盾牌上有两座美丽的城。"]]}, {"t": "p", "s": [["c29-019", "一座城里，正在办一场婚礼，姑娘们，穿着漂亮的衣服，被人们，举着火把，送出来，笛子和竖琴，在街上响着，年轻人，在跳舞。"], ["c29-020", "另一座城里，一个市场上，两个人，为了一件赔偿金，吵得很凶，老人们，坐在石头上一个一个，慢慢地，说出他们的看法。"]]}, {"t": "p", "s": [["c29-021", "城外，有两支军队，围着另一座城，吵着，要不要分一半财宝。"]]}, {"t": "p", "s": [["c29-022", "又有一块，被犁得松松软软的田，一群农夫，赶着牛，一遍一遍地犁，走到田头的时候，有人，给他们，递上一杯，蜜一样甜的酒。"]]}, {"t": "p", "s": [["c29-023", "又有一块，长满了麦子的田，农夫们，挥着镰刀，在收割，孩子们，把割下的麦子，捆成一捆一捆。"], ["c29-024", "国王站在旁边拿着权杖，安静地看着，心里高兴。"]]}, {"t": "p", "s": [["c29-025", "又有一座，挂满了紫色葡萄的葡萄园，姑娘和小伙子们，抬着一个，装满了葡萄的筐，一个男孩子，弹着琴，唱着甜甜的歌。"]]}, {"t": "p", "s": [["c29-026", "又有一群牛，一群羊，一个山谷，里面，有一间间牧羊人的小屋。"]]}, {"t": "p", "s": [["c29-027", "最后，在盾牌的边缘，他刻了一条，大大的河，绕着整个世界，那是，环绕大地的大洋。"]]}, {"t": "img", "src": "images/173.webp?v=41b83cc5d0", "vid": "images/173.mp4?v=ee846e151b", "cap": "闪亮的盔甲", "n": 152}, {"t": "p", "s": [["c29-028", "做完了盾牌，他又做了一件，比火还亮的胸甲，一顶，带金色羽毛的头盔，还有，一副用锡做的护腿。"]]}, {"t": "p", "s": [["c29-029", "忒提斯接过了这些，像一只老鹰，从奥林匹斯山上，飞了下去。"]]}, {"t": "img", "src": "images/174.webp?v=15661d2e83", "vid": "images/174.mp4?v=a9831825b4", "cap": "送来的盔甲", "n": 153}, {"t": "p", "s": [["c29-030", "天亮的时候，她，已经把盔甲放在了阿喀琉斯的面前。"]]}, {"t": "p", "s": [["c29-031", "阿喀琉斯还抱着帕特洛克罗斯，在地上，哭泣。"]]}, {"t": "p", "s": [["c29-032", "所有的密耳弥冬人，看见了那些盔甲，都吓得不敢直视，好像光太亮，会刺痛眼睛。"], ["c29-033", "可是，阿喀琉斯，看着它们，心里，涌起了一团火，眼睛里，闪出了一道，像火焰的光。"]]}, {"t": "p", "s": [["c29-034", "赫菲斯托斯一边干活，一边哼着小曲。"], ["c29-035", "火炉里的火星，像小星星一样，一下一下地飞起来。"], ["c29-036", "他用锤子敲着，敲着，每敲一下，盾牌上，就多出了一朵花、一只鸟、一个孩子的笑脸。"]]}, {"t": "p", "s": [["c29-037", "忒提斯站在旁边，看着看着，眼泪又流了下来。"], ["c29-038", "她想：要是我的儿子，也能像这盾牌上的人们一样，平平安安地过日子，该多好啊。"]]}, {"t": "p", "s": [["c29-039", "当最后一道花纹，刻好的时候，整座铁匠铺，都被照得，亮堂堂的。"], ["c29-040", "赫菲斯托斯，擦了擦满脸的汗，把盾牌，举到灯下，看了又看，满意地点了点头。"], ["c29-041", "他想：希望这副盔甲，能保护那个孩子，哪怕，只是多保护一天也好。"]]}, {"t": "p", "s": [["c29-042", "窗外，天空，慢慢地亮了起来。"], ["c29-043", "第一缕阳光，照在盾牌上，那些小小的人、小小的城、小小的河，好像，一下子，都活了过来。"]]}, {"t": "p", "s": [["c29-044", "他说：“妈妈，这是神仙，才能做出来的东西。"], ["c29-045", "我现在，就要去战斗了。”"]]}, {"t": "song", "title": "盾牌上的世界", "head": "song-shield", "lines": [["song-shield-01", "火神敲打着，一整夜的火花"], ["song-shield-02", "做出一面，最亮的盾牌"], ["song-shield-03", "盾牌上有太阳，有月亮，有星星"], ["song-shield-04", "有大海，有大地"], ["song-shield-05", "盾牌上有一座城，有婚礼，有歌声"], ["song-shield-06", "有田野里，收麦子的人"], ["song-shield-07", "有牧羊的孩子，有跳舞的姑娘"], ["song-shield-08", "还有一条河，围着整个世界"], ["song-shield-09", "天亮了，盾牌亮了"], ["song-shield-10", "小小的人，小小的城，都活了过来"], ["song-shield-11", "愿世界像盾牌上，那样平安"]]}]}, {"title": "第三十章　最后的和解", "head": "c30-h", "audio": "audio/ch30.m4a?v=d57f0c5949", "duration": 351.402, "times": {"c30-h": [0.0, 2.898], "c30-001": [3.898, 13.074], "c30-002": [13.924, 16.979], "c30-003": [17.329, 23.136], "c30-004": [23.486, 36.333], "c30-005": [37.183, 49.654], "c30-006": [50.004, 54.917], "c30-007": [55.267, 57.184], "c30-008": [57.534, 59.644], "c30-009": [59.994, 68.26], "c30-010": [69.11, 73.734], "c30-011": [74.584, 76.295], "c30-012": [76.645, 83.347], "c30-013": [83.697, 92.594], "c30-014": [92.944, 98.113], "c30-015": [98.963, 104.102], "c30-016": [104.452, 106.526], "c30-017": [107.376, 110.662], "c30-018": [111.012, 118.93], "c30-019": [119.78, 125.073], "c30-020": [125.423, 134.451], "c30-021": [134.801, 137.55], "c30-022": [138.4, 140.83], "c30-023": [141.68, 153.565], "c30-024": [154.415, 159.016], "c30-025": [159.866, 180.125], "c30-026": [180.475, 182.6], "c30-027": [183.45, 186.655], "c30-028": [187.005, 194.502], "c30-029": [195.352, 199.557], "c30-030": [199.907, 204.295], "c30-031": [205.145, 215.734], "c30-032": [216.084, 225.287], "c30-033": [226.137, 237.352], "c30-034": [238.202, 246.652], "c30-035": [247.002, 255.797], "c30-036": [256.647, 269.598], "c30-037": [270.448, 275.636], "c30-038": [276.486, 281.268], "c30-039": [281.618, 288.059], "c30-040": [288.909, 293.022], "c30-041": [293.372, 296.22], "c30-042": [297.07, 309.891], "c30-043": [310.241, 316.961], "c30-044": [317.811, 326.382], "c30-045": [326.732, 333.732], "c30-046": [334.582, 349.902]}, "blocks": [{"t": "p", "s": [["c30-001", "天刚亮，阿喀琉斯，沿着海边，大声地喊着，召集所有的希腊人，到沙滩上来开会。"]]}, {"t": "img", "src": "images/175.webp?v=e65b9ab393", "vid": "images/175.mp4?v=b940309f87", "cap": "召集大会", "n": 154}, {"t": "p", "s": [["c30-002", "人们，一个接一个地，来了。"
