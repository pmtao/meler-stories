], ["c30-003", "连那些，平时只管守着大船、管着粮食的人，也来了。"], ["c30-004", "受了伤的狄奥墨得斯和奥德修斯，拄着长矛，慢慢地走来，最后，阿伽门农，也来了，他的胳膊上的伤口，还没有好。"]]}, {"t": "p", "s": [["c30-005", "大家都坐下以后，阿喀琉斯，站起来，对阿伽门农说：“元帅，我们两个人，为了一个姑娘，吵得那么厉害，让希腊人，受了这么大的苦。"], ["c30-006", "要是当初，那位姑娘，在船上，被一箭射死了，该多好！"], ["c30-007", "现在，我再也不生气了。"], ["c30-008", "过去的事，就让它过去吧。"], ["c30-009", "快点，召集大家，去打仗，我要去看看，那些特洛伊人，还敢不敢，睡在我们的大船边。”"]]}, {"t": "p", "s": [["c30-010", "希腊人一阵欢呼，把阿喀琉斯的话，传了出去。"]]}, {"t": "p", "s": [["c30-011", "阿伽门农没有站起来。"], ["c30-012", "他坐在椅子上，说：“朋友们，英雄们，我说话的时候，请不要打断我。"], ["c30-013", "我要对大家说，是宙斯，是命运，是复仇女神，让我昏了头，在大会上，夺走了阿喀琉斯的奖品。"], ["c30-014", "可是，现在，我愿意赔偿，我答应的礼物，一件也不会少。”"]]}, {"t": "p", "s": [["c30-015", "奥德修斯说：“阿喀琉斯，你先让大家，吃饱了饭，再去打仗。"], ["c30-016", "没有吃饭的人，没有力气。”"]]}, {"t": "p", "s": [["c30-017", "阿喀琉斯摇了摇头，说：“我不想吃东西。"], ["c30-018", "我的朋友，躺在那里，我的心，被悲伤，塞得满满的，只想打仗，杀死赫克托耳。”"]]}, {"t": "p", "s": [["c30-019", "奥德修斯说：“阿喀琉斯，你比我强壮，可是，我比你有经验。"], ["c30-020", "人是不能用肚子，去哀悼死人的，每天都有那么多人，倒下要是，大家都不吃饭，不就没有人能打仗了吗？"], ["c30-021", "让大家，吃饱了，再哭再去。”"]]}, {"t": "p", "s": [["c30-022", "阿喀琉斯终于，点了点头。"]]}, {"t": "img", "src": "images/176.webp?v=4b30b754a0", "vid": "images/176.mp4?v=e911d629a6", "cap": "赔礼", "n": 155}, {"t": "p", "s": [["c30-023", "阿伽门农的礼物，被一件一件地，送了过来：七个三脚鼎，二十个大锅，十二匹骏马，七位美丽的姑娘，十块金子。"]]}, {"t": "img", "src": "images/60.webp?v=97662a17a9", "vid": "images/60.mp4?v=61d56f08bd", "cap": "姑娘的眼泪", "n": 156}, {"t": "p", "s": [["c30-024", "最后，姑娘们，把布里塞伊斯，也带来了。"]]}, {"t": "p", "s": [["c30-025", "她看见了帕特洛克罗斯的尸体，躺在那里一下子，扑了上去，用手，抓着自己的脸和胸口，哭着，说：“帕特洛克罗斯，你是我最好的朋友，当我离开家的时候，我是那么悲伤，是你对我说，不要哭，你会让阿喀琉斯，娶我为妻。"], ["c30-026", "现在，你却离开了我。”"]]}, {"t": "p", "s": [["c30-027", "姑娘们，也陪着她，一起哭。"], ["c30-028", "她们哭的，不光是，帕特洛克罗斯，也是，她们自己的命运。"]]}, {"t": "p", "s": [["c30-029", "老人们，围着阿喀琉斯，劝他吃点东西。"], ["c30-030", "他说：“我绝不会，在朋友没有安葬以前，吃一口。”"]]}, {"t": "p", "s": [["c30-031", "宙斯在天上看着这一幕，对雅典娜说：“女儿，你为什么，不去，照顾一下，你的好朋友阿喀琉斯？"], ["c30-032", "他连饭，也不想吃，你要给他，倒一点神仙的甘露和美酒，不让他，饿着肚子。”"]]}, {"t": "p", "s": [["c30-033", "雅典娜像一只，又大又长的鹰，从天上，飞了下来，悄悄地，把神仙的食物，滴进了阿喀琉斯的胸口。"]]}, {"t": "p", "s": [["c30-034", "这时，希腊人，一队一队，涌出了大船，像冬天的雪片，飘向大地。"], ["c30-035", "盾牌和头盔，亮得，连天空，也被照亮了大地，在他们的脚步下，隆隆地笑。"]]}, {"t": "img", "src": "images/177.webp?v=2d84a24e22", "vid": "images/177.mp4?v=9fee2f6dcd", "cap": "穿上新盔甲", "n": 157}, {"t": "p", "s": [["c30-036", "阿喀琉斯站在人群中间穿上了赫菲斯托斯做的盔甲，牙齿，咬得咯咯响，眼睛里，闪着火焰，他的盾牌，像月亮一样亮。"]]}, {"t": "p", "s": [["c30-037", "他拿起了那支，父亲给他的、只有他一个人才拿得动的长矛。"]]}, {"t": "img", "src": "images/61.webp?v=59d177078c", "vid": "images/61.mp4?v=aeb02beb87", "cap": "和解", "n": 158}, {"t": "p", "s": [["c30-038", "太阳升得高高的，照在沙滩上，白花花的一片。"], ["c30-039", "有一个小士兵，忍不住对旁边的人说：“你看，他们两个，真的握手了。”"]]}, {"t": "p", "s": [["c30-040", "旁边的人笑了，笑着笑着，眼睛红了。"], ["c30-041", "他们等这一天，等得太久了。"]]}, {"t": "p", "s": [["c30-042", "有一位老兵，悄悄地走到阿喀琉斯身边，把一块热乎乎的面饼，塞进他的手里，小声说：“孩子，吃一口吧，我们都等着你呢。”"], ["c30-043", "阿喀琉斯，低头看着那块面饼，鼻子一酸，轻轻地咬了一小口。"]]}, {"t": "p", "s": [["c30-044", "帐篷外，几个年轻的士兵，围着一堆火，轻声地唱着歌，唱的是，他们故乡的歌。"], ["c30-045", "唱着唱着，有人哭了，有人笑了，有人，把歌声，哼得更轻了。"]]}, {"t": "p", "s": [["c30-046", "他跳上了战车，对他那两匹神马，克珊托斯和巴利奥斯，说：“这一次，请你们，一定要把我，平平安安地带回来，不要像上次那样，把帕特洛克罗斯，丢在了战场上。”"]]}]}, {"title": "第三十一章　会说话的马", "head": "c31-h", "audio": "audio/ch31.m4a?v=2be4ec95e6", "duration": 377.02, "times": {"c31-h": [0.0, 3.27], "c31-001": [4.27, 8.814], "c31-002": [9.664, 18.333], "c31-003": [18.683, 21.918], "c31-004": [22.768, 29.198], "c31-005": [29.548, 32.803], "c31-006": [33.153, 43.494], "c31-007": [43.844, 47.741], "c31-008": [48.091, 55.16], "c31-009": [56.01, 60.111], "c31-010": [60.961, 69.91], "c31-011": [70.26, 76.626], "c31-012": [76.976, 84.637], "c31-013": [85.487, 89.216], "c31-014": [90.066, 94.415], "c31-015": [94.765, 99.727], "c31-016": [100.077, 108.521], "c31-017": [108.871, 114.689], "c31-018": [115.539, 119.846], "c31-019": [120.696, 128.575], "c31-020": [128.925, 137.677], "c31-021": [138.527, 155.547], "c31-022": [156.397, 159.12], "c31-023": [159.97, 165.065], "c31-024": [165.415, 177.91], "c31-025": [178.76, 181.442], "c31-026": [182.292, 192.36], "c31-027": [193.21, 199.22], "c31-028": [199.57, 205.015], "c31-029": [205.365, 208.607], "c31-030": [209.457, 220.606], "c31-031": [220.956, 223.469], "c31-032": [224.319, 226.569], "c31-033": [227.419, 233.917], "c31-034": [234.267, 244.189], "c31-035": [245.039, 251.486], "c31-036": [252.336, 254.562], "c31-037": [254.912, 258.38], "c31-038": [259.23, 276.407], "c31-039": [276.757, 284.828], "c31-040": [285.678, 293.986], "c31-041": [294.837, 306.728], "c31-042": [307.578, 320.194], "c31-043": [320.544, 323.676], "c31-044": [324.026, 326.907], "c31-045": [327.757, 332.146], "c31-046": [332.496, 338.66], "c31-047": [339.51, 343.075], "c31-048": [343.425, 351.181], "c31-049": [352.031, 355.234], "c31-050": [355.584, 366.363], "c31-051": [367.213, 375.52]}, "blocks": [{"t": "p", "s": [["c31-001", "就在阿喀琉斯要出发的时候，奇怪的事，发生了。"]]}, {"t": "img", "src": "images/62.webp?v=96a77fe4f5", "vid": "images/62.mp4?v=90f5c71487", "cap": "会说话的神马", "n": 159}, {"t": "p", "s": [["c31-002", "他那匹，叫克珊托斯的神马，忽然，低下了头，它的鬃毛，一直垂到地上。"], ["c31-003", "赫拉让它开口，说了话。"]]}, {"t": "p", "s": [["c31-004", "它说：“阿喀琉斯，我们一定会，这一次，把你平平安安地带回来。"], ["c31-005", "可是，你的末日，已经不远了。"], ["c31-006", "不是因为我们，跑得慢，让帕特洛克罗斯，被杀死的，是一位神，阿波罗，是他夺走了他的盔甲。"], ["c31-007", "就算我们，像西风一样快，也救不了他。"], ["c31-008", "命运，也已经，为你做了决定，你会死在一位神、一个人的手里。”"]]}, {"t": "p", "s": [["c31-009", "复仇女神，让他的话，停了下来。"]]}, {"t": "p", "s": [["c31-010", "阿喀琉斯生气地，也有一点点，难过地，说：“克珊托斯，你为什么，要对我，预言我的死？"], ["c31-011", "我自己，心里早就知道了，我永远，回不了家，看不到我的父亲和母亲。"], ["c31-012", "可是，我不会停下来，直到，那些特洛伊人，被我杀得，没有力气，再打下去。”"]]}, {"t": "img", "src": "images/178.webp?v=7a76a4b1cf", "vid": "images/178.mp4?v=f1699477dd", "cap": "出发", "n": 160}, {"t": "p", "s": [["c31-013", "他大喊一声，驾着战车，向前冲去。"]]}, {"t": "p", "s": [["c31-014", "天上的神仙，也都，聚在了奥林匹斯山上。"], ["c31-015", "宙斯对他们说：“你们，都去吧，随便帮哪一方。"], ["c31-016", "要是我不让你们去，阿喀琉斯，会冲破特洛伊的城墙，那是不符合命运的。"], ["c31-017", "你们，可以去，帮助自己，喜欢的人。”"]]}, {"t": "img", "src": "images/63.webp?v=195d5e2ae6", "vid": "images/63.mp4?v=b5d48f6312", "cap": "神仙们看战争", "n": 161}, {"t": "p", "s": [["c31-018", "这样一来，天上的神仙，也分成了两队。"]]}, {"t": "p", "s": [["c31-019", "赫拉、雅典娜、波塞冬、赫尔墨斯、赫菲斯托斯，站在希腊人这边。"], ["c31-020", "阿瑞斯、阿波罗、阿尔忒弥斯、阿芙洛狄忒、河神斯卡曼德罗斯，站在特洛伊人那边。"]]}, {"t": "p", "s": [["c31-021", "大地，被震得，一直在抖天空中，雷声，轰隆隆地响，就连地底下的冥王，也吓得从宝座上跳了起来，怕地面，裂开，让阳光，照进他的黑暗王国。"]]}, {"t": "p", "s": [["c31-022", "阿喀琉斯冲进了特洛伊人的队伍。"]]}, {"t": "p", "s": [["c31-023", "他的眼睛里，只有一个人，赫克托耳。"], ["c31-024", "可是，阿波罗，变成了赫克托耳的弟弟的样子，悄悄地，对赫克托耳说：“别去和阿喀琉斯打，躲在队伍里，让别的人，先去试试他。”"]]}, {"t": "p", "s": [["c31-025", "赫克托耳听了，退到了人群里。"]]}, {"t": "p", "s": [["c31-026", "埃涅阿斯那位，在狄奥墨得斯手里，被阿波罗救过的英雄，被阿波罗，鼓励着，向阿喀琉斯，冲了过去。"]]}, {"t": "img", "src": "images/179.webp?v=fbeb204b27", "vid": "images/179.mp4?v=39edc0eed4", "cap": "面对面", "n": 162}, {"t": "p", "s": [["c31-027", "阿喀琉斯轻蔑地看着他，说：“你为什么，走出队伍，站在我的面前？"], ["c31-028", "是不是，想当特洛伊的国王，让普里阿摩斯，把王位，送给你？"], ["c31-029", "别想了，普里阿摩斯，有他自己的儿子。”"]]}, {"t": "p", "s": [["c31-030", "埃涅阿斯说：“阿喀琉斯，你不要用话吓唬我，我们两个，都有神仙的血脉，你的母亲，是海洋女神，我的母亲，是阿芙洛狄忒。"], ["c31-031", "我们打一场，不用说那么多废话。”"]]}, {"t": "p", "s": [["c31-032", "他举起长矛，投了过去。"]]}, {"t": "p", "s": [["c31-033", "长矛，打在阿喀琉斯的盾牌上，被金子，挡住了，没有穿过。"], ["c31-034", "赫菲斯托斯做的盾牌，有五层金属，一层金，两层铜，两层锡，长矛，只穿过了两层。"]]}, {"t": "p", "s": [["c31-035", "阿喀琉斯也投出了长矛，擦过了埃涅阿斯的肩膀，插进了地里。"]]}, {"t": "p", "s": [["c31-036", "他拔出了长剑，扑了上去。"], ["c31-037", "埃涅阿斯抓起了一块大石头，想去砸。"]]}, {"t": "img", "src": "images/180.webp?v=83d2a47d77", "vid": "images/180.mp4?v=94cd4aa592", "cap": "救走埃涅阿斯", "n": 163}, {"t": "p", "s": [["c31-038", "波塞冬在天上看见了，对赫拉和雅典娜说：“埃涅阿斯，是个好人，是一个，对神仙，一向很虔诚的人，他不应该，因为别人的过错，被杀死。"], ["c31-039", "而且，命运注定，他要活下去，他的后代，要做特洛伊人的王。”"]]}, {"t": "p", "s": [["c31-040", "赫拉不高兴地说：“你想去救他，就去吧，我和雅典娜，已经发誓，永远不帮助特洛伊人。”"]]}, {"t": "p", "s": [["c31-041", "波塞冬悄悄地，在阿喀琉斯的眼前，撒了一团雾，把他，从阿喀琉斯的面前，抱走了，放在了战场的最后面。"]]}, {"t": "p", "s": [["c31-042", "阿喀琉斯睁开眼，埃涅阿斯，不见了，他吃惊地说：“真是奇怪，我明明，把长矛，投了出去，可是，那个人，却不见了。"], ["c31-043", "他一定，也是神仙们，喜欢的人。"], ["c31-044", "我不管他了，我要去，找别的人。”"]]}, {"t": "p", "s": [["c31-045", "风从海上吹来，吹起了阿喀琉斯金色的头发。"], ["c31-046", "他低着头，轻轻地拍了拍克珊托斯的脖子，对它说：“谢谢你告诉我实话。”"]]}, {"t": "p", "s": [["c31-047", "那匹马，眨了眨眼睛，没有再说话。"], ["c31-048", "可是，它的鼻子里，喷出了一口长长的、温热的气，好像在说：“我陪着你。”"]]}, {"t": "p", "s": [["c31-049", "天，慢慢地亮了。"], ["c31-050", "海边的雾，一层一层地散去，露出了远处特洛伊的城墙，灰灰的，高高的，像一位沉默的老人。"]]}, {"t": "p", "s": [["c31-051", "他一边喊，一边冲进了队伍：“特洛伊人，你们别以为，可以逃走，我今天，要杀个痛快。”"]]}]}, {"title": "第三十二章　河神的洪水", "head": "c32-h", "audio": "audio/ch32.m4a?v=5fb45cde2b", "duration": 380.279, "times": {"c32-h": [0.0, 3.347], "c32-001": [4.347, 10.563], "c32-002": [11.413, 18.426], "c32-003": [18.776, 23.919], "c32-004": [24.769, 33.872], "c32-005": [34.722, 41.939], "c32-006": [42.289, 52.372], "c32-007": [53.222, 64.479], "c32-008": [65.329, 70.811], "c32-009": [71.661, 92.085], "c32-010": [92.435, 96.914], "c32-011": [97.764, 106.283], "c32-012": [107.133, 108.409], "c32-013": [109.259, 123.059], "c32-014": [123.909, 133.298], "c32-015": [134.148, 147.526], "c32-016": [147.876, 159.302], "c32-017": [160.152, 164.595], "c32-018": [164.945, 172.97], "c32-019": [173.82, 185.008], "c32-020": [185.358, 191.057], "c32-021": [191.407, 199.06], "c32-022": [199.91, 202.806], "c32-023": [203.656, 212.449], "c32-024": [213.299, 224.353], "c32-025": [225.203, 228.242], "c32-026": [228.592, 234.388], "c32-027": [235.238, 243.752], "c32-028": [244.102, 254.521], "c32-029": [255.371, 267.715], "c32-030": [268.565, 275.213], "c32-031": [276.063, 278.883], "c32-032": [279.233, 285.363], "c32-033": [286.213, 288.541], "c32-034": [288.891, 296.33], "c32-035": [297.18, 300.068], "c32-036": [300.418, 317.649], "c32-037": [318.499, 324.21], "c32-038": [325.06, 336.549], "c32-039": [337.399, 342.247], "c32-040": [343.097, 354.93], "c32-041": [355.78, 356.999], "c32-042": [357.849, 371.212], "c32-043": [372.062, 378.779]}, "blocks": [{"t": "img", "src": "images/181.webp?v=7dd893fbed", "vid": "images/181.mp4?v=dbdc89af35", "cap": "四散奔逃", "n": 164}, {"t": "p", "s": [["c32-001", "阿喀琉斯一路冲杀，把特洛伊人，赶得，四散奔逃。"]]}, {"t": "p", "s": [["c32-002", "有一半的人，往城里跑，有一半的人，跑到了斯卡曼德罗斯河的边上。"], ["c32-003", "那条河，又宽、又深，水流得很急。"]]}, {"t": "p", "s": [["c32-004", "人们，一个接一个，跳进了河里，河水里，挤满了人和马，水面上，漂着盔甲和盾牌。"]]}, {"t": "p", "s": [["c32-005", "阿喀琉斯把长矛靠在河边的一棵柳树上，手里，拿着剑，跳进了河里。"], ["c32-006", "他在河里一个一个地，追赶着，逃跑的特洛伊人，剑光，一闪一闪，水面上，染红了一大片。"]]}, {"t": "p", "s": [["c32-007", "他从河里挑出十二个年轻的特洛伊人，把他们，带回了岸上，绑了起来，交给自己的朋友们，当作俘虏，带回大船边。"]]}, {"t": "img", "src": "images/64.webp?v=ae7af17921", "vid": "images/64.mp4?v=19a2cb8ae8", "cap": "愤怒的河神", "n": 165}, {"t": "p", "s": [["c32-008", "河神斯卡曼德罗斯，被这样的景象，激怒了。"]]}, {"t": "p", "s": [["c32-009", "他从深深的河水里，站了起来，变成了一个人的样子，生气地对阿喀琉斯说：“阿喀琉斯，你的力量，是别人不能比的，可是，你杀的人，太多了，我的河水，里面堆满了尸体，都流不动了。"], ["c32-010", "请你停手，到平原上去，去杀别的人吧。”"]]}, {"t": "p", "s": [["c32-011", "阿喀琉斯说：“河神，我会听您的话，可是，在没有杀死赫克托耳以前，我不会停下来。”"]]}, {"t": "p", "s": [["c32-012", "他又跳进了河里。"]]}, {"t": "p", "s": [["c32-013", "河神，一下子，发了怒，他叫来了自己的兄弟，西摩伊斯河，对他说：“朋友，我们两个，一起上，阻止这个人，别让他再杀下去。”"]]}, {"t": "p", "s": [["c32-014", "他涌起了一个，又高又大的浪头，向阿喀琉斯，扑了过去，水里，卷着无数的尸体和树枝。"]]}, {"t": "p", "s": [["c32-015", "阿喀琉斯被浪头拍得，站不住脚，他想抓住一棵，又高又大的榆树，可是，榆树，连根拔起，被冲走了，压在了河上像一座桥。"], ["c32-016", "阿喀琉斯抓着树枝，爬了出来，他拔腿，就往平原上跑，可是，河水，紧紧地追着他，波涛，一个，高过一个。"]]}, {"t": "p", "s": [["c32-017", "他对天上大声喊：“宙斯，难道没有一位神，救我吗？"], ["c32-018", "我宁愿，是死在赫克托耳的手里，也不想，像一个，掉进了河里的小牧童，死得那样悲惨！”"]]}, {"t": "img", "src": "images/182.webp?v=9cba69da1a", "vid": "images/182.mp4?v=f72f1932b5", "cap": "神仙扶起", "n": 166}, {"t": "p", "s": [["c32-019", "波塞冬和雅典娜，变成人的样子，走到了他的身边，握住他的手，对他说：“阿喀琉斯，别怕，我们来帮你。"], ["c32-020", "你不会死在河里，赫克托耳，也很快，就会倒下。"], ["c32-021", "你只管，向前冲，不要停，直到把特洛伊人，赶回他们的城墙里。”"]]}, {"t": "p", "s": [["c32-022", "他们给了阿喀琉斯，新的力量。"]]}, {"t": "p", "s": [["c32-023", "他又跑了起来，河水，在他的脚边，哗哗地翻着，可是，再也追不上他了。"]]}, {"t": "p", "s": [["c32-024", "河神，大发脾气，又叫来了所有的小河，一起帮忙，他的水，一直涨到了，阿喀琉斯的腰上。"]]}, {"t": "p", "s": [["c32-025", "赫拉在天上看见了，吓了一跳。"], ["c32-026", "她对儿子赫菲斯托斯，说：“你去，用你的火，烧一烧这个河神。”"]]}, {"t": "img", "src": "images/65.webp?v=40ae0cd4d5", "vid": "images/65.mp4?v=96232ef35e", "cap": "赫菲斯托斯的火", "n": 167}, {"t": "p", "s": [["c32-027", "赫菲斯托斯吹起了一团，又大、又亮的火，在平原上，沿着河岸，烧了起来。"], ["c32-028", "榆树，柳树，芦苇，都被烧着了鱼和鳗鱼，吓得在水里钻来钻去，河水，开始冒泡、蒸发。"]]}, {"t": "p", "s": [["c32-029", "河神，疼得不得了，大声喊：“赫菲斯托斯，请你停手吧，我不会再帮助特洛伊人了，也不会再和阿喀琉斯打了。”"]]}, {"t": "p", "s": [["c32-030", "赫拉说：“好，停手吧，儿子不要为了凡人的事，伤了神仙的和气。”"]]}, {"t": "p", "s": [["c32-031", "火，慢慢地，熄灭了。"], ["c32-032", "河水，又恢复了平静，慢慢地，流回了原来的河道。"]]}, {"t": "img", "src": "images/183.webp?v=d9933742aa", "vid": "images/183.mp4?v=797b2a487f", "cap": "神仙吵架", "n": 168}, {"t": "p", "s": [["c32-033", "神仙们却在天上吵了起来。"], ["c32-034", "阿瑞斯，对雅典娜，说：“你这个，爱管闲事的苍蝇，今天，我要给你一点颜色。”"]]}, {"t": "p", "s": [["c32-035", "他用长矛向她，刺了过来。"], ["c32-036", "雅典娜轻轻一让，捡起了一块，黑黑的大石头，那是前人，用来划分田界的，砸中了阿瑞斯的脖子，他轰的一声，倒在地上身体，占了七亩地，头发，沾满了灰。"]]}, {"t": "p", "s": [["c32-037", "雅典娜笑着说：“你这个傻瓜，你还没有明白，我比你强多了。”"]]}, {"t": "p", "s": [["c32-038", "阿芙洛狄忒来扶阿瑞斯，被赫拉看见了，叫雅典娜，去教训她，雅典娜，一拳，把她，打倒在了他的身边。"]]}, {"t": "p", "s": [["c32-039", "波塞冬对阿波罗说：“我们两个，也打一场吧。”"]]}, {"t": "p", "s": [["c32-040", "阿波罗笑着说：“波塞冬，我才不要，为了凡人，和你大战，他们就像树叶，春天绿，秋天落，我们为了他们，不值得。”"]]}, {"t": "p", "s": [["c32-041", "他转身走了。"]]}, {"t": "p", "s": [["c32-042", "他的妹妹，阿尔忒弥斯，嘲笑他是个胆小鬼，被赫拉，抓住了弓，打得，哭着逃回了奥林匹斯山，倒在父亲宙斯的怀里，眼泪，流了一地。"]]}, {"t": "p", "s": [["c32-043", "宙斯笑着，抱着她，说：“好了，孩子别哭，别哭。”"]]}]}, {"title": "第三十三章　城门前的赫克托耳", "head": "c33-h", "audio": "audio/ch33.m4a?v=d91b4a94a5", "duration": 331.438, "times": {"c33-h": [0.0, 3.448], "c33-001": [4.448, 9.746], "c33-002": [10.596, 22.72], "c33-003": [23.57, 26.129], "c33-004": [26.979, 31.177], "c33-005": [31.527, 33.716], "c33-006": [34.566, 45.477], "c33-007": [45.827, 54.937], "c33-008": [55.287, 59.124], "c33-009": [59.974, 65.556], "c33-010": [65.906, 73.087], "c33-011": [73.937, 79.164], "c33-012": [80.014, 90.467], "c33-013": [90.817, 97.901], "c33-014": [98.751, 100.637], "c33-015": [100.987, 102.678], "c33-016": [103.028, 107.286], "c33-017": [107.636, 110.455], "c33-018": [110.805, 118.516], "c33-019": [118.866, 132.664], "c33-020": [133.514, 137.648], "c33-021": [138.498, 166.589], "c33-022": [167.439, 170.37], "c33-023": [171.22, 174.444], "c33-024": [175.294, 182.111], "c33-025": [182.961, 196.879], "c33-026": [197.229, 203.124], "c33-027": [203.974, 216.68], "c33-028": [217.03, 223.276], "c33-029": [224.126, 232.127], "c33-030": [232.477, 238.662], "c33-031": [239.512, 241.695], "c33-032": [242.045, 252.371], "c33-033": [253.221, 257.166], "c33-034": [257.516, 264.252], "c33-035": [265.102, 268.373], "c33-036": [268.723, 272.27], "c33-037": [272.62, 277.907], "c33-038": [278.757, 287.659], "c33-039": [288.509, 292.689], "c33-040": [293.039, 295.624], "c33-041": [295.974, 299.979], "c33-042": [300.329, 308.691], "c33-043": [309.541, 316.014], "c33-044": [316.364, 322.696], "c33-045": [323.546, 329.938]}, "blocks": [{"t": "img", "src": "images/184.webp?v=0401b97468", "vid": "images/184.mp4?v=8be6b1813a", "cap": "逃进城", "n": 169}, {"t": "p", "s": [["c33-001", "特洛伊人像一群被猎人赶急了的小鹿，飞快地逃进了城里。"]]}, {"t": "p", "s": [["c33-002", "城里的人，打开城门，让他们进来，他们一个个，满头大汗，口渴得要命，倒在城墙的阴凉里，大口地喘着气。"]]}, {"t": "p", "s": [["c33-003", "只有赫克托耳，没有进去。"]]}, {"t": "p", "s": [["c33-004", "他站在城门口斯卡亚门的前面，一动也不动。"], ["c33-005", "命运，把他钉在了那里。"]]}, {"t": "img", "src": "images/185.webp?v=b7623bfe16", "vid": "images/185.mp4?v=d7d7e21d2d", "cap": "被引开", "n": 170}, {"t": "p", "s": [["c33-006", "阿波罗，变成了一位年轻的特洛伊人的样子，一直引着阿喀琉斯，往远处，追他，让他一直追到了平原的另一头。"], ["c33-007", "直到阿喀琉斯，发觉被骗了才停下来，生气地说：“阿波罗，你这个最坏的神仙，你戏弄了我。"], ["c33-008", "要不是，你是神，我早就，要你付出代价了。”"]]}, {"t": "p", "s": [["c33-009", "他拖着腿，转过身，向着城门，一阵风似的，冲了回来。"], ["c33-010", "他跑得，那样快，像一匹，赢了比赛的骏马，一直在拉着战车拼命地飞奔。"]]}, {"t": "img", "src": "images/66.webp?v=456f97610f", "vid": "images/66.mp4?v=af1d11a70a", "cap": "城墙上的老国王", "n": 171}, {"t": "p", "s": [["c33-011", "老国王普里阿摩斯，站在城墙上第一个，看见了他。"]]}, {"t": "p", "s": [["c33-012", "他看见那团，在平原上，闪闪发光的火焰，像天上最亮的狗星，带来的，是灾难和疾病。"], ["c33-013", "他举起了双手，捶着自己的头，大声地哭喊，请求他的儿子，回到城里来。"]]}, {"t": "p", "s": [["c33-014", "他喊着：“赫克托耳！"], ["c33-015", "我亲爱的孩子！"], ["c33-016", "不要一个人，站在那里，和那个人，打仗。"], ["c33-017", "他比你强大，他会杀了你的。"], ["c33-018", "快回来，进城里来，救救特洛伊人，救救你的父亲，这个可怜的老人。"], ["c33-019", "我老了，我不想，亲眼看见，我的儿子们，一个个，被杀死，我的女儿们，被拖走，我的小孙子们，被摔在地上。”"]]}, {"t": "p", "s": [["c33-020", "他拔着自己的白头发，哭得，浑身发抖。"]]}, {"t": "img", "src": "images/186.webp?v=57bf934326", "vid": "images/186.mp4?v=9eeb003fea", "cap": "王后的哀求", "n": 172}, {"t": "p", "s": [["c33-021", "赫克托耳的母亲，赫卡柏，也站在城墙上她解开了自己的衣服，露出胸口，大声地哭着，说：“赫克托耳，我的孩子，你看看我这个胸口，我曾经，用这里，喂你吃奶，你不要再，在城墙外，和那个人对打，进来吧，不要像一个人，对着一头，凶猛的狮子，去送死。”"]]}, {"t": "p", "s": [["c33-022", "两位老人，哭得，那样伤心。"]]}, {"t": "p", "s": [["c33-023", "可是，赫克托耳，不动。"]]}, {"t": "img", "src": "images/67.webp?v=71e66dfe95", "vid": "images/67.mp4?v=fedfb4839b", "cap": "城门前的赫克托耳", "n": 173}, {"t": "p", "s": [["c33-024", "他靠着一座，凸出来的城楼，把那面光亮的盾牌，靠在上面心里，对自己说："]]}, {"t": "p", "s": [["c33-025", "“我要是退进了城里，波吕达马斯，一定会指责我，说，他劝我们，天黑的时候，退回城里，可是，我没有听，现在，许多人，被阿喀琉斯杀死了，我心里，怎么能不羞愧？"], ["c33-026", "要是我进城，会有人说：‘赫克托耳，太相信自己的力量，毁了特洛伊的人。’”"]]}, {"t": "p", "s": [["c33-027", "“我真想把盾牌和头盔，放在地上，扔下长矛，走到阿喀琉斯的面前，对他说：‘我们愿意，把海伦和她的财宝，都还给你们，我们还会拿出城里的一半财富。’"], ["c33-028", "可是，这样也不行，他会像对一个手无寸铁的女人一样，不听我说话，杀了我。”"]]}, {"t": "p", "s": [["c33-029", "“现在，不是，在橡树下，或在岩石边，像年轻的小伙子，和姑娘一样，说悄悄话的时候。"], ["c33-030", "还是，我们去，互相打一场，看看宙斯，把胜利，给谁吧。”"]]}, {"t": "img", "src": "images/222.webp?v=3cf955b6d4", "vid": "images/222.mp4?v=f8847120a2", "cap": "越走越近", "n": 174}, {"t": "p", "s": [["c33-031", "阿喀琉斯越走越近。"], ["c33-032", "他手里，摇着那支，用珀利翁山的梣木，做成的长矛，身上的盔甲，亮得，像升起的太阳。"]]}, {"t": "p", "s": [["c33-033", "城墙外的草，被风吹得，一浪一浪的。"], ["c33-034", "有几只小鸟，落在了城墙的缝隙里，叽叽喳喳地叫着，好像什么都不知道。"]]}, {"t": "p", "s": [["c33-035", "城墙上的人，却没有一个出声。"], ["c33-036", "每个人都望着城门前，那个高高的身影。"], ["c33-037", "他们的心，一下一下地跳着，像在敲一面看不见的鼓。"]]}, {"t": "p", "s": [["c33-038", "阿喀琉斯的影子，越来越长，越来越近，近得，连他盔甲上的花纹，都能看清了。"]]}, {"t": "p", "s": [["c33-039", "老国王普里阿摩斯的手，一直在发抖。"], ["c33-040", "他抓着城垛，指甲都发白了。"], ["c33-041", "身边的女人们，捂着嘴，不敢哭出声。"], ["c33-042", "就连平时最爱吵闹的小孩子，也紧紧地靠在妈妈的腿边，睁着大眼睛，一声也不吭。"]]}, {"t": "p", "s": [["c33-043", "有一个小姑娘，在人群里踮着脚，努力地想看清楚外面发生了什么。"], ["c33-044", "她的妈妈，一把捂住了她的眼睛，小声地说：“别看，孩子，别看。”"]]}, {"t": "p", "s": [["c33-045", "赫克托耳一看见他，浑身一颤，再也站不住了，转身，拔腿，就跑。"]]}]}, {"title": "第三十四章　绕着城墙跑", "head": "c34-h", "audio": "audio/ch34.m4a?v=829399afe3", "duration": 372.625, "times": {"c34-h": [0.0, 2.966], "c34-001": [3.966, 9.95], "c34-002": [10.8, 15.549], "c34-003": [16.399, 28.504], "c34-004": [28.854, 36.065], "c34-005": [36.415, 46.131], "c34-006": [46.981, 49.256], "c34-007": [49.606, 57.021], "c34-008": [57.371, 64.764], "c34-009": [65.614, 69.031], "c34-010": [69.881, 73.891], "c34-011": [74.741, 81.186], "c34-012": [81.536, 89.888], "c34-013": [90.238, 95.87], "c34-014": [96.22, 104.069], "c34-015": [104.919, 110.058], "c34-016": [110.408, 114.747], "c34-017": [115.597, 128.049], "c34-018": [128.899, 133.457], "c34-019": [134.307, 138.863], "c34-020": [139.213, 146.848], "c34-021": [147.698, 151.362], "c34-022": [152.212, 162.805], "c34-023": [163.655, 173.669], "c34-024": [174.519, 180.007], "c34-025": [180.857, 185.325], "c34-026": [186.175, 199.655], "c34-027": [200.005, 203.305], "c34-028": [204.155, 223.822], "c34-029": [224.672, 237.543], "c34-030": [237.893, 242.181], "c34-031": [243.031, 260.233], "c34-032": [260.583, 262.821], "c34-033": [263.671, 269.145], "c34-034": [269.495, 275.259], "c34-035": [275.609, 281.167], "c34-036": [282.017, 284.169], "c34-037": [285.019, 291.755], "c34-038": [292.105, 297.058], "c34-039": [297.408, 304.703], "c34-040": [305.553, 310.707], "c34-041": [311.057, 319.498], "c34-042": [320.348, 324.974], "c34-043": [325.324, 336.417], "c34-044": [337.267, 345.329], "c34-045": [345.679, 352.194], "c34-046": [352.544, 355.12], "c34-047": [355.97, 362.122], "c34-048": [362.472, 371.125]}, "blocks": [{"t": "p", "s": [["c34-001", "赫克托耳像一只，被鹰追赶的鸽子，在城墙下，拼命地跑。"]]}, {"t": "p", "s": [["c34-002", "阿喀琉斯像一只猎鹰，在后面，紧紧地追着。"]]}, {"t": "img", "src": "images/68.webp?v=fb155d6e80", "vid": "images/68.mp4?v=605e20e0e8", "cap": "绕城的追逐", "n": 175}, {"t": "p", "s": [["c34-003", "他们沿着那条，被马车，压出来的路，跑过了瞭望台，跑过了老无花果树，跑到了两股泉水，涌出来的地方。"], ["c34-004", "一股泉水，是热的，冒着蒸汽；另一股，是冷的，像冰雪一样凉。"], ["c34-005", "泉水的旁边，有两个，宽宽的石头池子，那是和平的时候，特洛伊的女人们，洗漂亮衣服的地方。"]]}, {"t": "p", "s": [["c34-006", "他们一个在前一个在后。"], ["c34-007", "前面的那个，是个勇敢的人，可是，后面的那个，更勇敢，更快。"], ["c34-008", "他们不是，在赛一头牲畜，也不是，在赛一张牛皮，而是，在赛，赫克托耳的命。"]]}, {"t": "p", "s": [["c34-009", "他们绕着城墙，跑了一圈，又一圈。"]]}, {"t": "img", "src": "images/187.webp?v=bdcf2d2d24", "vid": "images/187.mp4?v=8fc38724ee", "cap": "神仙看着", "n": 176}, {"t": "p", "s": [["c34-010", "神仙们坐在奥林匹斯山上，都在看着。"]]}, {"t": "p", "s": [["c34-011", "宙斯说：“唉，我心里，真为赫克托耳，难过。"], ["c34-012", "他曾经，在伊达山的山顶上，在城堡里，给我烧过那么多的牛腿。"], ["c34-013", "现在，阿喀琉斯，却在城墙下，追着他。"], ["c34-014", "神仙们，我们想一想，是救他，还是让他，死在阿喀琉斯手里？”"]]}, {"t": "p", "s": [["c34-015", "雅典娜说：“父亲，你要放过一个，早就注定要死的人吗？"], ["c34-016", "你随意吧，可是，别的神仙，不会赞成的。”"]]}, {"t": "p", "s": [["c34-017", "宙斯心软地说：“好吧，特里托格涅亚，我的孩子，我刚才，不是真的认真，我愿意对你好，你按照你的心意去做吧。”"]]}, {"t": "p", "s": [["c34-018", "雅典娜像一阵风，从奥林匹斯山上，冲了下来。"]]}, {"t": "p", "s": [["c34-019", "赫克托耳围着城墙，跑到第三圈，已经没有力气了。"], ["c34-020", "阿波罗每一次，都在最后一刻悄悄地，给他力气，让他，能再跑一圈。"]]}, {"t": "p", "s": [["c34-021", "可是，现在，到了命运的终点。"]]}, {"t": "p", "s": [["c34-022", "阿喀琉斯对着城楼上赫克托耳的亲人们，不断地摇头，示意他们，不要射箭，别让别人抢走他的荣誉。"]]}, {"t": "img", "src": "images/69.webp?v=72b7e6bb05", "vid": "images/69.mp4?v=e19dddcd0f", "cap": "命运的金秤", "n": 177}, {"t": "p", "s": [["c34-023", "宙斯拿出了那杆，金色的秤，把赫克托耳和阿喀琉斯，两个人的命运，一起，放了上去。"]]}, {"t": "p", "s": [["c34-024", "赫克托耳的那一端，向下沉，沉到了冥王的家里。"]]}, {"t": "p", "s": [["c34-025", "阿波罗悄悄地，离开了他，再也没有来帮他。"]]}, {"t": "img", "src": "images/188.webp?v=04ac02cd83", "vid": "images/188.mp4?v=54c405a79b", "cap": "假弟弟", "n": 178}, {"t": "p", "s": [["c34-026", "雅典娜变成了赫克托耳的弟弟，得伊福波斯的样子，站在了赫克托耳的身边，对他说：“哥哥，你太累了，阿喀琉斯，追得你太紧了。"], ["c34-027", "我们两个，一起上，站住和他打一场吧。”"]]}, {"t": "p", "s": [["c34-028", "赫克托耳一看见自己的弟弟，来帮他，心里，涌起了无比的高兴，他说：“得伊福波斯，你一直是我最亲爱的弟弟，现在，你竟然，在这样的时候，从城里，冲了出来，我更要敬重你了，别的人，都躲在城里，只有你，来了。”"]]}, {"t": "p", "s": [["c34-029", "雅典娜说：“哥哥，是的，我的父亲、母亲，都在城里，劝我不要出来，可是，我实在，不忍心看着你，一个人，被追着。"], ["c34-030", "来，我们不要怕，用长矛，让他知道我们的厉害。”"]]}, {"t": "p", "s": [["c34-031", "赫克托耳勇敢地，转过身，面对着阿喀琉斯，大声说：“阿喀琉斯，我不会再逃了，我们来打一场，可是，我们先向神仙发个誓：要是宙斯，让我杀死了你，我只拿走你的盔甲，把你的尸体，还给希腊人。"], ["c34-032", "你，也要这样，答应我。”"]]}, {"t": "p", "s": [["c34-033", "阿喀琉斯瞪着他，说：“赫克托耳，你不要和我，谈什么誓言。"], ["c34-034", "狮子和人，从来不会成为朋友，狼和羊，也不会，有一样的心。"], ["c34-035", "我们之间，只有仇恨，到你或我，倒下了，才会结束。”"]]}, {"t": "p", "s": [["c34-036", "他举起了长矛，投了出去。"]]}, {"t": "p", "s": [["c34-037", "泉水哗哗地流着，水面上，漂着几片被风吹落的小叶子。"], ["c34-038", "女人们从前洗衣服用的石头，被太阳晒得，干干的。"], ["c34-039", "曾经，这里是整个城里最热闹的地方，姑娘们一边洗，一边笑，一边唱歌。"]]}, {"t": "p", "s": [["c34-040", "现在，这里只剩下两个人，一个跑，一个追。"], ["c34-041", "他们的脚步声，咚咚咚咚，敲在石头上，也敲在每一个看着他们的人的心上。"]]}, {"t": "p", "s": [["c34-042", "这时候，城墙上的人群，忽然安静了。"], ["c34-043", "一阵风，从平原上吹来，吹起了赫克托耳披风的一角，那一角，红红的，在风里，一下一下地，飘着。"]]}, {"t": "img", "src": "images/189.webp?v=074c63c269", "vid": "images/189.mp4?v=2527cdf5a1", "cap": "第三圈", "n": 179}, {"t": "p", "s": [["c34-044", "绕到第三圈的时候，赫克托耳的脚步，越来越慢，呼吸，越来越重。"], ["c34-045", "他的盔甲，被汗水浸透了，每迈一步，都好像拖着一座小山。"], ["c34-046", "可是，他，一直没有停下来。"]]}, {"t": "p", "s": [["c34-047", "赫克托耳一弯腰，长矛，从他头上，飞了过去，插进了土里。"], ["c34-048", "雅典娜悄悄地，拔起来，又放回了阿喀琉斯的手里，可赫克托耳，一点也没有看见。"]]}]}, {"title": "第三十五章　赫克托耳的最后一战", "head": "c35-h", "audio": "audio/ch35.m4a?v=2e54197d06", "duration": 381.038, "times": {"c35-h": [0.0, 3.688], "c35-001": [4.688, 7.28], "c35-002": [8.13, 16.01], "c35-003": [16.36, 27.094], "c35-004": [27.944, 30.088], "c35-005": [30.938, 32.555], "c35-006": [32.905, 35.393], "c35-007": [35.743, 42.847], "c35-008": [43.197, 49.877], "c35-009": [50.227, 54.546], "c35-010": [54.896, 59.226], "c35-011": [60.076, 71.338], "c35-012": [72.188, 74.209], "c35-013": [75.059, 90.308], "c35-014": [90.658, 102.021], "c35-015": [102.871, 110.492], "c35-016": [111.342, 113.383], "c35-017": [114.233, 116.519], "c35-018": [117.369, 126.366], "c35-019": [126.716, 133.525], "c35-020": [133.875, 139.933], "c35-021": [140.783, 148.859], "c35-022": [149.209, 156.864], "c35-023": [157.714, 163.15], "c35-024": [163.5, 166.491], "c35-025": [166.841, 173.197], "c35-026": [174.047, 181.42], "c35-027": [181.77, 193.597], "c35-028": [194.447, 200.041], "c35-029": [200.891, 212.493], "c35-030": [213.343, 222.161], "c35-031": [223.011, 231.964], "c35-032": [232.814, 236.898], "c35-033": [237.248, 253.338], "c35-034": [254.188, 271.144], "c35-035": [271.994, 280.597], "c35-036": [281.447, 285.407], "c35-037": [286.257, 293.355], "c35-038": [293.705, 301.906], "c35-039": [302.756, 310.835], "c35-040": [311.685, 321.229], "c35-041": [321.579, 327.909], "c35-042": [328.259, 330.815], "c35-043": [331.665, 336.914], "c35-044": [337.764, 344.422], "c35-045": [345.272, 350.705], "c35-046": [351.055, 364.598], "c35-047": [365.448, 373.642], "c35-048": [373.992, 379.538]}, "blocks": [{"t": "p", "s": [["c35-001", "赫克托耳也投出了长矛。"]]}, {"t": "p", "s": [["c35-002", "长矛，打在了阿喀琉斯，那面神仙做的盾牌上，弹了回来，掉在了地上。"], ["c35-003", "赫克托耳吓了一跳，回头，想向得伊福波斯，要一支新的长矛，可是，他的弟弟，不见了。"]]}, {"t": "p", "s": [["c35-004", "他一下子，明白了。"]]}, {"t": "img", "src": "images/190.webp?v=f599ffc699", "vid": "images/190.mp4?v=7d4152caa8", "cap": "赫克托耳明白了", "n": 180}, {"t": "p", "s": [["c35-005", "他说：“唉！"], ["c35-006", "神仙们，是真的，要我死了。"], ["c35-007", "我以为，我的弟弟，站在我身边，可是，城墙还在那边，雅典娜，欺骗了我。"], ["c35-008", "命运，终于来了，宙斯和阿波罗，从前一直帮助我，现在，也不要我了。"], ["c35-009", "可是，我不会像一个，什么也没有做的人，那样死去。"], ["c35-010", "我还要，做一件大事，让后人，听了，也会记住的。”"]]}, {"t": "p", "s": [["c35-011", "他拔出了身上，那把，又大、又重的长剑，像一只，从高高的云层，扑下来的老鹰，向阿喀琉斯，冲了过去。"]]}, {"t": "p", "s": [["c35-012", "阿喀琉斯也冲了上来。"]]}, {"t": "p", "s": [["c35-013", "他的胸口，像是被怒火塞满了，他的盾牌，在前面，闪着光，他的头盔上，金色的羽毛，在风里，摇晃，像一颗，亮得耀眼的星星。"], ["c35-014", "他盯着赫克托耳，那一身，从帕特洛克罗斯身上，拿走的盔甲，寻找着，哪里，有一点点，空隙。"]]}, {"t": "p", "s": [["c35-015", "他看见了，在脖子和肩膀的连接处，有一小块，没有被盔甲遮住的地方。"]]}, {"t": "p", "s": [["c35-016", "他一矛，刺了过去。"]]}, {"t": "img", "src": "images/70.webp?v=17ed8b5877", "vid": "images/70.mp4?v=2e3e3dbae7", "cap": "最后的决斗", "n": 181}, {"t": "p", "s": [["c35-017", "赫克托耳倒在了尘土里。"]]}, {"t": "p", "s": [["c35-018", "阿喀琉斯得意地，对他说：“赫克托耳，你杀死了帕特洛克罗斯的时候，以为自己，可以平平安安的。"], ["c35-019", "你把我，忘了，我不在他的身边，可是，我是他的朋友，我比他强大得多。"], ["c35-020", "现在，我要让他得到希腊人，最隆重的葬礼，而你就留在这里吧。”"]]}, {"t": "p", "s": [["c35-021", "赫克托耳用最后一点力气，说：“我求你，凭着你的生命，你的父母，不要把我，丢在大船边。"], ["c35-022", "我的父亲和母亲，会拿出许多金子和铜，来赎我的尸体，让特洛伊人，把我烧了，埋葬。”"]]}, {"t": "p", "s": [["c35-023", "阿喀琉斯狠狠地，看着他，说：“你不要，求我不要提我的父母。"], ["c35-024", "我心里的气，到现在，还没有消。"], ["c35-025", "你的父母，就算拿来，比你的身体，重十倍、二十倍的金子，我也不会答应。”"]]}, {"t": "p", "s": [["c35-026", "赫克托耳叹了一口气，说：“我早就知道，你的心，是铁的，我劝不动你。"], ["c35-027", "可是，你要小心，总有一天，神的愤怒，会降临到你的头上，那时候，帕里斯，和阿波罗，会在斯卡亚门，杀死你，不管你多么勇敢。”"]]}, {"t": "p", "s": [["c35-028", "说完，死亡，像一团，黑色的云，罩住了他。"]]}, {"t": "img", "src": "images/191.webp?v=e9486589e4", "vid": "images/191.mp4?v=ac1a4d7c29", "cap": "离去的灵魂", "n": 182}, {"t": "p", "s": [["c35-029", "他的灵魂，离开了身体，飞向了冥府一边飞，一边哭泣，为自己，那样年轻，那样强壮，却要离开人世，感到惋惜。"]]}, {"t": "p", "s": [["c35-030", "阿喀琉斯对他的尸体，说：“你死吧，我也会死的，不管宙斯，什么时候，让命运，来找我。”"]]}, {"t": "p", "s": [["c35-031", "他拔出了长矛，把赫克托耳身上，那一身，染了血的盔甲，一件一件，脱了下来。"]]}, {"t": "p", "s": [["c35-032", "希腊人从四面八方跑过来，围着赫克托耳。"], ["c35-033", "他们看着他，又高、又英俊的身体，每个人，都忍不住，用长矛，轻轻地碰一下，说：“嗯，现在的赫克托耳，真的比放火烧我们大船的时候，好对付了。”"]]}, {"t": "p", "s": [["c35-034", "阿喀琉斯把赫克托耳的脚踝，用牛皮带，穿了起来，绑在了战车的后面，让他的头，垂在地上沾满了尘土，那是，从前，那样漂亮的头发和英俊的脸。"]]}, {"t": "p", "s": [["c35-035", "他跳上战车，扬起鞭子，马，飞奔着，向希腊人的大船，驰去，扬起了一路的灰尘。"]]}, {"t": "img", "src": "images/192.webp?v=921111727e", "vid": "images/192.mp4?v=869376b162", "cap": "城墙上的哭声", "n": 183}, {"t": "p", "s": [["c35-036", "城墙上，老国王和王后，都看见了。"]]}, {"t": "p", "s": [["c35-037", "王后赫卡柏，一声尖叫，拔下了头上，闪着光的发带，扔在地上。"], ["c35-038", "老国王普里阿摩斯，哭得，一声声，凄惨地，叫着：“我的赫克托耳，我的赫克托耳。”"]]}, {"t": "p", "s": [["c35-039", "城里的人，都跟着哭了起来，整座特洛伊城，好像，被大火，吞没了一样。"]]}, {"t": "img", "src": "images/71.webp?v=03539d78eb", "vid": "images/71.mp4?v=3effc77f58", "cap": "妻子织着披风", "n": 184}, {"t": "p", "s": [["c35-040", "安德洛玛刻正在房间里织着一块，大大的紫色披风，上面，绣着许多，美丽的花。"], ["c35-041", "她让女仆们烧一锅热水，等赫克托耳，打仗回来，洗个热水澡。"], ["c35-042", "她没有听见，外面的哭声。"]]}, {"t": "p", "s": [["c35-043", "等她听见了，从房间里，冲了出来，一路，跑上城墙。"]]}, {"t": "img", "src": "images/193.webp?v=55869867a2", "vid": "images/193.mp4?v=1e75c45b56", "cap": "跑上城墙", "n": 185}, {"t": "p", "s": [["c35-044", "她看见了，那辆战车，拖着她的丈夫，向大船，飞驰而去。"]]}, {"t": "p", "s": [["c35-045", "城里的人，听说了，一个一个地，涌上街头。"], ["c35-046", "有人跪在地上，向天空祈祷；有人抱着孩子，哭得说不出话来；还有一位白发的老奶奶，一直念着赫克托耳的名字，像念着自己亲生的孩子。"]]}, {"t": "p", "s": [["c35-047", "她眼前，一片漆黑，倒在了地上头上的发带、面纱，都掉了。"], ["c35-048", "那是金色的阿芙洛狄忒，在她结婚的那天，送给她的。"]]}]}, {"title": "第三十六章　帕特洛克罗斯的葬礼", "head": "c36-h", "audio": "audio/ch36.m4a?v=b073964798", "duration": 373.586, "times": {"c36-h": [0.0, 3.246], "c36-001": [4.246, 19.377], "c36-002": [19.727, 22.463], "c36-003": [23.313, 29.787], "c36-004": [30.137, 38.746], "c36-005": [39.596, 47.988], "c36-006": [48.338, 51.843], "c36-007": [52.693, 64.897], "c36-008": [65.247, 74.059], "c36-009": [74.909, 80.522], "c36-010": [81.372, 92.322], "c36-011": [92.672, 99.037], "c36-012": [99.387, 105.801], "c36-013": [106.151, 118.144], "c36-014": [118.994, 128.71], "c36-015": [129.06, 134.93], "c36-016": [135.28, 142.348], "c36-017": [142.698, 152.739], "c36-018": [153.089, 157.674], "c36-019": [158.524, 163.545], "c36-020": [163.895, 170.896], "c36-021": [171.746, 178.439], "c36-022": [179.289, 185.943], "c36-023": [186.793, 197.804], "c36-024": [198.154, 206.291], "c36-025": [207.141, 208.004], "c36-026": [208.854, 214.323], "c36-027": [214.673, 219.718], "c36-028": [220.568, 230.614], "c36-029": [230.964, 256.211], "c36-030": [257.061, 267.356], "c36-031": [268.206, 270.11], "c36-032": [270.96, 278.183], "c36-033": [279.033, 287.467], "c36-034": [288.317, 292.46], "c36-035": [292.81, 309.868], "c36-036": [310.718, 313.865], "c36-037": [314.715, 328.91], "c36-038": [329.76, 336.122], "c36-039": [336.972, 340.797], "c36-040": [341.147, 348.393], "c36-041": [348.743, 353.928], "c36-042": [354.778, 372.086]}, "blocks": [{"t": "p", "s": [["c36-001", "阿喀琉斯回到了自己的大船边，对密耳弥冬人说：“朋友们，先不要解下马，不要脱下盔甲，我们驾着战车，绕着帕特洛克罗斯的尸体，走三圈，这是他应该得到的敬意。"], ["c36-002", "然后，我们再坐下来，办葬礼。”"]]}, {"t": "img", "src": "images/194.webp?v=8b0b883679", "vid": "images/194.mp4?v=a12cdd61ac", "cap": "绕圈致哀", "n": 186}, {"t": "p", "s": [["c36-003", "他们一起，驾着马，绕着帕特洛克罗斯，哭着，走了三圈。"], ["c36-004", "忒提斯也站在那里和大家一起，哭，眼泪，沾湿了沙子，沾湿了盔甲。"]]}, {"t": "p", "s": [["c36-005", "阿喀琉斯把手放在朋友的胸口上，对他说：“帕特洛克罗斯，我答应你的，现在，已经做到了。"], ["c36-006", "我把赫克托耳，带来了，他的盔甲，也在这里。”"]]}, {"t": "p", "s": [["c36-007", "可是，阿芙洛狄忒，白天黑夜，都在赫克托耳的身边，用玫瑰的香油，涂在他的身上不让他的身体，受一点损坏。"], ["c36-008", "阿波罗从天上撒下了一片，黑色的云，盖住了他躺着的那片地，不让太阳晒坏他的皮肤。"]]}, {"t": "img", "src": "images/72.webp?v=2c4a5f8961", "vid": "images/72.mp4?v=8f791e191c", "cap": "朋友的灵魂", "n": 187}, {"t": "p", "s": [["c36-009", "那一夜，帕特洛克罗斯的灵魂，来到了阿喀琉斯的梦里。"]]}, {"t": "p", "s": [["c36-010", "他的样子，和活着的时候，一模一样，同样的个子，同样的眼睛，同样的声音，穿着，同样的衣服。"], ["c36-011", "他站在阿喀琉斯的头边，说：“阿喀琉斯，你睡着了，把我忘了吗？"], ["c36-012", "我活着的时候，你从来不会忘了我，现在，我死了，你就不关心我了。"], ["c36-013", "快点，把我埋了吧，我要早点，进入冥王的大门，别的灵魂，不让我渡过河去，我只好，在冥王家的门口，孤零零地，到处飘荡。”"]]}, {"t": "p", "s": [["c36-014", "“求你，伸出手来，给我最后一次，握一握，因为，我从火葬堆里，出来以后，再也回不来了。"], ["c36-015", "我们，再也不能，像从前一样，坐在一起，说我们的心里话了。"], ["c36-016", "我的命运，让我死在了特洛伊城墙下，你的命运，也是这样，也在特洛伊城墙下。"], ["c36-017", "我还有一个请求：不要把我的骨灰，和你的，分开要放在一只，金色的瓶子里，那是你的母亲，给你的。"], ["c36-018", "我们，从小一起长大，也让我们，埋在一起。”"]]}, {"t": "p", "s": [["c36-019", "阿喀琉斯惊奇地说：“我的好兄弟，你为什么，来对我说这些？"], ["c36-020", "我什么事，都会做的，你再靠近一点，让我们，抱一抱，哪怕只是一小会儿，也好。”"]]}, {"t": "p", "s": [["c36-021", "他伸出手，想去抱他，可是，只抱住了，一团冰冷的烟。"]]}, {"t": "p", "s": [["c36-022", "灵魂，像一缕烟，吱的一声，钻进了地里，不见了。"]]}, {"t": "p", "s": [["c36-023", "阿喀琉斯一下子，跳了起来，拍着手，叹着气，说：“唉，原来，就算在冥府，也有灵魂，只是没有身体。"], ["c36-024", "今天一夜，帕特洛克罗斯，在我的身边，哭着，说着，真的，和他活着的时候，一模一样。”"]]}, {"t": "p", "s": [["c36-025", "天亮了。"]]}, {"t": "img", "src": "images/195.webp?v=d5aade685c", "vid": "images/195.mp4?v=859aa123be", "cap": "山上砍柴", "n": 188}, {"t": "p", "s": [["c36-026", "阿伽门农派了许多人，到伊达山的森林里，去砍柴。"], ["c36-027", "他们砍倒了高高的橡树，用骡车，运回了海边。"]]}, {"t": "p", "s": [["c36-028", "人们，在海边，堆起了一个，一百步长、一百步宽的火葬堆，把帕特洛克罗斯的尸体，放在上面。"], ["c36-029", "人们，把自己的头发，割下来，铺满了他的全身，阿喀琉斯，也割下了自己的长发，那是他，早就想献给自己家乡的河神的，现在，他把它放在了朋友的手里，说：“帕特洛克罗斯，我今天，把它献给你，不能献给河神了，因为，我再也回不去了。”"]]}, {"t": "p", "s": [["c36-030", "人们，宰了许多头牛羊，用它们的油，包着帕特洛克罗斯的尸体，又把罐子里面装着蜂蜜和油，放在床边。"]]}, {"t": "img", "src": "images/73.webp?v=0631325038", "vid": "images/73.mp4?v=f2f6ed6c9d", "cap": "告别的火", "n": 189}, {"t": "p", "s": [["c36-031", "火，点起来了。"]]}, {"t": "p", "s": [["c36-032", "可是，火堆，怎么也烧不旺，因为，风神，还没有来。"]]}, {"t": "p", "s": [["c36-033", "阿喀琉斯向北风和西风，祈祷：“请你们，来吧，帮我们，把这堆火，烧得旺旺的。”"]]}, {"t": "p", "s": [["c36-034", "彩虹女神伊里斯，把消息，带给了风神们。"], ["c36-035", "风神们，正在西风的家里，吃饭，听见了，一起，呼啸着，冲了过来，大海，被吹得，掀起了波浪，吹到了特洛伊的平原上，火，一下子，烧得，又高又亮。"]]}, {"t": "img", "src": "images/196.webp?v=e641feb1c9", "vid": "images/196.mp4?v=89a36999b6", "cap": "燃烧的夜", "n": 190}, {"t": "p", "s": [["c36-036", "火，整整，烧了一夜。"]]}, {"t": "p", "s": [["c36-037", "阿喀琉斯手里，拿着一只金杯，一杯一杯，把酒，洒在地上叫着他朋友的名字，哭了一整夜，像一位父亲，在烧他刚刚结婚就死去的儿子的骨头。"]]}, {"t": "p", "s": [["c36-038", "清晨，火，渐渐地，熄了，风神们，才回家去。"]]}, {"t": "p", "s": [["c36-039", "夜里，海边的火，一直烧到天亮。"], ["c36-040", "风吹起火星，像无数只金色的萤火虫，一点一点地，飞向了天空。"], ["c36-041", "有人说，那是帕特洛克罗斯的灵魂，在向大家告别。"]]}, {"t": "p", "s": [["c36-042", "人们，用酒，浇灭了余下的火，仔细地，收集了帕特洛克罗斯的骨头，放进了金色的瓶子，用两层油脂，盖好，放在帐篷里等着阿喀琉斯，也死了，再埋在一起。"]]}]}, {"title": "第三十七章　英雄们的运动会", "head": "c37-h", "audio": "audio/ch37.m4a?v=27b775960c", "duration": 369.579, "times": {"c37-h": [0.0, 3.573], "c37-001": [4.573, 9.116], "c37-002": [9.966, 27.516], "c37-003": [28.366, 33.103], "c37-004": [33.453, 47.109], "c37-005": [47.459, 51.447], "c37-006": [52.297, 54.522], "c37-007": [55.372, 59.626], "c37-008": [59.976, 67.874], "c37-009": [68.224, 80.678], "c37-010": [81.028, 88.781], "c37-011": [89.631, 103.016], "c37-012": [103.866, 110.807], "c37-013": [111.157, 117.533], "c37-014": [117.883, 122.162], "c37-015": [123.012, 132.247], "c37-016": [133.097, 135.436], "c37-017": [136.286, 147.605], "c37-018": [147.955, 150.157], "c37-019": [151.007, 158.138], "c37-020": [158.488, 171.466], "c37-021": [172.316, 174.628], "c37-022": [175.478, 178.998], "c37-023": [179.348, 185.769], "c37-024": [186.119, 192.005], "c37-025": [192.855, 205.736], "c37-026": [206.086, 207.522], "c37-027": [208.372, 221.677], "c37-028": [222.527, 228.435], "c37-029": [229.285, 234.764], "c37-030": [235.114, 242.489], "c37-031": [242.839, 249.899], "c37-032": [250.749, 253.571], "c37-033": [253.921, 270.004], "c37-034": [270.854, 272.98], "c37-035": [273.83, 283.493], "c37-036": [284.343, 286.635], "c37-037": [287.485, 293.79], "c37-038": [294.14, 304.426], "c37-039": [305.276, 309.706], "c37-040": [310.056, 314.304], "c37-041": [315.154, 319.218], "c37-042": [319.568, 323.346], "c37-043": [323.696, 328.077], "c37-044": [328.427, 335.804], "c37-045": [336.654, 339.604], "c37-046": [339.954, 352.695], "c37-047": [353.545, 368.079]}, "blocks": [{"t": "p", "s": [["c37-001", "葬礼完了，阿喀琉斯，没有让大家马上散去。"]]}, {"t": "img", "src": "images/197.webp?v=40bba5deba", "vid": "images/197.mp4?v=254922ca48", "cap": "闪光的奖品", "n": 191}, {"t": "p", "s": [["c37-002", "他让人们在海边，围成了一个大圈，坐下来，把许多，闪闪发光的奖品，一件一件地，摆在中间：三脚鼎、大锅、骏马、骡子、金子、铁，还有，漂亮的姑娘。"]]}, {"t": "p", "s": [["c37-003", "他说：“朋友们，我们，要为帕特洛克罗斯，办一场比赛。"], ["c37-004", "要是比赛的人，是我，我一定会得第一，因为，我的马，是世上最好的马，可是，它们现在，也在为失去了朋友，而难过，还在哭泣。"], ["c37-005", "所以，我不参加，你们谁有信心，就来吧。”"]]}, {"t": "img", "src": "images/74.webp?v=33141982fb", "vid": "images/74.mp4?v=996d67fbed", "cap": "战车比赛", "n": 192}, {"t": "p", "s": [["c37-006", "第一场，是战车比赛。"]]}, {"t": "p", "s": [["c37-007", "五位英雄，驾着自己的战车，站在起跑线上。"], ["c37-008", "有狄奥墨得斯，有墨涅拉俄斯，有涅斯托尔的儿子安提洛科斯，还有两位别的英雄。"], ["c37-009", "老涅斯托尔一边给自己的儿子，出主意，一边说：“孩子，你的马，比别人的，慢可是，你要比别人，更聪明。"], ["c37-010", "在拐弯的地方，要紧贴着转弯的标记，把马勒紧，手里别松开缰绳。”"]]}, {"t": "p", "s": [["c37-011", "信号一响，五辆战车，像五只，从山上俯冲下来的鹰，向前飞奔，马蹄，扬起，灰尘，像大雾，罩住了整个平原。"]]}, {"t": "p", "s": [["c37-012", "跑到一半，阿波罗，让狄奥墨得斯，手里的鞭子，掉在了地上。"], ["c37-013", "雅典娜悄悄地，把鞭子，递回了他的手里，又折断了别人的车轭。"], ["c37-014", "狄奥墨得斯赶了上去，第一个，冲过了终点。"]]}, {"t": "p", "s": [["c37-015", "阿喀琉斯为了表示尊敬，把第二名的奖品，给了安提洛科斯的快马，把一块黄金，送给了得了最后一名的人。"]]}, {"t": "img", "src": "images/198.webp?v=b9a36e4bdc", "vid": "images/198.mp4?v=23205023e2", "cap": "拳击", "n": 193}, {"t": "p", "s": [["c37-016", "第二场，是拳击。"]]}, {"t": "p", "s": [["c37-017", "一个又高又壮的人，叫埃佩奥斯，大声夸口：“谁要是，敢来和我，打一场，我就把他，打成一团烂泥。”"], ["c37-018", "大家都吓得，不敢出声。"]]}, {"t": "p", "s": [["c37-019", "最后，一个叫欧律阿洛斯的年轻人，站了出来，走到了场地中间。"], ["c37-020", "两个人，互相打了几拳，埃佩奥斯，一拳，把年轻人，打倒在地又把他扶起来，送给了他一杯水，大家，都笑了。"]]}, {"t": "img", "src": "images/75.webp?v=90d085c7ec", "vid": "images/75.mp4?v=16e55d7328", "cap": "摔跤的两位英雄", "n": 194}, {"t": "p", "s": [["c37-021", "第三场，是摔跤。"]]}, {"t": "p", "s": [["c37-022", "大埃阿斯和奥德修斯，站在了一起。"], ["c37-023", "两个人，抓着对方的腰使劲，一拉，一推，谁也没把谁摔倒。"], ["c37-024", "观众们，看得，都不耐烦了，喊着：“快点，分出胜负！”"]]}, {"t": "p", "s": [["c37-025", "大埃阿斯一把，把奥德修斯，举了起来，可是，奥德修斯，用脚，勾了一下他的膝盖，两个人，一起，倒在了地上。"], ["c37-026", "大家哈哈大笑。"]]}, {"t": "p", "s": [["c37-027", "第三次，他们，刚要再来，阿喀琉斯，站起来，说：“别再打了，不要再互相折磨了，你们两个，都是胜利者，各自拿一份礼物回去吧。”"]]}, {"t": "p", "s": [["c37-028", "两个人，高高兴兴，拥抱在了一起拿了奖品，离开了场地。"]]}, {"t": "p", "s": [["c37-029", "接下来，是赛跑、比武、扔铁饼、射箭、投标枪。"], ["c37-030", "奥德修斯在赛跑的时候，向雅典娜，小声祈祷：“女神，请您帮我的脚，快一些吧。”"], ["c37-031", "雅典娜听到了，让他的脚，轻得，像一阵风，他，第一个，冲到了终点。"]]}, {"t": "p", "s": [["c37-032", "最后一场，是标枪。"], ["c37-033", "阿伽门农和一位叫墨里奥涅斯的英雄，上场了，阿喀琉斯，笑着说：“阿伽门农，大家都知道，你是最强的，也是投得最远的，请你把这支标枪，收下吧，不用比了。”"]]}, {"t": "img", "src": "images/199.webp?v=e1cad93d5d", "vid": "images/199.mp4?v=61979b81a3", "cap": "握手言和", "n": 195}, {"t": "p", "s": [["c37-034", "阿伽门农笑着，接受了。"]]}, {"t": "p", "s": [["c37-035", "他们之间，一年多的怨恨，在这个，欢乐的运动场上，好像，一点一点，融化了。"]]}, {"t": "p", "s": [["c37-036", "太阳，慢慢地落下去。"]]}, {"t": "p", "s": [["c37-037", "比赛的间隙，有人拿来了蜂蜜水，大家一边喝，一边说笑。"], ["c37-038", "几个孩子兵，在人群里钻来钻去，递毛巾，捡标枪，累得满头大汗，可是脸上，一直笑嘻嘻的。"]]}, {"t": "p", "s": [["c37-039", "他们是第一次，在这片沙滩上，见到这样的热闹。"], ["c37-040", "这些日子，他们看见的，全是战争和眼泪。"]]}, {"t": "img", "src": "images/223.webp?v=d0b1a7c18f", "vid": "images/223.mp4?v=5f2495151f", "cap": "晚霞", "n": 196}, {"t": "p", "s": [["c37-041", "比赛结束的时候，天边已经被晚霞染红了。"], ["c37-042", "获奖的人，抱着奖品，开心地笑着。"], ["c37-043", "没有得奖的人，也在拍着手，替朋友高兴。"], ["c37-044", "有那么一小会儿，沙滩上，没有仇恨，没有战争，只有孩子一样的欢乐。"]]}, {"t": "p", "s": [["c37-045", "夜幕降临，大家都散去了。"], ["c37-046", "沙滩上，只剩下一堆堆的脚印，和一些被风吹得翻来翻去的彩色布条，它们，在月光下，轻轻地，晃动着。"]]}, {"t": "p", "s": [["c37-047", "所有的人，都回到了自己的帐篷，吃饭，睡觉，只有阿喀琉斯，一个人，躺在海边的沙滩上，翻来覆去，睡不着，一直想着他的朋友。"]]}]}, {"title": "第三十八章　神仙们的怜悯", "head": "c38-h", "audio": "audio/ch38.m4a?v=cc36a00d39", "duration": 391.173, "times": {"c38-h": [0.0, 3.38], "c38-001": [4.38, 14.649], "c38-002": [15.499, 22.947], "c38-003": [23.297, 39.164], "c38-004": [40.014, 42.021], "c38-005": [42.871, 48.32], "c38-006": [48.67, 55.165], "c38-007": [56.015, 60.042], "c38-008": [60.392, 71.337], "c38-009": [72.187, 93.475], "c38-010": [93.825, 101.645], "c38-011": [102.495, 110.374], "c38-012": [110.724, 130.028], "c38-013": [130.878, 134.71], "c38-014": [135.06, 143.2], "c38-015": [143.55, 151.365], "c38-016": [152.215, 157.517], "c38-017": [158.367, 167.822], "c38-018": [168.672, 174.223], "c38-019": [174.573, 179.839], "c38-020": [180.189, 198.763], "c38-021": [199.113, 206.071], "c38-022": [206.421, 214.19], "c38-023": [215.04, 221.234], "c38-024": [222.084, 231.335], "c38-025": [232.185, 241.018], "c38-026": [241.368, 249.843], "c38-027": [250.193, 258.653], "c38-028": [259.003, 265.71], "c38-029": [266.56, 276.655], "c38-030": [277.505, 280.848], "c38-031": [281.698, 296.469], "c38-032": [296.819, 303.372], "c38-033": [303.722, 316.237], "c38-034": [317.087, 322.026], "c38-035": [322.376, 326.813], "c38-036": [327.163, 335.4], "c38-037": [336.25, 340.684], "c38-038": [341.034, 346.652], "c38-039": [347.502, 351.109], "c38-040": [351.459, 359.645], "c38-041": [359.995, 367.777], "c38-042": [368.127, 372.575], "c38-043": [373.425, 384.27], "c38-044": [385.12, 389.673]}, "blocks": [{"t": "p", "s": [["c38-001", "那些日子里，阿喀琉斯，每天天亮，都要驾着战车，绕着帕特洛克罗斯的坟，走三圈，心里，总是难过。"]]}, {"t": "p", "s": [["c38-002", "赫克托耳的尸体，躺在帕特洛克罗斯的床前，脸朝下，趴在灰尘里。"], ["c38-003", "可是，阿波罗，可怜他，不让他的身体，坏掉，用金色的神盾，把他，盖得严严实实，露水一样的神仙的油，一直把他的皮肤，保护得，像刚刚睡着了一样。"]]}, {"t": "p", "s": [["c38-004", "这样，过了十一天。"]]}, {"t": "p", "s": [["c38-005", "奥林匹斯山上，神仙们，看着，都很不忍心。"], ["c38-006", "他们对赫尔墨斯说：“你悄悄地，去把赫克托耳，偷出来吧。”"]]}, {"t": "p", "s": [["c38-007", "赫拉、波塞冬和雅典娜，却不同意。"], ["c38-008", "他们对特洛伊一直，怀着怨恨，还在记着帕里斯，那个漂亮的牧羊人，当年，把金苹果，给了阿芙洛狄忒的事。"]]}, {"t": "img", "src": "images/76.webp?v=d2e0d357e3", "vid": "images/76.mp4?v=24a1dac474", "cap": "神仙们的怜悯", "n": 197}, {"t": "p", "s": [["c38-009", "到了第十二天，阿波罗，终于，对众神，大声说：“你们这些神仙，心真硬，赫克托耳，曾经给你们，烧了那么多牛羊的腿，你们却不愿意，救救他的尸体，让他的妻子、母亲、孩子和老父亲，再看他一眼，埋葬他。"], ["c38-010", "你们，却偏心阿喀琉斯，他的心，像一头狮子，只知道冲动，没有一点怜悯。”"]]}, {"t": "p", "s": [["c38-011", "赫拉生气地说：“阿波罗，你要是，这样对待阿喀琉斯，和对待赫克托耳，一样就好了。"], ["c38-012", "可是，赫克托耳，只是一个凡人，他喝的是普通女人的奶，阿喀琉斯，却是女神的儿子，是我亲自，把他的母亲，养大嫁给了珀琉斯，那场婚礼，你也在场，你还在席间，弹了琴，你这个人，总是靠不住。”"]]}, {"t": "p", "s": [["c38-013", "宙斯说：“赫拉，别发脾气了。"], ["c38-014", "赫克托耳，是特洛伊人当中，最爱神的人，神也没有忘记他。"], ["c38-015", "我们不用偷，我们去叫忒提斯，来，我有几句话，要对她说。”"]]}, {"t": "p", "s": [["c38-016", "他叫来了彩虹女神，伊里斯，去海里，叫忒提斯。"]]}, {"t": "p", "s": [["c38-017", "忒提斯来到了奥林匹斯山上，坐在雅典娜的身边，赫拉，递给了她一只金杯，劝她，喝一点。"]]}, {"t": "img", "src": "images/200.webp?v=a8484d8126", "vid": "images/200.mp4?v=fd01edc117", "cap": "宙斯的话", "n": 198}, {"t": "p", "s": [["c38-018", "宙斯说：“忒提斯，我知道，你心里难过。"], ["c38-019", "可是，神仙们，在为赫克托耳的尸体吵架。"], ["c38-020", "你去，告诉你的儿子，神仙们，都生他的气，我更生他的气，因为，他心里，怀着疯狂的念头，把赫克托耳，扣在船边，不肯放他。"], ["c38-021", "请他，怕一怕我，把尸体，还给赫克托耳的亲人。"], ["c38-022", "我会派伊里斯，去告诉普里阿摩斯，让他带着赎金，到阿喀琉斯那里去。”"]]}, {"t": "p", "s": [["c38-023", "忒提斯点了点头，像一只鹰，飞下山去，找到了儿子。"]]}, {"t": "p", "s": [["c38-024", "阿喀琉斯正在帐篷里唉声叹气，朋友们，围在他的身边准备着早饭，一头大绵羊，躺在桌子上。"]]}, {"t": "img", "src": "images/77.webp?v=7ab1917051", "vid": "images/77.mp4?v=6a0df6d9e4", "cap": "妈妈的劝告", "n": 199}, {"t": "p", "s": [["c38-025", "忒提斯坐在他的身边用手，轻轻地抚摸着他，说：“我的孩子，你要哭到什么时候？"], ["c38-026", "别把自己，累坏了，我活着的日子，已经不多了，你的死，也已经不远了。"], ["c38-027", "神仙们，都在生你的气，宙斯更生你的气，因为你，不肯放赫克托耳。"], ["c38-028", "你把他，还给他的亲人，让他们，拿着赎金，来赎他吧。”"]]}, {"t": "p", "s": [["c38-029", "阿喀琉斯低下头，说：“好，妈妈要是奥林匹斯山上的神仙，这样要求，那么谁给我赎金，谁就可以带走他。”"]]}, {"t": "p", "s": [["c38-030", "天上，宙斯，叫来了伊里斯。"]]}, {"t": "p", "s": [["c38-031", "他对她说：“你快去，告诉普里阿摩斯，不要害怕，也不要带别的人，只要带一个老传令官，赶一辆骡车，带上赎金，去阿喀琉斯那里。"], ["c38-032", "我会派赫尔墨斯，给他领路，一直领到阿喀琉斯的帐篷。"], ["c38-033", "阿喀琉斯，不会杀他，也不会让别人杀他，因为，他不是一个疯狂的人，他会宽恕一个，向他求饶的人。”"]]}, {"t": "p", "s": [["c38-034", "夜里，赫克托耳的尸体，安静地躺在帐篷旁边。"], ["c38-035", "月光照在他的脸上，像盖了一层薄薄的银纱。"], ["c38-036", "有一只小小的萤火虫，不知道从哪里飞来，在他的肩头，亮了一会儿，又飞走了。"]]}, {"t": "p", "s": [["c38-037", "守在旁边的密耳弥冬人，悄悄地低下了头。"], ["c38-038", "他们谁也不愿意说，可是心里，都有了一种说不出的难过。"]]}, {"t": "img", "src": "images/201.webp?v=d72fdf9aa1", "vid": "images/201.mp4?v=aa6344ffa8", "cap": "雨夜", "n": 200}, {"t": "p", "s": [["c38-039", "第十二天的夜里，下了一场小雨。"], ["c38-040", "雨点轻轻地落在帐篷上，沙沙沙，像有人，在很远的地方，低声地说话。"], ["c38-041", "阿喀琉斯，一个人，坐在帐篷门口，听着雨声，忽然想起了自己的父亲。"], ["c38-042", "他已经，很久很久，没有想起过他了。"]]}, {"t": "p", "s": [["c38-043", "这样的夜晚，阿喀琉斯，常常觉得，自己的心里，有一个很深很深的洞，怎么填，都填不满。"]]}, {"t": "img", "src": "images/202.webp?v=e82a44241a", "vid": "images/202.mp4?v=10920235d7", "cap": "彩虹女神出发", "n": 201}, {"t": "p", "s": [["c38-044", "伊里斯，披上了彩云，飞向了特洛伊城。"]]}]}, {"title": "第三十九章　老国王的夜路", "head": "c39-h", "audio": "audio/ch39.m4a?v=a39cb78a25", "duration": 382.459, "times": {"c39-h": [0.0, 3.648], "c39-001": [4.648, 8.278], "c39-002": [9.128, 24.119], "c39-003": [24.469, 30.213], "c39-004": [31.063, 42.454], "c39-005": [42.804, 50.292], "c39-006": [50.642, 55.866], "c39-007": [56.216, 58.437], "c39-008": [59.287, 71.674], "c39-009": [72.524, 91.052], "c39-010": [91.902, 95.232], "c39-011": [96.082, 103.892], "c39-012": [104.242, 109.694], "c39-013": [110.044, 111.273], "c39-014": [111.623, 118.592], "c39-015": [119.442, 123.586], "c39-016": [123.936, 131.292], "c39-017": [131.642, 140.17], "c39-018": [141.02, 147.565], "c39-019": [147.915, 159.395], "c39-020": [160.245, 169.32], "c39-021": [169.67, 172.864], "c39-022": [173.714, 175.479], "c39-023": [175.829, 184.12], "c39-024": [184.97, 192.047], "c39-025": [192.897, 210.619], "c39-026": [211.469, 228.23], "c39-027": [229.08, 236.884], "c39-028": [237.234, 238.551], "c39-029": [239.401, 257.189], "c39-030": [258.039, 266.667], "c39-031": [267.517, 277.91], "c39-032": [278.26, 281.875], "c39-033": [282.225, 290.567], "c39-034": [291.417, 294.491], "c39-035": [294.841, 297.007], "c39-036": [297.857, 302.256], "c39-037": [302.606, 309.041], "c39-038": [309.891, 316.397], "c39-039": [316.747, 318.853], "c39-040": [319.703, 335.617], "c39-041": [335.967, 339.759], "c39-042": [340.609, 352.753], "c39-043": [353.603, 364.393], "c39-044": [364.743, 370.881], "c39-045": [371.731, 380.959]}, "blocks": [{"t": "p", "s": [["c39-001", "特洛伊的王宫里，到处，是哭声。"]]}, {"t": "p", "s": [["c39-002", "老国王普里阿摩斯，坐在院子里用披风，蒙着头，整个人，缩成了一团，泥土，沾在他的脖子和头上，那是他，自己用手抓起来，撒在头上的。"], ["c39-003", "他的儿子们，围着他，女儿们，在房间里，哭泣。"]]}, {"t": "img", "src": "images/78.webp?v=834e741b3c", "vid": "images/78.mp4?v=13bd72090e", "cap": "王宫里的消息", "n": 202}, {"t": "img", "src": "images/79.webp?v=c6a756463c", "vid": "images/79.mp4?v=b78cbaa739", "cap": "老国王的车", "n": 203}, {"t": "p", "s": [["c39-004", "伊里斯，悄悄地，飞到了他的身边，轻轻地对他说：“普里阿摩斯，别怕，我不是来带坏消息的，我是宙斯，派来的。"], ["c39-005", "宙斯，心里很可怜你，你要去，找阿喀琉斯，把赎金，送给他，赎回你的儿子的尸体。"], ["c39-006", "只带一个年老的传令官，一辆骡车，不要怕，不会有人，伤害你。"], ["c39-007", "赫尔墨斯，会带着你。”"]]}, {"t": "p", "s": [["c39-008", "老国王站了起来，把家里的人，都赶了出去，说：“你们这些，没有用的东西，不要在这里，哭了，你们是不是，嫌我伤心的事，还不够多？”"]]}, {"t": "img", "src": "images/203.webp?v=51f1086215", "vid": "images/203.mp4?v=f2051c7a8c", "cap": "准备礼物", "n": 204}, {"t": "p", "s": [["c39-009", "他打开了一个，雕花的箱子，里面，有十二件，漂亮的袍子，十二件，单人披风，十二块毯子，十二块白色的大斗篷，还有十块金子，两个三脚鼎，四口锅，一只，漂亮的酒杯，那是色雷斯人，送给他的。"]]}, {"t": "p", "s": [["c39-010", "他把这些一件一件，放在了骡车里。"]]}, {"t": "p", "s": [["c39-011", "王后赫卡柏，从房间里，跑了出来，抱着他，哭着，说：“你疯了吗？"], ["c39-012", "你一个人，去找那个人，那个杀了我们这么多儿子的人？"], ["c39-013", "你不害怕吗？"], ["c39-014", "他是个，没有信用、没有怜悯的人，一看见你，就会杀了你。”"]]}, {"t": "p", "s": [["c39-015", "普里阿摩斯说：“别拦我，我是一定要去的。"], ["c39-016", "你不要，像一只，晦气的鸟，在家里，哭个不停，我要听神仙的话。"], ["c39-017", "要是我，死在了希腊人的船边，也不要紧，只要，让我抱着我的儿子，哭一场。”"]]}, {"t": "p", "s": [["c39-018", "赫卡柏一边哭，一边，倒了一杯蜜酒，让他，先向宙斯祈祷。"], ["c39-019", "老人拿着杯子，站在院子里把酒洒在地上，说：“宙斯，我的父亲，请让阿喀琉斯，可怜我，给我一个吉兆吧。”"]]}, {"t": "img", "src": "images/204.webp?v=1c3a0b7ac1", "vid": "images/204.mp4?v=8333e2b66a", "cap": "黑色的大鹰", "n": 205}, {"t": "p", "s": [["c39-020", "天上，立刻，飞来了一只，黑色的大鹰，张开了翅膀，从右边，飞向了城。"], ["c39-021", "人们，看见了，都高兴起来。"]]}, {"t": "p", "s": [["c39-022", "老国王坐上了车。"], ["c39-023", "老传令官，伊代奥斯，赶着骡车，走在前面普里阿摩斯，赶着马车，跟在后面。"]]}, {"t": "p", "s": [["c39-024", "他们驶出了城门，一路，在黑夜里，朝着希腊人的大船，慢慢地走。"]]}, {"t": "p", "s": [["c39-025", "宙斯看着他们，对赫尔墨斯，说：“你，最喜欢，给人做伴，也最会听别人说话，你去，把这个老人，一直带到阿喀琉斯的帐篷，不要让希腊人，看见他。”"]]}, {"t": "p", "s": [["c39-026", "赫尔墨斯穿上了，他的金色的凉鞋，拿起了，那根可以让人入睡、也可以让人醒来的金色手杖，变成了一个年轻的王子的样子，胡子，刚刚，开始长出来，那样青春，那样好看。"]]}, {"t": "img", "src": "images/205.webp?v=97fd579674", "vid": "images/205.mp4?v=23f1c9f774", "cap": "河边的夜", "n": 206}, {"t": "p", "s": [["c39-027", "他们走到了，伊洛斯的大坟墓前，停下来，让马和骡子，在河边，喝水。"], ["c39-028", "天已经黑了。"]]}, {"t": "p", "s": [["c39-029", "老传令官，看见了，一个人，走了过来，吓得，对普里阿摩斯，说：“国王，我们要小心，我看见，有一个人，来了，我们快逃吧，或者，我们抱着他的膝盖，求他。”"]]}, {"t": "p", "s": [["c39-030", "老国王吓得，浑身发抖，头发，一根一根，竖了起来，他一动也不敢动。"]]}, {"t": "img", "src": "images/80.webp?v=27be561859", "vid": "images/80.mp4?v=132654da02", "cap": "神使带路", "n": 207}, {"t": "p", "s": [["c39-031", "年轻人，走到了他们面前，握住了老人的手，温和地说：“老人家，这样黑的夜里，你们赶着骡马，要去哪里？"], ["c39-032", "你们不怕，被希腊人，看见吗？"], ["c39-033", "我不会伤害你们，我还会保护你们，因为，你们让我想起了我的父亲。”"]]}, {"t": "p", "s": [["c39-034", "老国王问：“孩子，你是谁？"], ["c39-035", "你的父母，是谁？”"]]}, {"t": "p", "s": [["c39-036", "赫尔墨斯说：“我是一个，听从阿喀琉斯命令的人。"], ["c39-037", "我是密耳弥冬人，我的父亲，是一个很富有的人，我有六个兄弟。”"]]}, {"t": "p", "s": [["c39-038", "老国王又问：“你告诉我，我的儿子赫克托耳，现在，在哪里？"], ["c39-039", "狗，有没有，吃了他？”"]]}, {"t": "p", "s": [["c39-040", "赫尔墨斯说：“老人家，你不用，担心狗和鸟，都没有碰过他，他躺在阿喀琉斯的帐篷前，十二天了，身体一点也没有坏，露水洗着他的伤口，伤口都已经合上了。"], ["c39-041", "神仙们，真的，很爱你的儿子。”"]]}, {"t": "p", "s": [["c39-042", "老国王听了，高兴得，流出了眼泪，他把那个漂亮的金杯，送给了年轻人想求他，把自己，带到阿喀琉斯的帐篷里。"]]}, {"t": "p", "s": [["c39-043", "赫尔墨斯笑着，说：“你不要，用礼物，来诱惑我，我不会，背着阿喀琉斯，收你的东西，那样，我会害怕的。"], ["c39-044", "可是，我可以，做你的向导，一直带你，到阿喀琉斯那里去。”"]]}, {"t": "p", "s": [["c39-045", "他一跃，跳上了战车，抓住缰绳，把鞭子，轻轻一挥，给了马和骡子，新的力量。"]]}]}, {"title": "第四十章　一位父亲的请求", "head": "c40-h", "audio": "audio/ch40.m4a?v=806f7a6b45", "duration": 413.101, "times": {"c40-h": [0.0, 3.534], "c40-001": [4.534, 8.207], "c40-002": [9.056, 13.581], "c40-003": [13.931, 21.168], "c40-004": [21.518, 31.343], "c40-005": [32.193, 34.693], "c40-006": [35.543, 47.514], "c40-007": [47.864, 57.496], "c40-008": [58.346, 63.982], "c40-009": [64.832, 75.476], "c40-010": [75.826, 84.986], "c40-011": [85.336, 97.202], "c40-012": [98.052, 102.794], "c40-013": [103.644, 108.657], "c40-014": [109.007, 111.66], "c40-015": [112.51, 119.062], "c40-016": [119.412, 122.033], "c40-017": [122.883, 135.885], "c40-018": [136.735, 140.736], "c40-019": [141.586, 145.344], "c40-020": [146.194, 161.112], "c40-021": [161.462, 168.047], "c40-022": [168.397, 177.56], "c40-023": [178.41, 181.571], "c40-024": [181.921, 191.112], "c40-025": [191.462, 198.197], "c40-026": [198.547, 206.646], "c40-027": [206.996, 215.65], "c40-028": [216.5, 223.274], "c40-029": [223.624, 236.615], "c40-030": [237.465, 243.26], "c40-031": [244.11, 247.068], "c40-032": [247.418, 253.732], "c40-033": [254.582, 256.487], "c40-034": [256.837, 262.799], "c40-035": [263.149, 275.794], "c40-036": [276.644, 299.766], "c40-037": [300.116, 302.481], "c40-038": [303.331, 310.447], "c40-039": [310.797, 317.811], "c40-040": [318.161, 324.349], "c40-041": [324.699, 334.077], "c40-042": [334.427, 341.32], "c40-043": [342.17, 350.545], "c40-044": [350.895, 359.213], "c40-045": [359.563, 366.979], "c40-046": [367.829, 369.438], "c40-047": [370.288, 380.188], "c40-048": [380.538, 387.454], "c40-049": [388.304, 392.893], "c40-050": [393.243, 399.385], "c40-051": [399.735, 405.57], "c40-052": [406.42, 411.601]}, "blocks": [{"t": "img", "src": "images/206.webp?v=8419363c6d", "vid": "images/206.mp4?v=47ec3e5db9", "cap": "大船边的城墙", "n": 208}, {"t": "p", "s": [["c40-001", "他们很快，就来到了大船边的城墙。"]]}, {"t": "p", "s": [["c40-002", "守卫们，刚刚，吃完晚饭，正准备睡觉。"], ["c40-003", "赫尔墨斯用金手杖轻轻地，点了一下，所有的守卫，都睡着了。"], ["c40-004", "他又，轻轻地，把门闩，打开，把老国王的车，赶了进去，没有一个人，发现。"]]}, {"t": "p", "s": [["c40-005", "他们走到了阿喀琉斯的帐篷前。"]]}, {"t": "img", "src": "images/207.webp?v=6ea9b33e88", "vid": "images/207.mp4?v=7f9d8e90d7", "cap": "大帐篷", "n": 209}, {"t": "p", "s": [["c40-006", "那是一座，用冷杉木，造的大帐篷，屋顶上，铺着，一层厚厚的芦苇，帐篷前，有一个又大又宽的院子。"], ["c40-007", "门闩，是一根，要三个人，才能拉开的大木头，可是，阿喀琉斯，一个人，就能拉开。"]]}, {"t": "p", "s": [["c40-008", "赫尔墨斯替老人，拉开了门，把礼物，搬进了帐篷。"]]}, {"t": "p", "s": [["c40-009", "然后，他跳下了车，对普里阿摩斯，说：“老人家，我是赫尔墨斯，是宙斯，派我来，给你领路的。"], ["c40-010", "现在，我要回去了，我不能，让阿喀琉斯，看见一个神，在凡人的面前，让他们，感到奇怪。"], ["c40-011", "你进去吧，抱着他的膝盖，请求他，想一想他的父亲、母亲、孩子，这样，你也许，能打动他的心。”"]]}, {"t": "p", "s": [["c40-012", "说完，他飞走了，像一阵，透明的风。"]]}, {"t": "p", "s": [["c40-013", "老国王跳下了车，让传令官，留在外面看着骡马。"], ["c40-014", "他一个人，走进了帐篷。"]]}, {"t": "p", "s": [["c40-015", "阿喀琉斯正坐在桌子旁刚刚吃完了饭，桌上的东西，还没有收走。"], ["c40-016", "他的两个朋友，站在旁边。"]]}, {"t": "img", "src": "images/81.webp?v=a8fb6d51ff", "vid": "images/81.mp4?v=a48d3db4d7", "cap": "一位父亲的请求", "n": 210}, {"t": "p", "s": [["c40-017", "普里阿摩斯悄悄地，走到了他的面前，伏下身，抱住了他的膝盖，吻着他的手，那一双，杀死了他那么多儿子的、可怕的手。"]]}, {"t": "p", "s": [["c40-018", "阿喀琉斯吃了一惊，抬起头，看着他。"]]}, {"t": "p", "s": [["c40-019", "他的朋友们，也都，惊得，面面相觑。"]]}, {"t": "p", "s": [["c40-020", "老国王说：“阿喀琉斯，像神仙一样的人，请你想一想，你的父亲，他和我一样的年纪，老了，正走在，通向死亡的路上。"], ["c40-021", "也许，他的邻居们，正在欺负他，没有人，能保护他。"], ["c40-022", "可是，他一听说你还活着，心里就高兴，每一天，都在盼着你，从特洛伊，回来。”"]]}, {"t": "p", "s": [["c40-023", "“可是，我真是，最不幸的人。"], ["c40-024", "我曾经有，五十个儿子，其中十九个，是我和同一个妻子生的，其他的，是别的女人生的。"], ["c40-025", "现在，他们大多数，都已经，被阿瑞斯，夺走了。"], ["c40-026", "我最好的那个儿子，保护着我们的城，保护着我们的人，前几天，被你杀死了。"], ["c40-027", "就是赫克托耳，我现在，为了他，来到你的船边，带着无数的赎金，想赎回他。”"]]}, {"t": "p", "s": [["c40-028", "“请你，敬畏神，可怜我，想一想你的父亲吧。"], ["c40-029", "我，比他更可怜，我做了一件，世界上，从来没有人做过的事，我把手，伸向了，杀死我儿子的人的嘴边。”"]]}, {"t": "p", "s": [["c40-030", "老人的话，让阿喀琉斯，一下子，想起了他自己的父亲。"]]}, {"t": "p", "s": [["c40-031", "他的心里，涌起了无比的悲伤。"], ["c40-032", "他轻轻地，握着老人的手，把他，从地上，推开了。"]]}, {"t": "img", "src": "images/82.webp?v=c8a0cb61a7", "vid": "images/82.mp4?v=3eeee2fb49", "cap": "一起哭泣", "n": 211}, {"t": "p", "s": [["c40-033", "两个人，坐了下来。"], ["c40-034", "普里阿摩斯为他的儿子，哭泣，蜷缩在阿喀琉斯的脚边。"], ["c40-035", "阿喀琉斯一会儿，为自己的父亲，哭泣，一会儿，为帕特洛克罗斯，哭泣，哭声，在整个帐篷里，回荡。"]]}, {"t": "p", "s": [["c40-036", "等他们，哭够了，阿喀琉斯，从椅子上，站起来，扶着老人的手，把他扶了起来，同情地，看着老人的白头发和白胡子，说：“可怜的人，你经历了太多的苦难，你怎么有勇气，一个人，来到希腊人的船边，来到那个，杀了你那么多儿子的人的面前？"], ["c40-037", "你的心，是铁做的啊。”"]]}, {"t": "img", "src": "images/208.webp?v=4058b8dda1", "vid": "images/208.mp4?v=c7cb0e730d", "cap": "拉着老人", "n": 212}, {"t": "p", "s": [["c40-038", "他说：“来，坐下吧，让我们，把心里的悲伤，放一放，哭是没有用的。"], ["c40-039", "神仙，给了可怜的凡人，一份要受苦的命运，他们自己，却过着，没有忧愁的生活。"], ["c40-040", "宙斯的门口，有两个坛子，一个装着，坏的命运，一个装着好的。"], ["c40-041", "要是，他把两个混在一起，给一个人，那个人，有时候，运气好，有时候，运气坏。"], ["c40-042", "要是，只给了他，坏的，他就会，被饥饿，赶得在大地上，到处流浪。”"]]}, {"t": "p", "s": [["c40-043", "“我的父亲，珀琉斯，神仙给了他许多，好的东西，可是，只有一个儿子，还那么短命。"], ["c40-044", "我，不能留在家里，照顾他，却坐在这里，在特洛伊，给你和你的孩子们，带来了痛苦。"], ["c40-045", "你，也一样，从前，你也富有、幸福，现在，却在战争里，受着苦。”"]]}, {"t": "p", "s": [["c40-046", "“坐下吧，不要再哭了。”"]]}, {"t": "p", "s": [["c40-047", "普里阿摩斯说：“不，我现在，不能坐下，在赫克托耳，躺在你的帐篷里，没有人管他的时候。"], ["c40-048", "请你，把他还给我，让我亲眼看他一眼，收下赎金吧。”"]]}, {"t": "p", "s": [["c40-049", "阿喀琉斯看着他，说：“老人家，别再让我生气了。"], ["c40-050", "我已经，决定要把赫克托耳还给你，是宙斯，派我的母亲，来告诉我的。"], ["c40-051", "我知道，你是被神仙，带来的，没有一个凡人，敢到我们的营地里来。”"]]}, {"t": "p", "s": [["c40-052", "说完，他走出了帐篷，像一头狮子，跳了出去。"]]}]}, {"title": "第四十一章　赫克托耳回家了", "head": "c41-h", "audio": "audio/ch41.m4a?v=c4bc9449f3", "duration": 371.704, "times": {"c41-h": [0.0, 3.633], "c41-001": [4.633, 9.633], "c41-002": [10.483, 25.115], "c41-003": [25.465, 36.355], "c41-004": [37.205, 48.853], "c41-005": [49.203, 61.886], "c41-006": [62.736, 74.101], "c41-007": [74.951, 89.104], "c41-008": [89.454, 95.39], "c41-009": [96.24, 109.313], "c41-010": [109.663, 111.739], "c41-011": [112.089, 119.159], "c41-012": [120.009, 130.938], "c41-013": [131.788, 132.987], "c41-014": [133.837, 138.858], "c41-015": [139.208, 144.846], "c41-016": [145.196, 153.882], "c41-017": [154.732, 157.374], "c41-018": [158.224, 162.741], "c41-019": [163.091, 174.135], "c41-020": [174.485, 178.854], "c41-021": [179.704, 189.464], "c41-022": [190.314, 205.439], "c41-023": [205.789, 212.3], "c41-024": [213.15, 221.95], "c41-025": [222.3, 242.134], "c41-026": [242.984, 250.23], "c41-027": [251.08, 255.472], "c41-028": [256.322, 259.767], "c41-029": [260.117, 267.372], "c41-030": [268.222, 273.875], "c41-031": [274.725, 284.827], "c41-032": [285.177, 293.673], "c41-033": [294.023, 295.971], "c41-034": [296.821, 299.985], "c41-035": [300.835, 309.38], "c41-036": [309.73, 317.822], "c41-037": [318.672, 322.911], "c41-038": [323.761, 330.189], "c41-039": [330.539, 337.923], "c41-040": [338.273, 346.992], "c41-041": [347.342, 358.759], "c41-042": [359.609, 365.134], "c41-043": [365.984, 370.204]}, "blocks": [{"t": "p", "s": [["c41-001", "阿喀琉斯走出了帐篷，他的两个朋友，也跟着走了出来。"]]}, {"t": "p", "s": [["c41-002", "他们把骡子和马，从车上，解了下来，把老传令官，请进了帐篷，让他坐下，又把普里阿摩斯，带来的赎金，一件一件，从车上，搬了下来。"], ["c41-003", "只留下了两件披风，和一件漂亮的外衣，用来，盖住赫克托耳的尸体，让他，体面地，回到他的家乡。"]]}, {"t": "p", "s": [["c41-004", "阿喀琉斯叫女仆们，把赫克托耳的尸体，抬到旁边，洗干净，涂上油，再穿上，那件，漂亮的外衣。"], ["c41-005", "他怕，老国王一看见，心里，一时忍不住，对他生气，那样，他也许，会一下子，忘了宙斯的命令，杀了老人。"]]}, {"t": "img", "src": "images/209.webp?v=14153cfe8e", "vid": "images/209.mp4?v=a6c2bda89e", "cap": "抱起赫克托耳", "n": 213}, {"t": "p", "s": [["c41-006", "他自己，亲手，把赫克托耳，抱了起来，放在了床上朋友们，帮着他，把床，抬上了车。"]]}, {"t": "p", "s": [["c41-007", "他一边，放，一边，轻轻地，对帕特洛克罗斯，说：“我的朋友，请你不要生我的气，我已经，把赫克托耳，还给了他的父亲，宙斯让我这样做的。"], ["c41-008", "他给了我，很多的赎金，我也会，把属于你的那一份，分给你。”"]]}, {"t": "p", "s": [["c41-009", "他回到帐篷里，坐回了原来的椅子上，对老人说：“老人家，你的儿子，已经按你的要求，还给了你，他躺在床上，天一亮，你就可以带走他。"], ["c41-010", "现在，我们一起吃饭吧。"], ["c41-011", "就连，头发漂亮的尼奥柏，也吃过饭，虽然，她的十二个孩子，都死在了宫里。”"]]}, {"t": "p", "s": [["c41-012", "他宰了一只，白色的羊，他的朋友们，把羊，剥了皮，切成了小块，烤熟了，放在篮子里端了出来。"]]}, {"t": "img", "src": "images/83.webp?v=043f2ea98d", "vid": "images/83.mp4?v=607b63e819", "cap": "一起吃饭", "n": 214}, {"t": "p", "s": [["c41-013", "他们一起吃了饭。"]]}, {"t": "p", "s": [["c41-014", "吃完了饭，普里阿摩斯，静静地，看着阿喀琉斯。"], ["c41-015", "他觉得，他是多么高大，多么英俊，像一位神仙。"], ["c41-016", "阿喀琉斯也静静地，看着普里阿摩斯，惊叹着，他那高贵的样子，和说话的声音。"]]}, {"t": "p", "s": [["c41-017", "他们互相，看了很久。"]]}, {"t": "p", "s": [["c41-018", "终于，老国王，说：“请你，让我躺下吧。"], ["c41-019", "自从，我的儿子，死在你的手里，我的眼睛里，就没有睡着过，我一直，在院子里，滚在泥土里，哭泣。"], ["c41-020", "直到现在，我才吃了一口饭，喝了一口酒。”"]]}, {"t": "img", "src": "images/210.webp?v=0a6cd3560b", "vid": "images/210.mp4?v=f4eee8ee9d", "cap": "铺床", "n": 215}, {"t": "p", "s": [["c41-021", "阿喀琉斯让他的女仆们，在门廊下，铺好了床，铺上紫色的毯子，盖上了软软的羊毛披风。"]]}, {"t": "p", "s": [["c41-022", "他对老人，说：“亲爱的老人家，请你睡在外面吧，因为，这里常常有希腊人的长官，来找我商量事情，要是，他们看见了你，会告诉阿伽门农，那样就会耽误你，赎回尸体的事。"], ["c41-023", "你，告诉我，你需要，几天来办你儿子的葬礼，我会停战，让大家，都不去打仗。”"]]}, {"t": "p", "s": [["c41-024", "普里阿摩斯说：“要是你，真的愿意，让我好好办完他的葬礼，那就请你，这样做吧。"], ["c41-025", "你知道，我们被围在城里，要去，山里砍柴，我们需要，九天来哭他，第十天，埋葬他，大家聚在一起，吃饭第十一天，为他堆一座坟，第十二天，要是必须打，我们再打。”"]]}, {"t": "p", "s": [["c41-026", "阿喀琉斯说：“好，老国王，我一定，按你说的办，让战争，停十二天。”"]]}, {"t": "p", "s": [["c41-027", "他握着老人的手腕，向他保证，让他，不要害怕。"]]}, {"t": "p", "s": [["c41-028", "老国王和传令官，就睡在了门廊下。"], ["c41-029", "阿喀琉斯睡在帐篷最里面的那张床上，他的身边，睡着美丽的布里塞伊斯。"]]}, {"t": "p", "s": [["c41-030", "神仙们和别的人，都睡了，只有赫尔墨斯，没有睡。"]]}, {"t": "img", "src": "images/211.webp?v=51163d70c5", "vid": "images/211.mp4?v=e5a9fc073e", "cap": "深夜的提醒", "n": 216}, {"t": "p", "s": [["c41-031", "他站在老国王的床前，轻轻地，对他说：“老人家，你睡得这样香，可是，你的周围，到处都是敌人。"], ["c41-032", "要是阿伽门农，知道了，你在这里，你的孩子们，就要用三倍的赎金，来赎你了。"], ["c41-033", "快起来，我带你回去。”"]]}, {"t": "p", "s": [["c41-034", "老人吓得，一下子，醒了。"]]}, {"t": "p", "s": [["c41-035", "赫尔墨斯帮着他们，套好了马和骡子，轻轻地，驾着车，穿过营地，没有一个人，发现。"], ["c41-036", "他们一直走到，那条大河的边上，赫尔墨斯，才对他们挥了挥手，飞回了奥林匹斯山。"]]}, {"t": "p", "s": [["c41-037", "东边的天空，慢慢地，亮了。"]]}, {"t": "img", "src": "images/84.webp?v=c98312ec49", "vid": "images/84.mp4?v=ed8d1d8ba0", "cap": "赫克托耳回家", "n": 217}, {"t": "p", "s": [["c41-038", "在特洛伊的城墙上，一个年轻的姑娘，看见了远处，那辆熟悉的车。"], ["c41-039", "她是普里阿摩斯的女儿，卡珊德拉，长得，像金色的阿芙洛狄忒一样美。"], ["c41-040", "她站在最高的城楼上，大声喊：“特洛伊人，特洛伊的男人和女人们，你们快来看，赫克托耳回来了！"], ["c41-041", "你们曾经，在他活着的时候，在他从战场上，回来的时候，那样高兴地迎接他，来吧，来迎接他吧，他曾是特洛伊，所有人的骄傲。”"]]}, {"t": "p", "s": [["c41-042", "全城的人，都涌向了城门没有一个人，留在家里。"]]}, {"t": "p", "s": [["c41-043", "他们在城门口遇到了，载着赫克托耳尸体的车。"]]}]}, {"title": "第四十二章　最后的告别", "head": "c42-h", "audio": "audio/ch42.m4a?v=992cf2b3ec", "duration": 434.395, "times": {"c42-h": [0.0, 3.196], "c42-001": [4.196, 8.585], "c42-002": [9.435, 18.648], "c42-003": [19.498, 25.024], "c42-004": [25.374, 29.723], "c42-005": [30.573, 32.674], "c42-006": [33.524, 47.694], "c42-007": [48.544, 52.784], "c42-008": [53.634, 63.453], "c42-009": [63.803, 71.616], "c42-010": [71.966, 89.891], "c42-011": [90.741, 98.427], "c42-012": [99.277, 101.922], "c42-013": [102.772, 115.179], "c42-014": [115.529, 128.263], "c42-015": [129.113, 137.237], "c42-016": [137.587, 143.293], "c42-017": [143.643, 154.192], "c42-018": [154.542, 158.687], "c42-019": [159.037, 167.378], "c42-020": [168.228, 174.991], "c42-021": [175.841, 194.209], "c42-022": [195.059, 203.184], "c42-023": [204.034, 212.943], "c42-024": [213.793, 217.54], "c42-025": [217.89, 245.686], "c42-026": [246.536, 252.227], "c42-027": [253.077, 266.332], "c42-028": [267.182, 271.798], "c42-029": [272.648, 290.046], "c42-030": [290.896, 293.157], "c42-031": [294.007, 298.917], "c42-032": [299.767, 314.33], "c42-033": [315.18, 332.431], "c42-034": [333.281, 346.39], "c42-035": [347.24, 350.313], "c42-036": [350.663, 359.072], "c42-037": [359.422, 365.066], "c42-038": [365.916, 378.281], "c42-039": [378.631, 383.494], "song-theme": [384.694, 390.114], "song-theme-01": [390.114, 393.994], "song-theme-02": [394.694, 398.954], "song-theme-03": [399.674, 404.234], "song-theme-04": [404.234, 408.834], "song-theme-05": [411.494, 415.594], "song-theme-06": [415.854, 420.514], "song-theme-07": [421.234, 425.634], "c42-040": [431.834, 432.895]}, "blocks": [{"t": "img", "src": "images/85.webp?v=cf5c02e40f", "vid": "images/85.mp4?v=2e8bc5bf1a", "cap": "最后的告别", "n": 218}, {"t": "p", "s": [["c42-001", "安德洛玛刻和赫卡柏，是第一批，跑到车边的人。"]]}, {"t": "p", "s": [["c42-002", "她们抱着赫克托耳的头，哭得，那么伤心，周围的人，也跟着一起，流泪。"]]}, {"t": "p", "s": [["c42-003", "普里阿摩斯对大家，说：“让开路，让骡车，进城去。"], ["c42-004", "等把他，带回了家，你们再哭个够吧。”"]]}, {"t": "p", "s": [["c42-005", "人们，让开了路。"]]}, {"t": "p", "s": [["c42-006", "他们把赫克托耳，抬进了王宫，放在一张雕花的床上，旁边，请来了歌手，唱起了，悲伤的歌，女人们，在旁边，哭泣。"]]}, {"t": "p", "s": [["c42-007", "第一个，开口说话的，是安德洛玛刻。"]]}, {"t": "img", "src": "images/212.webp?v=b8e7166cdf", "vid": "images/212.mp4?v=b36d615f64", "cap": "哀歌", "n": 219}, {"t": "p", "s": [["c42-008", "她抱着丈夫的头，说：“我的丈夫，你年纪轻轻的，就离开了我，留下我，一个人，做寡妇，留下我们，才这么小的孩子。"], ["c42-009", "我，再也看不到你了，你也再也不能，用你的手，抱着他，不能把你的话，对他说了。"], ["c42-010", "我们的城，被攻破以后，他会被带走，在一个，我不知道的地方，做苦工，也许，有一个希腊人，会抓着他的手，把他从城墙上，扔下去，那是为了，替他的哥哥、他的父亲，报仇因为，你曾经，杀死过他们。”"]]}, {"t": "p", "s": [["c42-011", "“在你的家里，你没有给我，留下一句，要紧的话，一句让我，夜里想起来，就会流泪的话。”"]]}, {"t": "p", "s": [["c42-012", "她哭得，说不下去了。"]]}, {"t": "p", "s": [["c42-013", "第二个，是老王后赫卡柏，她说：“赫克托耳，我的孩子，是所有的儿子里，我最爱的一个，神仙们，也爱你。"], ["c42-014", "你死了，还是这样的新鲜，像露水，刚刚洗过一样，你躺在这里，好像一个，刚刚被阿波罗，用银弓，温柔地，射中的人。”"]]}, {"t": "img", "src": "images/213.webp?v=bf83fa3289", "vid": "images/213.mp4?v=c5447f1c6a", "cap": "海伦的哀伤", "n": 220}, {"t": "p", "s": [["c42-015", "第三个，是海伦，她，哭着，说：“赫克托耳，在所有的大伯子中，你是，我最爱的。"], ["c42-016", "当年，是帕里斯，把我带到这里来，从那时起，已经有二十年了。"], ["c42-017", "我，从来没有，听过你一句，难听的话，别人要是骂我，你总是，劝他们，用你温和的话，把他们，制止了。"], ["c42-018", "所以，我为你，也为我自己，哭。"], ["c42-019", "在整个，特洛伊，再也没有，一个人，对我友好，所有的人，一见我，都会感到害怕。”"]]}, {"t": "p", "s": [["c42-020", "她哭得，那样伤心，周围所有的人，也都，跟着，哭了。"]]}, {"t": "p", "s": [["c42-021", "最后，老国王，普里阿摩斯，对特洛伊人，说：“特洛伊人，去，砍柴运进城里来吧，不要怕希腊人，设埋伏，阿喀琉斯，已经答应了我，十二天，不会向我们进攻。”"]]}, {"t": "img", "src": "images/214.webp?v=7d4c69e1a1", "vid": "images/214.mp4?v=1d499ffd0d", "cap": "运来木柴", "n": 221}, {"t": "p", "s": [["c42-022", "人们，套上了骡子和牛，一连九天，去山里，砍了很多的柴，运回了城里。"]]}, {"t": "p", "s": [["c42-023", "第十天的早上，天一亮，人们，哭着，把赫克托耳，抬到了柴堆上，点起了火。"]]}, {"t": "img", "src": "images/86.webp?v=ce75e760e9", "vid": "images/86.mp4?v=b31a00e720", "cap": "赫克托耳的坟", "n": 222}, {"t": "p", "s": [["c42-024", "第十一天，火，慢慢地，熄了。"], ["c42-025", "人们，用酒，浇灭了余火，赫克托耳的兄弟和朋友们，一起，一边哭，一边，把他的白骨，收了起来，放进了，一只金子做的瓶子，用紫色的软布，盖好，轻轻地，放进了，一个，深深的坑里，上面，用石头，一块一块，垒好了，又堆起了，一座高高的坟。"]]}, {"t": "p", "s": [["c42-026", "坟的四周，派了，守卫，怕希腊人，突然进攻。"]]}, {"t": "p", "s": [["c42-027", "人们，聚在了一起在普里阿摩斯的王宫里，办了一场，盛大的宴会，大家，一起，吃着，喝着，想着赫克托耳。"]]}, {"t": "p", "s": [["c42-028", "特洛伊人就这样，埋葬了，驯马的赫克托耳。"]]}, {"t": "p", "s": [["c42-029", "这时，在海的另一边，大船的帐篷里，阿喀琉斯，一个人，坐着，听着海浪，想着，老国王，说的话，也想着自己的朋友，想着，母亲，对他说过的，他的命运。"]]}, {"t": "p", "s": [["c42-030", "战争，还没有结束。"]]}, {"t": "p", "s": [["c42-031", "特洛伊的城墙，还是，那样高，那样灰。"]]}, {"t": "p", "s": [["c42-032", "可是，在这十二天里，一个老人，和一个年轻的英雄，坐在同一张桌子边，一起，哭，一起，吃饭，一起，想着，自己的父亲。"]]}, {"t": "p", "s": [["c42-033", "后来的人，讲起这个故事的时候，总是，会讲起，这一晚，因为，在最厉害的仇恨里，也有一点点，比仇恨更大的东西，那就是，人和人之间的，同情。"]]}, {"t": "p", "s": [["c42-034", "至于，这座高高的城墙，最后，是怎么被攻破的要用一匹大木马，才讲得完，那是另外一个，故事了，那个故事，就在《奥德赛》里。"]]}, {"t": "p", "s": [["c42-035", "城里的钟声，一下一下地响着。"], ["c42-036", "孩子们被大人牵着手，一个接一个地，走到了坟前，把小小的白色野花，轻轻地放在石头上。"], ["c42-037", "风一吹，那些花瓣，便在坟的四周，慢慢地飘了起来。"]]}, {"t": "img", "src": "images/215.webp?v=4163d814f0", "vid": "images/215.mp4?v=e0a43a695a", "cap": "牧羊人的故事", "n": 223}, {"t": "p", "s": [["c42-038", "很多年以后，当地的牧羊人，常常指着那座坟，对孩子们说：“看，那里睡着一位英雄，他不是最凶的人，可是他，最爱自己的家。”"], ["c42-039", "孩子们，睁大了眼睛，听得，入了神。"]]}, {"t": "song", "title": "特洛伊的歌", "head": "song-theme", "lines": [["song-theme-01", "金苹果滚进了婚礼的大厅"], ["song-theme-02", "高高的城墙，黑黑的船"], ["song-theme-03", "十年的战争，谁也不肯放手"], ["song-theme-04", "老国王的夜路，轻轻握住了手"], ["song-theme-05", "勇敢的人，也会流泪"], ["song-theme-06", "放下刀剑，才是最大的光"], ["song-theme-07", "愿天下的孩子，都能平安回家"]]}, {"t": "p", "s": [["c42-040", "（完）"]]}]}], "music": 3, "images": [{"from": "c01-h", "src": "images/01.webp?v=3cca79a730", "vid": "images/01.mp4?v=5cb00df9b4", "cap": "奥林匹斯山的婚礼", "n": 1}, {"from": "c01-013", "src": "images/87.webp?v=f6a89e6821", "vid": "images/87.mp4?v=1d23bbcc77", "cap": "不请自来的女神", "n": 2}, {"from": "c01-018", "src": "images/02.webp?v=8ce4c3b338", "vid": "images/02.mp4?v=7c42632977", "cap": "金苹果", "n": 3}, {"from": "c01-037", "src": "images/88.webp?v=0e79b6cf37", "vid": "images/88.mp4?v=dc5ba5610d", "cap": "山坡上的牧羊人", "n": 4}, {"from": "c01-045", "src": "images/03.webp?v=315d8c8eca", "vid": "images/03.mp4?v=1521bd7894", "cap": "牧羊人的选择", "n": 5}, {"from": "c01-061", "src": "images/89.webp?v=d83442ef0a", "vid": "images/89.mp4?v=1ebfa78848", "cap": "最美的女人", "n": 6}, {"from": "c01-068", "src": "images/90.webp?v=17552ebfc2", "vid": "images/90.mp4?v=98171b1054", "cap": "悄悄起航", "n": 7}, {"from": "c02-h", "src": "images/04.webp?v=3751c71e6b", "vid": "images/04.mp4?v=30399088e2", "cap": "海伦不见了", "n": 8}, {"from": "c02-010", "src": "images/91.webp?v=dbfc88ff47", "vid": "images/91.mp4?v=435ea3a2d8", "cap": "连夜赶路", "n": 9}, {"from": "c02-023", "src": "images/06.webp?v=d74db9ed3e", "vid": "images/06.mp4?v=0f829882b5", "cap": "犁沙滩的国王", "n": 10}, {"from": "c02-041", "src": "images/92.webp?v=0f0d773420", "vid": "images/92.mp4?v=aef07bfeef", "cap": "闪亮的铠甲", "n": 11}, {"from": "c02-046", "src": "images   audio.currentTime = t;
  sync(true);
  if (autoplay) { try { await audio.play(); } catch (e) { toast('点击播放按钮开始朗读'); } }
}
const playLine = (L, autoplay = true) => playFrom(L.ch, L.start + 0.001, autoplay);

function lineAt(ci, t) {
  // 找本章里开始时间 ≤ t 的最后一句
  let best = null;
  for (const L of lines) {
    if (L.ch !== ci) { if (best) break; continue; }
    if (L.start <= t + 0.03) best = L; else break;
  }
  return best;
}

function setActive(L, force) {
  if (L === active && !force) return;
  if (active) active.el.classList.remove('on');
  active = L;
  if (!L) return;
  L.el.classList.add('on');
  const idx = lines.indexOf(L);
  lines.forEach((x, i) => x.el.classList.toggle('past', i < idx));
  const ch = BOOK.chapters[L.ch];
  $('#nowTitle').textContent = plIdx >= 0 ? `♪ ${plIdx + 1}/${songs.length} ${songs[plIdx].title}` : ch.title.replace('　', ' ');
  if (mode !== 'read') showStage(L.img);   // 阅读模式不用舞台，免得在后台加载动图
  setSubtitle(L);
  if (follow && mode !== 'picture' && (force || Date.now() - userScrollAt > 5000)) {
    const r = L.el.getBoundingClientRect();
    const vh = window.innerHeight;
    if (r.top < vh * 0.18 || r.bottom > vh * 0.62) {
      programmatic = Date.now();
      window.scrollBy({ top: r.top - vh * 0.32, behavior: 'smooth' });
    }
  }
}

function sync(force) {
  if (cur < 0) return;
  const t = audio.currentTime;
  const s = songs[plIdx];
  if (s && playing && cur === s.ch && t >= s.end - 0.05) return playSong(plIdx + 1);   // 这首唱完了，接下一首
  setActive(lineAt(cur, t), force);
  if (!seeking) $('#seek').value = t;
  $('#nowTime').textContent = `${buffering ? '加载中… ' : ''}${fmt(t)} / ${fmt(BOOK.chapters[cur].duration)}`;
  paintSeek();
}

// ---------- 弱网：显示下载进度、缓冲提示、预先加载下一章、出错重试 ----------
const SEEK_PLAYED = 'var(--sea)', SEEK_BUF = 'color-mix(in srgb, var(--sea) 50%, var(--line))';
let buffering = false, retry = null, prefetched = new Set();
function paintSeek() {
  const seek = $('#seek');
  const d = cur < 0 ? 0 : (audio.duration || BOOK.chapters[cur].duration);
  if (!d) { seek.style.setProperty('--seek-bg', 'var(--line)'); return; }
  const pc = x => (Math.min(1, Math.max(0, x / d)) * 100).toFixed(2) + '%';
  const p = pc(+seek.value), stops = [];
  for (let i = 0; i < audio.buffered.length; i++) {
    const a = pc(audio.buffered.start(i)), b = pc(audio.buffered.end(i));
    stops.push(`transparent ${a}`, `${SEEK_BUF} ${a}`, `${SEEK_BUF} ${b}`, `transparent ${b}`);
  }
  const buf = stops.length ? `linear-gradient(to right, ${stops.join(', ')}), ` : '';
  seek.style.setProperty('--seek-bg', `linear-gradient(to right, ${SEEK_PLAYED} ${p}, transparent ${p}), ${buf}var(--line)`);
}
function setBuffering(on) {
  if (buffering === on) return;
  buffering = on;
  document.body.classList.toggle('buffering', on);
  if (cur >= 0) sync(false);
}
audio.addEventListener('waiting', () => setBuffering(true));
['playing', 'canplay', 'pause'].forEach(ev => audio.addEventListener(ev, () => setBuffering(false)));
audio.addEventListener('progress', () => {
  paintSeek();
  // 这一章下载完了而且正在听：提前把下一章拉进浏览器缓存（地址带内容指纹、长期缓存），换章时不用再等
  const next = BOOK.chapters[cur + 1], b = audio.buffered, d = audio.duration;
  if (!playing || !next || prefetched.has(next.audio) || !b.length || !(b.end(b.length - 1) >= d - 0.5)) return;
  if (navigator.connection && navigator.connection.saveData) return;
  prefetched.add(next.audio);
  fetch(next.audio, { priority: 'low' }).then(r => r.blob()).catch(() => {});   // 只试一次，失败了到时照常边下边放
});
audio.addEventListener('error', () => {
  if (cur < 0) return;
  setBuffering(false);
  retry = { ch: cur, t: audio.currentTime };   // 再点播放时从断开的地方重新加载
  cur = -1;
  toast('网络不太好，音频没加载出来，点播放键重试');
});

let raf = 0;
function loop() { sync(false); raf = requestAnimationFrame(loop); }
audio.addEventListener('play', () => { playing = true; document.body.classList.add('playing'); story.classList.add('reading'); renderPlay(); cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause', () => { playing = false; document.body.classList.remove('playing'); renderPlay(); cancelAnimationFrame(raf); sync(false); savePos(); });
audio.addEventListener('ended', () => {
  if (plIdx >= 0) playSong(plIdx + 1);   // 插曲在章末：这章放完就是这首唱完了
  else if (cur < BOOK.chapters.length - 1) playFrom(cur + 1, 0);
  else { toast('故事讲完啦，晚安 🌙'); setActive(null); localStorage.removeItem(POS_KEY); }
});

function renderPlay() {
  $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $('#playBtn').setAttribute('aria-label', playing ? '暂停' : '播放');
}
renderPlay();

function toggle() {
  if (cur < 0) { const p = retry || readPos(); retry = null; return p ? playFrom(p.ch, p.t) : playFrom(0, 0); }
  playing ? audio.pause() : audio.play();
}
function step(d) {
  const i = active ? lines.indexOf(active) : -1;
  // 上一句：如果当前句已读了 1.5 秒以上，先回到本句开头
  if (d < 0 && active && audio.currentTime - active.start > 1.5) return playLine(active, playing || cur < 0);
  const L = lines[Math.min(lines.length - 1, Math.max(0, i + d))];
  if (L) playLine(L, true);
}
function chapterJump(d) {
  if (plIdx >= 0) return playSong(Math.min(songs.length - 1, plIdx + d));   // 欣赏插曲时，上一章 / 下一章换成上一首 / 下一首
  const ci = Math.min(BOOK.chapters.length - 1, Math.max(0, (cur < 0 ? 0 : cur) + d));
  playFrom(ci, 0);
}

// ---------- 交互 ----------
$('#playBtn').onclick = toggle;
$('#prevS').onclick = () => step(-1);
$('#nextS').onclick = () => step(1);
$('#prevCh').onclick = () => chapterJump(-1);
$('#nextCh').onclick = () => chapterJump(1);
$('#startBtn').onclick = () => { stopSongs(); playFrom(0, 0); };
$('#tocBtn').onclick = () => {
  if (mode === 'picture') setMode('read', true);   // 纯图模式没有目录，先回到阅读模式
  $('.toc').scrollIntoView({ behavior: 'smooth' });
};
story.addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) { stopSongs(); playLine(byId[el.dataset.id], true); userScrollAt = 0; return; }
  const pic = e.target.closest('figure .pic'), img = pic && pic.querySelector('img');
  if (img) { const lb = $('#lightbox'); lb.querySelector('img').src = img.src; lb.querySelector('p').textContent = img.alt; lb.classList.add('open'); }
});
$('#lightbox').onclick = () => $('#lightbox').classList.remove('open');
$('#toc').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ci = +b.dataset.ch;
  stopSongs(); playFrom(ci, 0);
  document.getElementById('ch' + (ci + 1)).scrollIntoView({ behavior: 'smooth' });
});
$('#speedBtn').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  $('#speedBtn').textContent = SPEEDS[speedIdx].toFixed(1) + '×';
};
$('#followBtn').onclick = () => {
  follow = !follow;
  $('#followBtn').setAttribute('aria-pressed', follow);
  toast(follow ? '跟读：自动翻到正在读的地方' : '跟读已关闭，可以自由翻看');
  if (follow && active) setActive(active, true);
};
// ---------- 显示模式：阅读 / 左图右文（宽屏才有）/ 纯图 ----------
const MODES = { read: '阅读', split: '左图右文', picture: '纯图' };
const wide = matchMedia('(min-width: 900px)');
let mode = 'read', stageIdx = -1, stageLayer = 0;
$('#stageVid').onplaying = () => $('#stageVid').classList.add('show');
function showStage(i, force) {
  if (i === stageIdx && !force) return;
  stageIdx = i;
  const im = imgs[i];
  const layers = document.querySelectorAll('#stage img');
  const next = layers[stageLayer ^= 1], prev = layers[stageLayer ^ 1];
  next.onload = () => { next.classList.add('show'); prev.classList.remove('show'); };
  next.src = im.src;
  if (imgs[i + 1]) new Image().src = imgs[i + 1].src;   // 顺手预载下一张，念到时直接换上
  next.alt = im.cap;
  // 动图短片盖在静态图上，开始播放再淡入；阅读模式看不见舞台，不播
  const v = $('#stageVid');
  v.classList.remove('show');
  if (anim && im.vid && mode !== 'read') { v.src = im.vid; v.play().catch(() => {}); }
  else if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
  $('#stageBg').style.backgroundImage = `url("${im.src}")`;
  $('#stageCap').textContent = `插图 ${im.n} · ${im.cap}`;
  $('#stageTop').textContent = BOOK.chapters[(active || {}).ch ?? im.ch].title.replace('　', ' ');
}
// 字幕换句时先淡出再换字，免得两句文字跳动
let subT = 0;
function setSubtitle(L) {
  const sub = $('#stageSub');
  const text = !L ? '' : L.el.tagName === 'H2' ? BOOK.chapters[L.ch].title.replace('　', ' ')
    : L.el.tagName === 'H3' ? '♪ ' + L.el.textContent : L.el.closest('.song') ? '♪ ' + L.el.textContent + ' ♪' : L.el.textContent;
  if (sub.dataset.text === text) return;
  sub.dataset.text = text;
  sub.classList.add('fade');
  clearTimeout(subT);
  subT = setTimeout(() => { sub.textContent = text; sub.classList.remove('fade'); }, 180);
}
function setMode(m, quiet) {
  if (m === 'split' && !wide.matches) m = 'read';
  mode = m;
  document.body.dataset.mode = m;
  $('#modeBtn').textContent = MODES[m];
  try { localStorage.setItem(PREF + 'mode', m); } catch (e) {}
  showStage(active ? active.img : Math.max(0, stageIdx), true);
  if (m !== 'picture' && active) setTimeout(() => setActive(active, true), 30);
  if (!quiet) toast('显示模式：' + MODES[m] + (m === 'picture' ? '（点画面播放 / 暂停）' : ''));
}
$('#modeBtn').onclick = () => {
  const order = wide.matches ? ['read', 'split', 'picture'] : ['read', 'picture'];
  setMode(order[(order.indexOf(mode) + 1) % order.length]);
};
wide.addEventListener('change', () => { if (mode === 'split' && !wide.matches) setMode('read', true); });
$('#stage').onclick = () => { if (mode === 'picture') toggle(); };
$('#stagePlay').onclick = e => { e.stopPropagation(); toggle(); };
// 舞台的底边贴着播放条
new ResizeObserver(() => document.documentElement.style.setProperty('--ph', $('#player').offsetHeight + 'px')).observe($('#player'));
try { setMode(localStorage.getItem(PREF + 'mode') || 'read', true); } catch (e) { setMode('read', true); }

function renderAnim() {
  $('#animBtn').setAttribute('aria-pressed', anim);
  document.querySelectorAll('figure video').forEach(v => {
    if (anim) { vio.unobserve(v); vio.observe(v); }   // 重新观察会立即回调一次，看得见的接着播
    else { v.pause(); v.classList.remove('on'); }
  });
  if (stageIdx >= 0) showStage(stageIdx, true);
}
$('#animBtn').onclick = () => {
  anim = !anim;
  try { localStorage.setItem(PREF + 'anim', anim ? 'on' : 'off'); } catch (e) {}
  renderAnim();
  toast(anim ? '插图：动图' : '插图：静态图');
};
renderAnim();
$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(PREF + 'theme', root.dataset.theme); } catch (e) {}
};
try { const th = localStorage.getItem(PREF + 'theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; if (cur < 0) return; audio.currentTime = +$('#seek').value; sync(true); });
$('#seek').addEventListener('change', () => { seeking = false; });
if (cur < 0) $('#seek').addEventListener('pointerdown', () => { if (cur < 0) loadChapter(0); }, { once: true });

// 用户自己滚动页面时，暂停自动跟读 5 秒
let programmatic = 0;
['wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => { userScrollAt = Date.now(); }, { passive: true }));
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Escape') $('#lightbox').classList.remove('open');
});

// ---------- 记住上次听到哪里 ----------
function savePos() { if (cur < 0) return; try { localStorage.setItem(POS_KEY, JSON.stringify({ ch: cur, t: audio.currentTime, id: active && active.id })); } catch (e) {} }
function readPos() { try { const p = JSON.parse(localStorage.getItem(POS_KEY)); return p && p.ch >= 0 && p.ch < BOOK.chapters.length ? p : null; } catch (e) { return null; } }
setInterval(() => { if (playing) savePos(); }, 3000);
const last = readPos();
if (last && (last.ch > 0 || last.t > 5)) {
  const rb = $('#resumeBtn');
  rb.hidden = false;
  rb.textContent = `继续听 · ${BOOK.chapters[last.ch].title.split('　')[0]} ${fmt(last.t)}`;
  rb.onclick = () => {
    stopSongs();
    const L = last.id && byId[last.id];
    L ? playLine(L) : playFrom(last.ch, last.t);
    if (L) setTimeout(() => setActive(L, true), 50);
  };
}
$('#nowTitle').textContent = '点击任意一句，就从那里开始听';

// ---------- 锁屏 / 耳机控制 ----------
function updateMedia() {
  if (!('mediaSession' in navigator) || cur < 0) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: plIdx >= 0 ? songs[plIdx].title : BOOK.chapters[cur].title.replace('　', ' '), artist: BOOK.voice, album: BOOK.title,
    artwork: [{ src: BOOK.cover, sizes: '1152x768', type: 'image/webp' }]
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => chapterJump(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => chapterJump(1));
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
</script>
</body>
</html>
