<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 24px; }
.versions a, .versions span { font-size: 13px; padding: 5px 14px; border-radius: 999px; color: #fff; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, .5); background: rgba(8, 25, 40, .3); }
.versions a:hover { background: rgba(8, 25, 40, .55); }
.versions[hidden] { display: none; }
.versions .on { background: #fff; color: #123f55; border-color: #fff; font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }
/* 书末的「欣赏插曲」：全书插曲的播放列表 */
.songlist { margin: 40px 0 0; padding: 24px 18px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.songlist h3 { margin: 0 0 4px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 24px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; }
.songlist .sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
.btn-song { background: var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.songlist ol { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px; text-align: left; counter-reset: song; }
.songlist li button { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  text-align: left; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.songlist li button::before { counter-increment: song; content: counter(song); grid-row: span 2; color: var(--sea); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.songlist li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.songlist li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.songlist .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 进度条：深色是已播放，浅色是已经下载好的部分（--seek-bg 由 paintSeek() 按 audio.buffered 算），网络慢时一眼看出还要等多久 */
.seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 8px 0 6px; height: 18px;
  background: transparent; cursor: pointer; --seek-bg: var(--line); }
.seek::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border: 0;
  border-radius: 50%; background: var(--sea); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--sea);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
/* 缓冲中：播放键外圈转圈 */
.play { position: relative; }
.play::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent;
  border-top-color: var(--sea); border-right-color: var(--sea); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.buffering .play::after { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="versions" id="versions" hidden></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>
<div class="toast" id="toast"></div>

<script>
const BOOK = {"id": "wizard-of-oz-full", "title": "绿野仙踪", "intro": "根据弗兰克·鲍姆《绿野仙踪》（又译《奥兹国的魔法师》）完整改写：原著里的情节一个不少，稻草人和铁皮人自己的故事、可怕的卡里达、田鼠女王、飞猴的金帽子、会打人的树、瓷器国和锤子头都讲到了。适合 6 岁以上的小朋友和爸爸妈妈一起读、一起听，可以分几个晚上听完。", "kicker": "鲍姆童话", "cover": "images/25.webp?v=35d45238cb", "voice": "Ethan（阳光温暖的哥哥），本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "第一章　龙卷风来了", "head": "c01-h", "audio": "audio/ch01.m4a?v=79a9a90a2b", "duration": 98.799, "times": {"c01-h": [0.0, 3.636], "c01-001": [4.636, 8.817], "c01-002": [9.167, 16.365], "c01-003": [17.215, 23.084], "c01-004": [23.434, 27.854], "c01-005": [28.204, 39.32], "c01-006": [39.67, 42.843], "c01-007": [43.693, 49.773], "c01-008": [50.623, 53.926], "c01-009": [54.276, 56.925], "c01-010": [57.275, 58.392], "c01-011": [59.242, 61.363], "c01-012": [61.713, 66.104], "c01-013": [66.454, 70.653], "c01-014": [76.721, 85.304], "c01-015": [86.154, 91.085], "c01-016": [91.435, 97.299]}, "blocks": [{"t": "img", "src": "images/01.webp?v=6c9ff8459a", "vid": "images/01.mp4?v=067ac429e1", "cap": "灰色大草原上的小木屋", "n": 1}, {"t": "p", "s": [["c01-001", "小姑娘多萝西住在美国堪萨斯州的大草原上。"], ["c01-002", "和她住在一起的，有亨利叔叔、艾姆婶婶，还有一只黑色的小狗，名叫托托。"]]}, {"t": "img", "src": "images/61.webp?v=ef30578fed", "vid": "images/61.mp4?v=97f469e4c4", "cap": "灰色的草原，灰色的叔叔婶婶", "n": 2}, {"t": "p", "s": [["c01-003", "他们的家是一间小小的木头房子，四周是一望无际的灰色草原。"], ["c01-004", "太阳把草晒成了灰色，把房子也晒成了灰色。"], ["c01-005", "艾姆婶婶刚嫁过来的时候，是一个年轻漂亮的姑娘，可是太阳和风把她的眼睛、脸颊和嘴唇也晒成了灰色，她再也不笑了。"], ["c01-006", "亨利叔叔从早忙到晚，也从来不笑。"]]}, {"t": "img", "src": "images/02.webp?v=237904fdec", "vid": "images/02.mp4?v=5570384153", "cap": "托托逗得多萝西哈哈大笑", "n": 3}, {"t": "p", "s": [["c01-007", "可是托托一点儿也不灰，它整天跑来跑去，逗得多萝西哈哈大笑。"]]}, {"t": "img", "src": "images/03.webp?v=6ddfd941ad", "vid": "images/03.mp4?v=1d7dc7b06c", "cap": "天空突然变得黑沉沉的", "n": 4}, {"t": "p", "s": [["c01-008", "有一天，天空突然变得黑沉沉的。"], ["c01-009", "亨利叔叔大喊：“龙卷风来了！"], ["c01-010", "快躲进地窖里去！”"]]}, {"t": "img", "src": "images/04.webp?v=94e1145b5c", "vid": "images/04.mp4?v=336160f6ff", "cap": "托托吓得钻到了床底下", "n": 5}, {"t": "p", "s": [["c01-011", "艾姆婶婶赶紧跑进了地窖。"], ["c01-012", "多萝西正要跟过去，托托却吓得钻到了床底下。"], ["c01-013", "她刚把托托抱出来，大风就呼呼地刮来了。"]]}, {"t": "img", "src": "images/05.webp?v=8b96df53c9", "vid": "images/05.mp4?v=dd12f02e1f", "cap": "小木屋被龙卷风举了起来", "n": 6}, {"t": "p", "s": [["c01-014", "小木屋转了两三圈，竟然被龙卷风慢慢地举了起来，越升越高，好像坐在一个大气球里一样。"]]}, {"t": "img", "src": "images/06.webp?v=7894fb8820", "vid": "images/06.mp4?v=f6151b7479", "cap": "房子摇呀摇，她睡着了", "n": 7}, {"t": "p", "s": [["c01-015", "多萝西抱着托托，坐在屋子里，心里又害怕又好奇。"], ["c01-016", "房子摇呀摇，摇呀摇，最后，她竟然躺在床上睡着了。"]]}]}, {"title": "第二章　芒奇金人的国度", "head": "c02-h", "audio": "audio/ch02.m4a?v=a850bb52bb", "duration": 158.402, "times": {"c02-h": [0.0, 2.873], "c02-001": [3.873, 8.176], "c02-002": [10.97, 13.287], "c02-003": [14.137, 23.329], "c02-004": [23.679, 26.28], "c02-005": [27.13, 29.963], "c02-006": [30.313, 39.826], "c02-007": [44.401, 48.743], "c02-008": [49.093, 53.778], "c02-009": [54.628, 58.585], "c02-010": [58.935, 64.389], "c02-011": [65.239, 70.263], "c02-012": [70.613, 76.94], "c02-013": [77.79, 88.208], "c02-014": [88.558, 93.651], "c02-015": [94.501, 100.394], "c02-016": [101.244, 107.141], "c02-017": [107.991, 114.08], "c02-018": [114.43, 117.287], "c02-019": [117.637, 120.607], "c02-020": [121.457, 131.614], "c02-021": [132.464, 140.691], "c02-022": [141.041, 145.939], "c02-023": [146.789, 154.037], "c02-024": [154.387, 156.902]}, "blocks": [{"t": "img", "src": "images/07.webp?v=1ec5b3aa56", "vid": "images/07.mp4?v=9a73e71669", "cap": "门外是一个美丽的地方", "n": 8}, {"t": "p", "s": [["c02-001", "“砰”的一声，房子落到了地上，多萝西醒了过来。"], ["c02-002", "她打开门，一下子惊呆了。"]]}, {"t": "p", "s": [["c02-003", "门外是一个美丽的地方：绿油油的草地，五颜六色的花朵，挂满果子的大树，还有一条亮晶晶的小河。"], ["c02-004", "小鸟在树上唱着好听的歌。"]]}, {"t": "img", "src": "images/08.webp?v=d644f73f05", "vid": "images/08.mp4?v=3629f6946d", "cap": "芒奇金人和北方的好女巫", "n": 9}, {"t": "p", "s": [["c02-005", "这时，走过来几个奇怪的小人儿。"], ["c02-006", "他们个子小小的，穿着蓝色的衣服，戴着蓝色的尖顶帽，帽子边上挂着小铃铛，一走路就丁零丁零地响。"]]}, {"t": "p", "s": [["c02-007", "走在中间的，是一位穿白色长袍的老奶奶。"], ["c02-008", "她的长袍上闪着小星星，她就是北方的好女巫。"]]}, {"t": "p", "s": [["c02-009", "好女巫说：“欢迎你，了不起的小姑娘！"], ["c02-010", "你的房子正好压住了东方的坏女巫，芒奇金人从此自由了！”"]]}, {"t": "img", "src": "images/09.webp?v=c776014ee2", "vid": "images/09.mp4?v=271be9ac9c", "cap": "房子底下露出一双银鞋子", "n": 10}, {"t": "p", "s": [["c02-011", "多萝西回头一看，房子底下露出了一双穿着银鞋子的脚。"], ["c02-012", "可是一眨眼，坏女巫就在太阳底下化成了一阵烟，只留下了那双银鞋子。"]]}, {"t": "p", "s": [["c02-013", "好女巫告诉多萝西，奥兹国一共有四个女巫：住在北方和南方的是好女巫，住在东方和西方的是坏女巫。"], ["c02-014", "现在，东方的坏女巫没有了，只剩下西方那一个了。"]]}, {"t": "img", "src": "images/10.webp?v=cc64f6d3b4", "vid": "images/10.mp4?v=94068d8ad3", "cap": "好女巫把银鞋子送给多萝西", "n": 11}, {"t": "p", "s": [["c02-015", "好女巫把银鞋子送给了多萝西：“这双鞋子有魔力，你穿上它吧。”"]]}, {"t": "p", "s": [["c02-016", "多萝西说：“谢谢您，可是，我想回家，回到堪萨斯去。”"]]}, {"t": "img", "src": "images/62.webp?v=5338964fef", "vid": "images/62.mp4?v=ddf3468ab2", "cap": "芒奇金人陪着她一起哭", "n": 12}, {"t": "p", "s": [["c02-017", "芒奇金人摇摇头说，奥兹国的四面都是大沙漠，谁也走不过去。"], ["c02-018", "多萝西一听，伤心地哭了起来。"], ["c02-019", "善良的芒奇金人也跟着她一起哭。"]]}, {"t": "img", "src": "images/63.webp?v=fbae911369", "vid": "images/63.mp4?v=a672d97264", "cap": "尖帽子变成了一块小石板", "n": 13}, {"t": "p", "s": [["c02-020", "好女巫摘下尖帽子，帽子一下子变成了一块小石板，石板上出现了几个白色的大字：“让多萝西到翡翠城去。”"]]}, {"t": "img", "src": "images/11.webp?v=44e09576e6", "vid": "images/11.mp4?v=1f76fa8453", "cap": "沿着黄砖路，就能走到翡翠城", "n": 14}, {"t": "p", "s": [["c02-021", "好女巫想了想，说：“去翡翠城吧，那里住着伟大的魔法师奥兹，他一定能帮助你。"], ["c02-022", "你只要沿着黄砖铺成的路一直走，就能走到翡翠城。”"]]}, {"t": "img", "src": "images/12.webp?v=6ffac5d246", "vid": "images/12.mp4?v=54224edbbe", "cap": "额头上一个闪亮的印记", "n": 15}, {"t": "p", "s": [["c02-023", "说完，好女巫在多萝西的额头上轻轻地吻了一下，留下了一个闪亮的印记。"], ["c02-024", "“有了它，谁也不敢伤害你。”"]]}]}, {"title": "第三章　蓝色的宴会", "head": "c03-h", "audio": "audio/ch03.m4a?v=2d11222bb5", "duration": 127.141, "times": {"c03-h": [0.0, 2.248], "c03-001": [3.248, 11.137], "c03-002": [11.487, 17.34], "c03-003": [18.19, 22.517], "c03-004": [23.367, 30.176], "c03-005": [31.026, 37.215], "c03-006": [37.565, 48.025], "c03-007": [48.875, 52.701], "c03-008": [53.051, 59.534], "c03-009": [59.884, 67.686], "song-munchkin-party": [68.886, 74.886], "song-munchkin-party-01": [74.886, 78.886], "song-munchkin-party-02": [78.886, 82.316], "song-munchkin-party-03": [82.316, 85.756], "song-munchkin-party-04": [85.756, 89.756], "song-munchkin-party-05": [89.756, 93.436], "song-munchkin-party-06": [93.896, 97.176], "song-munchkin-party-07": [97.176, 101.136], "song-munchkin-party-08": [101.136, 104.876], "c03-010": [111.076, 115.312], "c03-011": [115.662, 122.352], "c03-012": [122.702, 125.641]}, "blocks": [{"t": "p", "s": [["c03-001", "好女巫走了以后，多萝西回到小屋里，切了几片面包，抹上黄油，和托托一起吃了。"], ["c03-002", "她洗了脸，换上一条干净的蓝白格子裙，把面包装进小篮子里。"]]}, {"t": "img", "src": "images/64.webp?v=e3709b074d", "vid": "images/64.mp4?v=628bfc39f4", "cap": "试一试银鞋子，正合脚", "n": 16}, {"t": "p", "s": [["c03-003", "她把旧鞋子脱下来，试了试银鞋子，正合脚！"]]}, {"t": "img", "src": "images/13.webp?v=485f8d4348", "vid": "images/13.mp4?v=d923883353", "cap": "踏上黄砖路", "n": 17}, {"t": "p", "s": [["c03-004", "多萝西穿上银鞋子，提着装面包的小篮子，带着托托，踏上了黄砖路。"]]}, {"t": "p", "s": [["c03-005", "路两边是整整齐齐的蓝色篱笆，篱笆后面是一片片麦田和菜园。"], ["c03-006", "芒奇金人的房子都是圆圆的，屋顶像一个大大的圆盖子，全都涂成了蓝色，因为蓝色是东方国家最喜欢的颜色。"]]}, {"t": "img", "src": "images/65.webp?v=85acc374f6", "vid": "images/65.mp4?v=74a53751a3", "cap": "芒奇金人的蓝色宴会", "n": 18}, {"t": "p", "s": [["c03-007", "傍晚的时候，多萝西走到了一座大房子前面。"], ["c03-008", "房子前的草地上，许多芒奇金人正在唱歌跳舞，庆祝坏女巫没有了。"], ["c03-009", "五个小提琴手拼命地拉着琴，大桌子上摆满了好吃的水果、坚果、馅饼和蛋糕。"]]}, {"t": "song", "title": "芒奇金人的蓝色宴会", "head": "song-munchkin-party", "lines": [["song-munchkin-party-01", "叮铃叮铃，铃儿响"], ["song-munchkin-party-02", "蓝帽子，蓝衣裳"], ["song-munchkin-party-03", "坏女巫，不见啦"], ["song-munchkin-party-04", "芒奇金人喜洋洋"], ["song-munchkin-party-05", "拉起小提琴，跳起舞"], ["song-munchkin-party-06", "馅饼蛋糕摆满桌"], ["song-munchkin-party-07", "欢迎你呀，小姑娘"], ["song-munchkin-party-08", "从今以后自由啦"]]}, {"t": "img", "src": "images/66.webp?v=494034313e", "vid": "images/66.mp4?v=552e2f7561", "cap": "睡在铺着蓝床单的小床上", "n": 19}, {"t": "p", "s": [["c03-010", "房子的主人叫博克，是芒奇金国最有钱的人。"], ["c03-011", "他热情地请多萝西吃晚饭，还让她在一张铺着蓝色床单的小床上睡了一夜。"], ["c03-012", "托托就趴在床边的蓝色小地毯上。"]]}]}, {"title": "第四章　稻草人", "head": "c04-h", "audio": "audio/ch04.m4a?v=760a5d919e", "duration": 68.372, "times": {"c04-h": [0.0, 2.354], "c04-001": [3.354, 9.118], "c04-002": [9.968, 17.45], "c04-003": [17.8, 24.377], "c04-004": [25.227, 28.212], "c04-005": [29.062, 30.573], "c04-006": [30.923, 32.437], "c04-007": [32.787, 34.914], "c04-008": [35.764, 37.703], "c04-009": [38.053, 41.833], "c04-010": [42.183, 44.462], "c04-011": [44.812, 47.957], "c04-012": [48.807, 57.286], "c04-013": [58.136, 58.758], "c04-014": [59.108, 63.339], "c04-015": [63.689, 66.872]}, "blocks": [{"t": "p", "s": [["c04-001", "第二天一早，多萝西告别了博克，继续沿着黄砖路往前走。"]]}, {"t": "img", "src": "images/14.webp?v=a83d811015", "vid": "images/14.mp4?v=358a77599c", "cap": "玉米地里的稻草人", "n": 20}, {"t": "p", "s": [["c04-002", "走了一会儿，她看见路边的玉米地里，竖着一根高高的木杆，木杆上挂着一个稻草人。"], ["c04-003", "稻草人的脑袋是一个装满稻草的小布袋，上面画着眼睛、鼻子和嘴巴。"]]}, {"t": "img", "src": "images/15.webp?v=f567c506a1", "vid": "images/15.mp4?v=f2ef258017", "cap": "稻草人朝她眨了眨眼睛", "n": 21}, {"t": "p", "s": [["c04-004", "忽然，稻草人朝她眨了眨眼睛。"]]}, {"t": "p", "s": [["c04-005", "稻草人说：“你好！"], ["c04-006", "能帮我从杆子上下来吗？"], ["c04-007", "一直挂在这里，真是无聊极了。”"]]}, {"t": "img", "src": "images/16.webp?v=298e3ffb80", "vid": "images/16.mp4?v=80b2424eeb", "cap": "多萝西帮他取了下来", "n": 22}, {"t": "p", "s": [["c04-008", "多萝西帮他取了下来。"], ["c04-009", "稻草人伸了个懒腰，高兴地说：“谢谢你！"], ["c04-010", "我的脑袋里装的全是稻草，没有脑子。"], ["c04-011", "连乌鸦都不怕我，还落在我的肩膀上笑话我。”"]]}, {"t": "p", "s": [["c04-012", "多萝西说：“我要去翡翠城找奥兹，请他送我回家，你和我一起去吧，也许奥兹能给你一个脑子。”"]]}, {"t": "img", "src": "images/17.webp?v=ac52052f07", "vid": "images/17.mp4?v=78e38bb9ef", "cap": "稻草人高兴得摔了个跟头", "n": 23}, {"t": "p", "s": [["c04-013", "“太好了！”"], ["c04-014", "稻草人高兴得跳了起来，可是一下子就摔了个跟头。"], ["c04-015", "多萝西咯咯地笑了，把他扶了起来。"]]}]}, {"title": "第五章　哪里都不如家", "head": "c05-h", "audio": "audio/ch05.m4a?v=04c023e57a", "duration": 161.393, "times": {"c05-h": [0.0, 2.376], "c05-001": [3.376, 5.243], "c05-002": [5.593, 9.458], "c05-003": [9.808, 16.138], "c05-004": [16.488, 18.538], "c05-005": [19.388, 23.072], "c05-006": [23.922, 32.518], "c05-007": [33.368, 40.231], "c05-008": [41.081, 45.202], "c05-009": [45.552, 50.99], "c05-010": [51.34, 52.935], "c05-011": [53.785, 56.594], "c05-012": [56.944, 61.343], "c05-013": [62.193, 65.359], "c05-014": [65.709, 69.539], "c05-015": [69.889, 80.413], "c05-016": [81.263, 84.395], "c05-017": [84.745, 87.516], "c05-018": [87.866, 94.413], "c05-019": [94.763, 98.851], "c05-020": [99.701, 106.816], "c05-021": [107.166, 110.483], "song-scarecrow-brain": [111.683, 117.683], "song-scarecrow-brain-01": [117.683, 121.863], "song-scarecrow-brain-02": [121.863, 126.443], "song-scarecrow-brain-03": [126.443, 130.723], "song-scarecrow-brain-04": [130.723, 136.303], "song-scarecrow-brain-05": [136.303, 141.823], "song-scarecrow-brain-06": [141.823, 146.583], "song-scarecrow-brain-07": [147.143, 150.823], "song-scarecrow-brain-08": [150.823, 154.543]}, "blocks": [{"t": "img", "src": "images/67.webp?v=a97b5eb3d7", "vid": "images/67.mp4?v=0cf85546e2", "cap": "稻草人一脚踩进坑里", "n": 24}, {"t": "p", "s": [["c05-001", "黄砖路越来越难走了。"], ["c05-002", "有的地方砖头碎了，有的地方坑坑洼洼的。"], ["c05-003", "多萝西绕着坑走，稻草人却一脚踩进坑里，扑通一声摔倒在砖头上。"], ["c05-004", "不过，他一点儿也不疼。"]]}, {"t": "p", "s": [["c05-005", "稻草人问：“给我讲讲你的家乡吧，堪萨斯是什么样的？”"]]}, {"t": "img", "src": "images/68.webp?v=43ad9a9b19", "vid": "images/68.mp4?v=8857dbcac9", "cap": "灰色的堪萨斯，彩色的奥兹国", "n": 25}, {"t": "p", "s": [["c05-006", "多萝西告诉他，那里的一切都是灰色的：灰色的草原，灰色的房子，连天空都是灰灰的。"]]}, {"t": "p", "s": [["c05-007", "稻草人奇怪地说：“这里这么美，那里那么灰，你为什么还想离开这里，回到堪萨斯去呢？”"]]}, {"t": "p", "s": [["c05-008", "多萝西说：“因为你没有脑子，所以你不明白。"], ["c05-009", "不管家乡多么灰、多么不好看，我们都愿意住在自己的家里。"], ["c05-010", "哪里都不如家好。”"]]}, {"t": "p", "s": [["c05-011", "稻草人叹了一口气：“我真的不明白。"], ["c05-012", "要是你们的脑袋里也塞满了稻草，大概就都愿意住在漂亮的地方了。”"]]}, {"t": "img", "src": "images/69.webp?v=09ee9a8952", "vid": "images/69.mp4?v=b74fc3a27d", "cap": "农夫给稻草人画上了眼睛", "n": 26}, {"t": "p", "s": [["c05-013", "接着，稻草人讲起了自己的故事。"], ["c05-014", "他说，他是前天才被一个农夫做出来的。"], ["c05-015", "农夫先给他画了一只耳朵，他就听见了声音；又画了两只眼睛，他就看见了天空；最后画了一张嘴，可是他什么也没说。"]]}, {"t": "img", "src": "images/70.webp?v=407c685005", "vid": "images/70.mp4?v=264190e6cc", "cap": "老乌鸦笑话稻草人", "n": 27}, {"t": "p", "s": [["c05-016", "农夫把他挂在杆子上，让他吓唬乌鸦。"], ["c05-017", "一开始，乌鸦们都不敢靠近。"], ["c05-018", "后来，一只老乌鸦飞过来看了看，说：“这不过是一个塞满稻草的假人！”"], ["c05-019", "所有的乌鸦都飞下来，大口大口地吃起了玉米。"]]}, {"t": "p", "s": [["c05-020", "老乌鸦还对他说：“你要是有个脑子，就和人一样聪明了，说不定比人还聪明呢。”"], ["c05-021", "从那以后，稻草人就一心想要一个脑子。"]]}, {"t": "song", "title": "要是我有一个脑子", "head": "song-scarecrow-brain", "lines": [["song-scarecrow-brain-01", "我是一个稻草人"], ["song-scarecrow-brain-02", "脑袋里面装着草"], ["song-scarecrow-brain-03", "乌鸦笑我，风儿吹我"], ["song-scarecrow-brain-04", "我只会傻傻地笑"], ["song-scarecrow-brain-05", "要是我有一个脑子"], ["song-scarecrow-brain-06", "我就能想出好办法"], ["song-scarecrow-brain-07", "数清天上的星星"], ["song-scarecrow-brain-08", "回答所有的为什么"]]}]}, {"title": "第六章　铁皮人", "head": "c06-h", "audio": "audio/ch06.m4a?v=e52fba36e1", "duration": 53.424, "times": {"c06-h": [0.0, 2.069], "c06-001": [3.069, 4.89], "c06-002": [5.24, 9.129], "c06-003": [9.979, 14.845], "c06-004": [15.195, 18.073], "c06-005": [18.923, 25.074], "c06-006": [25.924, 31.757], "c06-007": [32.107, 36.865], "c06-008": [39.336, 41.158], "c06-009": [41.508, 43.46], "c06-010": [43.81, 48.96], "c06-011": [49.31, 51.924]}, "blocks": [{"t": "img", "src": "images/18.webp?v=a4b9a27c54", "vid": "images/18.mp4?v=84990b7cf5", "cap": "走进一片大树林", "n": 28}, {"t": "p", "s": [["c06-001", "他们走进了一片大树林。"], ["c06-002", "忽然，树林里传来一阵“哎哟、哎哟”的声音。"]]}, {"t": "img", "src": "images/19.webp?v=c988820517", "vid": "images/19.mp4?v=8b6ed3cee2", "cap": "生锈的铁皮人", "n": 29}, {"t": "p", "s": [["c06-003", "他们走过去一看，原来是一个全身都是铁皮的人。"], ["c06-004", "他举着一把斧头，一动也不能动。"]]}, {"t": "p", "s": [["c06-005", "铁皮人说：“我生锈了，请帮我拿那边的油壶，给我的关节上点儿油吧。”"]]}, {"t": "img", "src": "images/20.webp?v=860f9753e3", "vid": "images/20.mp4?v=d6e76899e9", "cap": "给铁皮人的关节上油", "n": 30}, {"t": "p", "s": [["c06-006", "多萝西给他的脖子上了油，稻草人帮他扶着脑袋，慢慢地转一转。"], ["c06-007", "又给他的胳膊和腿都上了油，铁皮人终于又能动了。"]]}, {"t": "p", "s": [["c06-008", "铁皮人说：“谢谢你们！"], ["c06-009", "我在这里站了整整一年。"], ["c06-010", "我是一个樵夫，全身都是铁做的，可是，我没有一颗心。"], ["c06-011", "没有心，就不能真正地去爱别人。”"]]}]}, {"title": "第七章　铁皮人的故事", "head": "c07-h", "audio": "audio/ch07.m4a?v=e344818bdf", "duration": 129.009, "times": {"c07-h": [0.0, 2.371], "c07-001": [3.371, 6.413], "c07-002": [6.763, 7.648], "c07-003": [8.498, 12.032], "c07-004": [12.882, 20.029], "c07-005": [20.379, 26.019], "c07-006": [26.869, 32.331], "c07-007": [32.681, 37.06], "c07-008": [37.41, 42.645], "c07-009": [43.495, 52.825], "c07-010": [53.675, 59.061], "c07-011": [59.911, 66.087], "c07-012": [66.937, 72.409], "c07-013": [73.259, 77.157], "c07-014": [77.507, 83.239], "song-tin-heart": [84.439, 90.439], "song-tin-heart-01": [90.439, 93.599], "song-tin-heart-02": [94.679, 97.459], "song-tin-heart-03": [97.679, 101.639], "song-tin-heart-04": [101.839, 104.059], "song-tin-heart-05": [105.859, 109.879], "song-tin-heart-06": [109.879, 113.719], "song-tin-heart-07": [113.719, 117.939], "song-tin-heart-08": [118.119, 122.159]}, "blocks": [{"t": "p", "s": [["c07-001", "“可是，你怎么会全身都是铁皮的呢？”"], ["c07-002", "多萝西问。"]]}, {"t": "p", "s": [["c07-003", "铁皮人一边走，一边讲起了自己的故事。"]]}, {"t": "img", "src": "images/71.webp?v=e4fb735476", "vid": "images/71.mp4?v=52c254ff84", "cap": "樵夫和芒奇金姑娘", "n": 31}, {"t": "p", "s": [["c07-004", "原来，他本来是一个普通的樵夫，爱上了一个美丽的芒奇金姑娘，他们说好了要结婚。"], ["c07-005", "可是，东方的坏女巫不想让他们结婚，就给他的斧头施了魔法。"]]}, {"t": "p", "s": [["c07-006", "从那以后，斧头总是不听话，一次又一次砍伤了樵夫自己。"], ["c07-007", "每受一次伤，好心的铁匠就给他换上一块铁皮。"], ["c07-008", "慢慢地，他全身都变成了铁皮的，连心也没有了。"]]}, {"t": "p", "s": [["c07-009", "铁皮人难过地说：“没有了心，我就再也不爱那个姑娘了，可是我记得，有心的时候，我是世界上最快乐的人。”"]]}, {"t": "p", "s": [["c07-010", "稻草人说：“我还是想要脑子，没有脑子，有了心也不知道该怎么用。”"]]}, {"t": "img", "src": "images/72.webp?v=708b483216", "vid": "images/72.mp4?v=af5e3f46ae", "cap": "要脑子，还是要心？", "n": 32}, {"t": "p", "s": [["c07-011", "铁皮人说：“我想要心，脑子不能让人快乐，可是快乐是世界上最好的东西。”"]]}, {"t": "p", "s": [["c07-012", "多萝西说：“那就和我们一起去找奥兹吧，请他给你一颗心。”"]]}, {"t": "img", "src": "images/21.webp?v=69f7980bb8", "vid": "images/21.mp4?v=f34dc7318d", "cap": "铁皮人高高兴兴地跟上了他们", "n": 33}, {"t": "p", "s": [["c07-013", "铁皮人扛起斧头，高高兴兴地跟上了他们。"], ["c07-014", "他说，要是能把油壶带上就好了，万一下雨，他又会生锈的。"]]}, {"t": "song", "title": "要是我有一颗心", "head": "song-tin-heart", "lines": [["song-tin-heart-01", "我是一个铁皮人"], ["song-tin-heart-02", "敲一敲，空空响"], ["song-tin-heart-03", "身子亮闪闪"], ["song-tin-heart-04", "胸口凉冰冰"], ["song-tin-heart-05", "要是我有一颗心"], ["song-tin-heart-06", "就能笑也能哭"], ["song-tin-heart-07", "就能好好地爱"], ["song-tin-heart-08", "把温暖送给每一个人"]]}]}, {"title": "第八章　胆小的狮子", "head": "c08-h", "audio": "audio/ch08.m4a?v=d04bdfaa29", "duration": 135.861, "times": {"c08-h": [0.0, 2.087], "c08-001": [3.087, 4.586], "c08-002": [4.936, 9.364], "c08-003": [12.891, 17.93], "c08-004": [18.78, 22.964], "c08-005": [23.814, 30.049], "c08-006": [30.399, 34.309], "c08-007": [35.159, 41.723], "c08-008": [42.073, 46.597], "c08-009": [47.447, 57.463], "c08-010": [57.813, 65.721], "c08-011": [66.571, 68.258], "c08-012": [68.608, 69.52], "c08-013": [69.87, 70.884], "c08-014": [71.234, 72.078], "c08-015": [72.428, 78.291], "c08-016": [79.141, 83.545], "c08-017": [84.395, 93.851], "song-road-song": [95.051, 97.171], "song-road-song-01": [97.171, 99.511], "song-road-song-02": [99.511, 102.611], "song-road-song-03": [103.731, 107.631], "song-road-song-04": [107.791, 111.351], "song-road-song-05": [111.351, 115.851], "song-road-song-06": [115.851, 120.631], "song-road-song-07": [120.631, 124.351], "song-road-song-08": [125.351, 129.011]}, "blocks": [{"t": "img", "src": "images/22.webp?v=a486e3a50e", "vid": "images/22.mp4?v=ab0e3fa95f", "cap": "一头大狮子跳到了路中间", "n": 34}, {"t": "p", "s": [["c08-001", "树林越来越密了。"], ["c08-002", "突然，“嗷呜”一声，一头大狮子跳到了路中间。"], ["c08-003", "他一爪子把稻草人推倒在路边，又把铁皮人撞得砰的一声。"]]}, {"t": "p", "s": [["c08-004", "接着，他张开大嘴，朝小狗托托扑了过去。"]]}, {"t": "img", "src": "images/23.webp?v=76fdeb8009", "vid": "images/23.mp4?v=944a13ad30", "cap": "多萝西打了狮子的鼻子", "n": 35}, {"t": "p", "s": [["c08-005", "多萝西顾不上害怕，跑上去，在狮子的鼻子上打了一下：“不许欺负小狗！"], ["c08-006", "你这么大，还欺负小狗，真是个胆小鬼！”"]]}, {"t": "img", "src": "images/24.webp?v=2900dbc26a", "vid": "images/24.mp4?v=c18e4547fb", "cap": "我就是一个胆小鬼", "n": 36}, {"t": "p", "s": [["c08-007", "狮子用爪子揉着鼻子，委屈地说：“你说得对，我就是一个胆小鬼。"], ["c08-008", "我只会大声吼叫，其实心里怕得要命。”"]]}, {"t": "p", "s": [["c08-009", "狮子又说：“森林里的动物都以为狮子是万兽之王，所以，只要我一吼，它们就都吓跑了。"], ["c08-010", "可是要是有一头大象、一只老虎或者一只熊来跟我打架，我自己也会吓得逃走的。”"]]}, {"t": "p", "s": [["c08-011", "“也许你有心脏病吧。”"], ["c08-012", "铁皮人说。"], ["c08-013", "“也许是吧。”"], ["c08-014", "狮子说。"], ["c08-015", "铁皮人说：“那你应该高兴才对，这说明你有一颗心呀，我连心都没有呢！”"]]}, {"t": "p", "s": [["c08-016", "稻草人说：“那你也和我们一起去找奥兹吧，请他给你一点儿勇气。”"]]}, {"t": "img", "src": "images/25.webp?v=35d45238cb", "vid": "images/25.mp4?v=45217ce73f", "cap": "五个好朋友一起往前走", "n": 37}, {"t": "p", "s": [["c08-017", "就这样，多萝西、托托、稻草人、铁皮人和胆小的狮子，成了好朋友，一起沿着黄砖路往前走。"]]}, {"t": "song", "title": "黄砖路上一起走", "head": "song-road-song", "lines": [["song-road-song-01", "黄砖路，弯又长"], ["song-road-song-02", "我们一起向前方"], ["song-road-song-03", "稻草人想要一个脑袋"], ["song-road-song-04", "铁皮人想要一颗心脏"], ["song-road-song-05", "狮子想要勇敢的胆量"], ["song-road-song-06", "多萝西想回她的家乡"], ["song-road-song-07", "手拉手，肩并肩，不害怕"], ["song-road-song-08", "一起走向闪亮的远方"]]}]}, {"title": "第九章　小甲虫的眼泪", "head": "c09-h", "audio": "audio/ch09.m4a?v=30523eef4d", "duration": 53.56, "times": {"c09-h": [0.0, 2.599], "c09-001": [3.599, 9.177], "c09-002": [10.027, 11.616], "c09-003": [11.966, 16.757], "c09-004": [17.107, 20.243], "c09-005": [21.093, 27.25], "c09-006": [27.6, 32.305], "c09-007": [33.155, 38.257], "c09-008": [38.607, 40.99], "c09-009": [41.84, 46.438], "c09-010": [46.788, 52.06]}, "blocks": [{"t": "p", "s": [["c09-001", "走着走着，铁皮人一不小心，一脚踩死了路上的一只小甲虫。"]]}, {"t": "p", "s": [["c09-002", "铁皮人难过极了。"], ["c09-003", "他想：“我没有心，所以必须更小心，不能伤害任何东西。”"], ["c09-004", "他一边走，一边伤心地掉眼泪。"]]}, {"t": "img", "src": "images/73.webp?v=507299780e", "vid": "images/73.mp4?v=d4053ee7c1", "cap": "眼泪把铁皮人的下巴锈住了", "n": 38}, {"t": "p", "s": [["c09-005", "眼泪顺着他的脸，慢慢流到了下巴上，把下巴的关节给锈住了。"], ["c09-006", "多萝西问他话，他张不开嘴，只能着急地比划。"]]}, {"t": "p", "s": [["c09-007", "稻草人赶紧从篮子里拿出油壶，给铁皮人的下巴上了油。"], ["c09-008", "过了一会儿，铁皮人又能说话了。"]]}, {"t": "p", "s": [["c09-009", "从那以后，铁皮人走路的时候，总是低着头看着地面。"], ["c09-010", "看见小蚂蚁爬过，他就小心地跨过去，一点儿也不伤害它们。"]]}]}, {"title": "第十章　深沟和卡里达", "head": "c10-h", "audio": "audio/ch10.m4a?v=3acff470dc", "duration": 158.265, "times": {"c10-h": [0.0, 2.914], "c10-001": [3.914, 8.035], "c10-002": [8.385, 11.598], "c10-003": [12.448, 18.244], "c10-004": [19.094, 24.59], "c10-005": [24.94, 28.482], "c10-006": [29.332, 33.531], "c10-007": [33.881, 38.299], "c10-008": [39.149, 52.705], "c10-009": [53.555, 61.511], "c10-010": [62.361, 69.108], "c10-011": [69.458, 74.229], "c10-012": [74.579, 76.443], "c10-013": [77.293, 80.679], "c10-014": [81.029, 87.169], "c10-015": [88.019, 91.189], "c10-016": [91.539, 98.197], "c10-017": [99.047, 101.847], "c10-018": [102.197, 104.155], "song-lion-courage": [105.355, 111.355], "song-lion-courage-01": [111.355, 115.695], "song-lion-courage-02": [116.195, 120.195], "song-lion-courage-03": [120.575, 125.335], "song-lion-courage-04": [125.335, 130.155], "song-lion-courage-05": [132.155, 135.815], "song-lion-courage-06": [135.815, 140.855], "song-lion-courage-07": [141.995, 145.775], "song-lion-courage-08": [145.775, 151.415]}, "blocks": [{"t": "img", "src": "images/26.webp?v=6d10fb84ff", "vid": "images/26.mp4?v=c050bfa44d", "cap": "又宽又深的大沟", "n": 39}, {"t": "p", "s": [["c10-001", "走着走着，一条又宽又深的大沟挡住了他们的路。"], ["c10-002", "沟底全是尖尖的石头，根本过不去。"]]}, {"t": "p", "s": [["c10-003", "狮子说：“我来试试，我虽然害怕，可是我能跳得很远。”"]]}, {"t": "img", "src": "images/27.webp?v=bef9493963", "vid": "images/27.mp4?v=6afbe1428e", "cap": "狮子驮着大家跳了过去", "n": 40}, {"t": "p", "s": [["c10-004", "狮子让大家一个一个坐在他的背上，用力一跳，就跳到了对面。"], ["c10-005", "他来来回回跳了好几趟，把大家都送了过去。"]]}, {"t": "p", "s": [["c10-006", "可是没过多久，前面又出现了一条更宽的深沟。"], ["c10-007", "狮子说：“这条沟太宽了，我跳不过去。”"]]}, {"t": "p", "s": [["c10-008", "狮子还小声说：“这一带的树林里，住着一种叫卡里达的怪兽，长着熊的身子、老虎的脑袋，爪子又长又尖，我最怕它们了。”"]]}, {"t": "p", "s": [["c10-009", "稻草人想了想，说：“沟边有一棵大树，铁皮人把它砍倒，倒在沟上，我们就能从树干上走过去了。”"]]}, {"t": "img", "src": "images/74.webp?v=cdbead53ff", "vid": "images/74.mp4?v=a2bb2ed461", "cap": "可怕的卡里达追来了", "n": 41}, {"t": "p", "s": [["c10-010", "铁皮人举起斧头，砍呀砍，大树“咔嚓”一声，正好横倒在了深沟上。"], ["c10-011", "大家刚走上树干，就听见身后传来一阵可怕的吼声。"], ["c10-012", "两只卡里达追了过来！"]]}, {"t": "p", "s": [["c10-013", "狮子转过身，对着卡里达大吼一声。"], ["c10-014", "卡里达吓得愣了一下，可是看见狮子个子没有它们大，又冲了过来。"]]}, {"t": "p", "s": [["c10-015", "大家一过沟，稻草人就喊：“快砍树！”"], ["c10-016", "铁皮人用力砍断了树干，大树带着两只卡里达，一起掉进了深深的沟里。"]]}, {"t": "p", "s": [["c10-017", "狮子松了一口气：“好险哪！"], ["c10-018", "我还以为我们完蛋了呢。”"]]}, {"t": "song", "title": "要是我有一点勇气", "head": "song-lion-courage", "lines": [["song-lion-courage-01", "我是森林大狮子"], ["song-lion-courage-02", "吼一声，地动山摇"], ["song-lion-courage-03", "可是一片叶子落下来"], ["song-lion-courage-04", "我就吓得到处逃"], ["song-lion-courage-05", "要是我有一点勇气"], ["song-lion-courage-06", "就不怕黑也不怕高"], ["song-lion-courage-07", "为了朋友向前冲"], ["song-lion-courage-08", "做一头勇敢的狮子"]]}]}, {"title": "第十一章　大河", "head": "c11-h", "audio": "audio/ch11.m4a?v=2fabfe94ef", "duration": 58.871, "times": {"c11-h": [0.0, 2.119], "c11-001": [3.119, 5.727], "c11-002": [6.077, 10.949], "c11-003": [11.799, 19.044], "c11-004": [19.394, 22.677], "c11-005": [23.527, 30.55], "c11-006": [30.9, 38.085], "c11-007": [38.935, 46.147], "c11-008": [46.997, 51.522], "c11-009": [51.872, 57.371]}, "blocks": [{"t": "img", "src": "images/28.webp?v=a50dc5d501", "vid": "images/28.mp4?v=30cdfb29f6", "cap": "大家一起做了一只木筏", "n": 42}, {"t": "p", "s": [["c11-001", "后来，他们又遇到了一条大河。"], ["c11-002", "铁皮人用斧头砍倒了几棵大树，大家一起做了一只木筏。"]]}, {"t": "img", "src": "images/29.webp?v=53375fc252", "vid": "images/29.mp4?v=4bce4ba667", "cap": "稻草人被留在了河中间", "n": 43}, {"t": "p", "s": [["c11-003", "木筏漂到河中间，稻草人用长竿撑船，竿子却插进了河底的泥里拔不出来。"], ["c11-004", "稻草人抱着竿子，被留在了河中间！"]]}, {"t": "img", "src": "images/75.webp?v=ba60a6deaf", "vid": "images/75.mp4?v=228b61e894", "cap": "狮子拖着木筏游向岸边", "n": 44}, {"t": "p", "s": [["c11-005", "狮子跳进河里，让铁皮人抓住他的尾巴，拼命地游，终于把木筏推到了岸边。"], ["c11-006", "可是，他们离黄砖路已经很远了，稻草人还孤零零地挂在河中间的竿子上。"]]}, {"t": "img", "src": "images/30.webp?v=99243d19d2", "vid": "images/30.mp4?v=6c8bb9f51a", "cap": "大鹳鸟叼起了稻草人", "n": 45}, {"t": "p", "s": [["c11-007", "多亏一只好心的大鹳鸟飞过来，用长长的嘴巴叼起稻草人，把他送回了大家身边。"]]}, {"t": "p", "s": [["c11-008", "稻草人高兴得抱住了每一个人，连托托都抱了。"], ["c11-009", "他说：“我真怕要一辈子挂在河中间了，那样的话，我就永远也得不到脑子了！”"]]}]}, {"title": "第十二章　罂粟花田", "head": "c12-h", "audio": "audio/ch12.m4a?v=ea58539656", "duration": 43.309, "times": {"c12-h": [0.0, 2.833], "c12-001": [3.833, 7.847], "c12-002": [8.197, 12.04], "c12-003": [12.89, 18.351], "c12-004": [18.701, 19.936], "c12-005": [20.786, 23.623], "c12-006": [23.974, 24.886], "c12-007": [25.236, 28.645], "c12-008": [28.995, 33.975], "c12-009": [34.825, 38.459], "c12-010": [38.809, 41.809]}, "blocks": [{"t": "img", "src": "images/31.webp?v=859ae57cd4", "vid": "images/31.mp4?v=64922bd654", "cap": "一大片红色的罂粟花田", "n": 46}, {"t": "p", "s": [["c12-001", "过了河，眼前是一大片红色的罂粟花田。"], ["c12-002", "花开得又大又红，香味浓得让人发晕。"]]}, {"t": "img", "src": "images/32.webp?v=38aaea22b3", "vid": "images/32.mp4?v=c490a9ca30", "cap": "多萝西在花丛中睡着了", "n": 47}, {"t": "p", "s": [["c12-003", "多萝西闻着闻着，眼皮越来越沉，躺在花丛中睡着了。"], ["c12-004", "托托也睡着了。"]]}, {"t": "img", "src": "images/33.webp?v=4d3baa5ebf", "vid": "images/33.mp4?v=26aeb98448", "cap": "把多萝西抬出了花田", "n": 48}, {"t": "p", "s": [["c12-005", "“这些花有魔力，会让人一直睡下去！”"], ["c12-006", "铁皮人说。"], ["c12-007", "稻草人和铁皮人不用呼吸，一点儿也不困。"], ["c12-008", "他们赶紧用手臂搭成椅子，把多萝西和托托抬出了花田。"]]}, {"t": "p", "s": [["c12-009", "可是，狮子太重了，他们抬不动。"], ["c12-010", "狮子走到一半，也呼呼地睡着了。"]]}]}, {"title": "第十三章　田鼠女王", "head": "c13-h", "audio": "audio/ch13.m4a?v=4eb802b01e", "duration": 79.746, "times": {"c13-h": [0.0, 2.854], "c13-001": [3.854, 12.183], "c13-002": [13.033, 17.644], "c13-003": [17.994, 20.612], "c13-004": [21.462, 24.866], "c13-005": [25.216, 26.441], "c13-006": [26.791, 32.188], "c13-007": [33.038, 35.119], "c13-008": [35.469, 38.034], "c13-009": [38.884, 41.444], "c13-010": [41.794, 43.46], "c13-011": [44.31, 50.519], "c13-012": [51.369, 54.622], "c13-013": [54.972, 60.193], "c13-014": [60.543, 65.648], "c13-015": [66.498, 71.336], "c13-016": [71.686, 78.246]}, "blocks": [{"t": "img", "src": "images/76.webp?v=9217159d9a", "vid": "images/76.mp4?v=6ed774025f", "cap": "铁皮人救了一只小田鼠", "n": 49}, {"t": "p", "s": [["c13-001", "稻草人和铁皮人正发愁，一只灰色的小田鼠从草丛里跑了出来，后面追着一只凶巴巴的大黄野猫。"]]}, {"t": "p", "s": [["c13-002", "铁皮人虽然没有心，可是他不愿意看见弱小的动物被欺负。"], ["c13-003", "他举起斧头，把野猫吓跑了。"]]}, {"t": "img", "src": "images/77.webp?v=6c9e345653", "vid": "images/77.mp4?v=e76ef91a6d", "cap": "成千上万只小田鼠围着女王欢呼", "n": 50}, {"t": "p", "s": [["c13-004", "小田鼠喘着气说：“谢谢你救了我的命！"], ["c13-005", "我是田鼠女王。”"], ["c13-006", "这时，成千上万只小田鼠都跑来了，围着女王欢呼。"]]}, {"t": "p", "s": [["c13-007", "稻草人说：“请你们帮个忙吧！"], ["c13-008", "我们有个朋友，在罂粟花田里睡着了。”"]]}, {"t": "p", "s": [["c13-009", "女王吓了一跳：“是一头狮子？"], ["c13-010", "它会把我们都吃掉的！”"]]}, {"t": "p", "s": [["c13-011", "稻草人说：“不会的，他是一头胆小的狮子，而且，他会一直记得你们的恩情。”"]]}, {"t": "img", "src": "images/34.webp?v=1461f5cb00", "vid": "images/34.mp4?v=d2f1e08446", "cap": "小田鼠们把狮子拉出了花田", "n": 51}, {"t": "p", "s": [["c13-012", "铁皮人砍了几棵树，做了一辆木头车。"], ["c13-013", "小田鼠们每只都拉着一根细绳，绳子绑在木头车上。"], ["c13-014", "一千只小田鼠一起使劲，终于把狮子拉出了花田。"]]}, {"t": "img", "src": "images/78.webp?v=8c243cb974", "vid": "images/78.mp4?v=0e0d3ca8ef", "cap": "田鼠女王送给多萝西一个小哨子", "n": 52}, {"t": "p", "s": [["c13-015", "狮子醒过来，听说了这件事，真诚地谢谢了田鼠女王。"], ["c13-016", "女王给了多萝西一个小哨子：“以后需要帮忙，就吹这个哨子，我们会马上赶来。”"]]}]}, {"title": "第十四章　翡翠城", "head": "c14-h", "audio": "audio/ch14.m4a?v=3c94607905", "duration": 129.513, "times": {"c14-h": [0.0, 2.634], "c14-001": [3.634, 8.2], "c14-002": [8.55, 14.163], "c14-003": [15.013, 19.507], "c14-004": [19.857, 23.383], "c14-005": [24.233, 32.404], "c14-006": [33.254, 35.938], "c14-007": [36.288, 42.308], "c14-008": [42.658, 46.695], "c14-009": [47.545, 54.718], "song-emerald-city": [55.918, 61.918], "song-emerald-city-01": [61.918, 66.098], "song-emerald-city-02": [66.098, 69.778], "song-emerald-city-03": [69.778, 75.338], "song-emerald-city-04": [75.958, 78.838], "song-emerald-city-05": [99.818, 103.878], "song-emerald-city-06": [103.878, 107.518], "song-emerald-city-07": [108.418, 112.498], "song-emerald-city-08": [113.138, 117.278], "c14-010": [123.478, 128.013]}, "blocks": [{"t": "img", "src": "images/35.webp?v=e408f741b0", "vid": "images/35.mp4?v=1d40a51a46", "cap": "远处出现了美丽的绿光", "n": 53}, {"t": "p", "s": [["c14-001", "他们沿着黄砖路继续走，周围的东西变得越来越绿。"], ["c14-002", "终于，远处出现了一片美丽的绿光，那就是翡翠城。"]]}, {"t": "img", "src": "images/36.webp?v=5e4ba565b5", "vid": "images/36.mp4?v=267e93ea21", "cap": "守门人给大家戴上绿眼镜", "n": 54}, {"t": "p", "s": [["c14-003", "城门口的守门人给每个人都戴上了一副绿色的眼镜。"], ["c14-004", "“翡翠城太亮了，不戴眼镜会刺伤眼睛的。”"]]}, {"t": "p", "s": [["c14-005", "守门人用一把金钥匙，把眼镜锁在了每个人的脑袋后面，连托托都戴上了一副小小的绿眼镜。"]]}, {"t": "img", "src": "images/37.webp?v=b70ebebb9c", "vid": "images/37.mp4?v=c0b22af14c", "cap": "走进翡翠城", "n": 55}, {"t": "p", "s": [["c14-006", "走进城里，大家都看呆了。"], ["c14-007", "街道是绿色的，房子是绿色的，路上镶满了亮晶晶的绿宝石。"], ["c14-008", "就连人们的衣服和皮肤，看起来都是淡淡的绿色。"]]}, {"t": "img", "src": "images/79.webp?v=78127772de", "vid": "images/79.mp4?v=5a5f8dc7b6", "cap": "绿胡子士兵和绿色的糖果", "n": 56}, {"t": "p", "s": [["c14-009", "孩子们吃着绿色的糖果，大人们用绿色的钱，买绿色的柠檬水和绿色的爆米花。"]]}, {"t": "song", "title": "翡翠城", "head": "song-emerald-city", "lines": [["song-emerald-city-01", "绿色的街道，绿色的房"], ["song-emerald-city-02", "绿宝石闪闪亮"], ["song-emerald-city-03", "戴上绿眼镜，看呀看"], ["song-emerald-city-04", "满城都是绿光"], ["song-emerald-city-05", "翡翠城，翡翠城"], ["song-emerald-city-06", "奥兹就住在这里"], ["song-emerald-city-07", "翡翠城，翡翠城"], ["song-emerald-city-08", "愿望会在这里实现"]]}, {"t": "p", "s": [["c14-010", "一个留着长长绿胡子的士兵，带着他们走进了宫殿。"]]}]}, {"title": "第十五章　伟大的奥兹", "head": "c15-h", "audio": "audio/ch15.m4a?v=7341553aad", "duration": 69.393, "times": {"c15-h": [0.0, 2.523], "c15-001": [3.523, 6.01], "c15-002": [6.86, 16.018], "c15-003": [16.869, 20.961], "c15-004": [21.811, 25.255], "c15-005": [25.605, 27.852], "c15-006": [28.202, 30.937], "c15-007": [31.787, 44.306], "c15-008": [44.656, 50.237], "c15-009": [51.087, 56.774], "c15-010": [57.624, 67.893]}, "blocks": [{"t": "img", "src": "images/38.webp?v=61dea6e4bf", "vid": "images/38.mp4?v=41aec5d7b5", "cap": "宝座上悬着一个巨大的脑袋", "n": 57}, {"t": "p", "s": [["c15-001", "伟大的奥兹每天只见一个人。"]]}, {"t": "p", "s": [["c15-002", "多萝西走进宽大的宫殿，看见一张绿宝石做的宝座上，悬着一个巨大的脑袋，没有身体，也没有手脚。"]]}, {"t": "p", "s": [["c15-003", "大脑袋说：“我是伟大的奥兹，你为什么来找我？”"]]}, {"t": "p", "s": [["c15-004", "多萝西鼓起勇气，说出了自己的愿望。"], ["c15-005", "奥兹说：“我可以帮你回家。"], ["c15-006", "可是你必须先打败西方的坏女巫。”"]]}, {"t": "img", "src": "images/39.webp?v=0a2b2d5dc0", "vid": "images/39.mp4?v=19f28b5f5f", "cap": "每个人看见的奥兹都不一样", "n": 58}, {"t": "p", "s": [["c15-007", "第二天，稻草人看见的奥兹，是一位美丽的仙女；铁皮人看见的，是一头可怕的怪兽；狮子看见的，是一个熊熊燃烧的大火球。"], ["c15-008", "奥兹对他们说的，都是同一句话：先去打败西方的坏女巫。"]]}, {"t": "p", "s": [["c15-009", "大家心里都很难过，可是为了实现愿望，他们决定一起向西走。"]]}, {"t": "p", "s": [["c15-010", "守门人摘下他们的绿眼镜，指着西边说：“西方没有黄砖路，你们只要朝着太阳落山的地方走，坏女巫自己就会来找你们的。”"]]}]}, {"title": "第十六章　西方的坏女巫", "head": "c16-h", "audio": "audio/ch16.m4a?v=ba77f0fc9d", "duration": 47.167, "times": {"c16-h": [0.0, 3.352], "c16-001": [4.352, 11.192], "c16-002": [11.542, 14.203], "c16-003": [15.053, 20.315], "c16-004": [20.665, 25.34], "c16-005": [25.69, 31.373], "c16-006": [32.223, 34.583], "c16-007": [34.933, 39.383], "c16-008": [40.233, 41.621], "c16-009": [41.971, 45.667]}, "blocks": [{"t": "img", "src": "images/40.webp?v=81f4e36d3e", "vid": "images/40.mp4?v=f863b3fda3", "cap": "坏女巫的眼睛能看得很远", "n": 59}, {"t": "p", "s": [["c16-001", "西方的坏女巫只有一只眼睛，可是那只眼睛像望远镜一样，能看得很远很远。"], ["c16-002", "她早就看见多萝西他们来了。"]]}, {"t": "img", "src": "images/41.webp?v=289127972d", "vid": "images/41.mp4?v=54c96eefb1", "cap": "铁皮人和稻草人赶跑了狼群和乌鸦", "n": 60}, {"t": "p", "s": [["c16-003", "她派出了一群大灰狼，铁皮人挥着斧头，把狼全都赶跑了。"], ["c16-004", "她派出了一群乌鸦，稻草人张开手臂，把乌鸦都吓跑了。"], ["c16-005", "她派出了一群黑蜜蜂，蜜蜂蜇在铁皮人身上，刺全都断了。"]]}, {"t": "img", "src": "images/80.webp?v=164a552c2a", "vid": "images/80.mp4?v=054b732ac6", "cap": "狮子一吼，温基士兵掉头就跑", "n": 61}, {"t": "p", "s": [["c16-006", "她又派出了她的温基士兵。"], ["c16-007", "可是狮子冲着他们大吼一声，温基人吓得掉头就跑。"]]}, {"t": "img", "src": "images/42.webp?v=58a42d1047", "vid": "images/42.mp4?v=4d96e7d4d4", "cap": "会飞的猴子", "n": 62}, {"t": "p", "s": [["c16-008", "坏女巫气坏了。"], ["c16-009", "她戴上了一顶金帽子，召来了会飞的猴子。"]]}]}, {"title": "第十七章　会飞的猴子", "head": "c17-h", "audio": "audio/ch17.m4a?v=348514a884", "duration": 90.966, "times": {"c17-h": [0.0, 2.34], "c17-001": [3.34, 9.572], "c17-002": [9.922, 13.513], "c17-003": [13.863, 17.101], "c17-004": [17.951, 22.455], "c17-005": [22.805, 28.675], "c17-006": [33.751, 43.045], "c17-007": [43.395, 52.717], "c17-008": [53.567, 62.086], "c17-009": [62.436, 64.934], "c17-010": [65.784, 71.846], "c17-011": [72.196, 76.062], "c17-012": [76.912, 82.757], "c17-013": [83.107, 89.466]}, "blocks": [{"t": "img", "src": "images/81.webp?v=b3779d877d", "vid": "images/81.mp4?v=7c04a93f79", "cap": "坏女巫念咒召唤飞猴", "n": 63}, {"t": "p", "s": [["c17-001", "坏女巫站在一条腿上，念起了咒语：“埃皮，佩皮，卡基！"], ["c17-002", "希洛，霍洛，赫洛！"], ["c17-003", "齐齐，祖祖，齐克！”"]]}, {"t": "p", "s": [["c17-004", "天空一下子暗了下来，远处传来呼呼的声音。"], ["c17-005", "一大群长着翅膀的猴子飞了过来，领头的是一只又老又大的猴王。"]]}, {"t": "p", "s": [["c17-006", "飞猴们呼啦啦地飞来，把稻草人身上的稻草扯了出来，把铁皮人扔到了石头堆上，还把狮子捆了起来。"], ["c17-007", "可是，他们看见了多萝西额头上好女巫的印记，不敢伤害她，只好把她和托托带到了坏女巫的城堡里。"]]}, {"t": "p", "s": [["c17-008", "猴王对坏女巫说：“我们已经为你做了三次事了，从今以后，金帽子再也管不了我们了。”"], ["c17-009", "说完，飞猴们就飞走了。"]]}, {"t": "img", "src": "images/43.webp?v=0a0ea5702c", "vid": "images/43.mp4?v=d0ef4b574a", "cap": "多萝西每天擦洗地板", "n": 64}, {"t": "p", "s": [["c17-010", "坏女巫让多萝西每天打扫厨房、擦洗地板，还把狮子关进了笼子里。"], ["c17-011", "多萝西每天晚上都悄悄地给狮子送吃的。"]]}, {"t": "img", "src": "images/82.webp?v=77d56b7e86", "vid": "images/82.mp4?v=376bf4c752", "cap": "狮子和多萝西悄悄商量", "n": 65}, {"t": "p", "s": [["c17-012", "狮子和多萝西常常一起躺在稻草堆上，悄悄地商量怎么逃出去。"], ["c17-013", "可是城堡里到处都是黄衣服的温基人看守，他们怕坏女巫，什么都不敢做。"]]}]}, {"title": "第十八章　一桶水", "head": "c18-h", "audio": "audio/ch18.m4a?v=48468323a7", "duration": 64.423, "times": {"c18-h": [0.0, 2.037], "c18-001": [3.037, 6.293], "c18-002": [6.643, 15.219], "c18-003": [16.069, 17.311], "c18-004": [17.661, 24.269], "c18-005": [27.633, 31.459], "c18-006": [31.809, 33.135], "c18-007": [33.985, 36.941], "c18-008": [37.291, 45.358], "c18-009": [50.265, 54.287], "c18-010": [54.637, 62.923]}, "blocks": [{"t": "p", "s": [["c18-001", "坏女巫一直想得到多萝西的银鞋子。"], ["c18-002", "有一天，她用一根看不见的铁棍把多萝西绊倒了，一只银鞋子掉了下来，坏女巫一把抢了过去。"]]}, {"t": "img", "src": "images/44.webp?v=51dc93f90d", "vid": "images/44.mp4?v=b120362db9", "cap": "多萝西把一桶水泼了过去", "n": 66}, {"t": "p", "s": [["c18-003", "“把鞋子还给我！”"], ["c18-004", "多萝西气极了，顺手提起旁边的一桶水，哗啦一下泼在了坏女巫身上。"]]}, {"t": "p", "s": [["c18-005", "坏女巫尖叫起来：“哎呀，你看你干了什么！"], ["c18-006", "我要化掉了！”"]]}, {"t": "img", "src": "images/45.webp?v=949c917a11", "vid": "images/45.mp4?v=4d39680a18", "cap": "坏女巫化成了一摊水", "n": 67}, {"t": "p", "s": [["c18-007", "原来，坏女巫最怕的就是水。"], ["c18-008", "她的身子越缩越小，越缩越小，最后，化成了一摊黑黑的水，只剩下了那只银鞋子。"]]}, {"t": "img", "src": "images/46.webp?v=4c3f575d21", "vid": "images/46.mp4?v=192fcce9ef", "cap": "大家又团聚了", "n": 68}, {"t": "p", "s": [["c18-009", "多萝西放出了狮子，城堡里的人们也都自由了。"], ["c18-010", "大家一起找回了铁皮人，把他身上的坑敲平；又找回了稻草人的衣服，重新塞满了干干净净的稻草。"]]}]}, {"title": "第十九章　金帽子的秘密", "head": "c19-h", "audio": "audio/ch19.m4a?v=109b4a780d", "duration": 100.055, "times": {"c19-h": [0.0, 2.764], "c19-001": [3.764, 8.917], "c19-002": [9.267, 13.478], "c19-003": [14.328, 20.058], "c19-004": [20.408, 24.879], "c19-005": [25.729, 28.402], "c19-006": [28.752, 31.772], "c19-007": [32.122, 36.648], "c19-008": [36.998, 38.815], "c19-009": [39.665, 43.94], "c19-010": [48.517, 53.245], "c19-011": [53.595, 55.079], "c19-012": [55.429, 57.096], "c19-013": [57.446, 58.368], "c19-014": [59.218, 62.071], "c19-015": [62.421, 65.715], "c19-016": [66.565, 70.665], "c19-017": [71.015, 76.121], "c19-018": [76.471, 82.612], "c19-019": [83.462, 84.62], "c19-020": [84.97, 92.919], "c19-021": [93.769, 96.332], "c19-022": [96.682, 98.555]}, "blocks": [{"t": "p", "s": [["c19-001", "温基人非常感谢多萝西，还请铁皮人留下来做他们的国王。"], ["c19-002", "铁皮人说，等他从奥兹那里得到了心，再回来。"]]}, {"t": "img", "src": "images/83.webp?v=2a49e16cc0", "vid": "images/83.mp4?v=9b484a0a7c", "cap": "多萝西找到了金帽子", "n": 69}, {"t": "p", "s": [["c19-003", "多萝西在坏女巫的柜子里找到了那顶金帽子，戴在了头上。"], ["c19-004", "回翡翠城的路很远，他们走着走着，迷路了。"]]}, {"t": "p", "s": [["c19-005", "多萝西想起了田鼠女王的哨子。"], ["c19-006", "她一吹哨子，小田鼠们就跑来了。"], ["c19-007", "田鼠女王说：“你为什么不用金帽子，叫飞猴来帮忙呢？"], ["c19-008", "金帽子里面写着咒语。”"]]}, {"t": "p", "s": [["c19-009", "多萝西照着念起了咒语，飞猴们果然飞来了。"], ["c19-010", "猴王说：“金帽子的主人可以让我们做三件事。"], ["c19-011", "你要我们做什么？”"], ["c19-012", "“请带我们去翡翠城。”"], ["c19-013", "多萝西说。"]]}, {"t": "img", "src": "images/84.webp?v=5de7d12eb8", "vid": "images/84.mp4?v=b81311d0ce", "cap": "飞猴托着大家在天上飞", "n": 70}, {"t": "p", "s": [["c19-014", "飞猴们托着大家，在天上飞。"], ["c19-015", "路上，猴王讲起了金帽子的故事。"]]}, {"t": "img", "src": "images/85.webp?v=72ac035521", "vid": "images/85.mp4?v=464ecb106c", "cap": "猴王的爷爷把王子扔进了河里", "n": 71}, {"t": "p", "s": [["c19-016", "很久以前，飞猴们自由自在，非常淘气。"], ["c19-017", "有一位美丽的公主叫盖勒特，她嫁给了一个英俊的王子。"], ["c19-018", "猴王的爷爷和王子开了一个大玩笑，把穿着漂亮衣服的王子扔进了河里。"]]}, {"t": "p", "s": [["c19-019", "公主生气了。"], ["c19-020", "她把这顶金帽子作为结婚礼物送给了王子，从此，金帽子的主人可以命令飞猴做三件事。"]]}, {"t": "p", "s": [["c19-021", "多萝西说：“原来是这样啊。"], ["c19-022", "那你们一定很想要回自由吧。”"]]}]}, {"title": "第二十章　奥兹的秘密", "head": "c20-h", "audio": "audio/ch20.m4a?v=6c0cf2f926", "duration": 79.278, "times": {"c20-h": [0.0, 2.386], "c20-001": [3.386, 7.249], "c20-002": [7.599, 12.76], "c20-003": [13.61, 18.39], "c20-004": [18.74, 22.255], "c20-005": [23.105, 27.863], "c20-006": [30.874, 34.236], "c20-007": [35.086, 35.784], "c20-008": [36.134, 37.358], "c20-009": [38.208, 47.494], "c20-010": [47.844, 51.929], "c20-011": [52.779, 69.435], "c20-012": [70.285, 77.778]}, "blocks": [{"t": "p", "s": [["c20-001", "他们回到翡翠城，去找奥兹兑现他的承诺。"], ["c20-002", "可是这一次，宫殿里什么也看不见，只听见一个声音。"]]}, {"t": "p", "s": [["c20-003", "那个声音说：“我需要时间好好想一想，你们明天再来吧。”"], ["c20-004", "狮子气得大吼一声，托托也被吓了一跳。"]]}, {"t": "img", "src": "images/47.webp?v=60d2d6af71", "vid": "images/47.mp4?v=8eaf72bceb", "cap": "托托撞倒了屏风", "n": 72}, {"t": "p", "s": [["c20-005", "就在这时，托托跑到墙角，一下子撞倒了一扇屏风。"], ["c20-006", "屏风后面，站着一个秃顶的小老头。"]]}, {"t": "p", "s": [["c20-007", "“你是谁？”"], ["c20-008", "大家吃惊地问。"]]}, {"t": "p", "s": [["c20-009", "小老头不好意思地说：“我就是伟大的奥兹，其实，我不是什么魔法师，只是一个会变戏法的普通人。"], ["c20-010", "很多年前，我坐着热气球，被大风吹到了这里。”"]]}, {"t": "img", "src": "images/86.webp?v=e2da668c7d", "vid": "images/86.mp4?v=8b22bd777a", "cap": "原来全是戏法", "n": 73}, {"t": "p", "s": [["c20-011", "原来，那个大脑袋是用纸糊的，用一根细线吊在半空中；那位仙女，是奥兹穿上了漂亮的衣服、戴上了面具；那头怪兽是用兽皮缝起来的；那个大火球，是一个浇上了油的棉花球。"]]}, {"t": "p", "s": [["c20-012", "奥兹还说，翡翠城其实并没有那么绿，只是因为大家都戴着绿眼镜，所以看什么都是绿的。"]]}]}, {"title": "第二十一章　奥兹的礼物", "head": "c21-h", "audio": "audio/ch21.m4a?v=04980eca6f", "duration": 49.576, "times": {"c21-h": [0.0, 2.7], "c21-001": [3.7, 5.163], "c21-002": [5.513, 9.172], "c21-003": [10.022, 15.125], "c21-004": [15.475, 19.456], "c21-005": [19.806, 24.558], "c21-006": [25.408, 32.295], "c21-007": [33.145, 37.84], "c21-008": [38.19, 45.292], "c21-009": [45.642, 48.076]}, "blocks": [{"t": "p", "s": [["c21-001", "大家都很失望。"], ["c21-002", "可是奥兹说：“别着急，我想办法帮帮你们。”"]]}, {"t": "img", "src": "images/48.webp?v=8a23289708", "vid": "images/48.mp4?v=f097fc7b6c", "cap": "奥兹送给他们的礼物", "n": 74}, {"t": "p", "s": [["c21-003", "他在稻草人的脑袋里装上了糠和针，说：“这是新的脑子。”"], ["c21-004", "他在铁皮人的胸口放进了一颗丝绸做的心。"], ["c21-005", "他又给狮子喝了一碗绿色的饮料，说：“这就是勇气。”"]]}, {"t": "p", "s": [["c21-006", "稻草人觉得自己聪明多了，铁皮人觉得心里暖暖的，狮子觉得自己什么都不怕了。"]]}, {"t": "p", "s": [["c21-007", "奥兹却偷偷地想：“他们想要的东西，其实一路上早就有了。"], ["c21-008", "稻草人每次都能想出好办法，铁皮人比谁都善良，狮子每次都冲在最前面。"], ["c21-009", "我只不过让他们相信了这一点。”"]]}]}, {"title": "第二十二章　热气球", "head": "c22-h", "audio": "audio/ch22.m4a?v=211c073848", "duration": 57.945, "times": {"c22-h": [0.0, 2.528], "c22-001": [3.528, 8.704], "c22-002": [9.554, 14.46], "c22-003": [14.81, 18.133], "c22-004": [18.983, 23.396], "c22-005": [23.746, 27.185], "c22-006": [28.035, 29.863], "c22-007": [30.213, 34.299], "c22-008": [34.649, 36.426], "c22-009": [37.276, 43.046], "c22-010": [43.896, 44.348], "c22-011": [44.698, 45.649], "c22-012": [45.999, 47.257], "c22-013": [48.107, 50.017], "c22-014": [50.367, 51.94], "c22-015": [52.29, 56.445]}, "blocks": [{"t": "p", "s": [["c22-001", "奥兹说：“我也想回到家乡去，我们一起坐热气球走吧，多萝西。”"]]}, {"t": "img", "src": "images/49.webp?v=593fd423f7", "vid": "images/49.mp4?v=d89d34616b", "cap": "缝一个大大的热气球", "n": 75}, {"t": "p", "s": [["c22-002", "他和多萝西用绿色的绸布，缝成了一个大大的热气球。"], ["c22-003", "出发的那天，全城的人都来送行。"]]}, {"t": "img", "src": "images/87.webp?v=836288ca84", "vid": "images/87.mp4?v=d26926de1b", "cap": "奥兹在热气球上告别", "n": 76}, {"t": "p", "s": [["c22-004", "奥兹站在篮子里，对大家说：“我要去看望我的兄弟了。"], ["c22-005", "我不在的时候，就由稻草人来管理翡翠城。”"]]}, {"t": "img", "src": "images/50.webp?v=a4ea6e404a", "vid": "images/50.mp4?v=a5a97919c4", "cap": "托托追着小猫跑开了", "n": 77}, {"t": "p", "s": [["c22-006", "奥兹先坐进了篮子里。"], ["c22-007", "可是就在这时，托托追着一只小猫跑开了。"], ["c22-008", "多萝西赶紧去追托托。"]]}, {"t": "img", "src": "images/51.webp?v=e60ea745d5", "vid": "images/51.mp4?v=451526b88e", "cap": "热气球升上了天空", "n": 78}, {"t": "p", "s": [["c22-009", "等她抱着托托跑回来，绳子已经断了，热气球慢慢地升上了天空。"]]}, {"t": "p", "s": [["c22-010", "“回来！"], ["c22-011", "我也要走！”"], ["c22-012", "多萝西大喊。"]]}, {"t": "p", "s": [["c22-013", "“我回不来啦，再见！”"], ["c22-014", "奥兹在天上喊。"], ["c22-015", "热气球越飞越高，越飞越远，再也看不见了。"]]}]}, {"title": "第二十三章　会打人的树", "head": "c23-h", "audio": "audio/ch23.m4a?v=8e19543d25", "duration": 45.75, "times": {"c23-h": [0.0, 2.493], "c23-001": [3.493, 5.396], "c23-002": [5.745, 11.681], "c23-003": [12.531, 16.453], "c23-004": [16.803, 20.416], "c23-005": [21.266, 29.346], "c23-006": [29.696, 32.616], "c23-007": [33.466, 40.692], "c23-008": [41.042, 44.25]}, "blocks": [{"t": "img", "src": "images/52.webp?v=780cf10c1e", "vid": "images/52.mp4?v=3bfeef515e", "cap": "多萝西伤心地哭了", "n": 79}, {"t": "p", "s": [["c23-001", "多萝西伤心地哭了。"], ["c23-002", "翡翠城的士兵告诉她：“去找南方的好女巫格林达吧，她也许能帮你回家。”"]]}, {"t": "p", "s": [["c23-003", "稻草人、铁皮人和狮子都说：“我们陪你一起去！”"], ["c23-004", "他们告别了翡翠城的人们，往南边走去。"]]}, {"t": "img", "src": "images/88.webp?v=458dccac86", "vid": "images/88.mp4?v=a18a52bb46", "cap": "会打人的大树把稻草人扔了出去", "n": 80}, {"t": "p", "s": [["c23-005", "他们走进一片树林，第一棵大树就伸出长长的树枝，一下子把稻草人卷了起来，扔了出去。"], ["c23-006", "另一棵树又把稻草人扔了回来！"]]}, {"t": "p", "s": [["c23-007", "铁皮人举起斧头，朝那根树枝砍了下去，大树疼得直发抖，再也不敢动了。"], ["c23-008", "大家赶紧穿过了这片会打人的树林。"]]}]}, {"title": "第二十四章　瓷器国", "head": "c24-h", "audio": "audio/ch24.m4a?v=2a03c034a6", "duration": 78.539, "times": {"c24-h": [0.0, 2.656], "c24-001": [3.656, 6.347], "c24-002": [6.697, 14.371], "c24-003": [15.221, 22.79], "c24-004": [23.14, 27.798], "c24-005": [28.648, 32.536], "c24-006": [32.886, 37.138], "c24-007": [37.488, 39.945], "c24-008": [40.795, 48.445], "c24-009": [49.295, 51.697], "c24-010": [52.047, 60.022], "c24-011": [60.872, 65.355], "c24-012": [66.205, 69.126], "c24-013": [69.476, 77.039]}, "blocks": [{"t": "img", "src": "images/89.webp?v=280eb8cd85", "vid": "images/89.mp4?v=8e6feaeef5", "cap": "墙那边是一个瓷器做的国家", "n": 81}, {"t": "p", "s": [["c24-001", "树林外面是一堵高高的白墙。"], ["c24-002", "稻草人做了一架梯子，大家爬上墙头往下一看，啊，墙那边是一个用瓷器做成的国家！"]]}, {"t": "p", "s": [["c24-003", "地面像盘子底一样光滑雪白，房子、篱笆、牛和羊，全都是瓷做的。"], ["c24-004", "瓷做的挤奶姑娘，正在给瓷做的小牛挤奶。"]]}, {"t": "img", "src": "images/90.webp?v=ba5e1df0c3", "vid": "images/90.mp4?v=3c72141391", "cap": "瓷做的小牛踢翻了奶桶", "n": 82}, {"t": "p", "s": [["c24-005", "小牛一脚踢翻了奶桶，自己也摔断了一条腿。"], ["c24-006", "挤奶姑娘生气地说：“你们看，都是你们吓着了我的牛！"], ["c24-007", "我得带它去修补店，把腿粘起来。”"]]}, {"t": "img", "src": "images/91.webp?v=bb23179f8e", "vid": "images/91.mp4?v=47880d65fc", "cap": "美丽的瓷公主", "n": 83}, {"t": "p", "s": [["c24-008", "多萝西看见了一位美丽的瓷公主，想把她带回堪萨斯，摆在艾姆婶婶的壁炉台上。"]]}, {"t": "p", "s": [["c24-009", "瓷公主说：“请不要这样。"], ["c24-010", "在我们的国家里，我们可以自由地走动、说话；要是被带走了，我们就只能僵硬地站着，给人看。”"]]}, {"t": "p", "s": [["c24-011", "多萝西说：“对不起，我一点儿也不想让你不开心。”"]]}, {"t": "p", "s": [["c24-012", "他们小心翼翼地穿过瓷器国。"], ["c24-013", "狮子的尾巴一不小心扫倒了一座瓷教堂，大家都很难过，可是谁也不敢停下来。"]]}]}, {"title": "第二十五章　狮子当了大王", "head": "c25-h", "audio": "audio/ch25.m4a?v=fe00296af3", "duration": 57.456, "times": {"c25-h": [0.0, 3.221], "c25-001": [4.221, 8.356], "c25-002": [8.706, 16.473], "c25-003": [17.323, 21.991], "c25-004": [22.341, 31.273], "c25-005": [32.123, 33.39], "c25-006": [33.74, 34.64], "c25-007": [35.49, 42.502], "c25-008": [42.852, 45.567], "c25-009": [46.417, 49.108], "c25-010": [49.458, 55.956]}, "blocks": [{"t": "img", "src": "images/92.webp?v=9ff4c0ffda", "vid": "images/92.mp4?v=089bf0a951", "cap": "森林里的动物大会", "n": 84}, {"t": "p", "s": [["c25-001", "过了瓷器国，他们走进了一片古老的大森林。"], ["c25-002", "森林里聚着成千上万的动物：老虎、大象、熊、狼、狐狸，正在开大会。"]]}, {"t": "p", "s": [["c25-003", "一只大老虎走过来，对狮子说：“欢迎你，万兽之王！"], ["c25-004", "求求你帮帮我们，森林里来了一只大怪物，它是一只比大象还大的大蜘蛛，长着八条长腿，把大家都吓坏了。”"]]}, {"t": "p", "s": [["c25-005", "“我去对付它！”"], ["c25-006", "狮子说。"]]}, {"t": "img", "src": "images/93.webp?v=d54d008e93", "vid": "images/93.mp4?v=46483d8e9e", "cap": "狮子打倒了大蜘蛛", "n": 85}, {"t": "p", "s": [["c25-007", "狮子悄悄地走到大蜘蛛睡觉的地方，猛地扑了上去，一巴掌就把大蜘蛛打倒了。"], ["c25-008", "森林里再也没有怪物欺负大家了。"]]}, {"t": "p", "s": [["c25-009", "动物们围着狮子欢呼，向他鞠躬。"], ["c25-010", "狮子说：“等多萝西平平安安地回家了，我就回来做你们的大王。”"]]}]}, {"title": "第二十六章　锤子头", "head": "c26-h", "audio": "audio/ch26.m4a?v=2dcaf29e5f", "duration": 57.329, "times": {"c26-h": [0.0, 2.293], "c26-001": [3.293, 6.139], "c26-002": [6.489, 11.388], "c26-003": [11.738, 17.637], "c26-004": [18.487, 20.245], "c26-005": [20.595, 22.262], "c26-006": [23.112, 31.994], "c26-007": [32.344, 34.945], "c26-008": [35.795, 38.029], "c26-009": [38.379, 39.54], "c26-010": [40.39, 47.736], "c26-011": [52.312, 55.829]}, "blocks": [{"t": "img", "src": "images/94.webp?v=32f93e8ac0", "vid": "images/94.mp4?v=ae10ae8fb8", "cap": "石头山上的锤子头", "n": 86}, {"t": "p", "s": [["c26-001", "他们来到了一座很陡的石头山前面。"], ["c26-002", "忽然，山上的岩石后面，冒出了一个奇怪的小矮人。"], ["c26-003", "他的脑袋又大又平，脖子皱巴巴的，可以像弹簧一样伸得很长。"]]}, {"t": "p", "s": [["c26-004", "锤子头喊道：“回去！"], ["c26-005", "这座山是我们的！”"]]}, {"t": "p", "s": [["c26-006", "稻草人刚往上走，锤子头的脖子“嗖”地一伸，脑袋像锤子一样砸了过来，把稻草人撞得滚下了山坡。"], ["c26-007", "狮子冲上去，也被撞了下来。"]]}, {"t": "p", "s": [["c26-008", "铁皮人说：“叫飞猴来帮忙吧！"], ["c26-009", "金帽子还能用呢。”"]]}, {"t": "img", "src": "images/95.webp?v=bcc79d66d0", "vid": "images/95.mp4?v=0bf6213738", "cap": "飞猴抬着狮子飞过石头山", "n": 87}, {"t": "p", "s": [["c26-010", "多萝西念起了咒语，飞猴们又飞来了，抱起大家，一下子就飞过了石头山。"], ["c26-011", "锤子头们只能气呼呼地看着他们飞走。"]]}]}, {"title": "第二十七章　南方的好女巫", "head": "c27-h", "audio": "audio/ch27.m4a?v=1b496c0512", "duration": 85.624, "times": {"c27-h": [0.0, 2.722], "c27-001": [3.722, 7.014], "c27-002": [7.364, 11.541], "c27-003": [12.391, 16.248], "c27-004": [16.598, 22.1], "c27-005": [22.95, 27.806], "c27-006": [28.156, 33.243], "c27-007": [33.593, 36.531], "c27-008": [37.381, 38.193], "c27-009": [38.543, 40.88], "c27-010": [41.73, 43.927], "c27-011": [44.777, 54.427], "c27-012": [55.277, 57.845], "c27-013": [58.195, 68.197], "c27-014": [68.547, 71.531], "c27-015": [71.881, 74.253], "c27-016": [75.103, 84.124]}, "blocks": [{"t": "img", "src": "images/96.webp?v=4abaadc00d", "vid": "images/96.mp4?v=b00cb75302", "cap": "红色的奎德林国", "n": 88}, {"t": "p", "s": [["c27-001", "飞猴们把大家送到了南方的奎德林国。"], ["c27-002", "这里的田野、篱笆和小桥，全都是红色的。"]]}, {"t": "img", "src": "images/53.webp?v=774a63fa2a", "vid": "images/53.mp4?v=d26fdac775", "cap": "又走了很远很远的路", "n": 89}, {"t": "p", "s": [["c27-003", "朋友们陪着多萝西，又走了很远很远的路。"], ["c27-004", "他们穿过红色的田野，翻过小山，终于来到了格林达的城堡。"]]}, {"t": "img", "src": "images/54.webp?v=de03d657e4", "vid": "images/54.mp4?v=372fd33421", "cap": "南方的好女巫格林达", "n": 90}, {"t": "p", "s": [["c27-005", "格林达是一位红头发的美丽女巫，穿着雪白的长裙。"], ["c27-006", "她温柔地说：“孩子，其实，你一直都有回家的办法。"], ["c27-007", "你脚上的银鞋子，能把你带到任何地方。”"]]}, {"t": "p", "s": [["c27-008", "“真的吗？”"], ["c27-009", "多萝西又惊又喜。"]]}, {"t": "p", "s": [["c27-010", "稻草人说：“要是早知道就好了。”"]]}, {"t": "p", "s": [["c27-011", "格林达笑着说：“可是，如果早知道了，稻草人就不会得到他的脑子，铁皮人就不会得到他的心，狮子也不会得到他的勇气。”"]]}, {"t": "img", "src": "images/97.webp?v=716099ccd6", "vid": "images/97.mp4?v=5da91c76d7", "cap": "格林达把金帽子还给了猴王", "n": 91}, {"t": "p", "s": [["c27-012", "多萝西把金帽子送给了格林达。"], ["c27-013", "格林达用金帽子请飞猴做了最后三件事：把稻草人送回翡翠城，把铁皮人送到温基国，把狮子送回大森林。"], ["c27-014", "然后，她把金帽子还给了猴王。"], ["c27-015", "从此，飞猴们又自由了。"]]}, {"t": "img", "src": "images/55.webp?v=3fadf33b86", "vid": "images/55.mp4?v=b2bb06d7f2", "cap": "三个好朋友都当上了国王", "n": 92}, {"t": "p", "s": [["c27-016", "后来，稻草人当上了翡翠城的国王，铁皮人成了西方国家的国王，狮子做了森林里所有动物的大王。"]]}]}, {"title": "第二十八章　回家", "head": "c28-h", "audio": "audio/ch28.m4a?v=bcf61cb996", "duration": 188.762, "times": {"c28-h": [0.0, 2.251], "c28-001": [3.251, 5.985], "c28-002": [6.335, 12.848], "c28-003": [13.698, 21.849], "c28-004": [25.46, 30.947], "c28-005": [31.797, 36.265], "c28-006": [36.615, 41.049], "c28-007": [41.399, 45.268], "c28-008": [46.118, 52.144], "c28-009": [52.994, 57.116], "c28-010": [57.466, 59.032], "c28-011": [59.882, 63.648], "c28-012": [63.998, 67.117], "c28-013": [67.967, 69.052], "song-home": [70.252, 76.252], "song-home-01": [76.252, 80.292], "song-home-02": [81.592, 86.292], "song-home-03": [87.352, 91.712], "song-home-04": [91.712, 96.392], "song-home-05": [98.532, 103.252], "song-home-06": [104.832, 108.992], "song-home-07": [110.492, 114.672], "song-home-08": [114.672, 120.792], "song-home-09": [122.612, 128.852], "song-home-10": [128.852, 133.872], "song-home-11": [133.872, 139.892], "song-home-12": [140.412, 144.832], "song-home-13": [149.772, 153.272], "song-home-14": [155.092, 158.582], "song-home-15": [159.972, 166.032], "song-home-16": [166.032, 171.092], "song-home-17": [171.092, 177.112], "song-home-18": [177.252, 181.912]}, "blocks": [{"t": "img", "src": "images/56.webp?v=a1c671e2c4", "vid": "images/56.mp4?v=b7ed3652c8", "cap": "和朋友们一一拥抱告别", "n": 93}, {"t": "p", "s": [["c28-001", "多萝西和朋友们一一拥抱告别。"], ["c28-002", "稻草人、铁皮人和狮子都舍不得她，铁皮人的眼泪又差点儿让自己生了锈。"]]}, {"t": "img", "src": "images/57.webp?v=1e4cbfd6e4", "vid": "images/57.mp4?v=9e18f0ecda", "cap": "鞋跟轻轻地碰了三下", "n": 94}, {"t": "p", "s": [["c28-003", "多萝西抱起托托，把两只鞋跟轻轻地碰了三下，说：“带我回家，回到艾姆婶婶身边去！”"]]}, {"t": "img", "src": "images/58.webp?v=c7fd60c8ce", "vid": "images/58.mp4?v=dfe3f0c953", "cap": "她在空中飞了起来", "n": 95}, {"t": "p", "s": [["c28-004", "一眨眼，她就在空中飞了起来，耳边只听见呼呼的风声。"]]}, {"t": "img", "src": "images/59.webp?v=7ab033081f", "vid": "images/59.mp4?v=cb18d213a2", "cap": "亨利叔叔盖好了一座新房子", "n": 96}, {"t": "p", "s": [["c28-005", "等她站稳了，眼前又是一望无际的堪萨斯大草原。"], ["c28-006", "亨利叔叔已经盖好了一座新房子，正在挤牛奶。"], ["c28-007", "那双银鞋子在飞行的时候掉了，再也找不到了。"]]}, {"t": "img", "src": "images/60.webp?v=be0c66f4e4", "vid": "images/60.mp4?v=97d8978fff", "cap": "我回家了，我真高兴", "n": 97}, {"t": "p", "s": [["c28-008", "艾姆婶婶正在给白菜浇水，一抬头，看见多萝西朝她跑了过来。"]]}, {"t": "p", "s": [["c28-009", "艾姆婶婶紧紧地抱住她，说：“我的好孩子！"], ["c28-010", "你到底去哪里了？”"]]}, {"t": "p", "s": [["c28-011", "多萝西说：“我去了奥兹国，托托也去了。"], ["c28-012", "艾姆婶婶，我回家了，我真高兴！”"]]}, {"t": "p", "s": [["c28-013", "（完）"]]}, {"t": "song", "title": "哪里都不如家", "head": "song-home", "lines": [["song-home-01", "龙卷风吹走了小木屋"], ["song-home-02", "我落在彩色的远方"], ["song-home-03", "银鞋子踩着黄砖路"], ["song-home-04", "一路有朋友在身旁"], ["song-home-05", "稻草人其实很聪明"], ["song-home-06", "铁皮人的心最善良"], ["song-home-07", "狮子总是冲在前面"], ["song-home-08", "原来想要的早就有了"], ["song-home-09", "碰碰脚跟，一二三"], ["song-home-10", "带我回到家乡"], ["song-home-11", "灰色的草原，灰色的小屋"], ["song-home-12", "哪里都不如家"], ["song-home-13", "艾姆婶婶张开手"], ["song-home-14", "我回来啦"], ["song-home-15", "碰碰脚跟，一二三"], ["song-home-16", "带我回到家乡"], ["song-home-17", "灰色的草原，灰色的小屋"], ["song-home-18", "哪里都不如家"]]}, {"t": "note", "text": "读完以后，可以和孩子聊一聊：稻草人、铁皮人和狮子想要的东西，是奥兹给的，还是他们一路上本来就有的？多萝西为什么说“哪里都不如家好”？如果你也去了奥兹国，你最想和谁做朋友？"}]}], "music": 3, "images": [{"from": "c01-h", "src": "images/01.webp?v=6c9ff8459a", "vid": "images/01.mp4?v=067ac429e1", "cap": "灰色大草原上的小木屋", "n": 1}, {"from": "c01-003", "src": "images/61.webp?v=ef30578fed", "vid": "images/61.mp4?v=97f469e4c4", "cap": "灰色的草原，灰色的叔叔婶婶", "n": 2}, {"from": "c01-007", "src": "images/02.webp?v=237904fdec", "vid": "images/02.mp4?v=5570384153", "cap": "托托逗得多萝西哈哈大笑", "n": 3}, {"from": "c01-008", "src": "images/03.webp?v=6ddfd941ad", "vid": "images/03.mp4?v=1d7dc7b06c", "cap": "天空突然变得黑沉沉的", "n": 4}, {"from": "c01-012", "src": "images/04.webp?v=94e1145b5c", "vid": "images/04.mp4?v=336160f6ff", "cap": "托托吓得钻到了床底下", "n": 5}, {"from": "c01-014", "src": "images/05.webp?v=8b96df53c9", "vid": "images/05.mp4?v=dd12f02e1f", "cap": "小木屋被龙卷风举了起来", "n": 6}, {"from": "c01-016", "src": "images/06.webp?v=7894fb8820", "vid": "i
