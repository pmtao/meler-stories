<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 24px; }
.versions a, .versions span { font-size: 13px; padding: 5px 14px; border-radius: 999px; color: #fff; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, .5); background: rgba(8, 25, 40, .3); }
.versions a:hover { background: rgba(8, 25, 40, .55); }
.versions[hidden] { display: none; }
.versions .on { background: #fff; color: #123f55; border-color: #fff; font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }
/* 书末的「欣赏插曲」：全书插曲的播放列表 */
.songlist { margin: 40px 0 0; padding: 24px 18px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.songlist h3 { margin: 0 0 4px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 24px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; }
.songlist .sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
.btn-song { background: var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.songlist ol { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px; text-align: left; counter-reset: song; }
.songlist li button { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  text-align: left; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.songlist li button::before { counter-increment: song; content: counter(song); grid-row: span 2; color: var(--sea); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.songlist li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.songlist li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.songlist .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 进度条：深色是已播放，浅色是已经下载好的部分（--seek-bg 由 paintSeek() 按 audio.buffered 算），网络慢时一眼看出还要等多久 */
.seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 8px 0 6px; height: 18px;
  background: transparent; cursor: pointer; --seek-bg: var(--line); }
.seek::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border: 0;
  border-radius: 50%; background: var(--sea); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--sea);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
/* 缓冲中：播放键外圈转圈 */
.play { position: relative; }
.play::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent;
  border-top-color: var(--sea); border-right-color: var(--sea); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.buffering .play::after { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="versions" id="versions" hidden></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>
<div class="toast" id="toast"></div>

<script>
const BOOK = {"id": "thumbelina", "title": "拇指姑娘", "intro": "根据安徒生童话《拇指姑娘》改写，适合 5 到 10 岁的小朋友和爸爸妈妈一起读、一起听。", "kicker": "安徒生童话", "cover": "images/05.webp?v=f6f728b734", "voice": "Maia（知性温柔的姐姐），本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "第一章　郁金香里的小姑娘", "head": "c01-h", "audio": "audio/ch01.m4a?v=768d5abfe8", "duration": 69.044, "times": {"c01-h": [0.0, 4.005], "c01-001": [5.005, 10.973], "c01-002": [11.823, 17.068], "c01-003": [17.918, 23.074], "c01-004": [23.424, 27.86], "c01-005": [28.71, 32.775], "c01-006": [33.125, 43.251], "c01-007": [44.101, 45.139], "c01-008": [45.489, 49.716], "c01-009": [50.566, 53.924], "c01-010": [55.993, 63.237], "c01-011": [64.087, 67.544]}, "blocks": [{"t": "img", "src": "images/01.webp?v=14d38e093a", "vid": "images/01.mp4?v=033dc56067", "cap": "妇人想要一个孩子", "n": 1}, {"t": "p", "s": [["c01-001", "从前，有一位善良的妇人，她非常想要一个孩子，可是一直没有。"]]}, {"t": "img", "src": "images/02.webp?v=44e971850a", "vid": "images/02.mp4?v=b9a760cd19", "cap": "老婆婆的大麦粒", "n": 2}, {"t": "p", "s": [["c01-002", "有一天，她去找一位住在村口的老婆婆，问她有没有什么办法。"]]}, {"t": "p", "s": [["c01-003", "老婆婆笑眯眯地拿出一颗大麦粒：“这可不是普通的大麦粒。"], ["c01-004", "你把它种在花盆里，看看会长出什么来吧。”"]]}, {"t": "img", "src": "images/03.webp?v=67f3093beb", "vid": "images/03.mp4?v=7abdad1021", "cap": "花盆里的郁金香花苞", "n": 3}, {"t": "p", "s": [["c01-005", "妇人谢过老婆婆，回家把大麦粒种进了花盆里。"], ["c01-006", "很快，花盆里就长出了一朵美丽的大花，看起来像一朵郁金香，花瓣紧紧地合在一起，像一个小小的花苞。"]]}, {"t": "img", "src": "images/04.webp?v=15d5249e5a", "vid": "images/04.mp4?v=7e673e04d4", "cap": "轻轻的一吻", "n": 4}, {"t": "p", "s": [["c01-007", "“多美的花呀！”"], ["c01-008", "妇人说着，在红黄相间的花瓣上轻轻地吻了一下。"]]}, {"t": "img", "src": "images/05.webp?v=f6f728b734", "vid": "images/05.mp4?v=d1861e20f8", "cap": "花心里的小姑娘", "n": 5}, {"t": "p", "s": [["c01-009", "就在这时，花苞“啪”的一声张开了。"], ["c01-010", "花心里，坐着一个小小的姑娘，她又白嫩又漂亮，可是只有大拇指那么高。"]]}, {"t": "p", "s": [["c01-011", "妇人高兴极了，给她取名叫“拇指姑娘”。"]]}]}, {"title": "第二章　胡桃壳做的小摇篮", "head": "c02-h", "audio": "audio/ch02.m4a?v=7f8217ff25", "duration": 92.16, "times": {"c02-h": [0.0, 2.854], "c02-001": [3.854, 9.192], "c02-002": [9.542, 13.745], "c02-003": [14.595, 20.7], "c02-004": [21.05, 28.582], "c02-005": [29.432, 31.169], "song-boat-song": [32.369, 38.369], "song-boat-song-01": [38.369, 42.709], "song-boat-song-02": [44.609, 48.829], "song-boat-song-03": [51.289, 54.829], "song-boat-song-04": [54.929, 61.769], "song-boat-song-05": [62.749, 66.409], "song-boat-song-06": [66.409, 69.329], "song-boat-song-07": [69.329, 72.549], "song-boat-song-08": [72.549, 74.869], "c02-006": [81.069, 85.387], "c02-007": [86.237, 90.66]}, "blocks": [{"t": "img", "src": "images/06.webp?v=65f5c9a51b", "vid": "images/06.mp4?v=87d8aae8d2", "cap": "胡桃壳摇篮", "n": 6}, {"t": "p", "s": [["c02-001", "妇人用一个擦得亮亮的胡桃壳，给拇指姑娘做了一张小摇篮。"], ["c02-002", "紫罗兰的花瓣是她的褥子，玫瑰花瓣是她的被子。"]]}, {"t": "img", "src": "images/07.webp?v=6b83366f91", "vid": "images/07.mp4?v=d6c0945e28", "cap": "花瓣小船", "n": 7}, {"t": "p", "s": [["c02-003", "白天，妇人在桌子上放一盘清水，水面上漂着一片郁金香的花瓣。"], ["c02-004", "拇指姑娘坐在花瓣上，用两根白色的马鬃当船桨，从盘子这一边划到那一边。"]]}, {"t": "img", "src": "images/08.webp?v=8068d79f0b", "vid": "images/08.mp4?v=f0f56e9f9a", "cap": "又轻又甜的歌声", "n": 8}, {"t": "p", "s": [["c02-005", "她一边划，一边唱歌。"]]}, {"t": "song", "title": "花瓣小船", "head": "song-boat-song", "lines": [["song-boat-song-01", "小小的我坐在花瓣上"], ["song-boat-song-02", "花瓣是我的小船"], ["song-boat-song-03", "划呀划呀轻轻地划"], ["song-boat-song-04", "水面上闪着月光"], ["song-boat-song-05", "啦啦啦，我小小的"], ["song-boat-song-06", "比拇指还要小一点"], ["song-boat-song-07", "可是我的歌儿大大的"], ["song-boat-song-08", "能飞到天边"]]}, {"t": "p", "s": [["c02-006", "她的歌声又轻又甜，谁也没有听过这么好听的歌声。"]]}, {"t": "img", "src": "images/09.webp?v=a4dc6ab8d2", "vid": "images/09.mp4?v=fe0ecd8870", "cap": "甜甜地睡着了", "n": 9}, {"t": "p", "s": [["c02-007", "晚上，拇指姑娘就躺在胡桃壳里，甜甜地睡着了。"]]}]}, {"title": "第三章　癞蛤蟆妈妈", "head": "c03-h", "audio": "audio/ch03.m4a?v=86ff09b3b4", "duration": 52.319, "times": {"c03-h": [0.0, 2.789], "c03-001": [3.789, 12.921], "c03-002": [13.771, 18.025], "c03-003": [18.375, 19.592], "c03-004": [20.442, 27.519], "c03-005": [28.369, 31.034], "c03-006": [31.384, 36.568], "c03-007": [37.418, 41.709], "c03-008": [42.059, 47.75], "c03-009": [48.1, 50.819]}, "blocks": [{"t": "img", "src": "images/10.webp?v=0e9e2f34e7", "vid": "images/10.mp4?v=5f4f20f723", "cap": "窗外跳进来的癞蛤蟆", "n": 10}, {"t": "p", "s": [["c03-001", "一天夜里，拇指姑娘正睡在摇篮里，一只又大又丑、湿漉漉的癞蛤蟆，从破了的窗玻璃跳了进来。"]]}, {"t": "p", "s": [["c03-002", "“这个小姑娘真漂亮，正好给我的儿子做媳妇！”"], ["c03-003", "癞蛤蟆妈妈说。"]]}, {"t": "img", "src": "images/11.webp?v=0624cd88c0", "vid": "images/11.mp4?v=d272ec0173", "cap": "抢走了胡桃壳", "n": 11}, {"t": "p", "s": [["c03-004", "她一把抓起拇指姑娘睡觉的胡桃壳，跳出窗子，一直跳到了花园外面的小河边。"]]}, {"t": "img", "src": "images/12.webp?v=c36cc7f211", "vid": "images/12.mp4?v=0b46cac8a9", "cap": "呱呱叫的儿子", "n": 12}, {"t": "p", "s": [["c03-005", "癞蛤蟆妈妈的儿子长得和她一样丑。"], ["c03-006", "他一看见胡桃壳里的拇指姑娘，就“呱呱，呱呱呱”地叫个不停。"]]}, {"t": "img", "src": "images/13.webp?v=ed96642168", "vid": "images/13.mp4?v=e9f2627003", "cap": "放到睡莲叶上", "n": 13}, {"t": "p", "s": [["c03-007", "癞蛤蟆妈妈说：“小声点，别把她吵醒了！"], ["c03-008", "我们把她放到河中间的睡莲叶子上，她那么小，一定跑不掉。"], ["c03-009", "我们先去泥巴底下把新房收拾好。”"]]}]}, {"title": "第四章　睡莲叶上的眼泪", "head": "c04-h", "audio": "audio/ch04.m4a?v=32ecf9c1df", "duration": 55.872, "times": {"c04-h": [0.0, 3.002], "c04-001": [4.002, 6.748], "c04-002": [7.098, 15.543], "c04-003": [16.393, 23.208], "c04-004": [23.558, 26.485], "c04-005": [27.335, 30.078], "c04-006": [30.928, 35.501], "c04-007": [35.851, 38.516], "c04-008": [39.366, 42.82], "c04-009": [43.17, 48.099], "c04-010": [48.949, 54.372]}, "blocks": [{"t": "img", "src": "images/14.webp?v=f756da3030", "vid": "images/14.mp4?v=cf11cc112a", "cap": "睡莲叶上的眼泪", "n": 14}, {"t": "p", "s": [["c04-001", "第二天一早，拇指姑娘醒了过来。"], ["c04-002", "她发现自己坐在一片大大的绿叶子上，四面都是水，怎么也回不到岸上去了，就伤心地哭了起来。"]]}, {"t": "img", "src": "images/15.webp?v=99a8ad66cd", "vid": "images/15.mp4?v=de66a17cdb", "cap": "癞蛤蟆来提亲", "n": 15}, {"t": "p", "s": [["c04-003", "癞蛤蟆妈妈带着儿子游了过来，对她说：“这是我的儿子，以后就是你的丈夫了。"], ["c04-004", "你们会在泥巴底下过上舒服的日子！”"]]}, {"t": "p", "s": [["c04-005", "儿子只会说：“呱呱，呱呱呱！”"]]}, {"t": "p", "s": [["c04-006", "拇指姑娘一点儿也不想住在泥巴里，更不想嫁给一只癞蛤蟆。"], ["c04-007", "她坐在绿叶子上，哭得更伤心了。"]]}, {"t": "img", "src": "images/16.webp?v=4d411add9a", "vid": "images/16.mp4?v=bb3af4e2f1", "cap": "小鱼们探出头来", "n": 16}, {"t": "p", "s": [["c04-008", "水里的小鱼们听见了，都探出头来看她。"], ["c04-009", "它们觉得这个小姑娘太可爱了，不能让她嫁给丑陋的癞蛤蟆。"]]}, {"t": "img", "src": "images/17.webp?v=9d4f18b99b", "vid": "images/17.mp4?v=d8f7a92260", "cap": "咬断睡莲的茎", "n": 17}, {"t": "p", "s": [["c04-010", "于是，小鱼们游到叶子下面，用牙齿把睡莲的茎咬断了。"]]}]}, {"title": "第五章　顺水漂流", "head": "c05-h", "audio": "audio/ch05.m4a?v=bfac727766", "duration": 40.351, "times": {"c05-h": [0.0, 2.508], "c05-001": [3.508, 10.784], "c05-002": [11.634, 13.801], "c05-003": [14.151, 19.442], "c05-004": [20.292, 25.809], "c05-005": [26.159, 31.455], "c05-006": [32.305, 38.851]}, "blocks": [{"t": "img", "src": "images/18.webp?v=a8b49257ef", "vid": "images/18.mp4?v=8ff5296f91", "cap": "顺水漂流", "n": 18}, {"t": "p", "s": [["c05-001", "绿叶子带着拇指姑娘，顺着小河漂走了，漂得远远的，癞蛤蟆再也追不上了。"]]}, {"t": "img", "src": "images/19.webp?v=a9bb0dfc92", "vid": "images/19.mp4?v=c62808e170", "cap": "小鸟们在唱歌", "n": 19}, {"t": "p", "s": [["c05-002", "小河两岸的风景真美呀。"], ["c05-003", "灌木丛里的小鸟看见她，都唱着：“多可爱的小姑娘！”"]]}, {"t": "img", "src": "images/20.webp?v=a22bd09b06", "vid": "images/20.mp4?v=e27f205e54", "cap": "系住白蝴蝶", "n": 20}, {"t": "p", "s": [["c05-004", "一只白色的小蝴蝶，绕着她飞来飞去，最后停在了叶子上。"], ["c05-005", "拇指姑娘解下自己的腰带，一头系在蝴蝶身上，一头系在叶子上。"]]}, {"t": "img", "src": "images/21.webp?v=4ef360dc56", "vid": "images/21.mp4?v=ce1946a630", "cap": "蝴蝶拉的小船", "n": 21}, {"t": "p", "s": [["c05-006", "蝴蝶扇动翅膀，绿叶子就像一条小船，在阳光下飞快地向前漂去。"]]}]}, {"title": "第六章　金龟子先生", "head": "c06-h", "audio": "audio/ch06.m4a?v=640fb9b225", "duration": 65.952, "times": {"c06-h": [0.0, 2.336], "c06-001": [3.336, 5.874], "c06-002": [6.224, 12.699], "c06-003": [16.783, 23.056], "c06-004": [23.906, 31.91], "c06-005": [32.76, 36.635], "c06-006": [36.985, 43.088], "c06-007": [43.938, 45.267], "c06-008": [46.117, 50.161], "c06-009": [51.011, 53.885], "c06-010": [54.235, 58.446], "c06-011": [59.296, 64.452]}, "blocks": [{"t": "img", "src": "images/22.webp?v=514aa6cf28", "vid": "images/22.mp4?v=a0d94d57f6", "cap": "被金龟子抱走", "n": 22}, {"t": "p", "s": [["c06-001", "这时，一只大金龟子飞了过来。"], ["c06-002", "他一看见拇指姑娘，就用爪子抱住她纤细的腰，“呼”地一下飞到了一棵大树上。"]]}, {"t": "p", "s": [["c06-003", "拇指姑娘吓坏了，可是她更担心那只白蝴蝶，因为它还被腰带拴在叶子上呢。"]]}, {"t": "img", "src": "images/23.webp?v=c5c431b676", "vid": "images/23.mp4?v=53b42d1223", "cap": "大树叶上的花蜜", "n": 23}, {"t": "p", "s": [["c06-004", "金龟子请她坐在一片最大的树叶上，给她吃花蜜，还说她长得真漂亮，虽然一点儿也不像金龟子。"]]}, {"t": "img", "src": "images/24.webp?v=bc5fcc8dec", "vid": "images/24.mp4?v=a5bba6c452", "cap": "金龟子小姐们", "n": 24}, {"t": "p", "s": [["c06-005", "不一会儿，住在树上的金龟子们都来看她了。"], ["c06-006", "金龟子小姐们耸了耸触角，说：“哎呀，她只有两条腿，真难看！”"]]}, {"t": "p", "s": [["c06-007", "“她连触角都没有！”"]]}, {"t": "p", "s": [["c06-008", "“她的腰那么细，一点儿也不像我们，太丑了！”"]]}, {"t": "p", "s": [["c06-009", "其实，拇指姑娘长得非常美丽。"], ["c06-010", "可是大家都说她丑，抱她来的金龟子也就不想要她了。"]]}, {"t": "img", "src": "images/25.webp?v=7725e78d60", "vid": "images/25.mp4?v=4bdd8dfb07", "cap": "被丢在雏菊上", "n": 25}, {"t": "p", "s": [["c06-011", "他带着拇指姑娘飞下大树，把她放在一朵雏菊上，就自己飞走了。"]]}]}, {"title": "第七章　一个人的夏天", "head": "c07-h", "audio": "audio/ch07.m4a?v=c1e62487f0", "duration": 47.819, "times": {"c07-h": [0.0, 2.647], "c07-001": [3.647, 7.975], "c07-002": [8.825, 15.139], "c07-003": [15.489, 19.067], "c07-004": [19.918, 22.294], "c07-005": [22.644, 24.742], "c07-006": [25.592, 33.935], "c07-007": [34.785, 36.946], "c07-008": [37.296, 43.12], "c07-009": [43.47, 46.319]}, "blocks": [{"t": "p", "s": [["c07-001", "整个夏天，拇指姑娘一个人住在大森林里。"]]}, {"t": "img", "src": "images/26.webp?v=63978331e9", "vid": "images/26.mp4?v=b472cefad6", "cap": "草叶编的小床", "n": 26}, {"t": "img", "src": "images/27.webp?v=0abd6dcc01", "vid": "images/27.mp4?v=3b5e81f296", "cap": "喝早晨的露水", "n": 27}, {"t": "p", "s": [["c07-002", "她用草叶编了一张小床，挂在一片大牛蒡叶子下面，这样就不会被雨淋湿了。"], ["c07-003", "她吃花里的蜜，喝每天早晨叶子上的露水。"]]}, {"t": "p", "s": [["c07-004", "夏天过去了，秋天也过去了。"], ["c07-005", "漫长寒冷的冬天来了。"]]}, {"t": "img", "src": "images/28.webp?v=799786a2f7", "vid": "images/28.mp4?v=365cf92751", "cap": "秋天来了", "n": 28}, {"t": "p", "s": [["c07-006", "为她唱过歌的小鸟们都飞走了，花儿谢了，大牛蒡叶子也卷了起来，变成了一根枯黄的梗子。"]]}, {"t": "img", "src": "images/29.webp?v=ad5559c520", "vid": "images/29.mp4?v=3b1dd599f6", "cap": "大雪纷飞", "n": 29}, {"t": "p", "s": [["c07-007", "雪花一片一片地落下来。"], ["c07-008", "对拇指姑娘来说，每一片雪花，都像我们被一整铲雪打在身上一样。"], ["c07-009", "她的衣服又薄又破，冻得直发抖。"]]}]}, {"title": "第八章　田鼠太太的家", "head": "c08-h", "audio": "audio/ch08.m4a?v=5bf8c25e90", "duration": 64.959, "times": {"c08-h": [0.0, 2.53], "c08-001": [3.53, 7.42], "c08-002": [7.77, 11.169], "c08-003": [12.019, 14.963], "c08-004": [15.313, 19.695], "c08-005": [20.046, 26.514], "c08-006": [27.364, 35.55], "c08-007": [36.4, 39.116], "c08-008": [39.466, 41.427], "c08-009": [41.777, 44.75], "c08-010": [45.6, 55.438], "c08-011": [56.288, 57.391], "c08-012": [57.741, 63.459]}, "blocks": [{"t": "img", "src": "images/30.webp?v=2e7f148435", "vid": "images/30.mp4?v=f4ced84d65", "cap": "冬天的麦田", "n": 30}, {"t": "p", "s": [["c08-001", "拇指姑娘走出了森林，来到一大片麦田里。"], ["c08-002", "麦子早就收割了，只剩下光秃秃的麦茬。"]]}, {"t": "p", "s": [["c08-003", "她走着走着，来到了一扇小门前。"], ["c08-004", "那是田鼠太太的家，就在麦茬下面的一个小洞里。"], ["c08-005", "洞里又暖和又舒服，有一整间屋子的麦粒，还有一间漂亮的厨房和餐厅。"]]}, {"t": "img", "src": "images/31.webp?v=66ce04f697", "vid": "images/31.mp4?v=d4d6fade60", "cap": "田鼠太太的小门", "n": 31}, {"t": "p", "s": [["c08-006", "拇指姑娘像一个可怜的小乞丐一样，站在门口说：“请您给我一粒大麦吧，我已经两天没有吃东西了。”"]]}, {"t": "img", "src": "images/32.webp?v=64412171c2", "vid": "images/32.mp4?v=6028062059", "cap": "暖和的地下屋子", "n": 32}, {"t": "p", "s": [["c08-007", "田鼠太太是一只心地不坏的老田鼠。"], ["c08-008", "她说：“你这可怜的小东西！"], ["c08-009", "快进来吧，到我暖和的屋子里，和我一起吃饭。”"]]}, {"t": "p", "s": [["c08-010", "田鼠太太很喜欢拇指姑娘，说：“你可以留下来过冬，不过，你要帮我把屋子收拾得干干净净，还要给我讲故事听，我最喜欢听故事了。”"]]}, {"t": "img", "src": "images/33.webp?v=b073293e71", "vid": "images/33.mp4?v=c085a941c9", "cap": "给田鼠太太讲故事", "n": 33}, {"t": "p", "s": [["c08-011", "拇指姑娘答应了。"], ["c08-012", "她每天把屋子收拾得干干净净，给田鼠太太讲故事，日子过得很舒服。"]]}]}, {"title": "第九章　鼹鼠先生", "head": "c09-h", "audio": "audio/ch09.m4a?v=94c9dba8fd", "duration": 60.899, "times": {"c09-h": [0.0, 2.789], "c09-001": [3.789, 7.433], "c09-002": [7.783, 10.412], "c09-003": [10.762, 15.438], "c09-004": [15.788, 18.438], "c09-005": [19.288, 20.468], "c09-006": [20.818, 30.386], "c09-007": [31.236, 33.835], "c09-008": [34.185, 39.825], "c09-009": [40.175, 43.745], "c09-010": [44.595, 54.005], "c09-011": [54.855, 59.399]}, "blocks": [{"t": "p", "s": [["c09-001", "有一天，田鼠太太说：“我们很快就要有客人了。"], ["c09-002", "我的邻居鼹鼠先生，每个星期都来看我一次。"], ["c09-003", "他可有钱啦，穿着黑色的天鹅绒袍子，住的屋子比我的大二十倍。"], ["c09-004", "你要是能嫁给他，这辈子就不用发愁了。”"]]}, {"t": "img", "src": "images/34.webp?v=5e504a2e4b", "vid": "images/34.mp4?v=f12bafafcb", "cap": "鼹鼠先生来做客", "n": 34}, {"t": "p", "s": [["c09-005", "鼹鼠先生来了。"], ["c09-006", "他确实很有钱，也很有学问，可是他从来不喜欢太阳和花儿，还说它们的坏话，因为他从来没有见过它们。"]]}, {"t": "img", "src": "images/35.webp?v=a9e14e4bb1", "vid": "images/35.mp4?v=46477bb130", "cap": "拇指姑娘的歌声", "n": 35}, {"t": "p", "s": [["c09-007", "田鼠太太让拇指姑娘唱歌。"], ["c09-008", "她唱了一首又一首，歌声那么好听，鼹鼠先生立刻爱上了她。"], ["c09-009", "不过他是个很慢性子的人，什么也没有说。"]]}, {"t": "p", "s": [["c09-010", "鼹鼠先生从自己的家里，挖了一条长长的地道，一直通到田鼠太太的家，好让她们随时去他那里散步。"]]}, {"t": "p", "s": [["c09-011", "鼹鼠先生说：“地道里躺着一只死鸟，你们不用害怕。”"]]}]}, {"title": "第十章　地道里的燕子", "head": "c10-h", "audio": "audio/ch10.m4a?v=5e78dee858", "duration": 86.798, "times": {"c10-h": [0.0, 2.982], "c10-001": [3.982, 9.697], "c10-002": [10.547, 18.632], "c10-003": [19.482, 21.082], "c10-004": [21.432, 27.682], "c10-005": [28.532, 30.319], "c10-006": [30.669, 34.97], "c10-007": [35.82, 41.44], "c10-008": [41.79, 49.139], "c10-009": [49.989, 52.861], "c10-010": [53.211, 60.589], "c10-011": [61.439, 64.328], "c10-012": [64.678, 67.364], "c10-013": [68.214, 76.847], "c10-014": [80.901, 82.16], "c10-015": [82.51, 85.298]}, "blocks": [{"t": "img", "src": "images/36.webp?v=b00f2dd844", "vid": "images/36.mp4?v=f0dc946d5a", "cap": "黑黑的地道", "n": 36}, {"t": "p", "s": [["c10-001", "鼹鼠先生用嘴叼着一块会发光的朽木，在黑黑的地道里给她们照路。"]]}, {"t": "p", "s": [["c10-002", "走到那只鸟躺着的地方，鼹鼠先生用鼻子在屋顶上拱了一个洞，阳光从洞里照了进来。"]]}, {"t": "img", "src": "images/37.webp?v=c43ed2fc2f", "vid": "images/37.mp4?v=32740ef0ca", "cap": "冻僵的燕子", "n": 37}, {"t": "p", "s": [["c10-003", "地上躺着一只燕子。"], ["c10-004", "它美丽的翅膀紧紧地贴在身上，脑袋缩进了羽毛里，大概是冻坏了。"]]}, {"t": "p", "s": [["c10-005", "拇指姑娘心里难过极了。"], ["c10-006", "她非常喜欢小鸟，因为它们整个夏天都在为她唱歌。"]]}, {"t": "img", "src": "images/38.webp?v=a3eccd6c87", "vid": "images/38.mp4?v=f5d74b6407", "cap": "鼹鼠踢了踢燕子", "n": 38}, {"t": "p", "s": [["c10-007", "可是鼹鼠先生用他的短腿踢了踢燕子，说：“它再也不会叫了！"], ["c10-008", "生下来做一只小鸟，真是可怜，什么都不会，只会叽叽喳喳地叫，到了冬天就只好饿死。”"]]}, {"t": "img", "src": "images/39.webp?v=392517540c", "vid": "images/39.mp4?v=b75116a969", "cap": "干草编的毯子", "n": 39}, {"t": "p", "s": [["c10-009", "那天夜里，拇指姑娘怎么也睡不着。"], ["c10-010", "她悄悄地爬起来，用干草编了一条又大又暖和的毯子，拿到地道里，盖在燕子身上。"]]}, {"t": "p", "s": [["c10-011", "她说：“再见了，美丽的小鸟！"], ["c10-012", "谢谢你在夏天为我唱的好听的歌。”"]]}, {"t": "img", "src": "images/40.webp?v=497099573b", "vid": "images/40.mp4?v=98b67b163e", "cap": "燕子的心跳", "n": 40}, {"t": "p", "s": [["c10-013", "她把头贴在燕子的胸口上，忽然吓了一跳，燕子的身体里，好像有什么东西在“扑通、扑通”地跳着。"], ["c10-014", "那是燕子的心！"], ["c10-015", "燕子并没有死，它只是冻僵了。"]]}]}, {"title": "第十一章　照顾燕子", "head": "c11-h", "audio": "audio/ch11.m4a?v=37e61550f5", "duration": 77.059, "times": {"c11-h": [0.0, 2.291], "c11-001": [3.291, 4.975], "c11-002": [5.325, 10.789], "c11-003": [11.639, 19.674], "c11-004": [20.024, 24.309], "c11-005": [25.159, 29.309], "c11-006": [29.659, 33.241], "c11-007": [34.091, 40.119], "c11-008": [40.469, 44.483], "c11-009": [45.333, 48.43], "c11-010": [48.78, 53.071], "c11-011": [53.421, 57.205], "c11-012": [58.055, 64.429], "c11-013": [65.279, 68.152], "c11-014": [68.502, 71.436], "c11-015": [72.286, 75.559]}, "blocks": [{"t": "p", "s": [["c11-001", "拇指姑娘又惊又喜。"], ["c11-002", "她把毯子盖得更紧了，又拿来自己的薄荷叶被子，盖在燕子的头上。"]]}, {"t": "img", "src": "images/41.webp?v=d0c52714b0", "vid": "images/41.mp4?v=99d87106f1", "cap": "燕子醒过来了", "n": 41}, {"t": "p", "s": [["c11-003", "第二天夜里，燕子睁开了眼睛，虚弱地说：“谢谢你，可爱的小姑娘，我觉得暖和多了。"], ["c11-004", "我很快就能恢复力气，又能在温暖的阳光下飞翔了。”"]]}, {"t": "p", "s": [["c11-005", "拇指姑娘说：“可是外面在下雪，冷得很呢。"], ["c11-006", "你就躺在这温暖的床上吧，我会照顾你的。”"]]}, {"t": "img", "src": "images/42.webp?v=1fec19f338", "vid": "images/42.mp4?v=b9d3f34b90", "cap": "用花瓣盛水", "n": 42}, {"t": "p", "s": [["c11-007", "整个冬天，拇指姑娘都偷偷地照顾着燕子，用花瓣给它盛水喝。"], ["c11-008", "这件事，田鼠太太和鼹鼠先生一点儿也不知道。"]]}, {"t": "img", "src": "images/43.webp?v=3cd48ca554", "vid": "images/43.mp4?v=e0e7028227", "cap": "春天到了", "n": 43}, {"t": "p", "s": [["c11-009", "春天到了，太阳暖暖地照着大地。"], ["c11-010", "燕子要走了，它对拇指姑娘说：“你愿意和我一起走吗？"], ["c11-011", "你可以坐在我的背上，我们一起飞到绿色的森林里去。”"]]}, {"t": "p", "s": [["c11-012", "拇指姑娘想了想，说：“不行，要是我就这样走了，田鼠太太会难过的。”"]]}, {"t": "img", "src": "images/44.webp?v=69d3b0a29e", "vid": "images/44.mp4?v=8b345d4e93", "cap": "燕子飞走了", "n": 44}, {"t": "p", "s": [["c11-013", "“那么，再见吧，善良可爱的小姑娘！”"], ["c11-014", "燕子说着，飞向了明亮的阳光里。"]]}, {"t": "p", "s": [["c11-015", "拇指姑娘望着它，眼泪一下子流了出来。"]]}]}, {"title": "第十二章　不想嫁给鼹鼠", "head": "c12-h", "audio": "audio/ch12.m4a?v=1451107455", "duration": 62.488, "times": {"c12-h": [0.0, 3.159], "c12-001": [4.159, 7.4], "c12-002": [8.25, 11.181], "c12-003": [11.531, 16.898], "c12-004": [17.748, 23.517], "c12-005": [23.867, 28.5], "c12-006": [29.35, 31.307], "c12-007": [31.657, 37.286], "c12-008": [38.136, 43.384], "c12-009": [43.734, 47.443], "c12-010": [47.793, 51.323], "c12-011": [52.173, 54.53], "c12-012": [55.38, 58.031], "c12-013": [58.381, 60.988]}, "blocks": [{"t": "p", "s": [["c12-001", "鼹鼠先生终于向拇指姑娘求婚了。"]]}, {"t": "p", "s": [["c12-002", "田鼠太太说：“你就要有嫁妆啦。"], ["c12-003", "快点准备吧，你得有毛衣，也得有床单，鼹鼠先生的新娘可什么都不能少！”"]]}, {"t": "img", "src": "images/45.webp?v=6f1dd4c82f", "vid": "images/45.mp4?v=5a27f8b712", "cap": "四只蜘蛛织嫁妆", "n": 45}, {"t": "p", "s": [["c12-004", "田鼠太太请了四只蜘蛛，日日夜夜地为拇指姑娘纺线织布。"], ["c12-005", "鼹鼠先生每天晚上都来，说等夏天一过，就举行婚礼。"]]}, {"t": "p", "s": [["c12-006", "拇指姑娘一点儿也不高兴。"], ["c12-007", "她不喜欢那个讨厌太阳的鼹鼠先生，更不想一辈子住在黑黑的地底下。"]]}, {"t": "img", "src": "images/46.webp?v=e874a263c1", "vid": "images/46.mp4?v=10793ea711", "cap": "麦穗间的蓝天", "n": 46}, {"t": "p", "s": [["c12-008", "每天早上太阳升起、晚上太阳落下的时候，她都偷偷溜到门口。"], ["c12-009", "风吹开麦穗，她就能看见蓝蓝的天空。"], ["c12-010", "她多么希望，能再见到那只亲爱的燕子啊！"]]}, {"t": "p", "s": [["c12-011", "秋天来了，婚礼的日子到了。"]]}, {"t": "p", "s": [["c12-012", "田鼠太太说：“你得嫁过去了。"], ["c12-013", "鼹鼠先生那么有钱，你可别不知好歹！”"]]}]}, {"title": "第十三章　再见了，太阳", "head": "c13-h", "audio": "audio/ch13.m4a?v=67ae1f92d8", "duration": 66.755, "times": {"c13-h": [0.0, 3.246], "c13-001": [4.246, 8.613], "c13-002": [9.463, 13.079], "c13-003": [13.429, 18.889], "c13-004": [19.739, 23.558], "c13-005": [27.623, 30.405], "c13-006": [31.255, 36.446], "c13-007": [37.296, 41.421], "c13-008": [41.771, 44.604], "c13-009": [44.954, 50.792], "c13-010": [51.642, 52.435], "c13-011": [52.785, 53.869], "c13-012": [54.719, 59.832], "c13-013": [60.182, 63.268]}, "blocks": [{"t": "p", "s": [["c13-001", "拇指姑娘走出门，最后一次看看明亮的太阳。"]]}, {"t": "img", "src": "images/47.webp?v=80c00d94a9", "vid": "images/47.mp4?v=24c92f4b6f", "cap": "再见了，太阳", "n": 47}, {"t": "p", "s": [["c13-002", "她伸出小手说：“再见了，明亮的太阳！"], ["c13-003", "再见了，亲爱的小红花，要是你见到那只燕子，请替我问候它。”"]]}, {"t": "img", "src": "images/48.webp?v=5b1cbfd5fe", "vid": "images/48.mp4?v=eb03db613e", "cap": "燕子回来了", "n": 48}, {"t": "p", "s": [["c13-004", "就在这时，头顶上传来了“滴丽、滴丽”的叫声。"], ["c13-005", "她抬头一看，正是那只燕子！"]]}, {"t": "p", "s": [["c13-006", "燕子落在她身边，听拇指姑娘说了自己不愿意嫁给鼹鼠的事。"]]}, {"t": "p", "s": [["c13-007", "燕子说：“冬天又要来了，我要飞到温暖的地方去。"], ["c13-008", "你愿意坐在我的背上，和我一起走吗？"], ["c13-009", "我们飞过高山和大海，飞到太阳更明亮、花儿开得更美的地方去。”"]]}, {"t": "p", "s": [["c13-010", "“我愿意！”"], ["c13-011", "拇指姑娘说。"]]}, {"t": "img", "src": "images/49.webp?v=6c4508ecb2", "vid": "images/49.mp4?v=fa51bfb646", "cap": "飞上高高的天空", "n": 49}, {"t": "p", "s": [["c13-012", "她坐上燕子的背，用腰带把自己紧紧地系在一根最结实的羽毛上。"], ["c13-013", "燕子展开翅膀，飞上了高高的天空。"]]}]}, {"title": "第十四章　花中的小王子", "head": "c14-h", "audio": "audio/ch14.m4a?v=774fc64652", "duration": 72.497, "times": {"c14-h": [0.0, 3.418], "c14-001": [4.418, 11.531], "c14-002": [12.381, 19.085], "c14-003": [19.435, 27.319], "c14-004": [28.169, 31.529], "c14-005": [31.879, 45.966], "c14-006": [46.316, 49.308], "c14-007": [50.158, 56.371], "c14-008": [57.221, 59.34], "c14-009": [59.69, 62.872], "c14-010": [63.722, 68.928], "c14-011": [69.278, 70.997]}, "blocks": [{"t": "img", "src": "images/50.webp?v=6cd676178e", "vid": "images/50.mp4?v=a3527f51df", "cap": "飞过大海和雪山", "n": 50}, {"t": "p", "s": [["c14-001", "他们飞过森林，飞过大海，飞过积雪的高山，终于来到了温暖的南方。"]]}, {"t": "img", "src": "images/51.webp?v=9b34be0fc0", "vid": "images/51.mp4?v=65b805edfe", "cap": "湖边的大理石宫殿", "n": 51}, {"t": "p", "s": [["c14-002", "那里的天空又高又蓝，路边长满了葡萄，树林里挂着金黄的橘子。"], ["c14-003", "在一片碧绿的湖边，立着一座白色大理石的古老宫殿，燕子的窝就在宫殿的柱子上。"]]}, {"t": "img", "src": "images/52.webp?v=1a899b092e", "vid": "images/52.mp4?v=a97a390ecc", "cap": "花心里的小王子", "n": 52}, {"t": "p", "s": [["c14-004", "燕子把拇指姑娘放在一朵最美丽的白花上。"], ["c14-005", "拇指姑娘一看，大吃一惊，花心里坐着一个小小的男子，他的身子像玻璃一样透明，头上戴着一顶闪闪发光的金王冠，肩上长着一对亮晶晶的翅膀。"], ["c14-006", "他和拇指姑娘一样，只有大拇指那么高。"]]}, {"t": "p", "s": [["c14-007", "原来，每一朵花里都住着一个这样的小人儿，他就是所有花的王子。"]]}, {"t": "img", "src": "images/53.webp?v=a72de88188", "vid": "images/53.mp4?v=736e158d41", "cap": "小王子的求婚", "n": 53}, {"t": "p", "s": [["c14-008", "小王子说：“多美的姑娘啊！"], ["c14-009", "你愿意做我的王后，做所有花儿的王后吗？”"]]}, {"t": "p", "s": [["c14-010", "他和癞蛤蟆的儿子不一样，也和穿天鹅绒袍子的鼹鼠先生不一样。"], ["c14-011", "拇指姑娘高兴地答应了。"]]}]}, {"title": "第十五章　新的名字", "head": "c15-h", "audio": "audio/ch15.m4a?v=f8cb37b56a", "duration": 120.975, "times": {"c15-h": [0.0, 2.601], "c15-001": [3.601, 10.72], "c15-002": [11.069, 14.213], "c15-003": [14.563, 20.198], "c15-004": [24.763, 29.691], "c15-005": [30.041, 31.009], "c15-006": [31.859, 36.167], "c15-007": [36.517, 41.153], "c15-008": [42.003, 42.487], "c15-009": [42.837, 43.43], "c15-010": [43.78, 46.772], "c15-011": [47.622, 52.526], "c15-012": [52.876, 59.007], "c15-013": [59.857, 60.765], "song-theme": [61.965, 67.965], "song-theme-01": [67.965, 73.185], "song-theme-02": [73.185, 77.825], "song-theme-03": [79.845, 85.805], "song-theme-04": [86.465, 91.145], "song-theme-05": [93.205, 96.405], "song-theme-06": [99.485, 103.645], "song-theme-07": [105.205, 109.865], "song-theme-08": [109.865, 114.125]}, "blocks": [{"t": "img", "src": "images/54.webp?v=d8deff97b9", "vid": "images/54.mp4?v=5f006f1fe3", "cap": "一对白翅膀", "n": 54}, {"t": "p", "s": [["c15-001", "每一朵花里，都走出一位小姐或者一位先生，他们都来给拇指姑娘送礼物。"], ["c15-002", "最好的礼物，是一对美丽的白翅膀。"], ["c15-003", "他们把翅膀装在她的背上，她也能从一朵花飞到另一朵花上去了。"]]}, {"t": "img", "src": "images/55.webp?v=8200a8b8c6", "vid": "images/55.mp4?v=a2beddad19", "cap": "花儿的王后", "n": 55}, {"t": "p", "s": [["c15-004", "花中的小王子说：“你不应该再叫拇指姑娘了，这个名字不够好听。"], ["c15-005", "我们叫你玛娅吧。”"]]}, {"t": "img", "src": "images/56.webp?v=897960df27", "vid": "images/56.mp4?v=e737bcc236", "cap": "燕子的歌", "n": 56}, {"t": "p", "s": [["c15-006", "燕子坐在窝里，为他们唱了一首最好听的歌。"], ["c15-007", "可是它的心里也有一点儿难过，因为它也非常喜欢拇指姑娘。"]]}, {"t": "p", "s": [["c15-008", "“再见！"], ["c15-009", "再见！”"], ["c15-010", "燕子说着，又飞回了遥远的北方。"]]}, {"t": "img", "src": "images/57.webp?v=7f52924a6b", "vid": "images/57.mp4?v=84c63ed7bc", "cap": "会讲童话的人", "n": 57}, {"t": "p", "s": [["c15-011", "燕子在一个会讲童话的人的窗前停了下来，唱起歌来。"], ["c15-012", "它把拇指姑娘的故事唱给他听，于是，我们今天也知道了这个故事。"]]}, {"t": "p", "s": [["c15-013", "（完）"]]}, {"t": "song", "title": "拇指姑娘", "head": "song-theme", "lines": [["song-theme-01", "郁金香里开出一个小姑娘"], ["song-theme-02", "她只有拇指那么长"], ["song-theme-03", "走过冬天的冰雪和风霜"], ["song-theme-04", "她救了燕子让它飞向远方"], ["song-theme-05", "燕子燕子带她飞"], ["song-theme-06", "飞到温暖的南方"], ["song-theme-07", "花里住着小小的王子"], ["song-theme-08", "从此她有了翅膀"]]}, {"t": "note", "text": "读完以后，可以和孩子聊一聊：拇指姑娘在冬天救了快要冻死的燕子，后来燕子又救了她。你帮助过别人吗？别人又是怎么帮助你的？"}]}], "music": 3, "images": [{"from": "c01-h", "src": "images/01.webp?v=14d38e093a", "vid": "images/01.mp4?v=033dc56067", "cap": "妇人想要一个孩子", "n": 1}, {"from": "c01-002", "src": "images/02.webp?v=44e971850a", "vid": "images/02.mp4?v=b9a760cd19", "cap": "老婆婆的大麦粒", "n": 2}, {"from": "c01-006", "src": "images/03.webp?v=67f3093beb", "vid": "images/03.mp4?v=7abdad1021", "cap": "花盆里的郁金香花苞", "n": 3}, {"from": "c01-008", "src   const local = location.protocol === 'file:' || /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|\[::1\]$)|\.local$/.test(location.hostname);
  const host = ASSET_HOSTS[q] || (q !== 'local' && !local ? ASSET_HOSTS.remote : '');
  return host ? host + BOOK.id + '/' : '';
})();
const A = p => p && ASSET_BASE + p;
BOOK.cover = A(BOOK.cover);
BOOK.images.forEach(im => { im.src = A(im.src); im.vid = A(im.vid); });
BOOK.chapters.forEach(ch => { ch.audio = A(ch.audio); ch.blocks.forEach(b => { if (b.t === 'img') { b.src = A(b.src); b.vid = A(b.vid); } }); });
const PREF = 'story-audiobook-';               // 主题、动图、显示模式：所有书共用
const NUM = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>';
const $ = s => document.querySelector(s);
const fmt = t => { t = Math.max(0, t | 0); return String(t / 60 | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

// ---------- 渲染 ----------
const story = $('#story');
let anim = true;   // 插图用动图还是静态图
try { anim = localStorage.getItem(PREF + 'anim') !== 'off'; } catch (e) {}
const lines = [];          // 全书按顺序：{id, ch, start, end, el, img}
const imgs = BOOK.images;  // 全书插图（故事顺序）：{from, src, vid, cap, n}，from = 从哪一句开始显示；vid 是动图短片
// 正文里的动图：进入视野附近才加载、播放，离开就暂停（几十段短片同时播手机吃不消）
const vio = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting && anim) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); }
  else v.pause();
}), { rootMargin: '300px 0px' });
const byId = {};
document.title = BOOK.title + ' · 有声绘本';
$('#bookTitle').textContent = BOOK.title;
$('#kicker').textContent = BOOK.kicker + ' · 有声绘本';
$('#intro').textContent = BOOK.intro;
$('#coverImg').src = BOOK.cover;
const total = BOOK.chapters.reduce((a, c) => a + c.duration, 0);
const nImg = BOOK.chapters.reduce((a, c) => a + c.blocks.filter(b => b.t === 'img').length, 0);
const nSong = BOOK.chapters.reduce((a, c) => a + c.blocks.filter(b => b.t === 'song').length, 0);
// 同一个故事的其他版本（精简版 / 完整版）
if (BOOK.versions) {
  const box = $('#versions'); box.hidden = false;
  BOOK.versions.forEach(v => {
    const el = document.createElement(v.current ? 'span' : 'a');
    el.textContent = v.current ? v.label : v.label + ' ›';
    if (v.current) el.className = 'on'; else el.href = `../${v.dir}/index.html`;
    box.append(el);
  });
}
$('#meta').textContent = `${BOOK.chapters.length} 章 · ${nImg} 幅插画${nSong ? ` · ${nSong} 首插曲` : ''}${BOOK.music ? ` · ${BOOK.music} 首配乐` : ''} · 全长约 ${Math.round(total / 60)} 分钟 · 朗读：${BOOK.voice}`;

BOOK.chapters.forEach((ch, ci) => {
  const sec = document.createElement('section');
  sec.className = 'chapter'; sec.id = 'ch' + (ci + 1);
  const [no, ...rest] = ch.title.split('　');
  const h = document.createElement('h2');
  h.innerHTML = `<small>${no}</small>${rest.join(' ')}`;
  h.dataset.id = ch.head;
  sec.appendChild(h);
  const add = (id, el) => { const [s, e] = ch.times[id]; const L = { id, ch: ci, start: s, end: e, el }; lines.push(L); byId[id] = L; };
  add(ch.head, h);
  for (const b of ch.blocks) {
    if (b.t === 'p') {
      const p = document.createElement('p');
      for (const [id, text] of b.s) {
        const sp = document.createElement('span');
        sp.className = 's'; sp.dataset.id = id; sp.textContent = text;
        p.appendChild(sp); add(id, sp);
      }
      sec.appendChild(p);
    } else if (b.t === 'song') {
      // 插曲：歌名（前奏时高亮）+ 一行一句歌词，跟着演唱逐行高亮
      const d = document.createElement('div'); d.className = 'song';
      const h3 = document.createElement('h3'); h3.dataset.id = b.head; h3.textContent = b.title;
      d.appendChild(h3); add(b.head, h3);
      for (const [id, text] of b.lines) {
        const sp = document.createElement('span');
        sp.className = 's'; sp.dataset.id = id; sp.textContent = text;
        d.appendChild(sp); add(id, sp);
      }
      sec.appendChild(d);
    } else if (b.t === 'img') {
      const f = document.createElement('figure');
      f.innerHTML = `<div class="pic"><img loading="lazy" src="${b.src}" alt="${b.cap}"></div><figcaption><b>插图 ${b.n}</b>${b.cap}</figcaption>`;
      if (b.vid) {
        const v = document.createElement('video');
        v.muted = v.loop = v.playsInline = true; v.preload = 'none'; v.dataset.src = b.vid;
        v.setAttribute('muted', ''); v.setAttribute('playsinline', '');   // iOS 自动播放认属性
        v.onplaying = () => v.classList.toggle('on', anim);
        f.firstChild.appendChild(v); vio.observe(v);
      }
      sec.appendChild(f);
    } else {
      const d = document.createElement('div'); d.className = 'note'; d.textContent = b.text; sec.appendChild(d);
    }
  }
  story.appendChild(sec);
  const li = document.createElement('li');
  li.innerHTML = `<button data-ch="${ci}"><span>${ch.title.replace('　', ' ')}</span><span class="dur">${fmt(ch.duration)}</span></button>`;
  $('#toc').appendChild(li);
});
// 每幅插图从它的 from 那句开始显示，一直到下一幅开始
imgs.forEach(im => { im.ch = byId[im.from].ch; im.at = lines.indexOf(byId[im.from]); });
lines.forEach((L, k) => {
  let i = 0;
  while (i + 1 < imgs.length && imgs[i + 1].at <= k) i++;
  L.img = i;
});
const endMark = document.createElement('div'); endMark.className = 'end-mark'; endMark.textContent = '— 全书完 —';
story.appendChild(endMark);

// ---------- 欣赏插曲：全书插曲排成播放列表，每首只放章节音频里歌的那一段，放完接着下一首 ----------
const songs = [];
BOOK.chapters.forEach((ch, ci) => ch.blocks.forEach(b => {
  if (b.t !== 'song') return;
  const i = lines.indexOf(byId[b.lines[b.lines.length - 1][0]]), next = lines[i + 1];
  songs.push({ title: b.title, ch: ci, start: byId[b.head].start, end: next && next.ch === ci ? next.start : ch.duration });
}));
let plIdx = -1;   // 正在放播放列表里的第几首，-1 是平常听书
if (songs.length) {
  const box = document.createElement('section'); box.className = 'songlist'; box.id = 'songlist';
  const mins = Math.max(1, Math.round(songs.reduce((a, s) => a + s.end - s.start, 0) / 60));
  box.innerHTML = `<h3>♪ 本书插曲</h3><div class="sub">${songs.length} 首 · 约 ${mins} 分钟</div>
    <button class="btn btn-song" id="songAll">${ICON_PLAY}欣赏插曲</button><ol></ol>`;
  songs.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button data-song="${i}"><span></span><span class="dur">${BOOK.chapters[s.ch].title.split('　')[0]} · ${fmt(s.end - s.start)}</span></button>`;
    li.querySelector('span').textContent = s.title;
    box.querySelector('ol').appendChild(li);
  });
  box.querySelector('#songAll').onclick = () => playSong(0);
  box.querySelector('ol').onclick = e => { const b = e.target.closest('button'); if (b) playSong(+b.dataset.song); };
  story.appendChild(box);
}
function renderSongs() {
  document.querySelectorAll('.songlist li button').forEach((b, i) => b.classList.toggle('now', i === plIdx));
}
function playSong(i) {
  if (i >= songs.length) { plIdx = -1; renderSongs(); audio.pause(); toast('插曲都放完啦'); return; }
  plIdx = Math.max(0, i); renderSongs();
  const s = songs[plIdx];
  playFrom(s.ch, s.start + 0.001).then(updateMedia);
  toast(`♪ 插曲 ${plIdx + 1}/${songs.length}：${s.title}`);
}
const stopSongs = () => { if (plIdx >= 0) { plIdx = -1; renderSongs(); } };

// ---------- 播放 ----------
const audio = new Audio();
audio.preload = 'auto';
let cur = -1, active = null, playing = false;
let follow = true, userScrollAt = 0, speedIdx = 1;
const SPEEDS = [0.8, 1, 1.2, 1.5];

function loadChapter(ci) {
  if (ci === cur) return Promise.resolve();
  cur = ci;
  audio.src = BOOK.chapters[ci].audio;
  setBuffering(true);   // 到能播放之前转圈（canplay / playing 时停）
  audio.playbackRate = SPEEDS[speedIdx];
  document.querySelectorAll('.toc button').forEach((b, i) => b.classList.toggle('now', i === ci));
  $('#seek').max = BOOK.chapters[ci].duration;
  updateMedia();
  return new Promise(res => audio.addEventListener('loadedmetadata', res, { once: true }));
}

async function playFrom(ci, t, autoplay = true) {
  await loadChapter(ci);
  audio.currentTime = t;
  sync(true);
  if (autoplay) { try { await audio.play(); } catch (e) { toast('点击播放按钮开始朗读'); } }
}
const playLine = (L, autoplay = true) => playFrom(L.ch, L.start + 0.001, autoplay);

function lineAt(ci, t) {
  // 找本章里开始时间 ≤ t 的最后一句
  let best = null;
  for (const L of lines) {
    if (L.ch !== ci) { if (best) break; continue; }
    if (L.start <= t + 0.03) best = L; else break;
  }
  return best;
}

function setActive(L, force) {
  if (L === active && !force) return;
  if (active) active.el.classList.remove('on');
  active = L;
  if (!L) return;
  L.el.classList.add('on');
  const idx = lines.indexOf(L);
  lines.forEach((x, i) => x.el.classList.toggle('past', i < idx));
  const ch = BOOK.chapters[L.ch];
  $('#nowTitle').textContent = plIdx >= 0 ? `♪ ${plIdx + 1}/${songs.length} ${songs[plIdx].title}` : ch.title.replace('　', ' ');
  if (mode !== 'read') showStage(L.img);   // 阅读模式不用舞台，免得在后台加载动图
  setSubtitle(L);
  if (follow && mode !== 'picture' && (force || Date.now() - userScrollAt > 5000)) {
    const r = L.el.getBoundingClientRect();
    const vh = window.innerHeight;
    if (r.top < vh * 0.18 || r.bottom > vh * 0.62) {
      programmatic = Date.now();
      window.scrollBy({ top: r.top - vh * 0.32, behavior: 'smooth' });
    }
  }
}

function sync(force) {
  if (cur < 0) return;
  const t = audio.currentTime;
  const s = songs[plIdx];
  if (s && playing && cur === s.ch && t >= s.end - 0.05) return playSong(plIdx + 1);   // 这首唱完了，接下一首
  setActive(lineAt(cur, t), force);
  if (!seeking) $('#seek').value = t;
  $('#nowTime').textContent = `${buffering ? '加载中… ' : ''}${fmt(t)} / ${fmt(BOOK.chapters[cur].duration)}`;
  paintSeek();
}

// ---------- 弱网：显示下载进度、缓冲提示、预先加载下一章、出错重试 ----------
const SEEK_PLAYED = 'var(--sea)', SEEK_BUF = 'color-mix(in srgb, var(--sea) 50%, var(--line))';
let buffering = false, retry = null, prefetched = new Set();
function paintSeek() {
  const seek = $('#seek');
  const d = cur < 0 ? 0 : (audio.duration || BOOK.chapters[cur].duration);
  if (!d) { seek.style.setProperty('--seek-bg', 'var(--line)'); return; }
  const pc = x => (Math.min(1, Math.max(0, x / d)) * 100).toFixed(2) + '%';
  const p = pc(+seek.value), stops = [];
  for (let i = 0; i < audio.buffered.length; i++) {
    const a = pc(audio.buffered.start(i)), b = pc(audio.buffered.end(i));
    stops.push(`transparent ${a}`, `${SEEK_BUF} ${a}`, `${SEEK_BUF} ${b}`, `transparent ${b}`);
  }
  const buf = stops.length ? `linear-gradient(to right, ${stops.join(', ')}), ` : '';
  seek.style.setProperty('--seek-bg', `linear-gradient(to right, ${SEEK_PLAYED} ${p}, transparent ${p}), ${buf}var(--line)`);
}
function setBuffering(on) {
  if (buffering === on) return;
  buffering = on;
  document.body.classList.toggle('buffering', on);
  if (cur >= 0) sync(false);
}
audio.addEventListener('waiting', () => setBuffering(true));
['playing', 'canplay', 'pause'].forEach(ev => audio.addEventListener(ev, () => setBuffering(false)));
audio.addEventListener('progress', () => {
  paintSeek();
  // 这一章下载完了而且正在听：提前把下一章拉进浏览器缓存（地址带内容指纹、长期缓存），换章时不用再等
  const next = BOOK.chapters[cur + 1], b = audio.buffered, d = audio.duration;
  if (!playing || !next || prefetched.has(next.audio) || !b.length || !(b.end(b.length - 1) >= d - 0.5)) return;
  if (navigator.connection && navigator.connection.saveData) return;
  prefetched.add(next.audio);
  fetch(next.audio, { priority: 'low' }).then(r => r.blob()).catch(() => {});   // 只试一次，失败了到时照常边下边放
});
audio.addEventListener('error', () => {
  if (cur < 0) return;
  setBuffering(false);
  retry = { ch: cur, t: audio.currentTime };   // 再点播放时从断开的地方重新加载
  cur = -1;
  toast('网络不太好，音频没加载出来，点播放键重试');
});

let raf = 0;
function loop() { sync(false); raf = requestAnimationFrame(loop); }
audio.addEventListener('play', () => { playing = true; document.body.classList.add('playing'); story.classList.add('reading'); renderPlay(); cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause', () => { playing = false; document.body.classList.remove('playing'); renderPlay(); cancelAnimationFrame(raf); sync(false); savePos(); });
audio.addEventListener('ended', () => {
  if (plIdx >= 0) playSong(plIdx + 1);   // 插曲在章末：这章放完就是这首唱完了
  else if (cur < BOOK.chapters.length - 1) playFrom(cur + 1, 0);
  else { toast('故事讲完啦，晚安 🌙'); setActive(null); localStorage.removeItem(POS_KEY); }
});

function renderPlay() {
  $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $('#playBtn').setAttribute('aria-label', playing ? '暂停' : '播放');
}
renderPlay();

function toggle() {
  if (cur < 0) { const p = retry || readPos(); retry = null; return p ? playFrom(p.ch, p.t) : playFrom(0, 0); }
  playing ? audio.pause() : audio.play();
}
function step(d) {
  const i = active ? lines.indexOf(active) : -1;
  // 上一句：如果当前句已读了 1.5 秒以上，先回到本句开头
  if (d < 0 && active && audio.currentTime - active.start > 1.5) return playLine(active, playing || cur < 0);
  const L = lines[Math.min(lines.length - 1, Math.max(0, i + d))];
  if (L) playLine(L, true);
}
function chapterJump(d) {
  if (plIdx >= 0) return playSong(Math.min(songs.length - 1, plIdx + d));   // 欣赏插曲时，上一章 / 下一章换成上一首 / 下一首
  const ci = Math.min(BOOK.chapters.length - 1, Math.max(0, (cur < 0 ? 0 : cur) + d));
  playFrom(ci, 0);
}

// ---------- 交互 ----------
$('#playBtn').onclick = toggle;
$('#prevS').onclick = () => step(-1);
$('#nextS').onclick = () => step(1);
$('#prevCh').onclick = () => chapterJump(-1);
$('#nextCh').onclick = () => chapterJump(1);
$('#startBtn').onclick = () => { stopSongs(); playFrom(0, 0); };
$('#tocBtn').onclick = () => {
  if (mode === 'picture') setMode('read', true);   // 纯图模式没有目录，先回到阅读模式
  $('.toc').scrollIntoView({ behavior: 'smooth' });
};
story.addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) { stopSongs(); playLine(byId[el.dataset.id], true); userScrollAt = 0; return; }
  const pic = e.target.closest('figure .pic'), img = pic && pic.querySelector('img');

});

$('#toc').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;

$('#speedBtn').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  $('#speedBtn').textContent = SPEEDS[speedIdx].toFixed(1) + '×';

$('#followBtn').onclick = () => {
  follow = !follow;
  $('#followBtn').setAttribute('aria-pressed', follow);

  if (follow && active) setActive(active, true);

// ---------- 显示模式：阅读 / 左图右文（宽屏才有）/ 纯图 ----------
const MODES = { read: '阅读', split: '左图右文', picture: '纯图' };
const wide = matchMedia('(min-width: 900px)');
let mode = 'read', stageIdx = -1, stageLayer = 0;
$('#stageVid').onplaying = () => $('#stageVid').classList.add('show');
function showStage(i, force) {
  if (i === stageIdx && !force) return;
  stageIdx = i;
  const im = imgs[i];
  const layers = document.querySelectorAll('#stage img');
  const next = layers[stageLayer ^= 1], prev = layers[stageLayer ^ 1];
  next.onload = () => { next.classList.add('show'); prev.classList.remove('show'); };
  next.src = im.src;
  if (imgs[i + 1]) new Image().src = imgs[i + 1].src;   // 顺手预载下一张，念到时直接换上
  next.alt = im.cap;
  // 动图短片盖在静态图上，开始播放再淡入；阅读模式看不见舞台，不播
  const v = $('#stageVid');
  v.classList.remove('show');
  if (anim && im.vid && mode !== 'read') { v.src = im.vid; v.play().catch(() => {}); }
  else if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
  $('#stageBg').style.backgroundImage = `url("${im.src}")`;
  $('#stageCap').textContent = `插图 ${im.n} · ${im.cap}`;
  $('#stageTop').textContent = BOOK.chapters[(active || {}).ch ?? im.ch].title.replace('　', ' ');
}
// 字幕换句时先淡出再换字，免得两句文字跳动
let subT = 0;
function setSubtitle(L) {
  const sub = $('#stageSub');
  const text = !L ? '' : L.el.tagName === 'H2' ? BOOK.chapters[L.ch].title.replace('　', ' ')
    : L.el.tagName === 'H3' ? '♪ ' + L.el.textContent : L.el.closest('.song') ? '♪ ' + L.el.textContent + ' ♪' : L.el.textContent;
  if (sub.dataset.text === text) return;
  sub.dataset.text = text;
  sub.classList.add('fade');
  clearTimeout(subT);
  subT = setTimeout(() => { sub.textContent = text; sub.classList.remove('fade'); }, 180);
}
function setMode(m, quiet) {
  if (m === 'split' && !wide.matches) m = 'read';
  mode = m;
  document.body.dataset.mode = m;
  $('#modeBtn').textContent = MODES[m];
  try { localStorage.setItem(PREF + 'mode', m); } catch (e) {}
  showStage(active ? active.img : Math.max(0, stageIdx), true);
  if (m !== 'picture' && active) setTimeout(() => setActive(active, true), 30);
  if (!quiet) toast('显示模式：' + MODES[m] + (m === 'picture' ? '（点画面播放 / 暂停）' : ''));
}
$('#modeBtn').onclick = () => {
  const order = wide.matches ? ['read', 'split', 'picture'] : ['read', 'picture'];
  setMode(order[(order.indexOf(mode) + 1) % order.length]);
};
wide.addEventListener('change', () => { if (mode === 'split' && !wide.matches) setMode('read', true); });
$('#stage').onclick = () => { if (mode === 'picture') toggle(); };
$('#stagePlay').onclick = e => { e.stopPropagation(); toggle(); };
// 舞台的底边贴着播放条
new ResizeObserver(() => document.documentElement.style.setProperty('--ph', $('#player').offsetHeight + 'px')).observe($('#player'));
try { setMode(localStorage.getItem(PREF + 'mode') || 'read', true); } catch (e) { setMode('read', true); }

function renderAnim() {
  $('#animBtn').setAttribute('aria-pressed', anim);
  document.querySelectorAll('figure video').forEach(v => {
    if (anim) { vio.unobserve(v); vio.observe(v); }   // 重新观察会立即回调一次，看得见的接着播
    else { v.pause(); v.classList.remove('on'); }
  });
  if (stageIdx >= 0) showStage(stageIdx, true);
}
$('#animBtn').onclick = () => {
  anim = !anim;
  try { localStorage.setItem(PREF + 'anim', anim ? 'on' : 'off'); } catch (e) {}
  renderAnim();
  toast(anim ? '插图：动图' : '插图：静态图');
};
renderAnim();
$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(PREF + 'theme', root.dataset.theme); } catch (e) {}
};
try { const th = localStorage.getItem(PREF + 'theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; if (cur < 0) return; audio.currentTime = +$('#seek').value; sync(true); });
$('#seek').addEventListener('change', () => { seeking = false; });
if (cur < 0) $('#seek').addEventListener('pointerdown', () => { if (cur < 0) loadChapter(0); }, { once: true });

// 用户自己滚动页面时，暂停自动跟读 5 秒
let programmatic = 0;
['wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => { userScrollAt = Date.now(); }, { passive: true }));
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Escape') $('#lightbox').classList.remove('open');
});

// ---------- 记住上次听到哪里 ----------
function savePos() { if (cur < 0) return; try { localStorage.setItem(POS_KEY, JSON.stringify({ ch: cur, t: audio.currentTime, id: active && active.id })); } catch (e) {} }
function readPos() { try { const p = JSON.parse(localStorage.getItem(POS_KEY)); return p && p.ch >= 0 && p.ch < BOOK.chapters.length ? p : null; } catch (e) { return null; } }
setInterval(() => { if (playing) savePos(); }, 3000);
const last = readPos();
if (last && (last.ch > 0 || last.t > 5)) {
  const rb = $('#resumeBtn');
  rb.hidden = false;
  rb.textContent = `继续听 · ${BOOK.chapters[last.ch].title.split('　')[0]} ${fmt(last.t)}`;
  rb.onclick = () => {
    stopSongs();
    const L = last.id && byId[last.id];
    L ? playLine(L) : playFrom(last.ch, last.t);
    if (L) setTimeout(() => setActive(L, true), 50);
  };
}
$('#nowTitle').textContent = '点击任意一句，就从那里开始听';

// ---------- 锁屏 / 耳机控制 ----------
function updateMedia() {
  if (!('mediaSession' in navigator) || cur < 0) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: plIdx >= 0 ? songs[plIdx].title : BOOK.chapters[cur].title.replace('　', ' '), artist: BOOK.voice, album: BOOK.title,
    artwork: [{ src: BOOK.cover, sizes: '1152x768', type: 'image/webp' }]
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => chapterJump(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => chapterJump(1));
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
</script>
</body>
