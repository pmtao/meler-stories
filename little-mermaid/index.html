<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
.seek { width: 100%; margin: 8px 0 6px; accent-color: var(--sea); height: 18px; cursor: pointer; }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>
<div class="toast" id="toast"></div>

<script>
const BOOK = {"id": "little-mermaid", "title": "海的女儿", "intro": "根据安徒生童话《海的女儿》改写，适合 5 到 10 岁的小朋友和爸爸妈妈一起读、一起听。", "kicker": "安徒生童话", "cover": "images/04.webp", "voice": "Seren（温和舒缓的姐姐），本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "第一章　海底的王宫", "head": "c01-h", "audio": "audio/ch01.m4a", "duration": 112.067, "times": {"c01-h": [0.0, 3.918], "c01-001": [4.918, 13.51], "c01-002": [13.86, 23.147], "c01-003": [23.997, 26.878], "c01-004": [27.228, 38.879], "c01-005": [39.229, 46.494], "c01-006": [47.344, 51.994], "c01-007": [52.344, 62.293], "c01-008": [62.643, 70.693], "c01-009": [71.543, 78.353], "c01-010": [78.703, 82.653], "c01-011": [83.003, 90.094], "c01-012": [90.944, 94.546], "c01-013": [94.896, 102.256], "c01-014": [102.606, 110.567]}, "blocks": [{"t": "img", "src": "images/01.webp", "vid": "images/01.mp4", "cap": "蓝蓝的深海里，长着会摇摆的奇异花草", "n": 1}, {"t": "p", "s": [["c01-001", "在很远很远的大海里，海水蓝得像矢车菊的花瓣，又清得像最亮的玻璃。"], ["c01-002", "那里的海非常非常深，就算把好多好多座教堂的尖塔一座接一座地叠起来，也够不到海面。"]]}, {"t": "p", "s": [["c01-003", "海底不是光秃秃的白沙。"], ["c01-004", "那里长着奇异的树和花，它们的叶子和枝条软软的，海水轻轻一动，它们就跟着摇摆，好像活的一样。"], ["c01-005", "大鱼小鱼在枝叶中间穿来穿去，就像陆地上的鸟儿在树林里飞。"]]}, {"t": "img", "src": "images/24.webp", "vid": "images/24.mp4", "cap": "珊瑚砌成的海王宫殿", "n": 2}, {"t": "p", "s": [["c01-006", "在海底最深的地方，有一座海王的宫殿。"], ["c01-007", "宫殿的墙是用珊瑚砌成的，又高又尖的窗子是用最亮的琥珀做的，屋顶上铺着黑色的贝壳。"], ["c01-008", "贝壳一张一合，随着海水呼吸，每一片贝壳里都躺着一颗亮晶晶的珍珠。"]]}, {"t": "img", "src": "images/25.webp", "vid": "images/25.mp4", "cap": "老祖母和六位小公主", "n": 3}, {"t": "p", "s": [["c01-009", "海王的妻子很早就去世了，宫里的事由他年老的母亲来照料。"], ["c01-010", "老祖母是一位聪明又慈祥的老太太。"], ["c01-011", "她最疼爱的，是海王的六个小公主，六个女孩儿都长得很美。"]]}, {"t": "p", "s": [["c01-012", "其中最小的那一位，是最美的一个。"], ["c01-013", "她的皮肤像玫瑰花瓣一样光滑细嫩，她的眼睛像最深的海水一样蓝。"], ["c01-014", "不过，和姐姐们一样，她没有腿，她的身体下面是一条闪闪发光的鱼尾巴。"]]}]}, {"title": "第二章　小花园", "head": "c02-h", "audio": "audio/ch02.m4a", "duration": 121.442, "times": {"c02-h": [0.0, 2.688], "c02-001": [3.688, 14.904], "c02-002": [15.254, 20.834], "c02-003": [21.684, 29.013], "c02-004": [29.363, 38.458], "c02-005": [39.308, 44.115], "c02-006": [44.465, 53.718], "c02-007": [54.068, 60.318], "c02-008": [60.668, 71.378], "c02-009": [72.228, 76.271], "c02-010": [76.621, 83.597], "c02-011": [84.447, 87.811], "c02-012": [88.161, 97.941], "c02-013": [98.291, 105.629], "c02-014": [106.479, 112.564], "c02-015": [112.914, 119.942]}, "blocks": [{"t": "img", "src": "images/02.webp", "vid": "images/02.mp4", "cap": "六位公主各有一小块花园", "n": 4}, {"t": "p", "s": [["c02-001", "宫殿外面有一座大花园，长着火红色和深蓝色的树，果子亮得像金子，花儿像燃烧的小火苗。"], ["c02-002", "六位公主每人都有一小块花园，可以随自己的心意种花。"]]}, {"t": "p", "s": [["c02-003", "大姐把花坛做成一头鲸鱼的样子，二姐把花坛做成一条小美人鱼的样子。"], ["c02-004", "可是最小的公主，把她的花坛做成圆圆的，像太阳一样，里面只种红得像太阳的花。"]]}, {"t": "img", "src": "images/26.webp", "vid": "images/26.mp4", "cap": "她只喜欢那尊大理石雕像", "n": 5}, {"t": "p", "s": [["c02-005", "小公主是个安静的孩子，常常一个人想心事。"], ["c02-006", "别的姐姐喜欢收集沉船里捡来的稀奇东西，她却只喜欢一件东西：一尊大理石雕像。"], ["c02-007", "那是一个英俊男孩的石像，是从一艘沉船上落到海底的。"], ["c02-008", "她在雕像旁边种了一棵垂柳一样的红色珊瑚树，枝条垂下来，在蓝色的沙地上投下紫色的影子。"]]}, {"t": "img", "src": "images/03.webp", "vid": "images/03.mp4", "cap": "老祖母讲着海面上的世界", "n": 6}, {"t": "p", "s": [["c02-009", "她最喜欢听老祖母讲海面上的世界。"], ["c02-010", "老祖母把她知道的船只、城市、人和动物，全都讲给她听。"]]}, {"t": "p", "s": [["c02-011", "“陆地上的花是会散发香气的。”"], ["c02-012", "老祖母说，“那里的森林是绿色的，在树枝间游来游去的鱼儿会唱歌，唱得又清脆又好听。”"], ["c02-013", "老祖母说的鱼儿，其实就是小鸟，因为小公主们从来没有见过鸟。"]]}, {"t": "p", "s": [["c02-014", "“等你们满了十五岁，”老祖母说，“我就准许你们浮到海面上去。"], ["c02-015", "你们可以坐在月光下的礁石上，看大船从身边开过，还能看到森林和城市。”"]]}]}, {"title": "第三章　浮出海面", "head": "c03-h", "audio": "audio/ch03.m4a", "duration": 127.62, "times": {"c03-h": [0.0, 2.927], "c03-001": [3.927, 7.295], "c03-002": [7.645, 13.399], "c03-003": [13.749, 18.104], "c03-004": [18.954, 29.491], "c03-005": [29.841, 36.9], "c03-006": [37.25, 44.251], "c03-007": [45.101, 56.648], "c03-008": [56.998, 62.516], "c03-009": [63.366, 66.117], "c03-010": [66.467, 72.232], "c03-011": [73.082, 76.419], "c03-012": [77.269, 79.957], "c03-013": [80.307, 87.006], "c03-014": [87.356, 95.083], "c03-015": [95.933, 96.644], "c03-016": [96.994, 102.917], "c03-017": [107.505, 115.469], "c03-018": [115.819, 120.612], "c03-019": [120.962, 126.12]}, "blocks": [{"t": "img", "src": "images/27.webp", "vid": "images/27.mp4", "cap": "姐姐们浮上海面，看见了城市的灯光", "n": 7}, {"t": "p", "s": [["c03-001", "第二年，大姐满了十五岁。"], ["c03-002", "接下来，姐姐们一年一个，轮流浮上了海面。"], ["c03-003", "每个人回来的时候，都有讲不完的新鲜事。"]]}, {"t": "p", "s": [["c03-004", "大姐说，最美的是在月光下躺在沙滩边，望着海岸上的大城市，灯光像几百颗星星一样闪烁。"], ["c03-005", "二姐说，最美的是太阳落山的时候，整个天空都像金子一样。"], ["c03-006", "三姐游进了一条大河，看见了绿色的葡萄山和在水里玩耍的小孩子。"]]}, {"t": "img", "src": "images/28.webp", "vid": "images/28.mp4", "cap": "姐姐们浮上去了，她独自留在海底", "n": 8}, {"t": "p", "s": [["c03-007", "每当姐姐们挽着手，一起浮上海面的时候，最小的公主就独自留在下面，望着她们的背影，真想哭出来。"], ["c03-008", "可是美人鱼是没有眼泪的，所以她心里更难过了。"]]}, {"t": "p", "s": [["c03-009", "“啊，我要是满十五岁该多好啊！”"], ["c03-010", "她说，“我知道，我一定会喜欢上面的世界，也会喜欢住在那里的人。”"]]}, {"t": "img", "src": "images/29.webp", "vid": "images/29.mp4", "cap": "老祖母给她戴上百合花环", "n": 9}, {"t": "p", "s": [["c03-011", "终于，她也满了十五岁。"]]}, {"t": "p", "s": [["c03-012", "“好啦，你也长大了。”"], ["c03-013", "老祖母说，“来吧，让我像打扮你的姐姐们一样，打扮打扮你。”"], ["c03-014", "老祖母在她的头发上戴了一个白百合花环，每一片花瓣都是半颗珍珠。"]]}, {"t": "p", "s": [["c03-015", "“再见啦！”"], ["c03-016", "小公主说着，像一个气泡一样，轻轻地向上浮去。"]]}, {"t": "img", "src": "images/04.webp", "vid": "images/04.mp4", "cap": "十五岁那天，她第一次浮出海面", "n": 10}, {"t": "p", "s": [["c03-017", "她把头伸出海面的时候，太阳刚刚落下去，云朵还是玫瑰色和金色的。"], ["c03-018", "在淡红色的天空里，第一颗星星亮了起来。"], ["c03-019", "空气又柔和又新鲜，海面一点儿波浪也没有。"]]}]}, {"title": "第四章　船上的生日", "head": "c04-h", "audio": "audio/ch04.m4a", "duration": 85.142, "times": {"c04-h": [0.0, 3.184], "c04-001": [4.184, 8.474], "c04-002": [8.824, 11.533], "c04-003": [11.883, 20.316], "c04-004": [21.166, 24.37], "c04-005": [24.72, 33.502], "c04-006": [33.852, 41.007], "c04-007": [41.357, 47.277], "c04-008": [48.127, 51.438], "c04-009": [51.788, 60.035], "c04-010": [65.025, 68.639], "c04-011": [68.989, 76.167], "c04-012": [77.017, 81.024], "c04-013": [81.374, 83.642]}, "blocks": [{"t": "img", "src": "images/05.webp", "vid": "images/05.mp4", "cap": "船上正在庆祝王子的生日", "n": 11}, {"t": "p", "s": [["c04-001", "海面上停着一艘有三根桅杆的大船。"], ["c04-002", "船上响着音乐和歌声。"], ["c04-003", "天黑以后，船上点起了几百盏彩色的灯笼，好像全世界的旗子都在空中飘扬。"]]}, {"t": "p", "s": [["c04-004", "小公主一直游到船舱的窗边。"], ["c04-005", "每当海浪把她托起来，她就能透过明亮的玻璃窗，看见里面站着许多穿着漂亮衣服的人。"], ["c04-006", "其中最好看的，是一位年轻的王子，他有一双又大又黑的眼睛。"], ["c04-007", "原来，今天是王子的十六岁生日，所以大家才这样热闹。"]]}, {"t": "p", "s": [["c04-008", "水手们在甲板上跳起舞来。"], ["c04-009", "王子走出船舱的时候，一百多支烟火一起升上天空，把夜晚照得像白天一样亮。"], ["c04-010", "小公主吓了一跳，赶紧沉到水里。"], ["c04-011", "可是过了一会儿，她又忍不住把头伸出来，看着满天的星星好像都落了下来。"]]}, {"t": "p", "s": [["c04-012", "夜深了，小公主还是舍不得离开。"], ["c04-013", "她一直望着那位王子。"]]}]}, {"title": "第五章　暴风雨", "head": "c05-h", "audio": "audio/ch05.m4a", "duration": 187.676, "times": {"c05-h": [0.0, 2.724], "c05-001": [3.724, 8.521], "c05-002": [8.871, 12.919], "c05-003": [17.986, 27.391], "c05-004": [28.241, 31.82], "c05-005": [35.401, 39.134], "c05-006": [39.484, 44.395], "c05-007": [45.245, 50.684], "c05-008": [51.034, 57.61], "c05-009": [57.96, 62.467], "c05-010": [62.817, 68.379], "c05-011": [69.229, 71.191], "c05-012": [72.041, 79.76], "c05-013": [80.11, 82.523], "c05-014": [82.873, 87.061], "c05-015": [87.411, 92.989], "c05-016": [93.839, 96.842], "c05-017": [97.192, 104.911], "c05-018": [105.261, 111.397], "c05-019": [111.747, 116.384], "c05-020": [117.234, 129.552], "c05-021": [129.902, 135.483], "c05-022": [136.333, 143.155], "c05-023": [148.217, 156.209], "c05-024": [157.059, 159.989], "c05-025": [160.339, 163.734], "c05-026": [164.084, 168.67], "c05-027": [169.02, 177.853], "c05-028": [178.703, 181.157], "c05-029": [181.507, 186.176]}, "blocks": [{"t": "img", "src": "images/06.webp", "vid": "images/06.mp4", "cap": "暴风雨来了，大浪像黑色的高山", "n": 12}, {"t": "p", "s": [["c05-001", "突然，海水开始翻滚起来，越来越凶。"], ["c05-002", "远处闪起了电光，打起了可怕的雷。"], ["c05-003", "大船摇摇晃晃，帆被风撕破了，大浪像黑色的高山一样，一次又一次地向船扑过来。"]]}, {"t": "p", "s": [["c05-004", "“咔嚓”一声，大船的主桅断了。"], ["c05-005", "船身歪倒，海水冲进了船舱。"], ["c05-006", "小公主这才明白，船上的人遇到了危险。"]]}, {"t": "img", "src": "images/30.webp", "vid": "images/30.mp4", "cap": "她在漂来漂去的木头之间拼命地游", "n": 13}, {"t": "p", "s": [["c05-007", "在一道闪电的光里，她看见王子掉进了深深的大海。"], ["c05-008", "一开始，她还高兴了一下，因为王子可以到她的宫殿里来了。"], ["c05-009", "可是她马上想起来：人是不能在水里生活的。"], ["c05-010", "王子只有变成没有生命的样子，才能到海王的宫殿里去。"]]}, {"t": "p", "s": [["c05-011", "“不，他绝对不能死！”"]]}, {"t": "p", "s": [["c05-012", "她在漂来漂去的木头之间拼命地游，一会儿沉下去，一会儿又浮上来。"], ["c05-013", "终于，她找到了王子。"], ["c05-014", "王子已经没有力气了，眼睛紧紧闭着。"], ["c05-015", "小公主把他的头托出水面，让海浪带着他们漂。"]]}, {"t": "img", "src": "images/07.webp", "vid": "images/07.mp4", "cap": "她托着王子，在海浪里漂了一整夜", "n": 14}, {"t": "p", "s": [["c05-016", "天亮了，暴风雨停了。"], ["c05-017", "太阳升起来，把红色的光洒在海面上，王子的脸颊好像也有了一点儿血色。"], ["c05-018", "小公主轻轻吻了吻他的额头，把他湿漉漉的长发拨到后面。"], ["c05-019", "她觉得，他很像她花园里的那尊大理石雕像。"]]}, {"t": "img", "src": "images/08.webp", "vid": "images/08.mp4", "cap": "她躲在礁石后面，看着姑娘发现了王子", "n": 15}, {"t": "p", "s": [["c05-020", "她看见前面有一片陆地，岸边有一座白色的房子，旁边是一片小海湾，水很平静，下面是细细的白沙。"], ["c05-021", "她把王子托到沙滩上，让他的头靠在温暖的阳光里。"]]}, {"t": "p", "s": [["c05-022", "不一会儿，白房子里的钟声响了，一群年轻的姑娘走进了花园。"], ["c05-023", "小公主赶紧游到远处的几块礁石后面，用海水的泡沫盖住头发，静静地看着。"]]}, {"t": "p", "s": [["c05-024", "一位年轻的姑娘发现了王子。"], ["c05-025", "她吃了一惊，马上叫来了别的人。"], ["c05-026", "王子醒了过来，对着身边的每一个人微笑。"], ["c05-027", "可是，他没有对小公主微笑，因为他根本不知道，是谁把他从大海里救了出来。"]]}, {"t": "p", "s": [["c05-028", "小公主心里难过极了。"], ["c05-029", "她沉进水里，悲伤地回到了父亲的宫殿。"]]}]}, {"title": "第六章　思念", "head": "c06-h", "audio": "audio/ch06.m4a", "duration": 126.869, "times": {"c06-h": [0.0, 2.859], "c06-001": [3.859, 9.669], "c06-002": [10.019, 15.461], "c06-003": [16.311, 21.73], "c06-004": [22.08, 29.117], "c06-005": [29.467, 35.964], "c06-006": [36.814, 46.019], "c06-007": [46.369, 56.145], "c06-008": [56.995, 62.47], "c06-009": [62.82, 65.499], "c06-010": [65.849, 73.136], "c06-011": [73.986, 75.052], "c06-012": [75.402, 76.84], "c06-013": [77.19, 84.012], "c06-014": [84.862, 92.636], "c06-015": [92.986, 98.493], "c06-016": [98.843, 106.361], "c06-017": [106.711, 111.094], "c06-018": [111.944, 120.022], "c06-019": [120.372, 125.369]}, "blocks": [{"t": "img", "src": "images/31.webp", "vid": "images/31.mp4", "cap": "她一次次浮到放下王子的地方", "n": 16}, {"t": "p", "s": [["c06-001", "从那以后，小公主变得更加安静，更加爱想心事了。"], ["c06-002", "姐姐们问她第一次去海面上看见了什么，她什么也不说。"]]}, {"t": "p", "s": [["c06-003", "许多个早晨和傍晚，她都浮到那个放下王子的地方。"], ["c06-004", "她看见花园里的果子熟了，被人摘走；她看见山顶上的雪化了。"], ["c06-005", "可是她一次也没有见到王子，于是每次回家，都比上一次更难过。"]]}, {"t": "img", "src": "images/09.webp", "vid": "images/09.mp4", "cap": "她抱着那尊大理石雕像，想念王子", "n": 17}, {"t": "p", "s": [["c06-006", "她唯一的安慰，就是坐在自己的小花园里，用手臂抱住那尊很像王子的大理石雕像。"], ["c06-007", "她不再照顾她的花，花儿长得乱糟糟的，长长的枝叶缠在一起，把小花园遮得暗暗的。"]]}, {"t": "p", "s": [["c06-008", "后来，她实在忍不住了，就把心事告诉了一个姐姐。"], ["c06-009", "其他的姐姐也就都知道了。"], ["c06-010", "有一位美人鱼姐姐，正好知道那位王子是谁，也知道他的王宫在哪里。"]]}, {"t": "img", "src": "images/10.webp", "vid": "images/10.mp4", "cap": "姐姐们手挽着手，带她去看王子的王宫", "n": 18}, {"t": "p", "s": [["c06-011", "“来吧，小妹妹！”"], ["c06-012", "姐姐们说。"], ["c06-013", "她们手挽着手，排成长长的一排，浮到了王子的王宫前面。"]]}, {"t": "img", "src": "images/32.webp", "vid": "images/32.mp4", "cap": "月光下，她静静地看着王子", "n": 19}, {"t": "p", "s": [["c06-014", "那座王宫是用淡黄色的石头砌成的，有宽大的大理石台阶，一直通到海里。"], ["c06-015", "从那以后，小公主常常在傍晚和夜里游到那里。"], ["c06-016", "她游得比谁都近，甚至游进窄窄的水道，一直游到大理石的阳台下面。"], ["c06-017", "在月光下，她静静地看着那位年轻的王子。"]]}, {"t": "p", "s": [["c06-018", "她听渔夫们说起王子做的许多好事，心里就更高兴了：是她救了他的命啊。"], ["c06-019", "她越来越喜欢人类，越来越想走到他们中间去。"]]}]}, {"title": "第七章　老祖母的话", "head": "c07-h", "audio": "audio/ch07.m4a", "duration": 118.722, "times": {"c07-h": [0.0, 2.704], "c07-001": [3.704, 5.398], "c07-002": [5.748, 9.864], "c07-003": [10.714, 12.44], "c07-004": [12.79, 17.192], "c07-005": [17.542, 24.799], "c07-006": [25.649, 31.074], "c07-007": [31.424, 41.414], "c07-008": [42.264, 48.02], "c07-009": [48.37, 49.869], "c07-010": [50.719, 52.504], "c07-011": [52.854, 58.241], "c07-012": [59.091, 62.114], "c07-013": [62.964, 64.717], "c07-014": [65.067, 76.722], "c07-015": [77.072, 80.576], "c07-016": [80.926, 87.177], "c07-017": [88.027, 92.784], "c07-018": [93.634, 97.876], "c07-019": [98.226, 102.625], "c07-020": [102.975, 110.821], "c07-021": [111.171, 117.222]}, "blocks": [{"t": "img", "src": "images/33.webp", "vid": "images/33.mp4", "cap": "她问老祖母：人类会永远活着吗？", "n": 20}, {"t": "p", "s": [["c07-001", "“人类会永远活着吗？”"], ["c07-002", "小公主问老祖母，“他们会不会像我们一样死去呢？”"]]}, {"t": "p", "s": [["c07-003", "“他们也会死的。”"], ["c07-004", "老祖母说，“而且他们的生命比我们短。"], ["c07-005", "我们可以活三百岁，可是当我们的生命结束的时候，我们就会变成海上的泡沫。”"]]}, {"t": "p", "s": [["c07-006", "“人类却不一样，”老祖母接着说，“他们有一个灵魂。"], ["c07-007", "身体消失以后，灵魂还会一直活着，升上明亮的天空，飞到我们永远看不到的美丽地方去。”"]]}, {"t": "p", "s": [["c07-008", "“我愿意用我的三百年，去换一个人类的灵魂，哪怕只做一天的人也好。”"], ["c07-009", "小公主说。"]]}, {"t": "p", "s": [["c07-010", "“你可不能这么想。”"], ["c07-011", "老祖母说，“我们在海底，比上面的人幸福多啦。”"]]}, {"t": "p", "s": [["c07-012", "“有没有什么办法，让我也得到一个灵魂呢？”"]]}, {"t": "p", "s": [["c07-013", "“只有一个办法。”"], ["c07-014", "老祖母说，“要是有一个人爱你，爱你胜过爱他的爸爸妈妈，全心全意地爱你，还和你结婚，那么他的灵魂就会分一部分给你。"], ["c07-015", "可是，这种事情是不可能发生的。"], ["c07-016", "你的鱼尾巴在海里是最美的，可是在陆地上，人们却觉得它很难看。”"]]}, {"t": "p", "s": [["c07-017", "小公主叹了一口气，低头看了看自己的鱼尾巴。"]]}, {"t": "img", "src": "images/34.webp", "vid": "images/34.mp4", "cap": "宫殿里的舞会，她的歌声最美", "n": 21}, {"t": "p", "s": [["c07-018", "那天晚上，宫殿里开了一场盛大的舞会。"], ["c07-019", "小公主的歌声是最美的，大家都为她鼓掌。"], ["c07-020", "她也开心了一会儿，因为她知道，她的声音是陆地上和海底最好听的声音。"], ["c07-021", "可是很快，她又想起了上面的世界，想起了那位王子。"]]}]}, {"title": "第八章　海巫婆", "head": "c08-h", "audio": "audio/ch08.m4a", "duration": 235.097, "times": {"c08-h": [0.0, 2.692], "c08-001": [3.692, 9.27], "c08-002": [9.62, 12.978], "c08-003": [13.828, 19.576], "c08-004": [19.926, 27.362], "c08-005": [27.712, 37.099], "c08-006": [37.949, 44.499], "c08-007": [44.849, 48.952], "c08-008": [49.302, 58.765], "c08-009": [59.615, 64.024], "c08-010": [64.874, 66.438], "c08-011": [66.788, 76.24], "c08-012": [77.09, 78.707], "c08-013": [79.057, 84.407], "c08-014": [84.757, 87.952], "c08-015": [88.302, 93.333], "c08-016": [94.183, 98.034], "c08-017": [98.384, 102.204], "c08-018": [102.554, 104.35], "c08-019": [105.2, 105.961], "c08-020": [106.311, 108.702], "c08-021": [109.052, 113.835], "c08-022": [114.685, 121.576], "c08-023": [121.926, 125.776], "c08-024": [126.126, 138.038], "c08-025": [138.888, 139.645], "c08-026": [139.995, 145.135], "c08-027": [145.985, 148.382], "c08-028": [148.732, 151.917], "c08-029": [152.267, 157.687], "c08-030": [158.037, 160.834], "c08-031": [161.684, 167.782], "c08-032": [168.632, 174.171], "c08-033": [174.521, 179.036], "c08-034": [179.886, 180.759], "c08-035": [181.109, 182.484], "c08-036": [183.334, 189.074], "c08-037": [192.595, 198.111], "c08-038": [198.461, 205.782], "c08-039": [206.632, 209.424], "c08-040": [209.774, 214.12], "c08-041": [214.47, 220.005], "c08-042": [220.355, 233.597]}, "blocks": [{"t": "img", "src": "images/11.webp", "vid": "images/11.mp4", "cap": "去海巫婆家的路，没有花也没有海草", "n": 22}, {"t": "p", "s": [["c08-001", "她悄悄离开了快乐的宫殿，向海巫婆住的地方游去。"], ["c08-002", "以前，她从来没有走过这条路。"]]}, {"t": "p", "s": [["c08-003", "那里没有花，也没有海草，只有光秃秃的灰色沙地。"], ["c08-004", "她要穿过一个个像水车一样旋转的大漩涡，还要穿过一片奇怪的树林。"], ["c08-005", "那里的树和灌木都是珊瑚虫，它们伸着长长的、软软的手臂，想抓住经过的一切东西。"]]}, {"t": "img", "src": "images/12.webp", "vid": "images/12.mp4", "cap": "穿过伸着长手臂的珊瑚虫树林", "n": 23}, {"t": "p", "s": [["c08-006", "小公主害怕极了，心怦怦直跳，差点儿就要转身回去。"], ["c08-007", "可是她一想起王子，又鼓起了勇气。"], ["c08-008", "她把长长的头发紧紧地盘在头上，双手抱在胸前，像一条鱼一样，飞快地游了过去。"]]}, {"t": "img", "src": "images/35.webp", "vid": "images/35.mp4", "cap": "海巫婆说：我知道你想要什么", "n": 24}, {"t": "p", "s": [["c08-009", "海巫婆住在一座用沉船的木头搭成的房子里。"]]}, {"t": "p", "s": [["c08-010", "“我知道你想要什么。”"], ["c08-011", "海巫婆说，“你想去掉你的鱼尾巴，换成两条腿，像人一样走路，好让那位年轻的王子爱上你，对不对？”"]]}, {"t": "p", "s": [["c08-012", "“我可以给你调一服药。"], ["c08-013", "你在太阳升起以前，游到陆地上，坐在海岸边把它喝下去。"], ["c08-014", "你的尾巴就会变成一双漂亮的腿。"], ["c08-015", "可是，那会很疼，就像有一把尖刀刺过你的身体。”"]]}, {"t": "p", "s": [["c08-016", "“你走起路来，会比任何一个跳舞的人都轻盈。"], ["c08-017", "可是你每走一步，都会像踩在刀尖上一样疼。"], ["c08-018", "你愿意忍受这一切吗？”"]]}, {"t": "p", "s": [["c08-019", "“我愿意。”"], ["c08-020", "小公主声音发抖地说。"], ["c08-021", "她想着王子，也想着那个永远不会消失的灵魂。"]]}, {"t": "p", "s": [["c08-022", "“可是你要记住，”海巫婆说，“你一旦变成了人，就再也不能变回美人鱼了。"], ["c08-023", "你再也不能回到姐姐们身边，也不能回到父亲的宫殿。"], ["c08-024", "要是王子没有全心全意地爱你，没有和你结婚，而是娶了别人，那么在他结婚后的第一个早晨，你的心就会碎掉，你就会变成海上的泡沫。”"]]}, {"t": "p", "s": [["c08-025", "“我不怕。”"], ["c08-026", "小公主说，她的脸变得像死一样苍白。"]]}, {"t": "img", "src": "images/13.webp", "vid": "images/13.mp4", "cap": "海巫婆把她的歌声收进了海螺里", "n": 25}, {"t": "p", "s": [["c08-027", "“还有，你得付给我报酬。”"], ["c08-028", "海巫婆说，“我要的东西可不少。"], ["c08-029", "你有海底最美的声音，你想用它去打动王子的心。"], ["c08-030", "可是这个声音，你必须交给我。”"]]}, {"t": "p", "s": [["c08-031", "“可是，如果你拿走了我的声音，”小公主说，“我还剩下什么呢？”"]]}, {"t": "p", "s": [["c08-032", "“你还有美丽的样子，轻盈的步子，还有一双会说话的眼睛。”"], ["c08-033", "海巫婆说，“用这些，你就能打动一个人的心了。”"]]}, {"t": "p", "s": [["c08-034", "“那就这样吧。”"], ["c08-035", "小公主说。"]]}, {"t": "p", "s": [["c08-036", "海巫婆把小公主最美的歌声，收进了一只小小的海螺里。"], ["c08-037", "从那一刻起，小公主再也不能说话，也不能唱歌了。"], ["c08-038", "海巫婆把一小瓶亮晶晶的药水交给了她，那药水像一颗星星一样闪着光。"]]}, {"t": "img", "src": "images/36.webp", "vid": "images/36.mp4", "cap": "她向宫殿送出了一千个吻", "n": 26}, {"t": "p", "s": [["c08-039", "小公主回头看了看父亲的宫殿。"], ["c08-040", "舞厅里的火把已经熄灭了，大家都睡着了。"], ["c08-041", "她不敢进去，因为她已经不能说话，又快要永远离开了。"], ["c08-042", "她悄悄地走进花园，从每个姐姐的花坛里摘了一朵花，向着宫殿送出了一千个吻，然后穿过深蓝色的海水，浮了上去。"]]}]}, {"title": "第九章　来到陆地", "head": "c09-h", "audio": "audio/ch09.m4a", "duration": 162.512, "times": {"c09-h": [0.0, 2.572], "c09-001": [3.572, 8.435], "c09-002": [8.785, 15.257], "c09-003": [15.607, 22.229], "c09-004": [23.079, 27.774], "c09-005": [28.124, 35.308], "c09-006": [35.658, 38.939], "c09-007": [39.289, 46.503], "c09-008": [47.353, 51.192], "c09-009": [51.542, 58.635], "c09-010": [58.985, 62.577], "c09-011": [63.427, 69.857], "c09-012": [70.207, 73.472], "c09-013": [73.822, 78.368], "c09-014": [78.718, 84.15], "c09-015": [85.0, 90.06], "c09-016": [90.41, 96.547], "c09-017": [96.897, 107.509], "c09-018": [107.859, 113.999], "c09-019": [114.849, 121.104], "c09-020": [121.454, 123.057], "c09-021": [123.907, 126.577], "c09-022": [126.927, 134.198], "c09-023": [134.548, 136.867], "c09-024": [137.217, 145.317], "c09-025": [146.167, 150.948], "c09-026": [151.298, 153.647], "c09-027": [153.997, 161.012]}, "blocks": [{"t": "img", "src": "images/14.webp", "vid": "images/14.mp4", "cap": "在月光下的大理石台阶上，她喝下了药水", "n": 27}, {"t": "p", "s": [["c09-001", "她来到王子的王宫时，太阳还没有出来。"], ["c09-002", "月亮明亮地照着，她坐在大理石台阶上，喝下了那瓶药水。"], ["c09-003", "她觉得好像有一把锋利的刀子刺进了她的身体，她疼得晕了过去。"]]}, {"t": "img", "src": "images/15.webp", "vid": "images/15.mp4", "cap": "醒来时，王子正望着她", "n": 28}, {"t": "p", "s": [["c09-004", "太阳升起来照在海面上的时候，她醒了过来。"], ["c09-005", "她感到一阵剧痛，可是就在她面前，站着那位年轻英俊的王子。"], ["c09-006", "他那双乌黑的眼睛正望着她。"], ["c09-007", "她低下头，发现自己的鱼尾巴不见了，变成了一双可爱的白白的小腿。"]]}, {"t": "p", "s": [["c09-008", "王子问她是谁，是怎样来到这里的。"], ["c09-009", "她用那双深蓝色的眼睛，温柔又难过地望着他，因为她已经不能说话了。"], ["c09-010", "王子拉着她的手，把她领进了王宫。"]]}, {"t": "p", "s": [["c09-011", "就像海巫婆说的那样，她每走一步，都像踩在尖刀上。"], ["c09-012", "可是她心甘情愿地忍受着。"], ["c09-013", "她牵着王子的手，走得像水泡一样轻盈。"], ["c09-014", "王子和所有的人，都对她那优美的步子感到惊奇。"]]}, {"t": "img", "src": "images/37.webp", "vid": "images/37.mp4", "cap": "她穿上了丝绸衣服，却不能唱歌", "n": 29}, {"t": "p", "s": [["c09-015", "宫里的人给她穿上了丝绸和细纱做的漂亮衣服。"], ["c09-016", "她是王宫里最美的人，可是她不能说话，也不能唱歌。"], ["c09-017", "有一天，一群穿着丝绸衣服的女孩子为王子唱歌，有一个唱得最好，王子为她鼓掌，对她微笑。"], ["c09-018", "小公主难过起来，因为她知道，自己原来唱得比她好听得多。"]]}, {"t": "p", "s": [["c09-019", "“啊，要是他知道，为了和他在一起，我永远交出了我的声音，那该多好啊！”"], ["c09-020", "她在心里想。"]]}, {"t": "img", "src": "images/16.webp", "vid": "images/16.mp4", "cap": "她踮起脚尖跳舞，没有人跳得像她那样美", "n": 30}, {"t": "p", "s": [["c09-021", "接着，女孩子们跳起舞来。"], ["c09-022", "小公主也举起美丽的手臂，踮起脚尖，在地板上轻轻地跳起舞来。"], ["c09-023", "没有人跳得像她那样美。"], ["c09-024", "她的每一个动作，都显出她的美丽；她的眼睛，比歌声更能打动人的心。"]]}, {"t": "p", "s": [["c09-025", "大家都看得入了迷，王子更是喜欢极了。"], ["c09-026", "他叫她“我的小孤儿”。"], ["c09-027", "她不停地跳着，虽然每一次脚碰到地面，都像踩在尖刀上一样。"]]}]}, {"title": "第十章　王子身边", "head": "c10-h", "audio": "audio/ch10.m4a", "duration": 154.13, "times": {"c10-h": [0.0, 2.92], "c10-001": [3.92, 8.002], "c10-002": [8.352, 18.977], "c10-003": [19.328, 34.894], "c10-004": [35.744, 39.31], "c10-005": [39.66, 47.334], "c10-006": [47.684, 51.663], "c10-007": [52.513, 58.189], "c10-008": [58.539, 62.317], "c10-009": [62.667, 71.254], "c10-010": [71.604, 76.663], "c10-011": [77.013, 83.987], "c10-012": [84.337, 88.262], "c10-013": [89.112, 95.092], "c10-014": [95.442, 100.148], "c10-015": [100.998, 102.491], "c10-016": [102.841, 110.588], "c10-017": [111.438, 113.869], "c10-018": [114.219, 117.158], "c10-019": [117.508, 123.615], "c10-020": [123.965, 126.343], "c10-021": [126.693, 129.909], "c10-022": [130.259, 135.599], "c10-023": [136.449, 139.246], "c10-024": [139.596, 148.401], "c10-025": [148.751, 152.63]}, "blocks": [{"t": "img", "src": "images/17.webp", "vid": "images/17.mp4", "cap": "她和王子骑马穿过香喷喷的树林", "n": 31}, {"t": "p", "s": [["c10-001", "王子说，她应该永远留在他的身边。"], ["c10-002", "王子带着她骑马，穿过香喷喷的树林，绿色的树枝拂过她的肩膀，小鸟在新长出的叶子里唱歌。"], ["c10-003", "她和王子一起爬上高高的山顶，她纤细的脚流了血，大家都看见了，可她只是笑着，跟着王子一直走，直到看见云朵在脚下飘过，就像一群飞向远方的鸟儿。"]]}, {"t": "img", "src": "images/18.webp", "vid": "images/18.mp4", "cap": "夜里，姐姐们浮出海面来看她", "n": 32}, {"t": "p", "s": [["c10-004", "夜里，王宫里的人都睡着了。"], ["c10-005", "小公主就走下宽大的大理石台阶，把发烫的双脚泡在凉凉的海水里。"], ["c10-006", "这时，她就会想起海底的家人。"]]}, {"t": "p", "s": [["c10-007", "有一天夜里，她的姐姐们手挽着手，浮出了海面。"], ["c10-008", "她们一边游，一边唱着悲伤的歌。"], ["c10-009", "小公主向她们招手，姐姐们认出了她，告诉她，她走了以后，大家有多么难过。"], ["c10-010", "从那以后，姐姐们每天夜里都来看她。"], ["c10-011", "有一次，她还远远地看见了好多年没有浮上海面的老祖母，和戴着王冠的海王。"], ["c10-012", "他们向她伸出手，可是不敢靠近岸边。"]]}, {"t": "img", "src": "images/38.webp", "vid": "images/38.mp4", "cap": "王子说：你让我想起神庙边的那个姑娘", "n": 33}, {"t": "p", "s": [["c10-013", "王子一天比一天更喜欢她，就像喜欢一个善良可爱的小孩子。"], ["c10-014", "可是，他从来没有想过要让她做他的王后。"]]}, {"t": "p", "s": [["c10-015", "“你是我最亲爱的人吗？”"], ["c10-016", "每当王子把她抱在怀里，吻她的额头的时候，小公主的眼睛好像就在这样问。"]]}, {"t": "p", "s": [["c10-017", "“是的，你是我最亲爱的人。”"], ["c10-018", "王子说，“因为你有一颗最善良的心。"], ["c10-019", "你让我想起一个姑娘，在我的船遇难以后，是她在海边的一座神庙旁边发现了我。"], ["c10-020", "她是我在这个世界上唯一会爱的人。"], ["c10-021", "可是她住在神庙里，我大概再也见不到她了。"], ["c10-022", "你和她长得很像，所以上天把你送到了我身边，我们永远也不分开。”"]]}, {"t": "p", "s": [["c10-023", "“唉，他不知道是我救了他的命啊！”"], ["c10-024", "小公主在心里想，“是我把他从海里托到了神庙旁边的树林里，是我躲在泡沫后面，看着那个姑娘走过来。”"], ["c10-025", "她不能说话，只能深深地叹气。"]]}]}, {"title": "第十一章　邻国的公主", "head": "c11-h", "audio": "audio/ch11.m4a", "duration": 126.233, "times": {"c11-h": [0.0, 3.184], "c11-001": [4.184, 9.1], "c11-002": [9.45, 13.948], "c11-003": [14.798, 18.96], "c11-004": [19.31, 21.163], "c11-005": [21.513, 26.1], "c11-006": [26.45, 32.099], "c11-007": [32.949, 35.802], "c11-008": [36.152, 50.658], "c11-009": [51.508, 56.575], "c11-010": [56.925, 62.687], "c11-011": [67.749, 71.256], "c11-012": [72.106, 75.119], "c11-013": [75.469, 79.574], "c11-014": [80.424, 80.973], "c11-015": [81.323, 89.152], "c11-016": [89.502, 95.877], "c11-017": [96.727, 99.584], "c11-018": [99.934, 101.718], "c11-019": [102.068, 106.663], "c11-020": [107.013, 111.454], "c11-021": [112.304, 114.825], "c11-022": [115.175, 118.542], "c11-023": [118.892, 124.733]}, "blocks": [{"t": "img", "src": "images/39.webp", "vid": "images/39.mp4", "cap": "她坐在船边，好像看见了海底的家", "n": 34}, {"t": "p", "s": [["c11-001", "后来，大家都说，王子要娶邻国国王的女儿了。"], ["c11-002", "王子要坐一艘漂亮的大船，去拜访邻国。"]]}, {"t": "p", "s": [["c11-003", "“我不能不去，”王子对小公主说，“这是我父母的意思。"], ["c11-004", "可是他们不会逼我娶她当新娘。"], ["c11-005", "我不会爱她的，她不像神庙里那个美丽的姑娘，可是你像。"], ["c11-006", "如果有一天我要选一个新娘，那我宁愿选你，我的会说话的眼睛的小孤儿。”"]]}, {"t": "p", "s": [["c11-007", "小公主跟着王子上了船。"], ["c11-008", "夜里，海面平静得像一面镜子，她坐在船边，望着清澈的海水，好像看见了父亲的宫殿，看见老祖母戴着银色的王冠，抬头望着船底。"]]}, {"t": "img", "src": "images/19.webp", "vid": "images/19.mp4", "cap": "邻国的公主来了", "n": 35}, {"t": "p", "s": [["c11-009", "第二天早上，船开进了邻国美丽的城市。"], ["c11-010", "教堂的钟声响了起来，高高的塔楼上吹起了号角。"], ["c11-011", "没过多久，邻国的公主来了。"]]}, {"t": "p", "s": [["c11-012", "小公主急着想看看她到底有多美。"], ["c11-013", "她不得不承认，她从来没有见过这么美的人。"]]}, {"t": "p", "s": [["c11-014", "“就是你！”"], ["c11-015", "王子一看见邻国公主，就高兴地叫了起来，“当我像死了一样躺在海岸上的时候，救了我的就是你！”"], ["c11-016", "原来，这位公主就是那个在神庙里长大、在海边发现王子的姑娘。"]]}, {"t": "img", "src": "images/40.webp", "vid": "images/40.mp4", "cap": "她吻了吻王子的手，心已经开始碎了", "n": 36}, {"t": "p", "s": [["c11-017", "王子把新娘紧紧地抱在怀里。"], ["c11-018", "“啊，我太幸福了！”"], ["c11-019", "他对小公主说，“我从来不敢想的愿望，终于实现了。"], ["c11-020", "你一定也会为我高兴的，因为在所有人里，你是最关心我的。”"]]}, {"t": "p", "s": [["c11-021", "小公主吻了吻王子的手。"], ["c11-022", "她觉得自己的心已经开始碎了。"], ["c11-023", "王子结婚后的第一个早晨，就是她变成海上泡沫的时候。"]]}]}, {"title": "第十二章　最后的夜晚", "head": "c12-h", "audio": "audio/ch12.m4a", "duration": 191.956, "times": {"c12-h": [0.0, 3.333], "c12-001": [4.333, 11.304], "c12-002": [16.366, 20.86], "c12-003": [21.21, 26.091], "c12-004": [26.941, 29.218], "c12-005": [29.568, 34.767], "c12-006": [35.117, 39.392], "c12-007": [39.742, 46.229], "c12-008": [47.079, 51.671], "c12-009": [52.021, 63.091], "c12-010": [63.941, 67.911], "c12-011": [68.261, 73.867], "c12-012": [74.717, 79.349], "c12-013": [79.699, 88.542], "c12-014": [89.392, 94.213], "c12-015": [94.563, 99.613], "c12-016": [99.963, 108.646], "c12-017": [108.996, 109.712], "c12-018": [110.062, 112.151], "c12-019": [113.001, 117.927], "c12-020": [118.777, 122.827], "c12-021": [123.177, 128.735], "c12-022": [129.085, 134.127], "c12-023": [134.977, 139.518], "c12-024": [139.868, 143.536], "c12-025": [143.886, 147.644], "c12-026": [148.494, 151.031], "c12-027": [151.881, 155.874], "c12-028": [156.724, 160.349], "c12-029": [163.245, 171.603], "c12-030": [172.453, 177.633], "c12-031": [177.983, 181.74], "c12-032": [185.818, 190.456]}, "blocks": [{"t": "img", "src": "images/41.webp", "vid": "images/41.mp4", "cap": "婚礼的大船上，她跳得从来没有这样美", "n": 37}, {"t": "p", "s": [["c12-001", "教堂的钟声响了，传令的人骑着马在街上宣布王子订婚的喜讯。"], ["c12-002", "那天傍晚，新郎和新娘一起上了大船。"], ["c12-003", "船上挂起了彩灯，水手们快乐地跳着舞。"]]}, {"t": "p", "s": [["c12-004", "小公主也跳起舞来。"], ["c12-005", "她跳得那么轻快，就像燕子被追赶时那样飞旋。"], ["c12-006", "大家都为她喝彩，她从来没有跳得这样美。"], ["c12-007", "她的脚像被刀割一样疼，可是她不觉得，因为她的心更疼。"]]}, {"t": "p", "s": [["c12-008", "她知道，这是她能看见王子的最后一个夜晚了。"], ["c12-009", "为了他，她离开了家人和家乡，交出了美妙的声音，每天忍受着疼痛，可是王子一点儿也不知道。"]]}, {"t": "img", "src": "images/20.webp", "vid": "images/20.mp4", "cap": "姐姐们剪掉了长发，换来一把刀子", "n": 38}, {"t": "p", "s": [["c12-010", "半夜过后，船上的人都睡着了。"], ["c12-011", "小公主靠在船边，望着东方，等着第一道阳光。"]]}, {"t": "p", "s": [["c12-012", "这时，她看见姐姐们从海浪里浮了起来。"], ["c12-013", "她们的脸色和她一样苍白，她们那美丽的长头发，不再在风里飘了，全被剪掉了。"]]}, {"t": "p", "s": [["c12-014", "“我们把头发交给了海巫婆，请她帮忙，好让你今晚不会死去。”"], ["c12-015", "姐姐们说，“她给了我们一把刀子，你看，它多么锋利！"], ["c12-016", "在太阳出来以前，你要是把它刺进王子的心里，你的双腿就会重新变成鱼尾巴，你就可以回到我们身边，再活三百年。"], ["c12-017", "快一点儿！"], ["c12-018", "太阳一出来，你就要死去了！”"]]}, {"t": "p", "s": [["c12-019", "姐姐们深深地叹了一口气，沉进了海浪里。"]]}, {"t": "img", "src": "images/42.webp", "vid": "images/42.mp4", "cap": "她拿着刀子，走到王子的房门口", "n": 39}, {"t": "p", "s": [["c12-020", "小公主拿着刀子，走到王子的房门口。"], ["c12-021", "她看见美丽的新娘把头靠在王子的胸口，安静地睡着。"], ["c12-022", "王子在睡梦里，轻轻地叫着新娘的名字。"]]}, {"t": "p", "s": [["c12-023", "小公主弯下腰，吻了吻王子美丽的额头。"], ["c12-024", "她看看天空，朝霞越来越亮了。"], ["c12-025", "她看看手里锋利的刀子，又看看王子。"]]}, {"t": "p", "s": [["c12-026", "刀子在她手里抖动着。"]]}, {"t": "p", "s": [["c12-027", "可是，她怎么能伤害自己深爱的人呢？"]]}, {"t": "img", "src": "images/21.webp", "vid": "images/21.mp4", "cap": "黎明前，她把刀子远远地扔进了海里", "n": 40}, {"t": "p", "s": [["c12-028", "她把刀子远远地扔进了海浪里。"], ["c12-029", "刀子落下的地方，海水闪出了一片红光，好像有几滴血从水里冒了出来。"]]}, {"t": "p", "s": [["c12-030", "她最后一次望了望王子，眼睛已经有一点儿模糊了。"], ["c12-031", "然后，她从船上跳进了大海。"], ["c12-032", "她觉得，自己的身体正在慢慢地化成泡沫。"]]}]}, {"title": "第十三章　空气的女儿", "head": "c13-h", "audio": "audio/ch13.m4a", "duration": 134.963, "times": {"c13-h": [0.0, 3.184], "c13-001": [4.184, 6.817], "c13-002": [7.167, 13.567], "c13-003": [13.917, 21.983], "c13-004": [22.333, 30.388], "c13-005": [31.238, 39.165], "c13-006": [43.186, 44.792], "c13-007": [45.142, 46.077], "c13-008": [46.427, 51.735], "c13-009": [52.585, 54.212], "c13-010": [54.562, 59.99], "c13-011": [60.34, 65.995], "c13-012": [66.845, 70.973], "c13-013": [71.323, 74.62], "c13-014": [74.97, 78.957], "c13-015": [79.807, 88.293], "c13-016": [88.643, 94.707], "c13-017": [95.557, 102.929], "c13-018": [103.779, 106.483], "c13-019": [106.833, 110.72], "c13-020": [111.07, 117.079], "c13-021": [117.929, 123.12], "c13-022": [123.47, 131.335], "c13-023": [132.185, 133.463]}, "blocks": [{"t": "img", "src": "images/22.webp", "vid": "images/22.mp4", "cap": "她跳进大海，慢慢化成了泡沫", "n": 41}, {"t": "p", "s": [["c13-001", "太阳从海上升起来了。"], ["c13-002",   const sec = document.createElement('section');
  sec.className = 'chapter'; sec.id = 'ch' + (ci + 1);
  const [no, ...rest] = ch.title.split('　');
  const h = document.createElement('h2');
  h.innerHTML = `<small>${no}</small>${rest.join(' ')}`;
  h.dataset.id = ch.head;
  sec.appendChild(h);
  const add = (id, el) => { const [s, e] = ch.times[id]; const L = { id, ch: ci, start: s, end: e, el }; lines.push(L); byId[id] = L; };
  add(ch.head, h);
  for (const b of ch.blocks) {
    if (b.t === 'p') {
      const p = document.createElement('p');
      for (const [id, text] of b.s) {
        const sp = document.createElement('span');
        sp.className = 's'; sp.dataset.id = id; sp.textContent = text;
        p.appendChild(sp); add(id, sp);
      }
      sec.appendChild(p);
    } else if (b.t === 'song') {
      // 插曲：歌名（前奏时高亮）+ 一行一句歌词，跟着演唱逐行高亮
      const d = document.createElement('div'); d.className = 'song';
      const h3 = document.createElement('h3'); h3.dataset.id = b.head; h3.textContent = b.title;
      d.appendChild(h3); add(b.head, h3);
      for (const [id, text] of b.lines) {
        const sp = document.createElement('span');
        sp.className = 's'; sp.dataset.id = id; sp.textContent = text;
        d.appendChild(sp); add(id, sp);
      }
      sec.appendChild(d);
    } else if (b.t === 'img') {
      const f = document.createElement('figure');
      f.innerHTML = `<div class="pic"><img loading="lazy" src="${b.src}" alt="${b.cap}"></div><figcaption><b>插图 ${b.n}</b>${b.cap}</figcaption>`;
      if (b.vid) {
        const v = document.createElement('video');
        v.muted = v.loop = v.playsInline = true; v.preload = 'none'; v.dataset.src = b.vid;
        v.setAttribute('muted', ''); v.setAttribute('playsinline', '');   // iOS 自动播放认属性
        v.onplaying = () => v.classList.toggle('on', anim);
        f.firstChild.appendChild(v); vio.observe(v);
      }
      sec.appendChild(f);
    } else {
      const d = document.createElement('div'); d.className = 'note'; d.textContent = b.text; sec.appendChild(d);
    }
  }
  story.appendChild(sec);
  const li = document.createElement('li');
  li.innerHTML = `<button data-ch="${ci}"><span>${ch.title.replace('　', ' ')}</span><span class="dur">${fmt(ch.duration)}</span></button>`;
  $('#toc').appendChild(li);
});
// 每幅插图从它的 from 那句开始显示，一直到下一幅开始
imgs.forEach(im => { im.ch = byId[im.from].ch; im.at = lines.indexOf(byId[im.from]); });
lines.forEach((L, k) => {
  let i = 0;
  while (i + 1 < imgs.length && imgs[i + 1].at <= k) i++;
  L.img = i;
});
const endMark = document.createElement('div'); endMark.className = 'end-mark'; endMark.textContent = '— 全书完 —';
story.appendChild(endMark);

// ---------- 播放 ----------
const audio = new Audio();
audio.preload = 'auto';
let cur = -1, active = null, playing = false;
let follow = true, userScrollAt = 0, speedIdx = 1;
const SPEEDS = [0.8, 1, 1.2, 1.5];

function loadChapter(ci) {
  if (ci === cur) return Promise.resolve();
  cur = ci;
  audio.src = BOOK.chapters[ci].audio;
  audio.playbackRate = SPEEDS[speedIdx];
  document.querySelectorAll('.toc button').forEach((b, i) => b.classList.toggle('now', i === ci));
  $('#seek').max = BOOK.chapters[ci].duration;
  updateMedia();
  return new Promise(res => audio.addEventListener('loadedmetadata', res, { once: true }));
}

async function playFrom(ci, t, autoplay = true) {
  await loadChapter(ci);
  audio.currentTime = t;
  sync(true);
  if (autoplay) { try { await audio.play(); } catch (e) { toast('点击播放按钮开始朗读'); } }
}
const playLine = (L, autoplay = true) => playFrom(L.ch, L.start + 0.001, autoplay);

function lineAt(ci, t) {
  // 找本章里开始时间 ≤ t 的最后一句
  let best = null;
  for (const L of lines) {
    if (L.ch !== ci) { if (best) break; continue; }
    if (L.start <= t + 0.03) best = L; else break;
  }
  return best;
}

function setActive(L, force) {
  if (L === active && !force) return;
  if (active) active.el.classList.remove('on');
  active = L;
  if (!L) return;
  L.el.classList.add('on');
  const idx = lines.indexOf(L);
  lines.forEach((x, i) => x.el.classList.toggle('past', i < idx));
  const ch = BOOK.chapters[L.ch];
  $('#nowTitle').textContent = ch.title.replace('　', ' ');
  if (mode !== 'read') showStage(L.img);   // 阅读模式不用舞台，免得在后台加载动图
  setSubtitle(L);
  if (follow && mode !== 'picture' && (force || Date.now() - userScrollAt > 5000)) {
    const r = L.el.getBoundingClientRect();
    const vh = window.innerHeight;
    if (r.top < vh * 0.18 || r.bottom > vh * 0.62) {
      programmatic = Date.now();
      window.scrollBy({ top: r.top - vh * 0.32, behavior: 'smooth' });
    }
  }
}

function sync(force) {
  if (cur < 0) return;
  const t = audio.currentTime;
  setActive(lineAt(cur, t), force);
  if (!seeking) $('#seek').value = t;
  $('#nowTime').textContent = `${fmt(t)} / ${fmt(BOOK.chapters[cur].duration)}`;
}

let raf = 0;
function loop() { sync(false); raf = requestAnimationFrame(loop); }
audio.addEventListener('play', () => { playing = true; document.body.classList.add('playing'); story.classList.add('reading'); renderPlay(); cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause', () => { playing = false; document.body.classList.remove('playing'); renderPlay(); cancelAnimationFrame(raf); sync(false); savePos(); });
audio.addEventListener('ended', () => {
  if (cur < BOOK.chapters.length - 1) playFrom(cur + 1, 0);
  else { toast('故事讲完啦，晚安 🌙'); setActive(null); localStorage.removeItem(POS_KEY); }
});

function renderPlay() {
  $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $('#playBtn').setAttribute('aria-label', playing ? '暂停' : '播放');
}
renderPlay();

function toggle() {
  if (cur < 0) { const p = readPos(); return p ? playFrom(p.ch, p.t) : playFrom(0, 0); }
  playing ? audio.pause() : audio.play();
}
function step(d) {
  const i = active ? lines.indexOf(active) : -1;
  // 上一句：如果当前句已读了 1.5 秒以上，先回到本句开头
  if (d < 0 && active && audio.currentTime - active.start > 1.5) return playLine(active, playing || cur < 0);
  const L = lines[Math.min(lines.length - 1, Math.max(0, i + d))];
  if (L) playLine(L, true);
}
function chapterJump(d) {
  const ci = Math.min(BOOK.chapters.length - 1, Math.max(0, (cur < 0 ? 0 : cur) + d));
  playFrom(ci, 0);
}

// ---------- 交互 ----------
$('#playBtn').onclick = toggle;
$('#prevS').onclick = () => step(-1);
$('#nextS').onclick = () => step(1);
$('#prevCh').onclick = () => chapterJump(-1);
$('#nextCh').onclick = () => chapterJump(1);
$('#startBtn').onclick = () => playFrom(0, 0);
$('#tocBtn').onclick = () => {
  if (mode === 'picture') setMode('read', true);   // 纯图模式没有目录，先回到阅读模式
  $('.toc').scrollIntoView({ behavior: 'smooth' });
};
story.addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) { playLine(byId[el.dataset.id], true); userScrollAt = 0; return; }
  const pic = e.target.closest('figure .pic'), img = pic && pic.querySelector('img');
  if (img) { const lb = $('#lightbox'); lb.querySelector('img').src = img.src; lb.querySelector('p').textContent = img.alt; lb.classList.add('open'); }
});
$('#lightbox').onclick = () => $('#lightbox').classList.remove('open');
$('#toc').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ci = +b.dataset.ch;
  playFrom(ci, 0);
  document.getElementById('ch' + (ci + 1)).scrollIntoView({ behavior: 'smooth' });
});
$('#speedBtn').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  $('#speedBtn').textContent = SPEEDS[speedIdx].toFixed(1) + '×';
};
$('#followBtn').onclick = () => {
  follow = !follow;
  $('#followBtn').setAttribute('aria-pressed', follow);
  toast(follow ? '跟读：自动翻到正在读的地方' : '跟读已关闭，可以自由翻看');
  if (follow && active) setActive(active, true);
};
// ---------- 显示模式：阅读 / 左图右文（宽屏才有）/ 纯图 ----------
const MODES = { read: '阅读', split: '左图右文', picture: '纯图' };
const wide = matchMedia('(min-width: 900px)');
let mode = 'read', stageIdx = -1, stageLayer = 0;
$('#stageVid').onplaying = () => $('#stageVid').classList.add('show');
function showStage(i, force) {
  if (i === stageIdx && !force) return;
  stageIdx = i;
  const im = imgs[i];
  const layers = document.querySelectorAll('#stage img');
  const next = layers[stageLayer ^= 1], prev = layers[stageLayer ^ 1];
  next.onload = () => { next.classList.add('show'); prev.classList.remove('show'); };
  next.src = im.src;
  next.alt = im.cap;
  // 动图短片盖在静态图上，开始播放再淡入；阅读模式看不见舞台，不播
  const v = $('#stageVid');
  v.classList.remove('show');
  if (anim && im.vid && mode !== 'read') { v.src = im.vid; v.play().catch(() => {}); }
  else if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
  $('#stageBg').style.backgroundImage = `url("${im.src}")`;
  $('#stageCap').textContent = `插图 ${im.n} · ${im.cap}`;
  $('#stageTop').textContent = BOOK.chapters[(active || {}).ch ?? im.ch].title.replace('　', ' ');
}
// 字幕换句时先淡出再换字，免得两句文字跳动
let subT = 0;
function setSubtitle(L) {
  const sub = $('#stageSub');
  const text = !L ? '' : L.el.tagName === 'H2' ? BOOK.chapters[L.ch].title.replace('　', ' ')
    : L.el.tagName === 'H3' ? '♪ ' + L.el.textContent : L.el.closest('.song') ? '♪ ' + L.el.textContent + ' ♪' : L.el.textContent;
  if (sub.dataset.text === text) return;
  sub.dataset.text = text;
  sub.classList.add('fade');
  clearTimeout(subT);
  subT = setTimeout(() => { sub.textContent = text; sub.classList.remove('fade'); }, 180);
}
function setMode(m, quiet) {
  if (m === 'split' && !wide.matches) m = 'read';
  mode = m;
  document.body.dataset.mode = m;
  $('#modeBtn').textContent = MODES[m];
  try { localStorage.setItem(PREF + 'mode', m); } catch (e) {}
  showStage(active ? active.img : Math.max(0, stageIdx), true);
  if (m !== 'picture' && active) setTimeout(() => setActive(active, true), 30);
  if (!quiet) toast('显示模式：' + MODES[m] + (m === 'picture' ? '（点画面播放 / 暂停）' : ''));
}
$('#modeBtn').onclick = () => {
  const order = wide.matches ? ['read', 'split', 'picture'] : ['read', 'picture'];
  setMode(order[(order.indexOf(mode) + 1) % order.length]);
};
wide.addEventListener('change', () => { if (mode === 'split' && !wide.matches) setMode('read', true); });
$('#stage').onclick = () => { if (mode === 'picture') toggle(); };
$('#stagePlay').onclick = e => { e.stopPropagation(); toggle(); };
// 舞台的底边贴着播放条
new ResizeObserver(() => document.documentElement.style.setProperty('--ph', $('#player').offsetHeight + 'px')).observe($('#player'));
try { setMode(localStorage.getItem(PREF + 'mode') || 'read', true); } catch (e) { setMode('read', true); }

function renderAnim() {
  $('#animBtn').setAttribute('aria-pressed', anim);
  document.querySelectorAll('figure video').forEach(v => {
    if (anim) { vio.unobserve(v); vio.observe(v); }   // 重新观察会立即回调一次，看得见的接着播
    else { v.pause(); v.classList.remove('on'); }
  });
  if (stageIdx >= 0) showStage(stageIdx, true);
}
$('#animBtn').onclick = () => {
  anim = !anim;
  try { localStorage.setItem(PREF + 'anim', anim ? 'on' : 'off'); } catch (e) {}
  renderAnim();
  toast(anim ? '插图：动图' : '插图：静态图');
};
renderAnim();
$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(PREF + 'theme', root.dataset.theme); } catch (e) {}
};
try { const th = localStorage.getItem(PREF + 'theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; if (cur < 0) return; audio.currentTime = +$('#seek').value; sync(true); });
$('#seek').addEventListener('change', () => { seeking = false; });
if (cur < 0) $('#seek').addEventListener('pointerdown', () => { if (cur < 0) loadChapter(0); }, { once: true });

// 用户自己滚动页面时，暂停自动跟读 5 秒
let programmatic = 0;
['wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => { userScrollAt = Date.now(); }, { passive: true }));
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Escape') $('#lightbox').classList.remove('open');
});

// ---------- 记住上次听到哪里 ----------
function savePos() { if (cur < 0) return; try { localStorage.setItem(POS_KEY, JSON.stringify({ ch: cur, t: audio.currentTime, id: active && active.id })); } catch (e) {} }
function readPos() { try { const p = JSON.parse(localStorage.getItem(POS_KEY)); return p && p.ch >= 0 && p.ch < BOOK.chapters.length ? p : null; } catch (e) { return null; } }
setInterval(() => { if (playing) savePos(); }, 3000);
const last = readPos();
if (last && (last.ch > 0 || last.t > 5)) {
  const rb = $('#resumeBtn');
  rb.hidden = false;
  rb.textContent = `继续听 · ${BOOK.chapters[last.ch].title.split('　')[0]} ${fmt(last.t)}`;
  rb.onclick = () => {
    const L = last.id && byId[last.id];
    L ? playLine(L) : playFrom(last.ch, last.t);
    if (L) setTimeout(() => setActive(L, true), 50);
  };
}
$('#nowTitle').textContent = '点击任意一句，就从那里开始听';

// ---------- 锁屏 / 耳机控制 ----------
function updateMedia() {
  if (!('mediaSession' in navigator) || cur < 0) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: BOOK.chapters[cur].title.replace('　', ' '), artist: BOOK.voice, album: BOOK.title,
    artwork: [{ src: BOOK.cover, sizes: '1152x768', type: 'image/webp' }]
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => chapterJump(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => chapterJump(1));
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
</script>
</body>
</html>
