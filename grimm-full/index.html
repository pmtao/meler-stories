<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海的女儿 · 有声绘本</title>
<style>
:root {
  --paper: #f8f3e8;
  --paper-2: #f1e9d8;
  --ink: #2c2a33;
  --ink-soft: #6b6672;
  --sea: #1d6c88;
  --sea-deep: #123f55;
  --line: #e2d7c1;
  --mark: #ffe39a;
  --mark-ink: #2c2a33;
  --done: #8d8792;
  --bar: rgba(255, 252, 245, .94);
  --shadow: 0 8px 30px rgba(30, 50, 70, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
    --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
    --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
    --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a23; --paper-2: #15232f; --ink: #e9e4d8; --ink-soft: #a29fa8;
  --sea: #6cc3dd; --sea-deep: #9fdcef; --line: #263744; --mark: rgba(255, 210, 110, .26);
  --mark-ink: #fff6dc; --done: #8b8a90; --bar: rgba(17, 29, 39, .94);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 30vh; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* 封面 */
.cover { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8, 25, 40, 0) 30%, rgba(8, 25, 40, .55) 62%, rgba(8, 25, 40, .9)); }
.cover-in { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 56px; }
.kicker { letter-spacing: .3em; font-size: 13px; opacity: .85; }
.home { position: absolute; top: 18px; left: 20px; z-index: 2; color: #fff; text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; background: rgba(8, 25, 40, .35); backdrop-filter: blur(6px); }
.home:hover { background: rgba(8, 25, 40, .55); }
.cover h1 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(48px, 11vw, 84px);
  margin: 10px 0 6px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.cover p { margin: 0 0 22px; max-width: 30em; line-height: 1.8; opacity: .92; font-size: 15px; }
.cover .meta { font-size: 13px; opacity: .78; margin-bottom: 24px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin: -10px 0 24px; }
.versions a, .versions span { font-size: 13px; padding: 5px 14px; border-radius: 999px; color: #fff; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, .5); background: rgba(8, 25, 40, .3); }
.versions a:hover { background: rgba(8, 25, 40, .55); }
.versions[hidden] { display: none; }
.versions .on { background: #fff; color: #123f55; border-color: #fff; font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; }
.btn-main { background: #fff; color: #123f55; }
.btn-ghost { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.btn:hover { filter: brightness(1.05); }
.btn[hidden] { display: none; }
.btn svg { width: 18px; height: 18px; }

/* 目录 */
.toc { max-width: 760px; margin: 0 auto; padding: 40px 20px 8px; }
.toc-home { float: right; letter-spacing: .05em; font-weight: 500; color: var(--sea); text-decoration: none; }
.toc h2 { font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 600; margin: 0 0 14px; }
.toc ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.toc li button { width: 100%; text-align: left; background: var(--paper-2); border: 0; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.toc li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.toc li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.toc .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 正文 */
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 160px; }
.chapter { padding-top: 48px; }
.chapter h2 { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 30px; color: var(--sea-deep);
  margin: 0 0 22px; padding: 4px 10px; margin-left: -10px; border-radius: 10px; cursor: pointer;
  transition: background .3s; letter-spacing: .06em; }
.chapter h2 small { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  color: var(--ink-soft); letter-spacing: .2em; font-weight: 500; margin-bottom: 4px; }
.story p { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; font-size: 21px; line-height: 2.05;
  margin: 0 0 1.1em; text-align: justify; text-indent: 2em; }
.s { cursor: pointer; border-radius: 6px; padding: 2px 0; transition: background .35s, color .35s, box-shadow .35s;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s:hover { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.s.on, h2.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.reading .s.past { color: var(--done); }
figure { margin: 30px -20px 34px; }
figure .pic { position: relative; }
figure img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 0;
  background: var(--paper-2); cursor: zoom-in; box-shadow: var(--shadow); }
/* 动图是叠在静态图上的循环短片，开始播放才显出来 */
figure video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;
  cursor: zoom-in; opacity: 0; transition: opacity .4s; }
figure video.on { opacity: 1; }
figcaption { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 12px; letter-spacing: .05em; padding: 0 20px; }
figcaption b { color: var(--sea); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
@media (min-width: 800px) { figure { margin: 36px -40px 40px; } figure img, figure video { border-radius: 18px; } }
.note { font-size: 15px; line-height: 1.9; color: var(--ink-soft); background: var(--paper-2); border-radius: 14px;
  padding: 16px 20px; margin-top: 28px; }
.song { margin: 6px 0 30px; padding: 20px 16px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.song h3 { margin: 0 0 12px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 22px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; display: inline-block; padding: 2px 12px; border-radius: 8px; cursor: pointer;
  transition: background .35s, box-shadow .35s; }
.song h3::before { content: '♪ '; color: var(--sea); }
.song h3.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
.song .s { display: table; margin: 2px auto; padding: 1px 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 19px; line-height: 1.9; font-style: italic; color: var(--ink-soft); }
.song .s.on { color: var(--mark-ink); }
.end-mark { text-align: center; color: var(--ink-soft); margin: 40px 0 0; font-size: 14px; letter-spacing: .3em; }
/* 书末的「欣赏插曲」：全书插曲的播放列表 */
.songlist { margin: 40px 0 0; padding: 24px 18px 22px; text-align: center; border-radius: 18px;
  background: linear-gradient(var(--paper-2), transparent); }
.songlist h3 { margin: 0 0 4px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 24px; font-weight: normal;
  color: var(--sea-deep); letter-spacing: .1em; }
.songlist .sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
.btn-song { background: var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.songlist ol { list-style: none; padding: 0; margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px; text-align: left; counter-reset: song; }
.songlist li button { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  text-align: left; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.songlist li button::before { counter-increment: song; content: counter(song); grid-row: span 2; color: var(--sea); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.songlist li button:hover { box-shadow: inset 0 0 0 1px var(--sea); }
.songlist li button.now { box-shadow: inset 0 0 0 2px var(--sea); }
.songlist .dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 播放条 */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s; }
.player-in { max-width: 760px; margin: 0 auto; }
.now-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.now-line .title { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.now-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
/* 插图名称：纯图 / 左图右文模式下显示在章节标题右边 */
.now-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now-cap:empty, body[data-mode="read"] .now-cap { display: none; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 进度条：深色是已播放，浅色是已经下载好的部分（--seek-bg 由 paintSeek() 按 audio.buffered 算），网络慢时一眼看出还要等多久 */
.seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 8px 0 6px; height: 18px;
  background: transparent; cursor: pointer; --seek-bg: var(--line); }
.seek::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--seek-bg); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border: 0;
  border-radius: 50%; background: var(--sea); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--sea);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
/* 缓冲中：播放键外圈转圈 */
.play { position: relative; }
.play::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent;
  border-top-color: var(--sea); border-right-color: var(--sea); opacity: 0; transition: opacity .2s; pointer-events: none; }
body.buffering .play::after { opacity: 1; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); }
.ib:hover { background: var(--paper-2); }
.ib svg { width: 22px; height: 22px; }
.play { width: 54px; height: 54px; background: var(--sea); color: #fff; }
.play:hover { background: var(--sea); filter: brightness(1.08); }
.play svg { width: 26px; height: 26px; }
.pill { border: 0; background: var(--paper-2); border-radius: 999px; padding: 7px 12px; font-size: 13px;
  cursor: pointer; min-width: 58px; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="false"] { opacity: .55; }
.side { display: flex; gap: 6px; align-items: center; }

/* 看大图 */
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 18, .92); display: none;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; flex-direction: column; gap: 14px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 10px; }
.lightbox p { color: #e8e4da; margin: 0; font-size: 15px; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--sea-deep);
  color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .3s; z-index: 15; }
.toast.show { opacity: .95; }

/* 插图舞台：纯图模式铺满屏幕，左图右文模式占左半边 */
.stage { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: var(--ph, 120px); z-index: 5;
  background: #07121b; overflow: hidden; cursor: pointer; }
.stage-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) brightness(.55) saturate(1.2); transition: background-image .8s; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity .9s ease; }
.stage img.show, .stage video.show { opacity: 1; }
.stage video { transition-duration: .4s; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px 30px; color: #fff; display: flex;
  justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
  font-size: 14px; letter-spacing: .1em; background: linear-gradient(rgba(5, 15, 25, .6), transparent); pointer-events: none; }
/* 纯图模式的字幕：当前朗读的句子 */
.stage-sub { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: max-content;
  max-width: min(92%, 960px); padding: 10px 20px; border-radius: 14px; background: rgba(4, 12, 20, .3);
  color: #fff; text-align: center; pointer-events: none;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .8), 0 0 12px rgba(0, 0, 0, .55);
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: clamp(19px, 2.4vw, 30px); line-height: 1.55;
  letter-spacing: .03em; transition: opacity .25s; }
.stage-sub:empty, .stage-sub.fade { opacity: 0; }
body:not([data-mode="picture"]) .stage-sub { display: none; }
body[data-mode="picture"] .toast { bottom: auto; top: 64px; }
@media (max-width: 520px) {
  .stage-top { flex-direction: column; }
  .stage-sub { bottom: 16px; padding: 8px 14px; }
}
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #123f55; display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35); cursor: pointer; transition: opacity .3s; }
.stage-play svg { width: 38px; height: 38px; margin-left: 4px; }
body.playing .stage-play { opacity: 0; pointer-events: none; }

body[data-mode="picture"] .cover, body[data-mode="picture"] .toc, body[data-mode="picture"] main { display: none; }
body[data-mode="picture"] .stage { display: block; }
body[data-mode="picture"] #followBtn { display: none; }

@media (min-width: 900px) {
  body[data-mode="split"] .stage { display: block; right: 50%; }
  body[data-mode="split"] .stage img, body[data-mode="split"] .stage video { object-fit: cover; }
  body[data-mode="split"] .stage-bg, body[data-mode="split"] .stage-play { display: none; }
  body[data-mode="split"] .cover { display: none; }
  body[data-mode="split"] .toc, body[data-mode="split"] main { margin-left: 50%; max-width: none; padding-left: 48px; padding-right: 48px; }
  body[data-mode="split"] main figure { display: none; }
  body[data-mode="split"] .chapter:first-child { padding-top: 24px; }
}

/* 横屏手机：播放条收紧，把高度留给插图 */
@media (max-height: 500px) {
  .player { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .now-line { display: none; }
  .seek { margin: 2px 0; }
  .play { width: 44px; height: 44px; }
  .ib { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .story p { font-size: 19px; line-height: 1.95; }
  .chapter h2 { font-size: 26px; }
  .side .pill.opt { display: none; }
  .pill { padding: 6px 9px; min-width: 0; font-size: 12px; }
  #prevCh, #nextCh { display: none; }
  .side { gap: 4px; }
  .ib { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img id="coverImg" alt="">
  <a class="home" href="../index.html">‹ 故事目录</a>
  <div class="cover-in">
    <div class="kicker" id="kicker"></div>
    <h1 id="bookTitle"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <div class="versions" id="versions" hidden></div>
    <div class="cta">
      <button class="btn btn-main" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>从头开始听</button>
      <button class="btn btn-ghost" id="resumeBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目录">
  <h2>目　录<a class="toc-home" href="../index.html">更多故事 ›</a></h2>
  <ol id="toc"></ol>
</nav>

<main class="story" id="story"></main>

<div class="stage" id="stage" aria-label="插图">
  <div class="stage-bg" id="stageBg"></div>
  <img alt=""><img alt=""><video id="stageVid" muted loop playsinline></video>
  <div class="stage-top"><span id="stageTop"></span></div>
  <div class="stage-sub" id="stageSub" aria-live="polite"></div>
  <button class="stage-play" id="stagePlay" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="now-line"><span class="now-left"><span class="title" id="nowTitle"></span><span class="now-cap" id="stageCap"></span></span><span class="time" id="nowTime">00:00 / 00:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="本章进度">
    <div class="ctrls">
      <div class="side">
        <button class="pill" id="modeBtn" title="切换显示模式：阅读 / 左图右文 / 纯图">阅读</button>
        <button class="pill" id="speedBtn" title="朗读速度">1.0×</button>
        <button class="pill opt" id="followBtn" aria-pressed="true" title="朗读时自动翻到正在读的地方">跟读</button>
      </div>
      <div class="mid">
        <button class="ib" id="prevCh" title="上一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="prevS" title="上一句（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib play" id="playBtn" title="播放 / 暂停（空格）"></button>
        <button class="ib" id="nextS" title="下一句（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="nextCh" title="下一章"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <button class="pill" id="animBtn" title="插图用动图还是静态图">动图</button>
        <button class="pill opt" id="themeBtn" title="切换深浅色">主题</button>
        <button class="pill" id="tocBtn" title="回到目录">目录</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""><p></p></div>
<div class="toast" id="toast"></div>

<script>
const BOOK = {"id": "grimm-full", "title": "格林童话精选", "intro": "从《格林童话》里选了七个故事，按原著把情节讲全：汉赛尔与格莱特、白雪公主、青蛙王子、小红帽、十二个猎人、不莱梅的音乐家、幸运的汉斯。适合 5 到 10 岁的小朋友和爸爸妈妈一起读、一起听。", "kicker": "格林童话", "cover": "images/07.webp?v=947abd2632", "voice": "Elias（会讲故事的老师），本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "汉赛尔与格莱特　白色的小石子", "head": "c01-h", "audio": "audio/ch01.m4a?v=136e7f0021", "duration": 89.911, "times": {"c01-h": [0.0, 5.834], "c01-001": [6.834, 12.51], "c01-002": [12.86, 17.704], "c01-003": [18.554, 22.255], "c01-004": [22.605, 29.304], "c01-005": [29.654, 32.761], "c01-006": [33.611, 41.931], "c01-007": [42.281, 45.069], "c01-008": [45.919, 50.526], "c01-009": [51.376, 55.385], "c01-010": [56.235, 60.357], "c01-011": [60.707, 62.988], "c01-012": [63.838, 68.146], "c01-013": [68.996, 72.508], "c01-014": [72.858, 78.292], "c01-015": [78.642, 81.484], "c01-016": [82.334, 88.411]}, "blocks": [{"t": "img", "src": "images/01.webp?v=fd8c8f76b7", "vid": "images/01.mp4?v=5703810706", "cap": "森林边的小木屋", "n": 1}, {"t": "p", "s": [["c01-001", "从前，在一片大森林的边上，住着一个穷苦的樵夫。"], ["c01-002", "他有两个孩子，哥哥叫汉赛尔，妹妹叫格莱特。"]]}, {"t": "p", "s": [["c01-003", "那一年闹饥荒，家里连面包都快吃完了。"], ["c01-004", "晚上，樵夫躺在床上翻来覆去，叹着气说：“我们以后可怎么办哪？"], ["c01-005", "连自己都吃不饱，拿什么养活两个孩子呢？”"]]}, {"t": "p", "s": [["c01-006", "孩子们的继母对樵夫说：“明天一早，把两个孩子带到森林最深的地方去，让他们自己找路吧。"], ["c01-007", "不然，我们四个人都要饿死了。”"]]}, {"t": "p", "s": [["c01-008", "“不行，”樵夫说，“我怎么忍心把自己的孩子丢在森林里呢？”"]]}, {"t": "p", "s": [["c01-009", "樵夫心里难过极了，可是他拗不过继母。"]]}, {"t": "img", "src": "images/02.webp?v=9d307ff2e9", "vid": "images/02.mp4?v=2c3037cdaf", "cap": "偷听大人说话", "n": 2}, {"t": "p", "s": [["c01-010", "这些话，全被饿得睡不着的两个孩子听见了。"], ["c01-011", "格莱特伤心地哭了起来。"]]}, {"t": "p", "s": [["c01-012", "汉赛尔小声说：“别哭，格莱特，我有办法。”"]]}, {"t": "img", "src": "images/03.webp?v=01950457e9", "vid": "images/03.mp4?v=1e4a46356f", "cap": "月光下的白石子", "n": 3}, {"t": "p", "s": [["c01-013", "等大人睡着了，汉赛尔悄悄溜到门外。"], ["c01-014", "月光下，门前的小白石子闪闪发亮，像一枚枚银币。"], ["c01-015", "他弯下腰，把口袋装得满满的。"]]}, {"t": "p", "s": [["c01-016", "他回到屋里，对妹妹说：“放心睡吧，好妹妹，上帝不会丢下我们的。”"]]}]}, {"title": "汉赛尔与格莱特　跟着石子回家", "head": "c02-h", "audio": "audio/ch02.m4a?v=4397fdfc9a", "duration": 129.39, "times": {"c02-h": [0.0, 3.307], "c02-001": [4.307, 9.714], "c02-002": [10.064, 11.919], "c02-003": [12.269, 19.977], "c02-004": [20.827, 23.313], "c02-005": [23.663, 28.884], "c02-006": [29.734, 33.68], "c02-007": [34.53, 38.741], "c02-008": [39.591, 46.898], "c02-009": [47.748, 53.153], "c02-010": [53.503, 61.108], "c02-011": [61.958, 67.347], "c02-012": [67.697, 72.37], "c02-013": [72.72, 79.408], "c02-014": [83.934, 88.637], "c02-015": [89.487, 92.717], "c02-016": [93.067, 96.356], "c02-017": [96.706, 101.557], "c02-018": [102.407, 111.894], "c02-019": [112.744, 120.353], "c02-020": [120.703, 122.671], "c02-021": [123.021, 127.89]}, "blocks": [{"t": "p", "s": [["c02-001", "天还没亮，继母就把两个孩子叫醒了：“起来，懒虫！"], ["c02-002", "我们要去森林里砍柴。”"], ["c02-003", "她给了每人一小块面包，说：“这是你们的午饭，可别提前吃光了，再也没有别的了。”"]]}, {"t": "p", "s": [["c02-004", "第二天，一家人走进森林。"], ["c02-005", "汉赛尔走几步，就回头看一看，偷偷丢下一颗白石子。"]]}, {"t": "p", "s": [["c02-006", "樵夫问：“汉赛尔，你老回头看什么呀？”"]]}, {"t": "img", "src": "images/74.webp?v=b24d03ac43", "vid": "images/74.mp4?v=13506a6640", "cap": "屋顶上的小白猫", "n": 4}, {"t": "p", "s": [["c02-007", "“我在看我的小白猫，它坐在屋顶上，跟我说再见呢。”"]]}, {"t": "p", "s": [["c02-008", "继母说：“傻孩子，那不是你的小白猫，那是早上的太阳照在烟囱上。”"]]}, {"t": "p", "s": [["c02-009", "到了森林深处，樵夫捡来许多树枝，生了一大堆火。"], ["c02-010", "继母说：“孩子们，躺在火堆边歇一会儿，我们去砍柴，砍完了就来接你们。”"]]}, {"t": "img", "src": "images/75.webp?v=f49727a895", "vid": "images/75.mp4?v=c035f9184b", "cap": "咚咚的砍柴声", "n": 5}, {"t": "p", "s": [["c02-011", "兄妹俩坐在火堆旁，到了中午，各自吃了那一小块面包。"], ["c02-012", "他们听见“咚、咚”的砍柴声，以为爸爸就在附近。"], ["c02-013", "其实那是爸爸绑在枯树上的一根树枝，被风吹得一下一下地撞着树干。"]]}, {"t": "p", "s": [["c02-014", "他们等啊等，等得眼皮都睁不开，就睡着了。"]]}, {"t": "p", "s": [["c02-015", "等他们醒来，四周已经黑乎乎的了。"], ["c02-016", "格莱特哭着说：“我们怎么走出森林呢？”"], ["c02-017", "汉赛尔安慰她：“等一等，等月亮出来，我们就能找到路了。”"]]}, {"t": "img", "src": "images/04.webp?v=be754194f5", "vid": "images/04.mp4?v=a0e74f3262", "cap": "跟着石子回家", "n": 6}, {"t": "p", "s": [["c02-018", "天黑以后，月亮升起来，汉赛尔拉着妹妹的手，跟着月光下一闪一闪的白石子，一直走回了家。"]]}, {"t": "img", "src": "images/76.webp?v=3eba964279", "vid": "images/76.mp4?v=68c5f77c9f", "cap": "爸爸高兴极了", "n": 7}, {"t": "p", "s": [["c02-019", "继母打开门，看见是他们，就说：“你们这两个坏孩子，怎么在森林里睡了那么久？"], ["c02-020", "我们还以为你们不回来了呢！”"], ["c02-021", "可是爸爸高兴极了，因为丢下孩子，他心里一直很难受。"]]}]}, {"title": "汉赛尔与格莱特　森林里的糖果屋", "head": "c03-h", "audio": "audio/ch03.m4a?v=7529e4db4a", "duration": 164.067, "times": {"c03-h": [0.0, 4.475], "c03-001": [5.475, 8.038], "c03-002": [8.388, 14.277], "c03-003": [15.127, 22.366], "c03-004": [23.216, 29.235], "c03-005": [30.085, 37.002], "c03-006": [37.852, 42.71], "c03-007": [43.06, 49.289], "c03-008": [53.211, 57.63], "c03-009": [57.98, 64.639], "c03-010": [65.489, 71.091], "song-candy-house": [75.467, 81.467], "song-candy-house-01": [81.467, 84.927], "song-candy-house-02": [84.927, 89.007], "song-candy-house-03": [89.227, 94.607], "song-candy-house-04": [94.607, 97.727], "song-candy-house-05": [98.787, 102.967], "song-candy-house-06": [102.967, 107.207], "song-candy-house-07": [107.207, 111.507], "song-candy-house-08": [111.507, 114.767], "c03-011": [120.967, 124.308], "c03-012": [124.658, 126.373], "c03-013": [127.223, 132.015], "c03-014": [132.365, 134.388], "c03-015": [135.238, 139.324], "c03-016": [139.674, 145.355], "c03-017": [146.205, 153.66], "c03-018": [154.01, 157.563], "c03-019": [157.913, 162.567]}, "blocks": [{"t": "p", "s": [["c03-001", "没过多久，家里又没有吃的了。"], ["c03-002", "这一次，继母把门锁上了，汉赛尔没办法出去捡石子。"]]}, {"t": "img", "src": "images/05.webp?v=5edb982f43", "vid": "images/05.mp4?v=00e2f3c9ab", "cap": "撒面包屑", "n": 8}, {"t": "p", "s": [["c03-003", "第二天进森林的时候，汉赛尔只好把自己的那块面包掰成碎屑，一路撒在地上。"]]}, {"t": "p", "s": [["c03-004", "继母把他们带到了比上次更远的地方，又生了一堆火，就走了。"]]}, {"t": "p", "s": [["c03-005", "可是天黑以后，他们一点儿面包屑也找不到了，原来全被森林里的小鸟吃掉了。"]]}, {"t": "img", "src": "images/06.webp?v=75408d1fb3", "vid": "images/06.mp4?v=5dabb6e7e5", "cap": "雪白的小鸟带路", "n": 9}, {"t": "p", "s": [["c03-006", "兄妹俩在森林里走了整整三天，又累又饿。"], ["c03-007", "忽然，一只雪白的小鸟在树枝上唱歌，好像在给他们带路。"]]}, {"t": "img", "src": "images/07.webp?v=947abd2632", "vid": "images/07.mp4?v=568f9f206b", "cap": "糖果屋", "n": 10}, {"t": "p", "s": [["c03-008", "他们跟着小鸟走啊走，来到了一座小房子跟前。"], ["c03-009", "哇，这座房子是用面包做的，屋顶是蛋糕，窗户是透明的冰糖！"]]}, {"t": "img", "src": "images/08.webp?v=ebf0fb70c4", "vid": "images/08.mp4?v=980ba8c78e", "cap": "啃小房子", "n": 11}, {"t": "p", "s": [["c03-010", "汉赛尔掰下一块屋顶，格莱特啃起了窗户，吃得香极了。"]]}, {"t": "song", "title": "咔嚓咔嚓糖果屋", "head": "song-candy-house", "lines": [["song-candy-house-01", "面包做的墙"], ["song-candy-house-02", "蛋糕做的房"], ["song-candy-house-03", "冰糖窗户亮晶晶"], ["song-candy-house-04", "咬一口，甜又香"], ["song-candy-house-05", "咔嚓咔嚓，咬一口"], ["song-candy-house-06", "咔嚓咔嚓，再一口"], ["song-candy-house-07", "是谁在啃小房子"], ["song-candy-house-08", "是风娃娃在吹口哨"]]}, {"t": "p", "s": [["c03-011", "“咔嚓，咔嚓，是谁在啃我的小房子？”"], ["c03-012", "屋里传来一个声音。"]]}, {"t": "p", "s": [["c03-013", "两个孩子回答：“是风，是风，是天上的风娃娃。”"], ["c03-014", "说完，又接着吃起来。"]]}, {"t": "img", "src": "images/09.webp?v=c25183311b", "vid": "images/09.mp4?v=3c2dd5c666", "cap": "老婆婆开门", "n": 12}, {"t": "p", "s": [["c03-015", "门开了，一个拄着拐杖的老婆婆走了出来。"], ["c03-016", "她笑眯眯地说：“哎哟，可爱的孩子们，快进来吧，我给你们做好吃的！”"]]}, {"t": "img", "src": "images/77.webp?v=22a3b76e6e", "vid": "images/77.mp4?v=fde63ef3e2", "cap": "煎饼和雪白的小床", "n": 13}, {"t": "p", "s": [["c03-017", "她拉着两个孩子进了屋，端来了牛奶、撒着白糖的煎饼，还有苹果和核桃。"], ["c03-018", "吃完了，她又铺好两张雪白的小床。"], ["c03-019", "汉赛尔和格莱特躺下来，觉得好像到了天堂一样。"]]}]}, {"title": "汉赛尔与格莱特　聪明的格莱特", "head": "c04-h", "audio": "audio/ch04.m4a?v=5999239ba8", "duration": 100.448, "times": {"c04-h": [0.0, 3.396], "c04-001": [4.396, 9.196], "c04-002": [9.546, 14.411], "c04-003": [15.261, 25.502], "c04-004": [26.352, 33.003], "c04-005": [33.353, 38.852], "c04-006": [39.702, 44.931], "c04-007": [45.281, 49.744], "c04-008": [50.094, 53.764], "c04-009": [54.614, 61.655], "c04-010": [62.505, 67.986], "c04-011": [68.836, 72.898], "c04-012": [73.248, 75.798], "c04-013": [76.648, 83.677], "c04-014": [87.727, 91.099], "c04-015": [91.449, 98.948]}, "blocks": [{"t": "p", "s": [["c04-001", "其实，那个老婆婆是一个坏心眼的老巫婆。"], ["c04-002", "她的眼睛红红的，看不远，可是鼻子特别灵。"]]}, {"t": "img", "src": "images/10.webp?v=f04494d74e", "vid": "images/10.mp4?v=0dfa7ee1f1", "cap": "关进笼子", "n": 14}, {"t": "p", "s": [["c04-003", "第二天，老巫婆把汉赛尔关进了一个小笼子里，对格莱特说：“快去做饭，把你哥哥喂得胖胖的，等他长胖了，我就把他吃掉！”"]]}, {"t": "img", "src": "images/78.webp?v=354077456a", "vid": "images/78.mp4?v=a0835eef82", "cap": "格莱特一边做饭一边哭", "n": 15}, {"t": "p", "s": [["c04-004", "格莱特伤心地哭了，可是哭也没有用，她只好照着老巫婆的话去做。"], ["c04-005", "最好吃的饭菜都给了汉赛尔，格莱特自己只能吃一点儿剩下的。"]]}, {"t": "img", "src": "images/11.webp?v=7f95e97161", "vid": "images/11.mp4?v=52cd7b7654", "cap": "伸出小骨头", "n": 16}, {"t": "p", "s": [["c04-006", "每天早上，老巫婆都叫汉赛尔伸出手指，摸摸他胖了没有。"], ["c04-007", "聪明的汉赛尔每次都伸出一根细细的小骨头。"], ["c04-008", "老巫婆眼睛看不清，还以为他一直那么瘦。"]]}, {"t": "p", "s": [["c04-009", "过了四个星期，老巫婆等不及了：“格莱特，去看看炉子烧热了没有，你爬进去瞧瞧！”"]]}, {"t": "p", "s": [["c04-010", "格莱特知道老巫婆不怀好意，就说：“我不知道怎么进去呀。”"]]}, {"t": "p", "s": [["c04-011", "老巫婆自己把头伸进了炉子，说：“笨丫头！"], ["c04-012", "这么大的炉口，连我都钻得进去！”"]]}, {"t": "img", "src": "images/12.webp?v=a51243eb79", "vid": "images/12.mp4?v=7b02ed02f3", "cap": "关上炉门", "n": 17}, {"t": "p", "s": [["c04-013", "格莱特使劲一推，老巫婆一头栽进了炉子里，格莱特赶紧关上了铁门。"]]}, {"t": "img", "src": "images/13.webp?v=ca514ee2ef", "vid": "images/13.mp4?v=b8b14e3d21", "cap": "珍珠和宝石", "n": 18}, {"t": "p", "s": [["c04-014", "她跑去打开笼子，把哥哥放了出来。"], ["c04-015", "兄妹俩在巫婆的屋子里，找到了好多亮闪闪的珍珠和宝石，装满了口袋。"]]}]}, {"title": "汉赛尔与格莱特　白鸭子送他们回家", "head": "c05-h", "audio": "audio/ch05.m4a?v=85b6eb5591", "duration": 72.806, "times": {"c05-h": [0.0, 4.679], "c05-001": [5.679, 9.377], "c05-002": [9.727, 12.078], "c05-003": [12.928, 13.994], "c05-004": [14.344, 15.382], "c05-005": [16.232, 21.358], "c05-006": [21.708, 27.222], "c05-007": [27.572, 31.374], "c05-008": [32.224, 34.034], "c05-009": [37.539, 40.768], "c05-010": [41.118, 46.075], "c05-011": [46.925, 51.49], "c05-012": [52.34, 59.064], "c05-013": [59.914, 61.622], "c05-014": [61.972, 65.094], "c05-015": [65.444, 71.306]}, "blocks": [{"t": "p", "s": [["c05-001", "他们走了好几个钟头，来到一条大河边。"], ["c05-002", "河上没有桥，也没有船。"]]}, {"t": "p", "s": [["c05-003", "“我们过不去了。”"], ["c05-004", "汉赛尔说。"]]}, {"t": "img", "src": "images/79.webp?v=3a6bed986a", "vid": "images/79.mp4?v=5d47f1863c", "cap": "大河边的白鸭子", "n": 19}, {"t": "p", "s": [["c05-005", "格莱特看见河上游着一只白鸭子，就说：“我去求求它。”"], ["c05-006", "她对着河水喊：“小白鸭，小白鸭，汉赛尔和格莱特在这里。"], ["c05-007", "没有桥，也没有船，请你驮我们过河吧！”"]]}, {"t": "p", "s": [["c05-008", "白鸭子真的游了过来。"], ["c05-009", "汉赛尔坐上去，想让妹妹也坐在后面。"], ["c05-010", "格莱特说：“不行，我们两个太重了，让小鸭子一个一个驮吧。”"]]}, {"t": "img", "src": "images/80.webp?v=6bfda9e20f", "vid": "images/80.mp4?v=c73a4da1fd", "cap": "白鸭子驮他们过河", "n": 20}, {"t": "p", "s": [["c05-011", "好心的白鸭子驮着他们，一个一个地过了河。"]]}, {"t": "p", "s": [["c05-012", "他们又走了一会儿，森林越来越熟悉，终于，他们远远地看见了自己的家。"]]}, {"t": "img", "src": "images/14.webp?v=4c78c853d5", "vid": "images/14.mp4?v=d802d1b221", "cap": "回到爸爸身边", "n": 21}, {"t": "p", "s": [["c05-013", "他们找到了回家的路。"], ["c05-014", "爸爸一看见他们，高兴得哭了起来。"], ["c05-015", "那个狠心的继母已经离开了家，从此，一家三口再也不用挨饿了。"]]}]}, {"title": "白雪公主　雪一样白的小公主", "head": "c06-h", "audio": "audio/ch06.m4a?v=490cc2f881", "duration": 75.75, "times": {"c06-h": [0.0, 3.886], "c06-001": [4.886, 10.407], "c06-002": [10.757, 20.122], "c06-003": [20.972, 25.315], "c06-004": [25.665, 35.808], "c06-005": [36.658, 39.564], "c06-006": [39.914, 50.258], "c06-007": [51.108, 53.004], "c06-008": [53.354, 60.471], "c06-009": [61.321, 63.334], "c06-010": [63.684, 69.145], "c06-011": [69.995, 74.25]}, "blocks": [{"t": "img", "src": "images/81.webp?v=b2f7dc0bc1", "vid": "images/81.mp4?v=c44caaef2d", "cap": "乌木窗边的王后", "n": 22}, {"t": "p", "s": [["c06-001", "从前，在一个冬天，雪花像羽毛一样从天上飘下来。"], ["c06-002", "王后坐在乌木窗框的窗户边缝衣服，一不小心，针扎破了手指，三滴血落在了雪上。"]]}, {"t": "p", "s": [["c06-003", "红红的血落在白白的雪上，真好看。"], ["c06-004", "王后心想：“要是我有一个孩子，皮肤像雪一样白，嘴唇像血一样红，头发像这窗框的乌木一样黑，那该多好啊！”"]]}, {"t": "img", "src": "images/15.webp?v=19c866ab41", "vid": "images/15.mp4?v=acad6a48e0", "cap": "雪一样白的小婴儿", "n": 23}, {"t": "p", "s": [["c06-005", "不久，王后生下了一个女孩。"], ["c06-006", "她的皮肤像雪一样白，嘴唇像血一样红，头发像乌木一样黑，大家都叫她白雪公主。"]]}, {"t": "p", "s": [["c06-007", "可是王后很快就去世了。"], ["c06-008", "国王又娶了一位新王后，她长得很美，却非常骄傲，最受不了别人比她漂亮。"]]}, {"t": "img", "src": "images/16.webp?v=899c78886b", "vid": "images/16.mp4?v=a590206d0a", "cap": "魔镜啊魔镜", "n": 24}, {"t": "p", "s": [["c06-009", "新王后有一面魔镜。"], ["c06-010", "她每天都对着镜子问：“魔镜啊魔镜，谁是世界上最美丽的女人？”"]]}, {"t": "p", "s": [["c06-011", "魔镜总是回答：“王后，您是世界上最美丽的女人。”"]]}]}, {"title": "白雪公主　快跑吧，孩子", "head": "c07-h", "audio": "audio/ch07.m4a?v=46ce2d1062", "duration": 55.796, "times": {"c07-h": [0.0, 2.71], "c07-001": [3.71, 7.14], "c07-002": [7.49, 16.783], "c07-003": [17.633, 20.045], "c07-004": [20.395, 26.368], "c07-005": [27.218, 38.26], "c07-006": [39.11, 44.5], "c07-007": [45.35, 50.831], "c07-008": [51.181, 54.296]}, "blocks": [{"t": "img", "src": "images/82.webp?v=3412e44d3d", "vid": "images/82.mp4?v=fa53e689ff", "cap": "一天天长大", "n": 25}, {"t": "p", "s": [["c07-001", "白雪公主一天天长大，越长越美。"], ["c07-002", "有一天，王后又去问魔镜，魔镜说：“王后，您很美丽，可是白雪公主比您还要美丽一千倍。”"]]}, {"t": "img", "src": "images/17.webp?v=c57f9c5b68", "vid": "images/17.mp4?v=b3d2a05ee0", "cap": "王后气坏了", "n": 26}, {"t": "p", "s": [["c07-003", "王后气得脸都发青了。"], ["c07-004", "她叫来一个猎人，命令他把白雪公主带到森林里，再也不许她回来。"]]}, {"t": "img", "src": "images/18.webp?v=3bf3587aab", "vid": "images/18.mp4?v=1b5ab4946c", "cap": "快跑吧", "n": 27}, {"t": "p", "s": [["c07-005", "猎人把白雪公主带进森林，可是看着她那么善良可爱，心一软，就对她说：“快跑吧，可怜的孩子，千万别回王宫去了！”"]]}, {"t": "p", "s": [["c07-006", "白雪公主哭着说：“好心的猎人，谢谢你，我再也不回去了。”"]]}, {"t": "img", "src": "images/83.webp?v=4c69a8ce08", "vid": "images/83.mp4?v=1a189db2a7", "cap": "猎人骗了王后", "n": 28}, {"t": "p", "s": [["c07-007", "猎人回到王宫，骗王后说，白雪公主再也回不来了。"], ["c07-008", "王后信以为真，心里得意极了。"]]}]}, {"title": "白雪公主　七个小矮人", "head": "c08-h", "audio": "audio/ch08.m4a?v=ad0071d41b", "duration": 138.946, "times": {"c08-h": [0.0, 3.085], "c08-001": [4.085, 10.831], "c08-002": [11.681, 21.496], "c08-003": [22.346, 31.161], "c08-004": [32.011, 34.445], "c08-005": [34.795, 39.118], "c08-006": [39.968, 41.216], "c08-007": [42.066, 43.325], "c08-008": [44.175, 45.42], "c08-009": [46.27, 47.526], "c08-010": [48.376, 49.762], "c08-011": [50.612, 57.404], "c08-012": [58.254, 66.388], "c08-013": [67.238, 70.652], "c08-014": [71.002, 75.325], "c08-015": [75.675, 77.98], "c08-016": [78.83, 87.456], "song-dwarfs-work": [88.656, 94.656], "song-dwarfs-work-01": [94.656, 99.096], "song-dwarfs-work-02": [99.336, 103.096], "song-dwarfs-work-03": [103.096, 106.356], "song-dwarfs-work-04": [107.896, 111.496], "song-dwarfs-work-05": [115.556, 119.596], "song-dwarfs-work-06": [119.876, 123.736], "song-dwarfs-work-07": [123.736, 127.976], "song-dwarfs-work-08": [128.176, 132.096]}, "blocks": [{"t": "img", "src": "images/19.webp?v=ad60fb76de", "vid": "images/19.mp4?v=1e8338ffa5", "cap": "森林里的小房子", "n": 29}, {"t": "p", "s": [["c08-001", "白雪公主一个人在森林里跑啊跑，天快黑的时候，她看见了一座小房子。"]]}, {"t": "img", "src": "images/20.webp?v=e32ffe3cc7", "vid": "images/20.mp4?v=dbf49b1dc5", "cap": "七个小盘子", "n": 30}, {"t": "p", "s": [["c08-002", "屋子里的东西都小小的：一张小桌子上摆着七个小盘子、七把小勺子、七个小杯子，墙边还有七张小床。"]]}, {"t": "p", "s": [["c08-003", "白雪公主又饿又累，每个盘子里吃了一点儿，每个杯子里喝了一口，然后躺在第七张小床上睡着了。"]]}, {"t": "p", "s": [["c08-004", "天黑了，屋子的主人回来了。"], ["c08-005", "原来，这里住着七个在山里挖矿的小矮人。"]]}, {"t": "img", "src": "images/84.webp?v=c4c87aab83", "vid": "images/84.mp4?v=b781d99ba5", "cap": "谁坐过我的小椅子", "n": 31}, {"t": "p", "s": [["c08-006", "“是谁坐过我的小椅子？”"]]}, {"t": "p", "s": [["c08-007", "“是谁用过我的小勺子？”"]]}, {"t": "p", "s": [["c08-008", "“是谁吃过我的小盘子？”"]]}, {"t": "p", "s": [["c08-009", "“是谁咬过我的小面包？”"]]}, {"t": "p", "s": [["c08-010", "“是谁喝过我的小杯子？”"]]}, {"t": "img", "src": "images/21.webp?v=3890167715", "vid": "images/21.mp4?v=ca6cbfe01f", "cap": "小矮人回来了", "n": 32}, {"t": "p", "s": [["c08-011", "他们看见床上睡着一个美丽的姑娘，都轻手轻脚的，谁也舍不得叫醒她。"]]}, {"t": "p", "s": [["c08-012", "第七个小矮人没有床睡了，就在六个兄弟的床上，每张床睡一个钟头，一直睡到天亮。"]]}, {"t": "img", "src": "images/22.webp?v=14ac37d719", "vid": "images/22.mp4?v=3aabe91e6f", "cap": "住了下来", "n": 33}, {"t": "p", "s": [["c08-013", "第二天，白雪公主把自己的事讲给他们听。"], ["c08-014", "小矮人们说：“你就住在这里吧，帮我们做饭、收拾屋子。"], ["c08-015", "不过，千万别给陌生人开门！”"]]}, {"t": "img", "src": "images/85.webp?v=7176948e89", "vid": "images/85.mp4?v=829d27ff9f", "cap": "小矮人上山挖矿", "n": 34}, {"t": "p", "s": [["c08-016", "从此，小矮人们每天一早上山挖金子、挖铜矿，晚上回来，白雪公主已经做好了热乎乎的晚饭。"]]}, {"t": "song", "title": "小矮人上山去", "head": "song-dwarfs-work", "lines": [["song-dwarfs-work-01", "天亮啦，起床啦"], ["song-dwarfs-work-02", "七个小矮人上山啦"], ["song-dwarfs-work-03", "扛起小镐头"], ["song-dwarfs-work-04", "提着小灯笼"], ["song-dwarfs-work-05", "叮叮当，叮叮当"], ["song-dwarfs-work-06", "山里的金子闪闪亮"], ["song-dwarfs-work-07", "叮叮当，叮叮当"], ["song-dwarfs-work-08", "天黑回家喝热汤"]]}]}, {"title": "白雪公主　花腰带和小梳子", "head": "c09-h", "audio": "audio/ch09.m4a?v=09470940c6", "duration": 104.811, "times": {"c09-h": [0.0, 3.295], "c09-001": [4.295, 13.986], "c09-002": [14.836, 17.914], "c09-003": [18.264, 26.699], "c09-004": [27.549, 30.627], "c09-005": [31.477, 38.913], "c09-006": [39.263, 42.826], "c09-007": [43.676, 45.869], "c09-008": [46.219, 53.128], "c09-009": [53.978, 58.171], "c09-010": [58.521, 62.476], "c09-011": [63.326, 64.62], "c09-012": [64.97, 68.279], "c09-013": [69.129, 78.252], "c09-014": [79.102, 80.58], "c09-015": [80.93, 82.24], "c09-016": [83.09, 84.055], "c09-017": [84.405, 86.808], "c09-018": [87.158, 90.713], "c09-019": [91.063, 94.803], "c09-020": [95.653, 103.311]}, "blocks": [{"t": "p", "s": [["c09-001", "王后又去问魔镜，魔镜说：“在七座山的那一边，七个小矮人的家里，白雪公主还是比您美丽一千倍。”"]]}, {"t": "img", "src": "images/86.webp?v=890851e5eb", "vid": "images/86.mp4?v=36b26a3473", "cap": "翻过七座山", "n": 35}, {"t": "p", "s": [["c09-002", "王后知道猎人骗了她，气坏了。"], ["c09-003", "她换上一身破旧的衣服，扮成一个卖杂货的老太婆，翻过七座山，来到小矮人的家门口。"]]}, {"t": "p", "s": [["c09-004", "“卖东西啦，又好看又便宜的东西！”"]]}, {"t": "p", "s": [["c09-005", "白雪公主从窗户往外看，心想：“这个老太婆看起来挺和气的，让她进来应该没关系吧。”"], ["c09-006", "她打开门，买了一根五颜六色的花腰带。"]]}, {"t": "img", "src": "images/87.webp?v=a749ca245d", "vid": "images/87.mp4?v=1cbcca3183", "cap": "五颜六色的花腰带", "n": 36}, {"t": "p", "s": [["c09-007", "“来，孩子，我帮你系上。”"], ["c09-008", "老太婆一下子把腰带勒得紧紧的，白雪公主喘不过气来，倒在了地上。"]]}, {"t": "img", "src": "images/88.webp?v=abfa522e53", "vid": "images/88.mp4?v=fe2cead057", "cap": "剪断腰带", "n": 37}, {"t": "p", "s": [["c09-009", "晚上，小矮人们回到家，赶紧把腰带剪断。"], ["c09-010", "白雪公主慢慢地喘过气来，又活了过来。"]]}, {"t": "p", "s": [["c09-011", "“那个老太婆就是王后！”"], ["c09-012", "小矮人们说，“以后谁来，都别开门了！”"]]}, {"t": "p", "s": [["c09-013", "可是王后从魔镜那里知道白雪公主还活着，又做了一把有毒的小梳子，扮成另一个老太婆来了。"]]}, {"t": "p", "s": [["c09-014", "“我不能让人进来。”"], ["c09-015", "白雪公主说。"]]}, {"t": "img", "src": "images/89.webp?v=b5fd6627e3", "vid": "images/89.mp4?v=aad39bcab6", "cap": "亮闪闪的小梳子", "n": 38}, {"t": "p", "s": [["c09-016", "“看看总可以吧。”"], ["c09-017", "老太婆把梳子举起来。"], ["c09-018", "那把梳子太漂亮了，白雪公主忍不住开了门。"], ["c09-019", "梳子刚插到她的头发上，她就晕倒了。"]]}, {"t": "p", "s": [["c09-020", "幸好天快黑了，小矮人们回来，拔下了那把毒梳子，白雪公主又醒了过来。"]]}]}, {"title": "白雪公主　毒苹果", "head": "c10-h", "audio": "audio/ch10.m4a?v=fc7514d51b", "duration": 91.863, "times": {"c10-h": [0.0, 2.2], "c10-001": [3.2, 8.623], "c10-002": [8.973, 13.77], "c10-003": [14.62, 21.514], "c10-004": [21.864, 27.142], "c10-005": [27.992, 31.919], "c10-006": [32.769, 33.787], "c10-007": [34.137, 35.447], "c10-008": [36.297, 43.239], "c10-009": [43.589, 50.264], "c10-010": [52.459, 55.43], "c10-011": [55.78, 60.463], "c10-012": [60.813, 64.193], "c10-013": [65.043, 77.933], "c10-014": [78.783, 82.131], "c10-015": [82.481, 90.363]}, "blocks": [{"t": "p", "s": [["c10-001", "王后又问魔镜，魔镜还是说：“白雪公主比您美丽一千倍。”"], ["c10-002", "王后气得浑身发抖：“这一次，她非死不可！”"]]}, {"t": "img", "src": "images/90.webp?v=8ba099dd37", "vid": "images/90.mp4?v=8f3c0b335d", "cap": "做毒苹果", "n": 39}, {"t": "img", "src": "images/23.webp?v=651228aea9", "vid": "images/23.mp4?v=cea164afc0", "cap": "卖苹果的老婆婆", "n": 40}, {"t": "p", "s": [["c10-003", "她做了一个毒苹果，一半是白的，一半是红的，红的那一半有毒。"], ["c10-004", "然后，她扮成一个卖苹果的老婆婆，来到小矮人的家门口。"]]}, {"t": "p", "s": [["c10-005", "“好孩子，尝尝我的苹果吧，可甜啦！”"]]}, {"t": "p", "s": [["c10-006", "“我不能开门。”"], ["c10-007", "白雪公主说。"]]}, {"t": "img", "src": "images/24.webp?v=3ff0c24c51", "vid": "images/24.mp4?v=3d612d0a7d", "cap": "咬了一口", "n": 41}, {"t": "p", "s": [["c10-008", "王后把苹果切成两半，自己吃了白的那一半，把红的那一半递给她。"], ["c10-009", "白雪公主看着红红的苹果，忍不住接了过来，刚咬一口，就倒在了地上。"]]}, {"t": "p", "s": [["c10-010", "王后回到王宫，又去问魔镜。"], ["c10-011", "这一次，魔镜回答：“王后，您是世界上最美丽的女人。”"], ["c10-012", "她那颗嫉妒的心，这才安静下来。"]]}, {"t": "p", "s": [["c10-013", "天黑了，小矮人们看见白雪公主躺在地上，赶紧解开她的衣带，梳她的头发，用清水给她洗脸，可是这一次，她再也没有醒过来。"]]}, {"t": "img", "src": "images/25.webp?v=c886357f14", "vid": "images/25.mp4?v=4bd281041b", "cap": "水晶棺材", "n": 42}, {"t": "p", "s": [["c10-014", "小矮人们难过得哭了三天三夜。"], ["c10-015", "他们做了一口透明的水晶棺材，把白雪公主放在里面，放在山顶上，轮流守着她。"]]}]}, {"title": "白雪公主　水晶棺材", "head": "c11-h", "audio": "audio/ch11.m4a?v=3d44a823c0", "duration": 87.218, "times": {"c11-h": [0.0, 2.741], "c11-001": [3.741, 18.995], "c11-002": [19.845, 28.175], "c11-003": [29.025, 34.535], "c11-004": [35.385, 40.576], "c11-005": [41.426, 46.014], "c11-006": [46.864, 50.739], "c11-007": [51.089, 53.701], "c11-008": [54.051, 57.866], "c11-009": [58.716, 68.603], "c11-010": [69.453, 73.69], "c11-011": [74.54, 75.501], "c11-012": [75.851, 77.222], "c11-013": [77.572, 80.35], "c11-014": [80.7, 85.718]}, "blocks": [{"t": "p", "s": [["c11-001", "白雪公主在水晶棺材里躺了很久很久，可是她的样子一点儿也没有变，皮肤还是像雪一样白，嘴唇像血一样红，头发像乌木一样黑，好像只是睡着了。"]]}, {"t": "img", "src": "images/91.webp?v=283e1ff26b", "vid": "images/91.mp4?v=651f7eb550", "cap": "鸟儿来看她", "n": 43}, {"t": "p", "s": [["c11-002", "森林里的鸟儿也来为她哭泣：先是一只猫头鹰，然后是一只乌鸦，最后是一只小鸽子。"]]}, {"t": "img", "src": "images/26.webp?v=64559d6abb", "vid": "images/26.mp4?v=5593d3ee8d", "cap": "王子来了", "n": 44}, {"t": "p", "s": [["c11-003", "有一天，一位王子骑着马经过，一眼就喜欢上了白雪公主。"]]}, {"t": "p", "s": [["c11-004", "王子对小矮人们说：“把这口棺材让给我吧，你们要什么，我都给你们。”"]]}, {"t": "p", "s": [["c11-005", "小矮人们说：“就是把世界上所有的金子都给我们，我们也不卖。”"]]}, {"t": "p", "s": [["c11-006", "王子说：“那就把它送给我吧，我不能没有白雪公主。"], ["c11-007", "我会像爱惜自己最宝贵的东西一样爱惜她。”"], ["c11-008", "好心的小矮人们被他打动了，答应了。"]]}, {"t": "img", "src": "images/92.webp?v=be58da5dd7", "vid": "images/92.mp4?v=5a04ff422f", "cap": "绊了一下", "n": 45}, {"t": "p", "s": [["c11-009", "小矮人们抬起棺材，想让王子把她带走，一不小心绊了一下，那块毒苹果从白雪公主的喉咙里跳了出来。"]]}, {"t": "img", "src": "images/27.webp?v=88413f53e8", "vid": "images/27.mp4?v=c866fce054", "cap": "醒过来了", "n": 46}, {"t": "p", "s": [["c11-010", "白雪公主睁开眼睛，坐了起来：“我这是在哪儿呀？”"]]}, {"t": "img", "src": "images/28.webp?v=1c42dc7234", "vid": "images/28.mp4?v=778bac6ede", "cap": "盛大的婚礼", "n": 47}, {"t": "p", "s": [["c11-011", "“你和我在一起。”"], ["c11-012", "王子高兴地说。"], ["c11-013", "后来，他们举行了盛大的婚礼。"], ["c11-014", "那个坏王后又羞又气，从此再也没有人见过她。"]]}]}, {"title": "青蛙王子　掉进井里的金球", "head": "c12-h", "audio": "audio/ch12.m4a?v=7b0e693d02", "duration": 105.914, "times": {"c12-h": [0.0, 3.407], "c12-001": [4.407, 13.454], "c12-002": [14.304, 17.988], "c12-003": [18.338, 26.241], "c12-004": [27.091, 33.079], "c12-005": [36.52, 38.659], "c12-006": [39.509, 41.809], "c12-007": [42.159, 43.144], "c12-008": [43.994, 50.396], "c12-009": [51.246, 53.345], "c12-010": [53.695, 54.523], "c12-011": [55.373, 60.125], "c12-012": [60.975, 67.248], "c12-013": [68.098, 78.423], "c12-014": [79.273, 81.973], "c12-015": [82.323, 87.351], "c12-016": [88.201, 91.436], "c12-017": [91.786, 95.775], "c12-018": [96.625, 98.259], "c12-019": [98.609, 103.046]}, "blocks": [{"t": "p", "s": [["c12-001", "从前，有一位国王，他最小的女儿美丽极了，连见多识广的太阳照在她脸上，都会觉得惊奇。"]]}, {"t": "img", "src": "images/29.webp?v=614c5f2349", "vid": "images/29.mp4?v=a7ec37039d", "cap": "井边的金球", "n": 48}, {"t": "p", "s": [["c12-002", "小公主最喜欢的玩具，是一个金球。"], ["c12-003", "天热的时候，她就到森林里的老水井边，把金球抛起来、接住，玩个不停。"]]}, {"t": "img", "src": "images/30.webp?v=5f11c62521", "vid": "images/30.mp4?v=8762904d1b", "cap": "金球掉进井里", "n": 49}, {"t": "p", "s": [["c12-004", "有一天，她没有接住，金球“扑通”一声掉进了深深的井里。"], ["c12-005", "小公主伤心地哭了起来。"]]}, {"t": "p", "s": [["c12-006", "“公主，你为什么哭得这么伤心？”"], ["c12-007", "一个声音问。"]]}, {"t": "img", "src": "images/31.webp?v=ce9c4639fb", "vid": "images/31.mp4?v=47ae5a121a", "cap": "井里的青蛙", "n": 50}, {"t": "p", "s": [["c12-008", "她回头一看，原来是一只青蛙，从水里伸出又大又丑的脑袋。"]]}, {"t": "p", "s": [["c12-009", "“我的金球掉进井里了。”"], ["c12-010", "公主说。"]]}, {"t": "p", "s": [["c12-011", "“别哭了，”青蛙说，“要是我把金球捞上来，你拿什么谢我呢？”"]]}, {"t": "p", "s": [["c12-012", "“你要什么都行，我的衣服、我的珍珠宝石，还有我头上的金冠，都可以给你。”"]]}, {"t": "p", "s": [["c12-013", "青蛙说：“我能帮你捞上来，可是你要答应我：让我做你的朋友，和你在一张小桌子上吃饭，用你的小金盘子，晚上睡在你的小床边。”"]]}, {"t": "p", "s": [["c12-014", "“好，好，我都答应你！”"], ["c12-015", "公主心里想，一只青蛙，怎么能做人的朋友呢？"]]}, {"t": "img", "src": "images/32.webp?v=8d0eee4d83", "vid": "images/32.mp4?v=a49596b02e", "cap": "叼来金球", "n": 51}, {"t": "p", "s": [["c12-016", "青蛙钻进水里，把金球叼了上来。"], ["c12-017", "公主一把抢过金球，头也不回地跑回了王宫。"]]}, {"t": "img", "src": "images/93.webp?v=8822902369", "vid": "images/93.mp4?v=aa7b10b2cc", "cap": "等等我", "n": 52}, {"t": "p", "s": [["c12-018", "“等等我，带上我呀！”"], ["c12-019", "青蛙在后面呱呱地叫，可是公主早就跑远了。"]]}]}, {"title": "青蛙王子　说话要算数", "head": "c13-h", "audio": "audio/ch13.m4a?v=80ccdcf763", "duration": 144.104, "times": {"c13-h": [0.0, 2.299], "c13-001": [3.299, 14.886], "c13-002": [17.98, 23.786], "c13-003": [24.636, 29.623], "c13-004": [30.473, 36.671], "c13-005": [37.021, 40.567], "c13-006": [40.917, 42.925], "song-frog-door": [44.125, 50.125], "song-frog-door-01": [50.125, 52.405], "song-frog-door-02": [52.785, 55.025], "song-frog-door-03": [55.025, 57.485], "song-frog-door-04": [57.485, 59.765], "song-frog-door-05": [61.405, 64.005], "song-frog-door-06": [64.145, 66.705], "song-frog-door-07": [66.705, 70.645], "song-frog-door-08": [70.645, 72.485], "c13-007": [78.685, 82.347], "c13-008": [82.697, 83.389], "c13-009": [84.239, 86.427], "c13-010": [86.777, 90.74], "c13-011": [91.09, 94.762], "c13-012": [95.612, 102.122], "c13-013": [102.972, 111.496], "c13-014": [112.346, 116.309], "c13-015": [116.659, 118.782], "c13-016": [119.132, 127.476], "c13-017": [128.326, 136.684], "c13-018": [137.534, 139.714], "c13-019": [140.064, 142.604]}, "blocks": [{"t": "img", "src": "images/33.webp?v=cd3fce9667", "vid": "images/33.mp4?v=9368bb2030", "cap": "青蛙敲门", "n": 53}, {"t": "p", "s": [["c13-001", "第二天，公主正和国王一起吃饭，就听见“啪嗒、啪嗒”，有什么东西爬上了大理石台阶，接着有人敲门：“公主，公主，快给我开门！”"]]}, {"t": "p", "s": [["c13-002", "公主打开门一看，是那只青蛙，吓得赶紧把门关上了。"]]}, {"t": "p", "s": [["c13-003", "国王问她怎么了，公主只好把井边的事说了出来。"]]}, {"t": "img", "src": "images/94.webp?v=0431ba3a93", "vid": "images/94.mp4?v=2cf943b587", "cap": "青蛙在门外唱歌", "n": 54}, {"t": "p", "s": [["c13-004", "门外的青蛙又敲起门来，一边敲一边唱：“最小的公主，快开门！"], ["c13-005", "清清的井水边，你说过的话，难道忘了吗？"], ["c13-006", "最小的公主，快开门！”"]]}, {"t": "song", "title": "最小的公主快开门", "head": "song-frog-door", "lines": [["song-frog-door-01", "最小的公主，快开门"], ["song-frog-door-02", "清清的井水边"], ["song-frog-door-03", "你说过的话"], ["song-frog-door-04", "难道忘了吗"], ["song-frog-door-05", "呱呱呱，呱呱呱"], ["song-frog-door-06", "说话要算数呀"], ["song-frog-door-07", "最小的公主，快开门"], ["song-frog-door-08", "我是你的好朋友"]]}, {"t": "p", "s": [["c13-007", "国王说：“答应过别人的事，就一定要做到。"], ["c13-008", "快去开门。”"]]}, {"t": "p", "s": [["c13-009", "公主只好让青蛙进来。"], ["c13-010", "青蛙跳到她的脚边，说：“把我抱到椅子上吧。”"], ["c13-011", "公主犹犹豫豫的，国王叫她照着做。"]]}, {"t": "p", "s": [["c13-012", "青蛙上了椅子，又要上桌子：“把你的小金盘子推过来一点儿，我们一起吃吧。”"]]}, {"t": "img", "src": "images/34.webp?v=79d9329117", "vid": "images/34.mp4?v=ab2e61c213", "cap": "青蛙上桌", "n": 55}, {"t": "p", "s": [["c13-013", "青蛙跳上桌子，用她的小金盘子吃饭，吃得津津有味，可是公主一口也吃不下去。"]]}, {"t": "img", "src": "images/95.webp?v=424ea19ec7", "vid": "images/95.mp4?v=773f46baec", "cap": "小枕头上的青蛙", "n": 56}, {"t": "img", "src": "images/35.webp?v=996774a36e", "vid": "images/35.mp4?v=1ad7ecb760", "cap": "变成了王子", "n": 57}, {"t": "p", "s": [["c13-014", "晚上，公主把青蛙放在床边的小枕头上。"], ["c13-015", "第一天这样，第二天也这样。"], ["c13-016", "到了第三天早上，公主醒来一看，枕头上的青蛙不见了，床边站着一位英俊的王子。"]]}, {"t": "p", "s": [["c13-017", "原来，王子被一个坏巫婆施了魔法，变成了青蛙，只有公主让他做朋友，魔法才会解除。"]]}, {"t": "p", "s": [["c13-018", "王子说：“是你救了我。"], ["c13-019", "等明天，我们一起回我的王国去吧。”"]]}]}, {"title": "青蛙王子　三道铁箍", "head": "c14-h", "audio": "audio/ch14.m4a?v=2ec33dcd2f", "duration": 73.505, "times": {"c14-h": [0.0, 2.648], "c14-001": [3.648, 8.492], "c14-002": [8.842, 12.439], "c14-003": [12.789, 19.916], "c14-004": [20.766, 26.745], "c14-005": [27.595, 33.098], "c14-006": [34.202, 40.131], "c14-007": [40.981, 46.067], "c14-008": [46.917, 50.948], "c14-009": [51.298, 55.539], "c14-010": [55.889, 59.128], "c14-011": [59.978, 71.251]}, "blocks": [{"t": "img", "src": "images/96.webp?v=fde73cc87f", "vid": "images/96.mp4?v=0702fa1975", "cap": "八匹白马的马车", "n": 58}, {"t": "p", "s": [["c14-001", "第二天，一辆八匹白马拉的马车来接王子回国。"], ["c14-002", "赶车的是王子忠心的仆人亨利。"], ["c14-003", "王子变成青蛙以后，他难过得心都要碎了，只好在胸口箍上三道铁箍。"]]}, {"t": "p", "s": [["c14-004", "亨利扶王子和公主上了车，自己站在车后面，高兴得不得了。"]]}, {"t": "img", "src": "images/36.webp?v=38cfaa8ef3", "vid": "images/36.mp4?v=771649fc5b", "cap": "铁箍崩断了", "n": 59}, {"t": "p", "s": [["c14-005", "马车走在路上，只听见“咔嚓、咔嚓、咔嚓”三声响。"], ["c14-006", "那是亨利胸口上的三道铁箍，因为太高兴，一道一道地崩断了。"]]}, {"t": "img", "src": "images/97.webp?v=82b3d83b9d", "vid": "images/97.mp4?v=a0c0a4ee76", "cap": "是车子坏了吗", "n": 60}, {"t": "p", "s": [["c14-007", "第一声响的时候，王子回过头喊：“亨利，是车子坏了吗？”"]]}, {"t": "p", "s": [["c14-008", "“不是车子坏了，主人，是我胸口的铁箍断了。"], ["c14-009", "您变成青蛙的时候，我难过得心都要碎了，只好箍上它。"], ["c14-010", "现在您回来了，我的心高兴得撑开了铁箍！”"]]}, {"t": "p", "s": [["c14-011", "后来又响了两声，王子每一次都以为是车子坏了，可是每一次，都是忠心的亨利心里太高兴，又崩断了一道铁箍。"]]}]}, {"title": "小红帽　森林里的大灰狼", "head": "c15-h", "audio": "audio/ch15.m4a?v=7188379391", "duration": 104.641, "times": {"c15-h": [0.0, 3.002], "c15-001": [4.002, 8.458], "c15-002": [8.808, 14.992], "c15-003": [15.842, 22.422], "c15-004": [22.772, 26.619], "c15-005": [27.469, 28.504], "c15-006": [28.854, 29.843], "c15-007": [30.693, 32.408], "c15-008": [32.758, 36.877], "c15-009": [37.227, 40.757], "c15-010": [41.607, 46.485], "c15-011": [47.335, 50.957], "c15-012": [51.807, 57.526], "c15-013": [57.876, 61.621], "c15-014": [62.471, 71.375], "c15-015": [72.225, 75.058], "c15-016": [75.408, 82.027], "c15-017": [82.877, 87.159], "c15-018": [87.509, 90.976], "c15-019": [91.826, 99.228], "c15-020": [100.078, 103.141]}, "blocks": [{"t": "img", "src": "images/37.webp?v=998bfec88c", "vid": "images/37.mp4?v=e0b4e3890c", "cap": "小红帽", "n": 61}, {"t": "p", "s": [["c15-001", "从前，有一个可爱的小姑娘，谁见了都喜欢。"], ["c15-002", "外婆送给她一顶红色的小帽子，她天天戴着，大家就叫她小红帽。"]]}, {"t": "img", "src": "images/38.webp?v=d1f992254c", "vid": "images/38.mp4?v=d5f0306add", "cap": "妈妈的叮嘱", "n": 62}, {"t": "p", "s": [["c15-003", "有一天，妈妈说：“小红帽，外婆生病了，你把这块蛋糕和这瓶果汁给外婆送去。"], ["c15-004", "路上要好好走，别离开大路，也别和陌生人说话。”"]]}, {"t": "p", "s": [["c15-005", "“我一定记住。”"], ["c15-006", "小红帽说。"]]}, {"t": "img", "src": "images/39.webp?v=c0c7c794c9", "vid": "images/39.mp4?v=b23c82f107", "cap": "遇见大灰狼", "n": 63}, {"t": "p", "s": [["c15-007", "外婆住在森林里。"], ["c15-008", "小红帽刚走进森林，就遇见了一只大灰狼。"], ["c15-009", "她不知道狼有多坏，一点儿也不害怕。"]]}, {"t": "p", "s": [["c15-010", "大灰狼说：“你好，小红帽，这么早要到哪里去呀？”"]]}, {"t": "p", "s": [["c15-011", "“去外婆家，外婆住在三棵大橡树下面。”"]]}, {"t": "p", "s": [["c15-012", "大灰狼心里想：“这个小姑娘嫩嫩的，一定比老太婆好吃。"], ["c15-013", "我得想个办法，把她们两个都吃掉。”"]]}, {"t": "p", "s": [["c15-014", "大灰狼眼珠一转，说：“你看，周围的花儿多漂亮，你怎么不摘一些带给外婆呢？”"]]}, {"t": "p", "s": [["c15-015", "“你听，小鸟唱得多好听。"], ["c15-016", "你走路老是低着头，好像去上学一样，森林里可好玩啦！”"]]}, {"t": "img", "src": "images/40.webp?v=0e62dd60c8", "vid": "images/40.mp4?v=e65dd26abf", "cap": "林子里摘花", "n": 64}, {"t": "p", "s": [["c15-017", "小红帽一看，可不是吗，到处都开满了花。"], ["c15-018", "她离开大路，跑进林子里摘花去了。"]]}, {"t": "p", "s": [["c15-019", "她摘了一朵，又看见前面有一朵更好看的，就这样越走越远，走进了森林的深处。"]]}, {"t": "img", "src": "images/98.webp?v=7466568d21", "vid": "images/98.mp4?v=ff64c925cb", "cap": "大灰狼抢先一步", "n": 65}, {"t": "p", "s": [["c15-020", "大灰狼却一溜烟跑到了外婆家。"]]}]}, {"title": "小红帽　外婆的大嘴巴", "head": "c16-h", "audio": "audio/ch16.m4a?v=e2bd0d75ad", "duration": 127.64, "times": {"c16-h": [0.0, 2.742], "c16-001": [3.742, 11.686], "c16-002": [12.536, 15.059], "c16-003": [15.409, 16.547], "c16-004": [17.397, 21.206], "c16-005": [21.556, 28.919], "c16-006": [29.769, 34.016], "c16-007": [34.366, 36.857], "c16-008": [37.707, 40.404], "c16-009": [41.254, 43.714], "c16-010": [44.564, 47.219], "c16-011": [48.069, 50.251], "c16-012": [51.101, 53.634], "c16-013": [54.484, 56.653], "c16-014": [57.503, 60.486], "c16-015": [61.336, 63.345], "c16-016": [64.195, 68.031], "c16-017": [68.381, 72.703], "c16-018": [76.934, 81.479], "c16-019": [81.829, 83.98], "c16-020": [84.33, 88.141], "c16-021": [88.491, 91.372], "c16-022": [92.222, 95.451], "c16-023": [95.801, 96.791], "c16-024": [97.641, 101.819], "c16-025": [102.169, 110.73], "c16-026": [111.58, 114.99], "c16-027": [115.34, 119.693], "c16-028": [120.543, 124.8], "c16-029": [125.15, 126.14]}, "blocks": [{"t": "p", "s": [["c16-001", "大灰狼敲敲门，学着小红帽的声音说：“外婆，我是小红帽，给您送蛋糕来了。”"]]}, {"t": "p", "s": [["c16-002", "“门没锁，自己进来吧。”"], ["c16-003", "外婆说。"]]}, {"t": "img", "src": "images/41.webp?v=5f38063efe", "vid": "images/41.mp4?v=34c5dd4adf", "cap": "假扮外婆", "n": 66}, {"t": "p", "s": [["c16-004", "大灰狼冲进屋子，一口把外婆吞了下去。"], ["c16-005", "然后，它穿上外婆的衣服，戴上外婆的睡帽，躺在床上，拉上了床帘。"]]}, {"t": "p", "s": [["c16-006", "小红帽摘了一大把花，才想起外婆来。"], ["c16-007", "她走进屋子，觉得怪怪的。"]]}, {"t": "p", "s": [["c16-008", "“外婆，您的耳朵怎么这么大呀？”"]]}, {"t": "p", "s": [["c16-009", "“为了更好地听你说话呀。”"]]}, {"t": "p", "s": [["c16-010", "“外婆，您的眼睛怎么这么大呀？”"]]}, {"t": "p", "s": [["c16-011", "“为了更好地看着你呀。”"]]}, {"t": "p", "s": [["c16-012", "“外婆，您的手怎么这么大呀？”"]]}, {"t": "p", "s": [["c16-013", "“为了更好地抱住你呀。”"]]}, {"t": "img", "src": "images/42.webp?v=a89c1429cc", "vid": "images/42.mp4?v=2131b46fa3", "cap": "您的嘴巴怎么这么大", "n": 67}, {"t": "p", "s": [["c16-014", "“外婆，您的嘴巴怎么这么大呀？”"]]}, {"t": "p", "s": [["c16-015", "“为了一口把你吃掉！”"]]}, {"t": "p", "s": [["c16-016", "大灰狼从床上跳起来，把小红帽也吞了下去。"], ["c16-017", "吃饱以后，它躺在床上，呼噜呼噜地睡着了。"]]}, {"t": "img", "src": "images/43.webp?v=5ad3b9e6b7", "vid": "images/43.mp4?v=c0dbfa69c9", "cap": "猎人来了", "n": 68}, {"t": "img", "src": "images/44.webp?v=b520d52cad", "vid": "images/44.mp4?v=0b7ba897c3", "cap": "救出来了", "n": 69}, {"t": "p", "s": [["c16-018", "一个猎人正好路过，心想：“老婆婆怎么打这么响的呼噜？”"], ["c16-019", "他进屋一看，是大灰狼！"], ["c16-020", "他赶紧拿出剪刀，剪开了大灰狼的肚子。"], ["c16-021", "小红帽和外婆一下子跳了出来。"]]}, {"t": "p", "s": [["c16-022", "“哎呀，吓死我了，狼肚子里黑乎乎的！”"], ["c16-023", "小红帽说。"]]}, {"t": "p", "s": [["c16-024", "小红帽搬来几块大石头，塞进了狼的肚子里。"], ["c16-025", "大灰狼醒来想逃，可是肚子里的石头太重了，它一下子摔倒在地上，再也爬不起来了。"]]}, {"t": "p", "s": [["c16-026", "猎人、外婆和小红帽都高兴极了。"], ["c16-027", "外婆吃了蛋糕，喝了果汁，身体一下子好了许多。"]]}, {"t": "img", "src": "images/45.webp?v=5d97dcf641", "vid": "images/45.mp4?v=48c4be7280", "cap": "一起吃蛋糕", "n": 70}, {"t": "p", "s": [["c16-028", "“以后，我再也不离开大路，一个人跑进森林里了。”"], ["c16-029", "小红帽说。"]]}]}, {"title": "小红帽　又一只大灰狼", "head": "c17-h", "audio": "audio/ch17.m4a?v=10c2ec1930", "duration": 115.802, "times": {"c17-h": [0.0, 2.943], "c17-001": [3.943, 9.786], "c17-002": [10.136, 12.766], "c17-003": [13.616, 20.189], "c17-004": [21.039, 23.481], "c17-005": [23.831, 27.316], "c17-006": [27.666, 30.59], "c17-007": [31.44, 36.594], "c17-008": [37.444, 45.193], "c17-009": [48.287, 50.983], "c17-010": [51.333, 60.27], "c17-011": [61.12, 63.78], "c17-012": [64.13, 69.775], "c17-013": [70.125, 75.907], "c17-014": [76.757, 81.524], "c17-015": [81.874, 86.178], "c17-016": [87.028, 98.337], "c17-017": [102.194, 109.374], "c17-018": [109.724, 114.302]}, "blocks": [{"t": "img", "src": "images/99.webp?v=ad1fee779f", "vid": "images/99.mp4?v=e614933a3f", "cap": "又一只大灰狼", "n": 71}, {"t": "p", "s": [["c17-001", "又有一次，小红帽给外婆送点心，路上又遇见了一只大灰狼。"], ["c17-002", "它也想骗小红帽离开大路。"]]}, {"t": "p", "s": [["c17-003", "可是小红帽记住了上一次的教训，头也不回，一直沿着大路走到了外婆家。"]]}, {"t": "p", "s": [["c17-004", "“外婆，我在路上遇见了一只狼。"], ["c17-005", "它跟我说‘你好’，可是眼睛凶巴巴的。"], ["c17-006", "要不是在大路上，它一定会吃掉我！”"]]}, {"t": "p", "s": [["c17-007", "外婆说：“快来，我们把门关紧，别让它进来。”"]]}, {"t": "p", "s": [["c17-008", "不一会儿，大灰狼就来敲门了：“外婆，开开门，我是小红帽，给您送点心来了。”"]]}, {"t": "img", "src": "images/100.webp?v=bfb5777497", "vid": "images/100.mp4?v=2e2c159b48", "cap": "屋顶上的大灰狼", "n": 72}, {"t": "p", "s": [["c17-009", "她们一声也不出，也不开门。"], ["c17-010", "大灰狼在房子外面转了两三圈，最后跳上了屋顶，想等小红帽晚上回家的时候，在黑暗里扑过去。"]]}, {"t": "p", "s": [["c17-011", "外婆早就看出了它的心思。"], ["c17-012", "房子前面有一个大石槽，外婆说：“小红帽，拿桶来。"], ["c17-013", "昨天我煮了香肠，把煮香肠的水倒进石槽里去。”"]]}, {"t": "img", "src": "images/101.webp?v=4e9c600a81", "vid": "images/101.mp4?v=1225723ad2", "cap": "提水倒进石槽", "n": 73}, {"t": "p", "s": [["c17-014", "小红帽一桶一桶地提，把大石槽装得满满的。"], ["c17-015", "香肠的香味飘了起来，一直飘到了屋顶上。"]]}, {"t": "img", "src": "images/102.webp?v=0fe54a06da", "vid": "images/102.mp4?v=e4ea3be2ea", "cap": "扑通掉进了石槽", "n": 74}, {"t": "p", "s": [["c17-016", "大灰狼使劲闻啊闻，伸长了脖子往下看，看着看着，脚底一滑，从屋顶上滚了下来，“扑通”一声掉进了大石槽里。"]]}, {"t": "p", "s": [["c17-017", "它在水里扑腾了半天，才湿淋淋地爬出来，夹着尾巴逃走了，再也不敢来了。"], ["c17-018", "小红帽高高兴兴地回了家，谁也没有再欺负她。"]]}]}, {"title": "十二个猎人　十二个一模一样的猎人", "head": "c18-h", "audio": "audio/ch18.m4a?v=aab8c47656", "duration": 80.593, "times": {"c18-h": [0.0, 3.936], "c18-001": [4.936, 11.98], "c18-002": [12.83, 20.436], "c18-003": [20.786, 25.35], "c18-004": [26.2, 32.638], "c18-005": [33.488, 38.085], "c18-006": [38.435, 40.374], "c18-007": [41.224, 47.762], "c18-008": [48.612, 52.041], "c18-009": [52.391, 58.485], "c18-010": [59.335, 64.182], "c18-011": [65.032, 68.59], "c18-012": [69.439, 72.799], "c18-013": [73.149, 79.093]}, "blocks": [{"t": "img", "src": "images/46.webp?v=5aa82409fb", "vid": "images/46.mp4?v=579ee034c8", "cap": "金戒指", "n": 75}, {"t": "p", "s": [["c18-001", "从前，有一位王子，他和一位美丽的姑娘订了婚，送给她一枚金戒指。"]]}, {"t": "p", "s": [["c18-002", "有一天，王子的父亲病得很重，对他说：“孩子，我想让你娶邻国的公主。”"], ["c18-003", "王子很伤心，可是为了让父亲安心，他还是答应了。"]]}, {"t": "p", "s": [["c18-004", "王子临走的时候，对姑娘说：“我要离开一阵子，这枚戒指留给你，做个纪念吧。”"]]}, {"t": "p", "s": [["c18-005", "那位姑娘听说王子要娶别人，难过得吃不下饭。"], ["c18-006", "后来，她想出了一个办法。"]]}, {"t": "img", "src": "images/103.webp?v=23c24b690b", "vid": "images/103.mp4?v=22af3658d1", "cap": "十一个一模一样的姑娘", "n": 76}, {"t": "p", "s": [["c18-007", "她对自己的父亲说：“爸爸，我想要十一个姑娘，长相、个子、身材都和我一模一样。”"]]}, {"t": "p", "s": [["c18-008", "她的父亲是一位国王，最疼爱她。"], ["c18-009", "他派人找遍了整个王国，终于找到了十一个和女儿长得一模一样的姑娘。"]]}, {"t": "img", "src": "images/47.webp?v=f5556b32cd", "vid": "images/47.mp4?v=3021759304", "cap": "十二个猎人", "n": 77}, {"t": "p", "s": [["c18-010", "十二个姑娘都穿上猎人的衣服，骑着马来到王宫。"]]}, {"t": "p", "s": [["c18-011", "她说：“我们是十二个猎人，想为国王效劳。”"]]}, {"t": "img", "src": "images/48.webp?v=c08ee13638", "vid": "images/48.mp4?v=b0282b9323", "cap": "国王收留猎人", "n": 78}, {"t": "p", "s": [["c18-012", "这时候，王子已经当上了国王。"], ["c18-013", "他没有认出她来，看见这十二个猎人长得那么英俊，就把他们都留了下来。"]]}]}, {"title": "十二个猎人　狮子的考验", "head": "c19-h", "audio": "audio/ch19.m4a?v=455eabf997", "duration": 88.118, "times": {"c19-h": [0.0, 3.624], "c19-001": [4.624, 8.745], "c19-002": [9.095, 14.508], "c19-003": [14.858, 17.838], "c19-004": [18.688, 19.173], "c19-005": [19.523, 20.387], "c19-006": [21.237, 26.707], "c19-007": [27.057, 36.371], "c19-008": [37.221, 42.514], "c19-009": [42.864, 52.121], "c19-010": [52.971, 57.132], "c19-011": [57.482, 62.504], "c19-012": [63.354, 66.35], "c19-013": [66.7, 70.671], "c19-014": [71.521, 75.435], "c19-015": [76.285, 81.893], "c19-016": [82.743, 86.618]}, "blocks": [{"t": "img", "src": "images/49.webp?v=6674c8e4ea", "vid": "images/49.mp4?v=de91dd9a51", "cap": "狮子的秘密", "n": 79}, {"t": "p", "s": [["c19-001", "国王有一头神奇的狮子，什么秘密都知道。"], ["c19-002", "一天晚上，狮子对国王说：“您以为那是十二个猎人吗？"], ["c19-003", "她们其实是十二个姑娘。”"]]}, {"t": "p", "s": [["c19-004", "“我不信。”"], ["c19-005", "国王说。"]]}, {"t": "p", "s": [["c19-006", "狮子说：“那就试一试吧，在屋里的地上撒满豌豆。"], ["c19-007", "男人走路脚步很重，踩在豌豆上也不会滑；姑娘走路轻轻的，会踩得豌豆骨碌碌乱滚。”"]]}, {"t": "img", "src": "images/50.webp?v=3a4ba3fbd9", "vid": "images/50.mp4?v=a9a100def3", "cap": "踩豌豆", "n": 80}, {"t": "p", "s": [["c19-008", "国王有一个好心的仆人，偷偷把这件事告诉了猎人们。"], ["c19-009", "于是，十二个姑娘走进屋子的时候，都重重地踩在豌豆上，稳稳当当，一颗豌豆也没有滚动。"]]}, {"t": "p", "s": [["c19-010", "狮子又说：“在前厅里放十二架纺车。"], ["c19-011", "姑娘们看见纺车，一定会高高兴兴地围上去看。”"]]}, {"t": "img", "src": "images/104.webp?v=db8ffde3ae", "vid": "images/104.mp4?v=fa11382aaa", "cap": "连看都没看一眼", "n": 81}, {"t": "p", "s": [["c19-012", "好心的仆人又悄悄告诉了她们。"], ["c19-013", "十二个姑娘走过纺车，连看都没看一眼。"]]}, {"t": "p", "s": [["c19-014", "国王对狮子说：“你骗了我，她们明明是男人。”"]]}, {"t": "p", "s": [["c19-015", "狮子说：“她们知道您在考验她们，才故意那样做的。”"]]}, {"t": "p", "s": [["c19-016", "从那以后，国王再也不相信狮子的话了。"]]}]}, {"title": "十二个猎人　手套里的金戒指", "head": "c20-h", "audio": "audio/ch20.m4a?v=14d2a46d16", "duration": 66.414, "times": {"c20-h": [0.0, 3.42], "c20-001": [4.42, 12.242], "c20-002": [13.092, 16.453], "c20-003": [20.547, 24.299], "c20-004": [25.149, 29.724], "c20-005": [30.074, 38.353], "c20-006": [39.203, 43.732], "c20-007": [44.082, 49.521], "c20-008": [50.371, 54.214], "c20-009": [54.564, 57.747], "c20-010": [58.097, 64.914]}, "blocks": [{"t": "img", "src": "images/105.webp?v=7ddaf2d2d0", "vid": "images/105.mp4?v=f25c273a6c", "cap": "一起去打猎", "n": 82}, {"t": "p", "s": [["c20-001", "十二个猎人跟着国王去打猎，个个骑马射箭，样样都好，国王越来越喜欢他们。"]]}, {"t": "p", "s": [["c20-002", "有一天，国王带着十二个猎人去打猎。"], ["c20-003", "忽然有人来报信：新娘的马车快到了！"]]}, {"t": "img", "src": "images/51.webp?v=dbfafd0531", "vid": "images/51.mp4?v=c7ac70c9d8", "cap": "晕倒的猎人", "n": 83}, {"t": "img", "src": "images/106.webp?v=1b92c124bc", "vid": "images/106.mp4?v=46a78e4ae1", "cap": "手套里的金戒指", "n": 84}, {"t": "p", "s": [["c20-004", "第一个猎人听见了，心里一痛，一下子晕倒在地上。"], ["c20-005", "国王跑过去，想帮他脱下手套，却看见他手上戴着的，正是自己送出去的那枚金戒指。"]]}, {"t": "p", "s": [["c20-006", "国王仔细一看，原来是他真正喜欢的那位姑娘！"], ["c20-007", "他高兴极了，说：“你是我的，我也是你的，谁也不能把我们分开。”"]]}, {"t": "img", "src": "images/52.webp?v=91d8b0b6ae", "vid": "images/52.mp4?v=3e0d3b36f4", "cap": "真正的婚礼", "n": 85}, {"t": "p", "s": [["c20-008", "邻国的公主知道了这件事，就带着嫁妆回国去了。"], ["c20-009", "国王和他心爱的姑娘举行了婚礼。"], ["c20-010", "那头狮子呢，又成了国王最信任的狮子，因为它说的，本来就是真话。"]]}]}, {"title": "不莱梅的音乐家　去不莱梅当音乐家", "head": "c21-h", "audio": "audio/ch21.m4a?v=66e6342b53", "duration": 165.179, "times": {"c21-h": [0.0, 3.685], "c21-001": [4.685, 9.932], "c21-002": [10.282, 15.05], "c21-003": [15.9, 18.591], "c21-004": [18.941, 23.311], "c21-005": [24.161, 28.955], "c21-006": [29.805, 31.413], "c21-007": [32.263, 36.211], "c21-008": [36.561, 37.289], "c21-009": [38.139, 41.53], "c21-010": [41.88, 43.37], "c21-011": [44.22, 45.879], "c21-012": [46.229, 50.494], "c21-013": [50.844, 56.182], "c21-014": [57.032, 64.285], "c21-015": [64.635, 67.825], "c21-016": [68.175, 69.065], "c21-017": [69.915, 72.81], "c21-018": [73.66, 80.939], "c21-019": [84.461, 87.587], "c21-020": [88.437, 93.049], "c21-021": [93.399, 96.779], "c21-022": [97.129, 97.995], "c21-023": [98.845, 101.613], "c21-024": [101.963, 105.783], "c21-025": [106.633, 113.189], "song-bremen-song": [114.389, 120.389], "song-bremen-song-01": [120.389, 122.449], "song-bremen-song-02": [122.449, 124.569], "song-bremen-song-03": [124.569, 126.649], "song-bremen-song-04": [126.649, 128.849], "song-bremen-song-05": [128.969, 130.969], "song-bremen-song-06": [130.969, 133.049], "song-bremen-song-07": [133.049, 135.149], "song-bremen-song-08": [135.229, 158.329]}, "blocks": [{"t": "p", "s": [["c21-001", "从前，有一头老驴子，给主人驮了很多年的麦子。"], ["c21-002", "现在它老了，驮不动了，主人就不想再喂它。"]]}, {"t": "img", "src": "images/53.webp?v=09ee8035be", "vid": "images/53.mp4?v=29fbd8f19c", "cap": "老驴子出发", "n": 86}, {"t": "p", "s": [["c21-003", "老驴子心想：“我可不能在这里等着。"], ["c21-004", "我的嗓门这么大，不如去不莱梅城当个音乐家吧！”"]]}, {"t": "img", "src": "images/54.webp?v=2b93fc08af", "vid": "images/54.mp4?v=60ca2de809", "cap": "遇见老猎狗", "n": 87}, {"t": "p", "s": [["c21-005", "走着走着，它看见一只老猎狗趴在路边，喘着粗气。"]]}, {"t": "p", "s": [["c21-006", "“你怎么啦，老猎狗？”"]]}, {"t": "p", "s": [["c21-007", "“唉，我老了，跑不动了，主人不要我了。”"], ["c21-008", "猎狗说。"]]}, {"t": "p", "s": [["c21-009", "驴子说：“跟我一起去不莱梅当音乐家吧！"], ["c21-010", "我弹琴，你打鼓。”"]]}, {"t": "img", "src": "images/55.webp?v=576812a2fa", "vid": "images/55.mp4?v=0faac13278", "cap": "愁眉苦脸的老猫", "n": 88}, {"t": "p", "s": [["c21-011", "猎狗高兴地答应了。"], ["c21-012", "没走多远，它们又遇见了一只愁眉苦脸的老猫。"], ["c21-013", "老猫的牙齿钝了，抓不到老鼠，女主人也不要它了。"]]}, {"t": "p", "s": [["c21-014", "“唉，我老了，只想趴在火炉边打打呼噜，可是女主人嫌我没用，要把我丢进河里。"], ["c21-015", "我好不容易才逃出来，现在可怎么办哪？”"], ["c21-016", "老猫说。"]]}, {"t": "p", "s": [["c21-017", "“跟我们一起去吧，你最会唱夜曲了！”"]]}, {"t": "img", "src": "images/56.webp?v=a22cda9d56", "vid": "images/56.mp4?v=6b71f2627d", "cap": "门上的大公鸡", "n": 89}, {"t": "p", "s": [["c21-018", "接着，它们又走过一个农家院子，一只大公鸡站在门上，扯着嗓子大叫。"], ["c21-019", "原来，主人明天要把它炖成汤了。"]]}, {"t": "p", "s": [["c21-020", "“明天家里要来客人，女主人说要把我炖成汤。"], ["c21-021", "趁着脑袋还在，我得使劲叫个够！”"], ["c21-022", "公鸡说。"]]}, {"t": "p", "s": [["c21-023", "驴子说：“红脑袋，跟我们走吧！"], ["c21-024", "你的嗓子这么好，和我们一起唱，一定好听极了！”"]]}, {"t": "img", "src": "images/57.webp?v=c53b737bc7", "vid": "images/57.mp4?v=81c5f8dc95", "cap": "四个音乐家上路", "n": 90}, {"t": "p", "s": [["c21-025", "于是，驴子、猎狗、老猫和公鸡，一起向不莱梅出发了。"]]}, {"t": "song", "title": "我们去不莱梅", "head": "song-bremen-song", "lines": [["song-bremen-song-01", "老驴子，老猎狗"], ["song-bremen-song-02", "老猫公鸡跟着走"], ["song-bremen-song-03", "年纪大了没关系"], ["song-bremen-song-04", "一起唱歌手拉手"], ["song-bremen-song-05", "去不莱梅，去不莱梅"], ["song-bremen-song-06", "我们要当音乐家"], ["song-bremen-song-07", "你弹琴来我打鼓"], ["song-bremen-song-08", "唱得大家笑哈哈"]]}]}, {"title": "不莱梅的音乐家　强盗的房子", "head": "c22-h", "audio": "audio/ch22.m4a?v=a62329f25a", "duration": 104.995, "times": {"c22-h": [0.0, 3.141], "c22-001": [4.141, 6.823], "c22-002": [7.173, 11.84], "c22-003": [12.69, 21.642], "c22-004": [22.492, 29.363], "c22-005": [30.213, 34.357], "c22-006": [34.707, 39.445], "c22-007": [40.295, 44.551], "c22-008": [44.901, 48.283], "c22-009": [49.133, 50.367], "c22-010": [50.717, 51.575], "c22-011": [52.425, 60.331], "c22-012": [61.181, 62.944], "c22-013": [63.294, 72.065], "c22-014": [72.915, 83.857], "c22-015": [88.258, 94.807], "c22-016": [98.021, 103.495]}, "blocks": [{"t": "p", "s": [["c22-001", "不莱梅太远了，一天走不到。"], ["c22-002", "天黑的时候，它们来到一片森林，准备在树下过夜。"]]}, {"t": "img", "src": "images/107.webp?v=9936dcec07", "vid": "images/107.mp4?v=dac7e10f71", "cap": "树下过夜", "n": 91}, {"t": "p", "s": [["c22-003", "驴子和猎狗躺在一棵大树底下，老猫爬上了树枝，公鸡一直飞到了树顶上，那里最安全。"]]}, {"t": "img", "src": "images/58.webp?v=0618a9789a", "vid": "images/58.mp4?v=1a9a179fa9", "cap": "树顶上的公鸡", "n": 92}, {"t": "p", "s": [["c22-004", "公鸡飞到树顶上，四下一望，看见远处有一点亮光：“那边有一座房子！”"]]}, {"t": "p", "s": [["c22-005", "驴子说：“那我们去看看吧，这里睡得可不舒服。”"], ["c22-006", "猎狗也说：“要是有几根骨头，再带点儿肉，那就更好了！”"]]}, {"t": "p", "s": [["c22-007", "它们朝亮光走去，来到了一座亮着灯的房子。"], ["c22-008", "驴子个子最高，凑到窗前往里看。"]]}, {"t": "p", "s": [["c22-009", "“你看见什么了？”"], ["c22-010", "公鸡问。"]]}, {"t": "img", "src": "images/59.webp?v=ca5935e28c", "vid": "images/59.mp4?v=75ecdb36df", "cap": "偷看强盗", "n": 93}, {"t": "p", "s": [["c22-011", "驴子说：“我看见一张桌子，上面摆满了好吃的，还有几个强盗，正坐在那里大吃大喝呢。”"]]}, {"t": "img", "src": "images/60.webp?v=b4139af2c4", "vid": "images/60.mp4?v=5c4cb8a273", "cap": "叠成一座塔", "n": 94}, {"t": "p", "s": [["c22-012", "它们商量好了一个办法。"], ["c22-013", "驴子把前脚搭在窗台上，猎狗跳到驴子背上，老猫爬到猎狗背上，公鸡飞到老猫的头上。"]]}, {"t": "p", "s": [["c22-014", "然后，它们一起唱起来：驴子嗯昂嗯昂地叫，猎狗汪汪地叫，老猫喵喵地叫，公鸡喔喔地叫。"], ["c22-015", "接着，它们一起冲破窗户，跳进了屋子，玻璃稀里哗啦地碎了一地。"]]}, {"t": "img", "src": "images/61.webp?v=2e78934346", "vid": "images/61.mp4?v=9b5fdddf1b", "cap": "强盗逃跑", "n": 95}, {"t": "p", "s": [["c22-016", "强盗们以为来了妖怪，吓得魂都飞了，一溜烟逃进了森林。"]]}]}, {"title": "不莱梅的音乐家　黑夜里的妖怪", "head": "c23-h", "audio": "audio/ch23.m4a?v=0782e81be4", "duration": 122.566, "times": {"c23-h": [0.0, 3.269], "c23-001": [4.269, 8.642], "c23-002": [8.992, 24.171], "c23-003": [25.021, 29.791], "c23-004": [30.141, 34.78], "c23-005": [35.63, 40.88], "c23-006": [41.73, 43.24], "c23-007": [43.59, 49.975], "c23-008": [50.325, 52.466], "c23-009": [53.316, 57.043], "c23-010": [57.393, 62.2], "c23-011": [62.55, 67.969], "c23-012": [68.319, 72.928], "c23-013": [76.95, 81.9], "c23-014": [82.25, 94.494], "c23-015": [95.344, 99.03], "c23-016": [99.38, 105.391], "c23-017": [106.241, 117.323], "c23-018": [117.673, 121.066]}, "blocks": [{"t": "img", "src": "images/62.webp?v=fafda39680", "vid": "images/62.mp4?v=72d02b74f1", "cap": "各自睡觉", "n": 96}, {"t": "p", "s": [["c23-001", "四个好朋友坐下来，把桌子上的东西吃了个精光。"], ["c23-002", "然后，它们熄了灯，各自找地方睡觉：驴子躺在院子里的草堆上，猎狗趴在门后，老猫蜷在暖暖的炉灰旁边，公鸡飞到了屋梁上。"]]}, {"t": "img", "src": "images/108.webp?v=af4ae87550", "vid": "images/108.mp4?v=e7b3e89701", "cap": "灯灭了", "n": 97}, {"t": "p", "s": [["c23-003", "强盗们远远看见房子里的灯灭了，一点动静也没有。"], ["c23-004", "强盗头子说：“我们刚才也太胆小了，不该让人吓跑。”"]]}, {"t": "p", "s": [["c23-005", "半夜里，强盗头子派了一个强盗，回来看看屋子里怎么样了。"]]}, {"t": "img", "src": "images/63.webp?v=607ff1d323", "vid": "images/63.mp4?v=e7236cdcc8", "cap": "黑暗里的亮眼睛", "n": 98}, {"t": "p", "s": [["c23-006", "屋子里黑乎乎的。"], ["c23-007", "强盗看见炉灰里有两点亮光，以为是火炭，就拿火柴凑过去点火。"], ["c23-008", "那其实是老猫的眼睛！"]]}, {"t": "img", "src": "images/64.webp?v=54d1a5654d", "vid": "images/64.mp4?v=6862d05587", "cap": "打跑强盗", "n": 99}, {"t": "p", "s": [["c23-009", "老猫跳起来，朝他脸上狠狠地抓了一把。"], ["c23-010", "强盗吓得往后门跑，猎狗扑上来，咬了他的腿。"], ["c23-011", "他跑过院子，驴子又抬起后腿，狠狠地踢了他一脚。"], ["c23-012", "屋梁上的公鸡也醒了，大叫一声：“喔喔喔！”"]]}, {"t": "img", "src": "images/109.webp?v=7d6afa8790", "vid": "images/109.mp4?v=f118ab5f84", "cap": "屋里有妖怪", "n": 100}, {"t": "p", "s": [["c23-013", "强盗没命地跑回森林，对强盗头子说：“不得了啦！"], ["c23-014", "屋里有一个可怕的巫婆，用长指甲抓我的脸；门后有个人拿刀子扎我的腿；院子里有个黑怪物，用大木棒打我；屋顶上还有个法官在大喊：把这个坏蛋抓过来！”"]]}, {"t": "img", "src": "images/65.webp?v=f0a69cc74c", "vid": "images/65.mp4?v=f498fd5c59", "cap": "快乐的新家", "n": 101}, {"t": "p", "s": [["c23-015", "从那以后，强盗们再也不敢回那座房子了。"], ["c23-016", "四个音乐家觉得这里太舒服了，就住了下来，再也不想去不莱梅了。"]]}, {"t": "p", "s": [["c23-017", "每天晚上，它们就在这座小房子里一起唱歌：驴子嗯昂，猎狗汪汪，老猫喵喵，公鸡喔喔。"], ["c23-018", "它们自己觉得，这是世界上最好听的音乐。"]]}]}, {"title": "幸运的汉斯　一块大金子", "head": "c24-h", "audio": "audio/ch24.m4a?v=1e524c6616", "duration": 71.151, "times": {"c24-h": [0.0, 3.257], "c24-001": [4.257, 6.886], "c24-002": [7.236, 9.771], "c24-003": [10.121, 15.117], "c24-004": [15.967, 21.855], "c24-005": [22.705, 27.564], "c24-006": [27.914, 30.654], "c24-007": [31.504, 33.787], "c24-008": [34.137, 36.189], "c24-009": [37.039, 41.651], "c24-010": [42.501, 44.249], "c24-011": [44.599, 51.859], "c24-012": [52.709, 55.371], "c24-013": [55.721, 61.168], "c24-014": [62.018, 65.931]}, "blocks": [{"t": "img", "src": "images/66.webp?v=499002cb60", "vid": "images/66.mp4?v=6e739899cc", "cap": "七年的工钱", "n": 102}, {"t": "p", "s": [["c24-001", "汉斯给主人干了七年活。"], ["c24-002", "七年过去了，他想回家看妈妈。"], ["c24-003", "主人给了他一块和他的脑袋一样大的金子，作为工钱。"]]}, {"t": "p", "s": [["c24-004", "汉斯用手帕把金子包好，扛在肩上，高高兴兴地上路了。"]]}, {"t": "p", "s": [["c24-005", "汉斯扛着金子往家走，金子太重了，压得他满头大汗。"], ["c24-006", "这时，一个骑马的人跑了过来。"]]}, {"t": "p", "s": [["c24-007", "汉斯说：“骑马多舒服啊！"], ["c24-008", "不会累，也不会磨破鞋子。”"]]}, {"t": "img", "src": "images/67.webp?v=4bed9a776d", "vid": "images/67.mp4?v=048992cf62", "cap": "用金子换马", "n": 103}, {"t": "p", "s": [["c24-009", "骑马的人说：“那我们换一换吧，我的马给你，你的金子给我。”"]]}, {"t": "p", "s": [["c24-010", "汉斯高兴地答应了。"], ["c24-011", "骑马的人扶他上了马，告诉他：“要想跑快一点儿，就咂咂嘴，喊一声‘驾、驾’！”"]]}, {"t": "p", "s": [["c24-012", "汉斯骑在马上，开心极了。"], ["c24-013", "他想跑得再快一点儿，就咂咂嘴，大喊一声：“驾、驾！”"]]}, {"t": "img", "src": "images/110.webp?v=36e01aac30", "vid": "images/110.mp4?v=e9c41cae75", "cap": "摔到了沟里", "n": 104}, {"t": "p", "s": [["c24-014", "可是马跑得太快，一下子就把他摔到了沟里。"]]}]}, {"title": "幸运的汉斯　奶牛、小猪和大白鹅", "head": "c25-h", "audio": "audio/ch25.m4a?v=a706de1601", "duration": 136.049, "times": {"c25-h": [0.0, 4.946], "c25-001": [5.946, 10.081], "c25-002": [10.931, 13.619], "c25-003": [13.969, 16.218], "c25-004": [16.568, 20.726], "c25-005": [21.076, 23.796], "c25-006": [24.646, 35.219], "c25-007": [36.069, 45.03], "c25-008": [49.088, 55.396], "c25-009": [56.246, 61.417], "c25-010": [62.267, 66.274], "c25-011": [66.624, 73.709], "c25-012": [74.559, 78.429], "c25-013": [79.279, 89.163], "c25-014": [89.513, 90.739], "song-hans-lucky": [91.939, 97.939], "song-hans-lucky-01": [97.939, 101.039], "song-hans-lucky-02": [102.059, 105.299], "song-hans-lucky-03": [105.299, 109.079], "song-hans-lucky-04": [109.319, 114.079], "song-hans-lucky-05": [115.579, 119.039], "song-hans-lucky-06": [119.199, 122.079], "song-hans-lucky-07": [123.179, 126.119], "song-hans-lucky-08": [126.119, 129.199]}, "blocks": [{"t": "p", "s": [["c25-001", "马还想往前冲，幸好路上有人拦住了它。"]]}, {"t": "img", "src": "images/111.webp?v=cff2f81d15", "vid": "images/111.mp4?v=0d1eef3d27", "cap": "用马换奶牛", "n": 105}, {"t": "p", "s": [["c25-002", "一个牵着奶牛的农夫走过来。"], ["c25-003", "汉斯说：“我再也不骑马了。"], ["c25-004", "还是奶牛好，走得慢慢的，每天还能喝到新鲜的牛奶。”"], ["c25-005", "于是，他又用马换了奶牛。"]]}, {"t": "p", "s": [["c25-006", "汉斯赶着奶牛慢慢地走，心里美滋滋的：“只要有一块面包，我就能就着牛奶吃，还能做黄油和奶酪，再也不怕饿肚子了！”"]]}, {"t": "img", "src": "images/68.webp?v=2f1ed420d0", "vid": "images/68.mp4?v=e077877e31", "cap": "挤不出牛奶", "n": 106}, {"t": "p", "s": [["c25-007", "到了中午，汉斯又渴又累，想挤点牛奶喝，可是他怎么挤也挤不出来，还被奶牛踢了一脚。"]]}, {"t": "img", "src": "images/69.webp?v=bb4bc8f26e", "vid": "images/69.mp4?v=4a33850dc7", "cap": "换来小肥猪", "n": 107}, {"t": "p", "s": [["c25-008", "一个赶着小猪的屠夫走过来，汉斯就用奶牛换了一头小肥猪。"]]}, {"t": "p", "s": [["c25-009", "汉斯赶着小猪，心想：“小猪肉多好吃呀，还能做香肠呢！”"]]}, {"t": "p", "s": [["c25-010", "后来，他遇见了一个抱着大白鹅的年轻人。"], ["c25-011", "年轻人说：“这头猪是从村长家偷来的，村长正派人到处找呢，你要倒霉啦！”"]]}, {"t": "img", "src": "images/70.webp?v=fb60af1737", "vid": "images/70.mp4?v=8c3d9710d3", "cap": "大白鹅", "n": 108}, {"t": "p", "s": [["c25-012", "汉斯吓了一跳，赶紧用小猪换了大白鹅。"]]}, {"t": "p", "s": [["c25-013", "汉斯抱着大白鹅，一边走一边想：“这只鹅肥肥的，可以做烤鹅；鹅油够吃好几个月；白白的羽毛还能做一个软软的枕头。"], ["c25-014", "妈妈一定会高兴的！”"]]}, {"t": "song", "title": "换呀换", "head": "song-hans-lucky", "lines": [["song-hans-lucky-01", "一块金子换匹马"], ["song-hans-lucky-02", "一匹马换头牛"], ["song-hans-lucky-03", "奶牛换了小肥猪"], ["song-hans-lucky-04", "小猪换只大白鹅"], ["song-hans-lucky-05", "换呀换，换呀换"], ["song-hans-lucky-06", "汉斯心里乐呵呵"], ["song-hans-lucky-07", "走在回家的路上"], ["song-hans-lucky-08", "我是最幸运的人"]]}]}, {"title": "幸运的汉斯　最幸运的人", "head": "c26-h", "audio": "audio/ch26.m4a?v=4fb351077d", "duration": 157.91, "times": {"c26-h": [0.0, 3.197], "c26-001": [4.197, 7.685], "c26-002": [8.035, 12.488], "c26-003": [17.017, 19.16], "c26-004": [20.01, 25.921], "c26-005": [26.271, 29.77], "c26-006": [30.62, 35.12], "c26-007": [35.97, 43.688], "c26-008": [44.538, 47.796], "c26-009": [48.146, 55.697], "c26-010": [59.438, 64.287], "c26-011": [64.637, 67.122], "c26-012": [67.472, 69.402], "c26-013": [70.252, 76.565], "c26-014": [77.415, 78.56], "song-grimm-tales": [79.76, 85.76], "song-grimm-tales-01": [85.76, 90.5], "song-grimm-tales-02": [90.5, 96.74], "song-grimm-tales-03": [96.74, 101.6], "song-grimm-tales-04": [101.6, 106.92], "song-grimm-tales-05": [107.24, 111.78], "song-grimm-tales-06": [111.78, 117.14], "song-grimm-tales-07": [117.14, 122.36], "song-grimm-tales-08": [122.96, 127.5], "song-grimm-tales-09": [130.8, 136.06], "song-grimm-tales-10": [136.06, 140.8], "song-grimm-tales-11": [140.8, 146.46], "song-grimm-tales-12": [146.46, 151.06]}, "blocks": [{"t": "img", "src": "images/112.webp?v=573824e5ba", "vid": "images/112.mp4?v=d3953569fc", "cap": "唱歌的磨剪刀人", "n": 109}, {"t": "p", "s": [["c26-001", "走到一个村子，他又遇见一个磨剪刀的人。"], ["c26-002", "他一边转着磨刀轮，一边唱着歌，快活极了。"]]}, {"t": "p", "s": [["c26-003", "汉斯说：“你真快活呀！”"]]}, {"t": "p", "s": [["c26-004", "磨剪刀的人说：“磨剪刀这一行，口袋里永远不会没钱。"], ["c26-005", "我把这块磨刀石给你，你把鹅给我吧！”"]]}, {"t": "img", "src": "images/71.webp?v=df8ea458f8", "vid": "images/71.mp4?v=d52c1aa13c", "cap": "沉甸甸的磨刀石", "n": 110}, {"t": "p", "s": [["c26-006", "汉斯又换了，扛着沉甸甸的磨刀石往前走。"]]}, {"t": "p", "s": [["c26-007", "磨刀石越来越重，汉斯从早上走到中午，又累又渴，走一步就要歇一歇。"]]}, {"t": "img", "src": "images/72.webp?v=f0d81dcbc8", "vid": "images/72.mp4?v=9f681a5eeb", "cap": "掉进了井里", "n": 111}, {"t": "p", "s": [["c26-008", "走到一口井边，汉斯想喝口水。"], ["c26-009", "他把磨刀石放在井沿上，一弯腰，不小心碰了一下，磨刀石“扑通”一声掉进了井里。"]]}, {"t": "img", "src": "images/113.webp?v=3ed5899204", "vid": "images/113.mp4?v=5ed33523b8", "cap": "最幸运的人", "n": 112}, {"t": "p", "s": [["c26-010", "汉斯一点儿也不难过，反而高兴得跳了起来：“太好了！"], ["c26-011", "那块石头太重了，我正不想扛呢。"], ["c26-012", "我真是世界上最幸运的人！”"]]}, {"t": "img", "src": "images/73.webp?v=1166242862", "vid": "images/73.mp4?v=a53d31e988", "cap": "回到妈妈身边", "n": 113}, {"t": "p", "s": [["c26-013", "他两手空空，心里轻松，一路蹦蹦跳跳，回到了妈妈的身边。"]]}, {"t": "p", "s": [["c26-014", "（完）"]]}, {"t": "song", "title": "格林童话陪着我", "head": "song-grimm-tales", "lines": [["song-grimm-tales-01", "白石子，亮晶晶"], ["song-grimm-tales-02", "糖果屋里格莱特真聪明"], ["song-grimm-tales-03", "魔镜啊魔镜，毒苹果"], ["song-grimm-tales-04", "水晶棺里的公主醒过来"], ["song-grimm-tales-05", "井边的青蛙呱呱唱"], ["song-grimm-tales-06", "小红帽记住走大路"], ["song-grimm-tales-07", "十二个猎人踩豌豆"], ["song-grimm-tales-08", "四个音乐家唱得响"], ["song-grimm-tales-09", "翻开书，故事真多"], ["song-grimm-tales-10", "善良的人会有好结果"], ["song-grimm-tales-11", "聪明勇敢，诚实快乐"], ["song-grimm-tales-12", "格林童话陪着我"]]}, {"t": "note", "text": "读完以后，可以和孩子聊一聊：这七个故事里，你最喜欢哪一个？汉斯用一块金子换来换去，最后什么也没有了，他为什么还说自己最幸运呢？小红帽第二次遇见大灰狼的时候，她是怎么做的？"}]}], "music": 4, "images": [{"from": "c01-h", "src": "images/01.webp?v=fd8c8f76b7", "vid": "images/01.mp4?v=5703810706", "cap": "森林边的小木屋", "n
