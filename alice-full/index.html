<script>
const BOOK = {"id": "alice-full", "title": "爱丽丝漫游奇境", "intro": "根据刘易斯·卡罗尔《爱丽丝漫游奇境》完整改写：原著里的情节一个不少，公爵夫人的厨房、睡鼠讲的糖浆井、假海龟的学校、龙虾方块舞和法庭上的那封信都讲到了。适合 6 岁以上的小朋友和爸爸妈妈一起读、一起听，可以分几个晚上听完。", "kicker": "卡罗尔童话", "cover": "images/26.webp?v=66188890d3", "voice": "Cherry（阳光亲切的姐姐），本地 Qwen3-TTS 复刻音色", "chapters": [{"title": "第一章　掉进兔子洞", "head": "c01-h", "audio": "audio/ch01.m4a?v=f1a72e1971", "duration": 84.496, "times": {"c01-h": [0.0, 4.286], "c01-001": [5.286, 10.45], "c01-002": [10.8, 14.965], "c01-003": [15.815, 20.095], "c01-004": [20.445, 21.539], "c01-005": [21.889, 25.31], "c01-006": [25.66, 29.982], "c01-007": [30.332, 33.067], "c01-008": [33.917, 38.44], "c01-009": [38.79, 50.11], "c01-010": [50.46, 58.547], "c01-011": [61.737, 63.867], "c01-012": [64.217, 67.895], "c01-013": [68.245, 75.123], "c01-014": [75.973, 79.227], "c01-015": [79.577, 82.996]}, "blocks": [{"t": "img", "src": "images/01.webp?v=6a4b4cd33b", "vid": "images/01.mp4?v=28cf4c8c02", "cap": "河边大树下的夏日午后", "n": 1}, {"t": "p", "s": [["c01-001", "一个暖洋洋的夏日午后，爱丽丝和姐姐坐在河边的大树下。"], ["c01-002", "姐姐在看一本书，书里没有图画，也没有对话。"]]}, {"t": "p", "s": [["c01-003", "“一本书里没有图画，也没有对话，有什么意思呢？”"], ["c01-004", "爱丽丝想。"], ["c01-005", "她越坐越困，眼皮都快要合上了。"], ["c01-006", "她想，要不要起来去摘些雏菊，编一个花环呢？"], ["c01-007", "可是天气这么热，她又懒得动。"]]}, {"t": "img", "src": "images/02.webp?v=a1be6d62c0", "vid": "images/02.mp4?v=2bbdd3d72f", "cap": "拿着怀表的白兔子", "n": 2}, {"t": "p", "s": [["c01-008", "忽然，一只粉红眼睛的白兔子从她身边跑了过去。"], ["c01-009", "这本来没什么奇怪的，就连听见白兔子自言自语地说“哎呀，哎呀，我要迟到了”，爱丽丝也没觉得太奇怪。"], ["c01-010", "可是，白兔子竟然从背心口袋里掏出一块怀表，看了看，又急急忙忙地往前跑。"]]}, {"t": "img", "src": "images/03.webp?v=a7210c9aec", "vid": "images/03.mp4?v=4acd14c715", "cap": "白兔子钻进了兔子洞", "n": 3}, {"t": "p", "s": [["c01-011", "爱丽丝一下子跳了起来。"], ["c01-012", "她从来没见过穿背心、还带着怀表的兔子！"], ["c01-013", "她好奇极了，跟着白兔子跑过草地，看见它钻进了篱笆下面的一个大兔子洞。"]]}, {"t": "p", "s": [["c01-014", "爱丽丝想也没想，也跟着钻了进去。"], ["c01-015", "至于以后怎么出来，她连想都没有想过。"]]}]}, {"title": "第二章　很深很深的井", "head": "c02-h", "audio": "audio/ch02.m4a?v=93f2cd712d", "duration": 174.896, "times": {"c02-h": [0.0, 2.902], "c02-001": [3.902, 7.843], "c02-002": [8.193, 13.261], "c02-003": [16.94, 19.956], "c02-004": [20.306, 24.934], "c02-005": [25.784, 32.283], "c02-006": [32.633, 37.04], "c02-007": [37.39, 44.087], "c02-008": [44.937, 52.044], "c02-009": [52.394, 55.551], "c02-010": [56.401, 59.148], "c02-011": [59.498, 65.565], "c02-012": [65.915, 68.692], "c02-013": [69.042, 74.418], "c02-014": [74.768, 77.14], "c02-015": [77.99, 81.434], "c02-016": [81.784, 83.376], "c02-017": [83.726, 87.046], "song-falling": [88.246, 88.246], "song-falling-01": [88.246, 101.506], "song-falling-02": [102.216, 105.756], "song-falling-03": [105.846, 110.086], "song-falling-04": [110.086, 114.286], "song-falling-05": [114.286, 118.566], "song-falling-06": [119.346, 122.826], "song-falling-07": [122.826, 126.836], "song-falling-08": [126.946, 131.306], "song-falling-09": [132.606, 135.786], "song-falling-10": [135.786, 140.126], "song-falling-11": [140.126, 144.286], "song-falling-12": [144.286, 148.186], "song-falling-13": [150.886, 155.146], "song-falling-14": [155.766, 159.306], "song-falling-15": [159.306, 163.586], "song-falling-16": [164.346, 168.046]}, "blocks": [{"t": "p", "s": [["c02-001", "兔子洞先是像一条隧道，接着突然往下一沉。"], ["c02-002", "爱丽丝还没来得及停住，就掉进了一口很深很深的井里。"]]}, {"t": "img", "src": "images/04.webp?v=c0c4d68191", "vid": "images/04.mp4?v=548fb73d5a", "cap": "掉进一口很深很深的井", "n": 4}, {"t": "p", "s": [["c02-003", "她慢慢地往下落，落了很久很久。"], ["c02-004", "井壁上摆满了柜子和书架，还挂着地图和图画。"]]}, {"t": "img", "src": "images/58.webp?v=954dad614e", "vid": "images/58.mp4?v=797400bbbb", "cap": "一边往下落，一边拿下一罐橘子酱", "n": 5}, {"t": "p", "s": [["c02-005", "经过一个架子的时候，爱丽丝顺手拿下了一个罐子，上面贴着“橘子酱”的标签。"], ["c02-006", "可是打开一看，里面是空的，真叫人失望。"], ["c02-007", "她怕罐子掉下去砸着下面的人，就趁经过另一个柜子的时候，把它放了回去。"]]}, {"t": "p", "s": [["c02-008", "爱丽丝一边落，一边想：“我会不会一直穿过地球，掉到地球的另一边去呢？"], ["c02-009", "那边的人走路，是不是头朝下的？”"]]}, {"t": "img", "src": "images/59.webp?v=2091e09d25", "vid": "images/59.mp4?v=ec0ebb2478", "cap": "她想起家里的小猫黛娜和蝙蝠", "n": 6}, {"t": "p", "s": [["c02-010", "她落呀落，一直也落不到底。"], ["c02-011", "爱丽丝只好跟自己说话：“家里的小猫黛娜今天晚上一定会想我的。"], ["c02-012", "黛娜呀，你要是也在这里就好了！"], ["c02-013", "不过半空中可没有老鼠给你抓，也许能抓到一只蝙蝠。"], ["c02-014", "可是，猫吃蝙蝠吗？”"]]}, {"t": "p", "s": [["c02-015", "她迷迷糊糊地念叨着：“猫吃蝙蝠吗？"], ["c02-016", "蝙蝠吃猫吗？”"], ["c02-017", "她念着念着，好像就要睡着了。"]]}, {"t": "song", "title": "往下落呀往下落", "head": "song-falling", "lines": [["song-falling-01", "白兔白兔跑得快"], ["song-falling-02", "怀表滴答响起来"], ["song-falling-03", "我跟着它钻进洞"], ["song-falling-04", "一下掉进井里来"], ["song-falling-05", "往下落呀往下落"], ["song-falling-06", "书架柜子身边过"], ["song-falling-07", "地球那边有什么"], ["song-falling-08", "慢慢飘呀慢慢落"], ["song-falling-09", "黛娜黛娜你在哪"], ["song-falling-10", "是不是在想我呀"], ["song-falling-11", "半空没有小老鼠"], ["song-falling-12", "抓只蝙蝠行不行"], ["song-falling-13", "往下落呀往下落"], ["song-falling-14", "书架柜子身边过"], ["song-falling-15", "猫吃蝙蝠蝙蝠吃猫"], ["song-falling-16", "迷迷糊糊睡着了"]]}]}, {"title": "第三章　小门和小瓶子", "head": "c03-h", "audio": "audio/ch03.m4a?v=d721427f18", "duration": 114.452, "times": {"c03-h": [0.0, 2.624], "c03-001": [3.624, 9.579], "c03-002": [11.254, 16.352], "c03-003": [16.702, 26.657], "c03-004": [27.007, 29.997], "c03-005": [30.847, 38.221], "c03-006": [38.571, 44.159], "c03-007": [45.009, 49.803], "c03-008": [50.153, 58.498], "c03-009": [59.348, 63.426], "c03-010": [63.776, 65.495], "c03-011": [66.345, 72.953], "c03-012": [73.803, 78.783], "c03-013": [79.133, 83.242], "c03-014": [83.592, 88.659], "c03-015": [91.374, 94.656], "c03-016": [95.006, 101.615], "c03-017": [101.965, 104.227], "c03-018": [105.077, 112.952]}, "blocks": [{"t": "p", "s": [["c03-001", "“扑通”一声，爱丽丝落在了一堆树枝和干树叶上，一点儿也没摔疼。"]]}, {"t": "img", "src": "images/60.webp?v=2dbb469b10", "vid": "images/60.mp4?v=c7f8818b70", "cap": "白兔子沿着长长的走廊飞跑", "n": 7}, {"t": "p", "s": [["c03-002", "她跳起来往前一看，白兔子正沿着一条长长的走廊飞跑。"], ["c03-003", "爱丽丝像风一样追过去，正好听见它在拐角那里说：“哎呀，我的耳朵和胡子呀，这么晚了！”"], ["c03-004", "可是一拐过弯，白兔子就不见了。"]]}, {"t": "img", "src": "images/05.webp?v=79d9a98b9d", "vid": "images/05.mp4?v=6dd0c6fafa", "cap": "四周全是门的大厅", "n": 8}, {"t": "p", "s": [["c03-005", "她站起来，发现自己在一个长长的大厅里，四周全是门，可是每一扇门都锁着。"], ["c03-006", "大厅中间有一张玻璃小桌子，桌上放着一把小小的金钥匙。"]]}, {"t": "img", "src": "images/06.webp?v=2be4349614", "vid": "images/06.mp4?v=51d6027f5b", "cap": "小门外是最美丽的花园", "n": 9}, {"t": "p", "s": [["c03-007", "爱丽丝在帘子后面发现了一扇很小的门，只有一尺高。"], ["c03-008", "她用金钥匙打开小门，看见门外是一座最美丽的花园，有鲜艳的花坛，还有清凉的喷泉。"]]}, {"t": "p", "s": [["c03-009", "“可是我太大了，连脑袋都钻不过去呀。”"], ["c03-010", "爱丽丝叹了口气。"]]}, {"t": "img", "src": "images/07.webp?v=35a499349a", "vid": "images/07.mp4?v=7bab66d7a1", "cap": "瓶子上写着“喝我”", "n": 10}, {"t": "p", "s": [["c03-011", "她回到桌子边，发现桌上多了一个小瓶子，瓶子上写着两个大字：“喝我”。"]]}, {"t": "p", "s": [["c03-012", "爱丽丝先仔细看了看，确定上面没写“有毒”，才尝了一口。"], ["c03-013", "味道好极了，像樱桃馅饼，又像烤火鸡。"], ["c03-014", "她一口气喝完了，身子一下子缩小了，变得只有十寸高。"]]}, {"t": "p", "s": [["c03-015", "她等了一会儿，看自己还会不会再缩下去。"], ["c03-016", "她有点儿担心：“要是一直缩下去，会不会像蜡烛一样，一下子灭掉了呢？”"], ["c03-017", "还好，她没有再变小了。"]]}, {"t": "img", "src": "images/08.webp?v=c1fc8d77b4", "vid": "images/08.mp4?v=2c11280a3b", "cap": "她变得只有十寸高", "n": 11}, {"t": "p", "s": [["c03-018", "她高兴地跑到小门前，可是糟糕，金钥匙还放在高高的玻璃桌上，她怎么也够不着了！"]]}]}, {"title": "第四章　越来越奇怪", "head": "c04-h", "audio": "audio/ch04.m4a?v=3d0c55da15", "duration": 71.106, "times": {"c04-h": [0.0, 2.35], "c04-001": [3.35, 12.578], "c04-002": [13.428, 17.835], "c04-003": [18.185, 20.23], "c04-004": [20.58, 25.305], "c04-005": [26.155, 31.885], "c04-006": [32.235, 41.331], "c04-007": [45.427, 46.712], "c04-008": [47.062, 49.817], "c04-009": [50.167, 55.492], "c04-010": [56.342, 59.27], "c04-011": [59.62, 62.405], "c04-012": [62.755, 65.83], "c04-013": [66.18, 69.606]}, "blocks": [{"t": "img", "src": "images/61.webp?v=0e486d6b24", "vid": "images/61.mp4?v=5a7a694f64", "cap": "变小的爱丽丝爬不上滑溜溜的桌子腿", "n": 12}, {"t": "p", "s": [["c04-001", "爱丽丝想顺着桌子腿爬上去，可是桌子腿太滑了，她爬一次滑下来一次，最后累得坐在地上哭了起来。"]]}, {"t": "p", "s": [["c04-002", "爱丽丝严厉地对自己说：“好啦，哭有什么用！"], ["c04-003", "我劝你马上别哭了！”"], ["c04-004", "她常常这样给自己出主意，有时候还把自己骂哭呢。"]]}, {"t": "img", "src": "images/09.webp?v=f9dbd8fbc3", "vid": "images/09.mp4?v=55b2bb7f6c", "cap": "她的身子拉得老长老长", "n": 13}, {"t": "p", "s": [["c04-005", "这时，她看见桌子底下有一块小蛋糕，上面写着：“吃我”。"], ["c04-006", "爱丽丝吃了下去，这一次，她的身子像望远镜一样，一下子拉得老长老长，脑袋都碰到天花板了！"]]}, {"t": "p", "s": [["c04-007", "“越来越奇怪了！”"], ["c04-008", "爱丽丝惊讶得连话都说不好了。"], ["c04-009", "她低头一看，自己的脚已经离得好远好远，快要看不见了。"]]}, {"t": "img", "src": "images/62.webp?v=564356f7b4", "vid": "images/62.mp4?v=ad794bb99d", "cap": "“再见啦，我的脚！”", "n": 14}, {"t": "p", "s": [["c04-010", "爱丽丝说：“再见啦，我的脚！"], ["c04-011", "以后谁给你们穿鞋穿袜子呢？"], ["c04-012", "我离得这么远，可管不了你们啦。"], ["c04-013", "每年圣诞节，我就给你们寄一双新靴子吧！”"]]}]}, {"title": "第五章　眼泪池", "head": "c05-h", "audio": "audio/ch05.m4a?v=e04b80aeeb", "duration": 112.352, "times": {"c05-h": [0.0, 2.018], "c05-001": [3.018, 6.594], "c05-002": [6.944, 9.688], "c05-003": [10.038, 15.889], "c05-004": [16.739, 31.434], "c05-005": [31.784, 35.335], "c05-006": [36.185, 39.144], "c05-007": [39.994, 45.55], "c05-008": [46.4, 52.449], "c05-009": [52.799, 55.257], "c05-010": [55.607, 58.978], "c05-011": [59.828, 65.654], "c05-012": [66.004, 67.675], "c05-013": [68.025, 73.148], "c05-014": [73.998, 77.04], "c05-015": [77.39, 80.568], "c05-016": [82.783, 86.398], "c05-017": [87.248, 92.753], "c05-018": [93.103, 103.688], "c05-019": [105.394, 108.338], "c05-020": [108.688, 110.852]}, "blocks": [{"t": "img", "src": "images/10.webp?v=014690f71e", "vid": "images/10.mp4?v=0e44f0e307", "cap": "她伤心地哭了起来", "n": 15}, {"t": "p", "s": [["c05-001", "爱丽丝变得这么高，更进不了那扇小门了。"], ["c05-002", "她坐在地上，伤心地哭了起来。"], ["c05-003", "她哭呀哭，眼泪流了一大摊，在大厅里汇成了一个大水池。"]]}, {"t": "img", "src": "images/63.webp?v=91edee58c3", "vid": "images/63.mp4?v=454e1c0385", "cap": "白兔子念叨着公爵夫人，急急忙忙地跑来", "n": 16}, {"t": "p", "s": [["c05-004", "这时，白兔子又急急忙忙地跑过来，它穿得整整齐齐，一手拿着一副白手套，一手拿着一把大扇子，嘴里念叨着：“哎呀，公爵夫人，公爵夫人！"], ["c05-005", "我让她等了这么久，她一定会大发脾气的！”"]]}, {"t": "p", "s": [["c05-006", "爱丽丝小声说：“对不起，先生……”"]]}, {"t": "img", "src": "images/11.webp?v=1fba937735", "vid": "images/11.mp4?v=d14a5123b5", "cap": "白兔子吓得扔下扇子和手套", "n": 17}, {"t": "p", "s": [["c05-007", "白兔子一看见巨人一样的爱丽丝，吓得扔下扇子和手套就跑了。"]]}, {"t": "p", "s": [["c05-008", "爱丽丝捡起扇子和手套，自言自语地说：“今天什么事都这么奇怪！"], ["c05-009", "我是不是一夜之间变成别人了？"], ["c05-010", "要是我已经不是我了，那我到底是谁呢？”"]]}, {"t": "p", "s": [["c05-011", "她想试试自己还记不记得以前学过的东西：“四五一十二，四六一十三……"], ["c05-012", "哎呀，不对不对！”"], ["c05-013", "她又背了一首诗，可是背出来的话，跟原来的一点儿也不一样。"]]}, {"t": "p", "s": [["c05-014", "爱丽丝一边说，一边扇着扇子。"], ["c05-015", "没想到，她又一点一点地变小了。"], ["c05-016", "她赶紧扔掉扇子，才没有缩得完全不见。"]]}, {"t": "img", "src": "images/12.webp?v=e06888f710", "vid": "images/12.mp4?v=c44c7ba161", "cap": "掉进了自己的眼泪池", "n": 18}, {"t": "p", "s": [["c05-017", "她跑到小门前，可是小门又锁上了，金钥匙也还在桌子上。"], ["c05-018", "爱丽丝刚想“这下可糟透了”，脚下一滑，“扑通”一声，她掉进了自己哭出来的眼泪池里，咸咸的眼泪一直淹到了下巴。"]]}, {"t": "p", "s": [["c05-019", "“我要是刚才不哭得那么厉害就好了！”"], ["c05-020", "爱丽丝一边游，一边说。"]]}]}, {"title": "第六章　池子里的老鼠", "head": "c06-h", "audio": "audio/ch06.m4a?v=10e226665b", "duration": 115.615, "times": {"c06-h": [0.0, 2.482], "c06-001": [3.482, 5.799], "c06-002": [6.149, 11.524], "c06-003": [12.374, 15.519], "c06-004": [15.869, 18.491], "c06-005": [19.341, 23.204], "c06-006": [24.054, 29.484], "c06-007": [29.834, 34.622], "c06-008": [35.472, 40.227], "c06-009": [41.077, 44.13], "c06-010": [44.48, 46.53], "c06-011": [46.88, 49.928], "c06-012": [50.278, 57.717], "c06-013": [58.067, 59.991], "c06-014": [60.841, 65.294], "c06-015": [65.644, 67.487], "c06-016": [68.337, 70.81], "c06-017": [71.16, 72.589], "c06-018": [72.939, 74.28], "c06-019": [74.63, 79.557], "c06-020": [79.907, 81.576], "c06-021": [82.426, 84.391], "c06-022": [84.741, 88.725], "c06-023": [89.075, 90.899], "c06-024": [91.249, 100.106], "c06-025": [100.956, 110.03], "c06-026": [110.38, 114.115]}, "blocks": [{"t": "img", "src": "images/64.webp?v=978eade3f0", "vid": "images/64.mp4?v=8ad82a0932", "cap": "泪水池里，游来了一只小老鼠", "n": 19}, {"t": "p", "s": [["c06-001", "池子里有什么东西在扑腾。"], ["c06-002", "爱丽丝游过去一看，原来是一只老鼠，它也是不小心滑进来的。"]]}, {"t": "p", "s": [["c06-003", "爱丽丝客客气气地说：“喂，老鼠！"], ["c06-004", "你知道怎么从这个池子里出去吗？”"]]}, {"t": "p", "s": [["c06-005", "老鼠瞪着小眼睛看了看她，一句话也没说。"]]}, {"t": "p", "s": [["c06-006", "爱丽丝想：“说不定它是一只法国老鼠，听不懂我的话。”"], ["c06-007", "于是她用课本上学来的第一句法语说：“我的猫在哪儿？”"]]}, {"t": "img", "src": "images/65.webp?v=af462cfbf6", "vid": "images/65.mp4?v=6f9a046fc1", "cap": "一听见“猫”，老鼠吓得跳出水面", "n": 20}, {"t": "p", "s": [["c06-008", "老鼠一听，吓得从水里跳了起来，浑身发抖。"]]}, {"t": "p", "s": [["c06-009", "爱丽丝赶紧说：“哎呀，对不起！"], ["c06-010", "我忘了你不喜欢猫。"], ["c06-011", "可是，你要是见过我的黛娜就好了。"], ["c06-012", "它可乖了，会坐在火炉边舔爪子、洗脸，抓起老鼠来也特别厉害……"], ["c06-013", "哎呀，对不起，对不起！”"]]}, {"t": "p", "s": [["c06-014", "老鼠气得胡子都翘起来了：“我们家世世代代都讨厌猫！"], ["c06-015", "以后别再让我听见这个字！”"]]}, {"t": "p", "s": [["c06-016", "爱丽丝说：“我再也不说了！"], ["c06-017", "那么，你……"], ["c06-018", "你喜欢狗吗？"], ["c06-019", "我家隔壁有一只小狗，眼睛亮亮的，抓起老鼠来……"], ["c06-020", "哎呀，又说错了！”"]]}, {"t": "p", "s": [["c06-021", "老鼠拼命地游走了。"], ["c06-022", "爱丽丝在后面温柔地叫它：“老鼠，回来吧！"], ["c06-023", "我们再也不说猫和狗了！”"], ["c06-024", "老鼠这才慢慢地游回来，说：“到岸上去，我讲我的故事给你听，你就知道我为什么讨厌猫和狗了。”"]]}, {"t": "img", "src": "images/13.webp?v=136eb33e7e", "vid": "images/13.mp4?v=25d7ca6db3", "cap": "池子里的小动物们", "n": 21}, {"t": "p", "s": [["c06-025", "池子里的动物越来越多了，后来又来了一只鸭子、一只渡渡鸟、一只小鹦鹉，还有许多奇怪的小动物。"], ["c06-026", "大家都掉进了眼泪池里，浑身湿淋淋的。"]]}]}, {"title": "第七章　大家都赢了", "head": "c07-h", "audio": "audio/ch07.m4a?v=daff95e87d", "duration": 147.611, "times": {"c07-h": [0.0, 2.096], "c07-001": [3.096, 7.451], "c07-002": [8.301, 11.788], "c07-003": [12.138, 13.675], "c07-004": [14.025, 17.322], "c07-005": [17.672, 23.536], "c07-006": [24.386, 30.676], "c07-007": [31.526, 36.369], "c07-008": [36.719, 44.087], "c07-009": [44.937, 48.137], "c07-010": [48.487, 50.95], "c07-011": [51.3, 53.994], "c07-012": [54.844, 56.683], "c07-013": [57.033, 63.323], "c07-014": [64.173, 66.123], "c07-015": [66.473, 67.541], "c07-016": [67.891, 73.146], "c07-017": [73.496, 79.057], "c07-018": [79.407, 81.018], "c07-019": [81.868, 90.121], "song-caucus-race": [91.321, 97.321], "song-caucus-race-01": [97.321, 99.541], "song-caucus-race-02": [99.541, 100.801], "song-caucus-race-03": [100.801, 103.081], "song-caucus-race-04": [103.081, 104.401], "song-caucus-race-05": [113.381, 115.981], "song-caucus-race-06": [115.981, 118.841], "song-caucus-race-07": [119.641, 122.581], "song-caucus-race-08": [122.781, 126.361], "song-caucus-race-09": [126.361, 129.921], "song-caucus-race-10": [129.921, 133.541], "song-caucus-race-11": [133.541, 135.881], "song-caucus-race-12": [135.881, 137.741], "song-caucus-race-13": [137.741, 140.761]}, "blocks": [{"t": "p", "s": [["c07-001", "大家游上了岸，一个个湿漉漉的，冷得直发抖。"]]}, {"t": "img", "src": "images/66.webp?v=5d2636031b", "vid": "images/66.mp4?v=8573d1b8f6", "cap": "老鼠给大家讲最干巴巴的历史", "n": 22}, {"t": "p", "s": [["c07-002", "老鼠神气地说：“都坐下，听我说！"], ["c07-003", "我马上让你们干起来。"], ["c07-004", "我要讲的，是我知道的最干巴巴的东西！”"], ["c07-005", "它讲起了一段古代国王的历史，又长又干，大家还是冷得直哆嗦。"]]}, {"t": "img", "src": "images/14.webp?v=e2e85ae2a3", "vid": "images/14.mp4?v=d39ebf7689", "cap": "渡渡鸟一本正经地说话", "n": 23}, {"t": "p", "s": [["c07-006", "渡渡鸟一本正经地说：“要想把身上弄干，最好的办法，就是来一场会议式赛跑。”"]]}, {"t": "img", "src": "images/15.webp?v=ea63d78d37", "vid": "images/15.mp4?v=ae090a2028", "cap": "会议式赛跑", "n": 24}, {"t": "p", "s": [["c07-007", "渡渡鸟在地上画了一个圆圈，让大家随便站在圈上。"], ["c07-008", "没有人喊“预备，开始”，大家想什么时候跑就什么时候跑，想什么时候停就什么时候停。"]]}, {"t": "p", "s": [["c07-009", "跑了半个钟头，大家的身上都干了。"], ["c07-010", "渡渡鸟宣布：“比赛结束！"], ["c07-011", "每个人都赢了，每个人都有奖品！”"]]}, {"t": "img", "src": "images/16.webp?v=408009ed21", "vid": "images/16.mp4?v=1eefc098bf", "cap": "每人一颗糖果", "n": 25}, {"t": "p", "s": [["c07-012", "可是奖品从哪里来呢？"], ["c07-013", "爱丽丝只好从口袋里掏出一盒糖果，给每人发了一颗，正好一人一颗。"]]}, {"t": "img", "src": "images/67.webp?v=693be9a9cc", "vid": "images/67.mp4?v=aa2ab2fffa", "cap": "渡渡鸟郑重地把顶针颁给爱丽丝", "n": 26}, {"t": "p", "s": [["c07-014", "“那她自己也应该有奖品呀。”"], ["c07-015", "老鼠说。"], ["c07-016", "渡渡鸟问爱丽丝口袋里还有什么，爱丽丝掏出了一个顶针。"], ["c07-017", "渡渡鸟郑重地接过来，又郑重地还给她：“请接受这个漂亮的顶针！”"], ["c07-018", "大家都鼓起掌来。"]]}, {"t": "p", "s": [["c07-019", "爱丽丝觉得这一切都很好笑，可是大家都那么严肃，她只好忍住，也一本正经地鞠了一躬。"]]}, {"t": "song", "title": "会议式赛跑", "head": "song-caucus-race", "lines": [["song-caucus-race-01", "画个圆圈圈"], ["song-caucus-race-02", "站在圈上边"], ["song-caucus-race-03", "不用喊预备"], ["song-caucus-race-04", "想跑就向前"], ["song-caucus-race-05", "鸭子扭一扭"], ["song-caucus-race-06", "鹦鹉蹦一蹦"], ["song-caucus-race-07", "渡渡鸟大摇大摆"], ["song-caucus-race-08", "跑了一圈又一圈"], ["song-caucus-race-09", "跑呀跑，绕呀绕"], ["song-caucus-race-10", "身上的水都跑干了"], ["song-caucus-race-11", "谁赢了，谁赢了"], ["song-caucus-race-12", "每个人都赢了"], ["song-caucus-race-13", "每个人都有奖品"]]}]}, {"title": "第八章　老鼠的长故事", "head": "c08-h", "audio": "audio/ch08.m4a?v=67bfe07807", "duration": 89.854, "times": {"c08-h": [0.0, 2.605], "c08-001": [3.605, 8.683], "c08-002": [9.533, 12.127], "c08-003": [12.476, 14.188], "c08-004": [15.038, 23.147], "c08-005": [23.497, 30.872], "c08-006": [31.722, 34.497], "c08-007": [34.847, 35.714], "c08-008": [36.564, 40.68], "c08-009": [41.53, 42.494], "c08-010": [42.844, 45.016], "c08-011": [45.866, 51.704], "c08-012": [52.554, 54.43], "c08-013": [54.78, 55.786], "c08-014": [56.636, 59.928], "c08-015": [60.278, 66.37], "c08-016": [67.22, 69.761], "c08-017": [70.111, 75.985], "c08-018": [76.335, 82.192], "c08-019": [83.042, 84.569], "c08-020": [84.919, 88.354]}, "blocks": [{"t": "p", "s": [["c08-001", "大家吃完了糖果，又围成一圈坐下，请老鼠讲它的故事。"]]}, {"t": "p", "s": [["c08-002", "“我的故事，又长又伤心。”"], ["c08-003", "老鼠叹了口气说。"]]}, {"t": "img", "src": "images/68.webp?v=de80139bb1", "vid": "images/68.mp4?v=523bb86bd4", "cap": "老鼠又长又伤心的故事，像一条长尾巴", "n": 27}, {"t": "p", "s": [["c08-004", "爱丽丝看着老鼠长长的尾巴，想：“尾巴确实很长，可是尾巴为什么会伤心呢？”"], ["c08-005", "她一边听，一边琢磨，老鼠讲的故事在她脑袋里，就像一条弯弯曲曲的长尾巴。"]]}, {"t": "p", "s": [["c08-006", "老鼠生气地说：“你没有在听！"], ["c08-007", "你在想什么？”"]]}, {"t": "p", "s": [["c08-008", "爱丽丝说：“对不起，你已经讲到第五个弯了吧？”"]]}, {"t": "p", "s": [["c08-009", "“我才没有！”"], ["c08-010", "老鼠气呼呼地站起来就走。"]]}, {"t": "p", "s": [["c08-011", "爱丽丝自言自语：“我要是把黛娜带来就好了，它一下子就能把老鼠抓回来！”"]]}, {"t": "p", "s": [["c08-012", "“请问，黛娜是谁？”"], ["c08-013", "小鹦鹉问。"]]}, {"t": "p", "s": [["c08-014", "爱丽丝高兴地说：“黛娜是我的猫！"], ["c08-015", "它抓老鼠可厉害了，还会抓小鸟，一看见小鸟，一口就……”"]]}, {"t": "img", "src": "images/69.webp?v=60543102dd", "vid": "images/69.mp4?v=1f2e7f7fc7", "cap": "一听说黛娜会抓小鸟，大家全都慌了", "n": 28}, {"t": "p", "s": [["c08-016", "这话一说，大家全都慌了。"], ["c08-017", "老喜鹊说天凉了，要回家；金丝雀说要带孩子们去睡觉了。"], ["c08-018", "不一会儿，所有的动物都找了个借口走掉了，只剩下爱丽丝一个人。"]]}, {"t": "p", "s": [["c08-019", "“我真不该提黛娜！”"], ["c08-020", "爱丽丝难过地说，又伤心地哭了起来。"]]}]}, {"title": "第九章　白兔子的房子", "head": "c09-h", "audio": "audio/ch09.m4a?v=eac8cb4af4", "duration": 66.927, "times": {"c09-h": [0.0, 2.429], "c09-001": [3.429, 6.5], "c09-002": [6.85, 10.747], "c09-003": [11.097, 17.927], "c09-004": [18.777, 21.381], "c09-005": [21.731, 26.661], "c09-006": [27.011, 31.45], "c09-007": [31.8, 35.044], "c09-008": [35.894, 48.808], "c09-009": [52.904, 60.494], "c09-010": [60.844, 65.427]}, "blocks": [{"t": "img", "src": "images/17.webp?v=d4f5fdeae4", "vid": "images/17.mp4?v=29e3c5369f", "cap": "快回家给我拿手套和扇子", "n": 29}, {"t": "p", "s": [["c09-001", "过了一会儿，远处又传来“嗒嗒”的脚步声。"], ["c09-002", "白兔子又回来了，它在找丢掉的扇子和手套。"], ["c09-003", "它把爱丽丝当成了自己的女仆：“玛丽安，快回家给我拿一副手套和一把扇子来！”"]]}, {"t": "img", "src": "images/18.webp?v=64ee3a2fa9", "vid": "images/18.mp4?v=828df907b3", "cap": "白兔子的小房子", "n": 30}, {"t": "p", "s": [["c09-004", "爱丽丝跑进了白兔子的小房子。"], ["c09-005", "门上挂着一块亮闪闪的铜牌，上面刻着“白兔”两个字。"], ["c09-006", "她在房间里找到了扇子和手套，还看见一个小瓶子。"], ["c09-007", "她想：“喝了它，说不定能变大一点儿。”"]]}, {"t": "img", "src": "images/19.webp?v=d79a42048c", "vid": "images/19.mp4?v=1cde80ee13", "cap": "整个小房子都被她塞满了", "n": 31}, {"t": "p", "s": [["c09-008", "谁知道，她刚喝了一半，就飞快地长呀长，脑袋顶到了天花板，一只胳膊伸出了窗户，一只脚伸进了烟囱里，整个小房子都被她塞满了！"]]}, {"t": "p", "s": [["c09-009", "爱丽丝想：“在家里多好呀，不会一会儿变大一会儿变小，也不会被老鼠和兔子使唤。"], ["c09-010", "可是，要是不来这里，我也见不到这么多奇怪的事了。”"]]}]}, {"title": "第十章　小蜥蜴比尔", "head": "c10-h", "audio": "audio/ch10.m4a?v=c43d58de03", "duration": 107.769, "times": {"c10-h": [0.0, 2.691], "c10-001": [3.691, 6.435], "c10-002": [6.785, 11.256], "c10-003": [12.106, 13.628], "c10-004": [13.978, 15.0], "c10-005": [15.35, 21.596], "c10-006": [22.446, 24.585], "c10-007": [24.935, 25.709], "c10-008": [26.059, 26.784], "c10-009": [27.134, 29.317], "c10-010": [30.167, 32.334], "c10-011": [32.684, 34.094], "c10-012": [34.944, 35.663], "c10-013": [36.013, 37.948], "c10-014": [38.298, 39.364], "c10-015": [40.214, 47.2], "c10-016": [47.55, 52.405], "c10-017": [55.789, 64.339], "c10-018": [64.689, 72.789], "c10-019": [73.639, 76.016], "c10-020": [76.366, 80.433], "c10-021": [80.783, 83.933], "c10-022": [86.148, 89.831], "c10-023": [90.681, 95.919], "c10-024": [96.269, 102.747], "c10-025": [103.097, 106.269]}, "blocks": [{"t": "p", "s": [["c10-001", "白兔子跑到门口，想推门进来。"], ["c10-002", "可是爱丽丝的胳膊肘正好顶着门，它怎么也推不开。"]]}, {"t": "img", "src": "images/70.webp?v=3e95bd9186", "vid": "images/70.mp4?v=31501c60f4", "cap": "白兔子摔进了黄瓜架", "n": 32}, {"t": "p", "s": [["c10-003", "“那我从窗户爬进去！”"], ["c10-004", "白兔子说。"], ["c10-005", "爱丽丝在窗口一挥手，只听“哗啦”一声，白兔子摔进了园子里的黄瓜架。"]]}, {"t": "p", "s": [["c10-006", "白兔子大喊：“帕特！"], ["c10-007", "帕特！"], ["c10-008", "你在哪儿？"], ["c10-009", "窗户里那个是什么东西？”"]]}, {"t": "p", "s": [["c10-010", "“那是一条胳膊，先生。”"], ["c10-011", "园丁帕特说。"]]}, {"t": "p", "s": [["c10-012", "“胳膊？"], ["c10-013", "哪有这么大的胳膊！"], ["c10-014", "快把它弄走！”"]]}, {"t": "img", "src": "images/20.webp?v=60dd408bb5", "vid": "images/20.mp4?v=1f2685eb73", "cap": "比尔像火箭一样飞上了天", "n": 33}, {"t": "p", "s": [["c10-015", "白兔子在外面急得团团转，它叫来了小蜥蜴比尔，让它从烟囱爬进去。"], ["c10-016", "爱丽丝用脚轻轻一踢，比尔就像火箭一样飞上了天。"]]}, {"t": "img", "src": "images/71.webp?v=8b7c853598", "vid": "images/71.mp4?v=acd5396b87", "cap": "小动物们七手八脚地接住比尔", "n": 34}, {"t": "p", "s": [["c10-017", "外面的小动物七手八脚地接住比尔，给它喝了点儿水，问它：“比尔，刚才是怎么回事？”"], ["c10-018", "比尔晕乎乎地说：“我只知道，有个东西像玩偶匣子一样冲过来，然后我就像火箭一样飞起来了！”"]]}, {"t": "img", "src": "images/21.webp?v=171b904334", "vid": "images/21.mp4?v=d91080bae0", "cap": "小石子变成了小蛋糕", "n": 35}, {"t": "p", "s": [["c10-019", "大家又往窗户里扔小石子。"], ["c10-020", "小石子落在地板上，竟然都变成了小蛋糕。"], ["c10-021", "爱丽丝吃了一块，身子又变小了。"], ["c10-022", "她赶紧跑出房子，一口气跑进了树林里。"]]}, {"t": "img", "src": "images/72.webp?v=8d20010be5", "vid": "images/72.mp4?v=7c41158729", "cap": "树林里，一只巨大的小狗看着她", "n": 36}, {"t": "p", "s": [["c10-023", "树林里，一只大得吓人的小狗正用圆圆的大眼睛看着她。"], ["c10-024", "爱丽丝捡起一根小树枝，往远处一扔，小狗就欢快地扑过去追树枝。"], ["c10-025", "爱丽丝趁这个机会，一溜烟地逃走了。"]]}]}, {"title": "第十一章　毛毛虫的忠告", "head": "c11-h", "audio": "audio/ch11.m4a?v=e16d32e4d4", "duration": 115.028, "times": {"c11-h": [0.0, 2.424], "c11-001": [3.424, 7.35], "c11-002": [7.7, 13.822], "c11-003": [14.672, 15.447], "c11-004": [15.797, 17.726], "c11-005": [18.576, 20.663], "c11-006": [21.013, 29.326], "c11-007": [30.176, 31.455], "c11-008": [31.805, 32.958], "c11-009": [33.808, 40.029], "c11-010": [40.379, 45.802], "c11-011": [46.652, 47.76], "c11-012": [48.11, 49.299], "c11-013": [50.149, 53.124], "c11-014": [53.474, 56.305], "c11-015": [56.655, 58.587], "c11-016": [58.937, 60.71], "c11-017": [61.56, 63.046], "c11-018": [63.396, 64.453], "c11-019": [64.803, 67.415], "c11-020": [68.265, 73.767], "c11-021": [74.117, 80.228], "c11-022": [81.078, 83.732], "c11-023": [84.082, 85.113], "c11-024": [85.963, 87.842], "c11-025": [88.192, 89.227], "c11-026": [90.077, 95.572], "c11-027": [96.422, 98.981], "c11-028": [99.331, 103.023], "c11-029": [103.873, 113.528]}, "blocks": [{"t": "img", "src": "images/22.webp?v=4f380cf62a", "vid": "images/22.mp4?v=b65a387466", "cap": "树林里的大蘑菇", "n": 37}, {"t": "img", "src": "images/23.webp?v=f12fe60110", "vid": "images/23.mp4?v=32cf058649", "cap": "你是谁？", "n": 38}, {"t": "p", "s": [["c11-001", "树林里有一朵大蘑菇，和爱丽丝差不多高。"], ["c11-002", "蘑菇顶上，坐着一条蓝色的大毛毛虫，它抱着胳膊，慢悠悠的。"]]}, {"t": "p", "s": [["c11-003", "“你是谁？”"], ["c11-004", "毛毛虫懒洋洋地问。"]]}, {"t": "p", "s": [["c11-005", "爱丽丝说：“我……"], ["c11-006", "我也不太清楚，今天早上起床的时候，我还知道我是谁，可是从那以后，我已经变了好几次了。”"]]}, {"t": "p", "s": [["c11-007", "“说清楚点儿！”"], ["c11-008", "毛毛虫说。"]]}, {"t": "p", "s": [["c11-009", "爱丽丝说：“我说不清楚，一天之内变了好几回大小，真叫人糊涂。"], ["c11-010", "等你有一天变成蛹，再变成蝴蝶，你也会觉得有点儿奇怪的，对不对？”"]]}, {"t": "p", "s": [["c11-011", "“一点儿也不。”"], ["c11-012", "毛毛虫说。"]]}, {"t": "p", "s": [["c11-013", "爱丽丝有点儿生气，转身要走。"], ["c11-014", "毛毛虫在后面叫她：“回来！"], ["c11-015", "我有重要的话要说。”"], ["c11-016", "爱丽丝又走了回来。"]]}, {"t": "p", "s": [["c11-017", "“别发脾气。”"], ["c11-018", "毛毛虫说。"], ["c11-019", "爱丽丝忍着气问：“就这些吗？”"]]}, {"t": "p", "s": [["c11-020", "毛毛虫说：“不，你说你变了，那你背一首诗给我听听。”"], ["c11-021", "爱丽丝背了一首《威廉老爸爸》，可是背出来的句子，全都乱七八糟。"]]}, {"t": "p", "s": [["c11-022", "“从头到尾都背错了。”"], ["c11-023", "毛毛虫说。"]]}, {"t": "p", "s": [["c11-024", "“你想变成多大？”"], ["c11-025", "毛毛虫问。"]]}, {"t": "p", "s": [["c11-026", "爱丽丝说：“稍微大一点儿就好，只有三寸高，实在太矮了。”"]]}, {"t": "p", "s": [["c11-027", "“三寸高正好！”"], ["c11-028", "毛毛虫生气地说，它自己正好三寸高。"]]}, {"t": "img", "src": "images/24.webp?v=1c5fa00fe2", "vid": "images/24.mp4?v=274fe37e42", "cap": "一边让你长高，另一边让你变矮", "n": 39}, {"t": "p", "s": [["c11-029", "毛毛虫从蘑菇上爬下来，一边往草丛里爬，一边说：“一边让你长高，另一边让你变矮。”"]]}]}, {"title": "第十二章　鸽子和蛇", "head": "c12-h", "audio": "audio/ch12.m4a?v=1b5b9d5371", "duration": 74.888, "times": {"c12-h": [0.0, 2.746], "c12-001": [3.746, 7.005], "c12-002": [7.355, 18.128], "c12-003": [18.978, 24.519], "c12-004": [24.869, 25.656], "c12-005": [26.506, 27.545], "c12-006": [27.895, 28.936], "c12-007": [29.786, 32.199], "c12-008": [32.549, 40.487], "c12-009": [40.837, 46.377], "c12-010": [47.227, 50.348], "c12-011": [50.698, 51.74], "c12-012": [52.59, 53.591], "c12-013": [53.941, 54.64], "c12-014": [55.49, 60.733], "c12-015": [61.583, 63.419], "c12-016": [63.769, 66.694], "c12-017": [67.544, 73.388]}, "blocks": [{"t": "img", "src": "images/25.webp?v=5972d9c557", "vid": "images/25.mp4?v=268b6f320a", "cap": "脖子伸得老长老长", "n": 40}, {"t": "p", "s": [["c12-001", "爱丽丝两只手各掰下一小块蘑菇边。"], ["c12-002", "她咬了右手的一小口，下巴一下子碰到了脚背；又赶紧咬了左手的一小口，脖子却一下子伸得老长老长，脑袋冒出了树梢。"]]}, {"t": "img", "src": "images/73.webp?v=8fc1b79b32", "vid": "images/73.mp4?v=a26b982c8b", "cap": "鸽子以为她是一条蛇", "n": 41}, {"t": "p", "s": [["c12-003", "一只鸽子扑扇着翅膀飞过来，拼命地拍打她的脸：“蛇！"], ["c12-004", "蛇！”"]]}, {"t": "p", "s": [["c12-005", "“我不是蛇！”"], ["c12-006", "爱丽丝说。"]]}, {"t": "p", "s": [["c12-007", "鸽子说：“你就是蛇！"], ["c12-008", "我在树根下面试过，在河岸上试过，在篱笆上也试过，可是到哪儿都躲不开蛇！"], ["c12-009", "我好不容易在最高的树上搭了个窝，你们蛇竟然从天上弯下来了！”"]]}, {"t": "p", "s": [["c12-010", "“我真的不是蛇，我是一个小女孩。”"], ["c12-011", "爱丽丝说。"]]}, {"t": "p", "s": [["c12-012", "“那你吃不吃蛋？”"], ["c12-013", "鸽子问。"]]}, {"t": "p", "s": [["c12-014", "爱丽丝老老实实地说：“当然吃蛋，小女孩也吃蛋的呀。”"]]}, {"t": "p", "s": [["c12-015", "“那小女孩就是一种蛇！”"], ["c12-016", "鸽子说完，生气地飞回了窝里。"]]}, {"t": "p", "s": [["c12-017", "爱丽丝小心地这边咬一点儿，那边咬一点儿，终于变回了原来的高矮。"]]}]}, {"title": "第十三章　公爵夫人的厨房", "head": "c13-h", "audio": "audio/ch13.m4a?v=794eb4d950", "duration": 175.222, "times": {"c13-h": [0.0, 2.968], "c13-001": [3.968, 8.401], "c13-002": [8.751, 12.399], "c13-003": [12.749, 16.319], "c13-004": [17.169, 22.567], "c13-005": [22.917, 25.7], "c13-006": [26.05, 28.104], "c13-007": [28.954, 36.81], "c13-008": [37.16, 43.043], "c13-009": [43.393, 47.488], "c13-010": [48.338, 50.282], "c13-011": [50.632, 53.766], "c13-012": [54.116, 58.46], "c13-013": [58.81, 63.429], "c13-014": [64.279, 64.886], "c13-015": [65.236, 67.084], "c13-016": [67.434, 68.171], "c13-017": [68.521, 69.995], "c13-018": [70.345, 74.254], "c13-019": [74.604, 78.908], "c13-020": [79.758, 82.526], "c13-021": [82.876, 83.871], "c13-022": [84.721, 88.6], "c13-023": [89.45, 98.075], "c13-024": [98.425, 101.146], "c13-025": [101.996, 104.518], "c13-026": [104.868, 106.348], "c13-027": [107.198, 112.056], "song-sneeze-lullaby": [113.256, 119.256], "song-sneeze-lullaby-01": [119.256, 124.476], "song-sneeze-lullaby-02": [124.636, 129.096], "song-sneeze-lullaby-03": [129.656, 134.096], "song-sneeze-lullaby-04": [134.096, 139.476], "song-sneeze-lullaby-05": [139.756, 144.076], "song-sneeze-lullaby-06": [144.516, 149.096], "song-sneeze-lullaby-07": [149.096, 154.136], "song-sneeze-lullaby-08": [154.136, 159.056], "c13-028": [165.256, 170.142], "c13-029": [170.492, 172.237], "c13-030": [172.587, 173.722]}, "blocks": [{"t": "p", "s": [["c13-001", "爱丽丝走着走着，看见了一座四尺高的小房子。"], ["c13-002", "她想：“我这么大，会把里面的人吓坏的。”"], ["c13-003", "于是又咬了一口蘑菇，变成了九寸高。"]]}, {"t": "img", "src": "images/74.webp?v=2f0b0f87d8", "vid": "images/74.mp4?v=caf45f5b8c", "cap": "鱼脸仆人和青蛙脸仆人", "n": 42}, {"t": "p", "s": [["c13-004", "这时，一个长着鱼脸的仆人从树林里跑过来，“砰砰砰”地敲门。"], ["c13-005", "开门的是一个长着青蛙脸的仆人。"], ["c13-006", "他们都戴着卷卷的假发。"]]}, {"t": "p", "s": [["c13-007", "鱼仆人拿出一封和他自己一样大的信，一本正经地说：“王后请公爵夫人去打槌球。”"], ["c13-008", "青蛙仆人也一本正经地说：“公爵夫人接受王后的邀请去打槌球。”"], ["c13-009", "两个仆人鞠躬鞠得太低，假发都缠在了一起。"]]}, {"t": "img", "src": "images/75.webp?v=f7134fa175", "vid": "images/75.mp4?v=35f0257f21", "cap": "烟雾腾腾的胡椒厨房", "n": 43}, {"t": "p", "s": [["c13-010", "爱丽丝推门走了进去。"], ["c13-011", "屋里是一间大厨房，烟雾腾腾的。"], ["c13-012", "公爵夫人坐在中间的小凳子上，抱着一个小宝宝。"], ["c13-013", "厨娘正在炉子边搅一大锅汤，汤里放了太多胡椒。"]]}, {"t": "p", "s": [["c13-014", "“哈啾！”"], ["c13-015", "公爵夫人打了个喷嚏。"], ["c13-016", "“哈啾！”"], ["c13-017", "宝宝也打了个喷嚏。"], ["c13-018", "整个厨房里，只有厨娘和一只大猫不打喷嚏。"], ["c13-019", "那只猫趴在炉边，咧着嘴，一直笑嘻嘻的。"]]}, {"t": "p", "s": [["c13-020", "“请问，你的猫为什么这样笑？”"], ["c13-021", "爱丽丝问。"]]}, {"t": "p", "s": [["c13-022", "公爵夫人说：“它是柴郡猫，所以它会笑。”"]]}, {"t": "img", "src": "images/76.webp?v=76fb06a34e", "vid": "images/76.mp4?v=160b83a364", "cap": "厨娘把锅碗瓢盆往外扔", "n": 44}, {"t": "p", "s": [["c13-023", "厨娘忽然把炉子边的东西一件件往外扔：火钳、平底锅、盘子、碟子，乒乒乓乓地飞过来。"], ["c13-024", "公爵夫人好像一点儿也没看见。"]]}, {"t": "p", "s": [["c13-025", "“哎呀，小心宝宝的鼻子！”"], ["c13-026", "爱丽丝急得直叫。"]]}, {"t": "p", "s": [["c13-027", "公爵夫人一边摇宝宝，一边唱起了一首古怪的摇篮曲。"]]}, {"t": "song", "title": "哈啾摇篮曲", "head": "song-sneeze-lullaby", "lines": [["song-sneeze-lullaby-01", "小宝宝，快睡觉"], ["song-sneeze-lullaby-02", "胡椒多，汤也香"], ["song-sneeze-lullaby-03", "厨房里，烟腾腾"], ["song-sneeze-lullaby-04", "不许哭来不许闹"], ["song-sneeze-lullaby-05", "摇呀摇，哈啾"], ["song-sneeze-lullaby-06", "晃呀晃，哈啾"], ["song-sneeze-lullaby-07", "小宝宝，快睡觉"], ["song-sneeze-lullaby-08", "哈，哈，哈啾"]]}, {"t": "p", "s": [["c13-028", "唱完，她把宝宝往爱丽丝怀里一扔：“给你，你来抱一会儿吧！"], ["c13-029", "我要去准备跟王后打槌球了！”"], ["c13-030", "说完就走了。"]]}]}, {"title": "第十四章　小猪宝宝", "head": "c14-h", "audio": "audio/ch14.m4a?v=64e8a7da50", "duration": 47.952, "times": {"c14-h": [0.0, 2.423], "c14-001": [3.423, 5.734], "c14-002": [6.084, 9.037], "c14-003": [9.887, 14.006], "c14-004": [14.856, 16.766], "c14-005": [17.116, 27.274], "c14-006": [28.124, 31.368], "c14-007": [32.218, 37.582], "c14-008": [37.932, 46.452]}, "blocks": [{"t": "p", "s": [["c14-001", "爱丽丝抱着宝宝走出了房子。"], ["c14-002", "宝宝哼哼唧唧的，一直扭来扭去。"]]}, {"t": "p", "s": [["c14-003", "爱丽丝说：“别哼哼，这可不是表达意思的好办法。”"]]}, {"t": "img", "src": "images/77.webp?v=dc5e32a276", "vid": "images/77.mp4?v=55c6c5753a", "cap": "怀里的宝宝越看越像一只小猪", "n": 45}, {"t": "p", "s": [["c14-004", "宝宝又哼了一声。"], ["c14-005", "爱丽丝低头一看，宝宝的鼻子往上翘着，越看越像一个小猪鼻子；眼睛也越来越小，根本不像小宝宝的眼睛。"]]}, {"t": "p", "s": [["c14-006", "再一看，怀里的竟然是一只小猪！"]]}, {"t": "img", "src": "images/78.webp?v=a2d7e98505", "vid": "images/78.mp4?v=991641255d", "cap": "小猪一溜小跑钻进了树林", "n": 46}, {"t": "p", "s": [["c14-007", "爱丽丝把小猪放到地上，小猪就一溜小跑，钻进了树林里。"], ["c14-008", "爱丽丝想：“它要是长大了，会是一个很难看的孩子；可是做一只小猪，倒是挺漂亮的。”"]]}]}, {"title": "第十五章　柴郡猫", "head": "c15-h", "audio": "audio/ch15.m4a?v=1e104ff367", "duration": 118.088, "times": {"c15-h": [0.0, 2.227], "c15-001": [3.227, 11.044], "c15-002": [11.894, 15.824], "c15-003": [16.674, 18.078], "c15-004": [18.428, 19.123], "c15-005": [19.973, 21.13], "c15-006": [21.48, 22.521], "c15-007": [23.371, 26.049], "c15-008": [26.399, 30.758], "c15-009": [31.108, 34.198], "c15-010": [35.048, 38.018], "c15-011": [38.368, 39.409], "c15-012": [40.259, 43.276], "c15-013": [43.626, 45.374], "c15-014": [46.224, 47.783], "c15-015": [48.133, 49.128], "c15-016": [49.978, 53.455], "c15-017": [54.305, 57.203], "c15-018": [58.053, 61.746], "c15-019": [62.096, 63.137], "c15-020": [63.987, 65.452], "c15-021": [65.802, 68.586], "c15-022": [69.436, 75.408], "c15-023": [76.258, 77.847], "c15-024": [78.197, 79.239], "c15-025": [80.089, 81.174], "c15-026": [81.524, 83.381], "c15-027": [84.231, 91.44], "c15-028": [92.29, 92.704], "c15-029": [93.054, 93.749], "c15-030": [94.599, 97.43], "c15-031": [100.713, 110.304], "c15-032": [111.154, 116.588]}, "blocks": [{"t": "img", "src": "images/26.webp?v=66188890d3", "vid": "images/26.mp4?v=4a5e5a4ccd", "cap": "树枝上笑嘻嘻的大猫", "n": 47}, {"t": "p", "s": [["c15-001", "爱丽丝继续往前走，忽然看见树枝上坐着一只大猫，它咧着嘴，一直笑嘻嘻的。"]]}, {"t": "p", "s": [["c15-002", "爱丽丝说：“请问，我应该走哪条路呢？”"]]}, {"t": "p", "s": [["c15-003", "“那要看你想去哪儿了。”"], ["c15-004", "猫说。"]]}, {"t": "p", "s": [["c15-005", "“去哪儿都行。”"], ["c15-006", "爱丽丝说。"]]}, {"t": "img", "src": "images/27.webp?v=b38a09ccb5", "vid": "images/27.mp4?v=31fc73b51e", "cap": "往这边走，往那边走", "n": 48}, {"t": "p", "s": [["c15-007", "猫笑着说：“那你走哪条路都行。"], ["c15-008", "往这边走，住着一个帽匠；往那边走，住着一只三月兔。"], ["c15-009", "随便你去拜访谁，反正他们两个都是疯子。”"]]}, {"t": "p", "s": [["c15-010", "“可是我不想到疯子那里去。”"], ["c15-011", "爱丽丝说。"]]}, {"t": "p", "s": [["c15-012", "猫说：“这可没办法，我们这里谁都是疯子。"], ["c15-013", "我是疯子，你也是疯子。”"]]}, {"t": "p", "s": [["c15-014", "“你怎么知道我是疯子？”"], ["c15-015", "爱丽丝问。"]]}, {"t": "p", "s": [["c15-016", "猫说：“你一定是，不然你就不会到这儿来了。”"]]}, {"t": "p", "s": [["c15-017", "猫又问：“你今天去跟王后打槌球吗？”"]]}, {"t": "p", "s": [["c15-018", "“我很想去，可是还没人请我。”"], ["c15-019", "爱丽丝说。"]]}, {"t": "p", "s": [["c15-020", "“你会在那里见到我的。”"], ["c15-021", "猫说完，一下子就不见了。"]]}, {"t": "p", "s": [["c15-022", "爱丽丝正往那棵树看着，猫又一下子出现了：“对了，那个宝宝怎么样了？”"]]}, {"t": "p", "s": [["c15-023", "“它变成一只小猪了。”"], ["c15-024", "爱丽丝说。"]]}, {"t": "p", "s": [["c15-025", "“我就知道会这样。”"], ["c15-026", "猫说完，又不见了。"]]}, {"t": "p", "s": [["c15-027", "爱丽丝说：“请你别这样一下子出现、一下子消失的，弄得人头都晕了。”"]]}, {"t": "p", "s": [["c15-028", "“好吧。”"], ["c15-029", "猫说。"]]}, {"t": "img", "src": "images/28.webp?v=d0cec72e39", "vid": "images/28.mp4?v=61e45df06b", "cap": "只剩下一张笑嘴", "n": 49}, {"t": "p", "s": [["c15-030", "说完，柴郡猫慢慢地消失了。"], ["c15-031", "先是尾巴尖不见了，接着身子不见了，最后只剩下一张咧着的笑嘴，挂在树枝上，过了好一会儿才不见。"]]}, {"t": "p", "s": [["c15-032", "爱丽丝想：“我见过不笑的猫，可是从来没见过没有猫的笑！”"]]}]}, {"title": "第十六章　疯狂的茶会", "head": "c16-h", "audio": "audio/ch16.m4a?v=ca330ef858", "duration": 102.035, "times": {"c16-h": [0.0, 2.855], "c16-001": [3.855, 8.148], "c16-002": [8.498, 15.324], "c16-003": [19.775, 20.436], "c16-004": [20.786, 21.447], "c16-005": [21.797, 24.592], "c16-006": [25.442, 26.686], "c16-007": [27.036, 31.344], "c16-008": [32.194, 36.749], "c16-009": [37.599, 40.961], "c16-010": [41.311, 44.19], "c16-011": [45.04, 47.337], "c16-012": [47.687, 48.922], "c16-013": [49.772, 50.298], "c16-014": [50.648, 51.69], "c16-015": [52.54, 54.78], "c16-016": [55.13, 56.194], "c16-017": [57.044, 64.24], "c16-018": [65.09, 67.605], "c16-019": [67.955, 73.336], "c16-020": [74.186, 80.606], "c16-021": [80.956, 82.894], "c16-022": [83.744, 86.524], "c16-023": [86.874, 89.946], "c16-024": [90.796, 92.378], "c16-025": [92.728, 93.791], "c16-026": [94.141, 100.535]}, "blocks": [{"t": "img", "src": "images/29.webp?v=28317b34f9", "vid": "images/29.mp4?v=3ee5683cf6", "cap": "大树下的长桌子", "n": 50}, {"t": "img", "src": "images/30.webp?v=5ddcb1aa79", "vid": "images/30.mp4?v=abce2dfe42", "cap": "疯帽子、三月兔和睡鼠", "n": 51}, {"t": "p", "s": [["c16-001", "三月兔家门前的大树下，摆着一张长长的桌子。"], ["c16-002", "三月兔和疯帽子坐在桌边喝茶，一只睡鼠夹在他们中间，呼呼地睡着大觉。"]]}, {"t": "p", "s": [["c16-003", "“没地方了！"], ["c16-004", "没地方了！”"], ["c16-005", "他们一看见爱丽丝，就大声嚷嚷。"]]}, {"t": "img", "src": "images/31.webp?v=ed784e475f", "vid": "images/31.mp4?v=dd32d900fd", "cap": "爱丽丝在大扶手椅上坐下", "n": 52}, {"t": "p", "s": [["c16-006", "“地方多着呢！”"], ["c16-007", "爱丽丝生气地说，在一张大扶手椅上坐了下来。"]]}, {"t": "img", "src": "images/32.webp?v=c8ce64e4cd", "vid": "images/32.mp4?v=073ffe7b13", "cap": "乌鸦为什么像写字台？", "n": 53}, {"t": "p", "s": [["c16-008", "疯帽子看了爱丽丝半天，问：“乌鸦为什么像写字台？”"]]}, {"t": "p", "s": [["c16-009", "爱丽丝想：“太好了，要猜谜语了！”"], ["c16-010", "她说：“我想我能猜出来。”"]]}, {"t": "p", "s": [["c16-011", "“你的意思是说，你能找到答案？”"], ["c16-012", "三月兔问。"]]}, {"t": "p", "s": [["c16-013", "“对呀。”"], ["c16-014", "爱丽丝说。"]]}, {"t": "p", "s": [["c16-015", "“那你就应该说你想说的话。”"], ["c16-016", "三月兔说。"]]}, {"t": "p", "s": [["c16-017", "爱丽丝说：“我是这样做的呀，至少，我说的就是我想的，这是一回事。”"]]}, {"t": "p", "s": [["c16-018", "疯帽子说：“根本不是一回事！"], ["c16-019", "那你也可以说，‘我吃我看见的东西’，跟‘我看见我吃的东西’是一回事了？”"]]}, {"t": "img", "src": "images/79.webp?v=c77e64cf3c", "vid": "images/79.mp4?v=b85481ce7c", "cap": "疯帽子的怀表：黄油不能放进表里修", "n": 54}, {"t": "p", "s": [["c16-020", "疯帽子掏出一块怀表，摇了摇，又放到耳边听了听，问：“今天几号？”"], ["c16-021", "爱丽丝说：“四号。”"]]}, {"t": "p", "s": [["c16-022", "疯帽子叹气说：“慢了两天！"], ["c16-023", "我早就告诉过你，黄油不能放进表里修！”"]]}, {"t": "p", "s": [["c16-024", "“那可是最好的黄油呀。”"], ["c16-025", "三月兔说。"], ["c16-026", "他把表放进茶杯里蘸了蘸，又看了看，还是只会说：“那可是最好的黄油呀。”"]]}]}, {"title": "第十七章　永远六点钟", "head": "c17-h", "audio": "audio/ch17.m4a?v=f98b1f3857", "duration": 135.34, "times": {"c17-h": [0.0, 2.702], "c17-001": [3.702, 8.713], "c17-002": [9.563, 10.296], "c17-003": [10.646, 11.703], "c17-004": [12.053, 12.919], "c17-005": [13.269, 14.333], "c17-006": [15.183, 22.326], "c17-007": [23.176, 28.373], "c17-008": [28.723, 38.236], "song-twinkle-bat": [39.436, 45.436], "song-twinkle-bat-01": [45.436, 50.416], "song-twinkle-bat-02": [50.416, 55.736], "song-twinkle-bat-03": [55.736, 60.096], "song-twinkle-bat-04": [60.096, 65.316], "song-twinkle-bat-05": [65.316, 69.596], "song-twinkle-bat-06": [70.416, 74.876], "c17-009": [81.076, 82.358], "c17-010": [82.708, 83.749], "c17-011": [84.599, 89.939], "c17-012": [90.289, 91.471], "c17-013": [92.321, 98.73], "c17-014": [99.08, 110.494], "c17-015": [111.344, 114.037], "c17-016": [114.387, 115.382], "c17-017": [116.232, 120.458], "c17-018": [120.808, 122.249], "c17-019": [123.099, 125.164], "c17-020": [125.514, 127.084], "c17-021": [127.934, 128.996], "c17-022": [129.346, 130.799], "c17-023": [131.149, 133.84]}, "blocks": [{"t": "p", "s": [["c17-001", "爱丽丝想了很久，说：“我猜不出来，答案是什么？”"]]}, {"t": "p", "s": [["c17-002", "“我也不知道。”"], ["c17-003", "疯帽子说。"], ["c17-004", "“我也不知道。”"], ["c17-005", "三月兔说。"]]}, {"t": "p", "s": [["c17-006", "爱丽丝叹了口气：“你们与其问一些没有答案的谜语，浪费时间，还不如做点儿别的事。”"]]}, {"t": "img", "src": "images/80.webp?v=7d6a42661e", "vid": "images/80.mp4?v=a63aae8e38", "cap": "疯帽子在王后的音乐会上唱歌", "n": 55}, {"t": "p", "s": [["c17-007", "疯帽子说：“你要是像我一样认识时间老人，就不会说浪费它了。"], ["c17-008", "去年三月，红心王后开了一场音乐会，我在会上唱歌，唱的是：‘一闪一闪小蝙蝠，我想知道你在忙什么……’”"]]}, {"t": "song", "title": "一闪一闪小蝙蝠", "head": "song-twinkle-bat", "lines": [["song-twinkle-bat-01", "一闪一闪小蝙蝠"], ["song-twinkle-bat-02", "我想知道你在忙什么"], ["song-twinkle-bat-03", "高高飞在天空里"], ["song-twinkle-bat-04", "像个茶盘飘呀飘"], ["song-twinkle-bat-05", "一闪一闪小蝙蝠"], ["song-twinkle-bat-06", "我想知道你在忙什么"]]}, {"t": "p", "s": [["c17-009", "“这首歌我听过。”"], ["c17-010", "爱丽丝说。"]]}, {"t": "p", "s": [["c17-011", "疯帽子说：“我还没唱完第一段，王后就大叫：‘他在浪费时间！"], ["c17-012", "砍掉他的头！’”"]]}, {"t": "img", "src": "images/33.webp?v=3f7d8a88de", "vid": "images/33.mp4?v=9277f9ebef", "cap": "永远都是下午六点", "n": 56}, {"t": "p", "s": [["c17-013", "原来，从那以后，时间老人就生了疯帽子的气，再也不肯听他的话了。"], ["c17-014", "疯帽子的时间永远停在了下午六点，永远都是喝下午茶的时候，所以他们只好一直喝茶，喝完了就往旁边挪一个座位，换一套新茶杯。"]]}, {"t": "p", "s": [["c17-015", "“那你们转回到开头的时候怎么办呢？”"], ["c17-016", "爱丽丝问。"]]}, {"t": "p", "s": [["c17-017", "三月兔打着哈欠说：“我们换个话题吧，我听烦了。"], ["c17-018", "让这位小姑娘讲个故事。”"]]}, {"t": "p", "s": [["c17-019", "“我恐怕一个故事也不会。”"], ["c17-020", "爱丽丝有点儿着急。"]]}, {"t": "img", "src": "images/81.webp?v=d23ce963c8", "vid": "images/81.mp4?v=9b534b5747", "cap": "“醒醒，睡鼠！”", "n": 57}, {"t": "p", "s": [["c17-021", "“那就让睡鼠讲！"], ["c17-022", "醒醒，睡鼠！”"], ["c17-023", "他们一边一个，捏了捏睡鼠。"]]}]}, {"title": "第十八章　睡鼠讲故事", "head": "c18-h", "audio": "audio/ch18.m4a?v=06ca3e49c1", "duration": 87.508, "times": {"c18-h": [0.0, 2.652], "c18-001": [3.652, 11.572], "c18-002": [12.422, 13.628], "c18-003": [13.978, 16.714], "c18-004": [17.564, 21.291], "c18-005": [22.141, 26.635], "c18-006": [27.485, 30.359], "c18-007": [30.709, 31.826], "c18-008": [32.676, 35.626], "c18-009": [35.976, 37.077], "c18-010": [37.927, 42.222], "c18-011": [43.072, 44.535], "c18-012": [44.885, 50.085], "c18-013": [50.435, 55.21], "c18-014": [56.06, 60.985], "c18-015": [61.835, 72.837], "c18-016": [73.187, 77.369], "c18-017": [78.219, 80.722], "c18-018": [81.072, 86.008]}, "blocks": [{"t": "img", "src": "images/82.webp?v=e99e5634ab", "vid": "images/82.mp4?v=ee1aaa5a6e", "cap": "睡鼠讲糖浆井里的三姐妹", "n": 58}, {"t": "p", "s": [["c18-001", "睡鼠慢慢地睁开眼睛，用沙哑的声音说：“从前，有三个小姐妹，她们住在一口井的井底。”"]]}, {"t": "p", "s": [["c18-002", "“她们吃什么呢？”"], ["c18-003", "爱丽丝总是对吃的东西很感兴趣。"]]}, {"t": "p", "s": [["c18-004", "睡鼠想了一两分钟，说：“她们吃糖浆。”"]]}, {"t": "p", "s": [["c18-005", "爱丽丝说：“那可不行，光吃糖浆会生病的。”"]]}, {"t": "p", "s": [["c18-006", "“对，所以她们都病了，病得很厉害。”"], ["c18-007", "睡鼠说。"]]}, {"t": "p", "s": [["c18-008", "“那她们为什么要住在井底下呢？”"], ["c18-009", "爱丽丝又问。"]]}, {"t": "p", "s": [["c18-010", "睡鼠又想了一两分钟，说：“那是一口糖浆井。”"]]}, {"t": "p", "s": [["c18-011", "“哪有糖浆井！”"], ["c18-012", "爱丽丝刚要生气，疯帽子和三月兔就“嘘、嘘”地让她安静。"], ["c18-013", "睡鼠也不高兴地说：“你要是这么没礼貌，就自己把故事讲完吧。”"]]}, {"t": "p", "s": [["c18-014", "爱丽丝说：“对不起，请你讲下去吧，我再也不打岔了。”"]]}, {"t": "p", "s": [["c18-015", "睡鼠接着说：“三个小姐妹在井里学画画，她们画各种各样的东西，凡是用‘毛’字开头的东西都画：毛毛虫、毛线团、毛毛雨……”"], ["c18-016", "说着说着，它的眼睛又闭上了，打起了呼噜。"]]}, {"t": "img", "src": "images/34.webp?v=15380e6fc5", "vid": "images/34.mp4?v=f010920655", "cap": "把睡鼠塞进茶壶里", "n": 59}, {"t": "p", "s": [["c18-017", "他们还想把睡鼠塞进茶壶里。"], ["c18-018", "爱丽丝觉得这是她参加过的最傻的茶会，就起身走开了。"]]}]}, {"title": "第十九章　王后的花园", "head": "c19-h", "audio": "audio/ch19.m4a?v=ec0338a511", "duration": 64.04, "times": {"c19-h": [0.0, 2.659], "c19-001": [3.659, 6.374], "c19-002": [6.724, 10.19], "c19-003": [10.54, 19.487], "c19-004": [20.337, 24.662], "c19-005": [25.012, 30.105], "c19-006": [30.955, 32.059], "c19-007": [32.41, 33.727], "c19-008": [34.078, 35.405], "c19-009": [35.755, 39.519], "c19-010": [40.369, 42.228], "c19-011": [42.578, 43.573], "c19-012": [44.423, 49.448], "c19-013": [49.798, 52.471], "c19-014": [53.321, 56.664], "c19-015": [57.014, 57.888], "c19-016": [58.238, 62.54]}, "blocks": [{"t": "img", "src": "images/35.webp?v=3cb81ec9a8", "vid": "images/35.mp4?v=4f260e221b", "cap": "树上的一扇门", "n": 60}, {"t": "p", "s": [["c19-001", "爱丽丝在一棵树上发现了一扇门。"], ["c19-002", "她走进去，又回到了那个长长的大厅。"], ["c19-003", "这一次，她吃了一点儿蘑菇，变得正好一尺高，用金钥匙打开小门，终于走进了那座美丽的花园。"]]}, {"t": "img", "src": "images/36.webp?v=2b17dec672", "vid": "images/36.mp4?v=cfccfbe760", "cap": "把白玫瑰涂成红色", "n": 61}, {"t": "p", "s": [["c19-004", "花园门口有一棵大玫瑰树，开着白色的玫瑰花。"], ["c19-005", "三个扑克牌园丁正忙着，用刷子把白玫瑰涂成红色。"]]}, {"t": "p", "s": [["c19-006", "“小心点儿，老五！"], ["c19-007", "别把颜料溅到我身上！”"], ["c19-008", "一个园丁说。"], ["c19-009", "老五说：“又不怪我，是老七碰了我的胳膊肘。”"]]}, {"t": "p", "s": [["c19-010", "“你们为什么要涂玫瑰呀？”"], ["c19-011", "爱丽丝问。"]]}, {"t": "p", "s": [["c19-012", "黑桃二小声说：“嘘，这里本来应该种红玫瑰，我们种错了。"], ["c19-013", "要是被王后发现，我们的脑袋就保不住了！”"]]}, {"t": "img", "src": "images/83.webp?v=f4db32fc3f", "vid": "images/83.mp4?v=1e6ad9ec2b", "cap": "“王后来了！”园丁们赶紧趴下", "n": 62}, {"t": "p", "s": [["c19-014", "这时，老五紧张地喊起来：“王后！"], ["c19-015", "王后来了！”"], ["c19-016", "三个园丁马上脸朝下，扑通一声趴在了地上。"]]}]}, {"title": "第二十章　红心王后", "head": "c20-h", "audio": "audio/ch20.m4a?v=3a185cbc6e", "duration": 117.142, "times": {"c20-h": [0.0, 2.526], "c20-001": [3.526, 9.001], "c20-002": [9.851, 20.669], "c20-003": [21.019, 28.806], "c20-004": [29.156, 34.417], "c20-005": [34.767, 38.567], "c20-006": [39.417, 42.109], "c20-007": [42.459, 46.838], "c20-008": [47.688, 49.816], "c20-009": [50.166, 57.238], "c20-010": [58.088, 62.666], "c20-011": [63.016, 69.79], "c20-012": [70.64, 72.94], "c20-013": [73.29, 74.599], "c20-014": [75.449, 79.903], "c20-015": [80.753, 81.421], "c20-016": [81.771, 83.25], "c20-017": [83.6, 86.681], "c20-018": [87.031, 92.947], "c20-019": [93.797, 100.213], "c20-020": [100.563, 104.778], "c20-021": [105.628, 107.16], "c20-022": [107.51, 111.463], "c20-023": [111.813, 115.642]}, "blocks": [{"t": "img", "src": "images/37.webp?v=eee38a1621", "vid": "images/37.mp4?v=cc997b18d0", "cap": "国王和王后来了", "n": 63}, {"t": "p", "s": [["c20-001", "就在这时，一队扑克牌士兵走了过来，后面跟着国王和王后。"]]}, {"t": "img", "src": "images/84.webp?v=ec66fbacb1", "vid": "images/84.mp4?v=6e0736227a", "cap": "红心杰克托着王冠，走在队伍里", "n": 64}, {"t": "p", "s": [["c20-002", "最前面是十个拿着棍子的梅花士兵，接着是十个浑身戴着钻石的方块侍臣，再后面是十个蹦蹦跳跳的红心小王子和小公主。"], ["c20-003", "客人们大多是国王和王后，爱丽丝还在里面认出了白兔子，它正紧张地东张西望。"], ["c20-004", "接着是红心杰克，他用红丝绒垫子托着国王的王冠。"], ["c20-005", "走在最后的，就是红心国王和红心王后。"]]}, {"t": "img", "src": "images/38.webp?v=0264f9a60c", "vid": "images/38.mp4?v=171a2fd09d", "cap": "你叫什么名字？", "n": 65}, {"t": "p", "s": [["c20-006", "队伍走到爱丽丝面前，停了下来。"], ["c20-007", "红心王后看见了爱丽丝，大声问：“你叫什么名字？”"]]}, {"t": "p", "s": [["c20-008", "“回禀陛下，我叫爱丽丝。”"], ["c20-009", "爱丽丝很有礼貌地回答，心里却想：“哼，他们不过是一副纸牌，我才不怕呢！”"]]}, {"t": "p", "s": [["c20-010", "王后指着趴在玫瑰树下的三个园丁问：“那他们是谁？”"], ["c20-011", "园丁们背朝上趴着，背上的花纹和一副牌里别的牌一模一样，谁也认不出来。"]]}, {"t": "p", "s": [["c20-012", "爱丽丝说：“我怎么知道？"], ["c20-013", "这又不关我的事。”"]]}, {"t": "p", "s": [["c20-014", "王后气得满脸通红，大叫起来：“砍掉她的头！”"]]}, {"t": "p", "s": [["c20-015", "“胡说！”"], ["c20-016", "爱丽丝大声说。"], ["c20-017", "王后一下子愣住了，不说话了。"], ["c20-018", "国王拉了拉王后的胳膊，轻轻地说：“亲爱的，她还只是个孩子呢。”"]]}, {"t": "p", "s": [["c20-019", "王后转过身，又发现了涂了一半的玫瑰，气得大喊：“砍掉他们的头！”"], ["c20-020", "三个园丁吓得直哆嗦，跑过来求爱丽丝救命。"]]}, {"t": "img", "src": "images/85.webp?v=a0df613c0b", "vid": "images/85.mp4?v=4bb45bbac1", "cap": "爱丽丝把园丁藏进大花盆", "n": 66}, {"t": "p", "s": [["c20-021", "“你们不会被砍头的！”"], ["c20-022", "爱丽丝说着，把他们藏进了旁边的一个大花盆里。"], ["c20-023", "士兵们找来找去，没找着，只好走开了。"]]}]}, {"title": "第二十一章　王后的槌球比赛", "head": "c21-h", "audio": "audio/ch21.m4a?v=d9cba239a6", "duration": 107.303, "times": {"c21-h": [0.0, 3.426], "c21-001": [4.426, 5.858], "c21-002": [6.208, 7.222], "c21-003": [8.072, 8.618], "c21-004": [8.968, 10.009], "c21-005": [10.359, 13.572], "c21-006": [14.422, 17.342], "c21-007": [17.692, 27.456], "c21-008": [28.306, 36.929], "c21-009": [37.279, 41.061], "c21-010": [41.911, 45.926], "c21-011": [46.276, 51.462], "c21-012": [51.812, 53.063], "c21-013": [53.913, 59.068], "c21-014": [59.418, 62.205], "c21-015": [63.055, 68.987], "c21-016": [69.337, 78.625], "c21-017": [79.475, 83.022], "c21-018": [83.372, 86.131], "c21-019": [86.481, 91.584], "c21-020": [92.434, 98.113], "c21-021": [98.463, 101.043], "c21-022": [101.393, 105.803]}, "blocks": [{"t": "p", "s": [["c21-001", "“你会打槌球吗？”"], ["c21-002", "王后大喊。"]]}, {"t": "p", "s": [["c21-003", "“会！”"], ["c21-004", "爱丽丝说。"], ["c21-005", "于是，她参加了王后的槌球比赛。"]]}, {"t": "img", "src": "images/39.webp?v=926006580e", "vid": "images/39.mp4?v=6096f8f5f1", "cap": "最奇怪的槌球比赛", "n": 67}, {"t": "p", "s": [["c21-006", "这真是世界上最奇怪的槌球比赛。"], ["c21-007", "球是一只只活刺猬，球棒是一只只活的火烈鸟，扑克牌士兵弯下腰，手脚撑在地上，就是球门。"]]}, {"t": "img", "src": "images/40.webp?v=c9e06d006b", "vid": "images/40.mp4?v=d3ab3a3862", "cap": "火烈鸟扭过脖子看着她", "n": 68}, {"t": "p", "s": [["c21-008", "爱丽丝刚把火烈鸟夹在胳膊底下，准备击球，火烈鸟就扭过长脖子，一脸奇怪地看着她。"], ["c21-009", "刺猬也不老实，一会儿就慢慢地爬走了。"]]}, {"t": "img", "src": "images/41.webp?v=253518bfa2", "vid": "images/41.mp4?v=dcec853937", "cap": "砍掉他的头！", "n": 69}, {"t": "p", "s": [["c21-010", "大家都不按顺序打，吵吵嚷嚷，乱成一团。"], ["c21-011", "王后气得直跺脚，每过一会儿就大叫一声：“砍掉他的头！"], ["c21-012", "砍掉她的头！”"]]}, {"t": "img", "src": "images/42.webp?v=c9b836061d", "vid": "images/42.mp4?v=d19607a4a2", "cap": "你们都被赦免了", "n": 70}, {"t": "p", "s": [["c21-013", "可是，国王总是悄悄地对大家说：“你们都被赦免了。”"], ["c21-014", "所以，其实一个人也没有被砍头。"]]}, {"t": "img", "src": "images/43.webp?v=aad5bc31ae", "vid": "images/43.mp4?v=9378bfb2e7", "cap": "柴郡猫的大脑袋出现在半空中", "n": 71}, {"t": "p", "s": [["c21-015", "这时，柴郡猫的大脑袋忽然出现在半空中，笑嘻嘻地看着大家。"], ["c21-016", "国王和王后吵着要砍掉它的头，可是它只有一个脑袋，没有身子，刽子手怎么也想不出该从哪里下手。"]]}, {"t": "p", "s": [["c21-017", "刽子手说，没有身子的头，没法砍。"], ["c21-018", "国王说，只要有头，就能砍。"], ["c21-019", "王后说，谁要是再不想办法，就把所有人的头都砍掉。"]]}, {"t": "p", "s": [["c21-020", "爱丽丝想了想，说：“这只猫是公爵夫人的，你们最好去问问她。”"], ["c21-021", "刽子手马上跑去找公爵夫人。"], ["c21-022", "可是他还没回来，柴郡猫的大脑袋就慢慢地消失了。"]]}]}, {"title": "第二十二章　什么都有寓意", "head": "c22-h", "audio": "audio/ch22.m4a?v=ca1a188b16", "duration": 79.158, "times": {"c22-h": [0.0, 2.735], "c22-001": [3.735, 5.059], "c22-002": [5.409, 8.799], "c22-003": [9.149, 13.665], "c22-004": [14.515, 19.041], "c22-005": [19.392, 22.71], "c22-006": [23.56, 31.419], "c22-007": [32.269, 34.228], "c22-008": [34.578, 35.619], "c22-009": [36.469, 38.881], "c22-010": [39.231, 41.634], "c22-011": [42.484, 48.362], "c22-012": [48.712, 53.428], "c22-013": [54.278, 58.428], "c22-014": [58.778, 66.143], "c22-015": [66.993, 75.05], "c22-016": [75.4, 77.658]}, "blocks": [{"t": "img", "src": "images/86.webp?v=560251871f", "vid": "images/86.mp4?v=01a0717378", "cap": "公爵夫人挽着爱丽丝散步", "n": 72}, {"t": "p", "s": [["c22-001", "公爵夫人来了。"], ["c22-002", "她亲热地挽着爱丽丝的胳膊，一起散步。"], ["c22-003", "爱丽丝发现，她比在胡椒厨房里时快活多了。"]]}, {"t": "p", "s": [["c22-004", "爱丽丝想：“说不定，就是胡椒让人脾气变坏的。"], ["c22-005", "醋让人变酸，糖让小孩子变甜。”"]]}, {"t": "p", "s": [["c22-006", "公爵夫人说：“你在想事情，亲爱的，所以忘了说话，这件事的寓意是什么，我现在还说不上来，不过待会儿一定能想起来。”"]]}, {"t": "p", "s": [["c22-007", "“说不定它没有寓意呢。”"], ["c22-008", "爱丽丝说。"]]}, {"t": "p", "s": [["c22-009", "公爵夫人说：“胡说，孩子！"], ["c22-010", "什么事都有寓意，只要你能找得到。”"]]}, {"t": "p", "s": [["c22-011", "公爵夫人把尖尖的下巴靠在爱丽丝的肩膀上，硌得她好疼。"], ["c22-012", "她说一句话，就要讲一个寓意，说得爱丽丝头都晕了。"]]}, {"t": "img", "src": "images/87.webp?v=48a43b008d", "vid": "images/87.mp4?v=68f0534822", "cap": "王后抱着胳膊，脸色阴沉", "n": 73}, {"t": "p", "s": [["c22-013", "忽然，公爵夫人不说话了，浑身发抖。"], ["c22-014", "原来，红心王后抱着胳膊，站在她们面前，脸色像打雷前的天空一样阴沉。"]]}, {"t": "p", "s": [["c22-015", "王后跺着脚对公爵夫人说：“我警告你，要么你走开，要么你的头走开，马上选一个！”"], ["c22-016", "公爵夫人一溜烟地跑掉了。"]]}]}, {"title": "第二十三章　假海龟的故事", "head": "c23-h", "audio": "audio/ch23.m4a?v=3cbb7ec266", "duration": 127.712, "times": {"c23-h": [0.0, 3.272], "c23-001": [4.272, 7.572], "c23-002": [8.422, 11.286], "c23-003": [11.636, 12.677], "c23-004": [13.527, 17.378], "c23-005": [17.728, 23.182], "c23-006": [23.532, 27.552], "c23-007": [28.402, 32.156], "c23-008": [32.506, 36.574], "c23-009": [37.424, 44.054], "c23-010": [44.404, 46.956], "c23-011": [47.806, 55.76], "c23-012": [56.61, 58.442], "c23-013": [58.792, 59.787], "c23-014": [60.137, 65.268], "c23-015": [66.118, 71.718], "c23-016": [72.068, 75.365], "c23-017": [76.215, 83.192], "c23-018": [84.042, 88.427], "c23-019": [88.777, 90.052], "c23-020": [90.902, 92.843], "c23-021": [93.193, 94.188], "c23-022": [95.038, 99.41], "c23-023": [99.76, 101.321], "c23-024": [101.671, 103.983], "c23-025": [104.333, 105.034], "c23-026": [105.884, 108.35], "c23-027": [108.7, 109.695], "c23-028": [110.545, 114.75], "c23-029": [115.1, 116.257], "c23-030": [117.107, 118.24], "c23-031": [118.59, 119.632], "c23-032": [120.482, 126.212]}, "blocks": [{"t": "p", "s": [["c23-001", "王后问爱丽丝：“你见过假海龟没有？”"]]}, {"t": "p", "s": [["c23-002", "“没有，我连假海龟是什么都不知道。”"], ["c23-003", "爱丽丝说。"]]}, {"t": "p", "s": [["c23-004", "王后说：“那就是用来做假海龟汤的东西。”"], ["c23-005", "她叫醒了一只躺在太阳底下睡觉的鹰头狮：“懒家伙，起来！"], ["c23-006", "带这位小姑娘去看假海龟，听听他的故事！”"]]}, {"t": "img", "src": "images/44.webp?v=96511683ce", "vid": "images/44.mp4?v=ae32ef672f", "cap": "鹰头狮", "n": 74}, {"t": "p", "s": [["c23-007", "王后让鹰头狮带爱丽丝去见假海龟。"], ["c23-008", "鹰头狮长着老鹰的头和翅膀，狮子的身子。"]]}, {"t": "p", "s": [["c23-009", "鹰头狮坐起来，揉揉眼睛，看着王后走远，才咯咯地笑着说：“真好笑！"], ["c23-010", "其实谁也没有被砍头，你知道吗？”"]]}, {"t": "img", "src": "images/45.webp?v=9cf4cc1e37", "vid": "images/45.mp4?v=6a388d1f47", "cap": "眼泪汪汪的假海龟", "n": 75}, {"t": "p", "s": [["c23-011", "假海龟坐在海边的一块大石头上，长着一个小牛的脑袋，眼泪汪汪的，叹着长长的气。"]]}, {"t": "p", "s": [["c23-012", "“他为什么这么伤心呀？”"], ["c23-013", "爱丽丝问。"], ["c23-014", "鹰头狮说：“全是他自己想出来的，他其实一点儿也没有伤心的事。”"]]}, {"t": "p", "s": [["c23-015", "假海龟一边抽泣，一边说：“我小的时候，在海底的学校里上学。"], ["c23-016", "我们学的是读书、写字，还有慢吞吞地画画。”"]]}, {"t": "img", "src": "images/88.webp?v=ed9bdac3a5", "vid": "images/88.mp4?v=9ad3bb39bb", "cap": "假海龟在海底学校上学", "n": 76}, {"t": "p", "s": [["c23-017", "假海龟说：“我们的老师是一只老海龟，他讲课讲得特别特别慢，一句话要讲好半天。”"]]}, {"t": "p", "s": [["c23-018", "“我们还学算术，有加法、减法，还有丑法和哭法。”"], ["c23-019", "假海龟说。"]]}, {"t": "p", "s": [["c23-020", "“丑法和哭法是什么呀？”"], ["c23-021", "爱丽丝问。"]]}, {"t": "p", "s": [["c23-022", "鹰头狮惊讶地举起两只爪子：“你连丑法都没听说过？"], ["c23-023", "那你总知道什么叫美吧？"], ["c23-024", "把美的东西变丑，就是丑法呀！"], ["c23-025", "你可真笨！”"]]}, {"t": "p", "s": [["c23-026", "“那你们一天上几个钟头的课呢？”"], ["c23-027", "爱丽丝问。"]]}, {"t": "p", "s": [["c23-028", "“第一天十个钟头，第二天九个钟头，一天比一天少。”"], ["c23-029", "假海龟说。"]]}, {"t": "p", "s": [["c23-030", "“真奇怪！”"], ["c23-031", "爱丽丝说。"]]}, {"t": "p", "s": [["c23-032", "鹰头狮解释说：“所以才叫上课呀，上一天，少一课，越上越少嘛！”"]]}]}, {"title": "第二十四章　龙虾方块舞", "head": "c24-h", "audio": "audio/ch24.m4a?v=ec9f188f1d", "duration": 277.964, "times": {"c24-h": [0.0, 2.838], "c24-001": [3.838, 7.946], "c24-002": [8.296, 9.352], "c24-003": [9.702, 12.657], "c24-004": [13.507, 19.173], "c24-005": [19.523, 25.941], "song-lobster-dance": [27.141, 33.141], "song-lobster-dance-01": [33.141, 35.361], "song-lobster-dance-02": [35.361, 37.581], "song-lobster-dance-03": [37.581, 39.681], "song-lobster-dance-04": [39.681, 41.801], "song-lobster-dance-05": [41.841, 43.881], "song-lobster-dance-06": [43.881, 46.101], "song-lobster-dance-07": [54.201, 56.861], "song-lobster-dance-08": [56.861, 58.941], "song-lobster-dance-09": [58.941, 61.121], "song-lobster-dance-10": [61.121, 63.381], "song-lobster-dance-11": [88.261, 91.201], "song-lobster-dance-12": [91.201, 93.001], "song-lobster-dance-13": [93.061, 95.421], "song-lobster-dance-14": [95.421, 97.001], "song-lobster-dance-15": [97.001, 99.721], "song-lobster-dance-16": [99.721, 101.781], "song-lobster-dance-17": [101.781, 103.981], "song-lobster-dance-18": [103.981, 106.201], "c24-006": [112.401, 123.463], "c24-007": [123.813, 127.83], "song-lobster-song": [129.03, 135.03], "song-lobster-song-01": [135.03, 137.21], "song-lobster-song-02": [137.21, 139.29], "song-lobster-song-03": [139.29, 141.41], "song-lobster-song-04": [141.41, 143.45], "song-lobster-song-05": [143.45, 147.35], "song-lobster-song-06": [147.35, 150.47], "song-lobster-song-07": [151.73, 155.41], "song-lobster-song-08": [155.53, 158.77], "c24-008": [164.97, 169.406], "c24-009": [169.756, 180.037], "c24-010": [180.887, 193.014], "c24-011": [193.364, 195.178], "song-beautiful-soup": [196.378, 202.378], "song-beautiful-soup-01": [202.378, 208.358], "song-beautiful-soup-02": [209.518, 215.638], "song-beautiful-soup-03": [215.638, 220.278], "song-beautiful-soup-04": [220.278, 226.978], "song-beautiful-soup-05": [231.998, 236.518], "song-beautiful-soup-06": [237.958, 243.318], "song-beautiful-soup-07": [246.618, 250.318], "song-beautiful-soup-08": [253.258, 257.598], "c24-012": [263.798, 268.191], "c24-013": [269.041, 269.487], "c24-014": [269.837, 276.464]}, "blocks": [{"t": "p", "s": [["c24-001", "假海龟长长地叹了一口气，问：“你大概没在海底住过吧？"], ["c24-002", "也没见过龙虾吧？"], ["c24-003", "那你一定不知道，龙虾方块舞有多好玩！”"]]}, {"t": "img", "src": "images/46.webp?v=c16f3295dd", "vid": "images/46.mp4?v=664b30db84", "cap": "龙虾方块舞", "n": 77}, {"t": "p", "s": [["c24-004", "后来，鹰头狮和假海龟手拉着手，跳起了龙虾方块舞。"], ["c24-005", "他们一边转圈，一边唱着奇奇怪怪的歌，有时候还踩到了爱丽丝的脚趾头。"]]}, {"t": "song", "title": "你来不来跳个舞", "head": "song-lobster-dance", "lines": [["song-lobster-dance-01", "小鱼对蜗牛说"], ["song-lobster-dance-02", "你能不能走快点"], ["song-lobster-dance-03", "海豚跟在我身后"], ["song-lobster-dance-04", "踩着我的尾巴尖"], ["song-lobster-dance-05", "龙虾海龟都来了"], ["song-lobster-dance-06", "沙滩上面站一排"], ["song-lobster-dance-07", "你来不来，你来不来"], ["song-lobster-dance-08", "跟我们跳舞来"], ["song-lobster-dance-09", "你来不来，你来不来"], ["song-lobster-dance-10", "一起跳到海里来"], ["song-lobster-dance-11", "把龙虾扔向大海"], ["song-lobster-dance-12", "扔得远远的"], ["song-lobster-dance-13", "游过去翻个跟头"], ["song-lobster-dance-14", "再游回岸来"], ["song-lobster-dance-15", "你来不来，你来不来"], ["song-lobster-dance-16", "跟我们跳舞来"], ["song-lobster-dance-17", "你来不来，你来不来"], ["song-lobster-dance-18", "一起跳到海里来"]]}, {"t": "img", "src": "images/89.webp?v=6ff7581eda", "vid": "images/89.mp4?v=161b14f518", "cap": "把龙虾使劲儿扔进海里", "n": 78}, {"t": "p", "s": [["c24-006", "假海龟说：“先在海边排成一排，每个人都牵着一只龙虾，往前走两步，交换舞伴，再把龙虾使劲儿往海里扔，扔得越远越好！"], ["c24-007", "然后跟着游过去，在海里翻一个跟头，再游回岸上。”"]]}, {"t": "song", "title": "龙虾方块舞", "head": "song-lobster-song", "lines": [["song-lobster-song-01", "龙虾龙虾手拉手"], ["song-lobster-song-02", "转个圈圈向前走"], ["song-lobster-song-03", "一二三，跳进大海"], ["song-lobster-song-04", "扑通扑通翻跟头"], ["song-lobster-song-05", "你来不来，你来不来"], ["song-lobster-song-06", "跟我们跳个龙虾舞"], ["song-lobster-song-07", "海浪高高，海浪低低"], ["song-lobster-song-08", "跳到月亮出来不停步"]]}, {"t": "p", "s": [["c24-008", "跳完了舞，鹰头狮说：“现在，该你讲讲你的故事了。”"], ["c24-009", "爱丽丝就从早上看见白兔子讲起，讲她怎么掉进兔子洞，怎么变大变小，怎么给毛毛虫背诗，背得全都乱七八糟。"]]}, {"t": "img", "src": "images/90.webp?v=335d0f82f5", "vid": "images/90.mp4?v=2ab6e4e5e3", "cap": "假海龟唱起《美味的汤》", "n": 79}, {"t": "p", "s": [["c24-010", "假海龟听完，深深地叹了口气，用哽咽的声音唱起了一首《美味的汤》：“美味的汤，绿绿的汤，热腾腾地盛在大碗里，谁不想尝一尝？"], ["c24-011", "晚上的汤，美味的汤！”"]]}, {"t": "song", "title": "美味的汤", "head": "song-beautiful-soup", "lines": [["song-beautiful-soup-01", "美味的汤，绿绿的汤"], ["song-beautiful-soup-02", "热腾腾地盛在大碗里"], ["song-beautiful-soup-03", "谁不想尝一尝"], ["song-beautiful-soup-04", "晚上的汤，美味的汤"], ["song-beautiful-soup-05", "美——味的汤"], ["song-beautiful-soup-06", "美——味的汤"], ["song-beautiful-soup-07", "晚——上的汤"], ["song-beautiful-soup-08", "美味，美味的汤"]]}, {"t": "p", "s": [["c24-012", "就在这时，远处传来一声大喊：“审判开始啦！”"]]}, {"t": "p", "s": [["c24-013", "“快走！”"], ["c24-014", "鹰头狮拉起爱丽丝的手就跑，假海龟悲伤的歌声，在海风里越飘越远。"]]}]}, {"title": "第二十五章　谁偷了馅饼", "head": "c25-h", "audio": "audio/ch25.m4a?v=c4355778cc", "duration": 144.763, "times": {"c25-h": [0.0, 3.317], "c25-001": [4.317, 9.3], "c25-002": [9.65, 14.766], "c25-003": [15.616, 20.312], "c25-004": [20.662, 27.799], "c25-005": [28.649, 30.293], "c25-006": [30.643, 32.67], "c25-007": [33.02, 38.515], "c25-008": [39.365, 45.798], "c25-009": [46.148, 51.647], "c25-010": [51.997, 57.264], "c25-011": [58.114, 72.024], "c25-012": [76.622, 80.311], "c25-013": [80.661, 86.47], "c25-014": [87.32, 88.578], "c25-015": [88.928, 89.726], "c25-016": [90.076, 95.633], "c25-017": [96.483, 101.49], "c25-018": [102.34, 108.093], "c25-019": [108.443, 112.799], "c25-020": [113.649, 125.058], "c25-021": [125.408, 127.2], "c25-022": [127.55, 131.981], "c25-023": [132.831, 138.576], "c25-024": [138.926, 143.263]}, "blocks": [{"t": "img", "src": "images/47.webp?v=e776b23e64", "vid": "images/47.mp4?v=a92d759ff5", "cap": "热闹的法庭", "n": 80}, {"t": "p", "s": [["c25-001", "国王和王后坐在宝座上，法庭里挤满了动物和扑克牌。"], ["c25-002", "大厅中间的桌子上，放着一大盘馅饼，看起来香极了。"]]}, {"t": "img", "src": "images/48.webp?v=592e0c7a82", "vid": "images/48.mp4?v=0295c52396", "cap": "红心杰克被指控偷了馅饼", "n": 81}, {"t": "img", "src": "images/49.webp?v=0e392232dc", "vid": "images/49.mp4?v=fed7c971cb", "cap": "陪审席上的小动物", "n": 82}, {"t": "p", "s": [["c25-003", "原来，红心杰克被指控偷了王后做的馅饼。"], ["c25-004", "国王戴着王冠当法官，十二只小动物坐在陪审席上，拿着石板认真地记录。"]]}, {"t": "p", "s": [["c25-005", "“他们在写什么呀？”"], ["c25-006", "爱丽丝小声问鹰头狮。"], ["c25-007", "鹰头狮说：“他们在写自己的名字，怕审判还没完，就把自己的名字忘了。”"]]}, {"t": "img", "src": "images/91.webp?v=b062d90675", "vid": "images/91.mp4?v=fe527bb74e", "cap": "比尔的石笔吱吱响，爱丽丝把它拿走了", "n": 83}, {"t": "p", "s": [["c25-008", "陪审员里有一只就是小蜥蜴比尔，它的石笔写起字来吱吱地响。"], ["c25-009", "爱丽丝实在受不了，悄悄地绕到它背后，把石笔拿走了。"], ["c25-010", "可怜的比尔找不到笔，只好用一根手指头在石板上写。"]]}, {"t": "img", "src": "images/50.webp?v=0ea517e377", "vid": "images/50.mp4?v=bf4db2445d", "cap": "白兔子吹喇叭", "n": 84}, {"t": "p", "s": [["c25-011", "白兔子吹了三声喇叭，打开一卷长长的羊皮纸，大声念道：“红心王后做了馅饼，在一个夏天的日子里；红心杰克偷了馅饼，全部都拿走了！”"]]}, {"t": "img", "src": "images/51.webp?v=446780bf1a", "vid": "images/51.mp4?v=4d31cca5d1", "cap": "疯帽子紧张得咬了茶杯", "n": 85}, {"t": "p", "s": [["c25-012", "接着，国王叫来了第一个证人：疯帽子。"], ["c25-013", "他一手拿着茶杯，一手拿着黄油面包，紧张得把茶杯咬掉了一大块。"]]}, {"t": "p", "s": [["c25-014", "“把你的帽子摘下来。”"], ["c25-015", "国王说。"], ["c25-016", "疯帽子说：“这不是我的帽子，我是做帽子的，这些帽子都是卖的。”"]]}, {"t": "p", "s": [["c25-017", "这时候，爱丽丝觉得自己的身子，又在慢慢地长大了。"]]}, {"t": "img", "src": "images/92.webp?v=93c1607588", "vid": "images/92.mp4?v=c10116d336", "cap": "睡鼠被越长越大的爱丽丝挤得喘不过气", "n": 86}, {"t": "p", "s": [["c25-018", "坐在她旁边的睡鼠被挤得喘不过气来，抱怨说：“你没有权利在这儿长大！”"], ["c25-019", "爱丽丝说：“别胡说，你自己不也在长大吗？”"]]}, {"t": "p", "s": [["c25-020", "国王问疯帽子问题，疯帽子越答越糊涂，一会儿说茶，一会儿说黄油面包，还说三月兔说了什么，三月兔又说他什么也没说。"], ["c25-021", "国王说：“你可以下去了。”"], ["c25-022", "疯帽子连鞋都没穿好，就一溜烟跑出了法庭。"]]}, {"t": "p", "s": [["c25-023", "第二个证人是公爵夫人的厨娘，她一说话，大家就都打喷嚏。"], ["c25-024", "第三个证人，白兔子大声喊道：“爱丽丝！”"]]}]}, {"title": "第二十六章　爱丽丝的证词", "head": "c26-h", "audio": "audio/ch26.m4a?v=9545ec891e", "duration": 119.295, "times": {"c26-h": [0.0, 3.132], "c26-001": [4.132, 4.76], "c26-002": [5.11, 6.61], "c26-003": [6.96, 14.032], "c26-004": [14.882, 16.575], "c26-005": [16.925, 21.793], "c26-006": [22.143, 31.126], "c26-007": [31.976, 33.173], "c26-008": [33.523, 34.318], "c26-009": [35.168, 36.5], "c26-010": [36.85, 37.891], "c26-011": [38.741, 46.886], "c26-012": [47.736, 49.386], "c26-013": [49.736, 50.778], "c26-014": [51.628, 52.213], "c26-015": [52.563, 53.526], "c26-016": [53.876, 55.368], "c26-017": [55.718, 56.59], "c26-018": [57.44, 59.753], "c26-019": [60.103, 61.144], "c26-020": [61.994, 70.556], "c26-021": [70.906, 77.411], "c26-022": [78.261, 79.808], "c26-023": [80.158, 82.078], "c26-024": [82.928, 85.85], "c26-025": [86.2, 88.567], "c26-026": [89.417, 93.279], "c26-027": [93.629, 94.881], "c26-028": [95.731, 96.613], "c26-029": [96.963, 98.442], "c26-030": [98.792, 103.928], "c26-031": [104.278, 106.422], "c26-032": [107.272, 112.998], "c26-033": [114.831, 117.795]}, "blocks": [{"t": "img", "src": "images/52.webp?v=2fe0dcb86c", "vid": "images/52.mp4?v=9a211b707a", "cap": "她一下子把陪审席碰翻了", "n": 87}, {"t": "p", "s": [["c26-001", "“到！”"], ["c26-002", "爱丽丝站了起来。"], ["c26-003", "可是她已经长得很大很大了，一下子把陪审席都碰翻了，小动物们滚了一地。"]]}, {"t": "img", "src": "images/93.webp?v=042ed97e5c", "vid": "images/93.mp4?v=874f988925", "cap": "比尔被头朝下插进了陪审席", "n": 88}, {"t": "p", "s": [["c26-004", "“哎呀，真对不起！”"], ["c26-005", "爱丽丝连忙把小动物们一个一个捡起来，放回陪审席上。"], ["c26-006", "她慌慌张张的，把小蜥蜴比尔头朝下插了进去，可怜的比尔只能摇着尾巴，动也动不了。"]]}, {"t": "p", "s": [["c26-007", "“你知道这件事吗？”"], ["c26-008", "国王问。"]]}, {"t": "p", "s": [["c26-009", "“一点儿也不知道。”"], ["c26-010", "爱丽丝说。"]]}, {"t": "img", "src": "images/94.webp?v=ef15156b09", "vid": "images/94.mp4?v=8540a324e0", "cap": "第四十二条：身高超过一英里的人必须离开", "n": 89}, {"t": "p", "s": [["c26-011", "国王翻开他的本子，大声念道：“第四十二条：身高超过一英里的人，必须离开法庭。”"]]}, {"t": "p", "s": [["c26-012", "“我可没有一英里高。”"], ["c26-013", "爱丽丝说。"]]}, {"t": "p", "s": [["c26-014", "“你有。”"], ["c26-015", "国王说。"], ["c26-016", "“快两英里高了。”"], ["c26-017", "王后说。"]]}, {"t": "p", "s": [["c26-018", "“这一条是你刚刚编出来的！”"], ["c26-019", "爱丽丝说。"]]}, {"t": "img", "src": "images/95.webp?v=5b284908ce", "vid": "images/95.mp4?v=b14be45462", "cap": "白兔子找到了一封没有署名的信", "n": 90}, {"t": "p", "s": [["c26-020", "这时，白兔子急急忙忙地跳起来：“陛下，又找到了一张纸，是一封信，上面写着一首诗！”"], ["c26-021", "可是，那首诗写得糊里糊涂的，谁也看不懂，信上连名字都没有签。"]]}, {"t": "p", "s": [["c26-022", "“这正好证明他有罪！”"], ["c26-023", "国王高兴地拍着手说。"]]}, {"t": "p", "s": [["c26-024", "爱丽丝说：“它什么也证明不了！"], ["c26-025", "你们连诗里写的是什么都不知道！”"]]}, {"t": "p", "s": [["c26-026", "王后又大喊起来：“先判刑，后定罪！"], ["c26-027", "砍掉她的头！”"]]}, {"t": "img", "src": "images/53.webp?v=66ecb1b209", "vid": "images/53.mp4?v=0fb168473b", "cap": "你们不过是一副纸牌！", "n": 91}, {"t": "p", "s": [["c26-028", "“胡说八道！”"], ["c26-029", "爱丽丝大声说。"], ["c26-030", "她已经长回了原来的高矮，一点儿也不害怕了，“谁怕你们？"], ["c26-031", "你们不过是一副纸牌！”"]]}, {"t": "img", "src": "images/54.webp?v=f073bcf697", "vid": "images/54.mp4?v=761bf3402f", "cap": "整副纸牌都飞上了天", "n": 92}, {"t": "p", "s": [["c26-032", "话音刚落，整副纸牌都飞上了天，又纷纷朝她落了下来。"], ["c26-033", "爱丽丝轻轻叫了一声，伸手去挡。"]]}]}, {"title": "第二十七章　原来是一场梦", "head": "c27-h", "audio": "audio/ch27.m4a?v=947a8052a5", "duration": 235.157, "times": {"c27-h": [0.0, 3.186], "c27-001": [4.186, 10.588], "c27-002": [10.938, 16.326], "c27-003": [17.176, 21.709], "c27-004": [22.559, 25.216], "c27-005": [25.566, 26.608], "c27-006": [26.958, 39.668], "c27-007": [40.518, 43.654], "c27-008": [44.004, 48.759], "c27-009": [49.609, 52.992], "c27-010": [53.342, 56.848], "c27-011": [57.698, 76.321], "c27-012": [77.171, 87.836], "c27-013": [88.686, 95.139], "c27-014": [95.989, 97.027], "song-wonderland-heart": [98.227, 104.227], "song-wonderland-heart-01": [104.227, 110.087], "song-wonderland-heart-02": [110.087, 115.847], "song-wonderland-heart-03": [116.687, 121.967], "song-wonderland-heart-04": [122.687, 128.167], "song-wonderland-heart-05": [128.167, 134.147], "song-wonderland-heart-06": [134.147, 139.967], "song-wonderland-heart-07": [139.967, 145.607], "song-wonderland-heart-08": [146.687, 150.687], "song-wonderland-heart-09": [158.447, 163.947], "song-wonderland-heart-10": [164.087, 169.887], "song-wonderland-heart-11": [169.887, 176.747], "song-wonderland-heart-12": [176.747, 180.227], "song-wonderland-heart-13": [182.787, 187.787], "song-wonderland-heart-14": [188.407, 192.287], "song-wonderland-heart-15": [195.727, 200.867], "song-wonderland-heart-16": [206.647, 212.027], "song-wonderland-heart-17": [212.027, 217.767], "song-wonderland-heart-18": [218.367, 223.687], "song-wonderland-heart-19": [224.347, 228.307]}, "blocks": [{"t": "img", "src": "images/55.webp?v=cae23074b0", "vid": "images/55.mp4?v=31f9dcb701", "cap": "原来是一场梦", "n": 93}, {"t": "p", "s": [["c27-001", "爱丽丝睁开眼睛，发现自己躺在河边的大树下，头靠在姐姐的腿上。"], ["c27-002", "姐姐正轻轻地帮她拂去从树上飘落到她脸上的几片树叶。"]]}, {"t": "p", "s": [["c27-003", "姐姐说：“醒醒，亲爱的爱丽丝，你睡得可真久呀！”"]]}, {"t": "img", "src": "images/56.webp?v=f7b941f8b5", "vid": "images/56.mp4?v=714b939d44", "cap": "她把奇遇都讲给姐姐听", "n": 94}, {"t": "p", "s": [["c27-004", "“哎呀，我做了一个好奇怪的梦！”"], ["c27-005", "爱丽丝说。"], ["c27-006", "她把自己记得的奇遇，都讲给姐姐听：白兔子、眼泪池、毛毛虫、柴郡猫、疯狂的茶会，还有那位总是大喊大叫的红心王后。"]]}, {"t": "p", "s": [["c27-007", "姐姐笑着听完，让她快回家喝茶。"], ["c27-008", "爱丽丝一边跑，一边想，这真是一个多么奇妙的梦呀！"]]}, {"t": "img", "src": "images/57.webp?v=5e73b8355e", "vid": "images/57.mp4?v=d798169cb5", "cap": "夕阳下，姐姐想着爱丽丝的奇遇", "n": 95}, {"t": "p", "s": [["c27-009", "姐姐坐在夕阳下，想着爱丽丝的奇遇。"], ["c27-010", "她闭上眼睛，好像自己也走进了奇境。"]]}, {"t": "img", "src": "images/96.webp?v=d4f68eb53e", "vid": "images/96.mp4?v=04c51d7f9c", "cap": "风吹过草地，姐姐好像也走进了奇境", "n": 96}, {"t": "p", "s": [["c27-011", "风吹过高高的草，她好像听见白兔子匆匆跑过；池塘里的水哗哗响，好像是老鼠在泪水池里扑腾；远处羊群的铃铛叮当响，好像是疯帽子他们在碰茶杯；牧童的吆喝声，好像是王后又在大喊“砍掉他的头”。"]]}, {"t": "p", "s": [["c27-012", "可是她知道，只要一睁开眼睛，这一切又会变回平常的样子：草还是草，池塘还是池塘，铃铛还是羊群的铃铛。"]]}, {"t": "p", "s": [["c27-013", "她想，等爱丽丝长大了，也一定会把这些奇妙的故事，讲给别的小朋友听。"]]}, {"t": "p", "s": [["c27-014", "（完）"]]}, {"t": "song", "title": "奇境就在我心里", "head": "song-wonderland-heart", "lines": [["song-wonderland-heart-01", "夏天的午后，河边的大树"], ["song-wonderland-heart-02", "白兔子跑过，带着怀表"], ["song-wonderland-heart-03", "跟着它跳进，深深的洞"], ["song-wonderland-heart-04", "小门后面，是美丽的花园"], ["song-wonderland-heart-05", "变大又变小，眼泪变成池塘"], ["song-wonderland-heart-06", "毛毛虫问我，你是谁"], ["song-wonderland-heart-07", "柴郡猫笑着，慢慢不见"], ["song-wonderland-heart-08", "茶会永远，停在六点"], ["song-wonderland-heart-09", "奇境奇境，你在哪里"], ["song-wonderland-heart-10", "在草丛里，在池塘里"], ["song-wonderland-heart-11", "铃铛叮当，茶杯碰碰"], ["song-wonderland-heart-12", "奇境就在我心里"], ["song-wonderland-heart-13", "等我长大了"], ["song-wonderland-heart-14", "我也要讲"], ["song-wonderland-heart-15", "讲给别的小朋友听"], ["song-wonderland-heart-16", "奇境奇境，你在哪里"], ["song-wonderland-heart-17", "在草丛里，在池塘里"], ["song-wonderland-heart-18", "铃铛叮当，茶杯碰碰"], ["song-wonderland-heart-19", "奇境就在我心里"]]}, {"t": "note", "text": "读完以后，可以和孩子聊一聊：爱丽丝一会儿变大，一会儿变小，如果是你，你想变成多大？奇境里你最喜欢哪个奇怪的朋友？疯帽子的谜语“乌鸦为什么像写字台”，你能想出一个答案吗？"}]}], "music": 3, "images": [{"from": "c01-h", "src": "images/01.webp?v=6a4b4cd33b", "vid": "images/01.mp4?v=28cf4c8c02", "cap": "河边大树下的夏日午后", "n": 1}, {"from": "c01-010", "src": "images/02.webp?v=a1be6d62c0", "vid": "images/02.mp4?v=2bbdd3d72f", "cap": "拿着怀表的白兔子", "n": 2}, {"from": "c01-013", "src": "images/03.webp?v=a7210c9aec", "vid": "images/03.mp4?v=4acd14c715", "cap": "白兔子钻进了兔子洞", "n": 3}, {"from": "c02-003", "src": "images/04.webp?v=c0c4d68191", "vid": "images/04.mp4?v=548fb73d5a", "cap": "掉进一口很深很深的井", "n": 4}, {"from": "c02-005", "src": "images/58.webp?v=954dad614e", "vid": "images/58.mp4?v=797400bbbb", "cap": "一边往下落，一边拿下一罐橘子酱", "n": 5}, {"from": "c02-011", "src": "images/59.webp?v=2091e09d25", "vid": "images/59.mp4?v=ec0ebb2478", "cap": "她想起家里的小猫黛娜和蝙蝠", "n": 6}, {"from": "c03-002", "src": "images/60.webp?v=2dbb469b10", "vid": "images/60.mp4?v=c7f8818b70", "cap": "白兔子沿着长长的走廊飞跑", "n": 7}, {"from": "c03-005", "src": "images/05.webp?v=79d9a98b9d", "vid": "images/05.mp4?v=6dd0c6fafa", "cap": "四周全是门的大厅", "n": 8}, {"from": "c03-008", "src": "images/06.webp?v=2be4349614", "vid": "images/06.mp4?v=51d6027f5b", "cap": "小门外是最美丽的花园", "n": 9}, {"from": "c03-011", "src": "images/07.webp?v=35a499349a", "vid": "images/07.mp4?v=7bab66d7a1", "cap": "瓶子上写着“喝我”", "n": 10}, {"from": "c03-018", "src": "images/08.webp?v=c1fc8d77b4", "vid": "images/08.mp4?v=2c11280a3b", "cap": "她变得只有十寸高", "n": 11}, {"from": "c04-001", "src": "images/61.webp?v=0e486d6b24", "vid": "images/61.mp4?v=5a7a694f64", "cap": "变小的爱丽丝爬不上滑溜溜的桌子腿", "n": 12}, {"from": "c04-006", "src": "images/09.webp?v=f9dbd8fbc3", "vid": "images/09.mp4?v=55b2bb7f6c", "cap": "她的身子拉得老长老长", "n": 13}, {"from": "c04-010", "src": "images/62.webp?v=564356f7b4", "vid": "images/62.mp4?v=ad794bb99d", "cap": "“再见啦，我的脚！”", "n": 14},
